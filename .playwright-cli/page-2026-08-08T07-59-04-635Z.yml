                    - listitem [ref=f3e127]: 按直播状态：固定优先级，直播中 > 预告 > 回放 > 已结束，无需配置。
                    - listitem [ref=f3e128]: 按观看人数：按数值大小排序，降序=人数多的在前，升序=人数少的在前。
                  - paragraph [ref=f3e129]: 叠加排序示例：若顺序为「①按项目 → ②按直播状态 → ③按观看人数」，则先按项目分组（选中项目在前），同项目内再按状态排序（直播中优先），同状态内再按观看人数降序。
