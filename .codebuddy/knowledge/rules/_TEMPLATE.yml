# ============================================
# 业务规则知识库 — 跨项目复用的业务规则
# 版本：v1.0.0
# 最后更新：2026-07-16
# ============================================
#
# 定位：从领域知识中提炼的可复用业务规则。
# 产出者：BA 业务分析师（/learn-domain Step9 提炼）
# 消费者：BA 需求分析 + FD 开发 + QA 测试
# 存储位置：.codebuddy/knowledge/rules/{domain-name}-rules.yml
#
# 规则来源：
#   - operation_matrix 中的约束（如"某状态不可操作"）
#   - solution.best_practices 中的业务实践
#   - flow.exceptions 中的异常处理规则
# ============================================

# 文件名：{domain-name}-rules.yml
# 示例：refund-rules.yml

rules:
  - id: "BR-DOMAIN-{DOMAIN}-{NNN}"     # 规则编号
    domain: ""                          # 领域名称（如"退款流"）
    rule: ""                            # 规则描述（自然语言）
    type: "hard"                        # hard=强制 / soft=建议
    trigger: ""                         # 触发条件（如"退款创建时"）
    condition: ""                       # 约束条件（如"退款金额 ≤ 订单实付金额"）
    action: ""                          # 触发动作（如"拒绝退款申请"）
    source: ""                          # 来源（领域知识 + 网页链接）
    source_url: ""                      # 源网页链接
    projects_used: []                   # 哪些项目使用了此规则
    version: "v1.0.0"                   # 规则版本
    created_at: ""                      # 创建日期

# ============================================
# 索引文件：RULES-INDEX.yml
# ============================================
# 记录所有业务规则的注册表，BA 需求分析时按领域查找相关规则。
