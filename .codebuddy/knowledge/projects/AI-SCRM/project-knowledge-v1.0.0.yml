# =============================================================================
# Part 1: 项目全景概述
# =============================================================================
project_overview:
  elevator_pitch: >
    AI-SCRM是一个SAAS商业模式的智能SCRM平台，由运营后台(SY-OPS)和租户后台(SY-TENANT)
    双系统组成。租户按版本订阅，可拓展AI能力/坐席/企微/呼叫等资源。系统以"AI大脑"
    为核心中枢，通过企微和呼叫中心两大客户触点，实现从客户触达→智能服务→交易转化→
    CRM跟进的全链路闭环。

  business_model:
    type: "SAAS多租户"
    revenue_model: "版本订阅费 + 资源增购费 + AI能力按量计费"
    tenant_lifecycle: "PENDING→TRIAL(7天)→ACTIVE→GRACE(7天宽限)→SUSPENDED→RETAINED→CLOSED"
    version_tiers: ["体验版(Free/7天)", "基础版(¥99/月)", "专业版(¥199/月)", "企业版(¥399/月)"]
    resource_types: ["坐席", "员工", "企微主体", "AI Agent", "AI会话", "存储", "知识库", "电话线路"]

  dual_system:
    SY-OPS:
      name: "运营后台"
      users: ["平台管理员", "CSM客户成功经理", "平台财务"]
      capabilities: ["租户注册管理", "版本套餐发布", "资源包管理", "SAAS营收看板", "退款审批", "系统配置"]
      routes: 23
    SY-TENANT:
      name: "租户后台"
      users: ["租户管理员", "客服主管", "销售经理", "销售坐席", "运营专员"]
      capabilities: ["工作台", "订阅市场", "CDP", "企微社群", "呼叫中心", "CRM", "AI大脑", "订单", "数据分析", "组织权限"]
      routes: 105
      pages: 120

# =============================================================================
# Part 2: 业务场景全景图（15大主场景 × 60+子场景）
# =============================================================================
business_scenes:

  - scene_id: SC-SAAS-001
    scene_name: "租户全生命周期管理"
    scene_type: "商业闭环"
    actor: "OPS管理员/租户管理员/系统"
    enterprise_value: "SAAS商业模式的根基，管控租户从注册到退出的全流程"
    sub_scenes:
      - { sub_id: "S01", name: "租户注册与审批", flow: "OPS创建→PENDING→审核→REGISTER→TRIAL", status: "✅" }
      - { sub_id: "S02", name: "体验版自动激活", flow: "绑trial plan→trial_end_at=now+7天→可用基础功能", status: "✅" }
      - { sub_id: "S03", name: "订阅市场选版支付", flow: "marketplace→版本对比→配置→订单→支付→TRIAL→ACTIVE", status: "✅" }
      - { sub_id: "S04", name: "到期提醒与自动流转", flow: "到期前N天提醒→TRIAL→GRACE→SUSPENDED→停服", status: "✅" }
      - { sub_id: "S05", name: "续费恢复服务", flow: "SUSPENDED→续费→RENEW→ACTIVE→功能恢复", status: "✅" }
      - { sub_id: "S06", name: "资源增购", flow: "购买资源包→配额增加→用量监控联动", status: "✅" }
      - { sub_id: "S07", name: "版本升级/降级", flow: "更换版本→差价计算→支付→配额更新", status: "✅" }
      - { sub_id: "S08", name: "退款与三阶梯", flow: "72h全额→阶梯退款(83.3%/55.4%/15%)→审批→终止", status: "✅" }

  - scene_id: SC-CALL-001
    scene_name: "呼叫中心四层通路全链路"
    scene_type: "业务运营"
    actor: "管理员/主管/坐席/运营"
    enterprise_value: "电话沟通引擎，支撑客户触达/服务跟进/营销外呼三场景"
    architecture: "资源配置层→外呼运营层→服务执行层→数据复盘层（四层闭环）"
    sub_scenes:
      - { sub_id: "S01", name: "首次资源配置", flow: "呼叫地图→线路购买→坐席分配→分机绑定→黑名单导入", status: "⚠️ 分机/黑名单占位" }
      - { sub_id: "S02", name: "创建外呼任务", flow: "名单来源→黑名单过滤→指定坐席→创建任务", status: "✅" }
      - { sub_id: "S03", name: "执行外呼FIFO", flow: "系统拨号→线路占用→通话→标记结果→释放→下一通", status: "⚠️ 存在断链" }
      - { sub_id: "S04", name: "线路排队与冲突", flow: "多坐席并发→占满→排队→FIFO出队→自动接通", status: "⚠️ UI排队进度缺失" }
      - { sub_id: "S05", name: "通话记录查询", flow: "多维筛选→列表→详情→关联客户", status: "✅" }
      - { sub_id: "S06", name: "通话详情与跟进", flow: "详情页→录音→客户信息→跟进记录→创建订单→短信", status: "⚠️ 录音/跟进NOP" }
      - { sub_id: "S07", name: "坐席实时监控", flow: "实时状态→刷新→强制下线", status: "✅" }
      - { sub_id: "S08", name: "数据复盘", flow: "用量→坐席统计→通话分析→优化反馈", status: "✅" }

  - scene_id: SC-AI-001
    scene_name: "AI大脑中枢运转全流程"
    scene_type: "智能能力（核心差异化）"
    actor: "系统/坐席/主管"
    enterprise_value: "产品差异化核心——从被动工具到主动智能助手"
    architecture: "中枢(IntentRouter+Orchestrator)+6子脑+三级行动层(自动/半自动/手动)"
    sub_scenes:
      - { sub_id: "S01", name: "意图识别与路由", flow: "客户消息→IntentRouter识别6类意图→置信度→路由子脑", status: "✅ 关键词规则引擎" }
      - { sub_id: "S02", name: "AI客服RAG应答", flow: "咨询→意图→知识库RAG→引用→生成应答→转人工", status: "✅" }
      - { sub_id: "S03", name: "对话摘要自动生成", flow: "聊天/通话结束→总结脑→摘要+决策点+情绪+待办", status: "⚠️ Service设计完成" }
      - { sub_id: "S04", name: "客户画像智能聚合", flow: "画像脑读CDP→标签→意向评分→全景视图", status: "✅" }
      - { sub_id: "S05", name: "SOP→待办自动生成", flow: "Orchestrator匹配SOP→待办→优先级→待办中心", status: "⚠️ Service设计完成" }
      - { sub_id: "S06", name: "情绪识别与预警", flow: "实时情绪分析→曲线→负面告警→主管介入", status: "✅" }
      - { sub_id: "S07", name: "质检中心", flow: "会话存档→自动质检→评分→报告", status: "✅" }
      - { sub_id: "S08", name: "话术推荐", flow: "实时转写→匹配话术库→推荐弹窗→采纳/忽略", status: "✅" }
      - { sub_id: "S09", name: "流失预警", flow: "行为分析→流失信号→预警→挽回SOP", status: "✅" }
      - { sub_id: "S10", name: "NBA智能推荐", flow: "画像+行为→策略引擎→商品推荐→触达编排", status: "✅" }
      - { sub_id: "S11", name: "Agent工作台", flow: "任务队列+实时日志+手动触发+重试/取消", status: "✅" }
      - { sub_id: "S12", name: "AI大脑仪表盘", flow: "运行概览+意图分布+命中率+子脑状态", status: "✅ 28KB核心页" }

  - scene_id: SC-WECOM-001
    scene_name: "企微私域运营全链路"
    scene_type: "客户触达"
    actor: "运营人员/客服"
    enterprise_value: "企微作为SCRM核心触点，承载客户沟通、社群运营、自动化营销"
    sub_scenes:
      - { sub_id: "S01", name: "活码管理", flow: "创建活码→分流规则→扫码→分配员工→统计", status: "✅" }
      - { sub_id: "S02", name: "单聊/群聊会话", flow: "客户列表→单聊/群聊窗口→消息→画像→话术", status: "✅" }
      - { sub_id: "S03", name: "SOP自动化引擎", flow: "创建规则(触发+条件+动作)→启用→执行→日志→统计", status: "✅" }
      - { sub_id: "S04", name: "群发任务", flow: "选择目标→编辑内容→定时/立即→结果追踪", status: "✅" }
      - { sub_id: "S05", name: "防骚扰与欢迎语", flow: "防骚扰规则→自动拦截+欢迎语配置", status: "✅" }
      - { sub_id: "S06", name: "社群运营地图", flow: "总览→数据看板→活跃度→增长→转化漏斗", status: "✅" }

  - scene_id: SC-CRM-001
    scene_name: "客户跟进与转化管理"
    scene_type: "业务运营"
    actor: "销售坐席/经理"
    sub_scenes:
      - { sub_id: "S01", name: "线索管理", flow: "线索录入→分配→跟进→转化→客户创建", status: "✅" }
      - { sub_id: "S02", name: "客户跟进", flow: "客户列表→360视图→跟进记录→下次跟进→待办", status: "✅" }
      - { sub_id: "S03", name: "销售漏斗", flow: "商机→阶段推进→预估→概率→分析", status: "✅" }
      - { sub_id: "S04", name: "待办提醒", flow: "今日/本周/已逾期/已完成→优先级→处理→完成", status: "✅ 18KB页面" }

  - scene_id: SC-CDP-001
    scene_name: "客户数据整合与洞察"
    scene_type: "数据能力"
    sub_scenes:
      - { sub_id: "S01", name: "客户360视图", flow: "详情→标签→历史→订单→通话→企微→AI画像", status: "✅" }
      - { sub_id: "S02", name: "标签管理", flow: "创建→分组→打标→分析→分群", status: "✅" }
      - { sub_id: "S03", name: "公海管理", flow: "规则→落入→认领/分配", status: "✅" }
      - { sub_id: "S04", name: "疑似重复", flow: "检测→列表→合并→去重", status: "✅" }

  - scene_id: SC-ORDER-001
    scene_name: "订单履约与客户交易"
    scene_type: "业务运营"
    sub_scenes:
      - { sub_id: "S01", name: "订单创建管理", flow: "创建→审核→收款→发货→完成", status: "✅" }
      - { sub_id: "S02", name: "交易转化看板", flow: "档案→订单→收款→漏斗→流水", status: "✅" }

  - scene_id: SC-AUTH-001
    scene_name: "组织架构与权限管理"
    scene_type: "基础能力"
    sub_scenes:
      - { sub_id: "S01", name: "部门/用户/角色", flow: "部门→用户→角色→权限→操作日志", status: "✅" }

  # === 未来核心场景（用户需求中的目标状态） ===
