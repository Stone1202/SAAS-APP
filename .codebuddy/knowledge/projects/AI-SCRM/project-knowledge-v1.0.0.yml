# =============================================================================
# Part 6: Coze + 火山 集成架构对标
# =============================================================================
target_architecture:

  ai_main_entrance:
    description: >
      「AI总入口」在聊天/通话四个关键节点(过程中/结束时)自动触发AI大脑。
      当前无独立入口页面，能力分散在多个页面/Service中。
    target_flow:
      chat_process: "企微聊天中→实时流→Coze Agent→意图→情绪→话术→商品→待办生成"
      chat_end: "聊天结束→触发总结脑→摘要→质检→待办→客户阶段→待办中心"
      call_process: "通话中→火山ASR→Coze Agent→情绪→话术→实时弹屏"
      call_end: "通话结束→火山ASR全文→Coze→摘要→质检→待办→跟进日历"

  coze_integration:
    role: "AI Agent组织大脑+子Agent编排"
    replacement_map:
      - { current: "IntentRouter(关键词规则)", target: "Coze主Agent(LLM意图理解+路由)" }
      - { current: "summarizer.ts", target: "Coze总结子Agent" }
      - { current: "洞察脑", target: "Coze洞察子Agent(意图+标签+质检)" }
      - { current: "profiler.ts", target: "Coze画像子Agent" }
      - { current: "planner.ts", target: "Coze规划子Agent(SOP→待办→排程)" }
      - { current: "知识脑(前端CRUD)", target: "Coze知识库+火山知识库(双知识库)" }
      - { current: "报表脑", target: "Coze报表子Agent" }
      - { current: "todoEngine.ts", target: "Coze待办管理Agent" }

  volcano_integration:
    role: "智能呼叫引擎+知识库向量检索"
    capabilities:
      - { name: "ASR实时转写", current: "模拟通话(硬编码)", target: "火山流式ASR" }
      - { name: "TTS语音合成", current: "无", target: "火山TTS" }
      - { name: "智能呼叫", current: "FIFO模拟线路占用", target: "火山预测式外呼+自动外呼" }
      - { name: "知识库向量检索", current: "前端FAQ匹配", target: "火山知识库语义检索" }

