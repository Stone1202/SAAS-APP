# =============================================================================
# Part 3: 业务模块全景地图（13大模块）
# =============================================================================
business_modules:

  - module_id: MD-SAAS
    module_name: "SAAS订阅与商业化"
    system: "SY-OPS + SY-TENANT"
    store: "useSubscriptionSimStore"
    fn_count: 10
    key_pages:
      - { path: "/ops/version-mgmt", name: "版本管理" }
      - { path: "/ops/register", name: "租户注册" }
      - { path: "/tenant/marketplace", name: "订阅市场" }
      - { path: "/tenant/self/subscription", name: "我的订阅" }
      - { path: "/tenant/self/billing", name: "账单管理" }
    state_machine:
      states: ["PENDING", "TRIAL", "ACTIVE", "GRACE", "SUSPENDED", "RETAINED", "CLOSED", "CANCELED"]

  - module_id: MD-CALL
    module_name: "呼叫中心"
    system: "SY-TENANT"
    fn_count: 14
    architecture: "四层通路：资源配置→外呼运营→服务执行→数据复盘"
    key_pages:
      - { path: "/tenant/call/call-map", name: "呼叫地图(总导航)" }
      - { path: "/tenant/call/line-management", name: "线路资源" }
      - { path: "/tenant/call/seats", name: "坐席分配" }
      - { path: "/tenant/call/outbound", name: "外呼任务" }
      - { path: "/tenant/call/outbound/execute/:id", name: "执行外呼" }
      - { path: "/tenant/call/records", name: "通话记录" }
      - { path: "/tenant/call/records/:id", name: "通话详情" }
      - { path: "/tenant/call/agents", name: "坐席状态" }
      - { path: "/tenant/call/call-review", name: "数据复盘" }
    gaps:
      - "FIFO自动拨号衔接断链"
      - "分机管理/黑名单UI占位"
      - "无真实PSTN/SIP对接(Non-Goal)"

  - module_id: MD-AI
    module_name: "AI大脑"
    system: "SY-TENANT"
    fn_count: 14
    architecture: "中枢+6子脑+三级行动层"
    key_pages:
      - { path: "/tenant/ai/brain", name: "AI大脑仪表盘(28KB)" }
