# 审查专家配置（所有领域统一：BA 主导 + Arch 参与）
review_config:
  review_lead: "ba-agent"
  review_participant: "arch-agent"
  thirdparty_skip_matching: true  # V1.3.0新增：--category=thirdparty 时跳过领域匹配预检，直接学习
  review_checklist:
    - { id: 1, name: "内容准确性", owner: "ba-agent" }
    - { id: 2, name: "泳道完整性", owner: "ba-agent" }
    - { id: 3, name: "流程完整性", owner: "ba-agent" }
    - { id: 4, name: "信息流准确性", owner: "ba-agent" }
    - { id: 5, name: "矩阵完整性", owner: "ba-agent" }
    - { id: 6, name: "方案可行性", owner: "arch-agent" }
    - { id: 7, name: "垃圾内容过滤", owner: "ba-agent" }
    - { id: 8, name: "版本一致性", owner: "ba-agent" }

