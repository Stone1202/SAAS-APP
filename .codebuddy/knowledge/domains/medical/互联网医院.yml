    alt_branches: 6         # 过时未支付/超时未接诊/无需购药/线下转诊/急诊升级/处方被驳（v1.2.0新增2个）
    business_rules_count: 16 # BR-YYY-001~016（v1.2.0新增10条）
    business_actions_count: 16  # ACT-YYY-001~016（v1.2.0新增8个）
