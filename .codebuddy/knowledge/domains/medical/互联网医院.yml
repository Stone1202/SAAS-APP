          D -->|号源| F["同步号源配额+锁号"]
          D -->|药品目录| G["HIS编码→平台ID映射"]
          D -->|EMR| H["病历回写HIS确认"]
          E --> I{"冲突检测？"}
          I -->|冲突| J["以HIS为准覆盖·标记日志"]
          I -->|无冲突| K["正常更新"]
      sources: ["HIS系统专家审查"]
      priority: "high"

    - id: "SC-YYY-011"
      name: "慢病管理增强版（长处方+IoT预警）"
      theme_id: "THM-YYY-010"
      description: "面向慢病患者的增强管理：长期处方（最长12周）+ IoT设备数据自动采集 + 指标异常分级预警 + 用药依从性管理 + 社区联动"
      trigger: "患者被确诊慢病并纳入管理计划"
      closure: "持续管理，指标达标或退出计划"
      participant_roles: ["患者", "医生", "系统平台", "IoT设备"]
      depends_on: ["SC-YYY-002"]
      depended_by: []
      flow_sketch: |
        flowchart TD
          A["建立慢病档案"] --> B["设定管理目标+预警阈值"]
          B --> C["开具长期处方（≤12周+复诊节点）"]
          C --> D["IoT设备绑定+数据同步"]
          D --> E["定时采集（血糖/血压/心率/血氧）"]
          E --> F{"指标超出阈值？"}
          F -->|是| G["生成分级预警（L1提醒/L2通知/L3紧急）"]
          F -->|否| H["正常趋势分析"]
          G --> I["推送患者+紧急联系人"]
          I --> J["通知签约医生"]
          J --> K{"24h内响应？"}
          K -->|是| L["医生调整用药/管理方案"]
          K -->|否| M["预警自动升级·人工客服介入"]
          L --> H
          M --> H
          C --> N["用药依从性管理"]
          N --> O["按时服药提醒"]
          O --> P{"漏服？"}
          P -->|是| Q["补服指导推送"]
          P -->|否| R["依从性记录"]
          R --> H
          H --> S{"复诊时间到？"}
          S -->|是| T["自动推送复诊提醒+预约联动+社区协作"]
          T --> A
          S -->|否| E
      sources: ["慢病管理专家审查"]
      priority: "medium"

    - id: "SC-YYY-012"
      name: "多学科会诊（MDT）"
      theme_id: "THM-YYY-009"
      description: "针对复杂病情，主治医生发起多学科会诊，邀请多科室医生协同诊断，生成MDT会诊记录"
      trigger: "主治医生判断需要多学科联合诊断"
      closure: "MDT会诊完成，生成综合诊断结论和治疗方案"
      participant_roles: ["主治医生", "参诊医生（多科室）", "系统平台"]
      depends_on: ["SC-YYY-001"]
      depended_by: []
      flow_sketch: |
        flowchart TD
          A["主治医生发起MDT"] --> B["选择参诊科室/医生+上传病历"]
          B --> C["系统推送会诊通知"]
          C --> D["参诊医生接收"]
          D --> E["协同病历编辑/评论"]
          E --> F{"所有参诊医生提交意见？"}
          F -->|否| G["等待·超时提醒"]
          G --> E
          F -->|是| H["主治医生汇总意见"]
          H --> I["生成MDT会诊记录"]
          I --> J["最终诊断结论+治疗方案"]
          J --> K["推送患者+存档"]
      sources: ["病历管理专家审查"]
      priority: "medium"

    # v1.3.0 新增：处方外流发起全流程（基于86号政策）
    - id: "SC-YYY-013"
      name: "处方外流发起——电子处方经电子处方中心流转至药店"
      theme_id: "THM-YYY-011"
      description: |
        医生完成在线问诊后，开具电子处方并标记外流。经CA电子签章、国密加密、可外流药品目录校验、
        PASS前置审方后，上传至国家医保电子处方中心（分配全局唯一RxID），
        处方中心智能匹配具备双通道资质的定点药店，完成处方从医院到药店的合规流转。
        互联网医院持续追踪处方外部状态直至核销闭环，精麻/双通道药品额外触发监管上报。
      trigger: "医生完成问诊，开具处方并选择处方外流"
      closure: "处方上传至电子处方中心+分配RxID→流转至药店→药店完成核销后回传→全链路闭环归档"
      participant_roles: ["医生", "患者", "电子处方中心(系统)", "系统平台"]
      depends_on: ["SC-YYY-001", "SC-YYY-002"]
      depended_by: []
      flow_sketch: |
        flowchart TD
          subgraph P1["🏥 处方开具"]
            A["医生完成问诊+诊断明确"] --> B["开具处方"]
            B --> C{"药品在可外流目录内？"}
            C -->|否| C1["仅限院内调配/线下渠道<br/>不可外流"]
            C -->|是| D["标记处方外流通道<br/>双通道药品额外标记"]
          end

          subgraph P2["🔐 智能审核与签章"]
            D --> E["PASS系统前置审方<br/>11强制拦截+12风险提醒"]
            E --> F{"触发拦截？"}
            F -->|是| F1["自动驳回+提示修改"]
            F -->|否| G["系统自动加盖CA电子签章<br/>（医生证书+时间戳+机构信息）"]
          end

          subgraph P3["📤 加密上传电子处方中心"]
            G --> H["国密算法加密处方数据"]
            H --> I["调用电子处方中心标准化接口上传"]
            I --> J["电子处方中心分配全局唯一RxID"]
            J --> K["关联本地处方ID与RxID<br/>处方状态→「已上传」"]
          end

          subgraph P4["📡 智能匹配与流转"]
            K --> L["电子处方中心智能匹配<br/>具备双通道资质的定点药店"]
            L --> M["处方加密推送至匹配药店"]
            M --> N["医生端+患者端可视化展示<br/>处方外部流转状态"]
          end

          subgraph P5["✅ 闭环追踪"]
            N --> O["定时轮询处方状态"]
            O --> P{"处方外部状态？"}
            P -->|已过期(超72h/7d)| P1["标记过期+通知患者重新就医"]
            P -->|已拒绝(药店)| P2["记录拒绝原因+可重新流转"]
            P -->|已核销(药店)| Q["接收药店回传<br/>20项核心数据"]
            Q --> R{"处方类型？"}
            R -->|精麻药品/双通道| S["强制上报药监监管平台"]
            R -->|普通处方| T["归档至处方流转记录"]
            S --> T
            T --> U["全链路闭环完成 ✅"]
          end

          style P2 fill:#e8f5e9,stroke:#2e7d32
          style P3 fill:#e3f2fd,stroke:#1565c0
          style P4 fill:#fff3e0,stroke:#e65100
          style P5 fill:#fce4ec,stroke:#c62828
      sources: ["国家医保局〔2024〕86号通知", "国家医保局电子处方中心技术规范", "处方管理办法"]
      priority: "critical"

    # v1.3.0 新增：处方模板管理
    - id: "SC-YYY-014"
      name: "处方模板管理（提高开方效率）"
      theme_id: "THM-YYY-011"
      description: "为慢病、儿科、常见病等高频场景建立处方模板，医生可快速加载模板并调整，减少重复录入，提高开方效率"
      trigger: "医生进入开方界面"
      closure: "基于模板完成处方开具"
      participant_roles: ["医生", "系统平台"]
      depends_on: []
      depended_by: ["SC-YYY-002", "SC-YYY-013"]
      flow_sketch: |
        flowchart TD
          A["进入开方"] --> B{"使用模板？"}
          B -->|是| C["按科室/疾病分类浏览模板"]
          C --> D["选择模板加载处方"]
          D --> E["医生调整剂量/用法"]
          B -->|否| E
          E --> F["提交处方"]
          F --> G["本次处方可保存为新模板（可选）"]
          G --> H["药师审核后模板可复用"]
      sources: ["处方管理专家审查"]
      priority: "medium"

