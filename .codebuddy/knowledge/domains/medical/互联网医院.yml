  # 产品架构（附加）
  # ============================================
  product_architecture:
    layers:
      - name: "用户访问层"
        components: ["患者端APP", "医生端APP", "Web门户网站", "微信小程序", "开放平台API"]
        responsibility: "多终端用户入口，统一鉴权与适配"
      - name: "业务应用层"
        components: ["在线问诊", "电子处方", "药品配送", "预约挂号", "健康档案", "慢病管理"]
        responsibility: "核心医疗业务能力，面向终端用户提供服务"
      - name: "服务支撑层"
        components: ["即时通讯", "视频通话", "在线支付", "处方流转", "AI智能分诊"]
        responsibility: "为业务应用层提供可复用的公共服务能力"
      - name: "数据基础层"
        components: ["患者档案", "电子病历", "处方中心", "医学知识库"]
        responsibility: "数据持久化与管理，支撑上层业务决策"
      - name: "基础设施层"
        components: ["云平台", "信息安全", "合规审计", "运维监控"]
        responsibility: "底层基础设施保障，安全与合规"

  # ============================================
  # 业务架构（6域24能力）
  # ============================================
  business_architecture:
    domains:
      - name: "核心医疗域"
        capabilities: ["在线问诊（图文）", "在线问诊（视频）", "电子处方", "处方审核", "药品配送"]
        description: "互联网医院核心业务流程——从问诊到用药的完整闭环"
      - name: "医疗服务域"
        capabilities: ["预约挂号", "检查预约", "体检预约", "报告查询"]
        description: "线上预约与服务查询，与线下医疗机构对接"
      - name: "健康管理域"
        capabilities: ["慢病管理", "健康档案", "随访管理", "健康评估"]
        description: "面向慢病和健康人群的长期管理服务"
      - name: "运营支撑域"
        capabilities: ["用户管理", "医生管理", "排班管理", "评价管理"]
        description: "平台运营所必需的管理能力"
      - name: "支付结算域"
        capabilities: ["在线支付", "医保结算", "退款管理", "对账管理"]
        description: "问诊费/药费的支付与结算"
      - name: "互联互通域"
        capabilities: ["电子健康卡", "HIS系统对接(HL7 FHIR/WebService)", "LIS/PACS对接", "医保前置机对接", "药监平台对接", "区域平台对接", "检验结果互认", "IoT设备对接"]
        description: "与外部医疗系统/平台的互联互通，HIS深度对接含排班/号源/EMR/药品目录"

    # v1.2.0 新增：第7域
      - name: "病历管理域"
        capabilities: ["电子病历(EMR SOAP)", "病历质控(24h)", "病历归档与封存", "病历共享授权", "MDT多学科会诊", "病历打印导出"]
        description: "电子病历的全生命周期管理——从书写到归档/封存的完整链条"

