# ============================================
# 领域知识：互联网药店
# 版本：v1.2.0（处方外流接收深度细化——基于国家医保局〔2024〕86号政策与2025年全国电子处方中心落地实践）
# 分类：medical（医疗健康）
# 学习方法：传统模式（traditional）
# 来源：互联网药店业务建模文档（HTML）+ 4位医疗领域专家联合盲区审查 + 处方外流最新政策专项深化
# 增量内容：v1.1.0(O2O即时配送支路/门店自提支路/库存预警与自动补货/药品效期管理/电子发票/医保定点/处方外流接收/供应商补货/比价替代/长处方复购)
#   → v1.2.0 处方外流接收全面重构：基于86号文件 ①电子处方中心流转全链路与处方生命周期状态机
#   ②四重验证机制（患者身份+处方有效期72h+药品追溯码+药师审核记录）③四查十对+11类强制拦截+12类风险提醒 ④CA电子签章验签+
#   国密算法传输 ⑤处方唯一码一单一用+5分钟回传20项核心数据 ⑥双通道药品特殊管理 ⑦禁止纸质处方(2025.1.1)
#   ⑧PASS系统前置审方 ⑨操作日志留存≥6个月+处方资料保存15年
# ============================================

domain:
  name: "互联网药店"
  category: "medical"
  version: "v1.2.0"
  learned_at: "2026-07-24"
  learning_method: "traditional"
  source_urls:
    - "file:互联网药店业务建模文档.html"     # v1.0.0原始来源
    - "4位专家联合盲区审查"                 # v1.1.0专家审查增量
    - "国家医保局〔2024〕86号通知+2025年31省电子处方中心落地实践"  # v1.2.0政策深化
  description: |
    互联网药店是基于电商模式的在线药品零售平台，覆盖OTC药品和处方药的在线浏览、下单、
    处方审核、支付、仓储拣货、物流配送（含O2O即时配送+门店自提）、电子发票、医保结算、
    库存预警与自动补货、药品效期管理、比价与替代推荐、处方外流接收（基于国家医保局电子
    处方中心全国31省互联互通）全链路。以商品交易为核心，处方药引入独立的药师审方合规链路
    与处方流转合规体系，冷链药品引入温控监控。
  curation_policy: |
    本知识从互联网药店业务建模文档（UML 2.5规范）+4位专家联合盲区审查+
    国家医保局〔2024〕86号政策深化提取，保留：产品架构（5层）、业务架构（8大域DDD划分）、
    业务泳道（6角色含供应商）、业务流程（6条→7条场景分支）、信息流（18节点→20节点同步/异步通道）、
    处方外流接收全链路与状态机（7状态×9转换）、操作矩阵（6角色×33操作）。
    过滤：具体技术实现代码、SVG绘图细节。
  status: "draft"
  # v1.2.0 新增：处方外流政策深化审查记录
  policy_deepening:
    reviewed_at: "2026-07-24"
    policy_basis:
      - "国家医保局〔2024〕86号《关于规范医保药品外配处方管理的通知》"
      - "全国统一医保信息平台电子处方中心技术规范"
      - "《处方管理办法》（卫生部令第53号）"
      - "《药品经营质量管理规范》(GSP)"
    key_policy_points:
      - "2025.1.1起双通道药品必须通过电子处方中心流转，禁止纸质处方"
      - "电子处方3日内有效（可延至7日），一单一用不可复用"
      - "药店须采集上传药品追溯码，全链条可追溯"
      - "电子签章CA认证+国密算法加密传输"
      - "四查十对+四重验证+处方前置审核(PASS)"
      - "结算后5分钟内回传20项核心数据至电子处方中心"
      - "操作日志≥6个月不可篡改，处方资料保存15年"
      - "31省医保电子处方中心已全覆盖（接入27.14万家药店/7.06万家医疗机构）"
  # v1.1.0 专家审查记录（保留）
  expert_review:
    reviewed_at: "2026-07-24"
    reviewers:
      - expert: "药店业务专家"
        blind_spots_found: 7
        key_findings: ["比价与替代药品推荐缺失", "库存预警与自动补货缺失", "药品效期管理缺失", "O2O即时配送缺失", "门店自提缺失", "电子发票缺失", "医保定点药店管理缺失"]
      - expert: "HIS系统专家"
        blind_spots_found: 2
        key_findings: ["医保前置机对接缺失", "处方外流接收缺失"]
      - expert: "处方管理专家"
        blind_spots_found: 3
        key_findings: ["处方配伍禁忌检查缺失", "精麻药品处方管理缺失", "长处方慢病复购缺失"]
      - expert: "慢病管理专家"
        blind_spots_found: 1
        key_findings: ["长期处方(长处方)购药路径缺失"]
    total_blind_spots: 13
    high_severity: 8
    medium_severity: 5

  # ============================================
  # 1. 业务泳道图（角色×阶段×动作）
  # ============================================
  swimlane:
    roles:
      - role_id: "ROLE-RXSTORE-001"
        name: "消费者"
        type: "end_user"
        description: "药品购买方，通过多端（App/小程序/H5）浏览商品、下单、支付、签收"
        core_need: "便捷购药，处方药合规购买，配送及时"
      - role_id: "ROLE-RXSTORE-002"
        name: "平台系统"
        type: "system"
        description: "互联网药店平台，负责商品展示、订单调度、处方关联、风控校验、支付回调"
        core_need: "高效精准的交易调度与合规管控"
      - role_id: "ROLE-RXSTORE-003"
        name: "药师"
        type: "service_provider"
        description: "处方审核方，负责在线审方——审核处方合理性、用药安全、配伍禁忌"
        core_need: "高效审核工具，保障处方合规与用药安全"
      - role_id: "ROLE-RXSTORE-004"
        name: "药店/仓储"
        type: "service_provider"
        description: "商家端，负责接单、拣货、复核、打包、出库，管理库存与商品上下架"
        core_need: "准确高效的订单履约，库存精准管理"
      - role_id: "ROLE-RXSTORE-005"
        name: "物流配送"
        type: "service_provider"
        description: "配送方，负责取件、配送中、送达签收，冷链药品温控。含同城即时配送(O2O)+快递配送双通道"
        core_need: "准时安全的药品配送服务"
      # v1.1.0 新增：供应商角色
      - role_id: "ROLE-RXSTORE-006"
        name: "供应商"
        type: "service_provider"
        description: "药品供应商，负责商品供货、库存预警后自动补货、效期管理、药品信息维护"
        core_need: "库存稳定供给，高效补货协同"

    stages:
      - "浏览阶段"
      - "下单阶段"
      - "审方阶段"    # 仅处方药
      - "支付阶段"
      - "履约阶段"
      - "交付阶段"

    actions:
      # 浏览阶段
      - role: "消费者"
        stage: "浏览阶段"
        action: "浏览/搜索商品，查看药品详情与说明书"
        input: "商品分类、搜索关键词"
        output: "商品列表/详情"
        sources: ["互联网药店业务建模文档"]
      - role: "平台系统"
        stage: "浏览阶段"
        action: "商品搜索/推荐、展示药品信息、标记处方药/OTC"
        input: "商品数据、搜索索引"
        output: "搜索结果、商品详情页"
        sources: ["互联网药店业务建模文档"]

      # 下单阶段
      - role: "消费者"
        stage: "下单阶段"
        action: "加入购物车 → 提交订单（含处方药上传处方）"
        input: "商品SKU、数量、处方照片（如需）"
        output: "待支付订单/待审方订单"
        sources: ["互联网药店业务建模文档"]
      - role: "平台系统"
        stage: "下单阶段"
        action: "创建订单 → 风控校验 → 处方药识别（触发审方/OTC直通）"
        input: "购物车数据、用户信息"
        output: "订单（待支付/待审方）"
        sources: ["互联网药店业务建模文档"]

      # 审方阶段（仅处方药）
      - role: "药师"
        stage: "审方阶段"
        action: "接收审方任务 → 审核处方合理性 → 通过/驳回（附原因）"
        input: "处方信息、药品知识库"
        output: "审方结果"
        sources: ["互联网药店业务建模文档"]
      - role: "平台系统"
        stage: "审方阶段"
        action: "OCR处方解析 → 推送审方任务 → 审核结果回传 → 处方关联订单"
        input: "处方照片、药师分配"
        output: "审核通过/驳回通知"
        sources: ["互联网药店业务建模文档"]

      # 支付阶段
      - role: "消费者"
        stage: "支付阶段"
        action: "在线支付（审方通过后/OTC直接支付）"
        input: "订单金额、支付方式"
        output: "支付流水"
        sources: ["互联网药店业务建模文档"]
      - role: "平台系统"
        stage: "支付阶段"
        action: "发起支付 → 支付回调处理 → 订单状态更新 → 派单至商家"
        input: "支付结果"
        output: "待发货订单"
        sources: ["互联网药店业务建模文档"]

      # 履约阶段
      - role: "药店/仓储"
        stage: "履约阶段"
        action: "商家接单 → 拣货/复核 → 打包 → 出库"
        input: "订单详情、库存数据"
        output: "已出库包裹"
        sources: ["互联网药店业务建模文档"]
      - role: "平台系统"
        stage: "履约阶段"
        action: "派单至商家 → WMS仓储调度 → 通知物流取件"
        input: "待发货订单"
        output: "物流运单"
        sources: ["互联网药店业务建模文档"]

      # 交付阶段
      - role: "物流配送"
        stage: "交付阶段"
        action: "配送取件 → 配送中 → 送达签收（冷链温控）"
        input: "运单信息、收货地址"
        output: "签收记录"
        sources: ["互联网药店业务建模文档"]
      - role: "消费者"
        stage: "交付阶段"
        action: "确认收货（支持7天自动确认）"
        input: "配送包裹"
        output: "签收完成"
        sources: ["互联网药店业务建模文档"]

  # ============================================
  # 2. 业务流程图
  # ============================================
  flow:
    happy_path: |
      **OTC购药主流程**（无审方环节）：
      消费者浏览OTC商品 → 加入购物车 → 提交订单 → 风控校验 →
      在线支付 → 商家发货 → 物流配送 → 签收完成

      **处方药购药主流程**（含审方环节）：
      消费者选择处方药 → 上传处方照片 → OCR结构化解析 → 提交订单 →
      推送药师审方 → 审方通过 → 电子处方签发 → 用户支付 → 商家发货 → 配送签收

      ```mermaid
      flowchart TD
        A["👤 消费者：浏览/搜索商品"] --> B["👤 消费者：加入购物车"]
        B --> C["👤 消费者：提交订单"]
        C --> D{"🏥 是否处方药？"}
        D -->|OTC| E["⚙️ 平台：风控校验"]
        D -->|处方药| F["👤 消费者：上传处方"]
        F --> G["⚙️ 平台：OCR解析"]
        G --> H["💊 药师：审核处方"]
        H --> I{"审核结果？"}
        I -->|驳回| J["👤 消费者：重新上传"]
        J --> F
        I -->|通过| K["⚙️ 平台：电子处方签发"]
        K --> E
        E --> L{"风控通过？"}
        L -->|否| L1["❌ 订单关闭"]
        L -->|是| M["👤 消费者：在线支付"]
        M --> N["🏪 药店：接单/拣货/出库"]
        N --> O["📦 物流：配送中"]
        O --> P["👤 消费者：签收确认"]
        P --> Q["✅ 完成"]
      ```

    exceptions:
      - desc: "审方驳回：药师审核处方不通过（用药不合理/剂量超标/配伍禁忌），处方退回消费者重新上传修改"
        sources: ["互联网药店业务建模文档"]
      - desc: "风控不通过：异常交易/限购触发/实名不一致，订单关闭"
        sources: ["互联网药店业务建模文档"]
      - desc: "支付失败：余额不足/支付超时/渠道故障，引导重新支付或订单取消"
        sources: ["互联网药店业务建模文档"]
      - desc: "配送异常：物流延误/药品破损/地址错误/冷链温度异常，触发客服介入"
        sources: ["互联网药店业务建模文档"]

    branches:
      - desc: "OTC直通捷径：非处方药订单跳过审方环节，直接从下单进入支付→发货流程（虚线路径）"
        sources: ["互联网药店业务建模文档"]
      - desc: "支付超时30分钟自动取消：订单待支付状态超过30分钟，系统自动取消并释放库存"
        sources: ["互联网药店业务建模文档"]
      - desc: "退换货分支：已发货订单可申请退款（需商家审核+寄回商品+仓库验收）；未发货订单直接退款"
        sources: ["互联网药店业务建模文档"]
      - desc: "药师咨询分支：线上咨询→判断是否需要处方→否：图文/语音咨询→药师回复→评价；是：在线问诊→医生开方→药师审方→跳转购药"
        sources: ["互联网药店业务建模文档"]

  # ============================================
  # 3. 业务信息流
  # ============================================
  info_flow:
    entities:
      - name: "商品信息"
        producer: "商品中心"
        consumer: "搜索引擎 → 用户"
        depends_on: "商品数据维护"
        key_fields: ["SPU/SKU", "品类", "库存", "价格", "处方药标记", "说明书", "监管码"]
        sources: ["互联网药店业务建模文档"]
      - name: "购物车"
        producer: "用户"
        consumer: "订单中心"
        depends_on: "商品浏览/搜索"
        key_fields: ["商品列表", "数量", "选中状态", "总金额"]
        sources: ["互联网药店业务建模文档"]
      - name: "订单"
        producer: "订单中心"
        consumer: "风控中心 → 处方中心 → 支付中心 → WMS → 物流"
        depends_on: "购物车结算"
        key_fields: ["订单编号", "商品明细", "金额", "收货地址", "订单状态", "用户ID"]
        sources: ["互联网药店业务建模文档"]
      - name: "处方信息"
        producer: "用户上传"
        consumer: "处方中心 → 药师工作台 → 订单中心"
        depends_on: "处方药订单创建"
        key_fields: ["处方照片", "OCR解析结果", "药品名称", "用法用量", "处方效期"]
        sources: ["互联网药店业务建模文档"]
      - name: "审方结果"
        producer: "药师工作台"
        consumer: "处方中心 → 订单中心 → 用户"
        depends_on: "处方提交"
        key_fields: ["审核结果", "驳回原因", "药师ID", "审核时间", "电子处方"]
        sources: ["互联网药店业务建模文档"]
      - name: "支付流水"
        producer: "支付中心"
        consumer: "订单中心 → 用户"
        depends_on: "订单确认"
        key_fields: ["支付单号", "订单编号", "金额", "支付方式", "支付时间", "状态"]
        sources: ["互联网药店业务建模文档"]
      - name: "拣货指令"
        producer: "订单中心"
        consumer: "仓储系统WMS"
        depends_on: "支付成功"
        key_fields: ["订单编号", "商品清单", "仓位信息", "优先级"]
        sources: ["互联网药店业务建模文档"]
      - name: "物流信息"
        producer: "物流系统"
        consumer: "订单中心 → 消息中心 → 用户"
        depends_on: "出库完成"
        key_fields: ["运单号", "配送员", "配送状态", "预计送达", "温控数据"]
        sources: ["互联网药店业务建模文档"]
      - name: "签收事件"
        producer: "物流系统"
        consumer: "订单中心 → 会员/积分 → 用户"
        depends_on: "配送完成"
        key_fields: ["签收时间", "签收人", "签收照片"]
        sources: ["互联网药店业务建模文档"]

    # v1.1.0 新增：5个信息实体（药店/处方/医保专家审查发现）
      - name: "电子发票"
        producer: "订单中心/支付中心"
        consumer: "用户"
        depends_on: "订单已完成/已签收"
        key_fields: ["发票编号", "订单编号", "发票抬头", "税号", "金额", "开票状态（已开/已红冲）", "发票链接"]
        life_cycle: "待开具→已开具→已推送（邮件/短信）→已红冲（如需）"
        sources: ["药店业务专家审查"]
      - name: "效期预警"
        producer: "仓储系统(WMS)"
        consumer: "商品中心 → 营销中心"
        depends_on: "库存数据 + 近效期规则"
        key_fields: ["SKU", "批号", "生产日期", "效期截止日", "剩余天数", "预警级别（临期/近效期/过期）", "处置建议"]
        life_cycle: "正常→临期预警（6个月）→近效期（3个月）→过期标记→自动下架"
        sources: ["药店业务专家审查"]
      - name: "O2O配送单"
        producer: "订单中心 → O2O配送平台（美团/达达/闪送）"
        consumer: "物流系统 → 用户"
        depends_on: "订单已支付 + O2O配送渠道选择"
        key_fields: ["O2O运单号", "订单编号", "取件门店", "配送地址", "时效承诺（30分钟达）", "骑手信息", "实时轨迹"]
        life_cycle: "待接单→骑手取件中→配送中→已送达"
        sources: ["药店业务专家审查"]
      - name: "医保结算单"
        producer: "医保定点药店 → 医保前置机"
        consumer: "用户 → 医保局"
        depends_on: "医保定点药店认证 + 医保药品目录校验"
        key_fields: ["医保结算编号", "订单编号", "医保类型（职工/居民）", "统筹支付金额", "个人账户支付", "个人现金支付", "结算时间", "医保状态"]
        life_cycle: "待结算→已结算→已上报医保局"
        sources: ["药店业务专家审查", "HIS系统专家审查"]
      - name: "供应商库存"
        producer: "供应商系统"
        consumer: "药店仓储系统(WMS)"
        depends_on: "供应商对接 + 库存预警触发"
        key_fields: ["供应商编号", "SKU", "供应商库存量", "采购价", "补货周期", "最小起订量", "配送时效"]
        life_cycle: "同步→低库存预警→自动生成采购单→供应商发货→到货验收→上架"
        sources: ["药店业务专家审查"]

    # v1.2.0 新增：处方流转相关实体
      - name: "处方流转记录"
        producer: "电子处方中心"
        consumer: "药店处方中心 → 药师工作台 → 仓储系统"
        depends_on: "电子处方中心推送 + 药店双通道资质"
        key_fields: ["RxID（处方唯一码）", "患者信息(脱敏)", "ICD诊断编码", "处方药品清单（药品编码×通用名×商品名×数量×用法用量）", "开具机构", "开具医师+电子签章", "开具时间", "有效期截止时间（精确秒）", "双通道标记", "外流药师审方状态", "患者授权状态", "调配药师签名", "核销时间", "20项回传数据包", "操作日志链"]
        life_cycle: "已开具→已上传→已接收→已验真→已审方→已授权→已调配→已核销→已回传/已过期/已拒绝"
        sources: ["国家医保局电子处方中心技术规范"]
      - name: "药品追溯码记录"
        producer: "仓储系统(WMS)→药师调配"
        consumer: "电子处方中心 → 药品追溯协同平台"
        depends_on: "药品调配逐盒扫描"
        key_fields: ["追溯码(20位)", "RxID", "药品批号", "生产日期", "有效期至", "扫描时间", "匹配结果"]
        life_cycle: "已扫描→已上传→匹配通过→已关联处方/匹配拒绝→异常待处理"
        sources: ["国家医保局〔2024〕86号通知", "药品追溯码编码规范"]
      - name: "处方外流预警记录"
        producer: "电子处方中心"
        consumer: "药店→医保稽核部门"
        depends_on: "超时未回传/验签失败/重复RxID/追溯码异常"
        key_fields: ["预警编号", "RxID", "预警类型（回传超时/签章无效/重复使用/追溯码异常/资质不足）", "预警级别(L1/L2/L3)", "触发时间", "响应状态", "处置结果"]
        life_cycle: "已触发→L1提醒→L2通知→L3稽核介入→已处置/已关闭"
        sources: ["国家医保局〔2024〕86号通知"]

    cross_system: |
      互联网药店平台作为交易中枢，与多个子系统通过同步/异步通道交互：

      1. **同步调用链**（强一致）：用户 → 商品 → 购物车 → 订单 → 支付 —— 核心交易链路
      2. **异步消息链**（最终一致）：订单 → 仓储(拣货MQ) / 物流(签收事件MQ) / 消息(通知MQ) / 会员(积分MQ) / 营销(券核销MQ)
      3. **数据同步**：各服务binlog → Canal → 数据仓库（准实时T+1分析）
      4. **O2O即时配送链**（v1.1.0新增）：下单时选择O2O渠道 → 订单推送O2O平台 → 骑手接单 → 门店拣货 → 即时配送
      5. **医保结算链**（v1.1.0新增）：医保定点药店下单 → 医保药品目录校验 → 医保前置机结算 → 上报医保局
      6. **处方外流接收——电子处方中心全链路**（v1.2.0深度重构）：互联网医院开具处方（电子签章+CA认证）→ 上传至国家医保电子处方中心 → 处方中心智能匹配具备双通道资质的定点药店 → 国密加密推送处方(RxID唯一码) → 药店验签+验真+有效期(72h)校验 → AI前置审方(11强制拦截+12风险提醒) → 药师四查十对+独立审方 → 患者医保APP授权(刷脸/扫码) → 四重验证调配(身份/有效期/追溯码/药师签名) → 结算 → 5分钟内回传20项核心数据 → 处方标记已核销 → 追溯码同步药品追溯协同平台 → 操作日志≥6个月留存+处方资料保存15年

      ```mermaid
      flowchart LR
        U["用户"] -- 浏览/加购/比价 --> P["商品中心"]
        P -- 商品索引 --> S["搜索推荐"]
        U -- 结算 --> CART["购物车"]
        CART -- 下单 --> ORDER["订单中心"]
        ORDER -- 风控校验 --> RISK["风控中心"]
        ORDER -- 处方关联 --> RX["处方中心"]
        RX -- 审方任务 --> PHARM["药师工作台"]
        ORDER -- 发起支付 --> PAY["支付中心"]
        ORDER -. 拣货指令(MQ) .-> WMS["仓储系统"]
        WMS -- 发货信息 --> LOG["物流系统/快递"]
        LOG -. 签收事件(MQ) .-> ORDER
        ORDER -. 状态通知(MQ) .-> NOTIFY["消息中心"]
        NOTIFY -- 推送/短信 --> U
        ORDER -. 积分发放(MQ) .-> MEMBER["会员/积分"]
        ORDER -. 券核销(MQ) .-> MKT["营销中心"]
        ORDER -. 埋点日志(Canal) .-> BI["数据分析"]
        ORDER -- O2O配送 --> O2O["O2O平台(美团/达达/闪送)"]
        O2O -- 骑手轨迹 --> U
        ORDER -- 电子发票请求 --> INVOICE["发票系统"]
        INVOICE -- 发票推送 --> U
        ORDER -- 医保结算 --> MI["医保前置机"]
        MI -- 结算上报 --> SG["医保局"]
        WMS -- 效期预警 --> P
        WMS -- 低库存预警 --> SUP["供应商系统"]
        SUP -- 自动补货 --> WMS
        ORDER -- 门店自提 --> STORE["门店POS"]
        STORE -- 核销码确认 --> U
      ```

  # ============================================
  # 4. 业务操作矩阵（角色×操作权限）
  # ============================================
  operation_matrix:
    roles:
      - "消费者"
      - "药师"
      - "药店商家"
      - "平台运营"
      - "物流配送"
    states:
      - "浏览阶段"
      - "下单阶段"
      - "审方阶段"
      - "支付阶段"
      - "履约阶段"
      - "交付阶段"
      - "售后阶段"
    matrix:
      - role: "消费者"
        state: "浏览阶段"
        operations: ["浏览/搜索商品", "查看药品说明书"]
        target_state: "浏览阶段"
        sources: ["互联网药店业务建模文档"]
      - role: "消费者"
        state: "下单阶段"
        operations: ["加入购物车", "提交订单", "上传处方"]
        target_state: "待支付/待审方"
        sources: ["互联网药店业务建模文档"]
      - role: "消费者"
        state: "支付阶段"
        operations: ["在线支付", "取消支付"]
        target_state: "待发货/已取消"
        sources: ["互联网药店业务建模文档"]
      - role: "消费者"
        state: "交付阶段"
        operations: ["查看物流", "确认收货"]
        target_state: "已完成"
        sources: ["互联网药店业务建模文档"]
      - role: "消费者"
        state: "售后阶段"
        operations: ["申请退款/退货", "寄回商品"]
        target_state: "退款申请中/已退款"
        sources: ["互联网药店业务建模文档"]
      - role: "药师"
        state: "审方阶段"
        operations: ["接收审方任务", "通过处方", "驳回处方（附原因）"]
        target_state: "审方通过/退回修改"
        sources: ["互联网药店业务建模文档"]
      - role: "药店商家"
        state: "履约阶段"
        operations: ["接单", "拣货/复核", "打包出库", "商品上下架管理", "库存管理"]
        target_state: "已出库"
        sources: ["互联网药店业务建模文档"]
      - role: "药店商家"
        state: "售后阶段"
        operations: ["审核退款申请", "仓库验收入库"]
        target_state: "退款中/已退款"
        sources: ["互联网药店业务建模文档"]
      - role: "平台运营"
        state: "任意"
        operations: ["商品上下架管理", "库存管理", "价格/促销管理", "订单数据查看（全局）", "风控/合规审计", "执行退款"]
        target_state: "依操作而定"
        sources: ["互联网药店业务建模文档"]
      - role: "物流配送"
        state: "交付阶段"
        operations: ["配送取件", "配送中", "送达签收（含代签）"]
        target_state: "已签收"
        sources: ["互联网药店业务建模文档"]

  # ============================================
  # 5. 业务规则
  # ============================================
  business_rules:
    - id: "BR-RXSTORE-001"
      name: "处方药审方前置"
      description: "所有处方药订单必须先经过药师审方通过后，方可进入支付环节。OTC药品跳过审方直接支付。"
      trigger: "提交含处方药的订单"
      behavior: "识别处方药标记 → 触发审方流程 → 审方通过后解锁支付"
      related_state: "待审方 → 待支付"
      sources: ["互联网药店业务建模文档"]
    - id: "BR-RXSTORE-002"
      name: "审方时效24小时"
      description: "处方审核须在24小时内完成，超时自动转人工客服处理。"
      trigger: "审方任务创建"
      behavior: "计时开始 → 24h超时 → 系统提醒+人工客服介入"
      related_state: "待审方"
      sources: ["互联网药店业务建模文档"]
    - id: "BR-RXSTORE-003"
      name: "处方效期与复用限制"
      description: "每张处方最多调配3次，处方有效期由开具日期起算（通常1-3天），过期需重新开具。"
      trigger: "处方关联订单时"
      behavior: "校验处方有效期 → 校验已调配次数 → 超限/过期则拒绝"
      related_state: "待审方 / 待支付"
      sources: ["互联网药店业务建模文档"]
    - id: "BR-RXSTORE-004"
      name: "支付超时30分钟自动取消"
      description: "订单待支付状态超过30分钟未支付，系统自动取消并释放库存。"
      trigger: "订单进入待支付状态"
      behavior: "计时30min → 超时未支付 → 自动取消 → 释放库存"
      related_state: "待支付 → 已取消"
      sources: ["互联网药店业务建模文档"]
    - id: "BR-RXSTORE-005"
      name: "收货7天自动确认"
      description: "订单待收货状态超过7天未主动确认，系统自动确认收货完成。"
      trigger: "订单进入待收货状态"
      behavior: "计时7天 → 自动签收 → 完成 → 发放积分"
      related_state: "待收货 → 已完成"
      sources: ["互联网药店业务建模文档"]
    - id: "BR-RXSTORE-006"
      name: "特殊药品退换货限制"
      description: "处方药仅质量问题可退；冷链药品不支持退货；OTC药品支持常规退换货。"
      trigger: "消费者发起退换货申请"
      behavior: "校验药品类型 → 处方药非质量拒绝 / 冷链药品拒绝 / OTC正常处理"
      related_state: "售后阶段"
      sources: ["互联网药店业务建模文档"]
    - id: "BR-RXSTORE-007"
      name: "职责分离（SoD）"
      description: "审方权在药师、退款审批权在平台运营、发货权在药店商家，三者互斥防舞弊。"
      trigger: "权限校验时"
      behavior: "角色权限校验 → 互斥检查 → 拒绝越权操作"
      related_state: "全流程"
      sources: ["互联网药店业务建模文档"]
    - id: "BR-RXSTORE-008"
      name: "冷链药品温控监控"
      description: "冷链药品在物流配送环节需实时温度监控，温度异常触发预警并暂停配送。"
      trigger: "冷链药品进入配送环节"
      behavior: "温控设备激活 → 实时数据回传 → 温度越限 → 预警+暂停配送"
      related_state: "配送中"
      sources: ["互联网药店业务建模文档"]

    # v1.1.0 新增：7条业务规则（药店/处方/医保专家审查）
    - id: "BR-RXSTORE-009"
      name: "O2O即时配送时效"
      description: "O2O渠道订单承诺30分钟内送达（3公里内），超时赔付。骑手接单→门店拣货→即时配送，全程轨迹可见。"
      trigger: "用户选择O2O配送渠道"
      behavior: "下单→O2O平台分配骑手→门店拣货（≤5分钟）→骑手取件→实时轨迹→30分钟送达→超时触发赔付"
      related_state: "待发货 → 配送中 → 已完成"
      sources: ["药店业务专家审查"]
    - id: "BR-RXSTORE-010"
      name: "库存预警与自动补货"
      description: "药品库存低于安全库存阈值时，系统自动向供应商发送补货请求。不同品类设置不同安全库存阈值（常用药≥100、慢病药≥50、罕见药≥10）。"
      trigger: "实时库存<安全库存阈值"
      behavior: "库存降至阈值 → 生成补货建议（含推荐采购量+供应商报价）→ 自动/手动确认 → 供应商发货 → WMS到货验收 → 上架"
      related_state: "仓储履约"
      sources: ["药店业务专家审查"]
    - id: "BR-RXSTORE-011"
      name: "药品效期分级管理"
      description: "效期剩余6个月→临期标记；剩余3个月→近效期提醒（可设促销价）；已过期→系统自动下架且不可销售。出库优先发出近效期商品（FEFO先进先出）。"
      trigger: "每日效期定时巡检"
      behavior: "巡检效期 → 6个月：临期标记 → 3个月：近效期提醒+促销推荐 → 0天：自动下架+不可销售 → 出库规则：同品批号近效期优先"
      related_state: "仓储履约 | 商品上架"
      sources: ["药店业务专家审查"]
    - id: "BR-RXSTORE-012"
      name: "医保定点药店结算"
      description: "医保定点药店接入医保前置机，下单时自动校验药品是否在医保目录内，区分统筹支付、个人账户支付、个人现金支付三部分。结算后上报医保局。"
      trigger: "用户在医保定点药店下单"
      behavior: "校验药店医保资质 → 逐品校验医保目录 → 计算统筹/个账/现金金额比 → 医保前置机结算 → 结算单存档 → T+1上报医保局"
      related_state: "待支付 → 已支付 → 已完成"
      sources: ["药店业务专家审查", "HIS系统专家审查"]
    - id: "BR-RXSTORE-013"
      name: "电子发票开具与管理"
      description: "订单签收后可开具电子发票，支持个人/企业抬头。已开发票可红冲作废（需上传红字信息表）。发票状态可追溯。"
      trigger: "用户申请开具电子发票"
      behavior: "填写抬头+税号 → 系统生成电子发票 → 推送到用户（邮件/短信链接）→ 红冲：上传红字信息表→审核→原发票红冲→新发票出具"
      related_state: "已完成"
      sources: ["药店业务专家审查"]
    # v1.2.0 处方外流接收深度重构（基于国家医保局〔2024〕86号 + 2025年电子处方中心全国落地）
    - id: "BR-RXSTORE-014"
      name: "处方外流接收——电子处方中心接入与全链路合规"
      description: |
        基于国家医保局〔2024〕86号《关于规范医保药品外配处方管理的通知》和全国统一医保电子处方中心
        （截至2025年中已连接7.06万家医疗机构+27.14万家定点零售药店，31省全覆盖）。
        自2025年1月1日起，所有双通道药品必须通过电子处方中心流转，全面禁止纸质处方。
        药店接收处方全链路分6个阶段：处方流入→处方验真→药师审方→患者授权→药品调配→核销回传。
      trigger: "电子处方中心推送处方至药店"
      behavior: |
        【阶段1：处方流入】
        ①电子处方中心根据处方中药品目录智能匹配具备相应资质（双通道+特殊药品经营许可）的定点药店
        ②处方数据经国密算法加密传输至药店系统，仅接收方可解密
        ③药店系统验证处方唯一码（RxID），自动查重——同一RxID已接收则拒绝重复接收
        ④解析处方核心字段：患者信息(脱敏)/诊断ICD编码/处方药品(Rx药品编码+通用名+商品名)/用法用量/开具医师/开具时间/处方有效期截止时间/电子签章/药品追溯码（如有预制）
        →
        【阶段2：处方验真】
        ⑤校验电子签章：使用CA机构公钥验签——签章无效则拒收并上报异常
        ⑥校验处方有效期：电子处方开具后3日（72小时）内有效，特殊情形可延至7日——超出有效期则标记已过期→回传电子处方中心→拒绝调配
        ⑦校验开具机构资质：开具机构须为已备案的互联网医院或定点医疗机构
        ⑧校验双通道药品标记：双通道药品强制要求电子处方流转，非电子处方拒绝
        →
        【阶段3：药师审方——四查十对+AI前置审核】
        ⑨PASS系统前置审核（11类强制拦截规则+12类风险提醒规则）：配伍禁忌/超剂量/超适应症/儿童禁忌/老人剂量/妊娠禁忌/过敏史交叉/重复用药/药物相互作用/精麻药品管控/医保目录限制
        ⑩药师执行「四查十对」：查处方（对科别/姓名/年龄）→查药品（对药名/剂型/规格/数量）→查配伍禁忌（对药品性状/用法用量）→查用药合理性（对临床诊断）
        ⑪外流处方须由非原审方药师独立审方——与原开具机构审方药师非同一人
        ⑫审方通过→药师电子签名→流转入调配阶段；审方驳回→注明原因→回传电子处方中心→通知患者
        →
        【阶段4：患者授权】
        ⑬患者通过医保APP/小程序查看处方详情和可选药店列表
        ⑭患者选择药店后须二次身份核验（刷脸/医保电子凭证扫码）完成处方使用授权
        ⑮授权后该RxID锁定至当前药店——其他药店不可再接收同一处方
        →
        【阶段5：药品调配——四重验证】
        ⑯第一重·患者身份验证：姓名+身份证号+医保凭证三要素核验
        ⑰第二重·处方有效性验证：RxID有效+未过期+未核销+患者授权匹配
        ⑱第三重·药品追溯码验证：调配药品逐盒扫描追溯码→上传电子处方中心→与处方药品编码匹配校验
        ⑲第四重·执业药师审核记录验证：确认药师电子签名+审核时间在处方有效期内
        →
        【阶段6：核销回传】
        ⑳四重验证全部通过→处方核销标记为「已调配」
        ㉑结算后5分钟内将20项核心数据回传电子处方中心（含：RxID/药品批号/追溯码/剂量/调配药师签名/核销时间等）
        ㉒超时未回传触发系统预警→医保稽核介入
        ㉓处方标记「已核销」→不可二次复用
        ㉔操作日志留存≥6个月且不可篡改（支持区块链存证），处方资料保存15年
        ㉕药品追溯码信息同步至药品追溯协同服务平台，全链条可追溯
      related_state: "处方流入→待验真→待审方→审方中→待授权→待调配→核销中→已核销→已过期/已拒绝"
      sources: ["处方管理专家审查", "HIS系统专家审查", "国家医保局〔2024〕86号通知", "处方管理办法", "电子处方流转合规实务指南"]
    - id: "BR-RXSTORE-016"
      name: "电子处方有效期管理"
      description: "电子处方开具后3日(72小时)内有效；特殊情形（如慢病长期用药）经说明可延至7日。精确到秒计时，超期自动标记已过期并回传电子处方中心。药店接收时剩余有效期≥1小时方可进入调配流程。"
      trigger: "处方到期定时巡检（每30分钟） + 药店接收时实时校验"
      behavior: "检索全部「待核销」处方 → 计算剩余有效期 → 剩余<1小时的处方标记即将过期→推送患者提醒 → 超期的处方自动标记已过期→回传电子处方中心→释放药店锁定"
      related_state: "待核销 → 已过期"
      sources: ["国家医保局〔2024〕86号通知", "处方管理办法"]
    - id: "BR-RXSTORE-017"
      name: "处方唯一码（RxID）一单一用"
      description: "每个电子处方具有全国唯一的处方编号（RxID），由电子处方中心统一生成。该RxID在流转全链路中作为唯一主键，限单次调配核销。系统在接收/审方/调配/核销各环节均校验RxID是否已被使用，已核销/已调配的RxID再次出现时自动拦截并上报。"
      trigger: "任何环节操作处方时"
      behavior: "查询RxID状态 → 已核销→拦截+上报 → 已调配→拦截+上报（其他药店）→ 未使用→放行"
      related_state: "全链路状态校验"
      sources: ["国家医保局电子处方中心技术规范"]
    - id: "BR-RXSTORE-018"
      name: "药品追溯码采集上传"
      description: "药店调配处方药品时，必须逐盒扫描药品追溯码（20位药品追溯码/阿里健康码），上传至电子处方中心并与处方药品编码匹配。追溯码缺失或匹配不一致的药品不得调配。追溯码同步至全国药品追溯协同服务平台（国家药监局），实现生产→流通→销售全链条追溯。"
      trigger: "药师调配药品时逐盒扫描"
      behavior: "扫描追溯码 → 上传电子处方中心 → 系统校验追溯码×处方药品编码×批号×效期一致性 → 全部匹配→放行 → 任一不匹配→拒绝+药店端提示 → 全部追溯码上传完成后处方可进入核销"
      related_state: "待调配 → 核销中"
      sources: ["国家医保局〔2024〕86号通知", "药品追溯码编码规范"]
    - id: "BR-RXSTORE-019"
      name: "处方外流数据回传与超时预警"
      description: "药店完成处方核销结算后，须在5分钟内将20项核心数据回传至电子处方中心。超时未回传触发系统预警（L1—提醒药店/L2—通知医保部门/L3—医保稽核介入）。回传数据含：RxID/患者信息(脱敏)/诊断/药品信息(通用名+批号+追溯码+数量+剂量)/调配药师签名/核销时间/药店编码/结算金额。"
      trigger: "处方核销结算完成"
      behavior: "结算完成→启动5分钟倒计时→组装20项核心数据→回传电子处方中心→接收回传确认→记录回传日志。5分钟内未完成→L1预警提醒→10分钟内未完成→L2通知医保部门→30分钟内未完成→L3医保稽核介入+暂停该药店处方接收权限"
      related_state: "已核销 → 已回传（正常）/ 已核销 → 回传异常（触发预警）"
      sources: ["国家医保局〔2024〕86号通知", "电子处方流转合规实务指南"]
    - id: "BR-RXSTORE-020"
      name: "双通道药品处方流转特殊管理"
      description: "纳入国家医保谈判药品「双通道」管理的药品，必须通过电子处方中心流转，不得使用纸质处方。双通道药店需额外具备冷链储存/特殊管理药品经营许可等资质。双通道药品处方自带「双通道」标记，药店接收时强制校验资质，无资质药店不可接收。双通道药品处方调配需留存冷链配送温控记录。"
      trigger: "电子处方含「双通道」标记"
      behavior: "校验药店双通道资质 → 无资质→拒绝接收+回传 → 有资质→校验特殊储存条件(冷链/阴凉/避光) → 条件不满足→拒绝+提示 → 条件满足→正常流转 → 调配时额外记录储存温控数据+冷链配送温控链"
      related_state: "处方流入 → 待调配（双通道加强校验）"
      sources: ["国家医保局双通道药品管理政策", "国家医保局〔2024〕86号通知"]
    - id: "BR-RXSTORE-015"
      name: "比价与替代药品推荐"
      description: "处方药展示同通用名不同商品名比价；OTC药品展示不同品牌同适应症替代推荐。比价来源含平台自营+入驻药店。"
      trigger: "用户查看商品详情/处方关联药品"
      behavior: "处方药：按相同通用名搜索 → 展示不同商品名+价格+药店 → OTC：按相同适应症推荐 → 标注替代类型（同成分/同治疗方向）"
      related_state: "浏览阶段"
      sources: ["药店业务专家审查"]

  # ============================================
  # 6. 业务动作
  # ============================================
  business_actions:
    - id: "ACT-RXSTORE-001"
      name: "浏览搜索商品"
      trigger_role: "消费者"
      input: "搜索关键词/分类选择"
      output: "商品列表/详情"
      precondition: "用户已登录"
      postcondition: "浏览记录更新"
      sources: ["互联网药店业务建模文档"]
    - id: "ACT-RXSTORE-002"
      name: "加入购物车"
      trigger_role: "消费者"
      input: "商品SKU、数量"
      output: "购物车更新"
      precondition: "商品有库存"
      postcondition: "购物车商品+1"
      sources: ["互联网药店业务建模文档"]
    - id: "ACT-RXSTORE-003"
      name: "上传处方"
      trigger_role: "消费者"
      input: "处方照片（拍照/相册）"
      output: "OCR解析结果"
      precondition: "订单含处方药商品"
      postcondition: "处方进入审方队列"
      sources: ["互联网药店业务建模文档"]
    - id: "ACT-RXSTORE-004"
      name: "药师审方"
      trigger_role: "药师"
      input: "处方信息、药品知识库"
      output: "审方结果（通过/驳回+原因）"
      precondition: "有待审处方"
      postcondition: "处方状态更新，通知消费者"
      sources: ["互联网药店业务建模文档"]
    - id: "ACT-RXSTORE-005"
      name: "在线支付"
      trigger_role: "消费者"
      input: "支付方式选择"
      output: "支付流水"
      precondition: "订单状态=待支付（OTC）或审方已通过（处方药）"
      postcondition: "订单状态→待发货，扣减库存"
      sources: ["互联网药店业务建模文档"]
    - id: "ACT-RXSTORE-006"
      name: "拣货出库"
      trigger_role: "药店商家"
      input: "订单详情、仓位信息"
      output: "已出库包裹"
      precondition: "订单已支付"
      postcondition: "包裹交付物流，订单状态→待收货"
      sources: ["互联网药店业务建模文档"]
    - id: "ACT-RXSTORE-007"
      name: "配送签收"
      trigger_role: "物流 + 消费者"
      input: "运单号、收货验证"
      output: "签收记录"
      precondition: "包裹已出库"
      postcondition: "订单状态→已完成，发放积分"
      sources: ["互联网药店业务建模文档"]
    - id: "ACT-RXSTORE-008"
      name: "申请退款"
      trigger_role: "消费者"
      input: "退款原因、凭证图片"
      output: "退款申请单"
      precondition: "订单状态=待收货或已完成"
      postcondition: "进入退款审核流程"
      sources: ["互联网药店业务建模文档"]

    # v1.1.0 新增：6个业务动作（比价/电子发票/O2O/自提/效期/长处方复购）
    - id: "ACT-RXSTORE-009"
      name: "比价查药"
      trigger_role: "消费者"
      input: "药品通用名/商品名/适应症"
      output: "同品比价列表 / 替代药品推荐列表"
      precondition: "搜索或浏览药品详情"
      postcondition: "展示多药店/多品牌价格对比+替代推荐"
      sources: ["药店业务专家审查"]
    - id: "ACT-RXSTORE-010"
      name: "申请电子发票"
      trigger_role: "消费者"
      input: "发票抬头、税号、接收邮箱/手机号"
      output: "电子发票（PDF/OFD）"
      precondition: "订单状态=已完成/已签收"
      postcondition: "发票生成并推送，可申请红冲"
      sources: ["药店业务专家审查"]
    - id: "ACT-RXSTORE-011"
      name: "O2O即时配送下单"
      trigger_role: "消费者"
      input: "选择O2O配送渠道、确认配送地址"
      output: "O2O配送单"
      precondition: "门店支持O2O配送（3公里范围内）"
      postcondition: "O2O平台接单，骑手取件配送"
      sources: ["药店业务专家审查"]
    - id: "ACT-RXSTORE-012"
      name: "门店自提核销"
      trigger_role: "消费者"
      input: "自提核销码/订单编号"
      output: "自提完成确认"
      precondition: "订单选择门店自提 + 订单拣货完成"
      postcondition: "门店扫码核销，订单完成"
      sources: ["药店业务专家审查"]
    - id: "ACT-RXSTORE-013"
      name: "效期巡检与下架"
      trigger_role: "药店商家/系统"
      input: "批次效期数据"
      output: "效期预警 + 过期自动下架"
      precondition: "每日定时触发或库存变动触发"
      postcondition: "临期标记/近效期促销推荐/过期下架"
      sources: ["药店业务专家审查"]
    - id: "ACT-RXSTORE-014"
      name: "慢病长处方复购"
      trigger_role: "消费者"
      input: "慢病档案、长处方信息、当前用药情况"
      output: "复购订单"
      precondition: "已建立慢病档案 + 长处方在有效期内"
      postcondition: "快速复购下单（跳过重复审方），记录用药周期"
      sources: ["慢病管理专家审查"]

    # v1.2.0 新增：5个处方外流相关业务动作
    - id: "ACT-RXSTORE-015"
      name: "处方外流接收与验真"
      trigger_role: "药店系统/电子处方中心"
      input: "电子处方数据包（国密加密）"
      output: "验真结果（通过/拒绝）,处方解析数据"
      precondition: "药店已接入电子处方中心+具备双通道资质"
      postcondition: "处方通过验真（签章有效+有效期校验+资质校验+非重复RxID）进入审方队列；验真失败则拒收并上报"
      sources: ["国家医保局〔2024〕86号通知"]
    - id: "ACT-RXSTORE-016"
      name: "药师独立审方（四查十对）"
      trigger_role: "执业药师"
      input: "电子处方详情+AI前置审方报告（拦截/提醒标记）"
      output: "审方结论（通过/驳回+原因）+药师电子签名"
      precondition: "处方验真通过+AI前置审核有结果"
      postcondition: "审方通过→流转入患者授权；驳回→回传电子处方中心+通知患者"
      sources: ["处方管理办法", "四查十对规范"]
    - id: "ACT-RXSTORE-017"
      name: "患者处方授权"
      trigger_role: "消费者(患者)"
      input: "医保电子凭证/刷脸认证"
      output: "授权确认+RxID药店锁定"
      precondition: "处方已审方通过+患者已登录医保APP/小程序"
      postcondition: "RxID锁定至当前药店，仅当前药店可调配该处方"
      sources: ["国家医保局电子处方中心技术规范"]
    - id: "ACT-RXSTORE-018"
      name: "四重验证调配"
      trigger_role: "执业药师"
      input: "患者身份凭证+处方信息+药品追溯码+药师签名"
      output: "验证结果+处方标记已调配"
      precondition: "患者授权完成+RxID已锁定+药品库存充足"
      postcondition: "四重验证全部通过→处方标记已调配→药品追溯码上传→可进入结算"
      sources: ["国家医保局〔2024〕86号通知", "电子处方流转合规实务指南"]
    - id: "ACT-RXSTORE-019"
      name: "处方核销与数据回传"
      trigger_role: "药店系统"
      input: "结算凭证+处方调配记录"
      output: "20项核心数据包+回传确认+处方标记已核销"
      precondition: "四重验证通过+医保结算完成+药品交付完成"
      postcondition: "5分钟内回传电子处方中心→处方不可再复用→追溯码同步→日志存档"
      sources: ["国家医保局〔2024〕86号通知", "电子处方流转合规实务指南"]

  # ============================================
  # 7. 业务状态机
  # ============================================
  state_machine:
    entity: "购药订单"
    states:
      - "RxPending"     # 待审方（处方药专属，OTC跳过）
      - "PendingPay"    # 待支付
      - "PendingShip"   # 待发货
      - "PendingRecv"   # 待收货
      - "Completed"     # 已完成
      - "Cancelled"     # 已取消
      - "Refunding"     # 退款申请中
      - "Refunded"      # 已退款

    transitions:
      - from: "RxPending"
        to: "PendingPay"
        trigger: "审方通过"
        operator: "药师"
        precondition: "处方审核通过"
        post_action: "签发电子处方，用户可支付"
      - from: "RxPending"
        to: "Cancelled"
        trigger: "审方驳回"
        operator: "药师"
        precondition: "处方存在用药问题"
        post_action: "通知用户重新上传处方"
      - from: "PendingPay"
        to: "PendingShip"
        trigger: "支付成功"
        operator: "消费者"
        precondition: "支付网关回调成功"
        post_action: "扣减库存，派单至商家"
      - from: "PendingPay"
        to: "Cancelled"
        trigger: "超时30分钟 / 主动取消"
        operator: "系统 / 消费者"
        precondition: "未支付"
        post_action: "释放库存"
      - from: "PendingShip"
        to: "PendingRecv"
        trigger: "商家发货"
        operator: "药店商家"
        precondition: "WMS出库完成"
        post_action: "通知物流取件"
      - from: "PendingShip"
        to: "Cancelled"
        trigger: "发货前取消"
        operator: "消费者"
        precondition: "尚未出库"
        post_action: "全额退款"
      - from: "PendingRecv"
        to: "Completed"
        trigger: "确认收货 / 7天自动确认"
        operator: "消费者 / 系统"
        precondition: "签收或超时"
        post_action: "发放积分，订单完成"
      - from: "PendingRecv"
        to: "Refunding"
        trigger: "申请退款（已签收前）"
        operator: "消费者"
        precondition: "订单未签收"
        post_action: "冻结订单，进入退款流程"
      - from: "Completed"
        to: "Refunding"
        trigger: "申请售后（7天内）"
        operator: "消费者"
        precondition: "完成未超7天"
        post_action: "开启售后流程"
      - from: "Refunding"
        to: "Refunded"
        trigger: "退款完成"
        operator: "平台运营"
        precondition: "商家审核通过"
        post_action: "退款至原账户"
      - from: "Refunding"
        to: "PendingRecv/Completed"
        trigger: "拒绝退款"
        operator: "药店商家"
        precondition: "审核拒绝"
        post_action: "回退原状态，通知用户/客服介入"

    diagram: |
      ```mermaid
      stateDiagram-v2
        [*] --> RxPending : 创建（处方药）
        [*] --> PendingPay : 创建（OTC直通）
        RxPending --> PendingPay : 审方通过
        RxPending --> Cancelled : 审方驳回
        PendingPay --> PendingShip : 支付成功
        PendingPay --> Cancelled : 超时30min/取消
        PendingShip --> PendingRecv : 商家发货
        PendingShip --> Cancelled : 发货前取消
        PendingRecv --> Completed : 确认收货/7天自动
        PendingRecv --> Refunding : 申请退款
        Completed --> Refunding : 申请售后(7天内)
        Refunding --> Refunded : 退款完成
        Refunding --> PendingRecv : 拒绝退款
        Refunding --> Completed : 拒绝退款
        Completed --> [*]
        Cancelled --> [*]
        Refunded --> [*]
      ```

  # ============================================
  # 8. 解决方案概括
  # ============================================
  solution:
    patterns:
      - desc: "**DDD领域驱动设计**：8大业务域按DDD划分——核心交易域4个（用户/商品/交易/处方）强一致，支撑域3个（履约/营销/服务）最终一致，治理域1个（风控合规）横切关注点"
        sources: ["互联网药店业务建模文档"]
      - desc: "**处方药合规链路**：处方药业务线独立于OTC，通过处方网关→处方服务→药师工作台形成独立合规审核链路，审方通过后订单才可进入支付发货"
        sources: ["互联网药店业务建模文档"]
      - desc: "**OTC/处方药差异化路由**：通过决策节点区分药品类型——OTC走捷径（下单→支付→发货），处方药走审方链路（下单→审方→支付→发货），共用后续履约流程"
        sources: ["互联网药店业务建模文档"]
      - desc: "**订单状态机覆盖全生命周期**：8核心状态+退款流程独立于主链，退款被拒后回退原状态（非新建订单），保持状态可追溯"
        sources: ["互联网药店业务建模文档"]
      - desc: "**RBAC职责分离**：审方权独占药师、退款审批权在平台运营、发货权在药店商家——三者互斥防舞弊，消费者仅对自有订单有操作权"
        sources: ["互联网药店业务建模文档"]
    best_practices:
      - desc: "核心交易链路采用同步调用（HTTP/gRPC）保证强一致，非核心链路（通知/积分/券核销）通过MQ异步解耦，避免反向同步调用造成的耦合"
        sources: ["互联网药店业务建模文档"]
      - desc: "处方审核是合规底线——24小时内完成、每张处方最多调配3次、电子处方需药师电子签名"
        sources: ["互联网药店业务建模文档"]
      - desc: "冷链药品在物流环节引入温控监控模块，温度异常实时告警并暂停配送"
        sources: ["互联网药店业务建模文档"]
      - desc: "退款流程支持从待收货和已完成两个状态触发，未发货订单支持直接退款（跳过寄回验收环节）"
        sources: ["互联网药店业务建模文档"]

