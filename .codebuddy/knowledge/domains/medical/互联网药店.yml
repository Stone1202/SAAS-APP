    # v1.2.0 新增：处方外流接收全链路（核心场景——基于86号政策深度细化）
    - id: "SC-RXSTORE-012"
      name: "处方外流接收全链路——电子处方中心→药店审方调配核销闭环"
      theme_id: "THM-RXSTORE-012"
      description: |
        基于国家医保局〔2024〕86号通知和2025年全国31省电子处方中心互联互通实践，
        覆盖处方从互联网医院经电子处方中心流转至药店、再经6阶段（处方流入→验真→审方→患者授权→调配→核销回传）
        完成闭环的完整业务链路。含双通道药品特殊管理、PASS前置审方、四查十对、四重验证、追溯码采集、
        5分钟回传等合规要点。
      trigger: "互联网医院开具电子处方并上传至电子处方中心"
      closure: "处方核销→20项核心数据5分钟内回传→处方资料存档15年"
      participant_roles: ["消费者(患者)", "电子处方中心(系统)", "互联网医院(处方来源)", "药店药师", "执业药师", "医保稽核(监管)", "药品追溯协同平台"]
      depends_on: []
      depended_by: ["SC-RXSTORE-002", "SC-RXSTORE-003", "SC-RXSTORE-005"]
      flow_sketch: |
        flowchart TD
          subgraph P1["🏥 处方产生"]
            A["互联网医院医生开具电子处方"] --> B["系统自动加盖CA电子签章"]
            B --> C["国密算法加密→上传电子处方中心"]
            C --> D["处方中心分配全局唯一RxID"]
          end

          subgraph P2["📡 处方流转"]
            D --> E["智能匹配具备双通道资质的定点药店"]
            E --> F{"药店双通道+特殊药品<br/>经营许可资质校验"}
            F -->|无资质| F1["拒绝接收+回传处方中心"]
            F -->|有资质| G["国密加密推送处方至药店<br/>RxID查重校验"]
          end

          subgraph P3["🔐 处方验真"]
            G --> H["CA公钥验签"]
            H --> I{"电子签章有效？"}
            I -->|否| I1["拒收+上报异常"]
            I -->|是| J{"处方有效期72h内？<br/>（特殊延至7日）"}
            J -->|已过期| J1["标记过期+回传+释放锁定"]
            J -->|有效期内| K["校验开具机构备案资质"]
            K --> K1["验真通过→进入审方队列"]
          end

          subgraph P4["💊 AI前置审方+药师四查十对"]
            K1 --> L["PASS系统AI前置审核<br/>11强制拦截规则+12风险提醒"]
            L --> M{"触发强制拦截？"}
            M -->|是| M1["自动驳回+注明拦截原因"]
            M -->|否| N["药师执行四查十对<br/>①查处方:科别/姓名/年龄<br/>②查药品:药名/剂型/规格/数量<br/>③查配伍禁忌:性状/用法用量<br/>④查用药合理性:临床诊断"]
            N --> O{"审方通过？"}
            O -->|驳回| O1["注明原因→回传处方中心<br/>→通知患者"]
            O -->|通过| P["执业药师电子签名<br/>标记审方完成"]
          end

          subgraph P5["👤 患者授权"]
            P --> Q["患者医保APP/小程序<br/>查看处方详情+可选药店列表"]
            Q --> R["患者选择当前药店"]
            R --> S["二次身份核验<br/>刷脸/医保电子凭证扫码"]
            S --> T["RxID锁定至当前药店<br/>其他药店不可再接收"]
          end

          subgraph P6["📦 四重验证调配"]
            T --> U{"第一重验证<br/>患者身份：姓名+身份证<br/>+医保凭证三要素"}
            U -->|不匹配| U1["拒绝调配+记录异常"]
            U -->|匹配| V{"第二重验证<br/>处方有效性：RxID有效<br/>+未过期+已授权"}
            V -->|无效| V1["拒绝+标记处方异常"]
            V -->|有效| W{"第三重验证<br/>药品追溯码：逐盒扫描<br/>与处方药品编码匹配"}
            W -->|不匹配| W1["拒绝调配+追溯码异常上报"]
            W -->|匹配| X{"第四重验证<br/>执业药师审核记录<br/>签名+审核时间在有效期内"}
            X -->|无效| X1["拒绝+要求重新审方"]
            X -->|有效| Y["四重验证全部通过<br/>处方标记「已调配」"]
          end

          subgraph P7["✅ 核销回传"]
            Y --> Z["医保结算"]
            Z --> AA["处方标记「已核销」<br/>不可二次复用"]
            AA --> AB["5分钟内组装20项<br/>核心数据包回传电子处方中心"]
            AB --> AC{"回传成功？"}
            AC -->|是| AD["接收回传确认<br/>记录回传日志"]
            AC -->|超时| AE["L1预警(5min)→药店提醒"]
            AE --> AF["L2升级(10min)→通知医保部门"]
            AF --> AG["L3稽核(30min)→暂停药店<br/>处方接收权限"]
            AD --> AH["追溯码同步药品追溯协同平台"]
            AH --> AI["操作日志≥6个月区块链存证<br/>处方资料保存15年"]
            AI --> AJ["全链路闭环完成 ✅"]
          end

          style P2 fill:#e3f2fd,stroke:#1565c0
          style P3 fill:#fff3e0,stroke:#e65100
          style P4 fill:#e8f5e9,stroke:#2e7d32
          style P5 fill:#fce4ec,stroke:#c62828
          style P6 fill:#f3e5f5,stroke:#6a1b9a
          style P7 fill:#e0f2f1,stroke:#00695c
      sources: ["国家医保局〔2024〕86号通知", "电子处方流转合规实务指南", "国家医保局电子处方中心技术规范", "处方管理办法"]
      priority: "critical"

    # v1.2.0 新增：处方流转异常处理场景
    - id: "SC-RXSTORE-013"
      name: "处方外流异常处理与稽核"
      theme_id: "THM-RXSTORE-012"
      description: "覆盖处方外流接收全链路中的异常场景处理——验签失败/重复RxID/处方过期/追溯码异常/回传超时/患者授权超时/资质不足，以及医保稽核介入和药店权限管控"
      trigger: "处方外流流程中任一环节出现异常"
      closure: "异常处置完成，预警关闭或稽核结论归档"
      participant_roles: ["药店药师", "电子处方中心(系统)", "医保稽核", "药店管理员"]
      depends_on: ["SC-RXSTORE-012"]
      depended_by: []
      flow_sketch: |
        flowchart TD
          A["异常触发"] --> B{"异常类型？"}
          B -->|验签失败| C["自动拒收+上报电子处方中心<br/>+通知来源医院重新签章"]
          B -->|重复RxID| D["自动拦截+标记重复使用<br/>+L2级预警通知医保稽核"]
          B -->|处方过期| E["自动标记已过期+释放药店锁定<br/>+通知患者重新就医开方"]
          B -->|追溯码异常| F["暂停调配+L2预警<br/>+药店自查+上报药监"]
          B -->|回传超时5min| G["L1预警→提醒药店"]
          G --> G2["超时10min→L2通知医保部门"]
          G2 --> G3["超时30min→L3医保稽核<br/>+暂停药店处方接收权限"]
          B -->|患者授权超时| H["处方锁定自动释放<br/>+通知患者重新授权"]
          B -->|资质不足| I["药店拒绝接收<br/>+回传处方中心重新匹配"]
          G3 --> J["医保稽核介入"]
          D --> J
          F --> J
          J --> K["稽核结论"]
          K --> L{"处置"}
          L -->|整改通过| M["恢复药店权限+关闭预警"]
          L -->|严重违规| N["永久取消双通道资质<br/>+行政处罚"]
      sources: ["国家医保局〔2024〕86号通知", "电子处方流转合规实务指南"]
      priority: "high"

  # ============================================
  # 产品架构（5层）
  # ============================================
  product_architecture:
    layers:
      - name: "用户接入层"
        components: ["C端消费者App/小程序/H5", "B端商家后台Web", "药师工作台", "运营管理后台", "物流配送端App", "开放API"]
        responsibility: "多端用户入口，统一身份认证与权限管理"
      - name: "应用前端层（BFF/API Gateway）"
        components: ["用户网关（Auth/限流）", "商品网关（搜索/推荐）", "交易网关（订单/支付）", "处方网关（审方/合规）", "运营网关（管理）"]
        responsibility: "统一接口协议（RESTful/gRPC），路由、限流、鉴权"
      - name: "业务服务层（中台）"
        components: ["用户服务", "商品服务", "订单服务", "处方服务", "支付服务", "物流服务", "营销服务", "搜索推荐", "消息服务", "风控服务", "问诊服务", "仓储服务"]
        responsibility: "核心业务逻辑，领域模型，业务规则"
      - name: "数据存储层"
        components: ["MySQL集群（业务主库）", "Redis集群（缓存/会话）", "Elasticsearch（全文搜索）", "对象存储OSS（图片/处方文件）", "消息队列MQ", "数据仓库（BI分析）"]
        responsibility: "数据持久化、缓存、搜索、分析"
      - name: "基础设施层"
        components: ["云服务器（弹性伸缩）", "CDN加速", "负载均衡", "监控告警（链路追踪）", "日志系统（ELK）", "安全防护（WAF/DDoS）"]
        responsibility: "底层基础设施，安全与运维"

  # ============================================
  # 业务架构（8大域DDD划分）
  # ============================================
  business_architecture:
    domains:
      - name: "用户域"
        type: "core"
        capabilities: ["账号注册/登录", "实名认证（身份证OCR）", "个人健康档案", "用药史/过敏史", "会员等级与积分", "收货地址管理", "账户安全设置", "隐私授权管理"]
        aggregate_root: "User"
        description: "用户身份与健康信息管理"
      - name: "商品域"
        type: "core"
        capabilities: ["商品信息管理（SPU/SKU）", "品类/分类体系", "库存管理（多仓）", "价格与调价策略", "处方药/OTC标记", "药品说明书管理", "药品监管码追溯", "供应商管理"]
        aggregate_root: "Product"
        description: "药品商品与库存管理"
      - name: "交易域"
        type: "core"
        capabilities: ["购物车管理", "订单创建/确认", "订单状态机管理", "支付与回调处理", "退款/售后流程", "医保结算对接", "发票管理", "交易对账"]
        aggregate_root: "Order"
        description: "订单生命周期管理"
      - name: "处方域"
        type: "core"
        capabilities: ["处方上传（拍照/OCR）", "处方结构化解析", "药师在线审方", "电子处方签发", "处方调配记录", "处方效期管理", "处方追溯（合规）", "复用次数限制"]
        aggregate_root: "Prescription"
        description: "处方审核与合规流转"
      - name: "履约域"
        type: "supporting"
        capabilities: ["仓储管理（WMS）", "多仓调拨", "拣货/复核/打包/出库", "物流配送（同城/快递）", "冷链温控/配送时效", "签收/拒收/改派管理"]
        description: "订单履约与物流配送"
      - name: "营销域"
        type: "supporting"
        capabilities: ["优惠券/满减/折扣", "限时促销/秒杀", "积分体系/兑换", "会员权益/等级", "慢病管理/健康计划"]
        description: "营销促销与会员权益"
      - name: "服务域"
        type: "supporting"
        capabilities: ["在线问诊（互联网医院）", "药师在线咨询", "用药指导/用药提醒", "售后客服/投诉处理", "评价/社区"]
        description: "增值服务与客服"
      - name: "风控合规域"
        type: "governance"
        capabilities: ["实名认证核验", "处方药限购校验", "药品监管码追溯", "异常交易风控", "敏感词过滤", "数据安全与隐私保护", "GSP合规审计", "医保对接合规"]
        description: "跨域横切关注点（AOP/拦截器）"
