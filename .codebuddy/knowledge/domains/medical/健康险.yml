# ============================================
# 健康险领域知识 v1.0.0
# 分类：medical
# 学习日期：2026-07-26
# 学习方法：traditional（基于公开产品文档+行业解读的文本学习）
# 来源：好医保2025-2026产品体系+糖尿病保险理赔规则+银保监健康险监管框架
# ============================================

domain:
  name: "健康险"
  category: "medical"
  version: "v1.0.0"
  learned_at: "2026-07-27"
  learning_method: "traditional"
  source_urls:
    - "https://www.sohu.com/a/989509198_122390890"
    - "https://www.sohu.com/a/943388415_122390890"
    - "https://www.sohu.com/a/977952495_122390890"
    - "https://ailegal.baidu.com/legalarticle/qadetail?id=5c92b535850c23250710"
  description: "健康保险是医疗保障体系的商业补充，涵盖百万医疗险、重疾险、门诊险、慢病险等品类。互联网健康险以智能核保、保证续保、慢病友好为核心特征，覆盖糖尿病等60种常见慢病。"
  curation_policy: "保留：产品分类体系、慢病保障范围、理赔流程关键节点、智能核保机制、保证续保规则。过滤：具体保险产品价格和促销信息、单一公司品牌推广内容、非标准化产品细节。"
  status: "draft"

  # ============================================
  # 角色清单
  # ============================================
  domain_roles:
    - role_id: "ROLE-健康险-001"
      name: "投保人（患者/家属）"
      type: "payer"
      core_need: "以合理保费获得慢性病相关医疗保障，出险时顺利理赔"
      serves: []

    - role_id: "ROLE-健康险-002"
      name: "保险公司"
      type: "integrator"
      core_need: "精准风控定价，控制赔付率，保持产品线盈利"
      serves: ["投保人"]

    - role_id: "ROLE-健康险-003"
      name: "第三方平台（互联网保险渠道）"
      type: "integrator"
      core_need: "提供顺畅的投保/理赔体验，提升转化率和续保率"
      serves: ["投保人", "保险公司"]

    - role_id: "ROLE-健康险-004"
      name: "医疗机构"
      type: "beneficiary"
      core_need: "赔付流程顺畅，减少患者自费垫付压力"
      serves: ["投保人"]

    - role_id: "ROLE-健康险-005"
      name: "银保监监管机构"
      type: "regulator"
      core_need: "产品合规、信息披露充分、消费者权益保护"
      serves: ["投保人"]

  # ============================================
  # 商业问题清单
  # ============================================
  business_problems:
    - id: "BP-健康险-001"
      problem: "慢性病患者投保难——传统保险对糖尿病/高血压等慢病人群直接拒保或高额加费"
      pain_point: "4.2亿糖尿病患者（全球）大部分缺乏商业保险保障，自费负担重"
      value: "通过智能核保+慢病专属产品，让慢病患者以合理价格获得保障"
      evidence: "2026年互联网保险智能核保通过率提升至85.7%（较传统方式提高30个百分点）"
      priority: "high"
      priority_rationale: "直接关系到糖友之家用户群的保险接入能力"
      scrm_relevance: "糖友之家可集成保险推荐/投保入口，提升平台对糖友的核心价值"
      related_roles: ["ROLE-健康险-001", "ROLE-健康险-002"]
      related_problems: ["BP-健康险-002"]

    - id: "BP-健康险-002"
      problem: "理赔流程复杂——慢病患者就医频繁，多次理赔材料提交体验差"
      pain_point: "传统理赔需要纸质病历+发票+费用清单，每次就医都要重复提交"
      value: "数字化理赔缩短至平均2.3个工作日，慢病通过率达97.8%"
      evidence: "好医保2026年理赔数据：平均理赔时效2.3工作日，通过率97.8%"
      priority: "high"
      priority_rationale: "理赔体验直接影响续保率和用户满意度"
      scrm_relevance: "糖友之家可对接保险理赔API，实现一站式理赔提交"

    - id: "BP-健康险-003"
      problem: "保证续保承诺的边界不清——用户担心理赔后次年无法续保"
      pain_point: "传统一年期产品存在断保风险，慢病患者尤其敏感"
      value: "保证续保条款（部分产品终身保证续保）消除用户长期担忧"
      evidence: "旗舰版产品保证续保至100岁，理赔后不拒保"
      priority: "medium"
      priority_rationale: "影响用户购买决策的关键因素"

  # ============================================
  # 1. 业务泳道图
  # ============================================
  swimlane:
    roles: ["投保人", "第三方平台", "保险公司", "医疗机构"]
    stages: ["投保", "核保", "承保", "就医", "理赔", "续保"]
    actions:
      - role: "投保人"
        stage: "投保"
        action: "在线填写健康状况+上传病历+完成智能核保问答"
        input: "身份信息、病史、用药清单、近两年病历"
        output: "核保结果"
        sources: ["好医保产品说明 2025-2026"]

      - role: "保险公司"
        stage: "核保"
        action: "智能核保系统评估风险→输出承保方案（正常承保/加费/责任免除/拒保）"
        input: "健康告知+病历"
        output: "核保结论"
        sources: ["互联网保险核保实践 2026"]

      - role: "保险公司"
        stage: "承保"
        action: "生成电子保单→发送投保确认→进入等待期"
        input: "核保通过信息"
        output: "电子保单"
        sources: ["银保监电子保单规范"]

      - role: "投保人"
        stage: "就医"
        action: "慢病门诊/住院→保存所有票据病历"
        input: "医疗服务"
        output: "费用票据、诊断记录"
        sources: ["慢病保险保障范围"]

      - role: "保险公司"
        stage: "理赔"
        action: "在线提交理赔→AI审核→赔付/反馈补充材料"
        input: "就诊记录、费用票据、诊断证明"
        output: "理赔结论、赔付金额"
        sources: ["好医保2026理赔数据"]

      - role: "保险公司"
        stage: "续保"
        action: "到期自动续保→如保证续保产品不因健康状况变化拒保"
        input: "续保意向"
        output: "新保单"
        sources: ["保证续保条款"]

  # ============================================
  # 2. 业务流程图
  # ============================================
  flow:
    happy_path: "用户在线投保→智能核保通过→承保出单→等待期后→就医→在线提交理赔→AI审核→2.3工作日赔付→到期自动续保→不因健康状况变化拒保"
    exceptions:
      - desc: "智能核保不通过：输出拒保/加费承保/责任免除方案→用户确认或放弃"
        sources: ["互联网保险智能核保实践"]
      - desc: "理赔材料不全：系统提示缺少材料清单→用户补充提交→重新审核"
        sources: ["慢病理赔流程"]
      - desc: "等待期内出险：等待期内确诊疾病不在保障范围→不予赔付"
        sources: ["保险条款通则"]
    branches:
      - desc: "慢病理赔优先通道：糖尿病/高血压等慢病住院→优先审核→快速赔付"
        sources: ["好医保慢病特色服务"]

  # ============================================
  # 3. 业务信息流
  # ============================================
  info_flow:
    entities:
      - name: "健康告知"
        producer: "投保人"
        consumer: "保险公司核保系统"
        depends_on: "如实告知义务"
        sources: ["保险法第16条"]

      - name: "智能核保报告"
        producer: "保险公司AI核保"
        consumer: "投保人、承保系统"
        depends_on: "健康告知+病历数据"
        sources: ["互联网保险智能核保 2026"]

      - name: "电子保单"
        producer: "保险公司承保系统"
        consumer: "投保人"
        depends_on: "核保通过+保费支付"
        sources: ["银保监电子保单规范"]

      - name: "理赔申请"
        producer: "投保人"
        consumer: "保险公司理赔系统"
        depends_on: "就医完成+材料齐全"
        sources: ["保险理赔流程"]

      - name: "理赔结论"
        producer: "保险公司理赔系统"
        consumer: "投保人、医疗机构（直付模式）"
        depends_on: "AI审核+人工复核（大额）"
        sources: ["好医保2026理赔数据"]

    cross_system: "用户端APP↔保险平台API↔医院HIS系统（直付）↔银保监监管平台"

  # ============================================
  # 4. 业务操作矩阵（角色×状态×操作）
  # ============================================
  operation_matrix:
    roles: ["投保人", "保险公司"]
    states: ["待投保", "核保中", "承保成功", "等待期", "保障中", "理赔中", "已理赔", "已拒赔", "已到期", "续保中"]

    matrix:
      - role: "投保人"
        state: "待投保"
        operations: ["浏览产品", "填写健康告知", "提交投保申请"]
        sources: ["互联网保险投保流程"]

      - role: "保险公司"
        state: "核保中"
        operations: ["AI智能核保", "输出核保结论", "人工复核（高保额）"]
        sources: ["智能核保系统 2026"]

      - role: "投保人"
        state: "保障中"
        operations: ["就医", "在线提交理赔", "续保"]
        sources: ["慢病保险使用流程"]

      - role: "保险公司"
        state: "理赔中"
        operations: ["接收申请", "AI审核", "赔付/要求补充材料/拒赔"]
        sources: ["慢病理赔流程"]

  # ============================================
  # 5. 解决方案概括
  # ============================================
  solution:
    patterns:
      - desc: "慢病人群专属产品——覆盖60种慢性病+1826种常用药品+36种特药，含慢病特殊门诊报销"
        sources: ["好医保慢病产品体系 2026"]
      - desc: "智能核保替代人工——在线问答完成核保，慢病通过率85.7%，秒级出结果"
        sources: ["互联网保险智能核保 2026"]
      - desc: "保证续保机制——旗舰版保证续保至100岁，理赔后不拒保，消除慢病患者断保焦虑"
        sources: ["好医保长期医疗旗舰版"]

    tech_considerations:
      - desc: "保险API对接：投保/核保/理赔/续保全链路API，支持嵌入式投保（H5/小程序）"
        sources: ["互联网保险渠道技术规范"]
      - desc: "健康数据互通：保单数据与电子病历/处方平台的合规对接（需用户授权）"
        sources: ["医疗健康数据互通规范"]

    best_practices:
      - desc: "糖尿病理赔参考：重疾险需达严重并发症标准（酮症酸中毒昏迷/截肢等）才赔付；医疗险按住院和特殊门诊实际费用报销"
        sources: ["糖尿病保险理赔实践"]
      - desc: "如实健康告知原则：投保时需准备近两年病历+用药清单+检查报告，隐瞒病史将导致理赔纠纷"
        sources: ["保险法第16条"]
      - desc: "Q-健康险-001 糖友之家集成保险入口：在用户健康管理页面嵌入保险推荐，基于用户健康数据精准匹配慢病险产品"
        sources: ["SugarMate脑暴v5.0需求推导"]
