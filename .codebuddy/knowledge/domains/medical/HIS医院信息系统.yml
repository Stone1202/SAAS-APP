# ============================================
# 跨系统通道
# ============================================
cross_system_channels: |
  HIS作为医院核心系统，通过标准化协议与各子系统/外部系统交互：
  
  1. **HIS↔LIS/PACS（检查检验）**：HL7 V2.5 ORM^O01申请→ORU^R01报告回传，DICOM 3.0 C-STORE影像传输，ASTM/RS232仪器接口
  
  2. **HIS↔EMR（电子病历）**：FHIR R4标准，Patient/Encounter/Observation/MedicationRequest资源模型，病历互操作与共享
  
  3. **HIS↔医保平台**：医保专线，实名认证→费用上传→结算返回→目录下载→月度对账，DRG/DIP结算
  
  4. **HIS↔手术麻醉系统**：REST API手术申请/审批/排程，RS232监护仪数据5秒采样自动采集
  
  5. **HIS↔PIVAS（静配中心）**：REST API医嘱推送→审方→排批→配置→成品配送通知(Kafka)
  
  6. **HIS↔药库/供应链**：REST API采购计划→入库→出库→库存预警→效期管理
  
  7. **HIS↔区域卫生平台**：HQMS上报、传染病直报、肿瘤登记、卒中上报、健康档案共享
  
  8. **HIS↔财务/HRP系统**：费用明细推送、科室成本核算、绩效分析，REST API定时同步
  
  9. **HIS↔移动应用**：HTTPS REST+WebSocket推送，患者端(预约/缴费/查报告)+医护端(查房/消息/审批)
  
  10. **HIS↔院感/质控系统**：Kafka实时数据流(检验结果/抗生素/体温)→院感筛查→暴发预警
  
  11. **HIS↔互联网医院/药店（处方外流）**：电子处方中心标准化接口，RxID唯一码，国密加密，CA签章

