# ============================================
# 领域知识：HIS 医院信息系统
# 版本：v1.0.0（首版：基于HIS业务架构建模详细文档V2.0——25+角色协作梳理）
# 分类：medical（医疗健康）
# 学习方法：传统模式（traditional）
# 来源：HIS业务架构建模详细文档V2.0（HTML + 5个分部文件，350KB+）
#   25+角色全景图×五层产品架构×13业务能力域×6大场景泳道
#   ×6大业务流×6条信息流×8个状态机×8个业务域操作矩阵
# ============================================

domain:
  name: "HIS医院信息系统"
  category: "medical"
  version: "v1.0.0"
  learned_at: "2026-07-24"
  learning_method: "traditional"
  source_urls:
    - "file:HIS业务架构建模详细文档.html（V2.0详细版，25+角色协作，UML 2.5规范）"
  description: |
    HIS（Hospital Information System）医院信息系统是覆盖医院运营全流程的核心业务平台，
    涵盖患者服务、门急诊诊疗、住院诊疗、临床诊疗（核心）、护理管理、药事管理、检查检验、
    手术麻醉、财务管理、病案管理、质控管理、感染管理、运营管理、数据分析等13+业务能力域。
    涉及25+角色协作，遵循HL7 V2.5/FHIR R4/DICOM 3.0等医疗互操作标准，
    支撑三级查房、危急值闭环、手术安全核查（Time-Out）、DRG/DIP医保付费、
    等保三级安全合规等医疗核心制度。
  curation_policy: |
    本知识从HIS业务架构建模详细文档V2.0（HIS业务专家组编制，涵盖患者服务/临床诊疗/护理/
    药事/医技/财务/管理/支撑8大类25+角色）提取，保留：产品架构（五层）、业务架构（13域70+子模块）、
    业务泳道（6大场景）、业务流（6条）、信息流（6条含协议规范）、状态机（8个对象×125+迁移）、
    操作矩阵（8域×80+权限条目）。
    过滤：具体技术实现代码（C#/Java/Python）、UI布局细节、部署脚本。
  status: "draft"

# ============================================
# 产品架构（5层）
# ============================================
product_architecture:
  description: "HIS采用五层分层架构，遵循高内聚低耦合原则"
  layers:
    - name: "展示层(Presentation)"
      label: "面向各类终端用户"
      components:
        - { name: "门诊工作站", desc: "门诊医生/护士诊疗工作台", tech: "C/S C# WPF / Electron", users: "门诊医生、分诊护士" }
        - { name: "住院工作站", desc: "住院医生/护士工作台", tech: "C/S C# WPF / Electron", users: "住院医师、主治医师、病房护士" }
        - { name: "急诊工作站", desc: "急诊绿通道专用，先诊疗后付费", tech: "C/S + 移动端", users: "急诊医生、急诊护士" }
        - { name: "手术麻醉系统", desc: "手术排班/麻醉记录/监护采集", tech: "C/S + 设备接口", users: "麻醉师、手术室护士、主刀医生" }
        - { name: "管理后台", desc: "系统管理/字典/权限/监管", tech: "B/S Vue3 + ElementPlus", users: "信息科、管理层、职能科室" }
        - { name: "移动应用", desc: "患者端+医护端App", tech: "Flutter / 微信小程序", users: "患者、医生、护士" }
        - { name: "自助终端", desc: "挂号/缴费/打印/发卡", tech: "Android Kiosk", users: "患者" }
    - name: "应用服务层(Service)"
      label: "横切关注点"
      components:
        - { name: "统一认证SSO", desc: "单点登录/CA签名/多因素认证", tech: "OAuth2 + JWT / Keycloak" }
        - { name: "消息通知", desc: "短信/微信/App Push/站内信", tech: "RabbitMQ + 模板引擎" }
        - { name: "工作流引擎", desc: "审批流程编排/退费/医嘱审核", tech: "Activiti / Flowable BPMN" }
        - { name: "报表服务", desc: "日报/月报/卫统/HQMS上报", tech: "JasperReports / FineReport" }
        - { name: "规则引擎", desc: "合理用药/医保审核/院感预警", tech: "Drools / 自研规则平台" }
        - { name: "权限中心", desc: "RBAC+ABAC混合权限模型", tech: "自研 / Casbin" }
        - { name: "日志审计", desc: "操作追溯/合规审计/告警", tech: "ELK Stack" }
    - name: "业务领域层(Domain)"
      label: "13个业务能力域"
      components:
        - { name: "患者服务域", desc: "挂号/预约/分诊/建档" }
        - { name: "门急诊诊疗域", desc: "门诊/急诊医生工作站" }
        - { name: "住院诊疗域", desc: "入院/出院/转科/医嘱" }
        - { name: "★临床诊疗域(核心)", desc: "诊断/路径/会诊/合理用药" }
        - { name: "护理管理域", desc: "护士站/护理记录/评估" }
        - { name: "药事管理域", desc: "处方/调剂/PIVAS/药库" }
        - { name: "检查检验域", desc: "LIS/PACS/PIS/危急值" }
        - { name: "手术麻醉域", desc: "手术/麻醉/复苏/监护" }
        - { name: "财务管理域", desc: "收费/医保/结算/票据" }
        - { name: "病案管理域", desc: "归档/编码/DRG/借阅" }
        - { name: "质控管理域", desc: "三级质控/单病种/不良事件" }
        - { name: "感染管理域", desc: "院感监测/暴发预警/耐药菌" }
        - { name: "运营管理域", desc: "床位/排班/物资/设备" }
        - { name: "数据分析域", desc: "BI/DRG/国考/上报" }
    - name: "数据层(Data)"
      label: "多模态数据持久化"
      components:
        - { name: "临床数据库", desc: "病历/医嘱/处方/报告", tech: "PostgreSQL 15 / Oracle" }
        - { name: "运营数据库", desc: "挂号/排班/床位/物资", tech: "MySQL 8.0 Cluster" }
        - { name: "影像数据库", desc: "DICOM影像存储", tech: "dcm4che + MinIO" }
        - { name: "数据仓库", desc: "BI分析/决策支持", tech: "Greenplum / ClickHouse" }
        - { name: "缓存集群", desc: "号源/字典/会话/限流", tech: "Redis 7.0 Cluster" }
        - { name: "文档存储", desc: "病历全文/报告/日志", tech: "MongoDB + Elasticsearch" }
    - name: "基础设施层(Infrastructure)"
      label: "互操作与运维"
      components:
        - { name: "集成平台ESB", desc: "系统间消息路由/转换", tech: "MuleES / 集成引擎" }
        - { name: "HL7/FHIR引擎", desc: "医疗互操作标准", tech: "HL7 V2.5 / FHIR R4" }
        - { name: "API网关", desc: "接口路由/限流/鉴权", tech: "Kong / Apigee" }
        - { name: "消息中间件", desc: "异步消息/事件驱动", tech: "Kafka / RabbitMQ" }
        - { name: "容器平台", desc: "微服务编排/部署", tech: "K8s / Docker" }
        - { name: "安全/灾备", desc: "等保三级/异地灾备", tech: "WAF+IDS+VPN" }

# ============================================
# 系统集成标准
# ============================================
integration_standards:
  - { standard: "HL7 V2.5", scenario: "HIS↔LIS/PACS消息交互", messages: "ADT入出转/ORM医嘱/ORU报告" }
  - { standard: "FHIR R4", scenario: "新一代互操作标准", resources: "Patient/Encounter/Observation" }
  - { standard: "DICOM 3.0", scenario: "影像传输与存储", operations: "C-STORE/C-FIND/C-MOVE" }
  - { standard: "医保专线", scenario: "医保结算/身份核验", type: "国家医保局规范" }
  - { standard: "区域卫生平台", scenario: "数据上报与共享", type: "HQMS/传染病直报/健康档案" }
  - { standard: "ASTM/RS232", scenario: "检验仪器/监护设备", type: "仪器接口协议" }

# ============================================
# 部署与安全
# ============================================
deployment:
  production: "双活数据中心，RPO≤15分钟，RTO≤30分钟"
  app_layer: "Kubernetes容器编排，微服务部署，HPA自动伸缩"
  database: "主从复制+读写分离，PgBouncer连接池，PITR时间点恢复"
  security: "等保三级，WAF+IDS，数据库审计，VPN专线接入医保网"
  monitoring: "Prometheus+Grafana，全链路追踪Jaeger，日志集中ELK"

# ============================================
# 角色体系
# ============================================
roles:
  categories:
    - { id: "CAT-01", name: "患者服务类", count: 3, roles: ["患者/家属", "挂号员", "导诊/分诊护士"] }
    - { id: "CAT-02", name: "临床诊疗类", count: 5, roles: ["门诊医生", "急诊医生", "住院医师", "主治/主任医师", "科主任"] }
    - { id: "CAT-03", name: "护理类", count: 3, roles: ["病房护士", "手术室护士", "护理部主任"] }
    - { id: "CAT-04", name: "药事类", count: 3, roles: ["门诊药剂师", "住院药剂师", "静配中心药师"] }
    - { id: "CAT-05", name: "医技类", count: 3, roles: ["检验科技师", "影像科技师", "病理医师"] }
    - { id: "CAT-06", name: "财务类", count: 2, roles: ["收费结算员", "医保专员"] }
    - { id: "CAT-07", name: "管理类", count: 5, roles: ["病案管理员", "医务科", "质控管理员", "感染科", "院长/副院长"] }
    - { id: "CAT-08", name: "支撑类", count: 2, roles: ["信息科管理员", "设备科管理员"] }
  total_count: 26
  key_principles:
    - "权限制衡：开立与执行分离（医生开医嘱→护士执行→药师审核）"
    - "三级查房：住院医师→主治医师→主任医师，逐级审核"
    - "危急值闭环：检验/影像技师→护士接收→医生确认→处置记录"
    - "医保三目：药品目录/诊疗项目/耗材目录，医生开立时实时校验"

# ============================================
# 业务架构（13域）
# ============================================
business_architecture:
  domain_packages:
    - name: "临床业务域"
      domains:
        - { id: "DOM-HIS-01", name: "患者服务域", sub_modules: 7, key_objects: ["挂号单", "预约单", "患者档案", "分诊队列"], depends_on: "→ 门急诊诊疗域" }
        - { id: "DOM-HIS-02", name: "门急诊诊疗域", sub_modules: 7, key_objects: ["门诊病历", "处方", "检查申请", "诊断(ICD-10)"], depends_on: "→ 临床核心域、检查检验域、药事管理域" }
        - { id: "DOM-HIS-03", name: "住院诊疗域", sub_modules: 7, key_objects: ["入院记录", "医嘱", "病程记录", "出院小结"], depends_on: "→ 临床核心域、护理管理域、财务管理域" }
        - { id: "DOM-HIS-04", name: "★临床诊疗域(核心)", sub_modules: 7, key_objects: ["诊断", "临床路径", "会诊单", "合理用药规则"], depends_on: "→ 药事管理域、检查检验域、病案管理域" }
    - name: "医技药事域"
      domains:
        - { id: "DOM-HIS-05", name: "药事管理域", sub_modules: 6, key_objects: ["处方", "药品库存", "PIVAS配置单"], depends_on: "← 临床诊疗域 → 财务管理域" }
        - { id: "DOM-HIS-06", name: "检查检验域", sub_modules: 6, key_objects: ["检验申请", "标本", "影像", "报告", "危急值"], depends_on: "← 临床诊疗域 → 临床核心域(报告回传)" }
        - { id: "DOM-HIS-07", name: "手术麻醉域", sub_modules: 6, key_objects: ["手术申请", "排班", "麻醉记录", "监护数据"], depends_on: "← 住院诊疗域 → 病案管理域" }
    - name: "管理支撑域"
      domains:
        - { id: "DOM-HIS-08", name: "财务管理域", sub_modules: 6, key_objects: ["费用明细", "结算单", "医保单", "票据"], depends_on: "← 全部临床域" }
        - { id: "DOM-HIS-09", name: "运营管理域", sub_modules: 5, key_objects: ["床位", "排班", "资源", "物资", "设备"], depends_on: "← 住院诊疗域" }
        - { id: "DOM-HIS-10", name: "数据分析域", sub_modules: 5, key_objects: ["BI指标", "DRG分组", "国考指标", "报表"], depends_on: "← 全部域(数据汇聚)" }
    - name: "质控病案域"
      domains:
        - { id: "DOM-HIS-11", name: "病案管理域", sub_modules: 5, key_objects: ["病案", "首页", "ICD编码", "DRG分组"], depends_on: "← 住院诊疗域、手术麻醉域" }
        - { id: "DOM-HIS-12", name: "质控管理域", sub_modules: 5, key_objects: ["质控指标", "不良事件", "PDCA记录"], depends_on: "← 全部临床域" }
        - { id: "DOM-HIS-13", name: "感染管理域", sub_modules: 5, key_objects: ["院感病例", "暴发预警", "耐药菌", "职业暴露"], depends_on: "← 检查检验域、药事管理域" }
        - { id: "DOM-HIS-14", name: "医务管理域", sub_modules: 4, key_objects: ["执业资质", "技术准入", "医疗纠纷"], depends_on: "← 全部临床域" }
  total_domains: 14
  total_sub_modules: 71

# ============================================
# 域详细说明
# ============================================
domain_details:
  - { id: "DOM-HIS-01", name: "患者服务域", modules: "预约挂号(多渠道/分时段15-30min);现场挂号(窗口/自助机,身份证/社保卡识别);退号管理(当日免费/隔日审批/已就诊不退);患者建档(首诊建档/信息变更审核/一人一档);分诊导诊(专科/专家/优先级:急老残孕);候诊管理(叫号队列/过号延后3位/重新排队)", rules: "同一患者同科同天≤3号;号源预约60%/现场40%;过号自动延后3位;爽约≥3次拉黑" }
  - { id: "DOM-HIS-02", name: "门急诊诊疗域", modules: "门诊工作站(叫号→问诊→查体→诊断→开方→检查申请);电子病历(结构化+非结构化/模板化);诊断编码(ICD-10/主诊/副诊/疑似);处方开立(西药/中成药/中药饮片/毒麻精处方);检查申请(检查互认规则/重复检查提示);急诊绿通道(先诊疗后付费/分诊I~IV级)", rules: "处方量限制(急3慢7长30天);抗菌药分级;毒麻精处方双人审核;急诊I级立即抢救;检查互认30日有效" }
  - { id: "DOM-HIS-03", name: "住院诊疗域", modules: "入院办理(入院证→床位确认→入院登记→预交金);住院医生站(入院记录→首次病程→日常病程→出院小结);医嘱管理(长期医嘱次日生效/临时医嘱即时/停止医嘱);三级查房(住院医师日2次→主治日1次→主任周2次);转科转床(转出发起→转入确认→费用结算→护理交接);出院管理(出院医嘱→出院带药→费用结算→出院小结→预约复诊)", rules: "长期医嘱当日开立次日8:00执行;停止医嘱当日23:59失效;转科需结清费用;出院需完成首页;入院记录24h内;首次病程8h内" }
  - { id: "DOM-HIS-04", name: "★临床诊疗域(核心)", modules: "诊断管理(初步→修正→确诊/支持鉴别诊断);临床路径(准入→变异记录→退出/完成/标准医嘱套餐);会诊管理(普通会诊24h/急诊会诊10min/MDT多学科);合理用药(配伍禁忌/相互作用/剂量/过敏/疗程校验);医嘱审核(住院医师开立→主治审核→药师审核→护士执行);病历质控(时效质控24h/8h/6h+内容质控缺陷评分)", rules: "入院记录24h内完成;首次病程8h内;手术记录24h内;出院小结出院前完成;修改需CA签名留痕;路径入径率≥70%" }
  - { id: "DOM-HIS-05", name: "药事管理域", modules: "处方审核(四查十对/处方点评每月≥30张/科);门诊药房(审方→调配→核对→发药→用药交代);住院药房(长期医嘱日审核→UDI单剂量摆药→配送);PIVAS(审方→排批→配置→成品核对→配送);药库管理(采购计划→入库→效期管理→盘点→出库);抗菌药管理(分级处方权/使用强度监控)", rules: "毒麻精双人双锁;近效期6月预警;高警示药品红色标识;抗菌药分级:非限制/限制/特殊使用级;DDDs<40" }
  - { id: "DOM-HIS-06", name: "检查检验域", modules: "LIS检验(申请→采样→接收→检测→审核→报告);PACS影像(预约→登记→检查→图像采集→诊断→报告);PIS病理(标本接收→固定→制片→诊断→报告);危急值管理(识别→技师确认→电话通知→护士接收→医生确认→处置);标本管理(条码→采集→转运→接收/拒收→保存→销毁);质控管理(IQC室内质控+EQC室间质控/Westgard多规则)", rules: "检验TAT常规≤4h/急诊≤1h;危急值10分钟内通知;同级检查互认30日有效;标本拒收:溶血/凝血/量不足" }
  - { id: "DOM-HIS-07", name: "手术麻醉域", modules: "手术申请(手术医嘱→申请→术前评估→审批→排班);术前评估(ASA分级→麻醉评估→术前禁食→知情同意);手术排班(急诊优先→择期按级排班→手术间分配);麻醉管理(麻醉计划→诱导→维持→复苏→记录);术中监护(监护仪自动采集BP/HR/SpO2/ETCO2/5秒采样);术后管理(PACU复苏→Steward评分→转回病房/ICU)", rules: "手术分级1~4级;≥3级术前讨论;Time-Out安全核查3次;器械三次清点;Steward评分≥4转出;ASA≥IV级高风险报备" }
  - { id: "DOM-HIS-08", name: "财务管理域", modules: "门诊收费(挂号费→诊查费→检查/检验费→药品费→收据);住院结算(预交金→日费用→中途结算→出院结算→多退少补);医保结算(身份核验→目录匹配→费用上传→结算返回→自付);退费管理(退费申请→审批→执行→原路退回);票据管理(电子票据/财政部统一/号段管理);日结对账(收费员日结→科室月结→财务总账)", rules: "退费需医生签字+收费员执行+科长审批(>5000元);医保拒付科室承担;日清日结" }
  - { id: "DOM-HIS-11", name: "病案管理域", modules: "病案归档(出院7个工作日内归档/逾期扣罚);病案首页(首页数据质控:逻辑校验+缺失校验);ICD编码(手术ICD-9-CM-3/诊断ICD-10/编码员审核);DRG分组(首页数据→DRG分组器→权重/费用标准);借阅管理(院内借阅审批/院外复印:患者授权+身份证)", rules: "出院7日内归档率≥95%;首页甲级率≥90%;ICD编码准确率≥95%;借阅期限≤30天" }
  - { id: "DOM-HIS-12", name: "质控管理域", modules: "三级质控(科室自查→职能部门督查→院级评审);单病种管理(纳入/排除标准/过程+结局指标);临床路径(入径率/完成率/变异率/退出率);不良事件(上报→分析→整改→追踪/PDCA闭环);质量指标(住院死亡率/重返率/感染率/手术并发症)", rules: "临床路径入径率≥70%;不良事件24h内上报;质量指标月度通报" }
  - { id: "DOM-HIS-13", name: "感染管理域", modules: "院感监测(院内感染自动筛查+手工上报);暴发预警(同期感染数超阈值自动预警);耐药菌管理(MRSA/CRE/VRE筛查隔离);抗菌药监管(DDDs/使用率/微生物送检率);职业暴露(锐器伤上报→评估→预防用药→追踪)", rules: "院感发病率<3%;多重耐药菌接触隔离;DDDs<40;手卫生依从性>90%;I类切口预防用药≤24h" }

# ============================================
# 业务主题
# ============================================
themes:
  - { id: "THM-HIS-01", name: "门诊全流程", desc: "预约挂号→分诊→候诊→问诊查体→诊断开方/开检查→缴费→检查检验→复诊确诊→取药→离院", priority: "high" }
  - { id: "THM-HIS-02", name: "急诊与绿色通道", desc: "急诊分诊I~IV级→I/II级绿通道先诊疗后付费→III/IV级常规急诊→去向决策(留观/入院/转科/离院)", priority: "critical" }
  - { id: "THM-HIS-03", name: "住院全流程", desc: "入院→三级查房→医嘱审核执行→检查检验→日常护理→手术(条件)→出院→病案归档", priority: "high" }
  - { id: "THM-HIS-04", name: "手术管理", desc: "手术申请→分级审批→麻醉评估→排班→Sign-In→Time-Out→手术操作→关腹清点→Sign-Out→复苏→转回病房", priority: "critical" }
  - { id: "THM-HIS-05", name: "检查检验与危急值", desc: "申请→采样/预约→执行→审核→报告→危急值闭环(10分钟内通知→确认→处置)", priority: "critical" }
  - { id: "THM-HIS-06", name: "药事管理", desc: "处方开立→合理用药预校验→药师四查十对审方→调配→发药→用药监护→处方点评→ADR上报", priority: "high" }
  - { id: "THM-HIS-07", name: "医保结算", desc: "身份核验→医保目录实时校验→费用上传→结算返回→月度对账→拒付处理", priority: "high" }
  - { id: "THM-HIS-08", name: "病案与质控", desc: "病案首页→ICD编码→DRG分组→三级质控→不良事件→数据上报", priority: "medium" }
  - { id: "THM-HIS-09", name: "护理管理", desc: "入院评估→日常护理→医嘱执行(三查七对)→生命体征监测→护理记录→交接班→出院指导", priority: "high" }
  - { id: "THM-HIS-10", name: "院感与公卫", desc: "院感监测→暴发预警→耐药菌管理→抗菌药监控→职业暴露→传染病直报", priority: "medium" }

# ============================================
# 业务规则
# ============================================
business_rules:
  # 门诊类
  - { id: "BR-HIS-001", name: "挂号与号源管理", trigger: "患者挂号时", behavior: "校验患者信息→判断是否爽约≥3次→校验科室号源→同一患者同科同天≤3号→号源预约60%/现场40%→生成挂号单", related_state: "待挂号→已挂号" }
  - { id: "BR-HIS-002", name: "门诊处方量限制", trigger: "门诊医生开处方", behavior: "急诊处方≤3天用量/慢性病≤7天/长期处方≤30天→毒麻精处方双人审核→抗菌药分级校验", related_state: "待开方→已开方" }
  - { id: "BR-HIS-003", name: "急诊分诊与绿通道", trigger: "急诊患者到达", behavior: "MEWS/REMS评分→I级(濒危)立即抢救0等待→II级(危重)10分钟内接诊→绿通道先诊疗后付费→留观≤72小时", related_state: "待分诊→抢救中/就诊中" }
  # 住院类
  - { id: "BR-HIS-004", name: "三级查房", trigger: "患者住院期间", behavior: "住院医师每日查房2次→主治医师每日1次→主任医师每周2次→查房记录逐级审核→诊疗方案调整", related_state: "在院→查房中" }
  - { id: "BR-HIS-005", name: "医嘱四级流转", trigger: "医生开立医嘱", behavior: "住院医师开立→主治医师审核(确认或修改)→住院药剂师审核(用药合理性)→病房护士三查七对执行→记录执行时间", related_state: "待审核→已审核→执行中→已完成/已停止" }
  - { id: "BR-HIS-006", name: "长期/临时医嘱规则", trigger: "医嘱生效时", behavior: "长期医嘱:当日开立次日8:00生效/每日执行至下达停止/停止当日23:59失效; 临时医嘱:即时生效/执行一次即完成", related_state: "执行中→已停止/已完成" }
  - { id: "BR-HIS-007", name: "转科管理", trigger: "转科申请", behavior: "转出科主任同意→转入科主任接收→费用结算(费用划断)→护理交接→医嘱迁移→床位释放与分配", related_state: "在院→转科中→在院(新科室)" }
  - { id: "BR-HIS-008", name: "出院条件与流程", trigger: "评估出院", behavior: "病情稳定∧检查完成∧治疗方案确定→主治医师审批→出院带药(≤7天)→费用结算→出院小结→病案首页(7日内)→床位终末消毒", related_state: "在院→待出院→已出院" }
  # 手术类
  - { id: "BR-HIS-009", name: "手术分级审批", trigger: "手术申请", behavior: "1-2级:科主任审批→3-4级:医务科审批→ASA≥IV级高风险报备→术前讨论(≥3级)→知情同意(患者/家属签字)", related_state: "待审批→已审批/已退回" }
  - { id: "BR-HIS-010", name: "手术安全核查(Time-Out)", trigger: "手术过程中", behavior: "Sign-In(麻醉前):身份/部位/术式/过敏/器械→Time-Out(切皮前):三方确认暂停→Sign-Out(离室前):标本/引流管→器械三次清点(术前/关腹前/关腹后)", related_state: "术前准备→手术中→术后恢复" }
  # 药事类
  - { id: "BR-HIS-011", name: "四查十对审方", trigger: "药师审方", behavior: "查处方(科别/姓名/年龄)→查药品(药名/剂型/规格/数量)→查配伍禁忌(性状/用法用量)→查用药合理性(临床诊断)→审方不通过退回医生修改", related_state: "待审方→已审方/审方退回" }
  - { id: "BR-HIS-012", name: "抗菌药分级管理", trigger: "开立抗菌药医嘱", behavior: "非限制使用级:住院医师→限制使用级:主治医师审批→特殊使用级:科主任+临床药师审批→DDDs监控→使用前微生物送检率≥50%", related_state: "待审核→待审批/已审核" }
  # 危急值类
  - { id: "BR-HIS-013", name: "危急值闭环报告", trigger: "检验/检查结果达危急值阈值", behavior: "技师确认危急值→电话通知临床科室(10分钟内)→护士接收并记录→医生确认并处置(30分钟内)→处置记录归档→全流程可追溯", related_state: "待审核→危急值待报→已报告(闭环)" }
  # 时效类
  - { id: "BR-HIS-014", name: "病历书写时效", trigger: "诊疗过程中", behavior: "入院记录24h内完成→首次病程记录8h内完成→手术记录术后24h内完成→出院小结出院前完成→超时触发质控告警", related_state: "书写中→超时未签/待签名" }
  - { id: "BR-HIS-015", name: "病案归档时效", trigger: "患者出院后", behavior: "出院7个工作日内完成病案首页→提交病案室归档→ICD编码审核→DRG分组→归档率≥95%→超期质控扣罚", related_state: "已审核→已归档/归档超时" }
  # 医保类
  - { id: "BR-HIS-016", name: "医保实时校验", trigger: "医生开处方/医嘱时", behavior: "校验医保三目(药品目录/诊疗项目/耗材目录)→实时返回医保限定条件→超目录提示自费→DRG/DIP费用预警", related_state: "开方中" }
  # 护理类
  - { id: "BR-HIS-017", name: "三查七对执行", trigger: "护士执行医嘱", behavior: "三查(操作前/操作中/操作后)→七对(床号/姓名/药名/浓度/剂量/时间/用法)→记录执行时间→异常暂停通知医生", related_state: "待执行→执行中→已完成" }
  - { id: "BR-HIS-018", name: "护理交接班", trigger: "护士交接班时", behavior: "床旁交接→重点患者详细交接(危重/手术/新入院/特殊检查)→交接班记录→双人签字确认", related_state: "执行中→已交接" }
  # 质控类
  - { id: "BR-HIS-019", name: "不良事件上报", trigger: "发生医疗安全事件", behavior: "24h内上报→科室分析→职能部门调查→整改措施→效果追踪(PDCA)→严重事件报医务科", related_state: "已发现→已上报→已分析→已整改→已关闭" }
  - { id: "BR-HIS-020", name: "院感暴发预警", trigger: "院感监测系统", behavior: "同期同一病区同类感染数超阈值→自动预警→感染科核实→启动暴发调查→隔离措施→报告上级卫生行政部门", related_state: "监测中→预警触发→已调查→已控制" }

# ============================================
# 业务动作
# ============================================
business_actions:
  - { id: "ACT-HIS-01", name: "挂号建档", trigger_role: "挂号员/自助机/患者APP", input: "患者身份信息(身份证/社保卡)+就诊需求", output: "挂号单/就诊卡", precondition: "患者首诊需建档", postcondition: "就诊记录创建，分诊队列生成" }
  - { id: "ACT-HIS-02", name: "门诊问诊诊断", trigger_role: "门诊医生", input: "主诉/现病史/查体", output: "ICD-10诊断/处方/检查申请", precondition: "患者已挂号已签到", postcondition: "病历记录、处方/检查申请生成" }
  - { id: "ACT-HIS-03", name: "急诊分诊抢救", trigger_role: "急诊护士/急诊医生", input: "MEWS/REMS评分/生命体征", output: "分诊级别(I~IV)/抢救记录", precondition: "患者到达急诊", postcondition: "分配诊疗区域/I/II级绿通道启动" }
  - { id: "ACT-HIS-04", name: "入院办理", trigger_role: "入院处/病房护士", input: "入院证/患者身份/预交金", output: "住院号/床位/在院病历", precondition: "门诊/急诊医生开具入院证", postcondition: "床位分配、入院护理评估启动" }
  - { id: "ACT-HIS-05", name: "医嘱开立与审核", trigger_role: "住院医师→主治医师→药师", input: "诊疗方案/药品/检查检验项目", output: "生效医嘱", precondition: "入院记录+首次病程已完成", postcondition: "医嘱进入执行队列→护士执行→药师调配" }
  - { id: "ACT-HIS-06", name: "手术申请与排程", trigger_role: "手术医师→科主任/医务科→手术室护士长", input: "术式/级别/诊麻醉方式/患者状态", output: "手术排班单", precondition: "手术指征明确+术前检查完成+知情同意", postcondition: "手术间/医护/器械分配，术前准备启动" }
  - { id: "ACT-HIS-07", name: "处方审核调配", trigger_role: "药剂师", input: "处方信息+药品库存", output: "审方结论/调配药品", precondition: "处方已推送至药房+患者已缴费", postcondition: "药品调配完成→核对发药→用药指导" }
  - { id: "ACT-HIS-08", name: "检查检验执行", trigger_role: "检验技师/影像技师/病理医师", input: "申请单+标本/预约信息", output: "检测结果/影像/报告", precondition: "申请已审核+标本/患者已就位", postcondition: "报告审核发布→推送至医生站/患者App" }
  - { id: "ACT-HIS-09", name: "危急值报告处置", trigger_role: "技师→护士→医生", input: "危急值检测结果", output: "危急值报告记录+处置记录", precondition: "检测结果达危急值阈值", postcondition: "电话通知10min内→医生确认30min内处置→闭环归档" }
  - { id: "ACT-HIS-10", name: "出院结算归档", trigger_role: "收费员/病案管理员", input: "出院医嘱/费用明细/病案首页", output: "结算单/出院小结/归档病案", precondition: "主治医师下达出院医嘱", postcondition: "费用结清→床位释放→病案7日内归档→DRG分组" }
  - { id: "ACT-HIS-11", name: "医保结算对账", trigger_role: "医保专员", input: "就诊费用明细/参保信息", output: "医保结算单/自付金额", precondition: "费用明细已生成+医保身份已核验", postcondition: "费用上传→结算返回→月度对账→拒付处理" }
  - { id: "ACT-HIS-12", name: "护理执行记录", trigger_role: "病房护士", input: "医嘱执行清单/护理计划", output: "执行记录/护理记录/生命体征", precondition: "医嘱已审核通过", postcondition: "三查七对→给药/护理→记录执行时间→观察不良反应" }
  - { id: "ACT-HIS-13", name: "三级查房记录", trigger_role: "住院医师→主治→主任", input: "患者病情变化/检查结果", output: "查房记录/医嘱调整", precondition: "患者住院期间", postcondition: "诊疗方案调整/医嘱修正/出院评估" }
  - { id: "ACT-HIS-14", name: "病历质控", trigger_role: "质控管理员", input: "病历时效/内容完整性", output: "质控评分/缺陷通知", precondition: "病历已签名审核", postcondition: "缺陷项通知→医生修改→重新审核" }
  - { id: "ACT-HIS-15", name: "院感监测预警", trigger_role: "感染科", input: "检验结果/抗生素使用/体温异常", output: "院感预警/暴发报告", precondition: "院感监测系统运行中", postcondition: "预警核实→隔离措施→暴发调查(条件触发)" }

# ============================================
# 信息实体
# ============================================
information_entities:
  core_entities:
    - { name: "患者主索引(EMPI)", description: "企业级患者唯一标识，跨系统去重合并，含姓名/身份证/手机/地址/过敏史等", life_cycle: "创建→更新→合并→注销" }
    - { name: "就诊记录", description: "单次就诊全流程追踪，含挂号信息/分诊/就诊状态/费用", life_cycle: "已挂号→候诊中→就诊中→待处置→复诊中→已完成→已归档" }
    - { name: "电子病历(EMR)", description: "门诊/住院病历，含主诉/现病史/查体/诊断/治疗计划，支持结构化+非结构化", life_cycle: "书写中→待签名→已签名→已审核→已归档/已封存" }
    - { name: "医嘱", description: "药品/检查/检验/治疗/护理医嘱，含长期/临时/SOS类型", life_cycle: "待审核→已审核→执行中→已停止/已完成→已归档" }
    - { name: "处方", description: "药品医嘱载体，含门诊处方/住院处方/PIVAS配置，需审方后调配", life_cycle: "待审方→已审方→调配中/配置中→已发药→已用药→已点评→已归档" }
    - { name: "检验申请与报告", description: "检验全流程数据，含申请→标本采集→检测→审核→报告+危急值", life_cycle: "待采样→已采样→已签收→检测中→待审核→已报告→已归档" }
    - { name: "手术申请与记录", description: "手术申请→审批→排程→安全核查→麻醉记录→手术记录", life_cycle: "待审批→已审批→已排程→术前准备→手术中→术后恢复→已归档" }
    - { name: "费用明细", description: "挂号费/诊查费/检查费/药品费/手术费/床位费等，关联医保结算", life_cycle: "待计费→已计费→已结算→已对账" }
    - { name: "床位", description: "病房床位资源，含状态/类别/科室/关联患者", life_cycle: "空闲可用→已预留→已占用→待消毒→空闲可用/隔离消毒→空闲可用" }
    - { name: "药品库存", description: "药库/药房药品库存，含批号/效期/库存量/警戒线", life_cycle: "入库→在库→锁定→出库→近效期预警→过期报废" }
    - { name: "医疗设备", description: "设备档案/维修记录/计量校准/效益分析", life_cycle: "采购入库→使用中→维修中→计量超期停用→报废" }

# ============================================
# 场景清单
# ============================================
scenes:
  - { id: "SC-HIS-001", name: "门诊就诊全流程", theme_id: "THM-HIS-01", trigger: "患者预约/到达医院", closure: "取药离院或复诊预约", participant_roles: ["患者", "挂号员", "分诊护士", "门诊医生", "药剂师", "收费员", "医技技师"], priority: "critical",
    description: "从挂号→分诊→候诊→问诊查体→诊断开方/开检查→缴费→检查检验→复诊确诊→处方审核调配→发药的完整门诊链路，含检查报告回传复诊循环和合理用药实时校验" }
  - { id: "SC-HIS-002", name: "急诊绿通道抢救", theme_id: "THM-HIS-02", trigger: "患者到达急诊/120转运", closure: "离院/转入病房/转入ICU", participant_roles: ["急诊护士", "急诊医生", "抢救团队", "专科医生", "收费员", "医技技师"], priority: "critical",
    description: "急诊分诊I~IV级→I/II级绿通道立即抢救(先诊疗后付费)→并行检查检验+专科会诊→去向决策(留观≤72h/入院/转科/离院)" }
  - { id: "SC-HIS-003", name: "住院入院到出院全链路", theme_id: "THM-HIS-03", trigger: "门诊/急诊医生开具入院证", closure: "出院结算+病案7日内归档+床位释放消毒", participant_roles: ["入院处", "病房护士", "住院医师", "主治医师", "住院药剂师", "收费员", "病案管理员"], priority: "critical",
    description: "入院登记→床位分配→入院评估→入院记录24h/首次病程8h→医嘱开立→四级审核→每日三级查房+医嘱执行+检查检验并行→出院评估→出院带药→费用结算→出院小结→病案首页→归档" }
  - { id: "SC-HIS-004", name: "手术全流程", theme_id: "THM-HIS-04", trigger: "住院医师评估手术指征", closure: "术后康复→评估出院", participant_roles: ["手术医师", "麻醉师", "巡回护士", "器械护士", "科主任", "医务科", "病理医师"], priority: "critical",
    description: "手术申请→分级审批→麻醉ASA评估→知情同意→手术排班→Sign-In安全核查→麻醉诱导→手术操作(术中冰冻条件)→Time-Out→关腹前清点→Sign-Out→PACU复苏→术后记录24h→术后护理" }
  - { id: "SC-HIS-005", name: "检查检验与危急值闭环", theme_id: "THM-HIS-05", trigger: "医生开具检查/检验申请", closure: "报告归档+医生查看决策", participant_roles: ["临床医生", "采血护士", "检验技师", "检验医师", "影像技师", "影像医师", "病房护士"], priority: "critical",
    description: "申请→采样/预约→标本接收/拒收→检测/检查→审核→报告→危急值判断→技师确认→10分钟内电话通知→护士接收→医生30分钟内确认处置→闭环归档" }
  - { id: "SC-HIS-006", name: "药事管理全链路", theme_id: "THM-HIS-06", trigger: "医生开具处方/医嘱", closure: "处方点评+ADR监测+归档", participant_roles: ["临床医生", "门诊药师", "住院药师", "PIVAS药师", "临床药师", "药库管理员"], priority: "high",
    description: "处方开立→合理用药实时预校验(配伍/剂量/过敏/医保)→药师四查十对审方→门诊调配发药/住院医嘱审核UDI摆药/PIVAS审方排批配置配送→用药监护(ADR上报)→处方点评(月抽查≥30张/科)" }
  - { id: "SC-HIS-007", name: "医保结算全链路", theme_id: "THM-HIS-07", trigger: "患者挂号/缴费/出院结算", closure: "月度对账完成", participant_roles: ["收费员", "医保专员", "临床医生", "财务会计"], priority: "high",
    description: "挂号时身份核验→开方时医保目录实时校验→缴费时费用上传结算→出院DRG/DIP结算→月度汇总对账→拒付通知处理→目录定期下载更新" }
  - { id: "SC-HIS-008", name: "病案归档与DRG分组", theme_id: "THM-HIS-08", trigger: "患者出院", closure: "病案归档完成+DRG分组入库", participant_roles: ["住院医师", "主治医师", "病案管理员", "编码员", "质控管理员"], priority: "medium",
    description: "出院小结→病案首页填写(7日内)→首页质控(逻辑+缺失校验)→ICD-10/ICD-9-CM-3编码审核→DRG分组器→归档入库→借阅管理(审批/期限30天)→病历封存(纠纷/司法场景)" }
  - { id: "SC-HIS-009", name: "护理全流程", theme_id: "THM-HIS-09", trigger: "患者入院/每日护理", closure: "出院护理指导完成", participant_roles: ["责任护士", "护士长", "护理部", "住院医师"], priority: "high",
    description: "入院护理评估(生命体征/跌倒/压疮/疼痛)→执行医嘱(三查七对)→生命体征监测→护理记录→交接班(床旁+重点患者)→PIVAS/PASS药物接收→出院护理指导+健康教育" }
  - { id: "SC-HIS-010", name: "院感监控与暴发处置", theme_id: "THM-HIS-10", trigger: "院感监测系统自动筛查", closure: "暴发控制或预警解除", participant_roles: ["感染科", "检验科", "临床科室", "药剂科", "医务科"], priority: "medium",
    description: "院感自动筛查(检验结果/体温/抗生素使用)→暴发预警(超阈值)→感染科核实→隔离措施(多重耐药菌接触隔离)→抗菌药DDDs监控→职业暴露上报→传染病直报" }
  - { id: "SC-HIS-011", name: "跨科室会诊", theme_id: "THM-HIS-03", trigger: "主治医师发起会诊请求", closure: "会诊意见归档+诊疗方案调整", participant_roles: ["主治医师", "住院医师", "会诊专家", "科主任"], priority: "medium",
    description: "普通会诊24h内完成→急诊会诊10分钟内到达→MDT多学科会诊→会诊意见记录→诊疗方案调整→会诊记录归档" }
  - { id: "SC-HIS-012", name: "三级质控与持续改进", theme_id: "THM-HIS-08", trigger: "质控月度计划", closure: "改进效果追踪完成", participant_roles: ["质控管理员", "科室主任", "医务科", "信息科"], priority: "medium",
    description: "一级科室自查→二级职能部门督查→三级院级评审→质控指标监测(住院死亡率/重返率/感染率/手术并发症)→单病种过程+结局指标→不良事件PDCA→临床路径变异分析→持续改进" }

# ============================================
# 业务泳道（6大场景）
# ============================================
swimlanes:
  # 门诊
  - { id: "SW-HIS-01", name: "门诊就诊泳道", swimlane_count: 5, steps: 13,
    flow: "患者→挂号员(挂号/建档)→分诊护士(测体征/排队)→门诊医生(叫号→问诊查体→诊断开方/开检查→◇需检查?→是:缴费→检查→报告回传→复诊)→收费员(缴费)→◇需取药?→是:门诊药房(审方→调配→发药)→离院",
    decision_nodes: ["◇需检查检验?", "◇需取药?"], roles: ["患者", "挂号收费", "分诊导诊", "门诊医生", "医技药事"] }
  # 急诊
  - { id: "SW-HIS-02", name: "急诊就诊泳道", swimlane_count: 4, steps: 10,
    flow: "患者→急诊护士(分诊I~IV级)→◇I/II级→绿通道立即抢救(不计费)→◇III/IV级→常规急诊→◇去向:留观≤72h/入院/转科/离院(绿通道补缴费)",
    decision_nodes: ["◇分诊级别", "◇去向:留观/入院/转科/离院"], roles: ["患者", "急诊护士", "急诊医生", "医技科室", "收费员"] }
  # 住院入院
  - { id: "SW-HIS-03", name: "住院入院泳道", swimlane_count: 5, steps: 11,
    flow: "门急诊医生(入院证)→入院处(登记)→护士站(床位确认/预交金)→病房护士(入院评估)→住院医师(入院记录24h/首次病程8h)→开立医嘱→主治审核→药师审核→护士执行",
    decision_nodes: [], roles: ["门急诊医生", "入院处", "病房护士", "住院医师", "主治医师", "药师"] }
  # 住院日常
  - { id: "SW-HIS-04", name: "住院日常诊疗泳道", swimlane_count: 4, steps: 9,
    flow: "住院医师晨间查房→主治/主任上级查房→病程记录→◇需检查?→是:标本采集→医技执行→报告回传→护士执行长期医嘱→PIVAS/摆药→交接班→◇病情变化需手术?→出院评估",
    decision_nodes: ["◇需检查检验?", "◇需手术?", "◇出院?"], roles: ["住院医师", "主治/主任", "病房护士", "住院药剂师", "医技科室"] }
  # 手术
  - { id: "SW-HIS-05", name: "手术泳道", swimlane_count: 6, steps: 16,
    flow: "手术医嘱→手术申请→审批(≥3级医务科)→麻醉评估(ASA)→知情同意→排班→Sign-In→麻醉诱导→手术操作(术中冰冻条件)→Time-Out→关腹前清点→Sign-Out→PACU复苏(Steward≥4)→◇去向:转回病房/ICU→术后记录24h→术后护理",
    decision_nodes: ["◇术中有冰冻?", "◇去向:病房/ICU"], roles: ["手术医师", "麻醉师", "巡回护士", "器械护士", "病理医师", "病房护士"] }
  # 出院
  - { id: "SW-HIS-06", name: "出院泳道", swimlane_count: 5, steps: 11,
    flow: "出院评估→主治审批→出院带药(≤7天)→药房调配→出院小结→费用结算→出院护理指导→出院登记(床位释放)→病案首页(7日内)→病案归档/ICD编码/DRG分组",
    decision_nodes: [], roles: ["住院医师", "主治医师", "住院药剂师", "收费员", "病房护士", "病案管理员"] }

# ============================================
# 业务流（6条，含控制逻辑）
# ============================================
business_flows:
  - { id: "FLOW-HIS-01", name: "门诊业务流", control_logic: "并行Fork/Join(处方审核调配∥费用结算医保)→loop-back(检查报告回传→复诊确诊)→2决策节点(◇需检查?/◇需取药?)", steps: 12 }
  - { id: "FLOW-HIS-02", name: "急诊业务流", control_logic: "分诊分支(I/II级绿通道∥III/IV级常规)→并行Fork(检查检验∥专科会诊)→去向决策(手术/ICU/病房/留观/离院)", steps: 9 }
  - { id: "FLOW-HIS-03", name: "住院业务流", control_logic: "四级医嘱流转→每日并行Fork(查房病程∥医嘱执行∥检查检验)→Join评估→loop-back循环→◇出院/手术/继续→病案归档", steps: 12 }
  - { id: "FLOW-HIS-04", name: "手术业务流", control_logic: "分级审批分支→并行Fork(麻醉∥器械)→术中冰冻条件分支→抢救异常分支→三次安全核查→去向决策", steps: 12 }
  - { id: "FLOW-HIS-05", name: "检查检验流", control_logic: "门诊/住院分支→并行Fork(检验LIS∥影像PACS∥病理PIS)→Join→◇危急值判断→危急值闭环通知→报告推送", steps: 9 }
  - { id: "FLOW-HIS-06", name: "药事业务流", control_logic: "合理用药实时预校验→门诊/住院分支→并行Fork(门诊药房∥住院药房∥PIVAS)→Join→用药监护→◇不良反应?→处方点评", steps: 8 }

# ============================================
# 信息流（6条，含协议规范）
# ============================================
information_flows:
  - { id: "IF-HIS-01", name: "门诊信息流", message_count: 11,
    key_messages: ["患者→挂号系统(HTTPS REST/JSON)", "挂号系统→医保接口(医保专线)", "挂号系统→分诊系统(Kafka)", "分诊系统→医生站(WebSocket)", "医生站→EMR(FHIR R4)", "医生站→LIS/PACS(HL7 ORM^O01)", "LIS/PACS→医生站(HL7 ORU^R01)", "医生站→收费系统(REST API)", "收费系统→医保接口(医保专线)", "收费系统→药房(Kafka)", "药房→患者(推送通知)"] }
  - { id: "IF-HIS-02", name: "住院信息流", message_count: 12,
    key_messages: ["门急诊→入院系统(HL7 ADT^A04)", "入院系统→床位管理(REST API)", "入院系统→护士站(Kafka)", "住院医生站→EMR(FHIR R4)", "住院医生站→住院药房(HL7 RDE^O11)", "住院药房→PIVAS(REST API)", "住院药房→护士站(Kafka)", "住院医生站→LIS/PACS(HL7 ORM^O01)", "LIS/PACS→医生站(HL7 ORU^R01+危急值弹窗)", "医生站→财务系统(每日定时REST)", "财务系统→医保接口(医保专线)", "医生站→病案系统(FHIR R4)"] }
  - { id: "IF-HIS-03", name: "检查检验信息流", message_count: 11,
    key_messages: ["医生站→LIS/RIS(HL7 ORM^O01)", "LIS→护士站(Kafka/标本采集通知)", "护士→LIS(REST API/标本确认)", "LIS→检验仪器(ASTM/RS232/检测指令)", "检验仪器→LIS(ASTM/RS232/结果回传)", "LIS→技师(审核/Delta Check)", "LIS→医生站(HL7 ORU^R01/报告回传)", "LIS→通知服务(Kafka+电话/危急值预警)", "影像设备→PACS(DICOM C-STORE)", "PACS→影像工作站(DICOM C-FIND/C-MOVE)", "PACS→医生站(HL7 ORU^R01/影像报告)"] }
  - { id: "IF-HIS-04", name: "手术信息流", message_count: 10,
    key_messages: ["住院医生站→手术系统(REST API/手术申请)", "手术系统→科主任(App推送/审批通知)", "手术系统→麻醉系统(REST API/术前评估)", "手术系统→排班系统(REST API)", "监护仪→麻醉系统(RS232/生命体征5秒采样)", "手术系统→PIS(REST API/术中冰冻)", "PIS→手术系统(REST API/冰冻报告30min内)", "手术系统→护士站(Kafka/术后转回)", "手术系统→EMR(FHIR R4/手术记录归档)", "手术系统→财务系统(REST API/手术费用)"] }
  - { id: "IF-HIS-05", name: "药事信息流", message_count: 9,
    key_messages: ["医生站→规则引擎(REST API<200ms/处方预校验)", "医生站→药房系统(HL7 RDE^O11)", "药房系统→药剂师(系统内/审方任务)", "药剂师→医生站(Kafka/审方退回)", "药房系统→PIVAS(REST API/静配配置单)", "PIVAS→护士站(Kafka/成品配送通知)", "药房系统→药库系统(REST API/库存预警请领)", "药房系统→财务系统(REST API/药品费用)", "药房系统→感染监控(Kafka每日/抗菌药数据)"] }
  - { id: "IF-HIS-06", name: "医保信息流", message_count: 8,
