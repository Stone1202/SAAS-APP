# ============================================
# 医药冷链领域知识 v1.0.0
# 分类：medical
# 学习日期：2026-07-27
# 学习方法：traditional（基于公开标准文档+行业解读的文本学习）
# 来源：GB/T 46204-2025+2025版GSP+胰岛素冷链管控方案+行业解读
# ============================================

domain:
  name: "医药冷链"
  category: "medical"
  version: "v1.0.0"
  learned_at: "2026-07-27"
  learning_method: "traditional"
  source_urls:
    - "https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=79B04980DD1DFCF356B6A8B9004DC7C7"
    - "https://news.qq.com/rain/a/20251115A021F400"
    - "https://health.baidu.com/m/detail/ar_5439997864287320792"
    - "https://www.shsnow.com/industry/20303.html"
    - "https://www.familyhealthpaper.com/kp/paper/865b3698a133487c"
  description: "医药冷链是药品从生产到消费端全程温控物流体系，涵盖冷藏（2-8℃）和冷冻（-15℃以下）药品的仓储、运输、配送全链路温度管理，受GSP规范和GB/T 46204-2025国标双重约束。"
  curation_policy: "保留：国家标准的温度阈值、数据记录频率、保存年限、GSP合规要求、胰岛素等生物制剂特殊要求。过滤：具体企业案例中的品牌推广内容、设备厂商营销信息、非标准化操作建议。"
  status: "draft"

  # ============================================
  # 角色清单
  # ============================================
  domain_roles:
    - role_id: "ROLE-冷链-001"
      name: "药品生产企业"
      type: "integrator"
      core_need: "出库药品全程温控可追溯，确保效价稳定"
      serves: ["药品经营企业", "患者"]

    - role_id: "ROLE-冷链-002"
      name: "药品经营企业（批发/零售）"
      type: "integrator"
      core_need: "GSP合规运营，冷链仓储配送温控达标"
      serves: ["患者/消费者"]

    - role_id: "ROLE-冷链-003"
      name: "第三方物流企业"
      type: "integrator"
      core_need: "提供合规冷链运输，保证运输过程温控不断链"
      serves: ["药品经营企业"]

    - role_id: "ROLE-冷链-004"
      name: "药监监管机构"
      type: "regulator"
      core_need: "全链路追溯数据可查，确保公众用药安全"
      serves: ["患者"]

    - role_id: "ROLE-冷链-005"
      name: "患者/消费者"
      type: "user"
      core_need: "收到的药品在有效温度范围内，药效有保障"
      serves: []

  # ============================================
  # 商业问题清单
  # ============================================
  business_problems:
    - id: "BP-冷链-001"
      problem: "药品在运输环节温度失控导致药效失效报废"
      pain_point: "冷链断链造成的药品报废损失巨大，胰岛素等生物制剂单价高、温度敏感"
      value: "全程温控可追溯，降低断链风险，保障患者用药安全"
      evidence: "我国疫苗已实现全过程可追溯，但其他冷链药品仍存在追溯链条不完整问题（中国物流与采购联合会 2025）"
      priority: "high"
      priority_rationale: "直接关系药品安全和患者健康，也是GSP合规底线"
      scrm_relevance: "糖友之家涉及处方药和胰岛素配送，必须满足冷链合规"
      related_roles: ["ROLE-冷链-002", "ROLE-冷链-003"]
      related_problems: ["BP-冷链-002"]

    - id: "BP-冷链-002"
      problem: "上下游追溯数据不一致，交接责任界定不清"
      pain_point: "追溯链条断裂导致无法定位断链责任方"
      value: "统一数据标准、明确交接流程，实现全链路可追溯"
      evidence: "GB/T 46204-2025 明确要求上下游系统接口数据一致、交接核验内容标准化"
      priority: "high"
      priority_rationale: "2027年6月30日前所有现有药企必须完成GSP升级"
      scrm_relevance: "配送交接环节的数据采集和追溯信息回传"
      related_roles: ["ROLE-冷链-002", "ROLE-冷链-003", "ROLE-冷链-004"]

    - id: "BP-冷链-003"
      problem: "冷链设备设施验证不达标，存在温控盲区"
      pain_point: "冷库/冷藏车温控不达标导致批量药品报废"
      value: "通过设备验证+双机组备份+实时监测确保温控可靠"
      evidence: "2025版GSP要求每年至少1次全面验证，设施大修后重新验证"
      priority: "medium"
      priority_rationale: "基础设施层面，新建系统必须一次性到位"
      scrm_relevance: "自建仓储或合作物流选型时的合规审查"

  # ============================================
  # 1. 业务泳道图
  # ============================================
  swimlane:
    roles: ["药品生产企业", "药品经营企业", "第三方物流", "药监监管机构", "患者"]
    stages: ["出库", "干线运输", "区域仓储", "末端配送", "签收验温"]
    actions:
      - role: "药品生产企业"
        stage: "出库"
        action: "出库前温控预冷+质检报告核验+追溯码激活"
        input: "生产批号、质检报告、有效期"
        output: "出库追溯记录、温控数据启动"
        sources: ["GB/T 46204-2025"]

      - role: "第三方物流"
        stage: "干线运输"
        action: "温控运输（2-8℃或-15℃以下）+GPS定位+每分钟采集温度"
        input: "药品信息、温控指令、运输路线"
        output: "实时温控数据、GPS轨迹、异常报警"
        sources: ["GB/T 46204-2025", "2025版GSP"]

      - role: "药品经营企业"
        stage: "区域仓储"
        action: "入库温控核验+GSP冷库存储+温湿度24h监测"
        input: "运输温控记录、药品追溯码"
        output: "入库确认、仓储温控记录"
        sources: ["2025版GSP"]

      - role: "第三方物流"
        stage: "末端配送"
        action: "冷藏箱/冷藏包配送+温度持续记录+交接核验"
        input: "药品信息、配送地址、温控要求"
        output: "配送温控记录、交接确认单"
        sources: ["GB/T 46204-2025"]

      - role: "患者"
        stage: "签收验温"
        action: "查验外包装温度标签+签收确认"
        input: "配送包裹"
        output: "签收记录"
        sources: ["医疗机构配送最佳实践"]

  # ============================================
  # 2. 业务流程图
  # ============================================
  flow:
    happy_path: "生产企业出库预冷→激活追溯码→干线恒温运输（每分钟采集温度）→区域GSP冷库入库核验→冷藏箱末端配送→患者验温签收→全链路追溯数据上传监管平台"
    exceptions:
      - desc: "温度超标：触发声光+短信双重报警→启动应急预案→涉及药品隔离待检→质量负责人判定报废/放行"
        sources: ["2025版GSP"]
      - desc: "设备故障：双机组自动切换+应急供电→30分钟内必须恢复温控，否则启动冷链转运"
        sources: ["胰岛素冷链管控方案"]
      - desc: "交接数据不一致：以生产端追溯码为唯一标识→逐环节核实→差异记录留痕并上报"
        sources: ["GB/T 46204-2025"]
    branches:
      - desc: "胰岛素已开封→常温（30℃以下，≤28天）→不需冷链配送"
        sources: ["胰岛素冷库温度标准"]

  # ============================================
  # 3. 业务信息流
  # ============================================
  info_flow:
    entities:
      - name: "药品追溯码"
        producer: "药品生产企业"
        consumer: "全链路各环节"
        depends_on: "一物一码体系"
        sources: ["GB/T 46204-2025"]

      - name: "温控实时数据"
        producer: "物联网传感器"
        consumer: "物流系统、GSP监管平台"
        depends_on: "传感器部署+数据采集系统"
        sources: ["2025版GSP"]

      - name: "交接核验单"
        producer: "交接双方"
        consumer: "质量管理系统"
        depends_on: "标准化交接流程"
        sources: ["GB/T 46204-2025"]

      - name: "设备验证报告"
        producer: "第三方验证机构"
        consumer: "药监监管机构"
        depends_on: "每年全面验证"
        sources: ["2025版GSP", "GB/T 34399-2025"]

    cross_system: "追溯系统↔仓储WMS↔运输TMS↔监管平台↔GSP质量管理系统"

  # ============================================
  # 4. 业务操作矩阵（角色×状态×操作）
  # ============================================
  operation_matrix:
    roles: ["药品生产企业", "药品经营企业", "第三方物流", "药监监管机构"]
    states: ["待出库", "运输中-正常", "运输中-超温", "待入库", "仓储中", "配送中", "已签收", "异常待处理"]

    matrix:
      - role: "第三方物流"
        state: "运输中-超温"
        operations: ["触发报警", "启动应急预案", "隔离药品", "上报质量负责人"]
        sources: ["2025版GSP"]

      - role: "药品经营企业"
        state: "待入库"
        operations: ["核验运输温控记录", "扫码入库", "异常药品拒收隔离"]
        sources: ["2025版GSP"]

      - role: "药监监管机构"
        state: "异常待处理"
        operations: ["调取追溯数据", "现场检查", "责令整改/处罚"]
        sources: ["2025版GSP"]

  # ============================================
  # 5. 解决方案概括
  # ============================================
  solution:
    patterns:
      - desc: "一物一码全链路追溯——每个药品单元赋追溯码，各环节扫码上传数据，实现从生产到消费端的完整追溯链条"
        sources: ["GB/T 46204-2025"]

      - desc: "双机组+应急供电——关键冷链设施配备冗余制冷机组和UPS，确保单点故障不导致温控失效"
        sources: ["2025版GSP"]

      - desc: "数字化追溯+不可篡改——带时间戳的电子记录与纸质记录同等法律效力，数据每小时自动备份，保存≥5年（疫苗永久）"
        sources: ["2025版GSP"]

    tech_considerations:
      - desc: "温控传感器部署位置：冷藏车几何中心+回风口+门附近，冷库超过500㎡需独立预冷区和待验区"
        sources: ["2025版GSP"]

      - desc: "数据记录频率：运输环节至少每分钟更新1次、每5分钟记录1次，仓储环节持续监测"
        sources: ["GB/T 46204-2025"]

      - desc: "报警机制：声光+短信双重报警，阈值按药品说明书设定，超温记录不可删除"
        sources: ["2025版GSP"]

    best_practices:
      - desc: "验证报告互认机制：同一设备的多方验证结果互认，减少重复验证成本（GB/T 34399-2025）"
        sources: ["GB/T 34399-2025"]

      - desc: "胰岛素专属管控：未开封2-8℃恒温冷库（误差±1℃），已开封30℃以下室温≤28天用完，严禁冷冻"
        sources: ["胰岛素冷库温度标准"]

      - desc: "Q-冷链-001 冷链配送温控数据回传：配送完成后温控记录自动回传至SCRM平台，供患者查看药品全程温度曲线"
        sources: ["SugarMate脑暴v5.0需求推导"]
