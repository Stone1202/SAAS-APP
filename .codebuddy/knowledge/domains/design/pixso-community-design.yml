# ============================================
# Part 3: 设计风格词典
# ============================================
style_dictionary:
  description: "从Pixso社区资源中识别和提取的12种主流设计风格，含视觉特征、适用终端、代表作品"
  
  styles:
    - id: "STYLE-001"
      name: "液态玻璃 (Glassmorphism)"
      visual_features:
        - "半透明模糊背景（backdrop-filter: blur）"
        - "柔和彩色渐变叠加"
        - "微妙的边框高光"
        - "多层叠加产生深度感"
      suitable_terminals: ["mobile", "tablet", "pc"]
      suitable_scenarios: ["金融APP", "音乐播放器", "社交应用", "品牌展示"]
      representative_works: ["液态玻璃教程文档 (Pixso, 7082热度)"]
      color_palette: "柔和渐变（紫-蓝-粉为主）+ 半透明白色层"
      design_tokens_keywords: ["blur", "gradient", "transparency", "glass", "frosted"]

    - id: "STYLE-002"
      name: "现代简约 (Modern Minimalist)"
      visual_features:
        - "大量留白"
        - "清晰的卡片式布局"
        - "单一主色+灰阶辅色"
        - "扁平化图标"
        - "大圆角卡片（8-16px）"
      suitable_terminals: ["mobile", "tablet", "pc"]
      suitable_scenarios: ["SaaS产品", "B端后台", "电商", "企业官网"]
      representative_works: ["Element Plus Design System (5424热度)", "Ant Design (1787热度)"]
      color_palette: "蓝/紫主色 + 白/灰背景 + 低饱和度辅色"
      design_tokens_keywords: ["white-space", "card", "flat", "minimal", "clean"]

    - id: "STYLE-003"
      name: "科技感/数据可视化"
      visual_features:
        - "深色背景（暗色模式为主）"
        - "霓虹色数据标记（青/蓝/紫）"
        - "几何线条与网格"
        - "数据动画与微交互"
        - "发光边框与节点"
      suitable_terminals: ["pc", "tablet"]
      suitable_scenarios: ["数据大屏", "监控中心", "数据看板", "IoT平台"]
      representative_works: ["EasyV可视化图表组件库", "科技banner AI设计 (3769热度)"]
      color_palette: "深蓝/黑底 + 青#00D4FF/蓝#4A90E2/紫#9B59B6霓虹 + 白字"
      design_tokens_keywords: ["dark-theme", "neon", "dashboard", "data-viz", "glow"]

    - id: "STYLE-004"
      name: "3D与沉浸式"
      visual_features:
        - "3D模型与立体元素"
        - "景深与视差滚动"
        - "真实质感与光影"
        - "空间感布局"
      suitable_terminals: ["pc", "tablet"]
      suitable_scenarios: ["品牌官网", "产品展示", "游戏化界面", "元宇宙应用"]
      representative_works: ["3dicons", "FREE 3D Avatar Assets (2274热度)"]
      color_palette: "丰富色彩 + 真实光照 + 材质质感"
      design_tokens_keywords: ["3d", "depth", "parallax", "shadow", "realistic"]

    - id: "STYLE-005"
      name: "金融/商务专业风"
      visual_features:
        - "深蓝/藏蓝主色调"
        - "金色/铜色强调"
        - "严谨的表格与数据排版"
        - "高度结构化的信息层级"
        - "保守的圆角（2-4px）"
