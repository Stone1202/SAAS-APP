      example: "BA声明：PC端B端管理系统 → UX推荐：现代简约/Ant Design 或 Element Plus"
    
    - step: "设计系统选择"
      action: "根据技术栈匹配设计系统 → React: Ant Design / Vue3: Element Plus / 小程序: Vant / 鸿蒙: HarmonyOS Component Library"
    
    - step: "风格定义"
      action: "根据业务场景从12种风格中匹配，参考 style_dictionary 提取Design Tokens关键特征"
      example: "金融类移动端 → 金融/商务专业风（深蓝+金）+ 液态玻璃效果"
    
    - step: "终端适配"
      action: "参考 terminal_specs 确认分辨率、断点、栅格体系"
    
    - step: "设计资源搜寻"
      action: "根据 resource_categories 定位所需设计资源类型，在Pixso社区搜索同类参考"

  design_decision_tree: |
    flowchart TD
      A[项目启动] --> B{识别系统类型}
      B -->|B端管理系统| C{选择技术栈}
      B -->|C端应用| D{选择终端}
      B -->|数据产品| E{选择展示形式}
      C -->|React| F[Ant Design + 现代简约]
      C -->|Vue3| G[Element Plus + 现代简约]
      D -->|移动端| H{场景类型}
      D -->|PC官网| I[3D/插画/文旅 + 品牌定制]
      H -->|金融| J[金融专业风 + 液态玻璃]
      H -->|出行O2O| K[出行服务风 + Vant]
      H -->|健康医疗| L[医疗健康风 + Vant定制]
      E -->|大屏| M[科技可视化 + EasyV]
      E -->|BI看板| N[暗色模式 + Ant Design]

# ============================================
# Part 8: 国际巨头设计标准（V2.0.0 新增）
# AI融合Apple/Google/Microsoft现行设计规范，非网页抓取
# ============================================
international_standards:
  description: |
    融合Apple Human Interface Guidelines、Google Material Design 3、Microsoft Fluent Design System
    三大国际主流设计标准的核心原则和规范。非从网页直接抓取，而是AI基于对现行标准的知识整合。
    聚焦「永不过时的设计原则」，不记录特定版本号下的临时规范。

  apple_hig:
    name: "Apple Human Interface Guidelines (HIG)"
    platforms: ["iOS", "iPadOS", "macOS", "watchOS", "visionOS", "tvOS"]
    authority: "Apple Inc."
    last_major_update: "持续演进（随OS版本更新）"
    
    core_principles:
      - principle: "清晰 (Clarity)"
        description: "文字清晰可读、图标精确、装饰低调，以功能驱动设计"
        application: "信息层级分明，去除一切与功能无关的视觉元素"
      - principle: "遵从 (Deference)"
        description: "UI帮助用户理解内容，而非与之竞争。利用整个屏幕，让内容自然延展"
        application: "使用半透明、模糊效果暗示背后内容，减少边框和阴影"
      - principle: "深度 (Depth)"
        description: "通过视觉层次和逼真的动效传达层级关系，赋予界面生命力"
        application: "z轴层级通过模糊+缩放传达，动效遵循物理直觉曲线"
    
    platform_design_languages:
      - platform: "iOS"
        design_paradigm: "以触控为中心，轻量、流畅、层级清晰"
        key_traits: ["Dynamic Type自动字体缩放", "SF Symbols自适应图标体系", "触觉反馈三级强度", "暗色模式系统级支持", "灵动岛(Dynamic Island)交互区"]
        navigation_patterns: ["Tab Bar扁平导航", "Navigation Bar层级导航", "Sheet/Full Screen Cover模态"]
      - platform: "iPadOS"
        design_paradigm: "多任务+键盘触控板+Apple Pencil三维输入"
        key_traits: ["Slide Over/Split View分屏", "Stage Manager窗口管理", "桌面级右键菜单", "Apple Pencil悬停预览"]
      - platform: "macOS"
        design_paradigm: "桌面级交互，精准鼠标+键盘快捷键"
        key_traits: ["统一工具栏/标题栏", "SF Symbols系统图标", "菜单栏全局导航", "窗口三色交通灯"]
      - platform: "watchOS"
        design_paradigm: "一瞥即知，最小交互"
        key_traits: ["纯黑背景(OLED)", "大字号", "Digital Crown旋钮", "Complications表盘组件"]
      - platform: "visionOS"
        design_paradigm: "空间计算，眼动+手势+语音"
        key_traits: ["空间窗口(Spatial Windows)", "眼动注视点=光标", "轻捏手势确认", "玻璃材质隐喻(Glass Material)"]

    design_tokens_system:
      typography: 
        system_font: "San Francisco (SF Pro/Display/Text) — 专为可读性优化的可变字体"
        size_scale: [11, 12, 13, 14, 15, 16, 17, 20, 22, 28, 34, 44, 50, 67]
        principle: "Dynamic Type — 用户可全局调节，APP自动适配"
      colors:
        system_colors: ["Blue", "Red", "Green", "Orange", "Yellow", "Purple", "Pink", "Teal", "Indigo", "Mint", "Cyan", "Gray"]
        semantic_levels: ["System Background → Secondary → Tertiary → Quaternary (四级灰阶分层)", "Label → Secondary → Tertiary → Quaternary (四级文字分层)"]
        filled_colors: "Vibrant调色板 + 深色/浅色自动适配"
      spacing:
        base_unit: 8pt
        common_insets: [16, 20, 24, 32, 40]
        dynamic_spacing: "通过UIContentSizeCategory响应式变化"
      icons:
        system: "SF Symbols 6,000+图标的可调粗细/比例/多色体系"
        size_classes: ["Small (12pt)", "Medium (16pt)", "Large (20pt)", "Extra Large (24pt)", "Custom"]

  material_design:
    name: "Material Design 3 (M3)"
    authority: "Google"
    platform: "跨平台 (Android/Web/Flutter/iOS)"
    last_major_update: "M3 2022 (Material You 个性化体系)"
    
    core_principles:
      - principle: "Material是隐喻 (Material is a metaphor)"
        description: "数字纸墨——表面、边缘、光影模拟物理世界但不完全复刻"
        application: "Elevation系统(0-24dp) + 动态阴影传达层级"
      - principle: "鲜明、图形化、有意图 (Bold, graphic, intentional)"
        description: "排版、网格、色彩、留白创造层次分明、沉浸式体验"
        application: "大标题+留白+强对比+品牌色"
      - principle: "动效赋予意义 (Motion provides meaning)"
        description: "一个焦点在动，其余保持静止。动效引导注意力、传达状态变化"
        application: "标准缓动曲线(Standard Decelerate/Accelerate) + 编排(Stagger)"

    m3_design_tokens:
      color_system:
        dynamic_color: "Material You — 从用户壁纸自动提取5个关键色(Accent1~3 + Neutral1~2)，生成完整调色板(13色调×4色阶)"
        tonal_palette: "HCT色彩空间(色相+彩度+色调)，保证无障碍对比度"
        roles: ["Primary/On Primary", "Primary Container/On PC", "Secondary/On Secondary", "Secondary Container/On SC", "Tertiary/On Tertiary", "Tertiary Container/On TC", "Error/On Error", "Surface/On Surface", "Surface Variant", "Outline/Outline Variant", "Scrim"]
      typography:
        scale: ["Display L(57)", "Display M(45)", "Display S(36)", "Headline L(32)", "Headline M(28)", "Headline S(24)", "Title L(22)", "Title M(16)", "Title S(14)", "Label L(14)", "Label M(12)", "Label S(11)", "Body L(16)", "Body M(14)", "Body S(12)"]
        font_family: "Roboto (Android) / Google Sans (品牌) / Noto Sans (多语言)"
      shape:
        scale: ["None(0px)", "Extra Small(4px)", "Small(8px)", "Medium(12px)", "Large(16px)", "Extra Large(28px)", "Full(50%)"]
        corner_sizes: ["None(0)", "XS(4)", "S(8)", "M(12)", "L(16)", "XL(28)", "Full(50%)"]
      elevation:
        levels: [0, 1, 2, 3, 4, 5]  # M3简化为6级(dps)
        role: "Surface Tint叠加替代传统阴影（浅色模式Tint+阴影，暗色模式仅Tint）"

  microsoft_fluent:
    name: "Microsoft Fluent Design System"
    authority: "Microsoft"
    platforms: ["Windows", "Web", "iOS", "Android", "macOS", "Teams", "Xbox"]
    
    core_principles:
      - principle: "光感 (Light)"
        description: "通过光影/弥散/动画营造空间关系"
        application: "Acrylic(亚克力)材质 — 背景模糊+噪点纹理"
      - principle: "深度 (Depth)"
        description: "分层内容传达信息层级，而非堆叠边框"
        application: "Elevation + Shadow + Parallax滚动"
      - principle: "动效 (Motion)"
        description: "连接过渡流畅连贯，页与页之间无缝转换"
        application: "Connected Animation(共享元素过渡) + Directional Hint"
      - principle: "材质 (Material)"
        description: "物理质感赋予界面温度和真实感"
        application: "Acrylic(半透明)/Mica(壁纸取样)/Smoke(半透明黑色)三种材质"
      - principle: "缩放 (Scale)"
        description: "跨设备一致体验，从HoloLens到Surface Hub"
        application: "自适应布局 + 输入方式自适应(触控/笔/鼠标/键盘)"

    key_design_features:
      - feature: "Acrylic材质"
        description: "高斯模糊背景 + 噪点纹理 + 色彩取样，模拟毛玻璃"
        use_case: "侧边导航、面板背景、上下文菜单"
      - feature: "Mica材质"
        description: "只取桌面壁纸主色调一次（非实时），性能更优"
        use_case: "应用标题栏、基础层背景"
      - feature: "Reveal Highlight"
        description: "鼠标悬停时高亮边界，模拟光照射边缘"
        use_case: "列表项、导航项、卡片"
      - feature: "Connected Animation"
        description: "一个元素在两个页面间连续动画过渡"
        use_case: "列表→详情页过渡"

  # 三大标准对比矩阵
  cross_standard_comparison:
    dimensions:
      - dimension: "核心理念"
        apple: "清晰、遵从、深度 — 内容为王，UI隐身"
        google: "Material隐喻、鲜明图形化、动效有意义 — 触感与活力"
        microsoft: "光感、深度、动效、材质、缩放 — 跨设备统一感"
      - dimension: "材质系统"
        apple: "Vibrancy/Blur — 原生模糊效果 (UIBlurEffect)"
        google: "Surface Tint — 色调叠加模拟层级"
        microsoft: "Acrylic/Mica/Smoke — 三类材质各司其职"
      - dimension: "色彩系统"
        apple: "语义化系统色 + 深浅自动适配"
        google: "HCT色彩空间 + Dynamic Color壁纸驱动"
        microsoft: "SharedColors + 主题色搭配"
      - dimension: "字体系统"
        apple: "SF Pro/Display/Text 可变字体 + Dynamic Type"
        google: "Roboto/Google Sans + 15级排版规模"
        microsoft: "Segoe UI/Fluent Variable + 跨端适配"
      - dimension: "动效原则"
        apple: "自然物理曲线 + Spring Animation"
        google: "Standard Easing (Emphasized/Decelerate/Accelerate) + 编排(Stagger)"
        microsoft: "Directional + Connected Animation + 速度梯度(0~5级)"
      - dimension: "无障碍"
        apple: "VoiceOver + Dynamic Type + 辅助触控 + 引导式访问 (最完善)"
        google: "TalkBack + 文本缩放 + 高对比度模式"
        microsoft: "Narrator + 高对比度主题 + Ease of Access"

# ============================================
# Part 9: 2026设计前沿趋势（V2.0.0 新增，来源站酷）
# ============================================
design_trends_2026:
  description: "从站酷2026年最新UI设计作品中提炼的前沿趋势，反映行业最新方向"
  source: "站酷ZCOOL UI发现页 (2026年作品集为主)"
  
  trends:
    - id: "TREND-001"
      name: "AI全面嵌入设计流程"
      severity: "颠覆性"
      description: |
        AI不再是独立功能，而是渗透到设计的每个环节：AI辅助生成初稿→设计师精调→AI自动适配多端→AI生成Design Specs。
        作品标题中大量出现AI工作流、AI辅助设计等关键词，标志着设计师角色从「执行者」转向「AI指挥者」。
      signals: ["AIUX作品集全攻略", "AI辅助设计工作流", "AI宠物", "AI耳机翻译"]
      impact_on_ux: "UX Agent需考虑AI交互模式（对话式、流式、cotinking Indicator）作为基础交互范式"

    - id: "TREND-002"
      name: "B端企业级设计精细化"
      severity: "主流"
      description: |
        B端不再只是「Ant Design默认样式」，而是高度定制化的企业级设计系统。
        每个行业（工业/能源/教育/医疗）都在建设自己的Design Tokens和组件库。
      signals: ["智慧校园数据驾驶舱", "数智电网大屏", "工业互联网平台", "智能业务中台"]
      impact_on_ux: "UX Agent需按行业推荐定制化B端风格，而非依赖通用设计系统默认样式"

    - id: "TREND-003"
      name: "数字孪生+实时可视化"
      severity: "上升"
      description: "3D场景与数据看板的深度融合，物理世界实时映射到数字界面"
      signals: ["数字孪生智慧工厂", "汽车检测中心智慧平台", "能源管理系统"]
      impact_on_ux: "终端适配需考虑大屏展示+实时刷新+告警色彩编码"

    - id: "TREND-004"
      name: "车载HMI/出行界面生态化"
      severity: "上升"
      description: "从单一车机扩展到车联网生态（手机+车机+手表+充电桩+云端）"
      signals: ["车载HMI设计", "飞机FTD仿真飞控", "新能源打车APP"]
      impact_on_ux: "新增车载终端设计规格，安全交互原则（大触控目标/暗色主题/语音优先）"

    - id: "TREND-005"
      name: "3D设计平民化"
      severity: "持续"
      description: "Spline/WebGL/Three.js让3D不再是专业3D设计师的专利，UI设计师也能轻松使用"
      signals: ["3dicons", "FREE 3D Avatar Assets", "C4D+AE结合动效"]
      impact_on_ux: "3D元素可能成为标准UI组件，类似今天的图标"

    - id: "TREND-006"
      name: "视觉升级与品牌焕新"
      severity: "持续"
      description: "大量作品标注「焕新」「改版」「升级」，存量产品进入体验翻新周期"
      signals: ["Tagoo改版", "跑步APP焕新", "海外金融APP重设计"]
      impact_on_ux: "UX需考虑渐进式升级策略，新旧设计语言并存过渡"

    - id: "TREND-007"
      name: "跨端一体化设计"
      severity: "加速"
      description: "设计系统追求「一次设计，多端输出」，Design Tokens成为跨端一致性核心"
      signals: ["HarmonyOS全场景分布式", "小程序+APP双端设计", "PC+Mobile+H5三端产品"]
      impact_on_ux: "UX Agent必须优先考虑Design Tokens体系建设，而非单独设计每个终端"

# ============================================
# Part 10: 设计原则精华（V2.0.0 新增）
# AI从UI中国5个专题中提取的永不过时核心原则
# 丢弃过时工具教程（AE教程/扁平化素材/Apple Watch 2014规范等）
# ============================================
design_principles_essence:
  description: |
    从UI中国5个专题（交互理论/动效设计/扁平化/信息图/Apple Watch）中AI提取的核心原则。
    过滤标准：工具教程(过时) → 丢弃；特定版本规范(已废弃) → 丢弃；核心理论/原则 → 保留精华。
    融合Nielsen十大可用性原则 + ISO 9241交互标准形成统一知识体系。
  filtered_sources: "已过滤丢弃约70%的过时内容（工具教程/旧版本规范/素材分享），仅保留约30%的核心原则精华"

  nielsen_heuristics:
    name: "Nielsen十大可用性原则（1994年提出，至今仍是交互设计基石）"
    authority: "Jakob Nielsen / NNGroup"
    principles:
      - id: "NH-01"
        name: "系统状态可见性 (Visibility of System Status)"
        description: "系统应始终在合理时间内通过适当反馈告知用户当前状态"
        examples: ["加载进度条", "下载完成提示", "连接状态指示器", "当前所在位置面包屑"]
      - id: "NH-02"
        name: "系统与现实世界匹配 (Match between System and Real World)"
        description: "使用用户熟悉的语言（词汇/概念/隐喻），而非系统术语"
        examples: ["购物车(而非'暂存商品列表')", "回收站(而非'文件删除队列')", "文件夹/桌面隐喻"]
      - id: "NH-03"
        name: "用户控制与自由 (User Control and Freedom)"
        description: "用户常误操作，需要清晰的紧急出口（撤销/重做）"
        examples: ["撤销(Undo/Command+Z)", "返回按钮", "取消订阅一键操作"]
      - id: "NH-04"
        name: "一致性与标准 (Consistency and Standards)"
        description: "同一平台内同一词语/功能/操作保持一致，遵循平台约定"
        examples: ["iOS左上角=返回", "红色=删除/警告", "蓝色文字=可点击链接"]
      - id: "NH-05"
        name: "错误预防 (Error Prevention)"
        description: "好的设计首先防止问题发生，而非出了错再告知"
        examples: ["灰色不可用按钮", "格式提示(YYYY-MM-DD)", "删除前二次确认"]
      - id: "NH-06"
        name: "识别而非回忆 (Recognition Rather Than Recall)"
        description: "最小化用户记忆负担，让选项/操作可见可识"
        examples: ["搜索建议/历史", "下拉选择代替手动输入", "最近使用列表"]
      - id: "NH-07"
        name: "灵活性与使用效率 (Flexibility and Efficiency of Use)"
        description: "为新手和专家提供不同操作路径（快捷键/批量操作/自定义）"
        examples: ["Command+S快捷键", "批量审批", "自定义工具栏", "模板保存"]
      - id: "NH-08"
        name: "美学与极简设计 (Aesthetic and Minimalist Design)"
        description: "界面不包含不相关信息，每增加一个元素都削弱相关元素的可见性"
        examples: ["渐进式披露(Progressive Disclosure)", "上下文操作(悬停显现)", "空状态引导而非空白"]
      - id: "NH-09"
        name: "帮助用户识别/诊断/恢复错误 (Help Users Recognize, Diagnose, and Recover from Errors)"
        description: "错误消息用通俗语言，精确指出问题并建议解决方案"
        examples: ["密码需8位以上(而非'输入无效')", "该用户名已被注册，试试这些建议", "加载失败，点击重试"]
      - id: "NH-10"
        name: "帮助与文档 (Help and Documentation)"
        description: "最好无需文档就能使用，必要时提供简洁的帮助"
        examples: ["工具提示(Tooltip)", "新手引导", "搜索帮助中心", "AI问答助手"]

  interaction_principles:
    source: "UI中国「交互理论」专题(2017-2018) + 行业共识"
    eternal_principles:
      - principle: "Fitts法则 (Fitts's Law)"
        description: "到达目标的时间与目标距离成正比，与目标大小成反比"
        implication: "高频操作按钮要大、要近、要边缘对齐（移动端底部Tab栏）"
      - principle: "Hick法则 (Hick's Law)"
        description: "选择越多，决策时间越长"
        implication: "减少选项数量、分组、渐进式展示(3-7项为最佳认知区间)"
      - principle: "米勒定律 (Miller's Law)"
        description: "普通人工作记忆能处理约7±2个信息块"
        implication: "导航≤7项、表单分组≤7字段、内容分块(Chunking)"
      - principle: "泰斯勒定律 (Tesler's Law)"
        description: "每个系统都有固有的不可简化复杂度"
        implication: "复杂是必然的，设计师要做的是把复杂度内化到系统(而非转移到用户)"
      - principle: "接近法则 (Law of Proximity)"
        description: "空间中接近的物体会被感知为一组"
        implication: "相关表单字段靠近、Tab切换内容区靠近、卡片内部信息聚合"
      - principle: "防错原则 (Poka-Yoke)"
        description: "丰田生产方式的防呆设计，应用到UI中防误操作"
        implication: "自动格式化(手机号分段)、智能默认值、删除确认、输入约束(数字键盘)"

  motion_principles:
    source: "UI中国「动效设计」专题(2014-2017) + Material Design Motion"
    # 注意：具体AE/C4D教程已丢弃，仅保留动效设计原则
    eternal_principles:
      - principle: "自然物理 (Natural Physics)"
        description: "动效应模拟真实物理运动——缓入缓出、弹性、重力感"
        implementation: "使用Spring Animation/bezier-curve而非Linear，默认缓动曲线cubic-bezier(0.4, 0.0, 0.2, 1.0)"
      - principle: "编排与节奏 (Choreography)"
        description: "多个元素的动效应有先后顺序(stagger)，引导视觉流向。顺序：中心→周围→细节"
        implementation: "列表项依次淡入(50ms间隔)、页面元素从左上→右下呈现"
      - principle: "聚焦与引导 (Focus & Guidance)"
        description: "动效的作用是引导注意力，告知用户「什么变了」「接下来看哪里」"
        implementation: "一个焦点在动其余静止；新元素放大淡入，删除元素缩小淡出"
      - principle: "品牌性格 (Brand Character)"
        description: "动效是品牌的第四维度(色彩/字体/图形+动效)，传达品牌调性"
        implementation: "金融APP：精确、克制的缓动；游戏APP：弹性、夸张的弹簧动画；健康APP：柔和、自然的呼吸感"
      - principle: "功能不可见原则"
        description: "动效不是为了美观，而是为了传达信息——告诉用户发生了什么、为什么发生、接下来怎么办"
        implementation: "列表删除：先收起→后续元素上移(告诉用户空白被填补)。状态切换：旧内容淡出→新内容淡入(告知变化已发生)"

  infographic_principles:
    source: "UI中国「信息图」专题(2014) + 现代数据可视化共识"
    eternal_principles:
      - id: "IG-01"
        name: "目的先行"
        description: "先明确信息图要传达的核心信息（一句话），再决定视觉形式" 
      - id: "IG-02"
        name: "数据可视化编码"
        description: "选择正确的图表类型（趋势用折线、占比用饼图、比较用柱状图、分布用散点）"
      - id: "IG-03"
        name: "色彩有限且有意义"
        description: "主色≤5种，每种色彩必须有语义（红=警告/下降，绿=正常/增长），色盲友好"
      - id: "IG-04"
        name: "层级引导阅读"
        description: "大字标题→核心数字→辅助图表→细节标注，Z型或F型浏览路径"
      - id: "IG-05"
        name: "数据诚实"
        description: "不扭曲坐标轴、不从零截断（除非明确标注）、不3D饼图（失真）"

  filtered_history_lesson:
    description: "扁平化设计史的价值在于理解设计演化逻辑，而非具体技法"
    key_lesson: |
      2013-2015扁平化取代拟物化是UI设计史上最大的范式转移：
      - 驱动力：移动端小屏需要更清晰的信息层级（拟物化纹理干扰认知）、响应式设计需要可伸缩的简洁元素
      - 教训：扁平化初期过度简洁导致「可用性问题」（按钮不像按钮→Material Design的FAB浮动按钮回补视觉层次）
      - 进化：Flat → Flat 2.0(准扁平) → Material Design(有层次感) → Neumorphism(新拟物) → Glassmorphism(玻璃拟物)
      - 核心认知：风格没有对错，只有「当前技术条件+终端限制」下的最优解。设计师不应追逐风格，而应理解风格背后的约束条件。

