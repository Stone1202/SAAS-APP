# ============================================
# 设计领域知识库 — 综合设计风格、系统与标准
# 版本：v3.0.0
# 学习日期：2026-07-18（增量更新）
# ============================================
# V3.0.0 SDL升级：
#   新增SDL场景驱动学习结构（domain_roles/business_problems/scenario_maps/cross_domain_bridges/role_perspectives）
# ============================================
# V2.0.0 增量升级：
#   新增来源：站酷2026设计前沿 + UI中国5个专题（交互/动效/扁平化/信息图/Apple Watch）
#   智能过滤：丢弃完全过时内容（2014 Apple Watch HIG专题），提取核心原则（Nielsen+交互+动效+信息图）
#   新增大块：Part 8 国际巨头设计标准（Apple HIG/Material Design/Microsoft Fluent）
#            Part 9 2026设计前沿趋势（AI赋能/B端企业/数字孪生/车载HMI）
#            Part 10 设计原则精华（核心交互理论+动效原则+信息图准则）
#            Part 11 过滤日志（过时内容丢弃记录+原因）
#   AI聚焦原则：只留精华，丢弃过时工具教程，融入国际设计标准
# ============================================
# V1.0.0 初始版本：
#   来源：Pixso资源社区
#   内容：设计资源分类/终端规格/12种风格/风格矩阵/6大设计系统/UX参考指南
# ============================================
# 组织结构：终端规格 → 风格词典 → 风格矩阵 → 设计系统 → 国际标准 → 2026趋势 → 设计原则精华 → 过滤日志
# ============================================

domain:
  name: "综合设计体系知识库"
  category: "design"
  version: "v3.0.0"
  learning_method: "scenario_driven_v1.0.0"
  learned_at: "2026-07-18"
  source_urls:
    - "https://pixso.cn/community/home?classify=file"
    - "https://www.zcool.com.cn/discover/17?page=1"
    - "https://topic.ui.cn/detail?tid=23 （交互理论）"
    - "https://topic.ui.cn/detail?tid=20 （动效设计）"
    - "https://topic.ui.cn/detail?tid=22 （扁平化专题）"
    - "https://topic.ui.cn/detail?tid=21 （信息图专题）"
    - "https://topic.ui.cn/detail?tid=35 （Apple Watch HIG）→ 已丢弃"
  description: |
    融合Pixso社区、站酷2026、UI中国设计专题 + Apple HIG/Material Design/Fluent Design三大国际标准。
    AI智能过滤：丢弃2014-2017年过时工具教程/已废弃规范，保留核心设计原则，新增2026前沿趋势。
    按「终端×风格」矩阵 + 国际标准 + 原则精华三维组织，供UX Agent设计阶段参考。
  curation_policy: "AI自主过滤：时间超过5年且内容被新技术/新规范取代的→丢弃；核心设计理论/原则→保留精华；大公司现行设计标准→融入"
  status: "approved"

# ============================================
# SDL: Scenario-Driven Learning V1.0.0
# 设计领域（非业务域），SDL聚焦设计问题与设计场景
# ============================================
sdl:
  domain_roles:
    - role: "UX设计师"
      description: "负责交互设计、信息架构、用户体验流程，把控交互一致性"
    - role: "UI设计师"
      description: "负责视觉设计、Design Tokens定义、组件规范、视觉统一性"
    - role: "前端开发者"
      description: "消费设计系统，将设计稿还原为代码，反馈开发可行性"
    - role: "产品经理"
      description: "定义产品需求，关注设计效率与设计到上线的周期"
    - role: "设计系统维护者"
      description: "维护和迭代设计系统，管理Design Tokens版本，审核组件贡献"

  business_problems:
    - id: "BP-DS-001"
      problem: "设计风格不统一，同一产品不同页面视觉割裂"
      impact: "用户在不同页面间切换时感知到品牌不一致，降低信任感与专业度"
      design_dimension: "视觉一致性"
    - id: "BP-DS-002"
      problem: "Design Tokens管理混乱，改一个色值需要全局搜索替换"
      impact: "设计迭代效率极低，容易出现遗漏导致部分组件颜色未更新，且无法追溯变更历史"
      design_dimension: "设计系统工程化"
    - id: "BP-DS-003"
      problem: "多终端适配成本高，PC/平板/手机设计重复劳动"
      impact: "同一功能需要在多个终端分别设计，设计师疲于适配而非创造，且终端间体验不一致"
      design_dimension: "跨端设计"
    - id: "BP-DS-004"
      problem: "设计到开发的交付断层，标注和切图效率低"
      impact: "设计师手动标注耗时易错，开发还原度低，反复沟通修改拉长迭代周期"
      design_dimension: "设计交付"
    - id: "BP-DS-005"
      problem: "缺乏可复用的设计系统，每次新项目从零搭建"
      impact: "重复造轮子，设计质量依赖个人能力，新人上手慢，设计债务持续累积"
      design_dimension: "设计系统建设"

  scenario_maps:
    - id: "SC-DS-001"
      name: "设计系统初始化（选型+Tokens定义）"
      flow: "识别产品终端与业务场景 → 选择设计语言/系统（Ant Design/Element Plus/Apple HIG/Material Design） → 定义Design Tokens（色彩/字体/间距/圆角/阴影/图标） → 搭建组件库基础 → 输出设计系统文档"
      key_roles: ["设计系统维护者", "UI设计师", "前端开发者"]
      reference: "Part 4 终端×风格矩阵 + Part 5 设计系统详解 + Part 8 国际标准"
    - id: "SC-DS-002"
      name: "页面设计（从设计系统到具体页面）"
      flow: "PM/BA给出需求 → UX设计师参考风格词典匹配风格 → UI设计师基于Design Tokens设计页面 → 复用已有组件 → 必要时扩展新组件变体 → 页面草图+交互标注"
      key_roles: ["UX设计师", "UI设计师", "产品经理"]
      reference: "Part 3 设计风格词典 + Part 10 设计原则精华"
    - id: "SC-DS-003"
      name: "设计交付与开发对接"
      flow: "UI设计师完成设计稿 → 导出设计标注（颜色/字体/间距/组件状态） → 前端开发者按Design Tokens实现 → 走查还原度 → 反馈设计问题 → 迭代修正"
      key_roles: ["UI设计师", "前端开发者"]
      reference: "Part 6 设计辅助工具与插件"
    - id: "SC-DS-004"
      name: "多终端适配设计"
      flow: "明确目标终端（PC/移动端/平板/穿戴） → 参考终端规格确定分辨率+栅格+断点 → 设计系统跨端Tokens映射 → 各终端差异化设计 → 响应式/自适应策略 → 终端一致性走查"
      key_roles: ["UX设计师", "UI设计师", "前端开发者"]
      reference: "Part 2 终端规格体系 + Part 4 终端×风格矩阵"

  cross_domain_bridges:
    - from: "design"
      to: "wechat-account"
      description: "微信小程序设计需遵循微信官方设计规范（WeUI/小程序原生组件），设计系统需产出小程序专用组件变体"
      trigger: "SC-DS-004 多终端适配（小程序终端） + SC-DS-002 页面设计（小程序场景）"
    - from: "design"
      to: "wechat-work"
      description: "企业微信应用需适配WeCom设计规范，包括应用内嵌H5、工作台应用、客户联系侧边栏等场景的设计标准"
      trigger: "SC-DS-004 多终端适配（企业微信终端）"

  role_perspectives:
    - role: "UX设计师视角（交互一致性）"
      concerns: ["尼尔森十大原则的落地", "跨页面交互模式统一", "导航与信息架构一致性", "动效编排与过渡的规范", "无障碍设计覆盖"]
    - role: "UI设计师视角（视觉统一性）"
      concerns: ["Design Tokens的语义化与完整性", "组件变体的覆盖度", "暗色模式/多主题支持", "品牌调性的视觉传达", "图标系统的统一"]
    - role: "前端视角（开发还原度）"
      concerns: ["Design Tokens到CSS变量的映射", "组件API与设计变体的对应", "响应式断点实现的复杂度", "动效曲线的代码可实现性", "设计标注的精度与完整性"]
    - role: "PM视角（设计效率）"
      concerns: ["设计到上线的周期", "设计系统的复用率", "新人上手设计系统的成本", "多终端适配的投入产出比", "设计迭代的版本管理"]

