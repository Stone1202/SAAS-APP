# ============================================
# Part A: 商业问题（SDL Layer 0）
# ============================================
business_problems:
  - id: "BP-IM-001"
    role: "App开发者/集成方"
    problem: "如何快速集成即时通信功能？"
    pain_point: "从零开发IM功能成本高、周期长、稳定性难以保证"
    value: "使用TUIKit UI组件库快速集成，开发周期从月级降至天级"
    evidence: "腾讯云提供TUIKit（含会话/聊天/搜索/关系链/群组/音视频6大组件）+ 9平台SDK"
    scrm_relevance: 4
    priority: "P0"
    related_scenes: ["S-IM-001"]

  - id: "BP-IM-002"
    role: "App开发者/集成方"
    problem: "如何跨多平台统一集成？"
    pain_point: "多端各自开发维护成本高，体验不一致"
    value: "一套SDK覆盖Android/iOS/Web/小程序/Flutter/Unity/React Native/HarmonyOS 9平台"
    evidence: "TUIKit支持经典版(微信风格)+简约版(WhatsApp风格)+RTL语言"
    scrm_relevance: 3
    priority: "P1"

  - id: "BP-IM-003"
    role: "内容审核员"
    problem: "如何审核聊天内容确保合规？"
    pain_point: "UGC内容可能包含违规文本/图片/音频/视频，人工审核成本高效率低"
    value: "云端审核支持文本(同步)/图片(同步)/音频(异步)/视频(异步)4种类型，6+N审核场景"
    evidence: "消息发送时延从200ms降至50ms（IM内部审核无需外网传输）"
    scrm_relevance: 5
    priority: "P0"
    related_scenes: ["S-IM-004"]

  - id: "BP-IM-004"
    role: "内容审核员"
    problem: "如何处理审核结果和违规内容？"
    pain_point: "审核结果如何回调？违规内容如何拦截？统计数据如何查看？"
    value: "审核结果回调+消息拦截+TUIKit专属拦截样式+6维统计可视化"
    evidence: "支持审核用量抵扣/审核结果明细/审核条数/审核类型/审核用户/违规用户排行6维统计"
    scrm_relevance: 5
    priority: "P0"
    related_scenes: ["S-IM-004"]

  - id: "BP-IM-005"
    role: "系统管理员"
    problem: "如何配置审核策略适应不同业务场景？"
    pain_point: "不同场景（单聊/群聊/资料）需要不同审核策略，自定义场景需要灵活配置"
    value: "6大内置场景(单聊/群聊/用户资料/群资料/群成员资料/关系链) + N个自定义审核场景"
    evidence: "不同场景可配置不同审核策略，支持特定用户免审，支持自定义消息拆分送审"
    scrm_relevance: 5
    priority: "P0"

  - id: "BP-IM-006"
    role: "App运营人员"
    problem: "如何管理海量用户消息和群组？"
    pain_point: "海量用户的消息存储、群组管理、关系链管理需要强大的管理API"
    value: "84个REST API覆盖账号/消息/群组/关系链/会话/运营全链路管理"
    evidence: "群组管理38个API（最多），支持5种群组类型（工作群/社交群/会议群/直播群/社群）"
    scrm_relevance: 4
    priority: "P1"
    related_scenes: ["S-IM-002", "S-IM-003"]

  - id: "BP-IM-007"
    role: "App运营人员"
    problem: "如何实现离线消息推送确保触达？"
    pain_point: "用户离线时消息无法触达，影响用户体验和消息送达率"
    value: "支持10+厂商推送（小米/华为/荣耀/OPPO/vivo/魅族/APNs/FCM），全链路排查工具"
    evidence: "普通消息推送+全员/标签推送+自定义样式+推送记录统计"
    scrm_relevance: 3
    priority: "P1"
    related_scenes: ["S-IM-006"]

  - id: "BP-IM-008"
    role: "客服人员"
    problem: "如何使用AI智能客服处理用户咨询？"
    pain_point: "人工客服成本高，非工作时间无响应"
    value: "生成式AI一站式智能客服（智能机器人+人工客服），三端四角色两种接入方式"
    evidence: "免开发接入+含UI组件接入，支持Web/小程序/Flutter/iOS/Android"
    scrm_relevance: 4
    priority: "P2"
    related_scenes: ["S-IM-007"]

  - id: "BP-IM-009"
    role: "App开发者/集成方"
    problem: "如何实现音视频通话和多人会议？"
    pain_point: "音视频通话和会议系统开发复杂，需要信令+媒体+UI"
    value: "TUICallKit(1v1通话)+TUIRoomKit(多人会议)，基于IM SDK信令+聊天+用户状态"
    evidence: "支持企业会议/网络研讨会/在线教育场景"
    scrm_relevance: 3
    priority: "P2"

  - id: "BP-IM-010"
    role: "App运营人员"
    problem: "如何对直播群进行管理？"
    pain_point: "直播场景下海量并发用户管理、广播消息、在线人数统计"
    value: "直播群（AVChatRoom）支持无上限成员、广播消息、在线人数/成员列表查询、成员标记"
    evidence: "5个直播群专属API：get_online_member_num/get_members/modify_user_info/send_broadcast_msg"
    scrm_relevance: 5
    priority: "P1"
    related_scenes: ["S-IM-005"]

# ============================================
# Part B: 跨域衔接（SDL Layer 2）
# ============================================
cross_domain_bridges:
  - id: "CDB-IM-001"
    from_domain: "腾讯云即时通信IM"
    to_domain: "腾讯云MPS"
    bridge_type: "数据流衔接"
    description: "IM直播群语音消息→MPS音频识别→审核结果→IM消息拦截/标记"
    integration_point: "IM云端审核回调 + MPS擦音任务回调 → 统一审核处置中心"
    scrm_fusion_value: "直播弹幕+语音双重审核闭环，文本审核(IM同步)+音频审核(MPS异步)互补"
    confidence: 0.9

  - id: "CDB-IM-002"
    from_domain: "腾讯云即时通信IM"
    to_domain: "腾讯云直播"
    bridge_type: "场景衔接"
    description: "直播间创建→IM直播群创建→直播进行中弹幕互动→直播结束→IM群消息存档"
    integration_point: "直播SDK房间ID ↔ IM群组GroupID 映射关系"
    scrm_fusion_value: "直播+IM一体化运营，直播结束后的录播审核+IM消息审计形成完整合规闭环"
    confidence: 0.85

  - id: "CDB-IM-003"
    from_domain: "腾讯云即时通信IM"
    to_domain: "内容安全审核(ai)"
    bridge_type: "能力衔接"
    description: "IM云端审核→审核策略配置→审核结果回调→SCRM审核处置流程"
    integration_point: "IM审核结果回调URL → SCRM审核处置API（统一审核事件入口）"
    scrm_fusion_value: "IM审核与SCRM审核统一管理，IM审核事件接入SCRM审核处置矩阵，实现跨渠道统一审核策略"
    confidence: 0.95

