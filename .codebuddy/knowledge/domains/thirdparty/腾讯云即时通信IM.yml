# ============================================
# Part D: 场景地图增强（SDL Layer 1增强）
# ============================================
scenario_maps:
  - id: "S-IM-001"
    name: "IM快速集成"
    related_topics: ["T-IM-001"]
    related_business_problems: ["BP-IM-001", "BP-IM-002"]
    flow: "选择UI组件(TUIKit/TUICallKit/TUIRoomKit) → 集成SDK → 初始化 → 登录IM账号 → 收发消息"
    participants: ["开发者", "IM SDK", "IM服务端"]
    closure: "开发者集成SDK→初始化成功→登录成功→收发消息验证通过"
    api_chain: ["account_import(导入账号)", "sendmsg(发送消息)"]

  - id: "S-IM-002"
    name: "单聊消息收发"
    related_topics: ["T-IM-007"]
    related_business_problems: ["BP-IM-006"]
    flow: "发送消息 → 云端审核(同步) → 投递 → 已读标记 → 撤回(可选)"
    participants: ["发送方", "IM服务端", "接收方", "审核服务"]
    closure: "消息发送→审核通过→投递成功→已读→可撤回"
    api_chain: ["sendmsg(单发单聊)", "admin_set_msg_read(设置已读)", "admin_msgwithdraw(撤回)"]

  - id: "S-IM-003"
    name: "群组管理"
    related_topics: ["T-IM-008"]
    related_business_problems: ["BP-IM-006"]
    flow: "创建群 → 邀请成员 → 发送群消息 → 禁言管理 → 解散群"
    participants: ["群主", "群成员", "IM服务端"]
    closure: "创建群→成员加入→消息收发→禁言/解禁→解散群"
    api_chain: ["create_group(创建)", "add_group_member(加成员)", "send_group_msg(群消息)", "forbid_send_msg(禁言)", "destroy_group(解散)"]

  - id: "S-IM-004"
    name: "内容审核闭环"
    related_topics: ["T-IM-011"]
    related_business_problems: ["BP-IM-003", "BP-IM-004", "BP-IM-005"]
    flow: "消息发送 → 云端审核(文本/图片同步, 音频/视频异步) → 审核结果(通过/拦截/可疑) → 消息处理(放行/拦截/标记) → 回调通知App后台 → 统计数据更新"
    participants: ["发送方", "IM服务端", "云端审核服务", "App后台(回调)", "审核员"]
    closure: "消息发送→审核→结果处理→回调通知→统计更新→审核员可查看处理"
    api_chain: ["send_group_msg/sendmsg(触发审核)", "审核结果回调(回调URL)", "forbid_illegal_object(封禁违规文件)"]
    scrm_relevance: "HIGH — 与AI-SCRM审核系统核心相关，审核回调可接入SCRM审核处置流程"

  - id: "S-IM-005"
    name: "直播群管理"
    related_topics: ["T-IM-008", "T-IM-014"]
    related_business_problems: ["BP-IM-010"]
    flow: "创建直播群(AVChatRoom) → 用户加入(无上限) → 发送弹幕消息 → 广播消息 → 查询在线人数 → 成员标记 → 禁言管理"
    participants: ["运营", "直播群成员", "IM服务端"]
    closure: "创建直播群→成员加入→弹幕互动→广播消息→在线人数统计→成员管理"
    api_chain: ["create_group(AVChatRoom)", "send_group_msg(弹幕)", "send_broadcast_msg(广播)", "get_online_member_num(在线人数)", "modify_user_info(成员标记)"]
    scrm_relevance: "HIGH — 与AI-SCRM直播审核场景核心相关，直播群弹幕审核+直播语音审核形成双重审核闭环"

  - id: "S-IM-006"
    name: "离线推送"
    related_topics: ["T-IM-004"]
    related_business_problems: ["BP-IM-007"]
    flow: "消息发送 → 接收方离线检测 → 厂商推送(小米/华为/.../FCM) → 用户点击通知 → 打开App → 消息投递"
    participants: ["发送方", "IM服务端", "厂商推送服务", "接收方"]
    closure: "消息发送→离线检测→厂商推送→用户点击→App打开→消息投递"
    api_chain: ["sendmsg(触发推送)", "推送配置(控制台)"]

  - id: "S-IM-007"
    name: "智能客服"
    related_topics: ["T-IM-005"]
    related_business_problems: ["BP-IM-008"]
    flow: "用户发起咨询 → AI机器人接待 → 复杂问题转人工 → 工单管理 → 服务评价"
    participants: ["用户", "AI机器人", "客服人员", "管理员"]
    closure: "用户咨询→AI接待→转人工(如需)→工单处理→服务评价"
    api_chain: ["Desk SDK接入"]

# ============================================
# Part 1: 业务泳道图
# ============================================
business_swimlane: |
  ```mermaid
  flowchart LR
      subgraph 发送方
          A1[发送消息] --> A2[等待审核结果]
      end
      subgraph IM服务端
          B1[接收消息] --> B2{审核类型?}
          B2 -->|文本/图片| B3[同步审核]
          B2 -->|音频/视频| B4[异步审核]
          B3 --> B5{审核结果}
          B4 --> B6[先投递后审核]
          B5 -->|通过| B7[投递消息]
          B5 -->|拦截| B8[拦截消息]
          B5 -->|可疑| B9[标记+投递]
          B6 --> B10[审核完成回调]
          B10 -->|违规| B11[撤回消息]
          B10 -->|正常| B12[保持投递]
      end
      subgraph 接收方
          C1[接收消息] --> C2[展示消息/拦截提示]
      end
      subgraph App后台
          D1[接收审核回调] --> D2[记录审核日志]
          D2 --> D3[更新统计]
      end
      A2 --> B5
      B7 --> C1
      B8 --> C2
      B9 --> C1
      B10 --> D1
      B11 --> C1
  ```

# ============================================
# Part 2: 业务流程
# ============================================
business_process:
  normal_flow: |
    消息发送→云端审核→审核通过→消息投递→接收方展示→已读标记
  exception_flow: |
    消息发送→云端审核→审核拦截→发送方收到拦截通知→接收方收到拦截样式消息
  branch_flow: |
    消息发送→云端审核→审核可疑→消息标记投递→人工复审→保持/撤回
  mermaid: |
    ```mermaid
    flowchart TD
        A[用户发送消息] --> B[IM服务端接收]
        B --> C{内容类型?}
        C -->|文本/图片| D[同步审核]
        C -->|音频/视频| E[异步审核+先投递]
        D --> F{审核结果}
        F -->|通过| G[投递消息]
        F -->|拦截| H[拦截+通知发送方]
        F -->|可疑| I[标记+投递+人工复审]
        E --> J[投递消息]
        J --> K[异步审核完成]
        K -->|违规| L[撤回消息+回调]
        K -->|正常| M[保持投递]
        G --> N[接收方展示]
        H --> O[发送方收到拦截提示]
        L --> N
    ```

# ============================================
# Part 3: 信息流图
# ============================================
information_flow: |
  ```mermaid
  flowchart TD
      subgraph 消息发送
          M1[发送方客户端] -->|消息内容| M2[IM SDK]
          M2 -->|HTTPS| M3[IM服务端]
      end
      subgraph 云端审核
          A1[IM服务端] -->|消息内容| A2[审核引擎]
          A2 -->|文本/图片 同步| A3[审核结果]
          A2 -->|音频/视频 异步| A4[审核回调]
      end
      subgraph 消息投递
          D1[IM服务端] -->|消息| D2[接收方SDK]
          D2 -->|展示| D3[接收方客户端]
      end
      subgraph 审核回调
          C1[审核服务] -->|回调| C2[App后台]
          C2 -->|记录| C3[审核日志]
          C2 -->|统计| C4[审核统计]
      end
      M3 --> A1
      A3 --> D1
      A4 --> C1
  ```

# ============================================
# Part 4: 状态机
# ============================================
state_machine:
  entity: "消息审核状态"
  states: ["待审核", "审核中", "审核通过", "审核拦截", "审核可疑", "异步审核中", "已撤回"]
  transitions:
    - from: "—"
      to: "待审核"
      trigger: "消息发送"
      operator: "发送方"
    - from: "待审核"
      to: "审核中"
      trigger: "同步审核开始"
      operator: "审核服务"
    - from: "审核中"
      to: "审核通过"
      trigger: "审核结果=通过"
      operator: "审核服务"
    - from: "审核中"
      to: "审核拦截"
      trigger: "审核结果=违规"
      operator: "审核服务"
    - from: "审核中"
      to: "审核可疑"
      trigger: "审核结果=可疑"
      operator: "审核服务"
    - from: "待审核"
      to: "异步审核中"
      trigger: "音频/视频先投递后审核"
      operator: "审核服务"
    - from: "异步审核中"
      to: "已撤回"
      trigger: "异步审核结果=违规"
      operator: "审核服务"
    - from: "异步审核中"
      to: "审核通过"
      trigger: "异步审核结果=正常"
      operator: "审核服务"
  mermaid: |
    ```mermaid
    stateDiagram-v2
        [*] --> 待审核: 消息发送
        待审核 --> 审核中: 同步审核(文本/图片)
        待审核 --> 异步审核中: 异步审核(音频/视频)先投递
        审核中 --> 审核通过: 审核结果=通过
        审核中 --> 审核拦截: 审核结果=违规
        审核中 --> 审核可疑: 审核结果=可疑
        异步审核中 --> 审核通过: 异步结果=正常
        异步审核中 --> 已撤回: 异步结果=违规(撤回消息)
        审核通过 --> [*]: 消息正常展示
        审核拦截 --> [*]: 消息拦截
        已撤回 --> [*]: 消息撤回
    ```

# ============================================
# Part 5: 业务操作矩阵
# ============================================
business_operation_matrix:
  roles: ["发送方", "接收方", "审核员", "管理员"]
  states: ["待审核", "审核通过", "审核拦截", "审核可疑", "异步审核中", "已撤回"]
  matrix:
    - role: "发送方"
      state: "待审核"
      operations: ["等待审核结果"]
    - role: "发送方"
      state: "审核通过"
      operations: ["消息已投递", "撤回消息"]
    - role: "发送方"
      state: "审核拦截"
      operations: ["收到拦截通知"]
    - role: "接收方"
      state: "审核通过"
      operations: ["查看消息", "标记已读"]
    - role: "接收方"
      state: "审核拦截"
      operations: ["查看拦截样式消息"]
    - role: "接收方"
      state: "已撤回"
      operations: ["查看撤回提示"]
    - role: "审核员"
      state: "审核可疑"
      operations: ["人工复审", "保持/撤回"]
    - role: "管理员"
      state: "—"
      operations: ["配置审核策略", "查看审核统计", "管理免审用户"]

# ============================================
# Part 6: 业务时序图
# ============================================
business_sequence: |
  ```mermaid
  sequenceDiagram
      participant S as 发送方
      participant IM as IM服务端
      participant A as 云端审核
      participant R as 接收方
      participant B as App后台
      S->>IM: 发送消息
      IM->>A: 送审(文本/图片同步)
      alt 同步审核
          A-->>IM: 审核结果(通过/拦截/可疑)
          alt 通过
              IM->>R: 投递消息
          else 拦截
              IM->>S: 拦截通知
              IM->>R: 拦截样式消息
          else 可疑
              IM->>R: 标记+投递
              IM->>B: 回调(可疑)
          end
      end
      opt 音频/视频异步审核
          IM->>R: 先投递消息
          IM->>A: 异步送审
          A-->>IM: 异步结果
          alt 违规
              IM->>R: 撤回消息
              IM->>B: 回调(违规)
          end
      end
      IM->>B: 审核统计更新
  ```

