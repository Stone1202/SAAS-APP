    chain:
      - step: 1
        api: "create_group (Type=AVChatRoom)"
        desc: "创建直播群"
      - step: 2
        api: "send_group_msg"
        desc: "发送弹幕消息"
      - step: 3
        api: "send_broadcast_msg"
        desc: "发送广播消息（全员推送）"
      - step: 4
        api: "get_online_member_num"
        desc: "查询在线人数"
      - step: 5
        api: "modify_user_info"
        desc: "设置成员标记（如VIP/管理员标记）"
      - step: 6
        api: "forbid_send_msg / ban_group_member"
        desc: "禁言/封禁违规成员"

  cross_scene_audit_to_live:
    name: "跨场景：审核→直播群"
    chain:
      - step: 1
        api: "直播群弹幕消息 send_group_msg"
        desc: "弹幕消息触发云端审核"
      - step: 2
        api: "审核回调"
        desc: "审核结果回调App后台"
      - step: 3
        api: "forbid_send_msg"
        desc: "违规用户禁言"
      - step: 4
        api: "ban_group_member"
        desc: "严重违规封禁成员"
      - step: 5
        api: "group_msg_recall"
        desc: "撤回违规消息"

