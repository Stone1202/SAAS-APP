    name: "内容审核闭环接口串联"
    chain:
      - step: 1
        api: "send_group_msg / sendmsg"
        desc: "用户发送消息（触发云端审核）"
      - step: 2
        api: "云端审核（IM内部，无独立API）"
        desc: "文本/图片同步审核，音频/视频异步审核"
      - step: 3
        api: "审核结果回调→App后台回调URL"
        desc: "审核结果通过HTTP回调通知App后台"
      - step: 4
        api: "forbid_illegal_object（如需）"
        desc: "封禁违规聊天文件（图片/视频等COS存储内容）"
      - step: 5
        api: "group_msg_recall / admin_msgwithdraw"
        desc: "异步审核违规后撤回消息"
      - step: 6
        api: "getappinfo"
        desc: "拉取运营数据含审核统计"

  scene_s_im_005_live_group:
