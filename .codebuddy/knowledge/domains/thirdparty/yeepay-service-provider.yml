      - { role: "SP", state: "ACTIVE", operation: "投诉处理", target: "ACTIVE", scene: "SC-CMP-001/002" }
      - { role: "SP", state: "FROZEN", operation: "沉默商户解冻申请", target: "ACTIVE", scene: "SC-CHG-003" }
