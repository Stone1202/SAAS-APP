# ============================================
# 领域知识：易宝服务商（Yeepay Service Provider）
# 分类：thirdparty（第三方）> 品牌：易宝（Yeepay）
# 版本：v3.0.0（V2.1.0 + SDL V1.0.0场景驱动学习：domain_roles + business_problems + scenario_maps + cross_domain_bridges + role_perspectives）
# 创建日期：2026-07-17
# 更新日期：2026-07-20（V3.0.0 SDL四层结构新增）
# 来源：
#   - https://open.yeepay.com/docs/products/fwssfk/guide/development-tips （开发指南）
#   - https://open.yeepay.com/docs/products/fwssfk/api/options__rest__v2.0__mer__register__saas__merchant （API列表入口）
# 学习方式：/learn-domain V2.1.0（增量学习，--deep-params自动启用）→ SDL V1.0.0 场景驱动结构化增强
# 抓取方式：agent-browser（JavaScript动态渲染页面，web_fetch降级）
# ============================================

domain:
  name: "易宝服务商"
  category: "thirdparty"
  brand: "易宝（Yeepay）"
  product_code: "fwssfk"
  version: "3.0.0"
  created_at: "2026-07-17"
  updated_at: "2026-07-20"
  learning_method: "scenario_driven_v1.0.0"
  sources:
    - url: "https://open.yeepay.com/docs/products/fwssfk/guide/development-tips"
      type: "https"
      title: "易宝服务商开放平台-开发指南"
      fetched_at: "2026-07-17"
      fetch_method: "agent-browser"
    - url: "https://open.yeepay.com/docs/products/fwssfk/api/options__rest__v2.0__mer__register__saas__merchant"
      type: "https"
      title: "易宝服务商-API列表入口（特约商户入网）"
      fetched_at: "2026-07-17"
      fetch_method: "agent-browser（展开左侧导航获取全部150+API；V2.1.0增量：逐个点击入网类6个API提取参数详情）"

  # ============================================
  # SDL V1.0.0: Scenario-Driven Learning 四层结构（v3.0.0 新增）
  # 面向BA需求分析的场景化领域知识，强化跨域桥接与角色视角
  # ============================================

  # --- Layer 1: 领域角色（角色身份与职责） ---
  domain_roles:
    - role_id: "DR-YP-001"
      role_name: "SaaS服务商"
      role_type: "integrator"
      description: "使用易宝服务商开放API为特约商户提供支付能力的SaaS平台，负责商户入驻、交易管理、资金清算等全流程。在SCRM场景中，SaaS服务商将支付能力嵌入经营闭环，为商户提供收款、对账、退款等一站式服务。"
      key_responsibilities:
        - "特约商户入驻管理（入网/变更/解冻）"
        - "调用易宝API完成资金收付（充值/转账/提现/付款）"
        - "聚合支付收银台集成与运营"
        - "渠道报备与实名认证管理"
        - "投诉工单处理与退款审核"
        - "记账簿管理与资金流水监控"
      api_scope: "全部150+API的调用方"

    - role_id: "DR-YP-002"
      role_name: "特约商户"
      role_type: "user"
      description: "通过SaaS服务商接入易宝支付的实际经营主体（企业/个体/小微），使用服务商提供的支付功能完成收款、退款、提现等操作。在SCRM场景中，特约商户是SaaS平台的核心客户，其支付体验直接影响平台留存。"
      key_responsibilities:
        - "提供入网资质材料（营业执照/法人身份/结算账户）"
        - "在SaaS平台发起收款/退款/提现"
        - "查看交易流水与资金余额"
        - "签署入网协议与意愿认证"
      api_scope: "通过SaaS服务商间接使用，不直接调用API"

    - role_id: "DR-YP-003"
      role_name: "消费者"
      role_type: "end_user"
      description: "在特约商户处消费的最终用户，通过聚合支付（微信/支付宝/银联）完成付款。在SCRM场景中，消费者的支付体验（成功率、退款时效、投诉响应）直接影响商户满意度和平台口碑。"
      key_responsibilities:
        - "扫码/线上完成支付"
        - "发起退款申请"
        - "提交支付投诉"
      api_scope: "不直接调用API，通过支付渠道间接交互"

    - role_id: "DR-YP-004"
      role_name: "易宝平台"
      role_type: "platform"
      description: "提供支付基础设施的清算平台，负责商户资质审核、资金清算、异步通知、风控等核心能力。对外暴露150+ REST API，采用RSA签名+敏感字段加密的安全机制。"
      key_responsibilities:
        - "商户资质审核与开户"
        - "资金清算与结算"
        - "异步通知服务商业务结果"
        - "风控与合规管理"
        - "密钥管理与安全认证"
      api_scope: "全部API的服务端实现"

    - role_id: "DR-YP-005"
      role_name: "银行/支付渠道"
      role_type: "channel"
      description: "底层支付渠道（微信支付/支付宝/银联/网银），负责实际的资金流转。易宝作为聚合层，统一对接各渠道，SaaS服务商只需对接易宝即可获得全渠道支付能力。"
      key_responsibilities:
        - "实际资金扣款与清算"
        - "渠道实名认证与报备"
        - "渠道投诉工单生成与反馈"
      api_scope: "不直接暴露给SaaS服务商，通过易宝API间接使用"

  # --- Layer 2: 业务问题（SCRM场景下的痛点与价值） ---
  business_problems:
    - problem_id: "BP-YP-001"
      problem: "SaaS平台缺乏支付能力，无法为商户提供一站式经营闭环"
      pain_point: "商户在SaaS平台完成营销、客户管理后，收款环节需要跳转到第三方支付工具，导致经营数据割裂、用户体验断层"
      value: "通过易宝服务商API将支付能力嵌入SaaS平台，实现「营销-交易-对账-服务」全链路闭环，商户无需离开平台即可完成经营全流程"
      evidence: "SC-MER-001/002/003(入网) + SC-PAY-001~004(资金收付) + SC-AGG-001(聚合支付) 三大场景支撑"
      priority: "P0"
      scrm_relevance: "直接关系SCRM平台的经营闭环能力，是核心差异化竞争力"

    - problem_id: "BP-YP-002"
      problem: "商户入网流程复杂，资质审核周期长，影响商户上线速度"
      pain_point: "传统入网需人工收集资质、线下审核、反复补材料，从申请到开通动辄3-7个工作日，商户流失率高"
      value: "API自动化入网+H5自助入网双通道，资质文件在线提交，审核进度实时可查，入网周期缩短至分钟级（自动化审核）或小时级（人工审核）"
      evidence: "API-MER-001(企业入网) + API-MER-002(小微入网) + API-MER-004(H5入网) + API-MER-003(进度查询) + API-MER-006(资质上传)"
      priority: "P0"
      scrm_relevance: "入网效率直接影响SCRM平台商户增长和激活率"

    - problem_id: "BP-YP-003"
      problem: "多支付渠道管理分散，资金归集和对账困难"
      pain_point: "微信支付、支付宝、银联等渠道各自独立，商户需分别管理多个后台，资金分散在不同账户，对账耗时且易出错"
      value: "聚合支付统一收银台，一笔交易一个订单，资金统一归集到易宝商户账户，提供统一对账单"
      evidence: "SC-AGG-001(聚合支付下单) + SC-PAY-001(充值) + SC-PAY-003(提现) + 渠道报备SC-RPT-001/002"
      priority: "P1"
      scrm_relevance: "资金归集能力是SCRM平台为商户提供经营分析的基础数据源"

    - problem_id: "BP-YP-004"
      problem: "退款/投诉处理依赖人工，效率低易出错"
      pain_point: "退款需人工登录多个渠道后台操作，投诉工单分散在微信/支付宝各自平台，处理不及时导致商户被渠道处罚"
      value: "API统一退款+投诉工单集中管理，支持自动审核退款、模板化回复投诉，处理时效从小时级降至分钟级"
      evidence: "SC-CMP-001(投诉处理) + SC-CMP-002(小程序投诉) + API-LED-007(记账簿退款) + SC-PAY-004(付款冲退)"
      priority: "P1"
      scrm_relevance: "退款/投诉处理效率直接影响SCRM平台的商户服务质量和满意度"

    - problem_id: "BP-YP-005"
      problem: "商户资金流不透明，无法实时掌握经营状况"
      pain_point: "商户看不到实时余额、在途资金、待结算金额，经营决策缺乏资金数据支撑"
      value: "多维度余额查询（银行账户/在途/资金账户/全部）+交易流水实时可查+自动提现规则，资金流完全透明"
      evidence: "API-ACC-009(银行账户余额) + API-PAY-017(在途余额) + API-PAY-018(资金账户余额) + API-PAY-019(全部账户余额) + API-PAY-016(自动提现规则)"
      priority: "P1"
      scrm_relevance: "资金透明度是SCRM平台为商户提供经营看板的关键数据维度"

    - problem_id: "BP-YP-006"
      problem: "分账结算规则复杂，利润分配容易出错"
      pain_point: "平台型商户需要向多个分账方分配收入，手动计算和打款工作量大，容易错账漏账"
      value: "记账簿体系支持资金冻结/解冻/拨入/分账，配合自动结算规则，实现精准的利润分配"
      evidence: "SC-LED-001(记账簿管理) + API-LED-005(冻结) + API-LED-006(解冻) + API-LED-003(资金拨入) + functionService.SHARE(分账功能)"
      priority: "P2"
      scrm_relevance: "分账能力支持SCRM平台的渠道分销、员工佣金等业务场景"

  # --- Layer 3: 场景地图（关键业务场景的结构化描述） ---
  scenario_maps:
    - scenario_id: "SC-YP-001"
      scenario_name: "特约商户入网（企业/个体/小微）"
      description: "SaaS服务商通过API或H5页面帮助特约商户完成在易宝的注册开户，含资质审核、意愿认证、协议签署、银行绑卡全流程"
      trigger: "商户在SaaS平台点击「开通支付服务」或运营人员在后台为商户创建入网申请"
      participant_roles: ["DR-YP-001(SaaS服务商)", "DR-YP-002(特约商户)", "DR-YP-004(易宝平台)", "DR-YP-005(银行)"]
      api_chain:
        - step: 1
          api: "API-MER-006"
          action: "上传商户资质文件（营业执照/法人身份证）"
        - step: 2
          api: "API-MER-001/002"
          action: "提交入网申请（企业/个体或小微），含主体信息/法人信息/结算账户/产品配置"
        - step: 3
          api: "API-MER-003"
          action: "轮询查询入网进度（异步审核）"
        - step: 4
          api: "异步通知"
          action: "接收开户结果+绑卡结果通知，获取merchantNo"
      alternative_flow: "H5自助入网：API-MER-004获取H5链接 → 商户自主填写 → API-MER-005查询进度"
      closure: "applicationStatus=COMPLETED 且 merchantNo已生成，商户进入ACTIVE状态"
      related_scenes: ["SC-MER-001", "SC-MER-002", "SC-MER-003"]

    - scenario_id: "SC-YP-002"
      scenario_name: "资金收付（充值/转账/提现/付款）"
      description: "SaaS服务商为商户提供完整的资金流转能力：充值到易宝账户、账户间转账、提现到银行卡、付款到供应商/个人"
      trigger: "商户在SaaS平台发起充值/转账/提现/付款操作"
      participant_roles: ["DR-YP-001(SaaS服务商)", "DR-YP-002(特约商户)", "DR-YP-004(易宝平台)", "DR-YP-005(银行/渠道)"]
      api_chain:
        - step: 1
          api: "API-PAY-001/002/003(充值) / API-PAY-006(转账) / API-PAY-010/011(提现) / API-PAY-019/022/023/024(付款)"
          action: "发起资金操作请求（含幂等键requestNo+金额+目标账户）"
        - step: 2
          api: "API-PAY-004/007/012/020(查询)"
          action: "查询交易结果（同步或异步）"
        - step: 3
          api: "异步通知"
          action: "接收交易结果通知（成功/失败/处理中）"
      closure: "交易状态终态（成功/失败），资金实际到账"
      related_scenes: ["SC-PAY-001", "SC-PAY-002", "SC-PAY-003", "SC-PAY-004"]

    - scenario_id: "SC-YP-003"
      scenario_name: "聚合支付收银"
      description: "SaaS服务商集成聚合支付能力，为商户提供统一收银台，消费者可通过微信/支付宝/银联/刷脸等多种方式付款"
      trigger: "消费者在商户页面选择商品后进入收银台"
      participant_roles: ["DR-YP-001(SaaS服务商)", "DR-YP-002(特约商户)", "DR-YP-003(消费者)", "DR-YP-004(易宝平台)", "DR-YP-005(支付渠道)"]
      api_chain:
        - step: 1
          api: "API-AGG-001/002"
          action: "托管下单或统一下单（含订单金额/商品描述/支付方式）"
        - step: 2
          api: "API-AGG-003"
          action: "付款码支付（消费者出示付款码场景）"
        - step: 3
          api: "API-AGG-004"
          action: "超时关单（未支付订单自动关闭）"
        - step: 4
          api: "异步通知"
          action: "接收支付结果通知"
      alternative_flow: "签约代扣：API-AGG-006(签约) → 自动扣款；刷脸付：API-AGG-009(获取刷脸凭证)"
      closure: "消费者支付成功，资金进入商户易宝账户"
      related_scenes: ["SC-AGG-001", "SC-AGG-002", "SC-AGG-003"]

    - scenario_id: "SC-YP-004"
      scenario_name: "退款与投诉处理"
      description: "SaaS服务商统一处理来自微信/支付宝渠道的消费者投诉，支持查询、回复协商、退款审核、处理完成的完整闭环"
      trigger: "消费者在微信/支付宝发起支付投诉，或商户在SaaS平台主动发起退款"
      participant_roles: ["DR-YP-001(SaaS服务商)", "DR-YP-002(特约商户)", "DR-YP-003(消费者)", "DR-YP-004(易宝平台)", "DR-YP-005(支付渠道)"]
      api_chain:
        - step: 1
          api: "API-CMP-001"
          action: "查询投诉订单列表（按时间/状态筛选）"
        - step: 2
          api: "API-CMP-002/003"
          action: "查看投诉详情与协商历史"
        - step: 3
          api: "API-CMP-004"
          action: "回复用户处理内容（模板化或自定义）"
        - step: 4
          api: "API-CMP-005"
          action: "更新退款审核结果（同意/拒绝退款）"
        - step: 5
          api: "API-CMP-006"
          action: "反馈处理完成（投诉工单关闭）"
      alternative_flow: "记账簿退款：API-LED-007(无需投诉直接退款)；小程序投诉：API-CMP-008~010"
      closure: "投诉工单状态=已处理，退款（如有）到账消费者"
      related_scenes: ["SC-CMP-001", "SC-CMP-002"]

    - scenario_id: "SC-YP-005"
      scenario_name: "分账结算"
      description: "SaaS服务商通过记账簿体系实现商户资金的分账管理：资金冻结→按规则分配→解冻打款，支持多级分账方"
      trigger: "交易完成进入结算周期，或平台按规则触发分账"
      participant_roles: ["DR-YP-001(SaaS服务商)", "DR-YP-002(特约商户)", "DR-YP-004(易宝平台)"]
      api_chain:
        - step: 1
          api: "API-LED-001"
          action: "开立记账簿（为分账场景创建独立记账单元）"
        - step: 2
          api: "API-LED-003"
          action: "资金拨入记账簿（从商户账户拨入待分账资金）"
        - step: 3
          api: "API-LED-005"
          action: "冻结待分账金额（防止分账期间资金被挪用）"
        - step: 4
          api: "API-LED-006"
          action: "解冻并按规则分配到各分账方"
        - step: 5
          api: "API-LED-009"
          action: "查询来账流水（各分账方确认到账）"
      closure: "全部分账方收到应得款项，记账簿余额清零或留存"
      related_scenes: ["SC-LED-001", "SC-SET-001"]

  # --- Layer 4: 跨域桥接（与其他领域知识的关联） ---
  cross_domain_bridges:
    - bridge_id: "CDB-YP-001"
      bridge_name: "易宝 → 微信支付（聚合支付路由与渠道降级）"
      description: "聚合支付场景下，易宝作为聚合层统一对接微信支付渠道。SaaS服务商通过易宝API下单后，易宝根据路由规则选择微信支付（默认）或降级到支付宝/银联。"
      shared_entities: ["merchantNo(易宝)↔sub_mch_id(微信支付服务商)", "orderNo↔out_trade_no"]
      data_flow: "SaaS服务商 → API-AGG-001(易宝托管下单) → 易宝路由 → 微信支付统一下单 → 消费者付款 → 支付结果回调 → 异步通知服务商"
      scenarios: ["SC-AGG-001(聚合支付下单)", "SC-RPT-001(微信实名认证)", "SC-RPT-002(渠道报备)"]

    - bridge_id: "CDB-YP-002"
      bridge_name: "易宝 → 微信账号（商户身份映射）"
      description: "特约商户在易宝的merchantNo需要与微信生态的appid/openid体系建立映射，以实现微信公众号支付、小程序支付等场景。"
      shared_entities: ["merchantNo↔appid(微信公众号/小程序)", "渠道报备信息(API-RPT-009~013)"]
      data_flow: "SaaS服务商 → API-RPT-012(公众号配置) → 易宝同步微信 → 微信返回授权状态 → API-RPT-011(授权状态查询)"
      scenarios: ["SC-RPT-001(微信实名认证)", "SC-RPT-002(公众号配置)"]

    - bridge_id: "CDB-YP-003"
      bridge_name: "易宝 → 企业微信（支付通知触达）"
      description: "交易结果、退款进度、投诉通知等支付事件通过企业微信消息推送触达商户运营人员，实现支付事件与SCRM通知体系的融合。"
      shared_entities: ["交易事件(支付成功/退款/投诉)↔企业微信应用消息"]
      data_flow: "易宝异步通知 → SaaS服务商回调处理 → 匹配商户 → 企业微信发送卡片消息(含交易摘要/金额/操作链接)"
      scenarios: ["SC-PAY-001~004(资金收付异步通知)", "SC-CMP-001(投诉通知)", "SC-YP-004(退款通知)"]

    - bridge_id: "CDB-YP-004"
      bridge_name: "易宝 → 结算域（资金结算流程）"
      description: "易宝的渠道结算账户管理(SC-SET-001)与记账簿体系(SC-LED-001)共同支撑SaaS平台的商户结算业务，结算域负责结算周期、结算规则、结算单生成等业务逻辑。"
      shared_entities: ["渠道结算账户(API-SET-001~003)", "记账簿余额(API-LED-004)", "结算单(结算域生成)"]
      data_flow: "交易完成 → 资金进入商户账户 → 结算周期到达 → 查询渠道结算账户 → 生成结算单 → 记账簿拨入/冻结/解冻 → 打款到商户银行卡"
      scenarios: ["SC-SET-001(渠道结算)", "SC-LED-001(记账簿)", "SC-PAY-003(提现)"]

  # --- Layer 5: 角色视角（不同角色在关键场景下的关注点与操作路径） ---
  role_perspectives:
    - role_ref: "DR-YP-001"
      role_name: "服务商运营人员"
      scenarios:
        - scenario_ref: "SC-YP-001(特约商户入网)"
          concerns: "入网审核通过率、平均入网耗时、驳回原因分布"
          key_actions:
            - "审核商户提交的资质材料完整性"
            - "调用API-MER-001/002提交入网申请"
            - "轮询API-MER-003监控入网进度"
            - "处理驳回：分析驳回原因 → 通知商户补材料 → 重新提交"
            - "入网成功后记录merchantNo，初始化商户配置"
          metrics: ["入网通过率", "平均入网耗时", "驳回率", "各状态停留时长分布"]
        - scenario_ref: "SC-YP-003(聚合支付收银)"
          concerns: "支付成功率、渠道可用性、异常订单处理"
          key_actions:
            - "监控聚合支付成功率（按渠道/时段/金额）"
            - "支付失败时排查原因（渠道故障/余额不足/风控拦截）"
            - "超时未支付订单自动关单（API-AGG-004）"
            - "渠道降级切换（微信不可用时切支付宝）"
          metrics: ["支付成功率", "渠道分布占比", "平均支付耗时", "关单率"]
        - scenario_ref: "SC-YP-004(退款与投诉处理)"
          concerns: "投诉处理时效、退款审核准确率、渠道处罚风险"
          key_actions:
            - "每日巡检投诉订单列表（API-CMP-001）"
            - "分析投诉类型分布，制定处理SOP"
            - "批量处理常规退款审核（API-CMP-005）"
            - "超时未处理投诉预警（渠道有处理时限要求）"
          metrics: ["投诉处理平均时长", "退款审核通过率", "投诉类型分布", "渠道处罚次数"]

    - role_ref: "DR-YP-002"
      role_name: "特约商户"
      scenarios:
        - scenario_ref: "SC-YP-002(资金收付)"
          concerns: "账户余额实时可见、交易记录完整、提现到账速度"
          key_actions:
            - "查看各账户余额（银行账户/在途/资金账户）"
            - "查看交易流水明细（充值/收款/退款/提现）"
            - "发起提现到银行卡（查看提现进度）"
            - "设置自动提现规则（余额超过阈值自动提现）"
          metrics: ["账户余额", "日/月交易额", "提现到账时长", "退款率"]
        - scenario_ref: "SC-YP-004(退款与投诉处理)"
          concerns: "退款是否及时到账消费者、投诉是否影响店铺评分"
          key_actions:
            - "在SaaS平台查看投诉详情与协商历史"
            - "选择同意退款或申诉（提供证据材料）"
            - "追踪退款进度（退款发起→审核→到账）"
          metrics: ["退款处理时长", "投诉解决率", "消费者满意度"]

    - role_ref: "DR-YP-003"
      role_name: "消费者"
      scenarios:
        - scenario_ref: "SC-YP-003(聚合支付收银)"
          concerns: "支付流程顺畅、多种支付方式可选、支付安全"
          key_actions:
            - "选择支付方式（微信/支付宝/银联/刷脸）"
            - "完成付款（扫码或被扫）"
            - "支付失败时重试或切换支付方式"
          metrics: ["支付成功率", "支付耗时", "可用支付方式数量"]
        - scenario_ref: "SC-YP-004(退款与投诉处理)"
          concerns: "退款到账速度、投诉响应及时性、处理结果满意度"
          key_actions:
            - "在支付渠道发起投诉（微信/支付宝投诉入口）"
            - "查看投诉处理进度与商户回复"
            - "确认退款到账"
          metrics: ["退款到账时长", "投诉响应时长", "投诉处理满意度"]

  # ============================================
  # Part 1: 业务泳道（角色×阶段×动作）
  # ============================================
  swimlane:
    roles:
      - { id: "SP", name: "服务商（SaaS服务商）", description: "通过易宝开放平台为特约商户提供支付服务的SaaS服务商" }
      - { id: "YP", name: "易宝支付", description: "支付清算平台，提供开放API和资金清结算" }
      - { id: "MER", name: "特约商户", description: "通过服务商接入易宝支付的商户（企业/个体/小微）" }
      - { id: "BANK", name: "银行", description: "商户结算银行账户开户行" }
      - { id: "CHANNEL", name: "支付渠道（微信/支付宝/银联）", description: "底层支付渠道" }
      - { id: "CONSUMER", name: "消费者", description: "最终付款用户" }

    stages:
      - { id: "S1", name: "商户入网", desc: "商户通过服务商提交入网申请，完成开户和绑卡" }
      - { id: "S2", name: "商户变更", desc: "商户信息变更、产品变更、费率查询、沉默商户解冻" }
      - { id: "S3", name: "账户服务", desc: "银行账户开立、绑卡、余额查询、缴费账户" }
      - { id: "S4", name: "资金收付", desc: "充值、转账、提现、付款、定向付款等资金流转" }
      - { id: "S5", name: "记账簿服务", desc: "记账簿开立、资金拨入、冻结/解冻、退款、来账流水" }
      - { id: "S6", name: "聚合支付", desc: "聚合支付下单、付款码支付、签约/解约、刷脸付" }
      - { id: "S7", name: "渠道报备", desc: "微信/支付宝实名认证、活动报名、渠道报备" }
      - { id: "S8", name: "渠道结算", desc: "渠道结算账户查询/修改" }
      - { id: "S9", name: "信用分", desc: "信用分创建/完结/修改/取消/同步/查询/扣款" }
      - { id: "S10", name: "投诉处理", desc: "微信/支付宝投诉订单查询/回复/退款审核/处理完成" }
      - { id: "S11", name: "银行转账/网银支付", desc: "银行转账支付、到账确认、网银支付" }

  # ============================================
  # Part 2: 业务流程（按场景拆分）
  # ============================================
  business_flow:
    description: "易宝服务商11大业务场景流程"

    scenes:

      # ========== 场景1：特约商户入网（企业/个体） ==========
      - scene_id: "SC-MER-001"
        scene_name: "特约商户入网（企业/个体）"
        scene_desc: "SaaS服务商为特约商户（企业/个体）提交入网申请，完成开户和绑卡"
        mermaid: |
          flowchart TD
            A[服务商调用入网API] --> B[易宝审核商户资质]
            B --> C{开户结果}
            C -->|成功| D[异步通知: 开户成功]
            C -->|失败| E[异步通知: 开户失败+原因]
            D --> F[易宝向银行发起绑卡]
            F --> G{绑卡结果}
            G -->|成功| H[异步通知: 绑卡成功]
            G -->|处理中| I[异步通知: 绑卡处理中]
            G -->|失败| J[异步通知: 绑卡失败+原因]
            H --> K[商户入网完成]
            I --> K
            J --> L[修正银行卡信息重新绑卡]
        apis:
          - { name: "特约商户入网(企业/个体)", ref: "API-MER-001" }
          - { name: "商户入网进度查询", ref: "API-MER-003" }
          - { name: "子商户入网资质文件上传", ref: "API-MER-006" }
        async_notification: "openAccountResult（开户结果+绑卡结果）"

      # ========== 场景2：特约商户入网（小微） ==========
      - scene_id: "SC-MER-002"
        scene_name: "特约商户入网（小微）"
        scene_desc: "SaaS服务商为小微商户提交入网申请（简化流程）"
        apis:
          - { name: "特约商户入网(小微)", ref: "API-MER-002" }
          - { name: "商户入网进度查询", ref: "API-MER-003" }

      # ========== 场景3：H5自助入网 ==========
      - scene_id: "SC-MER-003"
        scene_name: "H5自助入网"
        scene_desc: "服务商获取H5入网链接，商户通过H5页面自助完成入网"
        mermaid: |
          flowchart TD
            A[服务商调用获取H5链接API] --> B[返回H5入网页面URL]
            B --> C[商户打开H5页面自助填写]
            C --> D[易宝处理入网]
            D --> E[服务商查询H5入网进度]
        apis:
          - { name: "获取H5入网链接", ref: "API-MER-004" }
          - { name: "H5入网进度查询", ref: "API-MER-005" }

      # ========== 场景4：商户变更服务 ==========
      - scene_id: "SC-CHG-001"
        scene_name: "商户信息变更"
        scene_desc: "商户基础信息变更（名称/法人/联系方式等）"
        apis:
          - { name: "商户信息变更", ref: "API-CHG-001" }
          - { name: "商户信息变更进度查询", ref: "API-CHG-003" }

      - scene_id: "SC-CHG-002"
        scene_name: "商户产品变更"
        scene_desc: "商户开通/关闭支付产品，费率变更"
        apis:
          - { name: "商户产品变更", ref: "API-CHG-002" }
          - { name: "商户产品费率查询", ref: "API-CHG-004" }
          - { name: "商户产品变更进度查询", ref: "API-CHG-005" }

      - scene_id: "SC-CHG-003"
        scene_name: "沉默商户解冻"
        scene_desc: "长期未交易的商户被冻结后申请解冻"
        apis:
          - { name: "沉默商户解冻申请", ref: "API-CHG-006" }
          - { name: "沉默商户解冻申请进度查询", ref: "API-CHG-007" }

      # ========== 场景5：账户服务 ==========
      - scene_id: "SC-ACC-001"
        scene_name: "银行账户开立与绑卡"
        scene_desc: "为商户开立银行账户并绑卡"
        apis:
          - { name: "开立银行账户", ref: "API-ACC-001" }
          - { name: "多渠道绑卡", ref: "API-ACC-002" }
          - { name: "查询绑卡申请", ref: "API-ACC-003" }
          - { name: "开立银行账户-申请短验", ref: "API-ACC-005" }
          - { name: "开立银行账户-短验确认", ref: "API-ACC-006" }
          - { name: "开立银行账户查询", ref: "API-ACC-007" }

      - scene_id: "SC-ACC-002"
        scene_name: "账户查询"
        scene_desc: "查询商户基础信息、银行卡信息、账户余额"
        apis:
          - { name: "查询商户基础信息", ref: "API-ACC-009" }
          - { name: "查询商户银行卡信息", ref: "API-ACC-010" }
          - { name: "银行账户查询余额", ref: "API-ACC-008" }
          - { name: "在途账户余额查询", ref: "API-PAY-017" }
          - { name: "资金账户余额查询", ref: "API-PAY-018" }
          - { name: "全部账户余额查询", ref: "API-PAY-019" }

      - scene_id: "SC-ACC-003"
        scene_name: "缴费账户"
        scene_desc: "申请开通缴费账户、绑定卡、查询"
        apis:
          - { name: "申请开通缴费账户", ref: "API-ACC-011" }
          - { name: "缴费账户绑定卡", ref: "API-ACC-012" }
          - { name: "查询缴费账户", ref: "API-ACC-013" }

      # ========== 场景6：资金收付 ==========
      - scene_id: "SC-PAY-001"
        scene_name: "充值"
        scene_desc: "多种支付方式充值（网银/银行汇款/多种支付）"
        apis:
          - { name: "充值-下单（多种支付）", ref: "API-PAY-001" }
          - { name: "充值-网银下单", ref: "API-PAY-002" }
          - { name: "充值-银行汇款下单", ref: "API-PAY-003" }
          - { name: "充值-查询", ref: "API-PAY-004" }
          - { name: "充值订单批量查询", ref: "API-PAY-005" }

      - scene_id: "SC-PAY-002"
        scene_name: "转账"
        scene_desc: "账户间转账、转账到支付宝/微信"
        apis:
          - { name: "转账-下单", ref: "API-PAY-006" }
          - { name: "转账-查询", ref: "API-PAY-007" }
          - { name: "转账到支付宝", ref: "API-ACC-004" }
          - { name: "转账到支付宝（单笔）", ref: "API-ACC-005" }
          - { name: "转账到微信零钱-下单", ref: "API-PAY-008" }
          - { name: "转账到微信零钱-查询", ref: "API-PAY-009" }

      - scene_id: "SC-PAY-003"
        scene_name: "提现"
        scene_desc: "提现到银行卡，支持自动提现规则"
        apis:
          - { name: "提现-下单", ref: "API-PAY-010" }
          - { name: "提现-下单（H5版）", ref: "API-PAY-011" }
          - { name: "提现-查询", ref: "API-PAY-012" }
          - { name: "提现卡查询", ref: "API-PAY-013" }
          - { name: "提现卡-添加", ref: "API-PAY-014" }
          - { name: "提现卡-修改/注销", ref: "API-PAY-015" }
          - { name: "自动提现-规则设置", ref: "API-PAY-016" }
          - { name: "自动提现-规则查询", ref: "API-PAY-017" }
          - { name: "自动提现-规则作废", ref: "API-PAY-018" }

      - scene_id: "SC-PAY-004"
        scene_name: "付款"
        scene_desc: "付款到供应商/个人、定向付款、付款冲退"
        apis:
          - { name: "付款-下单", ref: "API-PAY-019" }
          - { name: "付款-查询", ref: "API-PAY-020" }
          - { name: "付款-撤销", ref: "API-PAY-021" }
          - { name: "付款到供应商/个人-下单", ref: "API-PAY-022" }
          - { name: "付款-下单（多场景）", ref: "API-PAY-023" }
          - { name: "定向付款-下单", ref: "API-PAY-024" }
          - { name: "付款冲退-查询", ref: "API-PAY-025" }
          - { name: "付款到供应商--申请添加供应商", ref: "API-PAY-026" }
          - { name: "付款到供应商--查询已添加的供应商", ref: "API-PAY-027" }
          - { name: "付款到供应商--查询申请进度", ref: "API-PAY-028" }
          - { name: "付款到个人--申请添加个人用户", ref: "API-PAY-029" }
          - { name: "付款到个人--查询已添加的个人用户", ref: "API-PAY-030" }
          - { name: "付款到个人--查询申请进度", ref: "API-PAY-031" }

      # ========== 场景7：记账簿服务 ==========
      - scene_id: "SC-LED-001"
        scene_name: "记账簿管理"
        scene_desc: "记账簿开立、资金拨入、冻结/解冻、退款、来账流水查询"
        apis:
          - { name: "转账到支付宝-开立记账本", ref: "API-LED-001" }
          - { name: "记账本资金拨入记录查询", ref: "API-LED-002" }
          - { name: "转账到支付宝-记账本资金拨入", ref: "API-LED-003" }
          - { name: "转账到支付宝-记账本查询", ref: "API-LED-004" }
          - { name: "冻结记账薄金额", ref: "API-LED-005" }
          - { name: "解冻记账薄金额", ref: "API-LED-006" }
          - { name: "记账簿退款", ref: "API-LED-007" }
          - { name: "记账簿退款查询", ref: "API-LED-008" }
          - { name: "批量查询记账簿来账流水", ref: "API-LED-009" }
          - { name: "记账簿冻结记录查询", ref: "API-LED-010" }
          - { name: "记账簿解冻记录查询", ref: "API-LED-011" }

      # ========== 场景8：聚合支付 ==========
      - scene_id: "SC-AGG-001"
        scene_name: "聚合支付下单与支付"
        scene_desc: "聚合支付托管下单、统一下单、付款码支付"
        apis:
          - { name: "聚合支付托管下单", ref: "API-AGG-001" }
          - { name: "聚合支付统一下单", ref: "API-AGG-002" }
          - { name: "付款码支付", ref: "API-AGG-003" }
          - { name: "聚合关单", ref: "API-AGG-004" }
          - { name: "生成聚合订单码", ref: "API-AGG-005" }

      - scene_id: "SC-AGG-002"
        scene_name: "聚合支付签约管理"
        scene_desc: "聚合支付签约/解约/签约查询"
        apis:
          - { name: "签约", ref: "API-AGG-006" }
          - { name: "签约查询", ref: "API-AGG-007" }
          - { name: "解约", ref: "API-AGG-008" }

      - scene_id: "SC-AGG-003"
        scene_name: "刷脸付"
        scene_desc: "获取刷脸付调用凭证"
        apis:
          - { name: "获取刷脸付调用凭证", ref: "API-AGG-009" }

      # ========== 场景9：渠道报备 ==========
      - scene_id: "SC-RPT-001"
        scene_name: "微信/支付宝实名认证"
        scene_desc: "微信和支付宝的商户实名认证申请/撤销/查询"
        apis:
          - { name: "微信实名认证申请单申请", ref: "API-RPT-001" }
          - { name: "撤销微信实名认证申请单", ref: "API-RPT-002" }
          - { name: "查询微信实名认证状态", ref: "API-RPT-003" }
