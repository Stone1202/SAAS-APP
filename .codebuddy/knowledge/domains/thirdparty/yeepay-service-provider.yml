  # Part 4: 业务操作矩阵（角色×状态×操作）
  # ============================================
  business_operation_matrix:
    states:
      - { id: "INIT", name: "未入网" }
      - { id: "PENDING", name: "入网处理中" }
      - { id: "ACCOUNT_SUCCESS", name: "开户成功-绑卡处理中" }
      - { id: "ACTIVE", name: "正常运营" }
      - { id: "REJECTED", name: "入网拒绝" }
      - { id: "BANK_FAIL", name: "开户成功-绑卡失败" }
      - { id: "FROZEN", name: "沉默冻结" }
      - { id: "CLOSED", name: "已关闭" }

    matrix:
      - { role: "SP", state: "INIT", operation: "特约商户入网", target: "PENDING", scene: "SC-MER-001/002" }
      - { role: "SP", state: "INIT", operation: "获取H5入网链接", target: "INIT", scene: "SC-MER-003" }
      - { role: "SP", state: "PENDING", operation: "商户入网进度查询", target: "PENDING/ACCOUNT_SUCCESS/REJECTED", scene: "SC-MER-001" }
      - { role: "YP", state: "PENDING", operation: "审核商户资质", target: "ACCOUNT_SUCCESS/REJECTED", scene: "SC-MER-001" }
      - { role: "YP", state: "ACCOUNT_SUCCESS", operation: "发起绑卡", target: "ACTIVE/BANK_FAIL", scene: "SC-MER-001" }
      - { role: "SP", state: "ACCOUNT_SUCCESS", operation: "等待绑卡异步通知", target: "ACTIVE/BANK_FAIL", scene: "SC-MER-001" }
      - { role: "SP", state: "ACTIVE", operation: "商户信息变更", target: "ACTIVE", scene: "SC-CHG-001" }
      - { role: "SP", state: "ACTIVE", operation: "商户产品变更", target: "ACTIVE", scene: "SC-CHG-002" }
      - { role: "SP", state: "ACTIVE", operation: "充值/转账/提现/付款", target: "ACTIVE", scene: "SC-PAY-001~004" }
      - { role: "SP", state: "ACTIVE", operation: "聚合支付下单", target: "ACTIVE", scene: "SC-AGG-001" }
