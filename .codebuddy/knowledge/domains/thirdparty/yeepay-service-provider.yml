  # ============================================
  # Part 3: 信息流（核心信息主体）
  # ============================================
  information_flow:
    entities:
      - name: "商户入网请求"
        producer: "服务商（SP）"
        consumer: "易宝支付（YP）"
        key_fields: ["requestNo", "merchantName", "merchantType", "businessLicenseNo", "legalPersonName", "legalPersonIdNo(加密)", "bankAccountNo(加密)", "productConfig", "businessScene", "uboInfoList(受益人)", "businessConfig(支付业务配置)"]

      - name: "开户结果通知"
        producer: "易宝支付（YP）"
        consumer: "服务商（SP）"
        key_fields: ["requestNo", "openAccountStatus(SUCCESS/FAIL)", "openAccountMessage", "bindBankStatus(SUCCESS/PROCESS/FAIL)", "bindBankMessage"]

      - name: "资金交易请求"
        producer: "服务商（SP）/特约商户（MER）"
        consumer: "易宝支付（YP）"
        key_fields: ["requestNo", "merchantNo", "amount", "orderNo", "bankAccountNo", "payChannel"]

      - name: "资金交易结果通知"
        producer: "易宝支付（YP）"
        consumer: "服务商（SP）"
        key_fields: ["requestNo", "orderNo", "tradeStatus", "tradeAmount", "tradeTime", "errorCode", "errorMessage"]

      - name: "渠道报备请求"
        producer: "服务商（SP）"
        consumer: "易宝支付（YP）→ 渠道（CHANNEL）"
        key_fields: ["merchantNo", "channelType(WECHAT/ALIPAY/UNIONPAY)", "reportType", "reportData"]

