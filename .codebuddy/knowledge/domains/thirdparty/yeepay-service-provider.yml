  # ============================================
  solution_summary:
    product_name: "易宝服务商解决方案（fwssfk）"
    description: |
      易宝支付为SaaS服务商提供的完整支付接入解决方案，覆盖商户全生命周期：
      入网→变更→账户→资金收付→记账簿→聚合支付→渠道报备→结算→信用分→投诉处理→银行转账。
      共150+API接口，14大业务场景。

    api_categories:
      - { category: "入网", api_count: 10, scenes: ["SC-MER-001", "SC-MER-002", "SC-MER-003"] }
      - { category: "变更服务", api_count: 8, scenes: ["SC-CHG-001", "SC-CHG-002", "SC-CHG-003"] }
      - { category: "账户服务", api_count: 13, scenes: ["SC-ACC-001", "SC-ACC-002", "SC-ACC-003"] }
      - { category: "资金收付", api_count: 31, scenes: ["SC-PAY-001", "SC-PAY-002", "SC-PAY-003", "SC-PAY-004"] }
      - { category: "记账簿服务", api_count: 11, scenes: ["SC-LED-001"] }
      - { category: "聚合支付", api_count: 9, scenes: ["SC-AGG-001", "SC-AGG-002", "SC-AGG-003"] }
      - { category: "渠道报备", api_count: 14, scenes: ["SC-RPT-001", "SC-RPT-002"] }
      - { category: "渠道结算", api_count: 3, scenes: ["SC-SET-001"] }
      - { category: "信用分", api_count: 7, scenes: ["SC-CRD-001"] }
      - { category: "投诉处理", api_count: 10, scenes: ["SC-CMP-001", "SC-CMP-002"] }
      - { category: "银行转账/网银支付", api_count: 4, scenes: ["SC-BNK-001", "SC-BNK-002"] }
      - { category: "其他服务", api_count: 14, scenes: ["SC-OTH-001"] }

    total_apis: 150+
    total_scenes: 14

    security_requirements:
      - "密钥管理：RSA密钥对，商户私钥本地保管，易宝公钥平台配置，定期轮换"
      - "通信安全：全链路HTTPS，敏感数据加密传输（身份证号/银行卡号等）"
      - "业务安全：幂等性控制（requestNo唯一标识），详细日志记录，金额限制+频率控制+异常监控"

    integration_steps:
      - { step: 1, name: "商户入网并签约产品", substeps: ["查看产品开通情况", "检查应用配置"] }
      - { step: 2, name: "密钥配置", substeps: ["密钥制备（RSA密钥对）", "密钥配置（平台配置公钥）"] }
      - { step: 3, name: "SDK集成", substeps: ["Java开发者：使用易宝SDK", "其他语言：按API文档自行集成"] }
      - { step: 4, name: "开发对接", substeps: ["API对接准备（请求头+签名+加密）", "关键开发要点", "异步通知处理"] }
      - { step: 5, name: "测试验证", substeps: ["沙箱环境测试", "联调测试"] }
      - { step: 6, name: "安全建议", substeps: ["密钥管理", "通信安全", "业务安全"] }

    common_issues:
      - { issue: "产品计费策略与SAAS服务商返佣策略不一致", solution: "联系群里运营，查询开通产品的计费规则" }

