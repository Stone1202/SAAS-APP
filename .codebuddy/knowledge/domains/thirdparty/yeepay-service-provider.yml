  # ============================================
  # Part 12: API参数字典（V2.1.0 新增）
  # 入网类6个API参数完整提取（其余API待强化学习补充）
  # 参数语义角色: PRIMARY_KEY/IDEMPOTENT_KEY/AMOUNT/STATUS/SENSITIVE/TIMESTAMP/SIGNATURE/REFERENCE/BUSINESS_PARAM/PAGINATION/QUERY_FILTER/RESPONSE_META
  # 参数来源类型: user_input/upstream_api/system_generated/config/computed
  # 加密: none/rsa/aes/mask
  # ============================================
  api_param_dictionary:
    description: "V2.1.0增量学习：入网类6个API参数深度提取，含语义角色+来源+加密+枚举+校验"
    coverage: "6/150+ API（入网类全覆盖），其余API待强化学习选项f)逐步补充"

    # ========== API-MER-001: 特约商户入网(企业/个体) ==========
    API-MER-001:
      api_name: "特约商户入网(企业/个体)"
      api_path: "/rest/v2.0/mer/register/saas/merchant"
      method: "POST"
      content_type: "application/x-www-form-urlencoded"
      requires_signature: true
      request_params:
        - { field: "requestNo", type: "string(64)", required: true, description: "入网请求号", source_type: "user_input", encryption: "none", validation: "唯一性：非驳回状态不允许重复", semantic_role: "IDEMPOTENT_KEY", example: "YBRWQQH20210622XXXXXX" }
        - { field: "businessRole", type: "string", required: true, description: "入网商户业务角色", source_type: "user_input", encryption: "none", enum_values: ["ORDINARY_MERCHANT", "PLATFORM_MERCHANT", "SETTLED_MERCHANT", "SHARE_MERCHANT", "HEAD_CHAIN", "BRANCH_CHAIN"], semantic_role: "BUSINESS_PARAM", example: "ORDINARY_MERCHANT" }
        - { field: "parentMerchantNo", type: "string(32)", required: true, description: "上级商户编号（SAAS服务商/平台商/连锁总店商编）", source_type: "config", encryption: "none", semantic_role: "REFERENCE", example: "10080011235" }
        - { field: "merchantSubjectInfo", type: "string(JSON)", required: true, description: "商户主体信息（signName/shortName等）", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "merchantCorporationInfo", type: "string(JSON)", required: true, description: "商户法人信息（法人证件类型/编号/正反面URL/手机号）", source_type: "user_input", encryption: "none", semantic_role: "SENSITIVE", note: "含法人身份证号/手机号，需加密传输" }
        - { field: "businessAddressInfo", type: "string(JSON)", required: true, description: "经营地址（省/市/区/详细地址）", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "notifyUrl", type: "string(256)", required: true, description: "商户回调地址（接收审核/驳回/完成通知）", source_type: "config", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "productInfo", type: "string(JSON)", required: true, description: "开通产品信息（productCode/rateType/percentRate/fixedRate）", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "industryCategoryInfo", type: "string(JSON)", required: false, description: "经营类目（一级行业/二级行业分类编码）", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "accountInfo", type: "string(JSON)", required: true, description: "结算账户信息（bankAccountType/bankCardNo/bankCode）", source_type: "user_input", encryption: "rsa", semantic_role: "SENSITIVE", note: "银行卡号需RSA加密" }
        - { field: "productQualificationInfo", type: "string(JSON)", required: false, description: "产品资质信息", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "functionService", type: "string(JSON)", required: false, description: "功能服务（SHARE分账/BACKUP备份数量）", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "functionServiceQualificationInfo", type: "string(JSON)", required: false, description: "功能服务配套资质信息", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "businessScene", type: "string(JSON)", required: false, description: "商户收单场景（businessSceneList/isAppIdConfig等）", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }

      response_params:
        - { field: "returnCode", type: "string", required: true, description: "响应编码", semantic_role: "RESPONSE_META" }
        - { field: "returnMsg", type: "string", required: true, description: "响应描述", semantic_role: "RESPONSE_META" }
        - { field: "requestNo", type: "string(64)", required: false, description: "入网请求号（校验通过后返回）", semantic_role: "IDEMPOTENT_KEY", downstream_usage: ["API-MER-003"] }
        - { field: "applicationNo", type: "string", required: false, description: "申请单编号（校验通过后返回）", semantic_role: "PRIMARY_KEY", downstream_usage: ["异步通知"] }
        - { field: "applicationStatus", type: "string", required: false, description: "申请状态", enum_values: ["REVIEW_BACK", "AUTHENTICITY_VERIFYING", "AGREEMENT_SIGNING", "BUSINESS_OPENING", "COMPLETED"], semantic_role: "STATUS" }

      notification_params:
        notification_event: "入网结果通知"
        content_type: "application/json"
        correlation_field: "requestNo"
        params:
          - { field: "requestNo", type: "string(64)", required: true, description: "商户入网请求号", semantic_role: "IDEMPOTENT_KEY" }
          - { field: "applicationNo", type: "string(64)", required: true, description: "入网申请单编号", semantic_role: "PRIMARY_KEY" }
          - { field: "applicationStatus", type: "string(64)", required: true, description: "申请状态", enum_values: ["REVIEW_BACK(申请已驳回)", "AUTHENTICITY_VERIFYING(真实性验证中)", "AGREEMENT_SIGNING(协议待签署)", "BUSINESS_OPENING(业务开通中)", "COMPLETED(申请已完成)"], semantic_role: "STATUS" }
          - { field: "merchantNo", type: "string(32)", required: false, description: "易宝内部商户编号（商编生成后返回）", semantic_role: "PRIMARY_KEY", downstream_usage: ["API-MER-003", "API-CHG-001~007", "API-ACC-001~014", "API-PAY-001~031", "全部需merchantNo的API"] }
          - { field: "auditOpinion", type: "string(1024)", required: false, description: "驳回原因/报备失败原因/资质缺失说明", semantic_role: "BUSINESS_PARAM" }
          - { field: "progressDescription", type: "string(128)", required: false, description: "进度说明（REMIT_AUTH=待意愿认证）", semantic_role: "STATUS" }
          - { field: "agreementSignUrl", type: "string(256)", required: false, description: "协议签署地址（协议待签署时返回）", semantic_role: "BUSINESS_PARAM" }
          - { field: "intentionAuthUrl", type: "string(256)", required: false, description: "意愿认证地址", semantic_role: "BUSINESS_PARAM" }
          - { field: "openAccountResult", type: "object", required: false, description: "开户结果通知（含openAccountStatus/bindBankStatus等）", semantic_role: "STATUS", sub_fields: ["requestNo", "openAccountStatus(SUCCESS/FAIL)", "openAccountMessage", "bindBankStatus(SUCCESS/PROCESS/FAIL)", "bindBankMessage"] }

      error_codes:
        - { code: "NIG00000", message: "请求成功", handling: "无" }
        - { code: "NIG00001", message: "必填参数有误", handling: "根据报错检查参数信息，如有更多疑问请联系技术支持" }
        - { code: "NIG00002", message: "数据验证有误", handling: "根据报错检查参数信息，如有更多疑问请联系技术支持" }
        - { code: "NIG00003", message: "并发请求报错", handling: "降低请求频率，如有更多疑问请联系技术支持" }
        - { code: "NIG99999", message: "系统未知异常", handling: "联系技术支持或易宝运营" }
        - { code: "40044", message: "业务处理失败（总错误码）", handling: "查看子错误码" }

