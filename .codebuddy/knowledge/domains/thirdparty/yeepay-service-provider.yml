        - { field: "parentMerchantNo", type: "string(32)", required: true, description: "上级商户编号", source_type: "config", encryption: "none", semantic_role: "REFERENCE" }
        - { field: "merchantSubjectInfo", type: "string(JSON)", required: true, description: "商户主体信息（signName/shortName）", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "merchantCorporationInfo", type: "string(JSON)", required: true, description: "商户法人信息（法人证件类型/编号/正反面URL/手机号）", source_type: "user_input", encryption: "none", semantic_role: "SENSITIVE" }
        - { field: "businessAddressInfo", type: "string(JSON)", required: true, description: "经营地址", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "notifyUrl", type: "string(256)", required: true, description: "商户回调地址", source_type: "config", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "productInfo", type: "string(JSON)", required: true, description: "开通产品信息", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "businessRole", type: "string", required: false, description: "入网商户业务角色", source_type: "user_input", encryption: "none", enum_values: ["ORDINARY_MERCHANT", "SETTLED_MERCHANT", "SHARE_MERCHANT", "BRANCH_CHAIN"], semantic_role: "BUSINESS_PARAM", default: "SETTLED_MERCHANT" }
        - { field: "industryCategoryInfo", type: "string(JSON)", required: false, description: "经营类目", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "accountInfo", type: "string(JSON)", required: false, description: "结算账户信息（bankAccountType/bankCardNo/bankCode）", source_type: "user_input", encryption: "rsa", semantic_role: "SENSITIVE" }
        - { field: "productQualificationInfo", type: "string(JSON)", required: false, description: "产品资质", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "functionService", type: "string(JSON)", required: false, description: "功能服务", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }

      response_params:
        - { field: "returnCode", type: "string", required: true, description: "响应编码", semantic_role: "RESPONSE_META" }
        - { field: "returnMsg", type: "string", required: true, description: "响应描述", semantic_role: "RESPONSE_META" }
        - { field: "requestNo", type: "string(64)", required: false, description: "入网请求号", semantic_role: "IDEMPOTENT_KEY", downstream_usage: ["API-MER-003"] }
        - { field: "applicationNo", type: "string", required: false, description: "申请单编号", semantic_role: "PRIMARY_KEY" }
        - { field: "applicationStatus", type: "string", required: false, description: "申请状态", semantic_role: "STATUS" }

      notification_params:
        notification_event: "入网结果通知"
        correlation_field: "requestNo"
        params:
          - { field: "requestNo", type: "string(64)", required: true, description: "商户入网请求号", semantic_role: "IDEMPOTENT_KEY" }
          - { field: "applicationNo", type: "string(64)", required: true, description: "入网申请单编号", semantic_role: "PRIMARY_KEY" }
          - { field: "applicationStatus", type: "string(64)", required: true, description: "申请状态", semantic_role: "STATUS" }
          - { field: "merchantNo", type: "string(32)", required: false, description: "易宝内部商户编号", semantic_role: "PRIMARY_KEY", downstream_usage: ["全部需merchantNo的API"] }

      error_codes:
        - { code: "NIG00000", message: "请求成功", handling: "无" }
        - { code: "NIG00001", message: "必填参数有误", handling: "检查参数" }
        - { code: "NIG00002", message: "数据验证有误", handling: "检查参数" }
        - { code: "NIG99999", message: "系统未知异常", handling: "联系技术支持" }

    # ========== API-MER-003: 商户入网进度查询接口 ==========
    API-MER-003:
      api_name: "商户入网进度查询接口"
      api_path: "/rest/v2.0/mer/register/saas/query"
      method: "POST"
      requires_signature: true
      request_params:
        - { field: "requestNo", type: "string(64)", required: false, description: "入网请求号（与merchantNo二选一必传）", source_type: "upstream_api", source_api: "API-MER-001/API-MER-002", source_field: "requestNo", encryption: "none", semantic_role: "IDEMPOTENT_KEY" }
        - { field: "merchantNo", type: "string", required: false, description: "商户编号（与requestNo二选一必传）", source_type: "upstream_api", source_api: "异步通知", source_field: "merchantNo", encryption: "none", semantic_role: "PRIMARY_KEY" }

      response_params:
        - { field: "returnCode", type: "string", required: true, description: "响应编码", semantic_role: "RESPONSE_META" }
        - { field: "returnMsg", type: "string", required: true, description: "响应描述", semantic_role: "RESPONSE_META" }
        - { field: "applicationNo", type: "string", required: false, description: "申请单编号", semantic_role: "PRIMARY_KEY" }
        - { field: "applicationStatus", type: "string", required: false, description: "申请状态", enum_values: ["REVIEW_BACK", "AUTHENTICITY_VERIFYING", "AGREEMENT_SIGNING", "BUSINESS_OPENING", "COMPLETED"], semantic_role: "STATUS" }
        - { field: "merchantNo", type: "string(32)", required: false, description: "易宝内部商户编号", semantic_role: "PRIMARY_KEY" }

      error_codes:
        - { code: "NIG00000", message: "请求成功", handling: "无" }
        - { code: "NIG00001", message: "必填参数有误", handling: "requestNo和merchantNo至少传一个" }

    # ========== API-MER-004: 获取H5入网链接 ==========
    API-MER-004:
      api_name: "获取H5入网链接"
      api_path: "/rest/v2.0/mer/register/saas/h5/link"
      method: "POST"
      requires_signature: true
      request_params:
        - { field: "requestNo", type: "string(64)", required: true, description: "商户请求流水号", source_type: "user_input", encryption: "none", semantic_role: "IDEMPOTENT_KEY" }
        - { field: "notifyUrl", type: "string(256)", required: true, description: "商户回调地址（接收各节点状态/驳回原因通知）", source_type: "config", encryption: "none", semantic_role: "BUSINESS_PARAM" }
        - { field: "directAgentNo", type: "string(32)", required: false, description: "直属代理编号（代理商拓展下级子商户时传）", source_type: "config", encryption: "none", semantic_role: "REFERENCE" }
        - { field: "parentMerchantNo", type: "string(32)", required: false, description: "上级商户编号（二级平台商/连锁总店入下级商户）", source_type: "config", encryption: "none", semantic_role: "REFERENCE" }
        - { field: "productInfoList", type: "array<object>", required: false, description: "产品列表（设置产品信息及费率）", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }

      response_params:
        - { field: "code", type: "string(64)", required: true, description: "返回码", enum_values: ["MAS000000(成功)"], semantic_role: "RESPONSE_META" }
        - { field: "msg", type: "string(256)", required: true, description: "错误信息（code!=MAS000000时返回失败原因）", semantic_role: "RESPONSE_META" }
        - { field: "requestNo", type: "string(64)", required: true, description: "请求号（回传）", semantic_role: "IDEMPOTENT_KEY", downstream_usage: ["API-MER-005"] }
        - { field: "netInUrl", type: "string(256)", required: true, description: "H5入网页面链接", semantic_role: "BUSINESS_PARAM" }

      notification_params:
        notification_event: "H5入网回调通知"
        correlation_field: "requestNo"
        params:
          - { field: "requestNo", type: "string(64)", required: true, description: "商户请求流水号", semantic_role: "IDEMPOTENT_KEY" }
          - { field: "applicationStatus", type: "string(64)", required: true, description: "申请状态", enum_values: ["WAIT_SIGN(编辑中)", "REVIEWING(申请审核中)", "REVIEW_BACK(申请已驳回)", "AUTHENTICITY_VERIFYING(真实性验证中)", "AGREEMENT_SIGNING(协议待签署)", "BUSINESS_OPENING(业务开通中)", "COMPLETED(申请已完成)"], semantic_role: "STATUS" }
          - { field: "merchantNo", type: "string(32)", required: false, description: "易宝内部商户编号", semantic_role: "PRIMARY_KEY", downstream_usage: ["全部需merchantNo的API"] }

      error_codes:
        - { code: "MAS000000", message: "请求成功", handling: "无" }
        - { code: "NIG00001", message: "必填参数有误", handling: "检查参数" }

    # ========== API-MER-005: H5入网进度查询 ==========
    API-MER-005:
      api_name: "H5入网进度查询"
      api_path: "/rest/v2.0/mer/register/saas/h5/query"
      method: "POST"
      requires_signature: true
      request_params:
        - { field: "requestNo", type: "string(64)", required: true, description: "商户请求流水号（上送请求入网h5页面的流水号）", source_type: "upstream_api", source_api: "API-MER-004", source_field: "requestNo", encryption: "none", semantic_role: "IDEMPOTENT_KEY" }

      response_params:
        - { field: "code", type: "string(64)", required: true, description: "响应编码", enum_values: ["MAS000000(成功)"], semantic_role: "RESPONSE_META" }
        - { field: "msg", type: "string(256)", required: true, description: "错误信息", semantic_role: "RESPONSE_META" }
        - { field: "applicationStatus", type: "string(64)", required: true, description: "申请状态", enum_values: ["WAIT_SIGN", "REVIEWING", "REVIEW_BACK", "AUTHENTICITY_VERIFYING", "AGREEMENT_SIGNING", "BUSINESS_OPENING", "COMPLETED"], semantic_role: "STATUS" }
        - { field: "netInUrl", type: "string(256)", required: true, description: "H5入网链接地址", semantic_role: "BUSINESS_PARAM" }

      error_codes:
        - { code: "MAS000000", message: "请求成功", handling: "无" }
        - { code: "NIG00001", message: "必填参数有误", handling: "检查requestNo" }

    # ========== API-MER-006: 子商户入网资质文件上传 ==========
    API-MER-006:
      api_name: "子商户入网资质文件上传"
      api_path: "/rest/v2.0/mer/register/saas/qualification/upload"
      method: "POST"
      requires_signature: true
      request_params:
        - { field: "merQual", type: "string(binary)", required: true, description: "商户资质文件（二进制文件流）", source_type: "user_input", encryption: "none", semantic_role: "BUSINESS_PARAM" }

      response_params:
        - { field: "returnCode", type: "string", required: true, description: "响应编码", semantic_role: "RESPONSE_META" }
        - { field: "returnMsg", type: "string", required: true, description: "响应信息", semantic_role: "RESPONSE_META" }
        - { field: "merQualUrl", type: "string", required: false, description: "商户资质存储URL（易宝内网专用链接，仅供接口调用时使用，不支持直接预览）", semantic_role: "BUSINESS_PARAM", downstream_usage: ["API-MER-001（作为merchantCorporationInfo等字段的文件URL）"] }

      error_codes:
        - { code: "NIG00000", message: "请求成功", handling: "无" }
        - { code: "NIG00001", message: "必填参数有误", handling: "检查merQual文件" }

  # ============================================
  # Part 13: 参数流转图（V2.1.0 新增）
  # 入网类场景参数流转分析
  # ============================================
  param_flow:
    description: "V2.1.0增量学习：入网类场景参数流转分析（场景内+跨场景+来源溯源+依赖矩阵）"

    # ========== 场景内参数流转 ==========
    intra_scene_param_flow:
      - scene_id: "SC-MER-001"
        scene_name: "特约商户入网（企业/个体）"
        flows:
          - { from_api: "API-MER-001", from_field: "requestNo", to_api: "API-MER-003", to_field: "requestNo", dependency: "optional", note: "查询入网进度，requestNo与merchantNo二选一" }
          - { from_api: "API-MER-001", from_field: "applicationNo", to_api: "异步通知", to_field: "applicationNo", dependency: "required", note: "申请单编号回传异步通知" }
          - { from_api: "异步通知", from_field: "merchantNo", to_api: "API-MER-003", to_field: "merchantNo", dependency: "optional", note: "商户编号查询入网进度" }
          - { from_api: "API-MER-006", from_field: "merQualUrl", to_api: "API-MER-001", to_field: "merchantCorporationInfo.legalLicenceFrontUrl等", dependency: "optional", note: "资质文件URL作为入网API的JSON子字段" }
        mermaid: |
          flowchart LR
            API-MER-001["API-MER-001<br/>入网(企业/个体)"] -->|"requestNo"| API-MER-003["API-MER-003<br/>进度查询"]
            API-MER-001 -->|"applicationNo"| ASYNC1["异步通知<br/>入网结果"]
            ASYNC1 -->|"merchantNo"| API-MER-003
            API-MER-006["API-MER-006<br/>资质文件上传"] -->|"merQualUrl"| API-MER-001

      - scene_id: "SC-MER-002"
        scene_name: "特约商户入网（小微）"
        flows:
          - { from_api: "API-MER-002", from_field: "requestNo", to_api: "API-MER-003", to_field: "requestNo", dependency: "optional" }
          - { from_api: "API-MER-002", from_field: "applicationNo", to_api: "异步通知", to_field: "applicationNo", dependency: "required" }
          - { from_api: "异步通知", from_field: "merchantNo", to_api: "API-MER-003", to_field: "merchantNo", dependency: "optional" }
        mermaid: |
          flowchart LR
            API-MER-002["API-MER-002<br/>入网(小微)"] -->|"requestNo"| API-MER-003["API-MER-003<br/>进度查询"]
            API-MER-002 -->|"applicationNo"| ASYNC2["异步通知<br/>入网结果"]
            ASYNC2 -->|"merchantNo"| API-MER-003

      - scene_id: "SC-MER-003"
        scene_name: "H5自助入网"
        flows:
          - { from_api: "API-MER-004", from_field: "requestNo", to_api: "API-MER-005", to_field: "requestNo", dependency: "required", note: "H5进度查询必须传获取H5链接时的requestNo" }
          - { from_api: "API-MER-004", from_field: "netInUrl", to_api: "商户前端", to_field: "H5页面", dependency: "required", note: "返回H5入网页面URL给商户" }
        mermaid: |
          flowchart LR
            API-MER-004["API-MER-004<br/>获取H5链接"] -->|"requestNo"| API-MER-005["API-MER-005<br/>H5进度查询"]
            API-MER-004 -->|"netInUrl"| MERCHANT["商户H5页面"]

    # ========== 跨场景参数流转 ==========
    cross_scene_param_flow:
      - from_scene: "SC-MER-001/002"
        from_api: "异步通知"
        from_field: "merchantNo"
        to_scene: "SC-CHG-001~003"
        to_api: "API-CHG-001~007"
        to_field: "merchantNo"
        dependency: "required"
        note: "商户变更类API均需merchantNo作为入参"

      - from_scene: "SC-MER-001/002"
        from_api: "异步通知"
        from_field: "merchantNo"
        to_scene: "SC-ACC-001~003"
        to_api: "API-ACC-001~014"
        to_field: "merchantNo"
        dependency: "required"
        note: "账户服务类API均需merchantNo"

      - from_scene: "SC-MER-001/002"
        from_api: "异步通知"
        from_field: "merchantNo"
        to_scene: "SC-PAY-001~004"
        to_api: "API-PAY-001~031"
        to_field: "merchantNo"
        dependency: "required"
        note: "资金收付类API均需merchantNo（前置条件：applicationStatus=COMPLETED）"

      - from_scene: "SC-MER-001/002"
        from_api: "异步通知"
        from_field: "merchantNo"
        to_scene: "SC-AGG-001~003"
        to_api: "API-AGG-001~009"
        to_field: "merchantNo"
        dependency: "required"
        note: "聚合支付类API均需merchantNo"

      - from_scene: "SC-MER-001/002"
        from_api: "异步通知"
        from_field: "merchantNo"
        to_scene: "SC-RPT-001/002"
        to_api: "API-RPT-001~014"
        to_field: "merchantNo"
        dependency: "required"
        note: "渠道报备类API均需merchantNo"

      mermaid: |
        flowchart TD
          SC-MER["SC-MER-001/002<br/>商户入网"] -->|"merchantNo<br/>(异步通知)"| SC-CHG["SC-CHG<br/>商户变更"]
          SC-MER -->|"merchantNo"| SC-ACC["SC-ACC<br/>账户服务"]
          SC-MER -->|"merchantNo"| SC-PAY["SC-PAY<br/>资金收付"]
          SC-MER -->|"merchantNo"| SC-AGG["SC-AGG<br/>聚合支付"]
          SC-MER -->|"merchantNo"| SC-RPT["SC-RPT<br/>渠道报备"]
          SC-MER -->|"merchantNo"| SC-LED["SC-LED<br/>记账簿"]
          SC-MER -->|"merchantNo"| SC-CRD["SC-CRD<br/>信用分"]
          SC-MER -->|"merchantNo"| SC-CMP["SC-CMP<br/>投诉处理"]

    # ========== 参数来源溯源 ==========
    param_source_trace:
      - param_name: "requestNo"
        semantic_role: "IDEMPOTENT_KEY"
        origin:
          api_id: "API-MER-001/API-MER-002/API-MER-004"
          source_type: "user_input"
        flows_to: ["API-MER-003(查询)", "异步通知(关联)", "API-MER-005(H5进度查询)"]
        trace_chain: "服务商生成requestNo → 传入API-MER-001 → 返回applicationNo → 异步通知回传requestNo+applicationStatus+merchantNo → 可用requestNo调API-MER-003查询进度"

      - param_name: "merchantNo"
        semantic_role: "PRIMARY_KEY"
        origin:
          api_id: "异步通知（入网结果通知）"
          source_type: "system_generated"
        flows_to: ["API-MER-003", "API-CHG-001~007", "API-ACC-001~014", "API-PAY-001~031", "API-AGG-001~009", "API-RPT-001~014", "API-LED-001~011", "API-CRD-001~007", "API-CMP-001~010", "API-SET-001~003", "API-BNK-001~004", "API-OTH-001~014"]
        trace_chain: "入网API提交 → 易宝审核 → 开户成功 → 异步通知返回merchantNo → 服务商存储merchantNo → 后续全部业务场景API均以merchantNo为主键"

      - param_name: "applicationNo"
        semantic_role: "PRIMARY_KEY"
        origin:
          api_id: "API-MER-001/API-MER-002"
          source_type: "system_generated"
        flows_to: ["异步通知"]
        trace_chain: "入网API校验通过 → 返回applicationNo → 异步通知回传applicationNo+applicationStatus"

      - param_name: "applicationStatus"
        semantic_role: "STATUS"
        origin:
          api_id: "异步通知/API-MER-003/API-MER-005"
          source_type: "system_generated"
        flows_to: ["业务流程状态机"]
        trace_chain: "入网API提交 → 审核流程推进 → applicationStatus流转：REVIEW_BACK→AUTHENTICITY_VERIFYING→AGREEMENT_SIGNING→BUSINESS_OPENING→COMPLETED"

      - param_name: "parentMerchantNo"
        semantic_role: "REFERENCE"
        origin:
          api_id: "N/A（配置项）"
          source_type: "config"
        flows_to: ["API-MER-001", "API-MER-002", "API-MER-004"]
        trace_chain: "SAAS服务商入网时获得自己的merchantNo → 作为parentMerchantNo传入子商户入网API"

      - param_name: "merQualUrl"
        semantic_role: "BUSINESS_PARAM"
        origin:
          api_id: "API-MER-006"
          source_type: "system_generated"
        flows_to: ["API-MER-001（作为JSON子字段值）"]
        trace_chain: "上传资质文件 → API-MER-006返回merQualUrl → 作为API-MER-001的merchantCorporationInfo.legalLicenceFrontUrl等字段值"

    # ========== 参数依赖矩阵 ==========
    param_dependency_matrix:
      description: "行=消费者API，列=生产者API，单元格=依赖参数列表"
      matrix:
        - { consumer_api: "API-MER-003", producer_api: "API-MER-001", params: ["requestNo"], dependency: "optional" }
        - { consumer_api: "API-MER-003", producer_api: "异步通知", params: ["merchantNo"], dependency: "optional" }
        - { consumer_api: "API-MER-005", producer_api: "API-MER-004", params: ["requestNo"], dependency: "required" }
        - { consumer_api: "API-MER-001", producer_api: "API-MER-006", params: ["merQualUrl(作为JSON子字段)"], dependency: "optional" }
        - { consumer_api: "API-CHG-001~007", producer_api: "异步通知(SC-MER)", params: ["merchantNo"], dependency: "required" }
        - { consumer_api: "API-ACC-001~014", producer_api: "异步通知(SC-MER)", params: ["merchantNo"], dependency: "required" }
        - { consumer_api: "API-PAY-001~031", producer_api: "异步通知(SC-MER)", params: ["merchantNo"], dependency: "required" }
        - { consumer_api: "API-AGG-001~009", producer_api: "异步通知(SC-MER)", params: ["merchantNo"], dependency: "required" }
        - { consumer_api: "API-RPT-001~014", producer_api: "异步通知(SC-MER)", params: ["merchantNo"], dependency: "required" }

    # ========== 参数×状态机关联 ==========
    param_state_association:
      - param_name: "applicationStatus"
        state_machine: "商户入网状态机"
        effect: "入网流程核心状态字段，驱动状态流转：REVIEW_BACK(驳回)→重新提交 / AUTHENTICITY_VERIFYING(待意愿认证)→完成认证 / AGREEMENT_SIGNING(待签署)→签署协议 / BUSINESS_OPENING(开通中)→等待完成 / COMPLETED(完成)"
      - param_name: "merchantNo"
        state_machine: "商户入网状态机"
        effect: "merchantNo生成=开户成功标志，生成后所有状态都会返回此字段；merchantNo是后续所有业务场景的前置条件"
      - param_name: "openAccountResult.openAccountStatus"
        state_machine: "商户入网状态机"
        effect: "SUCCESS→开户成功→进入绑卡流程 / FAIL→开户失败→流程终止"
      - param_name: "openAccountResult.bindBankStatus"
        state_machine: "商户入网状态机"
        effect: "SUCCESS→绑卡成功→商户ACTIVE / PROCESS→绑卡处理中→等待 / FAIL→绑卡失败→需重新绑卡"

    # ========== 参数×业务规则关联 ==========
    param_rule_association:
      - rule_id: "BR-PAY-001"
        related_params: ["applicationStatus", "merchantNo"]
        note: "商户入网须先完成开户和绑卡（applicationStatus=COMPLETED且merchantNo已生成）才能进行资金收付"
      - rule_id: "BR-PAY-002"
        related_params: ["requestNo"]
        note: "所有交易请求须带唯一requestNo实现幂等控制（非驳回状态不允许同requestNo重复发起）"
      - rule_id: "BR-PAY-003"
        related_params: ["merchantCorporationInfo.legalLicenceNo", "accountInfo.bankCardNo"]
        note: "敏感数据（法人身份证号/银行卡号）须RSA加密传输"

    # ========== 参数安全分析 ==========
    param_security_analysis:
      sensitive_fields:
        - { param_name: "merchantCorporationInfo.legalLicenceNo", api_id: "API-MER-001/002", encryption: "rsa", risk: "法人身份证号，明文传输违反PCI-DSS" }
        - { param_name: "accountInfo.bankCardNo", api_id: "API-MER-001/002", encryption: "rsa", risk: "银行卡号，明文传输违反PCI-DSS" }
        - { param_name: "merchantCorporationInfo.mobile", api_id: "API-MER-001/002", encryption: "none", risk: "法人手机号，建议加密传输" }
      idempotent_keys:
        - { param_name: "requestNo", api_id: "API-MER-001/002/003/004/005", uniqueness_mechanism: "服务商自定义生成，非驳回状态不允许重复；驳回状态可同requestNo重新发起（商编不变）" }
      amount_fields:
        - { param_name: "productInfo.percentRate", api_id: "API-MER-001/002", validation: "费率百分比", precision: "视产品而定" }
        - { param_name: "productInfo.fixedRate", api_id: "API-MER-001/002", validation: "固定费率", precision: "视产品而定" }
      signature_analysis:
        algorithm: "RSA"
        sign_scope: "全部请求参数按字典序拼接+RSA私钥签名"
        verify_scope: "易宝返回参数+RSA公钥验签"
        note: "所有API均需签名验签，请求头携带签名信息"

  # ============================================
  # 参数融合报告（V2.1.0 新增）
  # ============================================
  param_fusion_report:
    param_extraction_coverage: "6/150+ API（入网类全覆盖，4.0%）"
    param_flow_completeness: "85%（入网类参数流转已建立，跨场景merchantNo流转已建立）"
