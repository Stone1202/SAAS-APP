# ============================================
# Part 11: 接口串联（Coze API完整清单）
# ============================================
api_chain:
  category: "HTTP REST API"
  base_url: "https://api.coze.cn"
  auth_methods:
    - { type: "PAT（个人访问令牌）", header: "Authorization: Bearer pat_xxxxx", env: "开发/调试" }
    - { type: "OAuth 2.0（三腿认证）", header: "Authorization: Bearer {access_token}", env: "生产环境" }
  apis:
    - id: "API-COZE-001"
      name: "发起对话"
      endpoint: "POST /v3/chat"
      description: "向指定智能体发起对话，支持流式/非流式响应"
      input_params_inference:
        - { field: "bot_id", type: "string", required: true, description: "智能体ID" }
        - { field: "user_id", type: "string", required: true, description: "用户唯一标识" }
        - { field: "query", type: "string", required: true, description: "用户消息内容" }
        - { field: "stream", type: "boolean", required: false, description: "是否流式返回" }
        - { field: "chat_history", type: "array", required: false, description: "历史对话记录" }
        - { field: "conversation_id", type: "string", required: false, description: "会话ID（多轮对话时传入）" }
      limits: { qps_free: 20, qps_pro: 100, qps_enterprise: 500 }

    - id: "API-COZE-002"
      name: "执行工作流"
      endpoint: "POST /v3/workflow/run"
      description: "同步/异步执行已发布的工作流"
      input_params_inference:
        - { field: "workflow_id", type: "string", required: true, description: "工作流ID" }
        - { field: "parameters", type: "object", required: true, description: "工作流输入参数（对应开始节点定义）" }
        - { field: "is_async", type: "boolean", required: false, description: "是否异步执行（默认false）" }
      limits: { qps_free: 50, qps_pro: 100, qps_enterprise: 500, max_body: "20MB" }

    - id: "API-COZE-003"
      name: "执行工作流（流式）"
      endpoint: "POST /v3/workflow/stream_run"
      description: "流式执行工作流，实时返回中间结果"
      limits: { qps_free: 50, qps_pro: 100, qps_enterprise: 500 }

    - id: "API-COZE-004"
      name: "查询工作流异步结果"
      endpoint: "GET /v3/workflow/result"
      description: "查询异步执行的工作流结果"
      input_params_inference:
        - { field: "execute_id", type: "string", required: true, description: "执行ID（来自异步调用的返回值）" }
      limits: { qps_free: 50, qps_pro: 100, qps_enterprise: 500 }

    - id: "API-COZE-005"
      name: "上传文件"
      endpoint: "POST /v3/files/upload"
      description: "上传文件供智能体/工作流使用"
      limits: { qps_free: 10, qps_pro: 10, qps_enterprise: 20 }

  scrm_integration_sequence: |
    sequenceDiagram
      participant E as SCRM员工端
      participant B as SCRM后端
      participant C as Coze API
      participant W as Coze工作流
      participant D as Coze数据库

      E->>B: 客户消息到达
      B->>C: POST /v3/workflow/run (workflow_id+parameters)
      C->>W: 触发工作流
      W->>W: 意图识别节点
      W->>D: 查询客户画像+历史
      W->>W: 知识库检索(话术+商品)
      W->>W: LLM节点(组装推荐)
      W-->>C: 输出结果
      C-->>B: 返回话术+商品+情绪
      B-->>E: 展示AI推荐
      
      Note over E,D: --- 沟通结束后 ---
      
      B->>C: POST /v3/workflow/run (总结工作流)
      C->>W: 触发后续工作流
      W->>W: LLM(沟通总结+标签提取)
      W->>D: 更新画像+写入跟进
      W-->>C: 总结+任务
      C-->>B: 返回总结
      B-->>E: 展示沟通总结+跟进提醒

  scrm_key_parameters:
    required_for_scrm:
      - { param: "customer_id", description: "客户唯一标识（对应Coze user_id）", semantic_role: "PRIMARY_KEY" }
      - { param: "employee_id", description: "租户员工唯一标识", semantic_role: "REFERENCE" }
      - { param: "conversation_id", description: "会话唯一标识（多轮对话追踪）", semantic_role: "IDEMPOTENT_KEY" }
      - { param: "message_content", description: "最新一条消息内容", semantic_role: "BUSINESS_PARAM" }
      - { param: "message_history", description: "完整会话历史（用于总结）", semantic_role: "BUSINESS_PARAM" }
      - { param: "context_tags", description: "上下文标签（产品线/业务类型等）", semantic_role: "QUERY_FILTER" }

# ============================================
# Part 12: API参数字典（Coze平台API关键参数详解）
# ============================================
api_param_dictionary:
  # Coze Chat API核心参数
  chat_params:
    request:
      - { field: "bot_id", type: "string", required: true, semantic_role: "PRIMARY_KEY", source_type: "config", description: "智能体ID，发布后从Coze控制台获取" }
      - { field: "user_id", type: "string", required: true, semantic_role: "PRIMARY_KEY", source_type: "user_input", description: "终端用户唯一ID，SCRM中传客户ID" }
      - { field: "query", type: "string", required: true, semantic_role: "BUSINESS_PARAM", source_type: "user_input", description: "用户消息文本" }
      - { field: "stream", type: "boolean", required: false, semantic_role: "BUSINESS_PARAM", source_type: "config", description: "默认false。SCRM建议false（非流式）方便处理" }
      - { field: "chat_history", type: "array<message>", required: false, semantic_role: "BUSINESS_PARAM", source_type: "system_generated", description: "历史消息列表，多轮对话时传" }
      - { field: "conversation_id", type: "string", required: false, semantic_role: "IDEMPOTENT_KEY", source_type: "upstream_api", description: "由首次chat返回，后续传此ID维持会话" }
    response:
      - { field: "messages", type: "array<message>", semantic_role: "RESPONSE_META", description: "回复消息列表（含type/content/role）" }
      - { field: "conversation_id", type: "string", semantic_role: "IDEMPOTENT_KEY", description: "会话ID，保存用于后续调用" }
      - { field: "code", type: "integer", semantic_role: "RESPONSE_META", description: "状态码，0表示成功" }
      - { field: "msg", type: "string", semantic_role: "RESPONSE_META", description: "状态消息" }

  # Coze Workflow API核心参数
  workflow_params:
    request:
      - { field: "workflow_id", type: "string", required: true, semantic_role: "PRIMARY_KEY", source_type: "config", description: "工作流ID" }
      - { field: "parameters", type: "object", required: true, semantic_role: "BUSINESS_PARAM", source_type: "user_input", description: "输入参数对象，key对应工作流开始节点变量名" }
      - { field: "is_async", type: "boolean", required: false, semantic_role: "BUSINESS_PARAM", source_type: "config", description: "SCRM建议true，异步执行避免超时" }
    response_async:
      - { field: "execute_id", type: "string", semantic_role: "IDEMPOTENT_KEY", description: "异步执行ID，用于后续查询结果" }
      - { field: "code", type: "integer", semantic_role: "RESPONSE_META", description: "0=成功触发" }
    error_codes:
      - { code: "429", message: "限流", handling: "实现exponential backoff重试" }
      - { code: "401", message: "认证失败", handling: "检查PAT/OAuth token有效性" }
      - { code: "400", message: "参数错误", handling: "检查必填参数是否完整" }
      - { code: "413", message: "请求体过大", handling: "压缩数据或分批发送" }

# ============================================
# Part 13: SCRM参数流转图
# ============================================
param_flow:
  scrm_communication_flow:
    description: "SCRM一条沟通中Coze工作流内参数流转"
    flow: |
      flowchart LR
        subgraph 输入
          A1[customer_id]
          A2[message_content]
          A3[conversation_id]
        end
        subgraph 意图识别
          B1[customer_id → user_id]
          B2[message_content → query]
        end
        subgraph 知识检索
          C1[intent_label]
          C2[customer_tags]
        end
        subgraph LLM推荐
          D1[matched_script]
          D2[matched_product]
          D3[sentiment_score]
        end
        subgraph 输出
          E1[recommend_script]
          E2[product_card]
          E3[sentiment_alert]
        end
        A1 --> B1
        A2 --> B2
        B1 --> C2
        B2 --> C1
        C1 --> D1
        C1 --> D2
        C2 --> D1
        D1 --> E1
        D2 --> E2
        D3 --> E3
    
    cross_session_flow: |
      flowchart TD
        subgraph Session1
          S1[customer_id+对话] --> S1E[沟通总结+标签]
        end
        subgraph Memory
          S1E --> M1[长期记忆: 更新画像]
          S1E --> M2[数据库: 跟进任务]
        end
        subgraph Session2
          M1 --> S2A[加载客户画像]
          M2 --> S2B[检查待跟进任务]
          S2A --> S2C[个性化开场白+上下文话术]
        end
  
  param_source_trace:
    - { param: "customer_id", chain: "SCRM前端 → SCRM后端 → Coze /v3/workflow/run parameters", flow_depth: 3 }
    - { param: "message_content", chain: "用户输入 → SCRM前端 → SCRM后端 → Coze API → 工作流开始节点 → 意图识别/LLM节点", flow_depth: 5 }
    - { param: "conversation_id", chain: "Coze /v3/chat 返回 → SCRM后端存储 → 下次调用时传回", flow_depth: 2 }
    - { param: "sentiment_score", chain: "LLM情绪分析节点 → 代码节点打分 → IF选择器 → 预警输出 → SCRM前端", flow_depth: 5 }
    - { param: "matched_product", chain: "知识库检索 → LLM排序 → 输出节点 → SCRM前端", flow_depth: 4 }

