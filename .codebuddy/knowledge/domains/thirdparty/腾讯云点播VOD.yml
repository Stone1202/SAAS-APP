# ============================================
# Part 2: 业务流程
# ============================================
business_process:
  normal_flow: "上传→转码→审核(通过)→分发→播放→数据采集"
  exception_flow: "上传→转码→审核(违规)→回调通知→违规处理(下架/标记)→统计更新"
  branch_flow: "上传→转码+审核(一体化任务流)→审核结果决定是否分发"
  mermaid: |
    ```mermaid
    flowchart TD
        A[视频上传] --> B[生成FileId]
        B --> C[发起媒体处理]
        C --> D{处理方式?}
        D -->|单独审核| E[ReviewAudioVideo]
        D -->|任务流含审核| F[ProcessMedia含AiContentReviewTask]
        D -->|仅转码| G[ProcessMedia转码]
        E --> H[异步审核执行]
        F --> H
        H --> I{审核结果}
        I -->|通过| J[正常分发]
        I -->|违规| K[回调通知App后台]
        I -->|可疑| L[标记+人工复审]
        K --> M[违规处理:下架/标记]
        G --> N[多规格输出]
        N --> J
        J --> O[CDN分发+播放]
    ```

