# ============================================
# Part 6: 业务时序图
# ============================================
business_sequence: |
  ```mermaid
  sequenceDiagram
      participant OP as 运营
      participant VOD as VOD服务端
      participant AU as 审核引擎
      participant CD as CDN
      participant US as 最终用户
      participant BA as App后台
      OP->>VOD: ProcessMedia(FileId, 转码+审核任务)
      VOD->>VOD: 任务流编排(转码→审核)
      VOD->>AU: 发起审核(ReviewAudioVideo)
      AU-->>VOD: 审核结果(异步回调)
      alt 审核通过
          VOD->>CD: 推送转码文件(缓存预热)
          VOD->>BA: 事件通知(审核通过)
          US->>CD: 播放视频
      else 审核违规
          VOD->>BA: 事件通知(审核违规)
          BA->>VOD: 下架/标记违规视频
      else 审核可疑
          VOD->>BA: 事件通知(审核可疑)
          BA->>BA: 人工复审
      end
      VOD->>BA: 统计数据更新
  ```

