scenario_maps:
  - id: "S-VOD-001"
    name: "视频上传管理"
    related_topics: ["T-VOD-001", "T-VOD-006"]
    related_business_problems: ["BP-VOD-001"]
    flow: "申请上传(ApplyUpload) → 客户端/服务端上传 → 确认上传(CommitUpload) → 获取FileId → 媒体管理"
    participants: ["开发者", "VOD服务端", "COS存储"]
    closure: "申请上传→文件上传→确认上传→获取FileId→媒资可管理"
    api_chain: ["ApplyUpload", "CommitUpload", "DescribeMediaInfos"]

  - id: "S-VOD-002"
    name: "视频转码处理"
    related_topics: ["T-VOD-002", "T-VOD-004"]
    related_business_problems: ["BP-VOD-002", "BP-VOD-007"]
    flow: "发起ProcessMedia(转码+截图+水印+分析+识别) → 任务流执行 → 事件通知 → 输出多规格视频"
    participants: ["运营", "VOD服务端", "转码引擎", "AI引擎"]
    closure: "发起处理→任务流执行→多规格输出→事件通知→媒资更新"
    api_chain: ["ProcessMedia(或ProcessMediaByProcedure)", "DescribeTasks", "PullEvents"]
    scrm_relevance: "MEDIUM — 转码时可同步触发审核，实现处理+审核一体化"

  - id: "S-VOD-003"
    name: "内容审核闭环"
    related_topics: ["T-VOD-003"]
    related_business_problems: ["BP-VOD-003", "BP-VOD-004", "BP-VOD-005"]
    flow: "上传/指定FileId → 发起ReviewAudioVideo(或ProcessMedia含AiContentReviewTask) → 异步审核 → 审核结果回调 → 审核统计 → 违规处理"
    participants: ["审核员", "VOD服务端", "审核引擎", "App后台(回调)"]
    closure: "发起审核→异步执行→结果回调→违规处理→统计更新"
    api_chain: ["ReviewAudioVideo(音视频审核)", "ReviewImage(图片审核)", "PullEvents(拉取事件)", "DescribeReviewDetails(审核详情)"]
    scrm_relevance: "HIGH — VOD音视频审核可接入SCRM审核处置流程，与MPS擦音+IM弹幕审核形成三重审核闭环"

  - id: "S-VOD-004"
    name: "视频分发播放"
    related_topics: ["T-VOD-005", "T-VOD-009"]
    related_business_problems: ["BP-VOD-006"]
    flow: "转码完成 → CDN分发配置 → 缓存预热(PushUrlCache) → 播放器SDK播放 → 播放数据采集 → 质量监控"
    participants: ["运营", "CDN", "播放器SDK", "最终用户"]
    closure: "转码完成→CDN分发→缓存预热→播放器播放→数据采集→质量监控"
    api_chain: ["PushUrlCache(预热)", "RefreshUrlCache(刷新)", "DescribeCDNUsageData(CDN统计)"]

