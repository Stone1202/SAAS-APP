# ============================================
# Part A: 商业问题（SDL Layer 0）
# ============================================
business_problems:
  - id: "BP-VOD-001"
    role: "App开发者"
    problem: "如何实现音视频的上传、存储和管理？"
    pain_point: "音视频文件体积大，存储成本高，管理复杂"
    value: "VOD提供一站式上传（服务端/客户端/拉取上传）+ 云存储 + 媒体管理API"
    evidence: "4个上传API + 10个媒体管理API（含语义搜索/知识库导入）"
    scrm_relevance: 3
    priority: "P1"
    related_scenes: ["S-VOD-001"]

  - id: "BP-VOD-002"
    role: "App运营人员"
    problem: "如何对视频进行转码和处理适配多端播放？"
    pain_point: "不同终端需要不同格式/码率，转码成本高且复杂"
    value: "ProcessMedia一体化接口支持转码/截图/水印/动图/自适应码流等10种任务"
    evidence: "14个媒体处理API + 63个参数模板API + 4个任务流API"
    scrm_relevance: 3
    priority: "P1"
    related_scenes: ["S-VOD-002"]

  - id: "BP-VOD-003"
    role: "内容审核员"
    problem: "如何审核点播视频内容确保合规？"
    pain_point: "视频内容可能包含违规信息（令人反感/不安全/不适宜），人工审核成本高"
    value: "ReviewAudioVideo音视频审核API + ReviewImage图片审核API + 审核模板可配置"
    evidence: "审核覆盖3类信息（令人反感/不安全/不适宜），支持审核模板CRUD + 审核结果回调"
    scrm_relevance: 5
    priority: "P0"
    related_scenes: ["S-VOD-003"]

  - id: "BP-VOD-004"
    role: "内容审核员"
    problem: "如何处理审核结果和违规视频？"
    pain_point: "审核结果如何回调？违规内容如何处理？审核统计数据如何查看？"
    value: "TasksNotifyMode回调配置 + 审核用量统计 + 内容智能识别详情查询"
    evidence: "5个事件通知API + DescribeImageReviewUsageData/DescribeReviewDetails统计API"
    scrm_relevance: 5
    priority: "P0"
    related_scenes: ["S-VOD-003"]

  - id: "BP-VOD-005"
    role: "系统管理员"
    problem: "如何配置审核策略和任务流编排？"
    pain_point: "不同视频类型需要不同审核策略，处理流程需要灵活编排"
    value: "审核模板CRUD + 任务流模板（ProcessMediaByProcedure） + 任务优先级控制"
    evidence: "CreateReviewTemplate/ModifyReviewTemplate + 4个任务流模板API + TasksPriority(-10~10)"
    scrm_relevance: 4
    priority: "P1"

  - id: "BP-VOD-006"
    role: "App开发者"
    problem: "如何实现视频版权保护？"
    pain_point: "独播剧/知识付费等版权视频需要防盗链和DRM加密"
    value: "Key防盗链 + DRM加密 + AB水印 + 动态水印 + 访问控制"
    evidence: "6个分发API（含DRM密钥配置） + 版权保护综述文档"
    scrm_relevance: 2
    priority: "P2"

  - id: "BP-VOD-007"
    role: "App运营人员"
    problem: "如何利用AI能力提升视频内容价值？"
    pain_point: "视频内容中的标签/分类/封面/人脸/文本等需要AI智能识别"
    value: "内容分析（标签/分类/封面/按帧标签）+ 内容识别（片头片尾/人脸/文本/语音/物体）"
    evidence: "ProcessMedia支持AiAnalysisTask + AiRecognitionTask，8个AI样本管理API"
    scrm_relevance: 4
    priority: "P2"
    related_scenes: ["S-VOD-002"]

  - id: "BP-VOD-008"
    role: "App运营人员"
    problem: "如何使用AIGC能力创作视频内容？"
    pain_point: "AI生成视频/图片/音频的需求增长，但开发集成成本高"
    value: "23个AI创作API（AIGC生视频/图片/音频/声音复刻/自定义主体/场景化生成等）"
    evidence: "CreateAigcVideoTask/CreateAigcImageTask/CreateAigcAudioTask等23个AI创作接口"
    scrm_relevance: 3
    priority: "P2"

  - id: "BP-VOD-009"
    role: "App运营人员"
    problem: "如何监控视频播放质量和用户数据？"
    pain_point: "播放卡顿/失败等质量问题需要全链路监控，用户播放数据需要统计分析"
    value: "15个数据统计API + 7个实时日志API + 播放质量监控"
    evidence: "DescribeCDNUsageData/DescribeStorageData/DescribeMediaProcessUsageData等15个统计API"
    scrm_relevance: 3
    priority: "P2"

# ============================================
# Part B: 跨域衔接（SDL Layer 2）
# ============================================
cross_domain_bridges:
  - id: "CDB-VOD-001"
    from_domain: "腾讯云点播VOD"
    to_domain: "腾讯云MPS"
    bridge_type: "能力衔接"
    description: "VOD媒体处理(ProcessMedia)与MPS媒体处理在转码/审核能力上重叠，VOD专注点播场景，MPS专注直播录播处理"
    integration_point: "ProcessMediaByMPS接口（VOD调用MPS能力处理媒资）"
    scrm_fusion_value: "直播录播→MPS擦音→VOD存储/转码/审核→分发播放，形成完整录播处理链路"
    confidence: 0.9

  - id: "CDB-VOD-002"
    from_domain: "腾讯云点播VOD"
    to_domain: "腾讯云即时通信IM"
    bridge_type: "场景衔接"
    description: "IM直播群弹幕/消息→直播结束→录像→VOD上传/处理/审核→IM分享回放链接"
    integration_point: "直播结束触发录像→VOD PullUpload→ProcessMedia(转码+审核)→回放URL→IM消息推送"
    scrm_fusion_value: "直播+点播一体化，直播结束后的录播审核+点播分发形成完整内容生命周期管理"
    confidence: 0.85

  - id: "CDB-VOD-003"
    from_domain: "腾讯云点播VOD"
    to_domain: "腾讯云直播"
    bridge_type: "数据流衔接"
    description: "直播录制→COS存储→VOD拉取上传→VOD转码/审核→CDN分发"
    integration_point: "直播录制文件URL → VOD PullUpload → VOD FileId → 审核回调"
    scrm_fusion_value: "直播录播审核闭环：直播录制→VOD审核（ReviewAudioVideo）→审核结果回调SCRM→处置决策"
    confidence: 0.9

  - id: "CDB-VOD-004"
    from_domain: "腾讯云点播VOD"
    to_domain: "内容安全审核(ai)"
    bridge_type: "能力衔接"
    description: "VOD音视频审核(ReviewAudioVideo)→审核结果回调→SCRM审核处置流程"
    integration_point: "VOD审核回调URL → SCRM审核处置API（统一审核事件入口）"
    scrm_fusion_value: "VOD审核与SCRM审核统一管理，VOD审核事件接入SCRM审核处置矩阵，实现点播+直播跨场景统一审核策略"
    confidence: 0.95

