  ```

# ============================================
# Part 4: 状态机
# ============================================
state_machine:
  entity: "媒体处理任务状态"
  states: ["待处理", "处理中", "处理成功", "处理失败", "审核通过", "审核违规", "审核可疑"]
  transitions:
    - { from: "—", to: "待处理", trigger: "发起ProcessMedia/ReviewAudioVideo", operator: "运营/系统" }
    - { from: "待处理", to: "处理中", trigger: "任务开始执行", operator: "VOD服务端" }
    - { from: "处理中", to: "处理成功", trigger: "转码/处理完成", operator: "VOD服务端" }
    - { from: "处理中", to: "处理失败", trigger: "处理出错", operator: "VOD服务端" }
    - { from: "处理成功", to: "审核通过", trigger: "审核结果=通过", operator: "审核引擎" }
    - { from: "处理成功", to: "审核违规", trigger: "审核结果=违规", operator: "审核引擎" }
    - { from: "处理成功", to: "审核可疑", trigger: "审核结果=可疑", operator: "审核引擎" }
  mermaid: |
    ```mermaid
    stateDiagram-v2
        [*] --> 待处理: 发起处理/审核
        待处理 --> 处理中: 任务开始
        处理中 --> 处理成功: 处理完成
        处理中 --> 处理失败: 处理出错
        处理成功 --> 审核通过: 审核结果=通过
        处理成功 --> 审核违规: 审核结果=违规
        处理成功 --> 审核可疑: 审核结果=可疑
        审核通过 --> [*]: 正常分发
        审核违规 --> [*]: 下架/标记
        审核可疑 --> [*]: 人工复审
        处理失败 --> [*]: 重试或放弃
    ```

