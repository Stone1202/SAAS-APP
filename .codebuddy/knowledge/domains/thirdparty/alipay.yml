# ============================================
# Part A: 商业问题（SDL Layer 0）
# ============================================
business_problems:
  - id: "BP-ALI-001"
    role: "商家"
    problem: "如何接入支付宝收款？"
    pain_point: "线下/线上多种支付场景需要不同接入方式，开发成本高"
    value: "支付宝提供9种支付方式覆盖全场景：当面付/JSAPI/APP/H5/PC/周期扣款/预授权/刷脸/AI按量付费"
    evidence: "12个核心交易API（trade.pay/precreate/create/query/refund/close/cancel/settle）+ SDK 9平台支持"
    scrm_relevance: 4
    priority: "P0"
    related_scenes: ["S-ALI-001", "S-ALI-002"]

  - id: "BP-ALI-002"
    role: "商家"
    problem: "如何管理交易全生命周期？"
    pain_point: "支付后需要查询/退款/关闭/撤销/结算等操作，流程复杂"
    value: "完整交易管理API链：创建→支付→查询→退款→退款查询→关闭→撤销→结算→对账"
    evidence: "alipay.trade.query/refund/fastpay.refund.query/close/cancel/order.settle + bill.downloadurl.query"
    scrm_relevance: 5
    priority: "P0"
    related_scenes: ["S-ALI-003"]

  - id: "BP-ALI-003"
    role: "商家"
    problem: "如何实现资金分账和转账？"
    pain_point: "平台型业务需要将交易资金分配给多个收款方，提现需要转账到支付宝账户"
    value: "商家分账（alipay.trade.order.settle）+ 商家转账（alipay.fund.trans.toaccount.transfer）"
    evidence: "分账支持服务商抽佣/合作伙伴分润；转账支持API接口版灵活接入企业系统"
    scrm_relevance: 5
    priority: "P0"
    related_scenes: ["S-ALI-004"]

  - id: "BP-ALI-004"
    role: "商家"
    problem: "如何确保支付安全性？"
    pain_point: "支付涉及资金安全，需要签名验签、异步通知防重放、风险交易识别"
    value: "RSA2签名认证 + 异步通知验签防重放 + 交易安全防护（风险交易识别）+ AI慧眼/AI防伪"
    evidence: "SDK初始化需配置APP_PRIVATE_KEY+ALIPAY_PUBLIC_KEY+SIGN_TYPE(RSA2)；异步通知需rsaCheckV1验签+去重处理"
    scrm_relevance: 4
    priority: "P0"

  - id: "BP-ALI-005"
    role: "商家"
    problem: "如何利用营销能力提升转化？"
    pain_point: "支付后缺乏二次触达手段，复购率低"
    value: "支付有礼（支付成功页推荐商品/优惠券/会员卡）+ 商家券 + 红包 + 支付券 + 芝麻先享/免押"
    evidence: "支付有礼支持商品/优惠券/会员卡/小程序服务4类推荐；花呗分期减轻资金压力促转化"
    scrm_relevance: 4
    priority: "P1"

  - id: "BP-ALI-006"
    role: "商家"
    problem: "如何管理会员体系和用户身份？"
    pain_point: "用户注册登录流程长，会员体系搭建成本高"
    value: "APP支付宝登录（一键登录免注册）+ 获取会员信息（授权）+ 商家会员卡 + 人脸认证/本机号码验证"
    evidence: "支付宝身份验证（人脸+证件多因子核验）+ 芝麻信用（先享后付/免押金）"
    scrm_relevance: 5
    priority: "P1"

  - id: "BP-ALI-007"
    role: "平台/服务商"
    problem: "如何实现预授权和周期性扣款？"
    pain_point: "押金场景需要冻结资金，订阅场景需要周期扣款"
    value: "预授权支付（押金预扣→交易完成→扣款）+ 周期性扣款（用户授权→周期内自动扣款）"
    evidence: "芝麻免押（信用预授权代替资金冻结）+ 周期性扣款API"
    scrm_relevance: 4
    priority: "P1"

  - id: "BP-ALI-008"
    role: "商家"
    problem: "如何使用AI能力提升经营效率？"
    pain_point: "内容审核/智能识别/风险防控需要AI能力但自建成本高"
    value: "AI慧眼（智能分类/多模态OCR/AI防伪/AI质检）+ RiskGO（生态安全一站式输出）+ 小程序云风险智能"
    evidence: "支持软件扫描/单机故障/内容违规/黄牛刷单等风险识别"
    scrm_relevance: 3
    priority: "P2"

# ============================================
# Part B: 跨域衔接（SDL Layer 2）
# ============================================
cross_domain_bridges:
  - id: "CDB-ALI-001"
    from_domain: "支付宝支付"
    to_domain: "易宝支付"
    bridge_type: "能力衔接"
    description: "支付宝与易宝同为支付渠道，在SCRM系统中可形成多渠道支付聚合"
    integration_point: "SCRM支付网关统一接入 → 渠道路由（支付宝/易宝/微信） → 统一交易管理"
    scrm_fusion_value: "多渠道支付聚合，根据场景自动选择最优渠道，统一对账和退款管理"
    confidence: 0.9

  - id: "CDB-ALI-002"
    from_domain: "支付宝支付"
    to_domain: "腾讯云点播VOD"
    bridge_type: "场景衔接"
    description: "VOD/直播付费内容 → 支付宝支付/预授权 → 支付成功回调 → 内容权限开通"
    integration_point: "支付成功异步通知(notifyUrl) → SCRM订单服务 → VOD播放权限开通"
    scrm_fusion_value: "内容付费闭环：用户支付→权限开通→内容消费→到期自动关闭权限"
    confidence: 0.85

  - id: "CDB-ALI-003"
    from_domain: "支付宝支付"
    to_domain: "腾讯云即时通信IM"
    bridge_type: "场景衔接"
    description: "IM直播间付费功能（打赏/付费入场/会员专属） → 支付宝支付 → 支付成功→IM权限变更"
    integration_point: "支付宝支付成功通知 → SCRM → IM群组成员角色/权限变更"
    scrm_fusion_value: "直播付费场景闭环：支付→权限→IM体验差异化"
    confidence: 0.8

  - id: "CDB-ALI-004"
    from_domain: "支付宝支付"
    to_domain: "内容安全审核(ai)"
    bridge_type: "数据流衔接"
    description: "支付宝AI慧眼/RiskGO → 风险交易识别结果 → SCRM风控系统 → 交易拦截/标记"
    integration_point: "支付宝交易安全防护回调 → SCRM风控规则引擎 → 交易处置决策"
    scrm_fusion_value: "支付风控与内容审核统一管理，风险交易+违规内容双维度风控"
    confidence: 0.75

# ============================================
# Part C: 角色视角（SDL Layer 3）
# ============================================
role_perspectives:
  - scene_id: "S-ALI-001"
    scene_name: "当面付支付"
    role: "收银员"
    operations: ["扫描用户付款码", "生成订单二维码", "查询支付结果", "退款"]
    kpi: ["支付成功率", "平均支付耗时", "退款处理时间"]
    pain_points: ["网络异常时支付状态不确定", "退款流程繁琐"]
    scrm_expectation: "SCRM统一管理多渠道当面付交易，支付状态实时同步"

  - scene_id: "S-ALI-001"
    scene_name: "当面付支付"
    role: "消费者"
    operations: ["出示付款码", "扫描商家二维码", "确认支付", "查看支付结果"]
    kpi: ["支付便捷度", "支付安全性"]
    pain_points: ["支付失败原因不明确"]
    scrm_expectation: "支付结果实时推送，异常有友好提示"

  - scene_id: "S-ALI-003"
    scene_name: "交易管理"
    role: "财务"
    operations: ["查询交易", "发起退款", "退款查询", "下载对账单", "分账结算"]
    kpi: ["对账准确率", "退款成功率", "分账到账时间"]
    pain_points: ["多渠道对账复杂", "退款状态跟踪困难", "分账规则配置复杂"]
    scrm_expectation: "SCRM财务看板统一展示支付宝/易宝/微信多渠道交易数据，自动对账"

  - scene_id: "S-ALI-004"
    scene_name: "资金分账转账"
    role: "平台运营"
    operations: ["配置分账规则", "发起分账", "发起转账", "查询转账结果"]
    kpi: ["分账成功率", "转账到账时间", "资金安全"]
    pain_points: ["分账规则复杂（服务商抽佣+合作伙伴分润）", "转账异常处理"]
    scrm_expectation: "SCRM自动计算分账金额，根据业务规则自动发起分账"

# ============================================
# Part D: 场景地图增强（SDL Layer 1增强）
# ============================================
scenario_maps:
  - id: "S-ALI-001"
    name: "当面付支付"
    related_topics: ["T-ALI-001"]
    related_business_problems: ["BP-ALI-001"]
    flow: "商家生成订单→(付款码:扫描用户码 / 扫码:生成二维码用户扫)→支付→异步通知→查询确认"
    participants: ["收银员", "消费者", "支付宝", "商家后台"]
    closure: "生成订单→发起支付→支付成功→异步通知→查询确认→交易完成"
    api_chain: ["alipay.trade.precreate(扫码生成二维码)/alipay.trade.pay(付款码)", "异步通知(notifyUrl)", "alipay.trade.query(查询确认)"]
    scrm_relevance: "HIGH — 线下收款核心场景"

  - id: "S-ALI-002"
    name: "线上支付（APP/H5/PC/小程序）"
    related_topics: ["T-ALI-001"]
    related_business_problems: ["BP-ALI-001"]
    flow: "创建订单→调起支付（APP SDK/H5页面/PC扫码/小程序JSAPI）→用户支付→异步通知→查询确认"
    participants: ["用户", "商家APP/网站", "支付宝", "商家后台"]
    closure: "创建订单→调起支付→支付成功→异步通知→查询确认→交易完成"
    api_chain: ["alipay.trade.create(创建订单)", "alipay.trade.app.pay/wap.pay/page.pay/JSAPI(调起支付)", "异步通知", "alipay.trade.query"]
    scrm_relevance: "HIGH — 线上收款核心场景"

  - id: "S-ALI-003"
    name: "交易管理（查询/退款/关闭/撤销/对账）"
    related_topics: ["T-ALI-002"]
    related_business_problems: ["BP-ALI-002"]
    flow: "交易发生后→(查询状态/发起退款/退款查询/关闭未支付/撤销异常交易/下载对账单)"
    participants: ["财务", "支付宝", "商家后台"]
    closure: "交易→查询/退款/关闭/撤销→状态更新→对账确认"
    api_chain: ["alipay.trade.query(查询)", "alipay.trade.refund(退款)", "alipay.trade.fastpay.refund.query(退款查询)", "alipay.trade.close(关闭)", "alipay.trade.cancel(撤销)", "alipay.data.dataservice.bill.downloadurl.query(对账单)"]
    scrm_relevance: "HIGH — 交易全生命周期管理"

  - id: "S-ALI-004"
    name: "资金分账转账"
    related_topics: ["T-ALI-003"]
    related_business_problems: ["BP-ALI-003"]
    flow: "交易成功→(分账:按规则分配资金给多收款方 / 转账:单笔转账到支付宝账户)→查询结果"
    participants: ["平台运营", "支付宝", "收款方"]
    closure: "交易成功→发起分账/转账→查询结果→资金到账"
    api_chain: ["alipay.trade.order.settle(分账结算)", "alipay.fund.trans.toaccount.transfer(转账)", "alipay.fund.trans.order.query(转账查询)"]
    scrm_relevance: "HIGH — 平台型业务资金管理核心"

  - id: "S-ALI-005"
    name: "预授权与周期扣款"
    related_topics: ["T-ALI-004"]
    related_business_problems: ["BP-ALI-007"]
    flow: "用户授权→(预授权:冻结资金→交易完成→扣款 / 周期扣款:按周期自动扣款)"
    participants: ["用户", "商家", "支付宝"]
    closure: "授权→冻结/扣款→完成/释放"
    api_chain: ["预授权支付API", "周期性扣款API", "alipay.trade.query(查询状态)"]
    scrm_relevance: "MEDIUM — 订阅/押金场景"

  - id: "S-ALI-006"
    name: "营销与会员"
    related_topics: ["T-ALI-005", "T-ALI-006"]
    related_business_problems: ["BP-ALI-005", "BP-ALI-006"]
    flow: "支付成功→支付有礼(推荐商品/优惠券/会员卡)→用户领取→复购/会员沉淀"
    participants: ["用户", "商家", "支付宝"]
    closure: "支付→推荐→领取→复购/沉淀"
    api_chain: ["支付有礼配置", "商家券API", "商家会员卡API", "获取会员信息API"]
    scrm_relevance: "MEDIUM — 支付后营销闭环"

# ============================================
# Part 1: 业务泳道图
# ============================================
business_swimlane: |
  ```mermaid
  flowchart LR
      subgraph 商家
          A1[创建订单] --> A2{支付方式?}
      end
      subgraph 支付宝
          B1[接收支付请求] --> B2{支付类型}
          B2 -->|付款码| B3[alipay.trade.pay 同步]
          B2 -->|扫码| B4[alipay.trade.precreate 生成二维码]
          B2 -->|APP/H5/PC| B5[alipay.trade.create+调起支付]
          B3 --> B6{支付结果}
          B4 --> B7[用户扫码支付]
          B5 --> B8[用户支付]
          B7 --> B6
          B8 --> B6
          B6 -->|成功| B9[异步通知notifyUrl]
          B6 -->|失败| B10[返回失败]
      end
      subgraph 商家后台
          C1[接收异步通知] --> C2[验签+去重]
          C2 --> C3[更新订单状态]
          C3 --> C4[alipay.trade.query 确认]
      end
      subgraph 后续管理
          D1[交易查询] --> D2[退款/退款查询]
          D2 --> D3[关闭/撤销]
          D3 --> D4[分账结算]
          D4 --> D5[对账单下载]
      end
      A2 --> B1
      B9 --> C1
      C4 --> D1
  ```

# ============================================
# Part 2: 业务流程
# ============================================
business_process:
  normal_flow: "创建订单→发起支付→用户支付→异步通知→查询确认→交易完成→(退款/分账/对账)"
  exception_flow: "创建订单→发起支付→支付超时→查询订单→(未支付→关闭订单 / 已支付→撤销交易)"
  branch_flow: "创建订单→发起支付→支付成功→支付有礼推荐→用户领取优惠券→复购"
  mermaid: |
    ```mermaid
    flowchart TD
        A[创建订单 alipay.trade.create] --> B{支付方式?}
        B -->|当面付-付款码| C[alipay.trade.pay 同步支付]
        B -->|当面付-扫码| D[alipay.trade.precreate 生成二维码]
        B -->|APP| E[alipay.trade.app.pay]
        B -->|H5| F[alipay.trade.wap.pay]
        B -->|PC| G[alipay.trade.page.pay]
        B -->|小程序| H[JSAPI支付]
        C --> I{支付结果}
        D --> J[用户扫码]
        E --> I
        F --> I
        G --> I
        H --> I
        J --> I
        I -->|成功| K[异步通知 notifyUrl]
        I -->|失败| L[返回错误]
        I -->|超时| M[alipay.trade.query 查询]
        K --> N[验签+去重+更新状态]
        M --> O{查询结果}
        O -->|已支付| N
        O -->|未支付| P[alipay.trade.close 关闭]
        N --> Q[交易完成]
        Q --> R{后续操作}
        R -->|退款| S[alipay.trade.refund]
        R -->|分账| T[alipay.trade.order.settle]
        R -->|对账| U[下载对账单]
    ```

