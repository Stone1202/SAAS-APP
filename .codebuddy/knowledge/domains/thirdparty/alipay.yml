# ============================================
# Part 4: 状态机
# ============================================
state_machine:
  entity: "交易状态"
  states: ["待创建", "已创建", "支付中", "已支付", "已退款", "已关闭", "已撤销", "已结算"]
  transitions:
    - { from: "—", to: "待创建", trigger: "用户下单", operator: "用户" }
    - { from: "待创建", to: "已创建", trigger: "alipay.trade.create", operator: "商家" }
    - { from: "已创建", to: "支付中", trigger: "发起支付(pay/precreate/app.pay/wap.pay/page.pay)", operator: "商家" }
    - { from: "支付中", to: "已支付", trigger: "用户支付成功", operator: "用户/支付宝" }
    - { from: "已创建", to: "已关闭", trigger: "alipay.trade.close(超时未支付)", operator: "商家" }
    - { from: "支付中", to: "已撤销", trigger: "alipay.trade.cancel(异常撤销)", operator: "商家" }
    - { from: "已支付", to: "已退款", trigger: "alipay.trade.refund", operator: "商家" }
    - { from: "已支付", to: "已结算", trigger: "alipay.trade.order.settle(分账)", operator: "商家" }
  mermaid: |
    ```mermaid
    stateDiagram-v2
        [*] --> 待创建: 用户下单
        待创建 --> 已创建: alipay.trade.create
        已创建 --> 支付中: 发起支付
        支付中 --> 已支付: 用户支付成功
        已创建 --> 已关闭: alipay.trade.close 超时未支付
        支付中 --> 已撤销: alipay.trade.cancel 异常撤销
        已支付 --> 已退款: alipay.trade.refund
        已支付 --> 已结算: alipay.trade.order.settle 分账
        已支付 --> [*]: 交易完成
        已退款 --> [*]: 退款完成
        已关闭 --> [*]: 订单关闭
        已撤销 --> [*]: 交易撤销
        已结算 --> [*]: 分账完成
    ```

# ============================================
# Part 5: 业务操作矩阵
# ============================================
business_operation_matrix:
  roles: ["收银员", "消费者", "财务", "平台运营"]
  states: ["已创建", "支付中", "已支付", "已退款", "已关闭", "已撤销", "已结算"]
  matrix:
    - { role: "收银员", state: "已创建", operations: ["发起支付", "关闭订单"] }
    - { role: "收银员", state: "支付中", operations: ["等待支付", "查询状态"] }
    - { role: "收银员", state: "已支付", operations: ["确认收款", "发起退款"] }
    - { role: "消费者", state: "已创建", operations: ["扫码支付", "出示付款码"] }
    - { role: "消费者", state: "已支付", operations: ["查看支付结果", "申请退款"] }
    - { role: "财务", state: "已支付", operations: ["查询交易", "发起退款", "下载对账单"] }
    - { role: "财务", state: "已退款", operations: ["退款查询", "对账确认"] }
    - { role: "平台运营", state: "已支付", operations: ["发起分账", "发起转账"] }
    - { role: "平台运营", state: "已结算", operations: ["查询分账结果"] }

# ============================================
# Part 6: 业务时序图
# ============================================
business_sequence: |
  ```mermaid
  sequenceDiagram
      participant U as 用户
      participant M as 商家系统
      participant A as 支付宝
      participant F as 财务系统
      U->>M: 下单
      M->>A: alipay.trade.create(创建订单)
      A-->>M: 返回订单号
      M->>A: 发起支付(pay/precreate/app.pay等)
      A-->>U: 调起支付页面/生成二维码
      U->>A: 完成支付
      A-->>M: 异步通知(notifyUrl)支付成功
      M->>M: 验签+去重+更新订单状态
      M->>A: alipay.trade.query(查询确认)
      A-->>M: 确认支付成功
      M-->>U: 支付成功
      opt 退款
          F->>A: alipay.trade.refund(发起退款)
          A-->>F: 退款结果
          F->>A: alipay.trade.fastpay.refund.query(退款查询)
          A-->>F: 退款详情
      end
      opt 分账
          M->>A: alipay.trade.order.settle(分账结算)
          A-->>M: 分账结果
      end
      opt 对账
          F->>A: bill.downloadurl.query(对账单下载)
          A-->>F: 下载地址
      end
  ```

# ============================================
# Part 7: 数据实体(ER)
# ============================================
data_entities:
  - name: "交易订单"
    fields:
      - { name: "out_trade_no", type: "string", required: true, desc: "商户订单号（唯一）" }
      - { name: "trade_no", type: "string", required: false, desc: "支付宝交易号" }
      - { name: "total_amount", type: "decimal", required: true, desc: "订单总金额（元）" }
      - { name: "subject", type: "string", required: true, desc: "订单标题" }
      - { name: "status", type: "enum", required: true, desc: "交易状态(WAIT_BUYER_PAY/TRADE_CLOSED/TRADE_SUCCESS/TRADE_FINISHED)" }
      - { name: "payment_type", type: "enum", required: false, desc: "支付方式(face/scan/app/wap/pc/jsapi)" }
      - { name: "notify_url", type: "string", required: false, desc: "异步通知地址" }

  - name: "退款记录"
    fields:
      - { name: "out_request_no", type: "string", required: true, desc: "退款请求号（同一笔退款唯一）" }
      - { name: "out_trade_no", type: "string", required: true, desc: "关联商户订单号" }
      - { name: "refund_amount", type: "decimal", required: true, desc: "退款金额" }
      - { name: "refund_status", type: "enum", required: true, desc: "退款状态(REFUND_SUCCESS/REFUND_PROCESSING/REFUND_FAIL)" }
      - { name: "refund_reason", type: "string", required: false, desc: "退款原因" }

  - name: "分账记录"
    fields:
      - { name: "settle_id", type: "string", required: true, desc: "分账记录ID" }
      - { name: "out_trade_no", type: "string", required: true, desc: "关联商户订单号" }
      - { name: "trans_in", type: "string", required: true, desc: "收款方支付宝账号" }
      - { name: "amount", type: "decimal", required: true, desc: "分账金额" }
      - { name: "settle_status", type: "enum", required: true, desc: "分账状态(SUCCESS/FAIL)" }

  - name: "转账记录"
    fields:
      - { name: "out_biz_no", type: "string", required: true, desc: "商户转账唯一标识" }
      - { name: "payee_type", type: "enum", required: true, desc: "收款方类型(ALIPAY_USERID/ALIPAY_LOGONID)" }
      - { name: "payee_account", type: "string", required: true, desc: "收款方账号" }
      - { name: "amount", type: "decimal", required: true, desc: "转账金额" }
      - { name: "trans_status", type: "enum", required: true, desc: "转账状态(SUCCESS/FAIL)" }

