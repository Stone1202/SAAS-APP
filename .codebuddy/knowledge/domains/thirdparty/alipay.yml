# ============================================
# Part 11: 接口串联
# ============================================
api_list:
  # 核心交易API
  - { name: "统一收单交易支付(付款码)", action: "alipay.trade.pay", category: "当面付", rate_limit: "免费", scene: "S-ALI-001", note: "付款码/条码/声波支付，同步返回" }
  - { name: "统一收单线下交易预创建(扫码)", action: "alipay.trade.precreate", category: "当面付", rate_limit: "免费", scene: "S-ALI-001", note: "生成二维码，异步通知支付结果" }
  - { name: "统一收单交易创建", action: "alipay.trade.create", category: "交易管理", rate_limit: "免费", scene: "S-ALI-002", note: "创建订单，配合APP/H5/PC/小程序支付" }
  - { name: "统一收单线下交易查询", action: "alipay.trade.query", category: "交易管理", rate_limit: "免费", scene: "S-ALI-003", note: "查询所有支付订单状态" }
  - { name: "统一收单交易退款", action: "alipay.trade.refund", category: "交易管理", rate_limit: "免费", scene: "S-ALI-003", note: "支持多次退款，总退款不超实付金额" }
  - { name: "统一收单交易退款查询", action: "alipay.trade.fastpay.refund.query", category: "交易管理", rate_limit: "免费", scene: "S-ALI-003", note: "返回码10000仅代表查询成功非退款成功" }
  - { name: "统一收单交易关闭", action: "alipay.trade.close", category: "交易管理", rate_limit: "免费", scene: "S-ALI-003", note: "关闭未支付订单" }
  - { name: "统一收单交易撤销", action: "alipay.trade.cancel", category: "交易管理", rate_limit: "免费", scene: "S-ALI-003", note: "仅超时/未知状态时可撤销，已支付撤销会退款" }
  - { name: "统一收单交易结算(分账)", action: "alipay.trade.order.settle", category: "资金", rate_limit: "免费", scene: "S-ALI-004", note: "线下场景交易后分账结算" }
  # 资金API
  - { name: "单笔转账到支付宝账户", action: "alipay.fund.trans.toaccount.transfer", category: "资金", rate_limit: "免费", scene: "S-ALI-004", note: "支付宝提现/转账" }
  - { name: "查询转账订单", action: "alipay.fund.trans.order.query", category: "资金", rate_limit: "免费", scene: "S-ALI-004", note: "转账结果查询" }
  # 对账API
  - { name: "查询对账单下载地址", action: "alipay.data.dataservice.bill.downloadurl.query", category: "对账", rate_limit: "免费", scene: "S-ALI-003", note: "获取离线账单下载地址" }
  # 其他支付方式（基于用户提供的能力清单）
  - { name: "APP支付", action: "alipay.trade.app.pay", category: "APP支付", scene: "S-ALI-002", note: "商家APP调起支付宝" }
  - { name: "手机网站支付(WAP)", action: "alipay.trade.wap.pay", category: "H5支付", scene: "S-ALI-002", note: "手机网站接入" }
  - { name: "电脑网站支付(PC)", action: "alipay.trade.page.pay", category: "PC支付", scene: "S-ALI-002", note: "电脑网站付款" }

api_chaining:
  scene_s_ali_001_face_to_face:
    name: "当面付支付接口串联"
    chain:
      - { step: 1, api: "alipay.trade.precreate(扫码) / alipay.trade.pay(付款码)", desc: "发起支付" }
      - { step: 2, api: "异步通知 notifyUrl", desc: "支付成功异步回调（需验签+去重）" }
      - { step: 3, api: "alipay.trade.query", desc: "主动查询确认支付状态" }
      - { step: 4, api: "alipay.trade.refund(如需)", desc: "发起退款" }
      - { step: 5, api: "alipay.trade.fastpay.refund.query", desc: "退款查询" }

  scene_s_ali_002_online_payment:
    name: "线上支付接口串联"
    chain:
      - { step: 1, api: "alipay.trade.create", desc: "创建订单" }
      - { step: 2, api: "alipay.trade.app.pay / wap.pay / page.pay", desc: "调起对应终端支付" }
      - { step: 3, api: "异步通知 notifyUrl", desc: "支付成功回调" }
      - { step: 4, api: "alipay.trade.query", desc: "查询确认" }
      - { step: 5, api: "alipay.trade.close(超时未支付)", desc: "关闭订单" }

  scene_s_ali_003_trade_management:
    name: "交易全生命周期管理串联"
    chain:
      - { step: 1, api: "alipay.trade.query", desc: "查询交易状态" }
      - { step: 2, api: "alipay.trade.refund", desc: "发起退款（支持多次退款）" }
      - { step: 3, api: "alipay.trade.fastpay.refund.query", desc: "退款查询（注意10000≠退款成功）" }
      - { step: 4, api: "alipay.trade.close / cancel", desc: "关闭未支付 / 撤销异常交易" }
      - { step: 5, api: "alipay.trade.order.settle", desc: "分账结算" }
      - { step: 6, api: "alipay.data.dataservice.bill.downloadurl.query", desc: "下载对账单" }

  cross_scene_payment_to_content:
    name: "跨场景：支付→内容权限"
    chain:
      - { step: 1, api: "alipay.trade.create + app.pay/wap.pay", desc: "用户为内容付费" }
      - { step: 2, api: "异步通知", desc: "支付成功回调SCRM" }
      - { step: 3, api: "alipay.trade.query", desc: "确认支付成功" }
      - { step: 4, api: "SCRM→VOD/IM", desc: "开通内容权限/变更IM角色" }
      - { step: 5, api: "alipay.trade.refund(如需)", desc: "内容退款→关闭权限" }

