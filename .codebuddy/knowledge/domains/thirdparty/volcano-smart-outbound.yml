        name: "更新推送地址"
        group: "回调推送"

    # 核心调用时序（简化版，详细版见scenario_maps）
    call_sequence:
      - step: 1
        api: "上传号码文件"
        api_id: "API-SO-001"
        next: "创建外呼任务"
      - step: 2
        api: "创建外呼任务"
        api_id: "API-SO-004 / API-SO-005"
        next: "外呼执行中"
      - step: 3
        api: "外呼引擎自动执行"
        api_id: "N/A（引擎内部）"
        next: "通话结果回调"
      - step: 4
        api: "Webhook回调推送"
        api_id: "API-SO-040"
        next: "业务系统处理结果"
      - step: 5
        api: "查询通话详情/标签/文本/录音"
        api_id: "API-SO-029~033"
        next: "数据写入CRM"

    sequence_diagram: |
      sequenceDiagram
          participant BIZ as 业务系统
          participant API as 外呼API
          participant ENGINE as 外呼引擎
          participant HOOK as Webhook服务
          participant CRM as CRM系统
          
          BIZ->>API: POST 上传号码文件
          API-->>BIZ: {file_url}
          BIZ->>API: POST 创建外呼任务(file_url+scene_id+config)
          API-->>BIZ: {task_id, status: "running"}
          
          loop 每通电话
              ENGINE->>ENGINE: 拨号+对话+意向判定
              ENGINE->>HOOK: POST 通话结果回调
              HOOK->>CRM: 写入客户画像更新
              HOOK-->>ENGINE: 200 OK
          end
          
          BIZ->>API: POST 查询通话列表(task_id)
          API-->>BIZ: {calls: [...], total, page}
          BIZ->>API: GET 下载录音(call_id)
          API-->>BIZ: wav文件

    orphan_apis:
      - api_id: "API-SO-017"
        name: "下载任务中上传未成功的数据"
        note: "独立使用的辅助API，不在主流程中，运营人员手动触发"

  # ═══════════════════════════════════════════════════════════════
  # 10. API参数字典（Part12）—— 核心API的参数定义
  # ═══════════════════════════════════════════════════════════════
  api_param_dictionary:
    description: "核心API的请求/响应参数定义，覆盖任务创建、结果回调、通话查询等关键接口"
    
    apis:
      # --- 创建外呼任务 ---
      - api_id: "API-SO-004"
        api_name: "创建任务(使用文件模版)"
        api_path: "POST /api/task/create-by-file"
        
        request_params:
          - field: "file_url"
            type: "string"
            required: true
            description: "上传号码文件返回的URL"
            semantic_role: "REFERENCE"
            source_type: "upstream_api"
            source_api: "API-SO-001"
            source_field: "file_url"
            validation: "非空URL"
            
          - field: "scene_id"
            type: "string"
            required: true
            description: "话术场景UUID"
            semantic_role: "REFERENCE"
            source_type: "user_input"
            validation: "有效场景UUID"
            
          - field: "task_name"
            type: "string"
            required: true
            description: "任务名称"
            semantic_role: "BUSINESS_PARAM"
            source_type: "user_input"
            max_length: "100"
            
          - field: "concurrency"
            type: "number"
            required: false
            description: "并发路数限制"
            semantic_role: "BUSINESS_PARAM"
            source_type: "user_input"
            default: "系统默认值"
            validation: "正整数，不超过剩余并发数"
            
          - field: "call_time_range"
            type: "object"
            required: false
            description: "允许外呼时间段"
            semantic_role: "BUSINESS_PARAM"

          - field: "retry_count"
            type: "number"
            required: false
            description: "未接通重试次数"
            semantic_role: "BUSINESS_PARAM"
            default: "3"

          - field: "dynamic_variables"
            type: "object"
            required: false
            description: "话术动态变量（如{客户姓名}{产品名称}）"
            semantic_role: "BUSINESS_PARAM"
            source_type: "user_input"
        
        response_params:
          - field: "task_id"
            type: "string"
            description: "任务唯一标识"
            semantic_role: "PRIMARY_KEY"
            downstream_usage: ["API-SO-009~011", "API-SO-029"]
          - field: "status"
            type: "string"
            description: "任务状态"
            semantic_role: "STATUS"
            enum_values: ["pending", "running", "paused", "completed", "stopped"]

      # --- Webhook回调 ---
      - api_id: "API-SO-040"
        api_name: "通话状态回调（Webhook推送）"
        api_path: "POST {客户配置的回调URL}"
        note: "这是最重要的对接接口——外呼系统主动推送到客户服务器"
        
        notification_params:
          notification_event: "call_status_change"
          params:
            - field: "call_id"
              type: "string"
              description: "通话唯一标识（串联整通会话）"
              semantic_role: "PRIMARY_KEY"
            - field: "task_id"
              type: "string"
              description: "所属任务ID"
              semantic_role: "REFERENCE"
            - field: "callee"
              type: "string"
              description: "被叫号码"
              semantic_role: "PRIMARY_KEY"
              encryption: "mask"
              validation: "11位手机号"
            - field: "status"
              type: "enum"
              description: "通话状态"
              semantic_role: "STATUS"
              enum_values: ["answered", "no_answer", "invalid_number", "busy", "refused", "hang_up"]
            - field: "intent_level"
              type: "enum"
              description: "客户意向等级"
              semantic_role: "BUSINESS_PARAM"
              enum_values: ["high", "medium", "low", "unknown"]
              nullable: true
            - field: "tags"
              type: "array"
              description: "AI标注的客户标签"
              semantic_role: "BUSINESS_PARAM"
              nullable: true
            - field: "duration"
              type: "number"
              description: "通话时长（秒）"
              semantic_role: "BUSINESS_PARAM"
            - field: "start_time"
              type: "string"
              description: "通话开始时间"
              semantic_role: "TIMESTAMP"
            - field: "end_time"
              type: "string"
              description: "通话结束时间"
              semantic_role: "TIMESTAMP"
            - field: "recording_url"
              type: "string"
              description: "通话录音文件URL"
              semantic_role: "REFERENCE"
              nullable: true
            - field: "conversation_summary"
              type: "string"
              description: "对话内容摘要"
              semantic_role: "BUSINESS_PARAM"
              nullable: true
          correlation_field: "call_id"

      # --- 创建计划任务 ---
      - api_id: "API-SO-018"
        api_name: "创建计划任务"
        api_path: "POST /api/plan-task/create"
        
        request_params:
          - field: "scene_id"
            type: "string"
            required: true
            description: "话术场景UUID"
            semantic_role: "REFERENCE"
            
          - field: "cron_expression"
            type: "string"
            required: true
            description: "CRON触发表达式"
            semantic_role: "BUSINESS_PARAM"
            validation: "有效CRON表达式"
            
          - field: "number_source"
            type: "string"
            required: true
            description: "号码来源（固定列表URL / 动态查询接口）"
            semantic_role: "REFERENCE"

          - field: "dynamic_params"
            type: "object"
            required: false
            description: "每次执行时的动态参数（可从业务系统实时拉取）"
            semantic_role: "BUSINESS_PARAM"

        response_params:
          - field: "plan_task_id"
            type: "string"
            description: "计划任务唯一标识"
            semantic_role: "PRIMARY_KEY"

      # --- 查询通话列表 ---
      - api_id: "API-SO-029"
        api_name: "分页查询通话列表"
        api_path: "POST /api/call/list"
        
        request_params:
          - field: "task_id"
            type: "string"
            required: false
            description: "按任务ID过滤"
            semantic_role: "QUERY_FILTER"
          - field: "status"
            type: "enum"
            required: false
            description: "按通话状态过滤"
            semantic_role: "QUERY_FILTER"
          - field: "start_time"
            type: "string"
            required: false
            description: "通话开始时间范围-起"
            semantic_role: "QUERY_FILTER"
          - field: "end_time"
            type: "string"
            required: false
            description: "通话开始时间范围-止"
            semantic_role: "QUERY_FILTER"
          - field: "page"
            type: "number"
            required: false
            description: "页码"
            semantic_role: "PAGINATION"
            default: "1"
          - field: "page_size"
            type: "number"
            required: false
            description: "每页条数"
            semantic_role: "PAGINATION"
            default: "20"
        
        response_params:
          - field: "total"
            type: "number"
            description: "总记录数"
            semantic_role: "RESPONSE_META"

      # --- 下载录音 ---
      - api_id: "API-SO-033"
        api_name: "音频下载(返回wav文件)"
        api_path: "GET /api/call/audio/download"
        
        request_params:
          - field: "call_id"
            type: "string"
            required: true
            description: "通话唯一标识"
            semantic_role: "PRIMARY_KEY"
        
        response_params:
          - field: "audio_data"
            type: "binary(wav)"
            description: "录音文件二进制数据"

  # ═══════════════════════════════════════════════════════════════
  # 11. 参数流转图（Part13）
  # ═══════════════════════════════════════════════════════════════
  param_flow:
    description: "核心场景下关键参数的跨API流转路径"
    
    intra_scene_param_flow:
      - scene_id: "SC-SO-001"
        scene_name: "线索清洗与意向筛选"
        flows:
          - from_api: "API-SO-001"
            from_field: "file_url"
            to_api: "API-SO-004"
            to_field: "file_url"
            dependency: "required"
          - from_api: "API-SO-004"
            from_field: "task_id"
            to_api: "API-SO-029"
            to_field: "task_id"
            dependency: "required"
          - from_api: "API-SO-040"
            from_field: "call_id"
            to_api: "API-SO-030"
            to_field: "call_id"
            dependency: "required"
          - from_api: "API-SO-040"
            from_field: "call_id"
            to_api: "API-SO-033"
            to_field: "call_id"
            dependency: "optional"
        mermaid: |
          graph LR
            A[API-001:上传文件] -->|file_url| B[API-004:创建任务]
            B -->|task_id| C[API-040:回调]
            C -->|call_id| D[API-030:查询标签]
            C -->|call_id| E[API-033:下载录音]
            B -->|task_id| F[API-029:查询通话列表]

    cross_scene_param_flow:
      - from_scene: "SC-SO-001(线索清洗)"
        from_api: "API-SO-040"
        from_field: "callee"
        to_scene: "SC-SO-002(生命周期触达)"
        to_api: "API-SO-005"
        to_field: "phone_numbers[]"
        dependency: "required"
        note: "通过SCRM统一客户ID中转：callee→SCRM查customer_id→匹配external_userid→生命周期判定"

    param_source_trace:
      - param_name: "task_id"
        semantic_role: "PRIMARY_KEY"
        origin:
          api_id: "API-SO-004/005"
          source_type: "system_generated"
        flows_to: ["API-SO-009", "API-SO-010", "API-SO-011", "API-SO-029"]
        trace_chain: "创建任务 → 系统生成 task_id → 后续所有任务操作/查询以此ID为锚点"

      - param_name: "call_id"
        semantic_role: "PRIMARY_KEY"
        origin:
          api_id: "API-SO-040(回调)"
          source_type: "system_generated"
        flows_to: ["API-SO-030", "API-SO-031", "API-SO-033"]
        trace_chain: "外呼引擎分配call_id → 回调推送 → 业务方以此ID查询标签/文本/录音"

      - param_name: "callee(手机号)"
        semantic_role: "PRIMARY_KEY"
        origin:
          api_id: "用户上传的号码名单"
          source_type: "user_input"
        flows_to: ["API-SO-040 → SCRM统一客户ID服务"]
        trace_chain: "号码名单 → 外呼引擎 → 回调推送callee → SCRM ID服务反查customer_id → 回写客户档案"

    param_dependency_matrix:
      description: "API间参数依赖矩阵（核心路径）"
      matrix:
        - consumer_api: "API-SO-004(创建任务-文件)"
          producer_api: "API-SO-001(上传文件)"
          params: ["file_url"]
          dependency: "required"
        - consumer_api: "API-SO-029(查询通话)"
          producer_api: "API-SO-004(创建任务)"
          params: ["task_id"]
          dependency: "required"
        - consumer_api: "API-SO-030(查询标签)"
          producer_api: "API-SO-040(回调)"
          params: ["call_id"]
          dependency: "required"

    param_security_analysis:
      sensitive_fields:
        - param_name: "callee"
          api_id: "API-SO-040(回调)"
          encryption: "mask"
          risk: "手机号明文泄露风险——回调传输和存储必须脱敏"
      idempotent_keys:
        - param_name: "request_id(如果有)"
          api_id: "API-SO-004(创建任务)"
          uniqueness_mechanism: "建议业务方生成唯一request_id防重复创建"
      amount_fields:
        - param_name: "N/A"
          note: "智能外呼不涉及金额字段"

  # ═══════════════════════════════════════════════════════════════
  # 自动化巡检配置
  # ═══════════════════════════════════════════════════════════════
  auto_check:
    enabled: false
    schedule: "monthly"
    last_checked: ""
    last_changed: ""
    status: "up_to_date"
