### 3.10 /learn-project — 项目学习

```yaml
command: "/learn-project"
category: "特殊入口"
pm_controlled: false
workflow: "learn-project.yml v6.1.0"

usage: "/learn-project --project=项目名 --source=scheme:value [--source=...] [--module=模块名] [--cookie=xxx] [--auth=xxx] [--transcript=文字稿.txt]"

parameters:
  - name: "--project"
    type: "string"
    required: true
    description: "项目名称。同名项目未指定--module时视为全量学习，覆盖已有知识库。"
    smart_hint: "将创建/覆盖 knowledge/{project}/ 目录"

  - name: "--source"
    type: "source"
    required: true
    multi: true
    description: "知识来源（至少1个，可多个混合）"
    schemes: ["local-dir", "http-url", "website", "video", "audio", "image", "file", "api-endpoint", "paste"]
    smart_hint: "10种来源可混合使用，如 --source=local-dir:./原型 --source=video:https://培训视频"

  - name: "--module"
    type: "string"
    required: false
    description: "模块/流程名（可选）。指定时增量学习该模块/流程；未指定时全量学习覆盖已有知识库。"
    smart_hint: "增量学习需已有知识库基础，如 --module=订阅模块 或 --module=分账流程"

  - name: "--cookie"
    type: "string"
    required: false
    description: "需登录网站的Cookie（仅会话内使用，不持久化）"
    security: "仅会话内使用，不持久化存储，日志脱敏"

  - name: "--auth"
    type: "string"
    required: false
    description: "认证信息（Bearer Token等）"
    security: "仅会话内使用，不持久化存储，日志脱敏"

  - name: "--transcript"
    type: "file"
    required: false
    description: "视频文字稿（ASR不可用时的降级方案）"
    smart_hint: "当视频无字幕且ASR不可用时提供"

missing_arg_prompt:
  "--project": "请提供项目名称（例如：--project=AI-SCRM）。"
  "--source": "请提供至少一个来源（例如：--source=local-dir:./docs 或 --source=video:https://...）。"
```

### 3.11 /learn-domain — 领域知识学习

```yaml
command: "/learn-domain"
category: "特殊入口"
pm_controlled: false
workflow: "learn-domain.yml v4.0.0"

usage: "/learn-domain [--domain=领域名] [--category=分类] --source=scheme:value [--source=...] [--focus=学习重点] [--allow-split] [--incremental] [--transcript=文字稿] [--deep-params] [--cookie=xxx] [--auth=xxx]"

parameters:
  - name: "--domain"
    type: "string"
    required: false
    description: "领域名称"
    smart_hint: "如：退款流、分账、进销存、微信账号体系等"

  - name: "--category"
    type: "enum"
    required: false
    description: "领域分类（15大分类）"
    enum: ["account", "product", "ad", "payment", "trade", "aftersale", "settlement", "supplychain", "marketing", "member", "ai", "report", "finance", "tax", "compliance"]
    smart_hint: "account=账号/product=商品/payment=支付/trade=交易/aftersale=售后/settlement=结算/supplychain=供应链/marketing=营销/member=会员"

  - name: "--source"
    type: "source"
    required: true
    multi: true
    description: "知识来源"
    schemes: ["https", "video", "file"]
    smart_hint: "支持3种：https://网页 / video:视频URL / file:本地文件"

  - name: "--focus"
    type: "string"
    required: false
    description: "学习重点说明，指定学习特定内容"
    smart_hint: "如：--focus='重点学习商户入网流程和资金收付API参数'"

  - name: "--allow-split"
    type: "flag"
    required: false
    description: "允许多领域拆分（内容跨多个领域时自动拆分）"

  - name: "--incremental"
    type: "flag"
    required: false
    description: "增量学习模式（智能整合去重+冲突合并）"

  - name: "--transcript"
    type: "file"
    required: false
    description: "视频文字稿（ASR降级方案）"

  - name: "--deep-params"
    type: "flag"
    required: false
    description: "V2.1.0新增，强制深度提取每个API的输入参数/输出参数（默认自动识别API文档时启用）"
    smart_hint: "当API文档含参数表时自动启用；手动指定可强制对全部API执行参数深度提取"

  - name: "--cookie"
    type: "string"
    required: false
    description: "V3.0.0新增，需登录网站时提供Cookie"
    smart_hint: "配合 --source=website: 使用"

  - name: "--auth"
    type: "string"
    required: false
    description: "V3.0.0新增，需登录网站时提供认证信息（格式：user:password）"
    smart_hint: "配合 --source=website: 使用"

missing_arg_prompt:
