## 二、全局参数标准

### 2.1 参数命名规范

所有命令统一使用 `--key=value` 格式（等号赋值），禁止位置参数。

```yaml
parameter_naming:
  format: "--key=value"
  forbidden:
    - "位置参数（如 /init AI-SCRM 新增）"
    - "空格赋值（如 /init --project AI-SCRM）"
    - "版本号出现在用户指令中（系统自动生成）"
  boolean_flags: "--flag（无值，存在即为true）"
```

### 2.2 参数语义隔离规则

| 参数名 | 专属命令 | 语义 | 说明 |
|--------|----------|------|------|
| `--type` | `/init` | 需求类型 | 新增/迭代/变更/修复 |
| `--brainstorm-type` | `/brainstorm` | 脑暴类型 | strategic/planning/regular |
| `--report-type` | `/report` | 报告类型 | test/accept/doc-index |
| `--source` | `/learn-*`, `/brainstorm`, `/init` | 知识来源 | scheme:value 格式，可多次指定 |
| `--owner` | 全部命令（可选） | 成员归属 | V1.0.0新增：指定项目归属成员，缺省时从.access-control.yml自动识别 |

### 2.3 source 参数格式标准

```yaml
source_format: "scheme:value"
schemes:
  local_dir: "local-dir:./path"          # 本地目录
  http_url: "http-url:https://..."       # HTTP网页
  https: "https://..."                   # HTTPS网页（learn-domain兼容）
  website: "website:https://..."         # 需登录网站
  video: "video:https://..."             # 视频
  audio: "audio:https://..."             # 音频
  image: "image:./path.png"              # 图片
  file: "file:./path.pdf"                # 本地文件
  api_endpoint: "api-endpoint:https://..." # API接口
  paste: "paste:直接粘贴文本"            # 直接粘贴
multi_source: true  # 支持多个 --source 参数
```

