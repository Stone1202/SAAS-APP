## 四、智能提示规则

### 4.1 缺失参数提示

当用户执行命令但缺少必填参数时，Agent 须按 `missing_arg_prompt` 给出智能提示：

```yaml
prompt_rules:
  - rule: "提示须包含参数名、示例值、可选值（如enum）"
  - rule: "提示须自然语言，非技术术语"
  - rule: "提示须给出最可能的默认值建议"
  - rule: "enum类型须列出全部可选值+说明"
  - rule: "source类型须列出支持的scheme前缀"
```

### 4.2 参数智能推荐

```yaml
smart_recommendations:
  - condition: "新项目首次执行 /brainstorm"
    recommend: "--brainstorm-type=strategic（新项目默认战略型）"
  
  - condition: "已有项目新模块 /brainstorm"
    recommend: "--brainstorm-type=planning"
  
  - condition: "功能优化 /brainstorm"
    recommend: "--brainstorm-type=regular"
  
  - condition: "Bug修复 /init"
    recommend: "--type=修复 --priority=P0"
  
  - condition: "新功能 /init"
    recommend: "--type=新增 --priority=P1"
  
  - condition: "/learn-domain 内容涉及退款"
    recommend: "--domain=退款流 --category=aftersale"
  
  - condition: "/learn-domain 内容涉及分账"
    recommend: "--domain=分账 --category=settlement"
  
  - condition: "/learn-project 视频无字幕"
    recommend: "添加 --transcript=文字稿.txt（ASR降级方案）"
  
  - condition: "/learn-project 需登录网站"
    recommend: "添加 --cookie=session_id=xxx 或 --auth=Bearer xxx"
```

### 4.3 参数冲突检测

```yaml
conflict_detection:
  - rule: "/brainstorm 不能同时使用 --type（已废弃，改用 --brainstorm-type）"
  - rule: "/report 不能使用 --type（已废弃，改用 --report-type）"
  - rule: "/init --type=修复 不能同时指定 --file（修复不需要需求文件）"
  - rule: "/learn-domain --incremental 须与 --domain 同时使用（增量学习须指定领域）"
  - rule: "/close 和 /handoff 不能同时执行（handoff 须在 close 之后）"
```

