### 3.17 /deploy — 手动部署（V1.0.0新增）

```yaml
command: "/deploy"
category: "特殊入口"
pm_controlled: true
workflow: "project-lifecycle.yml stage-9 / deploy-manager.yml V1.0.0"

usage: "/deploy --project=X [--version=v1.0.0] [--retry] [--status]"
example: "/deploy --project=AI-SCRM"

parameters:
  - name: "--project"
    type: "string"
    required: true
    description: "项目名称"
    smart_hint: "从 PROJECT-INDEX.yml 中已注册的项目选择"

  - name: "--version"
    type: "string"
    required: false
    description: "指定部署的版本号（不指定则部署当前流版本）"
    smart_hint: "如 v1.0.0，从 state.json streams 中读取当前版本"

  - name: "--retry"
    type: "boolean"
    required: false
    default: false
    description: "重试上次失败的部署"

  - name: "--status"
    type: "boolean"
    required: false
    default: false
    description: "查看部署状态（与部署互斥，指定此参数时不执行部署）"
    smart_hint: "从 DEPLOY-MANIFEST.yml 读取部署记录，展示所有项目当前部署版本+状态+最近5次部署"

modes:
  deploy:
    description: "部署当前版本或指定版本"
    condition: "未指定 --status 和 --retry"
    actions:
      - "读取 deploy/edgeone-pages.json 获取项目部署配置"
      - "注入 VITE_PROJECT_ID={owner}-{project} + VITE_MODE=sim"
      - "执行 npm run build:sim"
      - "推送构建产物到 EdgeOne Pages"
      - "生成访问 URL + 更新 DEPLOY-MANIFEST + PROJECT-INDEX + access-portal"

  retry:
    description: "重试上次失败的部署"
    condition: "指定 --retry"
    actions:
      - "从 DEPLOY-MANIFEST.yml 读取最近一次 status=failed 的记录"
      - "重新执行部署流程"

  status:
    description: "查看部署状态"
    condition: "指定 --status"
    actions:
      - "读取 DEPLOY-MANIFEST.yml"
      - "展示所有项目当前部署版本+状态"
      - "展示最近5次部署记录"
      - "展示失败部署的 error_msg"

missing_arg_prompt:
  "--project": "请提供项目名称（例如：--project=AI-SCRM）。"

conflict_detection:
  - rule: "--status 与 --version/--retry 互斥"
    message: "查看状态时不能指定版本或重试参数"
```

