## 三、命令详细规范

### 3.1 /brainstorm — 脑暴会议

```yaml
command: "/brainstorm"
category: "核心生命周期"
pm_controlled: false
workflow: "brainstorm.yml v3.5.1"

usage: "/brainstorm --industry=行业 --brainstorm-type=strategic|planning|regular --topic=议题名 [--project=项目名] [--source=...] [--stakeholders=干系人清单.md]"

parameters:
  - name: "--industry"
    type: "string"
    required: true
    default: null
    description: "行业类型"
    examples: ["ecommerce", "live", "saas", "finance", "social", "game", "erp", "advertising", "tourism", "general"]
    smart_hint: "从 config.yml industries 中选择，影响行业特征加载"

  - name: "--brainstorm-type"
    type: "enum"
    required: true
    default: "regular"
    description: "脑暴类型（决定输出物和后续流程）"
    enum:
      - value: "strategic"
        label: "战略型（新项目/重大转型）"
        outputs: ["脑暴文档", "战略分析", "商业分析"]
        next: "→ PO Agent（战略级激活）"
      - value: "planning"
        label: "规划型（新模块/大版本）"
        outputs: ["脑暴文档"]
        next: "→ PO Agent（规划级激活）"
      - value: "regular"
        label: "常规型（功能优化/中版本）"
        outputs: ["脑暴文档"]
        next: "→ PM 直接立项（跳过PO）"
    smart_hint: "新项目选strategic；新模块选planning；功能优化选regular"

  - name: "--topic"
    type: "string"
    required: true
    default: null
    description: "脑暴议题名（v3.4.0新增）。同一项目同一议题允许多次脑暴，产物按议题子目录组织。"
    smart_hint: "议题名将作为产物子目录名，如 --topic=直播音频审核 或 --topic=退款流程优化"
    missing_arg_prompt: "请提供脑暴议题名称，例如 --topic=直播音频审核"

  - name: "--project"
    type: "string"
    required: false
    default: "未命名"
    description: "项目名称（存量项目必填，新项目可省略）"
    smart_hint: "存量项目须与 knowledge/{project}/ 目录匹配"

  - name: "--source"
    type: "source"
    required: false
    default: null
    description: "外部输入源（可多次指定）"
    multi: true
    smart_hint: "支持 local-dir: / http-url: / website: 三种scheme"

  - name: "--stakeholders"
    type: "file"
    required: false
    default: null
    description: "外部干系人清单文件"
    smart_hint: "Markdown格式，每行一个干系人角色"

missing_arg_prompt:
  "--industry": "请提供行业类型（例如：--industry=ecommerce）。可选值见 config.yml industries。"
  "--brainstorm-type": "请提供脑暴类型（--brainstorm-type=strategic|planning|regular）。新项目选strategic，新模块选planning，功能优化选regular。"

interactive_flow:
  description: |
    V4.2.0重构：取消"新项目/存量项目"交互式问答，改为参数驱动+自动检测。
    保留参数说明展示+必填项缺失指引。
  steps:
    - step: "param_display"
      trigger: "用户输入 /init 命令后"
      action: "自动展示全部参数说明（必填+可选）"
    - step: "missing_guide"
      trigger: "必填参数缺失"
      action: "展示参数引导提示（参数名+说明+示例值+可选值+默认值建议）"
    - step: "auto_detect"
      trigger: "参数齐全"
      action: "自动检测项目性质（扫描projects/{--project}/），组装参数路由包传递BA"
```

### 3.2 /init — 开启需求流

```yaml
command: "/init"
category: "核心生命周期"
pm_controlled: true
workflow: "project-lifecycle.yml v5.1.0"

usage: "/init --project=X --type=新增|迭代|变更|修复 --desc=需求描述 [--brainstorm-topic=脑暴议题名] [--file=...] [--api=...] [--source=...] [--priority=...]"

parameters:
  - name: "--project"
    type: "string"
    required: true
    default: "未命名"
    description: "项目名称"
    smart_hint: "须与 projects/{project}/ 目录匹配"

  - name: "--type"
    type: "enum"
    required: true
    default: "新增"
    description: "需求类型（决定版本号递增策略）"
    enum:
      - value: "新增"
        label: "全新功能模块"
        version_bump: "minor"
        touch_stages: [requirement, design, arch, dev, test, accept]
      - value: "迭代"
        label: "已有版本功能增强"
        version_bump: "minor"
        touch_stages: [requirement, design, arch, dev, test, accept]
      - value: "变更"
        label: "已有需求的修改"
        version_bump: "patch"
        touch_stages: [requirement, design, arch, dev, test, accept]
      - value: "修复"
        label: "Bug修复"
        version_bump: "patch"
        touch_stages: [dev, test, accept]
    smart_hint: "新功能选新增；功能增强选迭代；修改现有选变更；Bug选修复"

  - name: "--desc"
    type: "string"
    required: true
    default: null
    description: "需求描述（自然语言）"
    smart_hint: "简要描述需求目标，影响范围由BA自动识别"

  - name: "--brainstorm-topic"
    type: "string"
    required: false
    default: null
    description: "脑暴议题名（V4.2.1新增）。指定后PM按议题查找 projects/{project}/docs/00-brainstorm/{topic}/confirmed/BR-脑暴文档-确认稿.md 作为BA背景输入，同时加载领域知识清单+API分析清单。未指定时若只有一个议题自动加载，多个议题提示选择。"
    smart_hint: "与/brainstorm --topic=议题名 对应，适合脑暴确认后隔段时间再/init的场景"
    missing_arg_prompt: "无需追问，未提供时自动检测议题数量决定加载策略"

  - name: "--file"
    type: "file"
    required: false
    default: null
    description: "外部需求文件"
    smart_hint: "Markdown格式需求文档"

  - name: "--api"
    type: "file"
    required: false
    default: null
    description: "外部接口文档"
    smart_hint: "供架构师参考的API规格文档"

  - name: "--source"
    type: "source"
    required: false
    default: null
    description: "外部输入源（可多次指定）"
    multi: true

  - name: "--priority"
    type: "enum"
    required: false
    default: "P1"
    description: "优先级"
    enum:
      - value: "P0"
        label: "紧急/阻塞（24小时内）"
      - value: "P1"
        label: "高优先级（3天内）"
      - value: "P2"
        label: "中优先级（本迭代内）"
      - value: "P3"
        label: "低优先级（下迭代）"
    smart_hint: "修复默认P0；新增默认P1；迭代默认P2"

missing_arg_prompt:
  "--project": "请提供项目名称（例如：--project=AI-SCRM）。"
  "--type": "请提供需求类型（--type=新增|迭代|变更|修复）。"
  "--desc": "请提供需求描述（--desc=加入秒杀功能）。"
```

### 3.3 /feedback — 反馈回流

```yaml
command: "/feedback"
category: "核心生命周期"
pm_controlled: true
workflow: "project-lifecycle.yml v5.1.0" --project=X [--type=Y] [--msg=反馈内容]   （--type 可省略，自动选当前进行中需求流）"

parameters:
  - name: "--project"
    type: "string"
    required: true
    description: "项目名称"

  - name: "--type"
    type: "enum"
    required: false
    default: "auto（自动选当前未close的需求流）"
    description: "需求类型（可省略，自动绑定）"
    enum: ["新增", "迭代", "变更", "修复"]
    smart_hint: "省略时自动选当前进行中的需求流"

  - name: "--msg"
    type: "string"
    required: false
    default: null
    description: "反馈内容"
    smart_hint: "自然语言描述反馈，PM会路由到需求分析阶段"

missing_arg_prompt:
  "--project": "请提供项目名称。"
```

### 3.4 /close — 结束需求流

```yaml
command: "/close"
category: "核心生命周期"
pm_controlled: true
workflow: "project-lifecycle.yml v5.1.0"

usage: "/close --project=X [--type=Y]"

parameters:
  - name: "--project"
    type: "string"
    required: true
    description: "项目名称"

  - name: "--type"
    type: "enum"
    required: false
    default: "auto"
    description: "需求类型（可省略）"
    enum: ["新增", "迭代", "变更", "修复"]

post_action: "版本沉淀学习(R6) → PM询问PO下一版本规划（敏捷递归）"
```

