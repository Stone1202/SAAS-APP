## 五、命令流程图

```
用户入口
  │
  ├─ /brainstorm --brainstorm-type=strategic → 脑暴(战略型) → PO Agent → /init
  ├─ /brainstorm --brainstorm-type=planning  → 脑暴(规划型) → PO Agent → /init
  ├─ /brainstorm --brainstorm-type=regular   → 脑暴(常规型) → /init
  │
  ├─ /learn-project → 知识库学习 → 可选 /rebuild → /brainstorm
  ├─ /learn-domain → 领域知识库学习
  ├─ /learn-domain-check → 领域知识巡检
  │
  ├─ /init → 需求流开始 → /plan → BA → UX → Arch → FD → /test → /accept
  │                                                                    │
  │  ← /feedback ←──────────────────────────────────────────────────────┘
  │
  ├─ /close → 版本沉淀 → PM询问PO下一版本 → /init v2（递归）
  ├─ /handoff → 交付标注
  │
  ├─ /migrate → 跨项目迁移
  └─ /report → 生成报告
```
