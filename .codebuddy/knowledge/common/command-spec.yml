> **版本**：V1.2.0 | **创建日期**：2026-07-17  
> **定位**：.codebuddy/ 全局共享的命令注册规范，定义所有命令的参数格式、类型、默认值、智能提示  
> **关联文件**：`config.yml`（命令注册）、各 `workflow.yml`（流程定义）

---

