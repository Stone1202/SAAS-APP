# ============================================
# 专家盲区检查清单库 V1.1.0
# ============================================
# 定位：需求分析阶段的行业经验驱动盲区发现
# 用法：requirement-flow.yml §2.5/§3.5/§3.8 环节化扫盲时加载
# 原则：AI按清单逐项审查 → 发现盲区 → 给出建议方案 → 成员确认
#
# V1.1.0升级（V3.4.0配套）：环节化扫盲
#   1. 扫盲不再只在§2.5一次性做，而是分散到5个环节，每次聚焦正确的焦点
#   2. 环节化扫盲矩阵引用 expert-registry.yml 的匹配规则
#   3. 每环节的专家组合和盲区清单不同：
#      阶段1业务还原：9行业专家×5业务盲区（业务完整性）+ NFR技术扫盲
#      阶段2系统划分：4技术专家×5系统盲区（系统边界）+ 系统划分专家 + NFR
#      阶段3终端划分：4终端专家×5终端盲区（终端覆盖）+ NFR
#      架构阶段：4技术专家×4技术盲区（技术风险）
#      测试阶段：3QA专家×4测试盲区（测试覆盖）
#   4. 专家统一配置管理：common/expert-registry.yml（18盲区专家+7系统划分专家×3流程匹配）
#   5. 冻结机制：每环节扫盲通过→用户确认→冻结→传入下一环节
# ============================================

version: "1.0.0"
created: "2026-07-21"
description: |
  18个领域专家 × 21类盲区的检查清单库。
  AI根据需求内容自动匹配专家类型，按清单逐项审查，
  发现盲区后给出建议方案，成员确认后BA补充。

# ============================================
# 专家匹配规则（AI根据需求关键词自动匹配专家）
# ============================================
expert_matching:
  rules:
    - keywords: ["营销", "活动", "优惠券", "促销", "秒杀", "拼团", "红包"]
      experts: ["marketing", "security", "architecture", "data", "operations"]
    - keywords: ["订单", "交易", "购物车", "支付"]
      experts: ["ecommerce", "inventory", "finance", "logistics", "data"]
    - keywords: ["直播", "录播", "点播", "推流", "转码"]
      experts: ["live", "content", "social", "architecture"]
    - keywords: ["定时任务", "调度", "cron", "批次"]
      experts: ["architecture", "qa"]
    - keywords: ["退款", "退货", "售后", "客诉"]
      experts: ["ecommerce", "customer_service", "finance", "logistics"]
    - keywords: ["会员", "积分", "等级", "用户体系"]
      experts: ["member", "security", "data"]
    - keywords: ["库存", "入库", "出库", "盘点", "调拨"]
      experts: ["inventory", "procurement"]
    - keywords: ["采购", "供应商", "进货"]
      experts: ["procurement", "inventory", "finance"]
    - keywords: ["报表", "统计", "指标", "看板", "BI"]
      experts: ["data", "operations"]
    - keywords: ["消息", "通知", "推送", "私信"]
      experts: ["social", "architecture"]
    - keywords: ["审核", "内容", "UGC", "评论"]
      experts: ["content", "security", "legal"]
    - keywords: ["权限", "角色", "租户", "隔离"]
      experts: ["security", "legal"]
    - keywords: ["导出", "导入", "批量"]
      experts: ["architecture", "qa", "data"]
    - keywords: ["登录", "注册", "认证", "密码"]
      experts: ["member", "security"]
    - keywords: ["对账", "结算", "发票", "财务"]
      experts: ["finance", "payment"]
    - keywords: ["迭代", "变更", "升级", "迁移"]
      experts: ["ALL"]  # 迭代需求触发全部相关专家+涟漪效应分析
  default_experts: ["architecture", "security", "qa"]  # 默认匹配3个基础专家

# ============================================
# 21类盲区分类索引
# ============================================
blindspot_categories:
  exception_branch: { id: "A", name: "异常分支盲区", examples: "定时任务宕机/消息积压/接口超时" }
  security_risk: { id: "B", name: "安全风控盲区", examples: "防刷/防重放/脱敏" }
  iteration_impact: { id: "C", name: "迭代影响盲区", examples: "旧用例/旧状态/旧指标影响" }
  reverse_flow: { id: "D", name: "逆向流程盲区", examples: "取消/退款/超时" }
  state_anomaly: { id: "E", name: "状态异常盲区", examples: "断流/封禁/不可达状态" }
  disaster_recovery: { id: "F", name: "容灾降级盲区", examples: "宕机/熔断/兜底" }
  boundary_value: { id: "G", name: "边界值盲区", examples: "0/1/最大/null/空" }
  data_consistency: { id: "H", name: "数据一致性盲区", examples: "口径/延迟/不一致" }
  user_experience: { id: "I", name: "用户体验盲区", examples: "空状态/加载/错误/反馈" }
  rule_boundary: { id: "J", name: "业务规则边界盲区", examples: "规则冲突/变更生效/组合爆炸" }
  permission_isolation: { id: "K", name: "权限与数据隔离盲区", examples: "多租户/数据权限/角色继承" }
  performance_capacity: { id: "L", name: "性能与容量盲区", examples: "大数据量/高并发/批量/导出" }
  i18n_compliance: { id: "M", name: "国际化与合规盲区", examples: "时区/货币/合规/资质" }
  lifecycle_timeline: { id: "N", name: "生命周期与时间线盲区", examples: "归档/过期/版本兼容/灰度" }
  third_party_dependency: { id: "O", name: "第三方依赖盲区", examples: "API变更/不稳定/一致性/限流" }
  operations_growth: { id: "P", name: "运营与增长盲区", examples: "配置防呆/埋点/A-B测试/反馈" }
  legal_audit: { id: "Q", name: "法律与审计盲区", examples: "操作日志/合同/数据保留/知识产权" }
  business_continuity: { id: "R", name: "业务连续性盲区", examples: "灾难恢复/最小可用/应急预案" }
  ripple_effect: { id: "S", name: "迭代涟漪效应盲区", examples: "一个变更触发多领域连锁影响" }
  requirement_conflict: { id: "T", name: "需求隐性冲突盲区", examples: "不同需求组合后产生矛盾" }
  data_lifecycle: { id: "U", name: "数据生命周期盲区", examples: "产生/使用/变更/归档/删除" }

# ============================================
# 18个专家盲区检查清单
# ============================================
experts:

  # ========== 1. 电商交易专家 ==========
  ecommerce:
    name: "电商交易专家"
    domains: ["订单", "交易", "购物车", "支付"]
    check_dimensions:
      - dimension: "逆向流程检查"
        category: "D"
        items:
          - { id: "EC-01", check: "取消订单流程（支付前/支付后/发货前/发货后，每个节点取消逻辑不同）", severity: "P0" }
          - { id: "EC-02", check: "退款流程（全额/部分/多次，每种影响库存和财务不同）", severity: "P0" }
          - { id: "EC-03", check: "超时处理（支付超时/确认收货超时/评价超时）", severity: "P1" }
          - { id: "EC-04", check: "并发控制（同一商品多人同时下单/同一用户多端同时下单）", severity: "P0" }
      - dimension: "订单状态检查"
        category: "E"
        items:
          - { id: "EC-05", check: "状态机全状态覆盖（是否有死状态/不可达状态）", severity: "P0" }
          - { id: "EC-06", check: "状态转换完整性（每个状态的所有触发条件是否定义）", severity: "P1" }
      - dimension: "支付流程检查"
        category: "A"
        items:
          - { id: "EC-07", check: "支付回调处理（成功/失败/超时，重复回调幂等）", severity: "P0" }
          - { id: "EC-08", check: "支付对账（平台vs渠道vs商家，差异处理）", severity: "P1" }

  # ========== 2. 直播/录播/点播专家 ==========
  live:
    name: "直播/录播/点播专家"
    domains: ["直播", "录播", "点播", "推流", "转码"]
    check_dimensions:
      - dimension: "状态异常检查"
        category: "E"
        items:
          - { id: "LV-01", check: "断流重连（网络波动→自动重连→重连失败→降级为录播？）", severity: "P0" }
          - { id: "LV-02", check: "主播异常退出（崩溃/断网/主动退出，观众端如何感知？）", severity: "P0" }
          - { id: "LV-03", check: "封禁与解禁（直播中封禁→立即停止？已产生内容如何处理？）", severity: "P0" }
      - dimension: "录播点播检查"
        category: "A"
        items:
          - { id: "LV-04", check: "录播转点播（自动转码→审核→上架，失败如何处理？）", severity: "P1" }
          - { id: "LV-05", check: "CDN回源（首帧延迟/卡顿/切流，降级方案？）", severity: "P1" }

  # ========== 3. 营销活动专家 ==========
  marketing:
    name: "营销活动专家"
    domains: ["营销", "活动", "优惠券", "促销", "秒杀", "拼团", "红包"]
    check_dimensions:
      - dimension: "风控检查"
        category: "B"
        items:
          - { id: "MK-01", check: "防刷机制（限频/限量/限人/设备指纹/IP限制/黑名单）", severity: "P0" }
          - { id: "MK-02", check: "异常参与（多账号/虚拟号/羊毛党/批量注册识别）", severity: "P0" }
      - dimension: "预算控制检查"
        category: "A"
        items:
          - { id: "MK-03", check: "预算超限处理（总预算/日预算/用户预算，超限降级或终止）", severity: "P0" }
          - { id: "MK-04", check: "奖励异常（发奖失败/重复发奖/奖品超发/奖品下架）", severity: "P1" }
      - dimension: "活动叠加检查"
        category: "J"
        items:
          - { id: "MK-05", check: "活动叠加规则（与其他活动是否允许叠加？叠加后预算计算？）", severity: "P1" }
          - { id: "MK-06", check: "互斥规则（哪些活动互斥？互斥时优先级？）", severity: "P1" }
      - dimension: "商品联动检查"
        category: "A"
        items:
          - { id: "MK-07", check: "商品下架处理（活动中商品下架，已参与用户如何处理？）", severity: "P0" }

  # ========== 4. 数据/报表专家 ==========
  data:
    name: "数据/报表专家"
    domains: ["报表", "统计", "指标", "看板", "BI"]
    check_dimensions:
      - dimension: "指标定义检查"
        category: "H"
        items:
          - { id: "DT-01", check: "统计口径（下单数/支付数/发货数/完成数，每个口径不同）", severity: "P0" }
          - { id: "DT-02", check: "时间维度（自然日/滚动24h/按结算日，时区？）", severity: "P1" }
          - { id: "DT-03", check: "数据一致性（实时vs离线，延迟？不一致？）", severity: "P1" }
      - dimension: "迭代影响检查"
        category: "C"
        items:
          - { id: "DT-04", check: "迭代影响旧报表指标（改了状态机，历史统计是否需要重算？）", severity: "P0" }
          - { id: "DT-05", check: "历史数据迁移（新增字段，历史数据如何补值？）", severity: "P0" }
      - dimension: "数据生命周期检查"
        category: "U"
        items:
          - { id: "DT-06", check: "数据归档（3年前数据，热查询还是冷存储？）", severity: "P2" }
          - { id: "DT-07", check: "数据过期（优惠券/活动过期后，统计数据如何处理？）", severity: "P2" }

  # ========== 5. 财务专家 ==========
  finance:
    name: "财务专家"
    domains: ["对账", "结算", "发票", "财务", "退款"]
    check_dimensions:
      - dimension: "对账检查"
        category: "H"
        items:
          - { id: "FN-01", check: "三方对账（平台vs渠道vs商家，差异如何处理？）", severity: "P0" }
          - { id: "FN-02", check: "对账延迟（实时对账vsT+1，差异处理时效？）", severity: "P1" }
      - dimension: "结算检查"
        category: "A"
        items:
          - { id: "FN-03", check: "结算周期（T+1/T+7/月结，手续费？退款扣减？）", severity: "P0" }
          - { id: "FN-04", check: "退款影响结算（退款后已结算金额如何调整？）", severity: "P0" }
      - dimension: "发票检查"
        category: "A"
        items:
          - { id: "FN-05", check: "开票时机（支付后/发货后/确认后？）", severity: "P1" }
          - { id: "FN-06", check: "红冲/作废（退款后已开发票如何红冲？）", severity: "P1" }

  # ========== 6. 库存/进销存专家 ==========
  inventory:
    name: "库存/进销存专家"
    domains: ["库存", "入库", "出库", "盘点", "调拨"]
    check_dimensions:
      - dimension: "预占检查"
        category: "A"
        items:
          - { id: "IV-01", check: "预占库存（下单预占→支付确认→超时释放，预占和可用分开？）", severity: "P0" }
          - { id: "IV-02", check: "预占超时释放（超时未支付，库存何时释放？释放后并发抢占？）", severity: "P0" }
      - dimension: "多仓检查"
        category: "A"
        items:
          - { id: "IV-03", check: "分仓库存（总库存vs分仓，调拨流程？安全库存？）", severity: "P1" }
      - dimension: "并发检查"
        category: "L"
        items:
          - { id: "IV-04", check: "超卖防护（并发扣减如何防超卖？分布式锁？乐观锁？）", severity: "P0" }
      - dimension: "盘点检查"
        category: "A"
        items:
          - { id: "IV-05", check: "盘点时业务冻结（盘点时是否冻结出入库？）", severity: "P2" }

  # ========== 7. 采购专家 ==========
  procurement:
    name: "采购专家"
    domains: ["采购", "供应商", "进货"]
    check_dimensions:
      - dimension: "审批检查"
        category: "A"
        items:
          - { id: "PC-01", check: "审批超时（审批人不在怎么办？自动通过？升级审批？）", severity: "P1" }
      - dimension: "供应商检查"
        category: "A"
        items:
          - { id: "PC-02", check: "供应商异常（停产/涨价/资质过期，已创建采购单如何处理？）", severity: "P1" }
      - dimension: "到货检查"
        category: "A"
        items:
          - { id: "PC-03", check: "部分到货（采购100到80，催货？自动拆单？）", severity: "P1" }
          - { id: "PC-04", check: "退货（入库后发现质量问题，采购退货流程？）", severity: "P2" }

  # ========== 8. 架构专家 ==========
  architecture:
    name: "架构专家"
    domains: ["定时任务", "调度", "消息队列", "接口", "缓存", "默认匹配"]
    check_dimensions:
      - dimension: "容灾检查"
        category: "F"
        items:
          - { id: "AR-01", check: "服务宕机（依赖服务挂了，降级方案？熔断？兜底数据？）", severity: "P0" }
          - { id: "AR-02", check: "定时任务宕机（任务服务器挂了，补偿？告警？手动触发？）", severity: "P0" }
      - dimension: "异步检查"
        category: "A"
        items:
          - { id: "AR-03", check: "消息队列积压（积压处理？消费幂等？消息丢失补偿？）", severity: "P0" }
          - { id: "AR-04", check: "接口超时降级（第三方接口超时，降级方案？重试策略？）", severity: "P0" }
      - dimension: "一致性检查"
        category: "H"
        items:
          - { id: "AR-05", check: "跨服务事务（最终一致性？Saga？TCC？）", severity: "P1" }
          - { id: "AR-06", check: "缓存一致性（缓存与DB不一致，延迟双删？Canal？）", severity: "P1" }
      - dimension: "性能检查"
        category: "L"
        items:
          - { id: "AR-07", check: "大数据量（列表10万条，分页？虚拟滚动？搜索性能？）", severity: "P1" }
          - { id: "AR-08", check: "高并发（秒杀1000QPS，限流？排队？降级？）", severity: "P0" }
          - { id: "AR-09", check: "批量操作（批量导入1万条，超时？进度？部分成功？）", severity: "P1" }
      - dimension: "幂等检查"
        category: "B"
        items:
          - { id: "AR-10", check: "接口幂等（重复调用是否安全？幂等键？）", severity: "P0" }

  # ========== 9. 安全专家 ==========
  security:
    name: "安全专家"
    domains: ["权限", "角色", "租户", "隔离", "登录", "敏感数据", "默认匹配"]
    check_dimensions:
      - dimension: "数据安全检查"
        category: "B"
        items:
          - { id: "SE-01", check: "敏感数据脱敏（手机号/身份证/银行卡，存储脱敏？展示脱敏？）", severity: "P0" }
          - { id: "SE-02", check: "数据加密传输（HTTPS？字段级加密？）", severity: "P0" }
      - dimension: "接口安全检查"
        category: "B"
        items:
          - { id: "SE-03", check: "防重放（请求签名？时间戳？nonce？）", severity: "P1" }
          - { id: "SE-04", check: "频率限制（接口限流？IP限流？用户限流？）", severity: "P1" }
      - dimension: "权限检查"
        category: "K"
        items:
          - { id: "SE-05", check: "水平越权（用户A能否访问用户B的数据？）", severity: "P0" }
          - { id: "SE-06", check: "垂直越权（普通用户能否调用管理员接口？）", severity: "P0" }
          - { id: "SE-07", check: "多租户隔离（租户A能否看到租户B的数据？）", severity: "P0" }
      - dimension: "注入检查"
        category: "B"
        items:
          - { id: "SE-08", check: "SQL注入/XSS/CSRF防护（输入校验？输出编码？）", severity: "P1" }

  # ========== 10. QA专家 ==========
  qa:
    name: "QA专家"
    domains: ["默认匹配", "测试", "边界", "状态"]
    check_dimensions:
      - dimension: "边界值检查"
        category: "G"
        items:
          - { id: "QA-01", check: "数值边界（0/1/最大值/超出最大值/负数）", severity: "P1" }
          - { id: "QA-02", check: "空值边界（null/空字符串/空数组/空对象）", severity: "P1" }
      - dimension: "状态覆盖检查"
        category: "E"
        items:
          - { id: "QA-03", check: "可达性（每个状态是否可达？）", severity: "P0" }
          - { id: "QA-04", check: "死状态（是否有永远无法退出的状态？）", severity: "P0" }
      - dimension: "并发检查"
        category: "L"
        items:
          - { id: "QA-05", check: "竞态条件（同时操作/锁冲突/双重提交）", severity: "P1" }
      - dimension: "数据依赖检查"
        category: "G"
        items:
          - { id: "QA-06", check: "前置数据（存在/不存在/部分存在时的行为）", severity: "P1" }

  # ========== 11-18 扩展专家（精简版） ==========
  customer_service:
