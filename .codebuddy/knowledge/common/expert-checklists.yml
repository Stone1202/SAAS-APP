# ============================================
# 迭代涟漪效应检查（迭代需求专用）
# ============================================
ripple_effect_check:
  description: |
    迭代需求专用：一个变更触发多领域连锁评估。
    当--type=迭代或变更时，除常规专家审查外，额外执行涟漪效应分析。
  trigger: "requirement_type in [迭代, 变更]"
  flow:
    - step: 1
      action: "识别变更内容（改了什么？状态机/字段/规则/接口）"
    - step: 2
      action: "匹配受影响领域（改订单状态→电商/库存/财务/数据/客服/物流）"
    - step: 3
      action: "每个受影响领域由对应专家评估旧需求影响"
      examples:
        - "电商专家：旧用例的取消/退款流程是否受影响？"
        - "财务专家：旧对账逻辑是否受影响？"
        - "数据专家：旧统计指标口径是否受影响？"
        - "库存专家：旧库存预占逻辑是否受影响？"
    - step: 4
      action: "输出涟漪影响清单（受影响的旧用例/旧状态/旧指标/旧规则）"

# ============================================
# 需求隐性冲突检查
# ============================================
requirement_conflict_check:
  description: |
    不同需求方的需求组合后可能产生矛盾。
    AI检查当前需求与已有需求是否有隐性冲突。
  trigger: "always"
  check_items:
    - { id: "RC-01", check: "效率vs安全冲突（批量操作+每步审批=体验极差）", severity: "P1" }
    - { id: "RC-02", check: "灵活性vs一致性冲突（可配置+强制规则=矛盾）", severity: "P1" }
    - { id: "RC-03", check: "实时性vs准确性冲突（实时统计+精确对账=不可能同时）", severity: "P2" }

# ============================================
# AI建议方案模板
# ============================================
suggestion_template:
  format: |
    每个发现的盲区，AI给出建议方案：
    - 2-3个可选方案（含利弊分析+实现复杂度+适用场景）
    - AI推荐方案（基于需求内容评估）
    - 自定义选项（成员可自行描述方案）
  structure:
    blindspot_id: "MK-01"
    expert: "marketing"
    description: "防刷机制未定义"
    severity: "P0"
    suggestions:
      - solution: "方案A：限频+限人"
        pros: ["实现简单（3天）", "覆盖大部分场景"]
        cons: ["无法防设备刷"]
        complexity: "低"
        suitable: "内部活动/低风险场景"
        recommended: true
      - solution: "方案B：设备指纹+IP限制"
        pros: ["防刷效果好"]
        cons: ["实现复杂（7天）", "可能误杀正常用户"]
        complexity: "中"
        suitable: "公开活动/高价值奖品"
        recommended: false
      - solution: "方案C：风控引擎（综合评分）"
        pros: ["最精准"]
        cons: ["实现最复杂（14天）", "需要积累风控数据"]
        complexity: "高"
        suitable: "长期运营的高风险活动"
        recommended: false

# ============================================
# 盲区决策状态定义
# ============================================
decision_status:
  pending: "⚪待确认"
  need_supplement: "✅需要补充"
  not_applicable: "⬜不适用"
  need_discuss: "❓需讨论"
  supplemented: "已补充"
  skipped: "已跳过（不适用）"

# ============================================
# 闭环验证规则
# ============================================
closure_validation:
  max_iterations: 3  # 最多3次循环
  on_exceed: "PM介入，人工决策剩余盲区"
  validation_criteria: "所有need_supplement状态变为supplemented，无新发现盲区"

