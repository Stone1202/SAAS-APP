# ============================================
# 与用例级检查的区别：
#   场景级（§2.5）：审查"有没有考虑XXX场景？"→ 补充场景清单 → 用例设计时自然包含
#   用例级（§7门禁）：审查"XXX边界值/异常路径是否完整？"→ 门禁校验，阻止不合格产物
# 场景级在§2.5执行（场景挖掘后、用例设计前），用例级在§7门禁校验时执行。

