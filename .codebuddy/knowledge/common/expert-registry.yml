# ============================================
# 专家统一配置注册表 V1.0.0
# ============================================
# 定位：脑暴/PO规划/BA分析三个流程的专家统一配置管理
# 两类专家：
#   1. 盲区检查专家（18个）—— 发现"有没有遗漏XX场景"
#   2. 系统划分专家（7个）—— 提供"行业通常怎么划分系统"的经验
# 三阶段分析中的角色：
#   阶段1业务还原：行业盲区专家（业务完整性扫盲+NFR技术扫盲）
#   阶段2系统划分：系统划分专家（系统边界参考）+ 技术盲区专家（系统盲区扫盲+NFR）
#   阶段3终端划分：终端盲区专家（终端覆盖扫盲+NFR）
#   架构阶段：技术盲区专家（技术风险扫盲）
#   测试阶段：QA盲区专家（测试覆盖扫盲）
# ============================================

version: "1.1.0"
created: "2026-07-22"
description: |
  脑暴流程、PO规划流程、BA分析流程中所有专家的统一配置。
  每个专家有：特殊领域（触发关键词）、专业领域（深度知识画像）、
  适用阶段（在哪些环节参与）、适用商业模式（系统专家）。

