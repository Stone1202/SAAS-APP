# ============================================
# BA 需求文档标准模板（单一事实源）
# 版本：v3.3.0
# 最后更新：2026-07-20
# 说明：本文件是 BA Agent 所有需求产物的唯一模板事实源。
#       V3.3.0新增：五大业务产物深度还原标准（引用scene-learning-standards.yml），双态标注（显式照录+🟡隐式挖掘还原）
#       严格对齐「产品经理梳理需求过程」：
#         真实场景 → 业务流程 → 业务泳道图(角色/部门/关键动作)
#         → 信息流转图(信息主体/依赖动作) → 业务状态机约束
#         → 每个操作的详细用例(功能编号/模块/业务系统/流程/用户故事
#           /前置/主流程/次流程/异常/后置含跨模块数据影响)
# 所有下游（UX/Arch/FD/QA/AC/handoff）以本文件衍生出的 REQ 产物为唯一事实源。
# ============================================

doc_standard:
  # 通用元数据头（每个 REQ 产物文件必须包含）
  metadata_header:
    fields: [doc_id, module, business_system, version, platform, author, created, source_brainstorm]
    rule: "doc_id 格式 REQ-{module}-{产物}-{version}；business_system 必填（多业务系统项目）；platform 来自 §0.0 冻结映射"

  # 功能编号体系（贯穿所有产物，用于跨文档追溯）
  function_numbering:
    pattern: "FN-{PREFIX}-{系统缩写}-{终端缩码}-{nnn}"
    rule: "V3.0.0方案B：每个业务系统×终端组合有独立FN编号；用例说明、状态机触发操作、业务操作矩阵、交互卡、handoff标注全部引用同一FN"
    system_abbreviations:
      OPS: "运营平台"
      SHP: "电商平台"
      LIV: "直播平台"
      SOC: "社群平台"
      DAS: "数据大屏"
      TOL: "工具"
    terminal_codes:
      PC: "PC端"
      APP: "APP端"
      MINI: "小程序端"
      H5: "H5端"
      PAD: "平板端"
      DSK: "桌面端"
    examples:
      - "FN-SHP-PC-001 商品列表（电商平台PC端）"
      - "FN-SHP-APP-001 商品列表（电商平台APP端）"
      - "FN-OPS-PC-001 商品审核（运营平台PC端）"

  # 业务泳道图标准（产品经理方法论第一环产物）
  swimlane_diagram:
    required: true
    dimensions: [业务阶段, 角色, 部门, 关键动作, 输入信息, 输出信息]
    rule: "必须识别跨角色/跨部门协作边界；标注每个动作归属的部门与角色；作为业务流程与信息流的骨架"

  # 信息主体清单（信息流转图依赖）
  info_entities:
    required: true
    fields: [信息主体名, 归属业务系统, 生产者(角色/动作), 消费者(角色/动作), 依赖的前置动作]
    rule: "列出业务流程中流转的所有信息主体（如订单/客户/资质/工单），明确谁生产、谁消费、依赖哪个业务动作"

  # 跨系统信息流转图标准
  cross_system_info_flow:
    required: true
    rule: "多业务系统时必画端到端信息流转图：标注信息在 systems 间的同步源/同步目标、同步触发动作(FN)、失败兜底；状态机跨系统同步须标注同步约束"

  # 业务操作矩阵（四图浓缩，V5.0当前术语）
  business_operation_matrix:
    required: true
    description: |
      四图浓缩产物（V3.0.0从早期矩阵升级而来，V5.0统一为"业务操作矩阵"）。
      四图浓缩：业务泳道图(提取角色) + 信息流转图(提取信息可见性)
              + 业务流程图(提取操作和时序) + 状态机(提取状态)
              → 浓缩为一个矩阵 + 操作详情卡
    matrix_structure:
      rows: "角色（来自泳道图）"
      columns: "状态（来自状态机）"
      cells: "操作（来自流程图）✅=可操作 ❌=不可操作 —=无此操作"
      cell_content: "信息可见性（来自信息流图）+ 时序约束（来自流程图+时序图）"
    operation_detail_card:
      required: true
      fields: [入口, 前置条件, 信息可见, 后置动作, 异常处理]
      rule: "每个✅单元格挂载一张操作详情卡，给设计师作为交互行为清单的输入"
    designer_guidance:
      rows_to_design: "角色权限差异设计（不同角色登录看到不同界面）"
      columns_to_design: "页面状态变化设计（每个状态下页面长什么样）"
      cells_to_design: "按钮入口和可用性设计（disabled/enabled逻辑）"
      detail_card_to_design: "交互行为清单（入口/前置/后置/异常=交互卡五段）"
    legacy_name: "raci_state_matrix（已升级）"

  # 五大业务产物深度还原标准（V3.3.0新增，引用scene-learning-standards.yml）
  five_business_artifacts_deep_restoration:
    standard: ".codebuddy/knowledge/common/scene-learning-standards.yml"
    description: |
      V3.3.0新增：learn-project V7.0.0五大业务产物深度还原标准。
      AI定位为"深度还原器"——从原文碎片交叉印证还原原本就存在的完整需求。
      双态标注：📗显式照录 + 🟡隐式挖掘还原(≥2处依据交叉印证)。
    artifacts:
      business_scene:
        deep_requirements:
          - "显式场景提取（从标题/菜单/按钮组）"
          - "🟡隐式场景挖掘（页面跳转链中间态/按钮组功能聚类/状态转换触发动作/角色权限交叉点4维度）"
          - "场景编排图谱（顺序/并行/互斥/循环/依赖5种编排关系）"
          - "场景闭环验证（入口/出口/状态/数据四闭环）"
      business_flow:
        deep_requirements:
          - "Happy Path还原（从原文分散操作步骤还原主干流程）"
          - "分支流程还原（从原文条件判断还原分支）"
          - "异常路径矩阵（从校验规则/前置条件/错误提示/按钮禁用/状态约束5种来源挖掘，非AI推导）"
          - "跨页面衔接点还原"
      business_information:
        deep_requirements:
          - "信息主体完整字段还原（从表单/列表/详情字段集合）"
          - "信息生命周期追踪（CRUD-L：创建/读取/更新/归档/删除）"
          - "跨场景信息血缘图（信息主体→产生场景→消费场景）"
          - "信息一致性校验（字段类型/约束/状态跨场景一致性）"
      business_state_machine:
        deep_requirements:
          - "显式状态提取（从状态标签/筛选项/状态列）"
          - "🟡隐式状态挖掘（按钮置灰条件/操作前置条件/页面跳转条件/字段值变化推导）"
          - "状态机完整性分析（可达性分析+转换完整性，识别不可达/死状态/缺失转换）"
          - "非法转换挖掘（从原文禁止性描述还原）"
      business_operation_matrix:
        deep_requirements:
          - "四维交叉验证矩阵（角色×状态×操作×数据）"
          - "缺口分析（角色×状态覆盖/操作×状态覆盖/数据×角色覆盖）"
          - "操作详情卡还原（入口/前置/信息可见/后置/异常）"
    mining_rule: "所有🟡隐式挖掘必须附≥2处原文依据交叉印证，无依据=推测=违规。挖掘的是原本就存在但分散的需求，不是AI创造的。"

  # 系统类型声明（V3.0.0新增，PRD元信息必须包含）
  system_declaration:
    required: true
    description: |
      BA在需求分析第一步识别系统类型，写入PRD元信息。
      BA只声明类型和密度，不决定栅格和设计语言（由设计师决定）。
    fields:
      backends: "业务后端类型（11类选N）"
      frontends: "业务前端类型（5类选N）"
      terminals: "运行终端（7种+H5选N）"
      density: "信息密度倾向（high/low/ultra_high）"
      visual_design_required: "是否涉及品牌VI/海报/活动主视觉（BA询问用户后标记）"
    backend_types: [商家业务后台, 租户业务后台, 内容运营后台, 业务中台, 规则引擎, 运营业务后台, OA系统, 进销存, ERP, 项目管理, 直播推流端, 工具]
    frontend_types: [B2C电商平台, 直播电商平台, 社群平台, 社交平台, 数据大屏]
    terminal_types: [PC, 小程序, 安卓, 苹果, 三星, 华为, 小米, H5]
    ba_responsibility_boundary:
      ba_decides: [业务后端类型, 业务前端类型, 运行终端, 信息密度, 视觉设计是否需要]
      designer_decides: [栅格系统, Gutter/Margin/Grid_Unit, 设计语言, 断点定义, 组件变体]

  # PRD功能需求章节结构（V3.0.0：按业务系统×终端组织）
  prd_chapter_structure:
    description: |
      V3.0.0变更：PRD功能需求章节不再按"模块"组织，改为按"业务系统×终端"组织。
      因为同一功能在不同终端上呈现完全不同，设计师可直接按章节定位设计范围。
    structure_example: |
      §9 功能需求列表与用例
        §9.1 运营平台（PC端）
          §9.1.1 商品管理
            FN-OPS-PC-001 商品审核 [运行终端: PC]
              UC-OPS-PC-001 运营人员审核商品
          §9.1.2 订单管理
            FN-OPS-PC-002 订单查询 [运行终端: PC]
        §9.2 电商平台（PC端）
          §9.2.1 商品浏览
            FN-SHP-PC-001 商品列表 [运行终端: PC]
        §9.3 电商平台（APP端）
          §9.3.1 商品浏览
            FN-SHP-APP-001 商品列表 [运行终端: APP]
        §9.4 电商平台（小程序端）
          §9.4.1 商品浏览
            FN-SHP-MINI-001 商品列表 [运行终端: MINI]

  # 用例标准模板（ER关系与用例产物强制结构）
  use_case_template:
    fields:
      - name: "功能名称"
      - name: "功能编号(FN)"
      - name: "所属模块"
      - name: "所属业务系统"
      - name: "运行终端（V3.0.0新增）"
      - name: "信息密度（V3.0.0新增，high/low/ultra_high）"
      - name: "所属业务流程"
      - name: "用户故事"
      - name: "用例基本描述"
      - name: "前置条件(权限/登录/当前状态)"
      - name: "主要操作流(分步编号，完成主操作)"
      - name: "次要操作流(主流程中涉及的分支流程)"
      - name: "异常(字段校验/条件不符/超时/并发)"
      - name: "后置条件(跳转页面/打开对话框/营销等业务数据 新增·更新·删除·更新状态，及可能影响的多模块数据)"
      - name: "数据范围(R/W)（V5.1.1新增：标注本UC读取和写入的数据实体）"
      - name: "关联UC（V5.1.1新增：标注与本UC有关联的其他UC编号）"
    rule: |
      异常流至少3种；每条异常须有明确用户提示文案；后置条件须显式列出跨模块数据影响；
      V3.0.0：运行终端和信息密度为必填字段；
      V5.1.1根因修复：每个UC必须包含六段标准格式，缺任一段视为PRD不合格：
        ① 前置条件 ② 基本流程(分步编号+[手动]/[系统自动]/[事件驱动]标注) ③ 备选流程 ④ 数据范围(R/W) ⑤ 后置条件 ⑥ 关联UC
      token优化不可压缩用例说明内容——优化只针对加载策略和冗余注释，不针对用例说明/验收标准/状态机等核心内容。

  # 状态机标准（带约束，非仅状态列表）
  state_machine:
    required: true
    fields: [实体, 状态列表, 合法转换(从→到→触发FN→操作者角色), 非法转换(从→到→原因)]
    rule: "每个合法转换必须绑定触发 FN 与操作者角色；非法转换须标注原因；与 business_operation_matrix 双向一致（V3.0.0：raci_state_matrix 已废弃，统一使用 business_operation_matrix）"
    chinese_naming_rule: |
      V5.1.3新增：状态机节点必须使用中文状态名，不可使用英文原名。
      英文enum值保留在数据实体(ENT)的status字段定义中，但状态机图和状态过渡操作表必须用中文。
      示例：pending→待处理, processing→处理中, completed→已完成, failed→已失败。
      状态过渡操作表的"当前状态"和"目标状态"列也必须使用中文。
      原因：状态机是给人看的业务文档，中文状态名可读性远高于英文。

  # 文档同步铁律（全类型需求 + 未 close 补齐）
  sync_rules:
    - "无论新增/迭代/变更/修复，凡涉及需求变动，受影响模块的 REQ 产物必须同步更新（修复类型至少同步受影响模块产物）"
    - "当前立项存在未 close 需求流时，BA 开工新版本前须扫描历史版本 REQ 产物缺口并补齐，禁止只产局部"
    - "REQ 产物变更后，下游 UX/Arch/FD/handoff 标注须以最新 REQ 版本为准重对齐"

  # ============================================================
  # v2.0.0 增强（2026-07-15 用户裁定，提炼自 AI-SCRM 实践，全局生效）
  # 来源：projects/AI-SCRM/.codebuddy/knowledge/common/ba-output-standard.yml
  #       + handoff-spec.yml + incidents(INC-005/INC-006)
  # ============================================================

  # 文档组织模式（单一事实源铁律①，全局开关）
  document_model:
    single_document:
      enabled: true
      rule: >
        每个产品版本（如 v1.1.0）只允许产出 ONE 份主需求文档，落库于
        docs/01-requirements/，内部强逻辑串联。禁止按端口/模块拆分多份
        「场景需求 / 流程闭环 / 业务操作矩阵 / 信息流 / 时序流 / ER / 状态机」兄弟文档。
      conflict_with: "分散产物体系模型（docs/01-requirements/plan/{version}/{platforms}/{module}/）"
      decision: >
        二者互斥。采用单文档模式时，产物体系合并为单文件章节（背景→目标→范围→复用→
        BO/BG→用户故事→五类图→功能用例+页面级用例→规则→配置CONFIG→实体→指标METRIC→验收→接口→清单→深度分析摘要）；
        V3.2.0新增CONFIG和METRIC章节。requirement-flow §6 目录契约须据本开关选模式。AI-SCRM 已裁定 single_document=true。
      naming: "AI-SCRM-超级需求文档-PRD-{version}.md"

  # ============================================
  # 项目文档目录组织标准（V5.7.0新增）
  # 所有项目文档按 项目→版本→Sprint 组织
  # ============================================
  document_organization_standard:
    description: "所有项目文档按 项目→版本→Sprint 组织"
    directory_structure: |
      projects/{project}/docs/
      ├── 00-brainstorm/{topic}/confirmed/
      ├── 01-requirements/{域编号}-{域名}-PRD-v{version}.md
      ├── 02-design/设计文档-{module}-v{version}.md
      ├── 03-architecture/架构设计-{module}-v{version}.md
      ├── 04-development/
      ├── 05-test/测试报告-{module}-v{version}.md
      ├── 06-acceptance/验收报告-{module}-v{version}.md
      ├── 07-handoff/handoff报告-{module}-v{version}.md
      ├── 08-close/版本关闭报告-v{version}.md
      └── 09-versions/v{version}/（版本快照）
    naming_rules:
      prd: "{域编号}-{域名}-PRD-v{版本}.md"
      design: "设计文档-{module}-v{版本}.md"
      architecture: "架构设计-{module}-v{版本}.md"
      test: "测试报告-{module}-v{版本}.md"
      acceptance: "验收报告-{module}-v{版本}.md"
      handoff: "handoff报告-{module}-v{版本}.md"
      close: "版本关闭报告-v{版本}.md"
    version_management: "所有文档必须有版本号，版本号与Sprint版本一致"

  # HTML需求文档命名规范（V5.1.3新增）
  html_document_naming:
    rule: "close阶段生成的HTML需求文档按 {项目}-{版本}-{Sprint}.html 命名"
    format: "{项目}-{版本}-{Sprint}.html"
    examples:
      - "SAAS-v2.0.0-S3.html"
      - "SAAS-v2.0.0-S2.html"
      - "SAAS-v2.0.0-S1.html"
    path: "docs/09-versions/v{version}/prd-html/{项目}-{版本}-{Sprint}.html"
    note: "每个Sprint版本独立生成对应HTML文件（带版本信息可追溯）。同时生成index.html入口页（自动重定向到最新Sprint版本PRD），确保/prd/路径可直接访问。"

  # 编号体系（铁律②，V3.2.0新增CONFIG/METRIC编号——全链含系统缩写+终端缩码+版本维度）
  # V3.2.0变更：新增CONFIG和METRIC编号，追溯链扩展
  # V3.1.0变更：废弃方案A（FN-{PREFIX}-{NNN}），统一为方案B扩展
  #   - FN/UC/PG 含系统缩写+终端缩码（与 function_numbering 段一致）
  #   - MD/SC 含系统缩写（模块/场景跨终端，不含终端缩码）
  #   - BG/BO 含项目前缀（业务/商业目标跨系统，不含系统缩写）
  #   - ENT/BR 含系统缩写（实体/规则属于业务系统，不含终端缩码）
  #   - 新增版本维度：编号状态标记（new/inherited/modified/deprecated）
  numbering:
    version: "3.2.0"
    scheme: |
      FN-{PREFIX}-{系统缩写}-{终端缩码}-{NNN}     功能编号（如 FN-ACRM-OPS-PC-001）
      UC-{PREFIX}-{系统缩写}-{终端缩码}-{NNN}-{SS}  用例编号（如 UC-ACRM-OPS-PC-001-01）
      PG-{PREFIX}-{系统缩写}-{终端缩码}-{NNN}     页面编号（如 PG-ACRM-OPS-PC-001）
      MD-{PREFIX}-{系统缩写}-{NNN}               模块编号（如 MD-ACRM-OPS-001，跨终端）
      SC-{PREFIX}-{系统缩写}-{NNN}               场景编号（如 SC-ACRM-OPS-001，跨终端）
      ENT-{PREFIX}-{系统缩写}-{NNN}              数据实体编号（如 ENT-ACRM-OPS-001）
      BR-{PREFIX}-{系统缩写}-{NNN}               业务规则编号（如 BR-ACRM-OPS-001）
      BG-{PREFIX}-{NNN}                 业务目标编号（如 BG-ACRM-001，跨系统）
      BO-{PREFIX}-{NNN}                 商业目标编号（如 BO-ACRM-001，跨系统）
      CONFIG-{PREFIX}-{系统缩写}-{NNN}            集中配置编号（如 CONFIG-ACRM-PAY-001，V3.2.0新增）
      METRIC-{PREFIX}-{系统缩写}-{NNN}            统计指标编号（如 METRIC-ACRM-PAY-001，V3.2.0新增）
    prefix_rule: "PREFIX 为项目专属前缀（如 AI-SCRM=ACRM），所有编号均使用；PREFIX 在 PROJECT-INDEX.yml 中注册项目时指定"
    page_prefix: "PG-{PREFIX}-{系统缩写}-{终端缩码}"

    # 系统缩写定义（与 function_numbering 段一致）
    system_abbreviations:
      OPS: "运营平台"
      SHP: "电商平台"
      LIV: "直播平台"
      SOC: "社群平台"
      DAS: "数据看板"
      TOL: "工具系统"
    terminal_codes:
      PC: "PC端"
      APP: "APP端"
      MINI: "小程序端"
      H5: "H5端"
      PAD: "平板端"
      DSK: "桌面端"

    # 版本维度（V3.1.0新增）
    version_dimension:
      rule: "编号版本间不复用，但可跨版本继承"
      status_tracking:
        new: "本版本新增"
        inherited: "从上版本继承，无变更"
        modified: "从上版本继承，有变更"
        deprecated: "本版本废弃"
      traceability_matrix_column: "归属版本 + 状态(new/inherited/modified/deprecated)"

    # 追溯链：UC → FN → PG → MD → SC → BG → BO + CONFIG → BR/FN + METRIC → BG/BO
    traceability_chain:
      chain: "UC → FN → PG → MD → SC → BG → BO + CONFIG → BR/FN + METRIC → BG/BO"
      purpose: "确保从页面交互到商业价值逐层可回溯，任何需求变动都能定位到受影响的功能、页面、指标、场景和商业目标。V3.2.0新增CONFIG→BR/FN和METRIC→BG/BO关系。handoff回传依赖此链精确定位。"
      levels:
        - id: UC
          name: 用例 (Use Case)
          format: "UC-{PREFIX}-{系统缩写}-{终端缩码}-{NNN}-{SS}"
          owner: BA
          source: "功能需求 FN 的细化操作流程"
          points_to: "FN"
          example: "UC-OPS-PC-001-01 运营人员审核商品通过"
          handoff_role: "handoff交互卡的核心定位编号——每个交互卡关联唯一UC"
        - id: FN
          name: 功能 (Function)
          format: "FN-{PREFIX}-{系统缩写}-{终端缩码}-{NNN}"
          owner: BA
          source: "业务流程中的原子操作"
          points_to: "PG / 状态机 / 业务操作矩阵"
          example: "FN-OPS-PC-001 商品审核"
          handoff_role: "handoff标注的按钮级定位——每个按钮关联唯一FN"
        - id: PG
          name: 页面 (Page)
          format: "PG-{PREFIX}-{系统缩写}-{终端缩码}-{NNN}"
          owner: UX + BA
          source: "高保真原型页面"
          points_to: "MD / 业务流程节点"
          example: "PG-OPS-PC-001 商品审核页"
          handoff_role: "handoff标注的页面级定位——每个页面关联唯一PG"
        - id: MD
          name: 模块 (Module)
          format: "MD-{PREFIX}-{系统缩写}-{NNN}"
          owner: BA / Arch
          source: "业务子系统或功能模块（跨终端）"
          points_to: "SC / 业务流程"
          example: "MD-OPS-001 商品管理模块"
        - id: SC
          name: 场景 (Scenario)
          format: "SC-{PREFIX}-{系统缩写}-{NNN}"
          owner: BA
          source: "E2E 验收场景（跨终端）"
          points_to: "BG / 用户旅程节点"
          example: "SC-OPS-001 商品审核并上架"
        - id: BG
          name: 业务目标 (Business Goal)
          format: "BG-{PREFIX}-{NNN}"
          owner: PM / PO / 业务方
          source: "产品阶段性目标（跨系统）"
          points_to: "BO"
          example: "BG-ACRM-001 提升客户接入效率 30%"
        - id: BO
          name: 商业目标 (Business Objective)
          format: "BO-{PREFIX}-{NNN}"
          owner: 业务方 / 管理层 / PO
          source: "公司战略或商业机会（跨系统）"
          points_to: "-"
          example: "BO-ACRM-001 私域客户规模增长"

      rules:
        - "每个 UC 必须归属唯一父 FN（UC继承FN序号段：UC-{系统}-{终端}-{FN序号}-{子序号}）"
        - "每个 FN 必须关联至少一个 PG（如跨页面需标注全部PG编号）"
        - "每个 PG 必须归属唯一 MD"
        - "每个 MD 必须归属唯一业务系统（系统缩写）"
        - "每个 SC 必须覆盖一条或多条 BG，并在验收标准中可验证"
        - "每条 BG 必须反向上级 BO"
        - "编号一旦发布不得复用；废弃编号须在 TRACEABILITY_MATRIX.md 中标记 deprecated"
        - "版本间编号继承时须标记状态（new/inherited/modified/deprecated）"
        - "FN/UC/PG 含终端缩码——同一功能在不同终端有不同FN编号（如FN-OPS-PC-001和FN-OPS-APP-001）"
        - "MD/SC/ENT/BR 不含终端缩码——模块/场景/实体/规则跨终端共享"
        - "BG/BO 不含系统缩写——业务/商业目标跨系统共享，使用项目前缀"

    # 可追溯性矩阵（每个项目一份，随 docs/ 跟项目走）
    traceability_matrix:
      location: "docs/TRACEABILITY_MATRIX.md"
      required: true
      update_trigger: ["/init 完成后", "/feedback 回流后", "PRD 版本升级后", "/close 前"]
      columns:
        - "BO 编号 / 名称"
        - "BG 编号 / 名称"
        - "SC 编号 / 名称"
        - "MD 编号 / 名称"
        - "PG 编号 / 名称"
        - "FN 编号 / 名称"
        - "UC 编号 / 名称"
        - "状态（已实现 / 待实现 / 变更中 / 废弃）"
        - "归属版本"
      rule: "矩阵必须能双向查询：从 BO 向下找到 UC，从 UC 向上回溯到 BO"

  # 五类图位置铁律（铁律⑤，v2 调整：在用户故事下方）
  five_diagrams:
    mandatory: true
    position: "用户故事（§八）之后、功能需求（§九/§十）之前，先总后分"
    list:
      - 业务流程图(flowchart)
      - 信息流转图(跨模块 flowchart)
      - 状态机(stateDiagram-v2) + 状态过渡操作表
      - 业务时序图(sequenceDiagram)
      - 三方接口时序图(含接口路径)
    format: mermaid
    state_transition_table:
      required: true
      columns: [当前状态, 触发操作, 目标状态, 操作者, 前置约束, 后置动作]
    coverage_rule: "图中每个节点须映射到至少一个 FN；非主线 FN 至少在主流程图中出现一次"
    scene_orchestration_graph:
      required: true
      description: "V3.3.0新增：场景编排图谱（引用scene-learning-standards.yml），还原场景间编排关系"
      relation_types: [顺序(sequential), 并行(parallel), 互斥(exclusive), 循环(loop), 依赖(dependency)]
      rule: "从原文跳转链/后置条件→前置条件/条件分支交叉印证还原场景编排关系，标注📗显式或🟡隐式挖掘+依据链"

  # 用例标准模板强化（铁律④ + ④a + ④b，v2）
  use_case_template_v2:
    # ④a：fields 必须含「所属页面」
    mandatory_fields_add: [所属页面(PG-{PREFIX}-{系统缩写}-{终端缩码})]
    # ④b：逐原子操作拆分，禁止吞并（V3.4.0新增，V3.6.0强化为铁律级约束）
    subfunction_split:
      enabled: true
      iron_rule: "BA-28: 每个页面的每个操作必须有独立UC，禁止吞并。违反此规则的PRD视为不合格。"
      forbid_merging: "禁止把『客户库管理（导入/查询/分层/标签）』写成单个用例；父 FN 仅作聚合标题"
      required_sub_uc_per_page:
        list_operations: [搜索, 列表排序, 筛选, 分页, 查看, 导出, 列头自定义排序]
        write_operations: [新增, 编辑, 删除, 导入, 禁用, 启用, 拉黑]
        batch_operations: [批量启用, 批量禁用, 批量删除, 批量打标签, 批量分配]
        row_operations: [行内查看, 行内编辑, 行内删除, 行内禁用启用, 行内跳转详情]
        form_operations: [表单新建, 表单编辑, 表单审批提交, 表单引用数据选择, 表单校验规则]
        navigation_operations: [页面跳转, Tab切换, 弹窗打开/关闭, 返回]
      naming: "子功能 UC 继承父 FN 序号段，如 FN-AUDIT-001 下 UC-AUDIT-001-01 搜索、…-14 分层打标签"
      completeness_check: "每个页面必须覆盖list+write+row三类操作（batch/form/navigation按页面实际有则必拆）"

    # ④b-2：完整操作类型分类标准（V5.6.0新增——场景分析阶段输出）
    operation_type_catalog:
      description: |
        V5.6.0新增——作为专业业务产品经理，在场景分析阶段（§2/§2.5）就必须识别每个场景涉及哪些操作类型。
        操作类型不是用例设计时才考虑，而是场景分析时就要输出"场景×操作类型矩阵"。
        用例设计（§5）基于场景分析的操作类型矩阵来编写UC，确保不遗漏。
      operation_categories:
        list_operations:
          name: "列表操作"
          types: [关键词搜索, 高级搜索(多条件组合), 列表排序, 列头自定义排序, 筛选, 分页(翻页+每页条数), 查看列表, 导出, 刷新, 列表数据加载]
          must_have: "所有管理列表页面必含：搜索+排序+分页+查看（至少4种）"
        write_operations:
          name: "写入操作"
          types: [新增, 编辑, 删除, 导入, 禁用, 启用, 拉黑, 复制, 批量导入]
          must_have: "有CRUD的页面必含：新增+编辑+删除（至少3种）"
        row_operations:
          name: "行内操作"
          types: [行内查看详情, 行内编辑, 行内删除, 行内禁用启用, 行内跳转详情, 行内复制, 行内审核]
          must_have: "有列表的页面必含：行内查看（至少1种）"
        form_operations:
          name: "表单操作"
          types: [表单新建, 表单编辑, 表单审批提交, 表单引用数据选择, 表单校验规则, 表单字段联动, 表单草稿保存, 表单文件上传, 表单富文本编辑]
          must_have: "有表单的页面必含：表单新建或编辑+引用数据选择+校验规则（至少3种）"
          required_fields: "表单UC必须含：字段清单(名|类型|必填|引用源|校验|默认值)+引用关系+提交流程+校验规则"
        batch_operations:
          name: "批量操作"
          types: [批量启用, 批量禁用, 批量删除, 批量打标签, 批量分配, 批量导出, 全选取消全选]
          must_have: "有批量选择框的页面必含（无批量选择框则无）"
        navigation_operations:
          name: "导航操作"
          types: [页面跳转, Tab切换, 弹窗打开关闭, 返回上一页, 面包屑导航, 侧边栏菜单切换]
          must_have: "所有页面必含：页面跳转或Tab切换（至少1种）"
        state_operations:
          name: "状态操作"
          types: [状态切换(启用↔禁用), 审核操作(通过/驳回), 发布下架, 锁定解锁, 归档]
          must_have: "有状态机的实体必含"
        interaction_operations:
          name: "交互操作"
          types: [拖拽排序, 树形展开折叠, 搜索建议联想, 实时预览, 图表交互(缩放/筛选/下钻), 富文本编辑]
          must_have: "按页面实际功能有则必拆"
        data_operations:
          name: "数据操作"
          types: [数据导入导出, 数据同步, 数据清空重置, 数据备份, 数据迁移]
          must_have: "有数据管理需求的页面必含"
        communication_operations:
          name: "通信操作"
          types: [发送通知, 发送消息, 分享, 邀请, 举报投诉]
          must_have: "有通信需求的页面必含"
      total_types: 69
      output_standard: "场景分析阶段必须输出'场景×操作类型矩阵'，作为用例设计的输入"

    # ④b-3：场景操作类型矩阵输出标准（V5.6.0新增）
    scene_operation_matrix:
      description: |
        V5.6.0新增——场景分析阶段（§2/§2.5）必须输出的操作类型矩阵。
        在用例设计之前，BA必须为每个场景/页面识别涉及哪些操作类型。
        矩阵格式：场景×操作类型→是否有该操作。
      output_format: |
        ## 场景×操作类型矩阵
        | 场景/页面 | 列表操作 | 写入操作 | 行内操作 | 表单操作 | 批量操作 | 导航操作 | 状态操作 | 交互操作 | 数据操作 | 通信操作 |
        |-----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|
        | 租户审查开关 | 搜索/排序/分页/查看 | — | 进入中控 | — | — | 跳转 | 开关切换 | — | — | — |
        | 中控室审查Tab | 搜索/排序/刷新/查看 | — | 记录/断流/忽略 | — | — | Tab切换 | 处置状态 | 擦音模式切换 | — | 告警推送 |
        | 敏感词库管理 | 搜索/筛选/排序/分页/查看 | 新增/编辑/禁用/导入 | 编辑/禁用 | 新建/编辑+引用分类+校验 | 批量禁用/删除 | 弹窗/Tab切换 | 启用禁用 | — | 同步腾讯云 | — |
        | ... | ... | ... | ... | ... | ... | ... | ... | ... | ... | ... |
      rule: "矩阵中标记'有'的操作必须在§5用例设计中编写独立UC，标记'—'的可跳过"

    # ④b-4：用例追溯链标准（V5.6.0新增——单一事实源）
    use_case_traceability:
      description: |
        V5.6.0新增——用例是全流程的单一事实源。
        需求分析得出的用例→设计依据用例全面设计→架构与开发依据用例实现→测试依据用例编写场景→验收依据用例逐个验收。
        任何环节遗漏用例→返工成本巨大。
      traceability_chain:
        requirement: "场景分析→操作类型矩阵→用例设计（UC编号）"
        design: "设计阶段→每个UC必须有对应的交互设计（不能空连接）"
        development: "开发阶段→每个UC必须有对应的代码实现（不能空函数）"
        test: "测试阶段→每个UC必须有对应的测试场景（不能缺测试）"
        acceptance: "验收阶段→每个UC必须有对应的验收结果（不能跳过）"
      empty_action_rule: |
        ★空连接禁止铁律（BA-34）：
        原型中每个操作按钮必须有对应的交互实现。禁止以下情况：
        1. 按钮点击无反应（空连接/空函数）
        2. 按钮点击只弹Toast"功能开发中"
        3. 表单提交无校验/无保存
        4. 列表搜索无筛选效果
        5. 操作按钮无对应UC（用例缺失）
        违反→设计/开发/测试/验收环节全部返工。

    # ④c：表单操作标准（V3.6.0新增——表单引用数据规则）
    form_operation_standard:
      description: |
        V3.6.0新增——表单操作（新建/编辑/审批流）必须包含引用数据规则。
        表单提交类操作的UC必须描述：引用了哪些其他模块的数据、引用方式、校验规则。
      required_fields:
        - "引用数据源：表单中引用了哪些其他模块的数据（如新增敏感词时引用分类枚举）"
        - "引用方式：下拉选择/弹窗选择/自动填充/手动输入"
        - "校验规则：必填/格式/范围/唯一性/关联校验"
        - "提交类型：直接保存/审批流提交/草稿保存"
      form_uc_template: |
        表单UC必须包含：
        1. 表单字段清单（字段名|类型|必填|引用源|校验规则|默认值）
        2. 引用数据关系（引用了哪个模块的哪个实体|引用方式|级联规则）
        3. 提交流程（直接保存→成功/审批流提交→进入审批流程）
        4. 校验规则（前端校验+后端校验+关联校验）

    # ④d：HTML文档截图+用例汇总标准（V3.6.0新增）
    html_document_standard:
      description: |
        V3.6.0新增——HTML需求文档必须包含页面截图+用例汇总表格+每个用例详细描述。
        每个管理页面截一张图，图下方是该页面所有用例的汇总表格，然后是每个用例的详细描述。
      required_sections:
        - "页面截图：每个管理页面截一张实现后的真实截图（原型截图无验收价值，必须实现后截图）"
        - "用例汇总表格：该页面涉及的所有UC汇总（UC编号|用例名称|操作类型|关联FN|优先级）"
        - "用例详细描述：每个UC的完整六段（前置条件/基本流程/备选流程/数据范围/后置条件/关联UC）"
      screenshot_strategy:
        L1_page_anchor: "页面锚点截图（1张/页，带UC编号标注圆圈，覆盖搜索/排序/筛选等通用UC）"
        L2_state_increment: "状态增量截图（弹窗打开/筛选结果/按钮置灰等显著视觉变化）"
        L3_uc_closeup: "UC特写（按需，hover态/tooltip）"
      page_structure: |
        每个页面的HTML结构：
        ## {页面名称}（PG-XXX-PC-001）
        ### 页面截图
        [截图图片]
        ### 用例汇总
        | UC编号 | 用例名称 | 操作类型 | 关联FN | 优先级 |
        |--------|----------|----------|--------|--------|
        | UC-001-01 | 搜索 | 列表操作 | FN-001 | P0 |
        | UC-001-02 | 列表排序 | 列表操作 | FN-001 | P1 |
        | ... | ... | ... | ... | ... |
        ### 用例详细描述
        #### UC-001-01 搜索
        [完整六段用例描述]
        #### UC-001-02 列表排序
        [完整六段用例描述]
      naming_standard:
        html_file: "{项目缩写}-PRD-{版本}.html"
        deploy_path: "dist/{项目缩写}-PRD-{版本}.html"
        edgeone_path: "https://{域名}/{项目缩写}-PRD-{版本}.html"

  # 用例标准模板 V3（V3.4.0新增：研发友好版——让研发拿到用例就知道怎么开发）
  use_case_template_v3:
    description: |
      V3.4.0新增——研发友好用例模板。在v2基础上增加研发直接需要的字段：
      页面路由、组件名、入口路径、接口标注、状态机关联、终端信息。
      目标：研发人员拿到用例后，不需要翻接口文档、不需要找页面归属、不需要猜入口。
    new_fields:
      - name: "页面路由"
        desc: "具体路由路径（如 /subPackages/Mall/pages/category/index），来自终端泳道图"
        required: true
      - name: "组件名"
        desc: "前端组件名（如 ProductCategory），来自设计文档PG编号"
        required: true
      - name: "入口路径"
        desc: "从哪进入此页面（表格：序号|入口|来源页面|触发操作），如 首页商城Tab→商品分类页"
        required: true
      - name: "接口标注"
        desc: "基本流程每步标注调用的API（如 GET /api/app/spu/listOfStore），研发不用翻接口文档"
        required: true
      - name: "状态机关联"
        desc: "此用例触发的状态流转（如 订单: pending→paid），无状态变更标注'无'"
        required: true
      - name: "终端信息"
        desc: "运行终端（PC/APP/H5/MP等），一目了然"
        required: true
    enhanced_sections:
      basic_flow:
        rule: "基本流程表格增加'调用接口/路由'列：步骤|类型[手动]/[系统自动]/[事件驱动]|操作|调用接口/路由|说明"
        example: |
          | 步骤 | 类型 | 操作 | 调用接口/路由 | 说明 |
          | 1 | [系统自动] | 加载商品分类树 | GET /api/app/category/tree | 进入页面时自动触发 |
          | 2 | [系统自动] | 加载门店商品列表 | GET /api/app/spu/listOfStore | 按分类加载 |
          | 3 | [手动] | 浏览商品列表 | — | 用户上下滚动 |
          | 4 | [手动] | 点击商品卡片 | — | 选择商品 |
          | 5 | [系统自动] | 跳转商品详情页 | navigateTo: goods-detail | 携带spuId |
      alternative_flow:
        rule: "备选流程表格增加'关联UC'列：分支|触发条件|处理方式|关联UC"
      data_scope:
        rule: "数据范围表格增加'接口'列：数据实体|操作(R/W)|接口|说明"

  # ============================================
  # 用例细节颗粒度标准（V3.5.0新增——从"积分抵现"用例提炼）
  # ============================================
  use_case_granularity_standard:
    description: |
      V3.5.0新增——用例细节颗粒度分级标准。
      V3.5.1增强——14维度按需选择+从"文档标准"前移到"分析过程"。
      V3.5.2增强——14维度在分析过程中识别（非文档阶段才思考）：
        Layer1.3 AI多视角维度识别（模拟专家视角）→ 
        §2.5 专家补盲（验证+补充AI遗漏）→ 
        §3/§3.5/§3.8 三阶段增量更新 → 
        §5 用例设计时基于已识别维度结构化输出。
      本标准作为"输出格式参考"——维度在分析过程中识别，
      此标准定义各维度的结构和格式，供§5用例设计时参考输出。
      目标：让研发拿到用例后不需要追问"这个参数取值范围是多少？""退款怎么处理？""精度怎么算？"。

    # ---- 颗粒度分级 ----
    granularity_levels:
      - level: 1
        name: "简单用例"
        applicability: "CRUD操作、列表查看、详情展示等无复杂业务规则的用例"
        required_sections: "标准六段（前置条件+基本流程+备选流程+数据范围+后置条件+关联UC）"
        example: "查看客户列表、编辑客户信息、删除标签"

      - level: 2
        name: "中等用例"
        applicability: "有配置项、有业务规则、有多条件组合的用例"
        required_sections: "标准六段 + 规则约束区 + 配置项矩阵"
        example: "客户分组规则设置、商品上下架、优惠券创建"

      - level: 3
        name: "复杂用例"
        applicability: "有计算算法、有逆向流程（退款/回滚）、有跨模块影响、有精度规则的用例"
        required_sections: "标准六段 + 规则约束区 + 配置项矩阵 + 算法公式区 + 逆向流程区 + 跨模块影响 + 边界前瞻区"
        example: "积分抵现规则设置、订单退款、分佣计算、库存扣减"

    # ---- 各维度定义 ----
    dimensions:

      # 维度1：规则约束区（Level 2+必须）
      rule_constraints:
        name: "规则约束区"
        required_level: 2
        description: "明确参数的取值约束、格式约束、枚举值、互斥规则"
        structure: |
          规则约束：
            参数约束：
              - 参数名 | 类型 | 取值范围 | 格式 | 默认值 | 约束说明
            枚举值：
              - 枚举项 | 可选值 | 每个值的行为描述
            互斥规则：
              - 规则名 | 互斥条件 | 互斥时行为
        example: |
          规则约束：
            参数约束：
              - 抵扣比例 | 整数 | >0 | X积分=1元 | 无默认值 | 必须大于0且为整数
            枚举值：
              - 开关状态 | 开启/关闭 | 开启→显示积分抵扣选项；关闭→隐藏选项，不可使用
              - 金额门槛 | 不限制/最低X元 | 不限制→有适用商品即可抵扣；最低X元→适用商品金额须≥X元
            互斥规则：
              - 抵扣上限 | "不限制"与"每笔最多抵扣"互斥 | 只能选一种

      # 维度2：配置项矩阵（Level 2+必须）
      config_matrix:
        name: "配置项矩阵"
        required_level: 2
        description: "开关×参数×规则的有效组合矩阵，每种组合的行为描述"
        structure: |
          配置项矩阵：
            | 开关 | 门槛 | 上限 | 适用商品 | 默认选择 | 组合行为描述 |
            | 开启 | 不限制 | 不限制 | 全部 | 是 | 下单自动选积分抵扣，可抵扣全部商品金额 |
            | 开启 | 最低100元 | 不限制 | 指定商品 | 否 | 须手动选，适用商品≥100元才可用 |
            | 关闭 | — | — | — | — | 不显示积分抵扣选项 |

      # 维度3：算法公式区（Level 3必须）
      algorithm_formula:
        name: "算法公式区"
        required_level: 3
        description: "精确的计算公式、精度规则、舍入规则、不同场景的精度差异、计算示例"
        structure: |
          算法公式：
            公式定义：
              - 计算场景 | 公式 | 说明
            精度规则：
              - 场景 | 精度规则 | 原因
            计算示例：
              - 输入 | 计算过程 | 输出 | 精度规则应用
        example: |
          算法公式：
            公式定义：
              - 系统收积分 | 可抵扣金额×抵扣比例=所需积分 | 积分只能取整
              - 用户花积分 | 用户积分÷抵扣比例=可抵扣金额 | 金额保留两位小数
            精度规则：
              - 系统收积分（算需要多少积分） | 只入不舍（向上取整） | 确保系统收够积分
              - 用户花积分（算能抵多少元） | 只舍不入（向下取整） | 确保用户不多抵
              - 退还积分比例计算 | 保留两位小数，第三位直接舍弃 | 统一精度
            计算示例：
              - "订单最多抵扣3.31元，比例10积分=1元" | 3.31×10=33.1积分 | 34积分（只入不舍）
              - "用户有14积分，比例10积分=1元" | 14÷10=1.4元 | 1.40元（只舍不入）
              - "退款商品50元，参与退款商品总额200元，总抵扣积分34" | 50÷200=0.25, 0.25×34=8.5 | 8积分（舍弃小数）

      # 维度4：逆向流程区（Level 3必须）
      reverse_flow:
        name: "逆向流程区"
        required_level: 3
        description: "退款/取消/回滚等逆向操作的处理规则，整单退vs部分退的算法差异"
        structure: |
          逆向流程：
            整单退：
              - 触发条件 | 处理规则 | 退还算法
            部分退：
              - 触发条件 | 处理规则 | 退还算法 | 边界处理
            不可退场景：
              - 场景 | 原因 | 处理方式
        example: |
          逆向流程：
            整单退：
              - 整单退款 | 全部抵扣积分退还 | 退还积分=总抵扣积分
            部分退：
              - 退款商品参与了积分抵扣 | 按比例退还积分 | 比例=退款商品金额÷参与退款全部商品金额；退还积分=比例×总抵扣积分（保留两位小数，第三位舍弃）；最后一个抵扣商品退款用减法计算（总抵扣积分-已退积分）
            边界处理：
              - 最后一笔退款 | 用减法计算而非乘法 | 避免精度累积误差
              - 不适用商品退款 | 不退还积分 | 不适用商品未参与抵扣

      # 维度5：跨模块影响（Level 3必须）
      cross_module_impact:
        name: "跨模块影响"
        required_level: 3
        description: "本用例对其他业务模块的影响，影响方式（数据流/状态/规则）"
        structure: |
          跨模块影响：
            - 影响模块 | 影响方式 | 联动行为描述
        example: |
          跨模块影响：
            - 分佣模块 | 规则影响 | 不参与分佣→定义为不分佣订单；参与分佣→分佣金额扣除积分抵扣部分，只对实际支付部分分佣
            - 退款模块 | 数据流影响 | 退款时需调用积分退还逻辑
            - 积分账户模块 | 状态影响 | 抵扣时扣减积分，退款时回加积分

      # 维度6：边界与前瞻区（Level 3必须）
      boundary_foresee:
        name: "边界与前瞻区"
        required_level: 3
        description: "当前版本不支持但未来可能需要的场景，需要预留的设计空间"
        structure: |
          边界与前瞻：
            当前版本限制：
              - 限制项 | 原因
            未来扩展预留：
              - 扩展场景 | 需要预留的设计空间 | 影响评估
        example: |
          边界与前瞻：
            当前版本限制：
              - 仅支持整单退款 | 部分退款逻辑未实现
            未来扩展预留：
              - 部分商品退款 | 算法已设计（比例退还），数据模型需记录每件商品的抵扣积分分摊 | 改动集中在退款模块+积分账户模块

      # ========== C. 状态与时效类（V3.5.1新增——积分有效期举例提炼）==========

      # 维度7：状态依赖区（新增）
      state_dependency:
        name: "状态依赖区"
        trigger: "计算起点依赖状态变化时（如冻结→解冻）"
        description: "状态变化影响计算起点，不同状态下的行为差异"
        structure: |
          状态依赖：
            状态流转：状态A → 状态B → ...
            计算起点规则：
              - 状态 | 计算起点 | 说明
            各状态行为：
              - 状态 | 可执行操作 | 不可执行操作
        example: |
          状态依赖（积分有效期举例）：
            状态流转：获得积分(冻结) → 解冻(可用) → 消耗(扣减) → 过期(失效)
            计算起点规则：
              - 冻结状态 | 不计算有效期 | 冻结期不算
              - 解冻状态 | 从解冻时间开始计算 | 消费积分以解冻时间计算
            各状态行为：
              - 冻结 | — | 不可消耗、不可抵扣
              - 解冻 | 可消耗、可抵扣 | —
              - 过期 | — | 不可消耗、不可抵扣

      # 维度8：时效计算区（新增）
      time_calculation:
        name: "时效计算区"
        trigger: "涉及时间相关的有效期/过期/规则切换时"
        description: "时效计算方式、规则切换生效逻辑、退回按最新规则、数据粒度"
        structure: |
          时效计算：
            计算方式：
              - 方式 | 计算公式 | 示例
            规则切换生效：
              - 切换前积分 | 按旧规则 | 不变
              - 切换后新积分 | 按新规则 | 从获得时间开始按新规则
              - 退回积分 | 按最新规则 | 退回后按当前最新规则入库
            数据粒度：
              - 记录方式 | 说明
        example: |
          时效计算（积分有效期举例）：
            计算方式：
              - 永久有效 | 无失效日期 | —
              - 获得后X天 | 获得时间+X天=失效时间 | 1号获得+90天=91号失效
              - 固定年月日 | 获得时间+X年/X月/X日 | 年1-5/月1-36/日1-365
            规则切换生效：
              - 切换前积分 | 按旧规则 | 如永久有效→不变
              - 切换后新积分 | 按新规则 | 如改为1年→新获得的1年后失效
              - 退回积分 | 按最新规则 | 退款退回的积分按当前最新有效期入库（可能与原积分有效期不同）
            数据粒度：
              - 单笔维度 | 每笔积分独立记录有效期 | 一个用户可存在多种不同有效期

      # 维度9：消耗策略区（新增）
      consumption_strategy:
        name: "消耗策略区"
        trigger: "涉及资源消耗优先级/部分使用时"
        description: "消耗优先级、部分使用/部分过期的处理"
        structure: |
          消耗策略：
            消耗优先级：
              - 策略 | 排序规则 | 说明
            部分使用：
              - 场景 | 处理方式
            部分过期：
              - 场景 | 处理方式
        example: |
          消耗策略（积分有效期举例）：
            消耗优先级：
              - 先进先出 | 按有效期排序，优先使用即将失效的积分 | 确保用户不损失即将过期的积分
            部分使用：
              - 单笔积分部分消耗 | 剩余部分保留原有效期 | 如100积分用30，剩70积分有效期不变
            部分过期：
              - 部分使用后剩余过期 | 过期部分清除，已使用部分不变 | 如100积分用30，剩70过期→清除70

      # 维度10：上限控制区（新增）
      limit_control:
        name: "上限控制区"
        trigger: "涉及额度/次数/每日上限时"
        description: "上限类型、超出处理、判断时机、排除规则"
        structure: |
          上限控制：
            上限类型：
              - 类型 | 规则 | 说明
            超出处理：
              - 场景 | 处理方式
            判断时机：
              - 时机 | 说明
            排除规则：
              - 排除项 | 原因
        example: |
          上限控制（积分每日上限举例）：
            上限类型：
              - 无上限 | 不限制 | 完成任务即可获得
              - 单用户每天最多XX积分 | 每日累计上限 | 控制获得速度
            超出处理：
              - 单次发放超出上限 | 允许超出发放 | 如上限100，已获98，本次4积分→正常发放→累计102
              - 下次发放 | 不再发放 | 达到上限后不再发放
            判断时机：
              - 发放时判断 | 完成任务发放积分时检查
            排除规则：
              - 消费任务积分 | 不受每日上限限制 | 消费积分只要完成正常发放

      # ========== B+ 计算增强类（V3.5.1新增——分佣举例提炼）==========

      # 维度11：金额计算链区（新增）
      amount_chain:
        name: "金额计算链区"
        trigger: "涉及多层金额扣减/分摊时"
        description: "金额的层层扣减计算链，每一步的扣减/增加规则"
        structure: |
          金额计算链：
            计算步骤（按顺序）：
              - 步骤 | 计算方式 | 说明
            优惠分摊规则：
              - 分摊场景 | 分摊方式
        example: |
          金额计算链（分佣举例）：
            计算步骤：
              1. 商品优惠前总金额 = Σ(销售价×数量)
              2. 优惠分摊 = 优惠券命中多商品时按比例分摊（商品金额/总金额×优惠金额）
              3. 商品优惠后总金额 = 优惠前-优惠金额
              4. 订单实付金额 = 优惠后+运费
              5. 实际到账金额 = 实付-支付手续费
              6. 可分佣金额 = 到账-运费（运费不参与分佣）
              7. 各角色分佣 = 可分佣金额×比例（最后一个用减法）

      # 维度12：多角色分配区（新增）
      multi_role_allocation:
        name: "多角色分配区"
        trigger: "涉及多角色按比例/固定金额分配时"
        description: "分配方式、角色清单、分配模式"
        structure: |
          多角色分配：
            分配方式 | 按比例/固定金额/混合
            角色清单：
              - 角色 | 分配比例/金额 | 分配顺序 | 备注
            分配模式：
              - 模式名 | 参与角色 | 不参与角色
        example: |
          多角色分配（分佣举例）：
            分配方式 | 按比例分佣
            角色清单：
              - 店员/店长/门店代理员 | 50% | 第1 | 业绩归属跟店员/店长
              - 上级代理 | 30% | 第2 | 需开启上级代理分佣
              - 租户 | 20%（减法兜底） | 最后 | =可分佣金额-其他角色
            分配模式：
              - 分佣方式1（个人业绩分佣） | 店员/店长/代理/上级/租户/供应商 | 门店（不参与）
              - 分佣方式2（门店分销） | 门店/上级/租户/供应商 | 店员/店长个人（不参与）

      # 维度13：精度兜底区（新增——从维度3算法公式区拆出独立）
      precision_fallback:
        name: "精度兜底区"
        trigger: "涉及小数计算/舍入/多角色分配时"
        description: "舍入规则、精度差异、减法兜底"
        structure: |
          精度兜底：
            舍入规则：
              - 场景 | 规则 | 原因
            减法兜底：
              - 场景 | 兜底方式 | 原因
        example: |
          精度兜底（分佣举例）：
            舍入规则：
              - 各角色分佣金额 | 保留两位小数，第三位直接舍弃 | 不是四舍五入
            减法兜底：
              - 最后一个角色（租户） | 减法计算：可分佣金额-其他角色之和 | 避免精度累积误差

      # 维度14：提醒触发区（新增——积分有效期举例提炼）
      reminder_trigger:
        name: "提醒触发区"
        trigger: "涉及定时提醒/过期预警时"
        description: "触发条件、提醒内容、频率"
        structure: |
          提醒触发：
            触发条件：
              - 触发时机 | 说明
            提醒内容：
              - 内容项 | 说明
            提醒频率：
              - 频率 | 说明
        example: |
          提醒触发（积分有效期举例）：
            触发条件：
              - 每月X号0点 | 定时触发
              - 未来X天即将过期 | 条件筛选
            提醒内容：
              - 即将过期的积分总和 | 提醒用户及时使用
            提醒频率：
              - 每月一次 | X号0点

    # ---- 维度选择判定规则（V3.5.1改为按需选择）----
    granularity_judgment:
      description: |
        V3.5.1改为"按需选择"模式——不是所有用例都有所有维度，
        BA根据用例来自的业务流/信息流/状态流，具体用例具体分析，
        只描述用例涉及的维度。
      level_rules:
        - "用例涉及计算公式或精度规则 → Level 3"
        - "用例涉及退款/取消/回滚等逆向操作 → Level 3"
        - "用例影响其他业务模块（分佣/库存/积分等） → Level 3"
        - "用例涉及状态依赖/时效计算 → Level 3"
        - "用例涉及多角色分配/金额计算链 → Level 3"
        - "用例有3个以上配置项组合 → Level 2"
        - "用例有枚举值或互斥规则 → Level 2"
        - "用例是简单CRUD（增删改查） → Level 1"
      level_note: "一个用例可能同时满足多个条件，取最高级别。"
      dimension_selection_rules:
        description: "Level 2/3用例按以下规则选择需要描述的维度（只描述涉及的）"
        rules:
          - "有参数配置/枚举值/互斥规则 → 描述维度1规则约束区"
          - "有3+配置项可组合 → 描述维度2配置项矩阵"
          - "涉及金额/积分/数量计算 → 描述维度3算法公式区"
          - "涉及小数计算/舍入/取整 → 描述维度13精度兜底区"
          - "涉及多层金额扣减/分摊 → 描述维度11金额计算链区"
          - "涉及多角色按比例/固定金额分配 → 描述维度12多角色分配区"
          - "计算起点依赖状态变化（冻结→解冻） → 描述维度7状态依赖区"
          - "涉及时间相关有效期/过期/规则切换 → 描述维度8时效计算区"
          - "涉及资源消耗优先级/部分使用 → 描述维度9消耗策略区"
          - "涉及额度/次数/每日上限 → 描述维度10上限控制区"
          - "涉及退款/取消/回滚 → 描述维度11逆向流程区"
          - "影响其他业务模块 → 描述维度12跨模块影响"
          - "当前有限制或未来需扩展 → 描述维度13边界前瞻区"
          - "涉及定时提醒/过期预警 → 描述维度14提醒触发区"
      selection_note: |
        BA不需要全部14个维度都写——根据用例涉及的业务流/信息流/状态流，
        只选择涉及的维度描述。用例追溯来自的业务流/信息流/状态流决定了需要哪些维度。
        例如：
        - 积分抵现：涉及维度1/2/3/4(精度)/11(逆向)/12(跨模块)/13(边界) = 7个维度
        - 积分有效期：涉及维度1/7(状态)/8(时效)/9(消耗)/10(上限)/14(提醒) = 6个维度
        - 分佣计算：涉及维度3/11(金额链)/12(多角色)/13(精度兜底) = 4个维度
        - 查看客户列表：标准六段即可 = 0个额外维度

  # 三阶段闭环验证标准（V3.4.0新增）
  closure_verification:
    description: |
      V3.4.0新增——三阶段分析中每阶段的闭环验证标准。
      阶段1业务闭环：验证业务流程完整性（人/钱/货的闭环）。
      阶段2系统闭环：验证系统覆盖完整性（每个业务环节都有系统归属）。
    stage1_business_closure:
      name: "业务闭环验证（7要素）"
      elements:
        - "涉及哪些角色人？（客户/店员/店长/客服/财务/供应商...）"
        - "什么方式销售？（直销/分销/直播带货/团购/拼团...）"
        - "什么方式支付？（在线支付/货到付款/分期/余额...）"
        - "谁支付？（客户/代付人/企业账户...）"
        - "谁收款？（平台/商家/供应商...）"
        - "如何结算？（T+1/周结/月结/分账...）"
        - "结算给谁？（商家/供应商/分销商/平台抽佣...）"
      rule: "从'角色人'出发，沿'销售→支付→收款→结算'链路走一遍，每个环节都有明确的角色和方式，没有断点。"

    stage2_system_closure:
      name: "系统闭环验证（9要素）"
      elements:
        - "商品怎么创建？（在哪个系统创建？）"
        - "创建后如何展示？（在哪个系统展示？展示规则？）"
        - "客户在什么系统下单？（商城系统？直播系统？）"
        - "如何下单？（下单流程在哪个系统？）"
        - "下单后怎么支付？（交易系统？第三方支付？）"
        - "支付后如何发货？（订单系统通知？物流系统执行？）"
        - "客户如何看到？（APP查询？消息推送？）"
        - "如何售后？在哪里售后？（独立售后系统？订单系统内？）"
        - "售后如何处理？在哪个系统处理？（售后系统处理？退款到交易系统？）"
      rule: "从'商品创建'出发，沿'展示→下单→支付→发货→收货→售后'链路走一遍，每个环节都有明确的系统归属，没有系统间的断点。"

  # 三阶段泳道图规范（V3.4.0新增）
  three_stage_swimlane:
    description: |
      V3.4.0新增——三阶段分析产出三种视角的泳道图，分开独立，不是演进。
      阶段1：角色视角（已有swimlane_diagram）
      阶段2：系统视角（新增）
      阶段3：终端视角（新增）
    stage1_role_swimlane:
      reference: "swimlane_diagram（已有，按角色/部门分泳道）"
      purpose: "还原真实业务全貌——谁做什么？业务怎么跑？"

    stage2_system_swimlane:
      name: "系统视角泳道图"
      required: true
      dimensions: [业务系统, 系统间配合动作, 输入数据, 输出数据, 第三方接口]
      rule: |
        泳道=业务系统（如商城系统/订单系统/交易系统/物流系统）。
        系统内操作用实线箭头，系统间数据传递用双线箭头(==>)。
        第三方接口调用用虚线箭标(-.->)标注接口路径。
        人类一眼看出：有几个系统、系统间怎么配合、哪些涉及第三方。
      mermaid_example: |
        subgraph 商城系统 → subgraph 订单系统 → subgraph 交易系统
        C ==商品数据==> F （跨系统数据传递）
        I -.->|POST /api/pay| 易宝支付 （第三方接口）

    stage3_terminal_swimlane:
      name: "终端视角泳道图"
      required: true
      dimensions: [终端, 终端内操作, 跨端数据传递, 跨端触发动作]
      rule: |
        泳道=终端（如PC后台/APP/H5/小程序）。
        终端内操作用实线箭头，跨端数据传递用双线箭头(==>)。
        不同终端用不同颜色区分（PC=蓝色，APP=橙色，H5=绿色）。
        人类一眼看出：涉及几个终端、跨端流转在哪、每端做什么。
        架构师从此图提取：需要几套前端代码+几个base path+跨端API。
      mermaid_example: |
        subgraph PC后台 → subgraph APP
        C ==商品同步==> D （跨端数据传递）
        style PC后台 fill:#e1f5fe,stroke:#0288d1
        style APP fill:#fff3e0,stroke:#f57c00

  # 页面级用例（铁律⑧，v2 新增）
  page_level_usecase:
    mandatory: true
    structure:
      - 页面编号(PG-{PREFIX}-{系统缩写}-{终端缩码})
      - 页面名称（与高保真原型页面名同源，供 handoff 检索）
      - 所属模块 / 业务系统
      - 业务流程定位（引用流程节点/上下游页面）
      - 页面总体业务流程
      - 状态机梳理（引用状态机或简述）
      - 页面指标统计（必须指向指标登记 key，且 key 含 definition/source；并反标关联 BG）
      - 关联功能用例（由 UC 编号倒推，避免手抄）
      - 关联UC
    metric_closure: "页面指标须双向闭环：① 指向 §指标登记 key ② key 已含 definition+source ③ 页面反标 BG"

  # handoff 契约（铁律⑨，v2 新增；细则见 handoff-spec.yml）
  handoff_contract:
    rule: >
      需求文档每个 UC / PG 必须可被开发通过「高保真功能名称 / 页面名称」检索命中；
      UC 标题、PG 标题须与高保真原型命名同源。开发据名检索 → 原型【？】挂载 →
      右侧抽屉(右到左)弹出交互用例说明卡（字体规范见 handoff-spec.yml）。
    see_also: "knowledge/common/handoff-spec.yml"

  # 商业价值假设（铁律⑩，v2 新增；商业/市场专家诉求）
  # 每个 PRD 须显式登记商业价值假设，使变现路径/ROI 在验收时可回溯。
  business_value:
    mandatory: true
    fields: [商业目标(BG 反标), 价值假设, 度量指标, 预期收益(量化), 验证方式]
    rule: "页面指标统计(铁律⑧)与 BO/BG 映射(铁律④)须可反标到本段；商业部在脑暴阶段产出的 ROI 视角结论须落入此处"

  # 治理档案（INC 系列，全局复用）
  governance:
    incidents_source: "knowledge/common/incidents.yml"
    related: [handoff-spec.yml, incidents.yml, ba-output-standard(已并入本文件)]
    # 上游脑暴标准（阶段1 → 阶段2 输入边界）
    upstream_brainstorm:
      standard: "knowledge/common/brainstorm-standards.yml"
      version: "v1.2.0"
      contract: >
        脑暴阶段产出的 confirmed/ 二分文档为 BA 需求分析唯一权威输入；
        其 BO/BG 映射为本文档编号追溯链（UC→FN→PG→MD→SC→BG→BO）链首；
        其铁律 B-02 三流草图为本文档 swimlane/cross_system_info_flow/state_machine 起点。

  # ============================================
  # 用例描述术语一致性标准（V5.7.0新增）
  # 用例描述必须术语一致、无歧义、专业
  # ============================================
  terminology_standard:
    description: "用例描述必须术语一致、无歧义、专业"
    rules:
      - "禁止歧义表述：禁止使用'适当处理''相关数据''一些操作'等模糊表述"
      - "禁止口语化：禁止使用'搞一下''处理掉''弄好'等非专业用语"
      - "术语一致性：同一概念在不同UC中必须使用相同术语"
      - "步骤编号规范：基本流程分步编号格式为'数字.[标注]描述'，如'1.[手动]运营进入页面'"
    forbidden_words: ["适当处理", "相关数据", "一些操作", "搞一下", "处理掉", "弄好", "等等", "之类"]
    required_format: "步骤编号: [手动/系统自动/事件驱动] 操作描述"

