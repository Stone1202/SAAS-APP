# ============================================
# 三级把关报告模板（Guard Report Templates）
# 版本: v1.0.0
# 创建日期: 2026-07-18
# 所属议题: POM V5.0 议题六
# ============================================
# 三级把关报告模板：
#   Sprint把关报告（SM Agent产出）
#   版本把关报告（PM Agent产出）
#   项目把关报告（PO Agent产出）
# ============================================

version: "1.0.0"
name: "guard-report-templates"
description: "三级把关报告模板——Sprint/版本/项目"

# ============================================
# 一、Sprint把关报告模板（SM Agent产出）
# ============================================
sprint_guard_report:
  path: "projects/{project}/docs/06-sprint-guard/SPRINT-GUARD-{project}-v{version}-S{n}.md"
  produced_by: "sm-agent"
  frequency: "每Sprint结束"
  
  template: |
    # Sprint把关报告：{project} v{version} S{n}
    
    > 把关人：SM Agent（敏捷教练）
    > 日期：{date}
    > Sprint目标：{sprint_goal}
    
    ## 一、DoD校验
    | DoD项 | 状态 | 证据 |
    |-------|------|------|
    | 代码可运行 | ✅/❌ | build结果 |
    | 运行时验证通过 | ✅/❌ | 验证报告 |
    | 测试通过 | ✅/❌ | 测试报告 |
    | 后置条件实现 | ✅/❌ | 后置条件清单 |
    | 人确认 | ✅/❌ | 决策记录 |
    | Demo报告生成 | ✅/❌ | Demo报告路径 |
    
    ## 二、增量可演示
    - AI Demo结果：{通过/失败}
    - 截图：{路径}
    - 流程跑通：{是/否}
    - P0问题数：{数量}
    
    ## 三、Scrum事件执行
    | 事件 | 执行 | 产出 |
    |------|------|------|
    | Sprint启动会 | ✅/❌ | SPRINT-BACKLOG.yml |
    | AI每日立会 | ✅/❌ | 进度报告 |
    | Sprint评审会 | ✅/❌ | Review报告 |
    | Sprint回顾会 | ✅/❌ | Retrospective报告 |
    
    ## 四、运行时验证
    - build：{通过/失败}
    - dev启动：{通过/失败}
    - 页面访问：{通过/失败}
    - 菜单跳转：{通过/失败}
    - 数据保存：{通过/失败}
    - 后置条件：{通过/失败}
    - 流程跑通：{通过/失败}
    
    ## 五、阶段Review
    | 阶段 | Review通过 | 问题数 |
    |------|-----------|--------|
    | BA需求 | ✅/❌ | {n} |
    | UX设计 | ✅/❌ | {n} |
    | Arch架构 | ✅/❌ | {n} |
    | FD开发 | ✅/❌ | {n} |
    | QA测试 | ✅/❌ | {n} |
    
    ## 六、Sprint间依赖
    - 前置依赖（本Sprint依赖的）：{已就绪/未就绪}
    - 后续依赖（依赖本Sprint的）：{已解锁/未解锁}
    
    ## 七、障碍记录
    | 障碍 | 类型 | 处理 | 升级 |
    |------|------|------|------|
    | {描述} | 技术/需求/设计/依赖/工具 | {处理方式} | {是否升级到PM} |
    
    ## 八、Velocity
    - 计划页面数：{n}
    - 实际交付页面数：{n}
    - 计划工时：{n}天
    - 实际工时：{n}天
    - 速度：{n}页面/天
    
    ## 九、把关结论
    - G-SM-01 DoD满足：{通过/不通过}
    - G-SM-02 增量可演示：{通过/不通过}
    - G-SM-03 下一Sprint依赖解锁：{通过/不通过/N/A}
    - G-SM-04 运行时验证通过：{通过/不通过}
    - G-SM-05 阶段Review通过：{通过/不通过}
    - G-SM-06 Scrum事件完成：{通过/不通过}
    
    **Sprint把关总结论**：{通过/不通过}
    **下一Sprint可启动**：{是/否}

# ============================================
# 二、版本把关报告模板（PM Agent产出）
# ============================================
version_guard_report:
  path: "projects/{project}/docs/07-version-guard/VERSION-GUARD-{project}-v{version}.md"
  produced_by: "pm-agent"
  frequency: "每版本/close前"
  
  template: |
    # 版本把关报告：{project} v{version}
    
    > 把关人：PM Agent（版本守护人）
    > 日期：{date}
    > 版本主题：{version_theme}
    
    ## 一、版本范围完整性
    - Backlog Must项：{计划数} / {已交付数} / {交付率}
    - Backlog Should项：{计划数} / {已交付数} / {交付率}
    - G-VER-GUARD-01：{通过/不通过}
    
    ## 二、版本质量达标
    - 运行时验证：{通过/失败}
    - 五层测试：{通过/失败}
    - 验收：{通过/失败}
    - G-VER-GUARD-02：{通过/不通过}
    
    ## 三、三位一体交付物一致性
    - G-HO-DELIVERY-01 PRD五图完整：{通过/不通过}
    - G-HO-DELIVERY-02 仿真原型可用：{通过/不通过}
    - G-HO-DELIVERY-03 用例卡片完整：{通过/不通过}
    - G-HO-DELIVERY-04 三位一体一致：{通过/不通过}
    - G-HO-DELIVERY-05 Demo报告：{通过/不通过}
    - G-VER-GUARD-03：{通过/不通过}
    
    ## 四、版本沉淀学习
    - 沉淀8步完成：{是/否}
    - 质量评分：{分数}/100
    - G-VER-GUARD-04：{通过/不通过}
    
    ## 五、Sprint汇总
    | Sprint | DoD满足 | 增量可演示 | 把关结论 |
    |--------|---------|-----------|---------|
    | S1 | ✅/❌ | ✅/❌ | 通过/不通过 |
    | S2 | ✅/❌ | ✅/❌ | 通过/不通过 |
    | ... | ... | ... | ... |
    
    ## 六、把关结论
    **版本把关总结论**：{通过/不通过}
    **可以/close**：{是/否}

# ============================================
# 三、项目把关报告模板（PO Agent产出）
# ============================================
project_guard_report:
  path: "projects/{project}/docs/08-project-guard/PROJECT-GUARD-{project}.md"
  produced_by: "po-agent"
  frequency: "每版本/close时 + 项目里程碑（累积更新）"
  
  template: |
    # 项目把关报告：{project}
    
    > 把关人：PO Agent（项目总体把关人）
    > 最后更新：{date}
    > 项目立项日期：{date}
    
    ## 一、商业目标对齐（g1）
    | 版本 | BO达成率 | BG达成率 | G-PROJ-GUARD-01 |
    |------|---------|---------|----------------|
    | v1.0.0 | {n}% | {n}% | 通过/不通过 |
    | v1.1.0 | {n}% | {n}% | 通过/不通过 |
    | 累积 | {n}% | {n}% | — |
    
    ## 二、路线图对齐（g2）
    - 计划版本数：{n}
    - 实际交付版本数：{n}
    - 偏离度：{n}%
    - G-PROJ-GUARD-02：{通过/警告/不通过}
    
    ## 三、价值累积（g3）
    | 版本 | 新增BO | 累积BO达成率 | 趋势 |
    |------|--------|-------------|------|
    | v1.0.0 | {n} | {n}% | — |
    | v1.1.0 | {n} | {n}% | 上升/下降 |
    - G-PROJ-GUARD-03：{通过/警告/不通过}
    
    ## 四、公司7要素整体影响（g4）
    | 要素 | v1.0.0影响 | v1.1.0影响 | 累积影响 | 可接受 |
    |------|-----------|-----------|---------|--------|
    | 运营 | {positive/negative/neutral} | ... | ... | 是/否 |
    | 资源 | ... | ... | ... | 是/否 |
    | 财务 | ... | ... | ... | 是/否 |
    | 渠道 | ... | ... | ... | 是/否 |
    | 业务 | ... | ... | ... | 是/否 |
    | 组织 | ... | ... | ... | 是/否 |
    | 技术 | ... | ... | ... | 是/否 |
    
    ## 五、跨版本学习（g5）
    - 经验库条目数：{n}
    - lessons-learned应用次数：{n}
    - 重复问题率：{n}%
    
    ## 六、把关结论
    **项目把关总结论**：{健康/需关注/需干预}
    **项目继续/暂停/终止建议**：{继续/暂停/终止}
    **需人决策事项**：{如有，按human-confirm-protocol请求人决策}
