# ============================================
# 高保真仿真原型规范（Sim Prototype Standards）
# 版本: v1.0.0
# 创建日期: 2026-07-18
# 所属议题: POM V5.0 议题五
# ============================================
version: "1.0.0"
name: "sim-prototype-standards"
description: "高保真仿真原型规范——独立仿真交付物（非代码初版）"

# ============================================
# 一、定义
# ============================================
definition: |
  可操作、可闭环、接近真实系统的原型。
  研发团队可用来模拟真实业务操作，验证业务流程闭环。
  不是代码初版，而是独立交付的仿真系统。

# ============================================
# 二、必须具备（must_have）
# ============================================
must_have:
  - id: "SH-01"
    name: "可操作的页面"
    description: "按钮可点、表单可填、数据可存"
    verification: "AI点击按钮/填写表单/保存数据，验证有响应"

  - id: "SH-02"
    name: "接近真实的业务数据"
    description: "不是空页面，有模拟数据"
    verification: "页面加载后有预置数据展示"

  - id: "SH-03"
    name: "可闭环的流程"
    description: "从开始到结束能跑通，不是半截"
    verification: "AI执行端到端流程，验证每步可达"

  - id: "SH-04"
    name: "多终端模拟"
    description: "PC/H5/APP/小程序，按需求覆盖"
    verification: "需求声明的终端都有对应页面"

  - id: "SH-05"
    name: "状态机行为正确"
    description: "操作后状态变化符合PRD状态机"
    verification: "AI操作后检查状态值与PRD stateDiagram一致"

  - id: "SH-06"
    name: "后置条件实现"
    description: "操作后有对应的数据变化/通知/审核记录"
    verification: "AI操作后检查后置条件全部生效"

  - id: "SH-07"
    name: "菜单导航完整"
    description: "运营后台菜单统一显示，不出现跳转失效"
    verification: "AI遍历所有菜单项，验证全部可跳转"

  - id: "SH-08"
    name: "数据保存可用"
    description: "不是只读，增删改查都能用"
    verification: "AI执行CRUD操作，验证数据持久化"

# ============================================
# 三、不需要具备（must_not_have）
# ============================================
must_not_have:
  - "不需要真实后端（用sim适配器模拟）"
  - "不需要真实第三方接口（用sim适配器模拟）"
  - "不需要生产级性能优化"
  - "不需要真实鉴权（用Mock鉴权）"

# ============================================
# 四、交付格式
# ============================================
delivery_format:
  - "可运行的dev server（npm run dev）"
  - "访问URL清单（每页面一个URL）"
  - "操作指南（如何登录/如何切换角色/如何触发各场景）"
  - "Demo报告（AI自动生成的截图+流程跑通证据）"

# ============================================
# 五、运行时验证
# ============================================
verification:
  runtime_check: "build通过 + dev启动通过 + 页面可访问 + 菜单可跳转 + 数据可保存 + 后置条件生效 + 流程跑通"
  ai_demo: "AI自动执行核心流程并生成Demo报告（截图+录屏+通过/失败+问题清单）"
  check_steps:
    - "1. npm run build 构建通过"
    - "2. npm run dev 启动通过"
    - "3. 每个路由URL可访问（HTTP 200）"
    - "4. 菜单项全部可跳转（无404/白屏）"
    - "5. CRUD操作数据可持久化（IndexedDB）"
    - "6. 后置条件生效（版本号+1/通知推送/状态变更/审核记录入库）"
    - "7. 端到端流程跑通（从开始到结束）"

# ============================================
# 六、与三位一体交付物的关系
# ============================================
delivery_trinity:
  prd: "PRD文档（泳道图+流程图+状态机+信息流+用例说明）—— 理解全局"
  sim_prototype: "高保真仿真原型（本文档规范）—— 体验真实"
  use_case_card: "可交互用例卡片 —— 精确定义"
  purpose: "降低沟通成本——研发团队可看总体说明、看用例说明、用仿真系统模拟接近真实的可操作可闭环原型"
