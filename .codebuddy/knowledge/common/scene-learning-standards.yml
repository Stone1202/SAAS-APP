# ============================================
# scene-learning-standards.yml — 场景深度学习标准
# 版本：v1.0.0
# 创建：2026-07-20
# 定位：learn-project V7.0.0 场景深度还原的唯一标准事实源
# 核心理念：AI是"深度还原器"，不是"分析推导器"——从原文碎片交叉印证还原原本就存在的完整需求，不加AI自己的想法
# 引用方：learn-project.yml Stage 2.5/2.6/5 引用本文件
# 关联：doc-standards.yml 五大业务产物章节增强
# ============================================

version: "1.0.0"
last_updated: "2026-07-20"

# ============================================
# 一、双态标注机制（解决忠实还原与深度挖掘的矛盾）
# ============================================
dual_state_annotation:
  description: |
    V7.0.0核心机制：将"忠实还原"从"显式照录"升级为"显式照录 + 隐式挖掘还原"。
    AI的定位是"深度还原器"——挖掘原文中分散隐含的原本需求，而非加入AI自己的推导和补充。
    "挖掘"的本质：从原文的蛛丝马迹中交叉印证还原出原本就存在但未被显式组织的完整需求。
    所有挖掘必须有原文依据链，是"还原"不是"创造"。

  states:
    explicit:
      label: "📗 显式照录"
      definition: "原型文档明确写出的内容（页面/字段/按钮/规则/状态/流程描述）"
      prd_handling: "FR-01~05 铁律保护，照录不改不删不纠"
      marker: "无前缀（默认态）"
      rule: "一字不漏照录，禁止以冗余/不合理为由删减"

    implicit_mining:
      label: "🟡 隐式挖掘还原"
      definition: "从原型分散的信息碎片中，交叉印证还原出的原本就存在但未被显式组织的完整需求"
      prd_handling: "写入PRD对应章节，必须标注【🟡隐式挖掘】前缀 + 原文依据链"
      marker: "【🟡隐式挖掘·依据:原文片段A+片段B交叉印证】"
      rule: |
        挖掘三原则（缺一不可）：
        1. 有据原则：每条挖掘必须附原文依据链（引用≥2处原文片段交叉印证）
        2. 还原原则：挖掘的是"原本就存在但分散的需求"，不是AI创造的（禁止补充原文完全没有线索的内容）
        3. 可溯原则：依据链必须可回溯到原文具体位置（文件名/页面/字段/行）

  forbidden:
    - "❌ 禁止AI分析推导（如'基于行业经验应该有XXX'）——这不是还原而是创造"
    - "❌ 禁止AI补充建议（如'建议补充异常流程'）——挖掘出的异常必须有原文依据"
    - "❌ 禁止无依据链的隐式标注——无依据=推测=违规"
    - "❌ 禁止将单一原文片段过度解读——必须≥2处交叉印证"

  boundary_examples:
    allowed_mining:
      - "原文有'待审核→已通过'状态转换 + '审核通过'按钮 → 挖掘出'审核'场景（依据：状态转换+按钮交叉印证）"
      - "原文有订单列表→详情→编辑 + 编辑页有'提交审核'按钮 → 挖掘出'订单提交审核'场景（依据：跳转链+按钮）"
      - "原文有'状态为已禁用时不可编辑'规则 + 禁用按钮 → 挖掘出'已禁用'隐式状态（依据：规则+按钮）"
    forbidden_inference:
      - "❌ '订单流程应该有退款异常' —— 原文无任何退款/异常线索，这是AI推导不是还原"
      - "❌ '基于电商行业经验应该有库存校验' —— 这是AI补充不是挖掘"
      - "❌ '建议补充超时处理' —— 这是建议不是还原"

# ============================================
# 二、五大业务产物深度还原标准
# ============================================
five_business_artifacts:

  # 产物1：业务场景
  business_scene:
    description: "从原文碎片中还原完整的业务场景全景"
    standard_fields:
      - "场景编号 SC-{系统缩写}-{NNN}"
      - "场景名称（从原文标题/菜单/按钮组提取）"
      - "场景参与者（从原文角色/权限描述提取）"
      - "场景触发条件（从原文入口/按钮/事件提取）"
      - "场景出口（从原文跳转/完成态/后置条件提取）"
      - "场景关联页面（从原文页面跳转关系提取）"
      - "场景状态变化（从原文状态转换提取）"
      - "标注态（📗显式 / 🟡隐式挖掘+依据链）"

    deep_mining_rules:
      implicit_scene_mining:
        description: "隐式场景挖掘——从4个维度还原原文未显式命名的场景"
        dimensions:
          - dimension: "页面跳转链中间态"
            rule: "列表→详情→编辑→审核中，'审核'若无独立页面但有审核操作 → 挖掘为独立场景"
            evidence_required: "跳转链 + 审核操作按钮/接口"
          - dimension: "按钮组功能聚类"
            rule: "同一页面'导出/导入/批量删除'构成独立批量操作场景"
            evidence_required: "按钮组 + 操作目标实体一致"
          - dimension: "状态转换触发动作"
            rule: "每次状态跳变对应一个业务操作场景（待付款→已付款对应'付款'场景）"
            evidence_required: "状态机转换 + 触发FN"
          - dimension: "角色权限交叉点"
            rule: "A能看不能改、B能改不能审，交叉点构成独立审批场景"
            evidence_required: "权限描述A + 权限描述B + 共同操作对象"

      scene_orchestration:
        description: "场景编排图谱——还原场景间的编排关系"
        relation_types:
          - type: "sequential"
            name: "顺序编排"
            rule: "场景A的出口是场景B的入口（A→B）"
            evidence: "原文跳转链/后置条件→前置条件"
          - type: "parallel"
            name: "并行编排"
            rule: "同一触发条件同时启动多个场景"
            evidence: "原文同一入口触发多操作"
          - type: "exclusive"
            name: "互斥编排"
            rule: "场景A和场景B不能同时发生（条件分支）"
            evidence: "原文条件判断分支"
          - type: "loop"
            name: "循环编排"
            rule: "场景执行后可回到前置场景重复"
            evidence: "原文'返回继续'/'重新提交'描述"
          - type: "dependency"
            name: "依赖编排"
            rule: "场景B必须等场景A完成才能执行"
            evidence: "原文前置条件引用A的结果"
        output_format: "Mermaid flowchart 场景编排图 + 场景依赖矩阵"

      scene_closure_validation:
        description: "场景闭环验证——验证每个场景是否闭环"
        checks:
          - "入口闭环：每个场景是否有明确入口（非孤立场景）"
          - "出口闭环：每个场景是否有明确出口（非死胡同场景）"
          - "状态闭环：场景内状态变化是否有终态（非悬空状态）"
          - "数据闭环：场景产生的数据是否有消费方（非孤儿数据）"
        on_fail: "不闭环场景记录到学习报告'场景闭环问题'清单，标注缺失的入口/出口/终态/消费方"

  # 产物2：业务流程图
  business_flow:
    description: "从原文操作描述还原完整的端到端业务流程"
    deep_mining_rules:
      happy_path_restoration:
        rule: "从原文分散的操作步骤描述中，还原完整的Happy Path主干流程"
        evidence: "原文每个操作步骤 + 页面跳转顺序"

      branch_restoration:
        rule: "从原文条件判断描述中还原分支流程（若A则B，否则C）"
        evidence: "原文条件判断语句 + 分支后操作"

      exception_path_matrix:
        description: "异常路径矩阵——从原文碎片中还原异常路径（非AI推导，必须有原文依据）"
        mining_sources:
          - source: "校验规则"
            rule: "原文'手机号格式校验'→ 挖掘'手机号格式错误'异常路径"
          - source: "前置条件"
            rule: "原文'需登录后操作'→ 挖掘'未登录'异常路径"
          - source: "错误提示文案"
            rule: "原文有'余额不足'提示 → 挖掘'余额不足'异常路径"
          - source: "按钮禁用条件"
            rule: "原文'状态为已删除时删除按钮置灰'→ 挖掘'已删除不可再删'异常路径"
          - source: "状态约束"
            rule: "原文'只有待付款状态可取消'→ 挖掘'非待付款状态不可取消'异常路径"
        forbidden: "❌ 原文无任何线索时不得凭行业经验枚举异常（那是推导不是还原）"
        output_format: "场景×异常类型矩阵（标注原文依据来源）"

      cross_page_handoff:
        rule: "还原跨页面衔接点——页面A的操作如何触发页面B"
        evidence: "原文跳转关系 + 参数传递"

  # 产物3：业务信息结构
  business_information:
    description: "从原文数据碎片中还原完整的业务信息结构与流转血缘"
    deep_mining_rules:
      info_entity_restoration:
        rule: "从表单字段/列表列/详情字段中还原信息主体及其完整字段"
        evidence: "原文所有出现该信息主体的页面字段集合"

      info_lifecycle_tracing:
        description: "信息生命周期追踪——还原信息从创建到消亡的完整生命周期"
        stages: [创建(Create), 读取(Read), 更新(Update), 归档(Archive), 删除(Delete)]
        rule: "从原文操作按钮还原信息在每个阶段的操作（新增按钮→Create，查看→Read，编辑→Update，禁用→Archive，删除→Delete）"
        evidence: "原文操作按钮 + 操作目标实体"
        output_format: "信息主体×生命周期阶段矩阵"

      cross_scene_bloodline:
        description: "跨场景信息血缘——还原信息在场景间的产生与消费关系"
        rule: "场景A产生的信息在哪些场景被读取/修改/消费"
        evidence: "原文场景间数据传递 + 页面间参数传递 + 接口调用"
        output_format: "Mermaid 信息血缘图（信息主体→产生场景→消费场景）"

      consistency_check:
        description: "信息一致性校验——校验同一字段跨场景的定义是否一致"
        checks:
          - "字段类型一致性：同一字段在不同页面是否类型一致（如金额在某页是输入框、另一页是下拉框→不一致）"
          - "字段约束一致性：同一字段的必填/长度/格式在不同场景是否一致"
          - "字段状态一致性：同一字段在不同状态下的可见性/可编辑性是否一致"
        on_fail: "不一致项记录到学习报告'信息一致性问题'清单，标注冲突的页面和字段定义"

  # 产物4：业务状态机
  business_state_machine:
    description: "从原文状态碎片中还原完整的业务状态机"
    deep_mining_rules:
      explicit_state_extraction:
        rule: "从状态标签/筛选项/状态列提取显式状态"
        evidence: "原文状态标签/筛选项"

      implicit_state_mining:
        description: "隐式状态发现——从按钮可用性/操作前置条件推导可能的状态"
        rules:
          - "按钮置灰条件 → 隐式状态（'已删除时删除按钮置灰'→'已删除'状态）"
          - "操作前置条件 → 隐式状态（'只有待付款可取消'→'待付款'是状态）"
          - "页面跳转条件 → 隐式状态（'审核通过后跳转列表'→'已审核'状态）"
          - "字段值变化 → 隐式状态（'status字段从0变1'→ 状态0和1）"
        evidence_required: "≥2处原文依据交叉印证"
        marker: "🟡隐式挖掘+依据链"

      transition_completeness:
        description: "状态转换完整性分析"
        checks:
          - "入口完整性：每个状态是否有入口转换（无入口=不可达状态）"
          - "出口完整性：每个状态是否有出口转换（无出口=死状态，终态除外）"
          - "转换对称性：A→B存在时，是否有对应的B→A或B→C（避免状态悬空）"
        on_fail: "不完整转换记录到学习报告'状态机完整性问题'清单"

      illegal_transition_mining:
        rule: "从原文禁止性描述还原非法转换（'已取消的订单不可再操作'→已取消→任何状态都非法）"
        evidence: "原文禁止性规则/按钮置灰条件"

  # 产物5：业务状态机操作矩阵
  business_operation_matrix:
    description: "四图浓缩产物——角色×状态×操作×数据的交叉验证矩阵"
    deep_mining_rules:
      matrix_restoration:
        rule: "从泳道图(角色) + 状态机(状态) + 流程图(操作) + 信息流(数据)还原完整矩阵"
        dimensions: [角色, 业务状态, 操作(FN), 数据可见性]
        evidence: "四图交叉点"

      gap_analysis:
        description: "缺口分析——验证矩阵完整性"
        checks:
          - "角色×状态覆盖：每个角色在每个状态下是否有明确操作或'无操作'标注"
          - "操作×状态覆盖：每个FN在哪些状态可执行是否有标注"
          - "数据×角色覆盖：每个角色能看到哪些数据是否有标注"
        on_fail: "缺口记录到学习报告'操作矩阵缺口'清单"

      operation_detail_card_restoration:
        rule: "每个✅单元格挂载操作详情卡（入口/前置条件/信息可见/后置动作/异常处理）"
        evidence: "原文操作描述 + 前置条件 + 后置条件 + 异常提示"

# ============================================
# 三、挖掘依据链规范
# ============================================
evidence_chain_spec:
  description: "所有🟡隐式挖掘标注必须附依据链，否则视为推测违规"
  format: "【🟡隐式挖掘·依据:{依据1}+{依据2}交叉印证】"
  evidence_types:
    page_jump: "页面跳转关系（如：订单列表PG-001→详情PG-002）"
    button: "按钮/操作元素（如：审核通过按钮BTN-001）"
    field: "字段定义（如：status字段enum值）"
    rule: "业务规则（如：BR-001 只有待付款可取消）"
    state_label: "状态标签/筛选项（如：筛选项含'已取消'）"
    annotation: "原型注释/便签（如：黄色便签'审核通过后不可修改'）"
    permission: "权限描述（如：管理员可审核，运营只能查看）"

  minimum_evidence: 2
  rule: "每条🟡隐式挖掘必须引用≥2处不同类型的原文依据交叉印证，单一依据不得挖掘"

# ============================================
# 四、学习报告深度增强标准
# ============================================
learning_report_enhancement:
  description: "V7.0.0学习报告新增'场景流程深度还原'章节"
  sections:
    - name: "场景编排完整性"
      metrics: [场景总数, 显式场景数, 隐式挖掘场景数, 编排关系数, 不闭环场景数]
      scoring: "闭环场景数 / 场景总数 × 100%"
    - name: "流程还原完整度"
      metrics: [Happy Path数, 分支数, 异常路径数(有依据), 跨页面衔接点数]
      scoring: "有依据异常路径覆盖的场景数 / 场景总数 × 100%"
    - name: "信息结构还原度"
      metrics: [信息主体数, 生命周期完整主体数, 血缘链路数, 一致性问题数]
      scoring: "生命周期完整主体数 / 信息主体总数 × 100%"
    - name: "状态机完整度"
      metrics: [显式状态数, 隐式挖掘状态数, 不可达状态数, 死状态数, 缺失转换数]
      scoring: "完整状态数(有入有出) / 状态总数 × 100%"
    - name: "操作矩阵覆盖度"
      metrics: [矩阵单元格数, 已填充单元格数, 缺口单元格数, 操作详情卡数]
      scoring: "已填充单元格数 / 应填充单元格数 × 100%"
    - name: "挖掘依据链审计"
      metrics: [🟡隐式挖掘标注总数, 有依据链标注数, 无依据链标注数(违规)]
      rule: "无依据链标注=违规，必须降级为不挖掘或补依据"

# ============================================
# 五、与忠实还原铁律的关系
# ============================================
faithfulness_relationship:
  principle: |
    V7.0.0不破坏FR-01~06忠实还原铁律，而是扩展"忠实还原"的内涵：
    旧定义：忠实还原 = 显式照录（原型有什么写什么）
    新定义：忠实还原 = 显式照录 + 隐式挖掘还原（原型有的+原型有但分散的）
  boundary: |
    🟡隐式挖掘仍属于"忠实还原"范畴，因为挖掘的是"原本就存在但分散的需求"。
    判定标准：如果原型作者被问到这个场景/状态/异常，他能从原型中找到依据 → 这是挖掘（允许）
              如果原型作者也找不到依据，认为是新需求 → 这是创造（禁止）
  fr_rule_updates:
    FR_04_clarification: |
      FR-04"禁止推测"更新为：禁止推测原文完全没有线索的内容；
      但允许基于≥2处原文依据交叉印证进行隐式挖掘还原（标注🟡+依据链）。
      推测 = 无依据或单一依据过度解读（禁止）
      挖掘 = ≥2处依据交叉印证还原原本存在的需求（允许，标注🟡）
