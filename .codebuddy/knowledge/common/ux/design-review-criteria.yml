# ============================================
# 设计交互评审准则 — 独立维护的联合评审标准
# 版本：v1.0.0
# 最后更新：2026-07-17
# ============================================
#
# 定位：设计流程(design-flow.yml) Step 8 联合评审引用的独立评审准则文件
# 维护：评审标准调整只需修改本文件，design-flow.yml 通过 review_standard 引用
# 引用方：design-flow.yml → review_standard: ".codebuddy/knowledge/common/ux/design-review-criteria.yml"
#         PM红线C-D9引用本文件的评审结论标准
# ============================================

version: "1.0.0"
last_updated: "2026-07-17"

# ============================================
# 一、评审机制定义
# ============================================
review_mechanism:
  name: "交互跳转矩阵联合评审"
  trigger: "Step7交互文档产出后，PM红线检查前"
  participants:
    - role: "UX设计师"
      responsibility: "信息架构师，主导维度1评估"
    - role: "交互设计师"
      responsibility: "交互细节定义者，主导维度2+维度3交互部分"
    - role: "UI设计师"
      responsibility: "视觉化塑造者，主导维度3视觉部分"
    - role: "BA"
      responsibility: "需求分析师，全维度需求对齐+流程一致性+业务可行性"
  output: "联合评审报告（3维度评估+问题清单+改进建议+评审结论）"

# ============================================
# 二、评估维度1：多模块跳转+子页面穿插
# ============================================
dimension_1:
  name: "多模块跳转+子页面穿插"
  evaluators: ["UX设计师", "BA"]
  input: "交互跳转矩阵（第8章）+ 信息结构（第2章）+ BA业务流程图"

  checklist:
    - id: "D1-a"
      item: "跨模块路由合理性"
      details:
        - "模块间跳转是否有明确业务语义（非随意跳转）"
        - "跨模块跳转是否携带足够的上下文（如从直播管理跳到词库管理时携带直播ID）"
        - "模块间跳转深度是否≤3层（超过3层用户易迷失）"
      severity_rule: "无业务语义的跨模块跳转=严重；上下文丢失=中等；深度>3层=轻微"

    - id: "D1-b"
      item: "子页面穿插评估"
      details:
        - "同一模块内子页面跳转路径是否最短"
        - "是否存在循环跳转（A→B→C→A）"
        - "是否存在孤立页面（无入口或无出口）"
        - "子页面穿插是否与BA业务流程图的节点顺序一致"
      severity_rule: "循环跳转=严重；孤立页面=严重；路径非最短=轻微；与BA流程图不一致=中等"

    - id: "D1-c"
      item: "页面层级深度"
      details:
        - "逐页面计算从首页到该页面的最短跳转步数"
        - "超过3步的页面标记为'深度过深'，建议提供快捷入口"
      severity_rule: ">5步=严重；4-5步=中等；3步=轻微；≤2步=无问题"

    - id: "D1-d"
      item: "导航回溯能力"
      details:
        - "每个跳转是否可通过面包屑/返回按钮回溯"
        - "弹窗关闭后是否回到触发页面（非跳转到其他页面）"
      severity_rule: "无法回溯=严重；弹窗关闭跳到其他页面=中等"

  output_format: |
    多模块跳转评估表：
    | 源模块 | 目标模块 | 跳转路径 | 步数 | 上下文携带 | 合理性判定 | 改进建议 |
    |--------|----------|----------|------|------------|------------|----------|

# ============================================
# 三、评估维度2：模态框使用
# ============================================
dimension_2:
  name: "模态框使用"
  evaluators: ["交互设计师", "BA"]
  input: "交互跳转矩阵（第8章）+ 弹窗交互说明（第5章）+ BA业务流程图"

  checklist:
    - id: "D2-a"
      item: "模态框vs页面跳转选择合理性"
      details:
        - "轻量操作（新增/编辑/确认）→ 模态框（不中断主流程）"
        - "重量操作（列表/详情/复杂表单）→ 页面跳转（提供完整空间）"
        - "逐个模态框评估：是否应该改为页面跳转？是否应该改为抽屉？"
      selection_guide:
        modal_suitable: ["新增/编辑单条记录", "确认操作", "简单表单（≤5个字段）", "详情预览", "批量导入"]
        page_suitable: ["列表页", "复杂表单（>5个字段）", "多步骤流程", "数据看板", "配置页"]
        drawer_suitable: ["筛选条件", "高级搜索", "快速编辑", "侧边详情"]
      severity_rule: "复杂表单用模态框=中等；列表用模态框=严重；确认操作用页面跳转=轻微"

    - id: "D2-b"
      item: "模态框使用频率"
      details:
        - "统计每页面的模态框数量"
        - "单页面模态框>3个标记为'过度使用'，建议部分改为页面"
      severity_rule: ">5个=严重；4-5个=中等；3个=轻微；≤2个=无问题"

    - id: "D2-c"
      item: "模态框嵌套深度"
      details:
        - "模态框中再触发模态框的嵌套层数"
        - "嵌套>2层标记为'嵌套过深'，建议改为页面跳转"
      severity_rule: ">3层=严重；3层=中等；2层=轻微；1层=无问题"

    - id: "D2-d"
      item: "模态框与业务流程的关系"
      details:
        - "模态框是否阻断了关键业务流程（如审核告警处置不应使用模态框，应为常驻面板）"
        - "BA评估：模态框的使用是否影响业务流程的连贯性"
      severity_rule: "阻断关键流程=严重；影响流程连贯性=中等"

  output_format: |
    模态框使用评估表：
    | 页面 | 模态框编号 | 用途 | 字段数 | 嵌套层数 | 合理性判定 | 改进建议 |
    |------|------------|------|--------|----------|------------|----------|

# ============================================
# 四、评估维度3：交互一致性+流程一致性
# ============================================
dimension_3:
  name: "交互一致性+流程一致性"
  evaluators: ["交互设计师", "UI设计师", "BA"]
  input: "交互文档全8章 + BA需求文档（FN/UC/业务流程图/状态机/业务操作矩阵）"

  checklist:

    - id: "D3-a"
      item: "交互一致性（交互设计师）"
      details:
        - "同类操作（新增/编辑/删除/搜索/筛选）在不同页面的交互模式是否统一"
        - "按钮位置/样式/反馈是否一致（如所有'删除'都是危险按钮+确认弹窗）"
        - "表单校验策略是否统一（实时/失焦/提交）"
        - "空状态/错误状态/加载态是否统一"
      severity_rule: "同类操作交互模式不统一=中等；按钮反馈不一致=轻微；状态模板不统一=轻微"

    - id: "D3-b"
      item: "视觉一致性（UI设计师）"
      details:
        - "同类组件的视觉样式是否统一（所有表格/表单/卡片风格一致）"
        - "色彩语义是否一致（红=危险/绿=成功/黄=警告）"
        - "间距/圆角/阴影是否遵循Design Tokens"
      severity_rule: "色彩语义不一致=严重；组件样式不统一=中等；间距不遵循Tokens=轻微"

    - id: "D3-c"
      item: "流程一致性（BA）"
      details:
        - "交互跳转矩阵的跳转路径是否与BA业务流程图的节点顺序一致"
        - "页面状态变化是否与BA状态机的状态转换一致"
        - "交互行为是否覆盖了BA业务操作矩阵的所有操作"
        - "是否存在BA定义了但设计未覆盖的操作（漏设计）"
        - "是否存在设计新增了但BA未定义的操作（超设计）"
      severity_rule: "漏设计=严重；超设计=严重；跳转路径与流程图不一致=中等；状态变化与状态机不一致=中等"

    - id: "D3-d"
      item: "跨终端流程一致性（BA+交互设计师）"
      details:
        - "同一业务流程在不同终端（PC/OBS/MOB/CTRL）的操作步骤是否逻辑一致"
        - "终端差异是否合理（如OBS插件简化操作，PC后台完整操作）"
      severity_rule: "同一流程跨终端逻辑不一致=严重；终端差异不合理=中等"

  output_format: |
    一致性评估表：
    | 检查项 | 检查范围 | 判定 | 不一致点 | 改进建议 |
    |--------|----------|------|----------|----------|

# ============================================
# 五、评审结论标准
# ============================================
review_conclusion:
  levels:
    - level: "通过"
      condition: "3维度全部无严重问题（允许轻微改进建议）"
      action: "进入PM红线检查（C-D1~D9）"
      severity_threshold: "严重=0 且 中等=0"

    - level: "有条件通过"
      condition: "存在中等问题但不影响核心流程"
      action: "UX限期修改+BA确认后进入PM红线"
      severity_threshold: "严重=0 且 中等≤3"

    - level: "不通过"
      condition: "存在严重问题（流程断裂/关键操作漏设计/模态框滥用）"
      action: "UX修改后重新联合评审"
      severity_threshold: "严重≥1 或 中等>3"

  severity_definitions:
    severe: "影响核心业务流程或用户体验（如流程断裂/漏设计/超设计/循环跳转/阻断关键流程）"
    moderate: "影响部分流程或效率但不阻断（如模态框过多/层级过深/交互不统一）"
    minor: "不影响流程但有优化空间（如深度略深/反馈细节不一致）"

# ============================================
# 六、评审报告格式
# ============================================
report_format: |
  # 交互跳转矩阵联合评审报告

  ## 评审信息
  - 评审日期：{date}
  - 评审参与者：UX设计师/交互设计师/UI设计师/BA
  - 设计文档版本：{design_doc_version}
  - 需求文档版本：{req_doc_version}

  ## 维度1：多模块跳转+子页面穿插
  - 评估清单结果（D1-a/b/c/d逐项）
  - 多模块跳转评估表
  - 问题清单+改进建议

  ## 维度2：模态框使用
  - 评估清单结果（D2-a/b/c/d逐项）
  - 模态框使用评估表
  - 问题清单+改进建议

  ## 维度3：交互一致性+流程一致性
  - 评估清单结果（D3-a/b/c/d逐项）
  - 一致性评估表
  - 问题清单+改进建议

  ## 评审结论
  - 结论：通过 / 有条件通过 / 不通过
  - 严重问题数：{count}
  - 中等问题数：{count}
  - 轻微问题数：{count}
  - 改进事项清单（如有）

# ============================================
# 七、版本历史
# ============================================
version_history:
  - version: "1.0.0"
    date: "2026-07-17"
    changes: "初始版本，从design-flow.yml V3.1.0 Step 8抽离，定义3维度评估+评审结论标准"
