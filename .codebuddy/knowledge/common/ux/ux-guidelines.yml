# ============================================
# 用户体验规范知识库 — 交互标准完整定义
# 版本：v3.0.0
# 最后更新：2026-07-16
version: "3.0.0"
# ============================================
#
# 4层标准体系：
#   第1层：通用交互设计原则（第一性原理）
#   第2层：国际与国家标准（ISO/GB）
#   第3层：主流设计系统（行业实践）
#   第4层：业务场景规范侧重
# ============================================

ux_guidelines:
  # ============================================
  # 第1层：通用交互设计原则（第一性原理）
  # ============================================
  fundamental_principles:
    - name: "尼尔森十大可用性原则"
      principles:
        - "状态可见性：系统状态需让用户随时了解"
        - "环境贴切：使用用户熟悉的语言和概念"
        - "用户控制与自由：支持操作的撤销与重做"
        - "一致性与标准化：相同的操作、用语应得到相同的结果"
        - "防错：通过设计预防用户犯错"
        - "易取：减少用户的记忆负担"
        - "灵活高效：兼顾新手和专家用户的使用效率"
        - "美观与简约：保持界面简洁，突出关键信息"
        - "容错：错误信息应清晰，并提供解决方案"
        - "人性化帮助：提供必要的、易于获取的帮助文档"

    - name: "以人为本的设计(HCD)"
      standard: "ISO 9241-210"
      description: "在设计的全生命周期中，将用户的需求、能力和限制放在首位"

    - name: "Apple HIG 七大核心设计原则"
      principles:
        - "宗旨(Purpose)：创造有意义的、能解决用户核心问题的产品"
        - "自主(Agency)：让用户以自己的方式完成任务，给予掌控感"
        - "责任(Responsibility)：优先考虑用户安全和隐私"
        - "熟悉(Familiarity)：建立在用户已有认知上，遵循平台约定"
        - "灵活(Flexibility)：适配不同设备、交互方式和用户需求"
        - "简单(Simplicity)：保持清晰、直接，去除不必要元素"
        - "精湛(Craft)：关注每一个细节，体现对品质的追求"
      core_experience: ["清晰(Clarity)", "顺应(Deference)", "深度(Depth)"]

  # ============================================
  # 第2层：国际与国家标准
  # ============================================
  standards:
    international:
      - { code: "ISO 9241系列", desc: "人-系统交互工效学核心标准族" }
      - { code: "ISO 9241-112", desc: "交互系统基本工效学设计原则" }
      - { code: "ISO 9241-151", desc: "网页用户界面以人为本设计指南" }
      - { code: "ISO 9241-222:2026", desc: "HCD方法自我评估指南" }
      - { code: "WCAG 2.2", desc: "Web内容无障碍指南（国际公认）" }
    national:
      - { code: "GB/T 18978系列", desc: "=ISO 9241系列" }
      - { code: "GB/T 18978.210—2024", desc: "以人为中心的交互系统设计" }
      - { code: "GB/T 47175-2026", desc: "人-智能系统交互设计指南（AI产品）" }
      - { code: "GB/T 18978.129-2026", desc: "软件个性化导则" }
      - { code: "GB/T 45285-2025", desc: "输入系统设计评估导则" }
      - { code: "GB/T 37668—2019", desc: "互联网内容无障碍技术要求" }
      - { code: "GB/T 45445-2025", desc: "电子商务平台适老化通用要求" }

  # ============================================
  # 第3层：主流设计系统（行业实践）
  # ============================================
  design_systems:
    b_end:
      - { name: "Ant Design", org: "蚂蚁集团", desc: "企业级B端标杆" }
      - { name: "TDesign", org: "腾讯", desc: "企业级设计体系" }
      - { name: "Arco Design", org: "字节跳动", desc: "企业级设计系统" }
      - { name: "Element", org: "饿了么/阿里巴巴", desc: "Vue生态组件库" }
      - { name: "Fusion Design", org: "阿里巴巴", desc: "企业级设计系统" }
    c_end:
      - { name: "Material Design", org: "Google", desc: "Android官方" }
      - { name: "Human Interface Guidelines (HIG)", org: "Apple", desc: "iOS/macOS官方" }
      - { name: "WeUI", org: "微信", desc: "小程序官方" }

  # ============================================
  # 第4层：业务场景规范侧重
  # ============================================
  business_scene:
    b_enterprise:
      goal: "高效、精准、降低学习成本"
      focus: "一致性、效率、组件库详尽"
      density: high
    c_consumer:
      goal: "简单、流畅、愉悦"
      focus: "平台规范(HIG/Material)、手势操作"
      density: low
    ecommerce:
      goal: "促成交易"
      focus: "缩短转化路径、无障碍法规"
      density: medium
    social:
      goal: "促进互动与交流"
      focus: "清晰导航、及时反馈、手势操作"
      density: low
    live_streaming:
      goal: "实时互动与内容消费"
      focus: "沉浸式观看体验、互动控件便捷性"
      density: medium
    data_dashboard:
      goal: "高效信息获取"
      focus: "信息清晰准确、布局紧凑、操作路径直接"
      density: ultra_high
    mobile:
      goal: "简洁高效"
      focus: "移动优先、手势交互、44×44pt触控区"
      density: low
    web:
      goal: "兼容与响应式"
      focus: "WCAG无障碍、跨浏览器兼容"
      density: medium

  # ============================================
  # HIG 关键交互规范
  # ============================================
  hig_interaction_specs:
    touch_target: "最小可点击区域44×44pt"
    feedback: "每个操作都给予即时视觉或触觉反馈"
    font_weight: "避免极细字重(Ultralight/Thin)，优先常规/中粗"
    permission: "仅在真正需要时请求权限，清晰解释原因"
    gesture: "避免重定义系统级手势"
    visual_style: "使用明亮、浅色元素表示可交互性"

  # ============================================
  # 交互一致性检查清单（6章第6章引用）
  # ============================================
  consistency_checklist:
    - "所有按钮定义 hover / active / disabled / loading 四态"
    - "空状态统一模板：无数据 / 筛选无结果 / 无权限"
    - "错误提示统一：API失败 / 网络错误 / 超时 / 权限不足"
    - "表单校验触发时机统一（实时/失焦/提交）"
    - "加载态统一：骨架屏 / 局部loading / 全屏loading"
    - "弹窗关闭行为统一（点遮罩/点X/ESC行为一致）"
    - "弹窗/抽屉 dirty 检测统一（未保存→二次确认）"
    - "颜色对比度检查（WCAG AA 4.5:1）"
    - "触摸目标最小 44×44px（移动端，HIG标准）"
    - "Design Tokens 完整（色彩/字体/间距/圆角/阴影/图标 6类）"
    - "栅格系统与系统类型匹配（高密度→24列/低密度→6列）"
    - "信息结构完整（页面树/导航层级/信息层级）"
