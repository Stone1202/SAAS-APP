# ============================================
# 设计文档输出规范 — 独立维护的设计产物标准
# 版本：v2.0.0
# 最后更新：2026-07-18
# ============================================
#
# V2.0.0 升级：
#   1. 新增UC追溯引用——每个页面/交互/跳转必须关联PRD的UC编号
#   2. 第2章「信息结构」：每个PG必须标注对应的PRD页面UC
#   3. 第4章「页面交互说明」：每个交互行为必须标注关联的操作UC
#   4. 第8章「交互跳转矩阵」：矩阵列新增「关联UC」
#   5. 新增第9章「PRD UC一致性追溯」（V2.0.0新增）
#   6. 引用 uc-taxonomy.yml 的一致性规则
#
# 定位：设计流程(design-flow.yml)引用的独立输出规范文件
# 维护：每次设计标准调整只需修改本文件，design-flow.yml 通过 standard 引用
# 引用方：design-flow.yml → standard: ".codebuddy/knowledge/common/ux/design-output-standards.yml"
#         ux-agent.md → 输出文档结构引用本文件
# ============================================

version: "2.0.0"
last_updated: "2026-07-18"
taxonomy_ref: ".codebuddy/knowledge/common/flow-standards/uc-taxonomy.yml"

# ============================================
# 一、输出文档结构（8章强制结构）
# ============================================
output_structure:
  total_chapters: 9
  description: |
    设计交互文档必须按9章强制结构输出，缺章不可交付。
    V2.0.0从8章升级为9章（新增第9章 PRD UC一致性追溯）。

  chapters:
    - chapter: 1
      name: "交互原则"
      sections:
        - "1.1 导航模式"
        - "1.2 表单交互模式"
        - "1.3 列表操作模式"
        - "1.4 详情展示模式"
        - "1.5 弹窗/抽屉模式"
        - "1.6 反馈策略（toast/tooltip/confirm/notification/内联提示条）"
      required: true

    - chapter: 2
      name: "信息结构（V2.0.0增强：标注PRD UC引用）"
      sections:
        - "2.1 完整页面树（主页+子页+弹窗+抽屉+浮窗）"
        - "2.2 导航层级结构（一级/二级/面包屑）"
        - "2.3 各页面信息层级（主内容区60%/辅助区25%/操作区15%）"
        - "2.4 UI元素编号清单（每页面的PG/B/BTN/IPT/M编号清单）"
        - "2.5 页面与PRD UC映射表（V2.0.0新增）"
      required: true
      uc_mapping_format: |
        | PG编号 | 页面名称 | 页面类型 | PRD页面UC | PRD FN |
        |--------|----------|----------|-----------|--------|
        | PG-AUD-PC-001 | 审核模板配置 | management_list | UC-AUD-PC-001 | FN-AUD-PC-001 |
        | PG-AUD-PC-002 | 回调模板配置 | management_list | UC-AUD-PC-002 | FN-AUD-PC-002 |

    - chapter: 3
      name: "设计系统（Design Tokens）"
      sections:
        - "3.1 色彩系统（语义化颜色，自动适配浅色/深色模式）"
        - "3.2 字体层级（H1-H6 字号/字重/行高）"
        - "3.3 间距阶梯（8点网格系统）"
        - "3.4 圆角规范"
        - "3.5 阴影层级"
        - "3.6 图标规范"
        - "3.7 组件变体定义（按钮/卡片/表格/输入框等核心组件尺寸变体）"
        - "3.8 材质与效果（如需：液态玻璃/数字纹理）"
      required: true
      token_categories: 6

    - chapter: 4
      name: "页面交互说明（V2.0.0增强：按页面，交互行为标注关联UC）"
      per_page_structure:
        - "页面编号（PG-{系统}-{终端}-{NNN}）"
        - "关联页面UC：UC-{系统}-{终端}-{NNN}（V2.0.0新增）"
        - "布局描述（区域划分+组件层级，标注B区块编号）"
        - "交互行为清单（触发用BTN/IPT编号引用→行为→反馈→后置状态，关联操作UC）"
        - "状态变化（与PRD状态机/业务操作矩阵的对应关系）"
        - "关联流程图节点"
      required: true
      interaction_uc_format: |
        | UI元素编号 | 操作名称 | 操作类型 | 关联操作UC | 触发→行为→反馈→后置 |
        |-----------|---------|---------|-----------|---------------------|
        | PG-AUD-PC-001-IPT01 | 搜索模板 | search | UC-AUD-PC-001-01 | 输入→筛选→列表刷新 |
        | PG-AUD-PC-001-BTN01 | 创建模板 | navigate | UC-AUD-PC-001-03 | 点击→弹窗M01展示 |

    - chapter: 5
      name: "弹窗/抽屉交互说明（V2.0.0增强：标注关联操作UC）"
      per_modal_structure:
        - "弹窗编号（PG-{系统}-{终端}-{NNN}-M{SS}）"
        - "触发条件（入口源页面+源元素编号+前置约束+关联navigate UC）"
        - "布局描述"
        - "按钮行为清单（确认/取消/关闭各自的四态+异常分支，用BTN编号引用+关联操作UC）"
        - "异常处理（API失败/校验失败/超时/权限不足）"
      required: true

    - chapter: 6
      name: "交互一致性检查清单"
      checklist:
        - "所有按钮定义 hover/active/disabled/loading 四态"
        - "空状态统一模板：无数据/筛选无结果/无权限"
        - "错误提示统一：API失败/网络错误/超时/权限不足"
        - "表单校验触发时机统一（实时/失焦/提交）"
        - "加载态统一：骨架屏/局部loading/全屏loading"
        - "弹窗关闭行为统一（点遮罩/点X/ESC行为一致）"
        - "弹窗/抽屉 dirty检测统一（未保存→二次确认）"
        - "颜色对比度检查（WCAG AA 4.5:1）"
        - "触摸目标最小44×44px（移动端，HIG标准）"
        - "Design Tokens完整（色彩/字体/间距/圆角/阴影/图标 6类）"
        - "栅格系统与系统类型匹配（高密度→24列/低密度→6列）"
        - "所有交互行为已关联操作UC（V2.0.0新增）"
      required: true

    - chapter: 7
      name: "页面草图（Markdown表格线框图，V2.0.0增强：标注对应UC）"
      description: "每个页面+弹窗必须有Markdown表格线框图草图"
      per_page_structure:
        - "页面编号（PG-{系统}-{终端}-{NNN}） + 关联UC编号"
        - "草图（Markdown表格线框图，标注UI元素编号）"
        - "UI元素编号清单（该页面的B/BTN/IPT/M编号+名称+说明+关联UC）"
      required: true
      uc_annotation_rule: "草图中每个BTN/IPT旁标注对应的操作UC编号"

    - chapter: 8
      name: "交互跳转矩阵（V2.0.0增强：新增「关联UC」列）"
      description: "覆盖所有页面+弹窗的所有交互跳转，FD按矩阵实现路由，QA按矩阵做跳转测试"
      matrix_columns:
        - "源页面（PG编号）"
        - "源元素（BTN/IPT/M编号）"
        - "触发动作（点击/输入/切换等）"
        - "目标（PG编号或M编号）"
        - "目标类型（页面/弹窗/API调用/页面刷新）"
        - "触发条件（无/校验通过/前置状态等）"
        - "关联FN"
        - "关联UC（V2.0.0新增）"
        - "后置状态"
      required: true

    - chapter: 9
      name: "PRD UC一致性追溯（V2.0.0新增）"
      description: "逐UC校验PRD需求与Design设计的一致性，确保可追溯"
      sections:
        - "9.1 UC→UI元素映射表（逐UC列出对应的Design UI元素）"
        - "9.2 覆盖度检查（每个PRD操作UC是否都有Design交互对应）"
        - "9.3 遗漏项清单（PRD有但Design无，或Design有但PRD无）"
        - "9.4 不一致项（触发元素名称不一致/流程步骤不一致/后置条件不一致）"
      required: true
      consistency_matrix_format: |
        | UC编号 | UC名称 | 操作类型 | PRD触发元素 | Design UI编号 | Design触发元素 | 一致性 | 备注 |
        |--------|--------|----------|-------------|---------------|---------------|--------|------|
        | UC-AUD-PC-001-01 | 搜索审核模板 | search | 搜索框 | PG-AUD-PC-001-IPT01 | 搜索框 | ✓一致 | |
        | UC-AUD-PC-001-03 | 打开创建弹窗 | navigate | 创建按钮 | PG-AUD-PC-001-BTN01 | 创建审核模板 | ✓一致 | |
      completeness_rules:
        - "UC→UI映射必须覆盖所有PRD操作UC"
        - "每个操作UC必须有至少1个Design交互行为对应"
        - "覆盖度 ≥ 100%（= 所有PRD UC都有Design对应）"
        - "遗漏项 = 0"

# ============================================
# 二、UI元素编号体系
# ============================================
ui_element_naming:
  description: |
    UI元素编号贯穿设计文档全链路，从页面→区块→按钮→弹窗，每个元素都有唯一编号。
    交互跳转用编号引用（如 PG-AUDIO-PC-001-BTN01 点击 → 弹出 PG-AUDIO-PC-001-M01）。
    FD开发时按编号定位UI元素，QA按编号做页面跳转测试，handoff回传时按编号标注变更。

  naming_scheme:
    - level: "页面"
      format: "PG-{系统缩写}-{终端缩码}-{NNN}"
      example: "PG-AUDIO-PC-001"
      description: "页面级编号，与需求分析PG编号对齐"

    - level: "区块"
      format: "PG-{系统}-{终端}-{NNN}-B{SS}"
      example: "PG-AUDIO-PC-001-B01"
      description: "页面内区块（表格区/工具栏区/卡片区/筛选区等），SS为两位序号"

    - level: "按钮"
      format: "PG-{系统}-{终端}-{NNN}-BTN{SS}"
      example: "PG-AUDIO-PC-001-BTN01"
      description: "页面内按钮（主操作/次操作/工具栏按钮等）"

    - level: "输入框"
      format: "PG-{系统}-{终端}-{NNN}-IPT{SS}"
      example: "PG-AUDIO-PC-001-IPT01"
      description: "页面内输入框/搜索框/下拉选择等表单元素"

    - level: "弹窗"
      format: "PG-{系统}-{终端}-{NNN}-M{SS}"
      example: "PG-AUDIO-PC-001-M01"
      description: "页面触发的弹窗/抽屉/浮窗，SS为两位序号"

  interaction_reference_format: |
    交互跳转引用格式：{源元素编号} {触发动作} → {目标元素编号}
    示例：PG-AUDIO-PC-001-BTN01 点击 → 弹出 PG-AUDIO-PC-001-M01
    示例：PG-AUDIO-PC-001-M01-BTN02 点击 → 关闭弹窗 + 刷新 PG-AUDIO-PC-001 表格

# ============================================
# 三、页面草图格式规范
# ============================================
sketch_standard:
  format: "markdown_wireframe"
  description: |
    页面草图使用Markdown表格线框图格式（纯文本，IDE可渲染）。
    每个页面+弹窗必须有草图，标注所有UI元素编号。
    草图需体现页面状态（正常/空/加载/错误至少正常态）。
    弹窗草图包含在触发页面的草图中（弹窗浮层效果）。

  example: |
    ┌─────────────────────────────────────────┐
    │ PG-AUDIO-PC-001 词库列表页              │
    ├─────────────────────────────────────────┤
    │ [B01工具栏区]                            │
    │   [BTN01新增词][BTN02导入][BTN03导出]   │
    │   [IPT01搜索框] [IPT02分类筛选]         │
    ├─────────────────────────────────────────┤
    │ [B02表格区]                              │
    │   序号 | 违禁词 | 分类 | 风险 | 状态    │
    │   1   | xxx   | 广告  | 高   | 启用    │
    │   ...                                    │
    ├─────────────────────────────────────────┤
    │ [B03分页区]                              │
    └─────────────────────────────────────────┘

  ui_element_list_example: |
    | 元素编号 | 类型 | 名称 | 说明 |
    |----------|------|------|------|
    | PG-AUDIO-PC-001 | 页面 | 词库列表页 | — |
    | PG-AUDIO-PC-001-B01 | 区块 | 工具栏区 | 新增/导入/导出/搜索 |
    | PG-AUDIO-PC-001-BTN01 | 按钮 | 新增词 | 点击弹出M01 |
    | PG-AUDIO-PC-001-IPT01 | 输入框 | 搜索框 | 实时搜索 |
    | PG-AUDIO-PC-001-M01 | 弹窗 | 新增违禁词弹窗 | BTN01触发 |

# ============================================
# 四、交互跳转矩阵格式规范
# ============================================
jump_matrix_standard:
  description: |
    交互跳转矩阵为独立章节（第8章），覆盖所有页面+弹窗的所有交互跳转。
    FD按矩阵实现页面路由，QA按矩阵做跳转测试，handoff回传时按矩阵标注变更项。

  matrix_format: |
    | 源页面 | 源元素 | 触发动作 | 目标 | 目标类型 | 触发条件 | 关联FN | 后置状态 |
    |--------|--------|----------|------|----------|----------|--------|----------|
    | PG-XXX-001 | BTN01 | 点击 | PG-XXX-001-M01 | 弹窗 | 无 | FN-XXX-001 | 弹窗显示 |
    | PG-XXX-001-M01 | BTN02(保存) | 点击 | PG-XXX-001 | 页面刷新 | 校验通过 | FN-XXX-001 | 表格新增行 |
    | PG-XXX-002 | BTN01(静音) | 点击 | — | API调用 | 告警未处理 | FN-XXX-002 | 卡片状态=已处理 |

  target_types:
    - "页面（跳转到新页面）"
    - "弹窗（弹出模态框/抽屉）"
    - "API调用（不跳转，调用接口）"
    - "页面刷新（刷新当前页面数据）"
    - "关闭弹窗（关闭当前弹窗）"

  completeness_rules:
    - "矩阵必须覆盖所有页面(PG)的所有交互跳转"
    - "矩阵必须覆盖所有弹窗(M)的所有按钮交互"
    - "源元素和目标元素都必须使用UI编号引用"
    - "每行必须包含关联FN（对应需求分析的功能编号）"
    - "API调用类型的行目标为'—'，后置状态描述调用结果"

# ============================================
# 五、文档元信息规范
# ============================================
document_metadata:
  required_fields:
    - "关联PRD版本"
    - "设计日期"
    - "设计师"
    - "审核人"
    - "设计范围：In-Scope / Non-Goals"
    - "系统类型声明（来自BA：后端/前端/终端/密度）"
    - "栅格系统决策（设计师决定：列数/Gutter/Margin/Grid Unit/设计语言）"

# ============================================
# 六、文件路径规范
# ============================================
file_path_standard:
  output_path: "projects/{project}/docs/03-design/{version}/{module}/{platform}/"
  filename: "{项目}-{模块}-交互文档-v{X.Y.Z}.md"
  design_map: "design-map.json（全局设计索引）"

# ============================================
# 七、版本历史
# ============================================
version_history:
  - version: "2.0.0"
    date: "2026-07-18"
    changes: "V2.0.0重大升级：新增UC追溯引用体系——每章标注PRD UC关联、新增第9章PRD UC一致性追溯、引用uc-taxonomy.yml"
  - version: "1.0.0"
    date: "2026-07-17"
    changes: "初始版本，从design-flow.yml V3.1.0抽离，定义8章结构+UI编号+草图+跳转矩阵格式"
