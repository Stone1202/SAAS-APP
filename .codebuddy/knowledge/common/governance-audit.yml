      - id: "D12-07"
        item: "各stage的ai_brain配置完整（activate/brain_version/reasoning_tasks/memory_import）"
        scope: "project-lifecycle.yml各stage"
        severity: "warning"

# ============================================
# AI智能检查（10项自动化扫描）
# ============================================
ai_smart_check:
  description: "AI驱动的自动化扫描，利用搜索工具批量检查"
  
  check_patterns:
    # 旧术语残留扫描
    - id: "AI-01"
      name: "旧术语残留扫描"
      patterns:
        - "七大产物"
        - "权限状态矩阵"
        - "三层测试"
        - "四层测试"
        - "三人验收"
        - "三人模拟"
        - "--type=strategic"
        - "--type=test"
      expected: "0匹配（排除_archive和审计报告/设计方案文档中的历史描述性引用）"
      severity: "error"
      scope: ".codebuddy/configs/ + .codebuddy/agents/"
    
    # 版本号不一致扫描
    - id: "AI-02"
      name: "版本号不一致扫描"
      method: "对比command-spec.yml中引用的workflow版本号与实际workflow.yml版本号"
      scope: "command-spec.yml → configs/workflows/*.yml"
      expected: "0不一致"
      severity: "error"
    
    # 断链扫描
    - id: "AI-03"
      name: "文件引用断链扫描"
      method: "提取所有引用的文件路径，验证文件是否存在"
      scope: "config.yml + command-spec.yml + workflow.yml + agent.md + skill.yml"
      expected: "0断链"
      severity: "error"
    
    # 孤儿技能扫描
    - id: "AI-04"
      name: "孤儿技能扫描"
      method: "检查configs/skills/下每个skill.yml是否被至少一个agent引用"
      expected: "0孤儿"
      severity: "warning"
    
    # TODO空文件扫描
    - id: "AI-05"
      name: "TODO空文件扫描"
      method: "检查knowledge/common/下是否有未填充内容的空文件"
      expected: "0空文件（或已标注status:todo+version+owner）"
      severity: "warning"

    # Agent skills一致性扫描（V2.0.0新增）
    - id: "AI-06"
      name: "Agent skills一致性扫描"
      method: |
        逐个Agent对比config.yml中的skills数组与Agent YML中的skills列表：
        1. 提取config.yml中每个agent的skills数组
        2. 提取每个Agent YML中的skills列表
        3. 对比集合是否完全一致
      scope: "config.yml → configs/agents/*.yml"
      expected: "11个Agent全部一致"
      severity: "error"
    
    # brain_capability完整性扫描（V2.0.0新增）
    - id: "AI-07"
      name: "brain_capability完整性扫描"
      method: |
        检查11个Agent YML是否都有brain_capability声明段：
        1. 搜索brain_capability关键词
        2. 确认每个Agent YML有1个匹配
        3. 确认声明包含brain_id/brain_name/workflow_ref/reasoning_modules/memory_spec
      scope: "configs/agents/*.yml"
      expected: "11个Agent全部有完整brain_capability声明"
      severity: "error"
    
    # 知识库路径一致性扫描（V2.0.0新增）
    - id: "AI-08"
      name: "知识库路径一致性扫描"
      method: |
        搜索所有文件中的knowledge路径引用，确认：
        1. 无旧路径 knowledge/{project}/ 残留（应为 knowledge/projects/{project}/）
        2. 无 knowledge/projects/projects/ 双重projects错误
        3. 无 {PREFIX} 残留（应为 {系统缩写}）
      patterns:
        - "knowledge/\\{project\\}/[^p]"
        - "knowledge/projects/projects/"
        - "\\{PREFIX\\}"
      expected: "0匹配"
      severity: "error"
      scope: ".codebuddy/ 全目录"
    
    # 命令注册完整性扫描（V2.0.0新增）
    - id: "AI-09"
      name: "命令注册完整性扫描"
      method: |
        三层对比确认19个命令全部注册：
        1. config.yml中commands列表
        2. command-spec.yml中命令定义
        3. ~/.codebuddy/commands/中命令模板.md
        三层必须完全对齐
      scope: "config.yml + command-spec.yml + ~/.codebuddy/commands/"
      expected: "19个命令三层全部对齐"
      severity: "error"
    
    # 编号体系一致性扫描（V2.0.0新增）
    - id: "AI-10"
      name: "编号体系一致性扫描"
      method: |
        检查编号格式是否统一为方案B扩展：
        1. FN/UC/PG格式：FN-{系统缩写}-{终端缩码}-{NNN}
        2. MD/SC/ENT/BR格式：MD-{系统缩写}-{NNN}
        3. BG/BO格式：BG-{PREFIX}-{NNN}
        4. CONFIG/METRIC格式：CONFIG-{系统缩写}-{NNN}
        5. 无{PREFIX}残留在FN/UC/PG/MD/SC/ENT中
      scope: "doc-standards.yml + 所有引用编号的文件"
      expected: "0格式错误"
      severity: "error"

