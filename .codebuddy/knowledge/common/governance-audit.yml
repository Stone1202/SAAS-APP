# ============================================
# 检查执行流程
# ============================================
execution_flow:
  description: "全局深度检查的执行步骤"
  
  steps:
    - step: 1
      name: "触发确认"
      actor: "PM Agent"
      action: "PM检测到流程变更，询问用户「是否执行全局深度走查？」"
    
    - step: 2
      name: "AI智能检查（并行10项）"
      actor: "AI（搜索工具）"
      action: |
        并行执行AI-01~AI-10自动化扫描：
        - AI-01 旧术语残留扫描
        - AI-02 版本号不一致扫描
        - AI-03 文件引用断链扫描
        - AI-04 孤儿技能扫描
        - AI-05 TODO空文件扫描
        - AI-06 Agent skills一致性扫描
        - AI-07 brain_capability完整性扫描
        - AI-08 知识库路径一致性扫描
        - AI-09 命令注册完整性扫描
        - AI-10 编号体系一致性扫描
    
    - step: 3
      name: "12维度检查（并行子Agent）"
      actor: "4个并行子Agent"
      action: |
        启动4个并行子Agent，每个覆盖3个维度：
        - 子Agent1：D1(单点)+D7(版本一致性)+D10(一致性Agent)
        - 子Agent2：D2(流程)+D3(衔接)+D11(SDL完整性)
        - 子Agent3：D4(完整度)+D8(安全合规)+D9(知识库一致性)
        - 子Agent4：D5(专业度)+D6(效率)+D12(AI大脑完整性)
    
    - step: 4
      name: "8专家视角检查（并行）"
      actor: "8个专家视角"
      action: |
        8个专家视角并行检查：
        - PM视角（管控一致性）
        - BA视角（需求分析完整度）
        - Arch视角（架构一致性）
        - QA视角（测试覆盖度）
        - UX视角（设计完整度）
        - Doc视角（文档规范度）
        - SDL专家视角（场景驱动学习方法论完整性）
        - AI大脑专家视角（AI大脑体系完整性）
    
    - step: 5
      name: "历史问题检查（防复发）"
      actor: "AI"
      action: |
        逐项确认H-01~H-26历史问题检查项，确保已修复问题未复发。
    
    - step: 6
      name: "汇总审计报告"
      actor: "PM Agent"
      action: |
        汇总所有检查结果，输出审计报告：
        - 按严重度分组（❌严重/⚠️警告/ℹ️提示）
        - 按维度分组（12维度+10项AI检查+8专家视角+26历史检查）
        - 每个问题标注文件路径+具体问题
        - 给出修复优先级（P0/P1/P2）
        - 综合评分（满分100，按维度权重加权）
    
    - step: 7
      name: "用户确认修复"
      actor: "PM Agent + 用户"
      action: |
        PM展示审计报告，询问用户：
        「全局深度走查完成，发现{N}个问题（❌严重{X}/⚠️警告{Y}/ℹ️提示{Z}）。
         是否修复？
         1. 全部修复（P0+P1+P2）
         2. 仅修复严重问题（P0）
         3. 暂不修复（记录到Journal）」
    
    - step: 8
      name: "执行修复"
      actor: "AI Agent"
      action: "按用户选择的修复范围执行修复"
    
    - step: 9
      name: "修复后验证"
      actor: "AI（搜索工具）"
      action: "修复后重新执行AI智能检查，确认0 lint错误"
    
    - step: 10
      name: "归档"
      actor: "PM Agent"
      action: |
        审计报告归档到 audit-reports/ 目录
        流程版本变更总账.md 追加审计记录

# ============================================
# 修复优先级
# ============================================
fix_priority:
  P0:
    description: "立即修复（影响功能正确性）"
    severity: "error"
    examples: "版本不匹配/断链/产物缺失/命令未注册/路径不一致/skills不一致/brain声明缺失"
  
  P1:
    description: "近期修复（影响一致性）"
    severity: "warning"
    examples: "结构化参数缺失/版本号缺失/产物条目缺失/索引文件过时"
  
  P2:
    description: "可选修复（提升质量）"
    severity: "info"
    examples: "版本字段补充/空文件清理/旧文档归档"

# ============================================
# 审计报告格式
# ============================================
report_format:
  filename: "全局深度审计报告-V{version}-{date}.md"
  location: ".codebuddy/knowledge/common/audit-reports/"
  structure:
    - "审计日期/范围/版本/方法"
    - "审计结果汇总（严重度统计表+维度评分表）"
    - "AI智能检查结果（10项）"
    - "12维度检查结果（按维度分组，每项含文件路径+问题+修复方案）"
    - "8专家视角检查结果"
    - "历史问题防复发检查结果（26项）"
    - "修复优先级矩阵（P0/P1/P2）"
    - "审计结论（综合评分+维度权重评分+整体评价+改进建议）"

# ============================================
# 评分标准（V2.0.0细化）
# ============================================
scoring:
  full_score: 100
  deduction:
    error: 2  # 每个error扣2分
    warning: 1  # 每个warning扣1分
    info: 0  # info不扣分
  
  # V2.0.0新增：维度权重评分
  dimension_weights:
    D1_单点检查: 8
    D2_流程检查: 10
    D3_衔接检查: 10
    D4_完整度检查: 8
    D5_专业度检查: 8
    D6_效率检查: 8
    D7_版本一致性: 10
    D8_安全合规: 8
