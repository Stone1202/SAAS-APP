# ============================================
# 全局深度检查机制 V2.0.0
# ============================================
# 定位：全局共享的治理检查机制，定义检查维度、检查项、专家视角、AI智能检查、触发规则
# 关联：project-lifecycle.yml（重大流程调整后触发询问）/ 流程版本变更总账.md（变更后触发）
# 用法：每次重大流程调整后，PM询问用户"是否进行全面走查"，用户确认后按本文件执行
# 版本：v2.0.0
# 创建日期：2026-07-17
# V2.0.0升级日期：2026-07-21
# ============================================
#
# V2.0.0升级内容（基于V5.1.0~V5.3.0全部审计经验）：
#   1. 维度从8个扩展到12个（新增D9知识库一致性/D10 Agent一致性/D11 SDL完整性/D12 AI大脑完整性）
#   2. AI智能检查从5项扩展到10项（新增AI-06~AI-10）
#   3. 专家视角从6个扩展到8个（新增SDL专家/AI大脑专家）
#   4. 新增历史问题检查项清单（V5.1.0的25个问题+V5.2.1路径统一+V5.3.0流程优化）
#   5. 新增流程优化效果验证（checkpoint数/沉淀步骤数/Review合并/经验分层/路径一致性）
#   6. 评分标准细化（新增维度权重）
# ============================================

version: "2.0.0"
description: |
  全局深度检查机制V2.0.0。定义12维度检查+10项AI智能检查+8专家视角检查+触发规则+修复优先级。
  基于V5.1.0~V5.3.0全部审计经验，覆盖流程/Agent/Skill/知识库/SDL/AI大脑/部署/安全全链路。

# ============================================
# 触发规则
# ============================================
trigger:
  description: "每次重大流程调整后，PM 主动询问用户是否进行全面走查"
  trigger_conditions:
    - condition: "流程版本变更（任何 workflow.yml 版本号升级）"
      action: "PM 询问：「检测到流程版本变更（{变更内容}），是否执行全局深度走查？」"
    - condition: "新增/删除文件（新增流程/Agent/技能/知识库文件）"
      action: "PM 询问：「检测到文件结构变更（{新增/删除清单}），是否执行全局深度走查？」"
    - condition: "术语批量修改（跨多文件的统一术语调整）"
      action: "PM 询问：「检测到术语批量修改，是否执行全局深度走查确保一致性？」"
    - condition: "编号体系变更"
      action: "PM 询问：「检测到编号体系变更，是否执行全局深度走查确保追溯链完整？」"
    - condition: "路径体系变更（知识库路径/项目路径/部署路径）"
      action: "PM 询问：「检测到路径体系变更，是否执行全局深度走查确保路径一致性？」"
    - condition: "用户主动要求"
      action: "用户说「全面检查/走查/审计」时直接触发"
  
  user_response:
    confirm: "用户确认 → 按本文件执行全局深度检查"
    decline: "用户拒绝 → 记录到Journal，本次跳过（下次变更再次询问）"

# ============================================
# 12维度检查框架
# ============================================
audit_dimensions:

  # ========== 维度1：单点检查（每个文件内部一致性） ==========
  - id: "D1"
    name: "单点检查"
    description: "检查每个文件内部的结构完整性和一致性"
    weight: 8
    check_items:
      - id: "D1-01"
        item: "version字段存在且与头部注释一致"
        scope: "所有 .yml 和 .md 文件"
        severity: "error"
      - id: "D1-02"
        item: "trigger_command与config.yml注册命令一致"
        scope: "所有 workflow.yml"
        severity: "error"
      - id: "D1-03"
        item: "owner指向实际存在的agent"
        scope: "所有 workflow.yml"
        severity: "error"
      - id: "D1-04"
        item: "steps/stages有明确id/name/agent/input/output"
        scope: "所有 workflow.yml"
        severity: "warning"
      - id: "D1-05"
        item: "铁律(iron_rules)编号连续无重复"
        scope: "所有含iron_rules的workflow.yml"
        severity: "warning"
      - id: "D1-06"
        item: "产物(output)完整定义"
        scope: "所有 workflow.yml 和 agent .yml"
        severity: "error"
      - id: "D1-07"
        item: "独立version字段存在（非仅注释）"
        scope: "common/*.yml"
        severity: "warning"

  # ========== 维度2：流程检查（workflow内部逻辑） ==========
  - id: "D2"
    name: "流程检查"
    description: "检查流程内部的步骤逻辑、铁律、产物定义、流程优化效果"
    weight: 10
    check_items:
      - id: "D2-01"
        item: "checkpoint标注合理（V5.3.0：3个true+2个false+auto_advance）"
        scope: "project-lifecycle.yml"
        severity: "error"
      - id: "D2-02"
        item: "步骤间input/output衔接（上一步output是下一步input）"
        scope: "所有 workflow.yml"
        severity: "error"
      - id: "D2-03"
        item: "术语统一（无旧术语残留：产物体系/业务操作矩阵/五层测试/四人验收/三人模拟）"
        scope: "全部文件"
        severity: "error"
      - id: "D2-04"
        item: "condition字段标注的步骤是否正确触发/跳过"
        scope: "所有含condition的workflow.yml"
        severity: "warning"
      - id: "D2-05"
        item: "V5.3.0版本沉淀步骤数为3步（非8步）"
        scope: "knowledge-sedimentation.yml"
        severity: "error"
      - id: "D2-06"
        item: "V5.3.0 Review报告合并为1份REV-SUMMARY（非7份独立报告）"
        scope: "knowledge-sedimentation.yml output_layout"
        severity: "error"
      - id: "D2-07"
        item: "V5.3.0经验分层路径完整（project_experience+cross_project+pending_review）"
        scope: "knowledge-sedimentation.yml output_layout"
        severity: "error"
      - id: "D2-08"
        item: "V5.3.0流程改进收集触发（/close后process-improvement-collector）"
        scope: "project-lifecycle.yml stage-8"
        severity: "warning"

  # ========== 维度3：衔接检查（跨文件引用闭环） ==========
  - id: "D3"
    name: "衔接检查"
    description: "检查命令→流程→Agent→技能→知识库的全链路引用闭环"
    weight: 10
    check_items:
      - id: "D3-01"
        item: "命令→流程：config.yml中每个命令的workflow字段指向实际存在的workflow.yml"
        scope: "config.yml → configs/workflows/"
        severity: "error"
      - id: "D3-02"
        item: "流程→Agent：每个workflow.yml的owner/agent指向实际存在的agent"
        scope: "configs/workflows/ → agents/"
        severity: "error"
      - id: "D3-03"
        item: "Agent→技能：每个agent.md引用的skills在configs/skills/中存在"
        scope: "agents/ → configs/skills/"
        severity: "error"
      - id: "D3-04"
        item: "技能→知识库：技能文件引用的common/*.yml存在"
        scope: "configs/skills/ → knowledge/common/"
        severity: "error"
      - id: "D3-05"
        item: "流程→知识库：workflow.yml引用的doc-standards/command-spec/metrics-standards/api-learner存在"
        scope: "configs/workflows/ → knowledge/common/"
        severity: "error"
      - id: "D3-06"
        item: "project-lifecycle.yml中workflow_version与实际workflow版本一致"
        scope: "project-lifecycle.yml → 各workflow.yml"
        severity: "error"
      - id: "D3-07"
        item: "command-spec.yml中workflow版本号与实际workflow版本一致"
        scope: "command-spec.yml → 各workflow.yml"
        severity: "error"
      - id: "D3-08"
        item: "config.yml中命令注册的workflow_file路径正确"
        scope: "config.yml → configs/workflows/"
        severity: "error"
      - id: "D3-09"
        item: "命令模板.md存在于~/.codebuddy/commands/（19个命令）"
        scope: "~/.codebuddy/commands/"
        severity: "error"

  # ========== 维度4：完整度检查（覆盖面无遗漏） ==========
  - id: "D4"
    name: "完整度检查"
    description: "检查各层面的覆盖面是否有遗漏"
    weight: 8
    check_items:
      - id: "D4-01"
        item: "19个命令全部在config.yml和command-spec.yml中注册"
        scope: "config.yml + command-spec.yml"
        severity: "error"
      - id: "D4-02"
        item: "11个Agent的.md和.yml成对存在"
        scope: "agents/ + configs/agents/"
        severity: "error"
      - id: "D4-03"
        item: "agent.md产物列表与对应workflow.yml output一致"
        scope: "agents/ → configs/workflows/"
        severity: "error"
      - id: "D4-04"
        item: "agent.yml output与agent.md产物列表一致"
        scope: "configs/agents/ → agents/"
        severity: "error"
      - id: "D4-05"
        item: "技能无孤儿（每个skill.yml被至少一个agent引用）"
        scope: "configs/skills/ → agents/"
        severity: "warning"
      - id: "D4-06"
        item: "知识库common/*.yml覆盖所有被引用的公共定义"
        scope: "knowledge/common/"
        severity: "warning"
      - id: "D4-07"
        item: "governance-docs/INDEX.md索引文件存在且与实际文件一致"
        scope: "governance-docs/"
        severity: "warning"

  # ========== 维度5：专业度检查（规范性和术语统一） ==========
  - id: "D5"
    name: "专业度检查"
    description: "检查术语统一性、编号体系、追溯链、文档规范"
    weight: 8
    check_items:
      - id: "D5-01"
        item: "编号体系方案B扩展统一（FN/UC/PG含系统+终端，MD/SC/ENT/BR含系统，BG/BO含项目前缀）"
        scope: "doc-standards.yml + 所有引用编号的文件"
        severity: "error"
      - id: "D5-02"
        item: "追溯链完整（UC→FN→PG→MD→SC→BG→BO+CONFIG→BR/FN+METRIC→BG/BO）"
        scope: "doc-standards.yml"
        severity: "error"
      - id: "D5-03"
        item: "PRD章节结构完整（17章+§18 NFR）"
        scope: "doc-standards.yml + requirement-flow.yml"
        severity: "warning"
      - id: "D5-04"
        item: "术语无旧残留（产物体系/业务操作矩阵/五层测试/四人验收/三人模拟 当前统一）"
        scope: "全部文件"
        severity: "error"
      - id: "D5-05"
        item: "命令参数语义隔离（--brainstorm-type/--report-type不与/init --type冲突）"
        scope: "command-spec.yml"
        severity: "error"
      - id: "D5-06"
        item: "编号无{PREFIX}残留（应全部为{系统缩写}）"
        scope: "learn-project.yml + 所有引用编号的文件"
        severity: "error"

  # ========== 维度6：效率检查（冗余和冲突） ==========
  - id: "D6"
    name: "效率检查"
    description: "检查冗余、冲突、空文件、Token消耗"
    weight: 8
    check_items:
      - id: "D6-01"
        item: "无定义冲突（同一概念在多处定义不一致）"
        scope: "全部文件"
        severity: "error"
      - id: "D6-02"
        item: "无TODO占位空文件（或已标注status:todo+version+owner）"
        scope: "knowledge/common/"
        severity: "warning"
      - id: "D6-03"
        item: "无重复定义（同一能力在多个文件中重复实现）"
        scope: "全部文件"
        severity: "warning"
      - id: "D6-04"
        item: "命令模板.md与config.yml/command-spec.yml参数说明对齐"
        scope: "~/.codebuddy/commands/ + config.yml + command-spec.yml"
        severity: "warning"
      - id: "D6-05"
        item: "governance-docs/无旧版本残留（只保留最新版操作手册/方案文档）"
        scope: "governance-docs/"
        severity: "warning"

  # ========== 维度7：版本一致性检查 ==========
  - id: "D7"
    name: "版本一致性检查"
    description: "检查所有文件的版本号和引用版本是否对齐"
    weight: 10
    check_items:
      - id: "D7-01"
        item: "workflow.yml version字段与文件头注释一致"
        scope: "所有 workflow.yml"
        severity: "error"
      - id: "D7-02"
        item: "config.yml引用的workflow版本与实际workflow.yml版本一致"
        scope: "config.yml → workflow.yml"
        severity: "error"
      - id: "D7-03"
        item: "command-spec.yml引用的workflow版本与实际workflow.yml版本一致"
        scope: "command-spec.yml → workflow.yml"
        severity: "error"
      - id: "D7-04"
        item: "agent .md头部版本与最近变更一致"
        scope: "agents/*.md"
        severity: "warning"
      - id: "D7-05"
        item: "DOMAIN-INDEX.yml版本与领域知识文件实际版本一致"
        scope: "DOMAIN-INDEX.yml → domains/*/"
        severity: "warning"
      - id: "D7-06"
        item: "流程版本变更总账.md包含最新变更记录"
        scope: "governance-docs/流程版本变更总账.md"
        severity: "warning"
      - id: "D7-07"
        item: "project-lifecycle.yml中workflow_version引用与实际workflow版本一致（跨文件版本引用）"
        scope: "project-lifecycle.yml → knowledge-sedimentation.yml等"
        severity: "error"

  # ========== 维度8：安全与合规检查 ==========
  - id: "D8"
    name: "安全与合规检查"
    description: "检查安全配置、权限隔离、访问控制"
    weight: 8
    check_items:
      - id: "D8-01"
        item: "敏感字段加密标注（API学习技能Part12中SENSITIVE角色参数encryption≠none）"
        scope: "api-learner.yml + domains/thirdparty/"
        severity: "error"
      - id: "D8-02"
        item: "幂等键唯一性标注（IDEMPOTENT_KEY角色参数有唯一性生成规则）"
        scope: "api-learner.yml"
        severity: "warning"
      - id: "D8-03"
        item: "金额字段校验标注（AMOUNT角色参数有validation校验规则）"
        scope: "api-learner.yml"
        severity: "warning"
      - id: "D8-04"
        item: "项目隔离：.access-control.yml中accessible_projects授权正确"
        scope: ".access-control.yml"
        severity: "error"
      - id: "D8-05"
        item: "部署配置无owner残留（edgeone-pages.json项目隔离格式）"
        scope: "deploy/edgeone-pages.json"
        severity: "error"

  # ========== 维度9：知识库一致性检查（V2.0.0新增） ==========
  - id: "D9"
    name: "知识库一致性检查"
    description: "检查知识库路径、目录结构、三层层级是否正确"
    weight: 8
    check_items:
      - id: "D9-01"
        item: "项目知识库路径统一为knowledge/projects/{project}/（无旧路径knowledge/{project}/残留）"
        scope: "全部文件中的knowledge路径引用"
        severity: "error"
      - id: "D9-02"
        item: "knowledge/顶层只有5个标准目录（coding/common/domains/projects/rules）"
        scope: "knowledge/"
        severity: "error"
      - id: "D9-03"
        item: "知识库三层结构完整（Layer1全局共享+Layer2项目共享+Layer3个人工作过程）"
        scope: "知识库三层结构规范-V1.0.0.md"
        severity: "warning"
      - id: "D9-04"
        item: "经验库3个文件存在（最佳实践库.md/踩坑避雷库.md/Review模式库.md）"
        scope: "knowledge/common/经验库/"
        severity: "error"
      - id: "D9-05"
        item: "经验分层路径完整（projects/{project}/经验/ + common/经验库/ + common/经验库/_pending/）"
        scope: "knowledge-sedimentation.yml output_layout"
        severity: "error"
      - id: "D9-06"
        item: "流程改进待办.yml存在且格式正确"
        scope: "knowledge/common/流程改进待办.yml"
        severity: "warning"
      - id: "D9-07"
        item: "governance-docs/无旧版本残留（只保留最新版）"
        scope: "governance-docs/"
        severity: "warning"

  # ========== 维度10：Agent一致性检查（V2.0.0新增） ==========
  - id: "D10"
    name: "Agent一致性检查"
    description: "检查Agent YML skills/brain_capability与config.yml对齐"
    weight: 8
    check_items:
      - id: "D10-01"
        item: "11个Agent YML的skills列表与config.yml注册的skills完全一致"
        scope: "configs/agents/*.yml → config.yml"
        severity: "error"
      - id: "D10-02"
        item: "11个Agent YML全部有brain_capability声明（brain_id/brain_name/workflow_ref/reasoning_modules/memory_spec）"
        scope: "configs/agents/*.yml"
        severity: "error"
      - id: "D10-03"
        item: "Agent YML的brain_capability.workflow_ref指向实际存在的workflow.yml#ai_brain段"
        scope: "configs/agents/*.yml → configs/workflows/*.yml"
        severity: "error"
      - id: "D10-04"
        item: "Agent .md头部版本与最近变更一致"
        scope: "agents/*.md"
        severity: "warning"
      - id: "D10-05"
        item: "Agent .md的铁律引用与iron-rules-registry.yml一致"
        scope: "agents/*.md → iron-rules-registry.yml"
        severity: "warning"

  # ========== 维度11：SDL完整性检查（V2.0.0新增） ==========
  - id: "D11"
    name: "SDL完整性检查"
    description: "检查场景驱动学习法的步骤、引用、依据链是否完整"
    weight: 8
    check_items:
      - id: "D11-01"
        item: "learn-domain.yml中SDL步骤完整（Step1来源处理+Step4.5 API参数深度提取+Step5校验）"
        scope: "learn-domain.yml"
        severity: "error"
      - id: "D11-02"
        item: "learn-project.yml中SDL步骤完整（Stage2.5隐式场景挖掘+Stage2.8依据链审计+Stage2.9深度还原）"
        scope: "learn-project.yml"
        severity: "error"
      - id: "D11-03"
        item: "scene-learning-standards.yml存在且被正确引用"
        scope: "knowledge/common/scene-learning-standards.yml → learn-project.yml"
        severity: "error"
      - id: "D11-04"
        item: "SDL步骤间交叉引用正确（Stage2.5→2.8→2.9依据链不断裂）"
        scope: "learn-project.yml"
        severity: "error"
      - id: "D11-05"
        item: "api-learner.yml存在且被learn-domain.yml和learn-project.yml引用"
        scope: "knowledge/common/api-learner.yml"
        severity: "warning"

  # ========== 维度12：AI大脑完整性检查（V2.0.0新增） ==========
  - id: "D12"
    name: "AI大脑完整性检查"
    description: "检查大脑激活链、协同链、进化链、记忆持久化是否完整"
    weight: 8
    check_items:
      - id: "D12-01"
        item: "brain_activation_chain完整（8个stage的大脑激活顺序定义）"
        scope: "project-lifecycle.yml brain_orchestration"
        severity: "error"
      - id: "D12-02"
        item: "brain_sync_chain完整（跨stage脑力协同链传递逻辑）"
        scope: "project-lifecycle.yml brain_orchestration"
        severity: "error"
      - id: "D12-03"
        item: "brain_evolution_trigger完整（/close时大脑进化触发逻辑）"
        scope: "project-lifecycle.yml stage-8"
        severity: "error"
      - id: "D12-04"
        item: "brain_memory_persistence完整（记忆持久化到版本沉淀/大脑记忆/）"
        scope: "project-lifecycle.yml + knowledge-sedimentation.yml"
        severity: "error"
      - id: "D12-05"
        item: "brain-memory-spec.yml存在且被11个Agent YML引用"
        scope: "knowledge/common/brain-memory-spec.yml → configs/agents/*.yml"
        severity: "error"
