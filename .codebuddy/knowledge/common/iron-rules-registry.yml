# ============================================
# iron-rules-registry.yml — 全流程铁律注册中心
# 版本：v1.8.0
# 创建：2026-07-17
# 定位：所有Agent铁律的单一事实源，统一编号统一管理
# 引用方：各agent.md声明"遵守iron-rules-registry.yml"，各workflow.yml引用对应Agent的铁律段
# 维护：新增/修改/废弃铁律时只需修改本文件
# 关联方案：audit-reports/POM门禁治理与铁律统一管理架构方案-2026-07-17.md
# ============================================

version: "1.8.0"
last_updated: "2026-07-21"

# V1.8.0新增：PO-08(问题分解+关键链) + BA-29(端到端闭环) + UX-10(设计上下文+趋势+交互)
# V1.7.0新增：LP-01~05 learn-project场景深度还原铁律
# V1.6.0新增：PO-07 实现方式识别+小版本迭代铁律
# V1.5.0新增：BA-28 状态机中文命名铁律
# V1.4.0新增：ARCH-11 NFR主题识别铁律——Arch必须用AI辅助识别非功能需求主题
# V1.3.0新增：Brain铁律——每个注入大脑的Agent增加大脑推理完整性铁律
# 新增：BA-26 PM-09 UX-09 FD-13 ARCH-10 QA-06 AC-06 PO-06
# V1.3.0新增：BA-27 UC六段不可省略铁律——根因修复

# ============================================
# 铁律通用规则
# ============================================
iron_rule_principles:
  numbering: "每个Agent的铁律统一使用 {AGENT_PREFIX}-{NNN} 编号，全局唯一不重复"
  enforcement: "每条铁律标注 enforcement：hard=阻止流程 / soft=警告"
  traceability: "每条铁律标注 workflow_check（在哪个workflow/门禁有可执行检查）"
  version_tracking: "铁律新增/修改/废弃须记录版本变更"
  conflict_resolution: "如agent.md与本文件冲突，以本文件为最终事实源"

# ============================================
# 各Agent铁律（统一编号，单一事实源）
# ============================================
agents:

  # ============================================
  # BS Agent（脑暴主持人）
  # ============================================
  bs_agent:
    prefix: "BS"
    source: "bs-agent.md + brainstorm-standards.yml"
    rules:
      - id: "BS-01"
        rule: "需求描述≠需求文档：--desc只是起点，BS必须展开为结构化脑暴产物"
        enforcement: "hard"
        workflow_check: "gates-registry G-BS-01~03"
      - id: "BS-02"
        rule: "三流草图须标注领域知识参考来源"
        enforcement: "hard"
        workflow_check: "gates-registry G-BS-01"
      - id: "BS-03"
        rule: "BO/BG映射为追溯链链首，必须产出"
        enforcement: "hard"
        workflow_check: "gates-registry G-BS-02"
      - id: "BS-04"
        rule: "领域知识清单必须产出（传递给BA继承）"
        enforcement: "hard"
        workflow_check: "gates-registry G-BS-03"
      - id: "BS-05"
        rule: "脑暴不存在驳回，只有确认或补充后继续"
        enforcement: "hard"
        workflow_check: "brainstorm.yml stage-7"
      - id: "BS-06"
        rule: "confirmed/只保留一份确认稿覆盖式更新+版本概要"
        enforcement: "hard"
        workflow_check: "brainstorm.yml stage-6"
      - id: "BS-07"
        rule: "战略型脑暴须输出战略分析+商业分析产物"
        enforcement: "hard"
        workflow_check: "brainstorm.yml brainstorm_types.strategic"
      - id: "BS-08"
        rule: "脑暴过程中识别到API时必须执行API分析并注入专家讨论"
        enforcement: "hard"
        workflow_check: "brainstorm.yml stage-1.5"
      - id: "BS-09"
        rule: "专家发言须引用领域知识作为技术论据"
        enforcement: "hard"
        workflow_check: "brainstorm.yml stage-3"
      - id: "BS-10"
        rule: "同一项目允许多次脑暴，按议题子目录组织产物"
        enforcement: "hard"
        workflow_check: "brainstorm.yml --topic参数"

  # ============================================
  # BA Agent（业务分析师）— 编号冲突已修复
  # ============================================
  ba_agent:
    prefix: "BA"
    source: "ba-agent.md + requirement-flow.yml + doc-standards.yml"
    note: |
      V1.0.0修复：原ba-agent.md编号11~14重复（V3.1.0新增BA-14~17 vs V3.0.0原有11~14）。
      修复方案：BA-01~BA-13保留，BA-14~BA-17保留（V3.1.0新增），原V3.0.0的11~17重新编号为BA-18~BA-24。
    rules:
      - id: "BA-01"
        rule: "需求描述≠需求文档：--desc只是起点，BA必须展开为结构化产物"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-01~14"
      - id: "BA-02"
        rule: "影响范围是分析结果，非用户预声明：BA必须跑req-impact-analyzer"
        enforcement: "hard"
        workflow_check: "requirement-flow §0.5b"
      - id: "BA-03"
        rule: "终端在§0.0一次性冻结，后续禁止零散重复确认"
        enforcement: "hard"
        workflow_check: "project-lifecycle stage-2 pm_redlines"
      - id: "BA-04"
        rule: "每个User Story必须包含Happy Path + ≥2 Ugly Path + ≥1 Corner Case"
        enforcement: "hard"
        workflow_check: "requirement-flow §2"
      - id: "BA-05"
        rule: "业务流程必须覆盖：主干/分支/异常/跨部门/跨角色/跨系统"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-12"
      - id: "BA-06"
        rule: "状态机必须配套状态过渡操作表"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-05"
      - id: "BA-07"
        rule: "每个FN使用标准用例模板（编号/用例编号/名称/页面/参与者/优先级/关联BG/自动化类型）"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-01/02"
      - id: "BA-08"
        rule: "BR必须独立编号BR-{系统}-{NNN}，声明depends_on依赖链"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-07"
      - id: "BA-09"
        rule: "需求阶段产出接口契约初稿（自然语言）"
        enforcement: "hard"
        workflow_check: "requirement-flow §6"
      - id: "BA-10"
        rule: "版本规划必须包含优先级排序（P0~P3）"
        enforcement: "hard"
        workflow_check: "requirement-flow §4"
      - id: "BA-11"
        rule: "产物体系缺一不可，少任一视为需求分析未完成"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-01~14（14条逐条校验）"
      - id: "BA-12"
        rule: "全类型同步铁律：无论何种类型，REQ产物必须同步更新"
        enforcement: "hard"
        workflow_check: "requirement-flow sync_iron_rule"
      - id: "BA-13"
        rule: "全局文档契约附录：所有产物必须有交叉引用索引"
        enforcement: "hard"
        workflow_check: "requirement-flow §7 global_doc_appendix"
      - id: "BA-14"
        rule: "§0.5不可跳过：旅行地图前必须完成§0.5需求深度分析整合"
        enforcement: "hard"
        workflow_check: "requirement-flow §0.5 checkpoint"
      - id: "BA-15"
        rule: "领域知识深度结合：§0.5a必须引用领域知识Part12和Part13"
        enforcement: "hard"
        workflow_check: "requirement-flow §0.5a 维度5"
      - id: "BA-16"
        rule: "CONFIG必识别：§5详设必须产出集中配置清单(CONFIG)"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-09"
      - id: "BA-17"
        rule: "METRIC引标准：§5详设METRIC必须引用metrics-standards.yml行业标准"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-10"
      # --- 以下为原V3.0.0的11~17，重新编号为BA-18~BA-24（修复编号冲突）---
      - id: "BA-18"
        rule: "BR依赖声明：每个BR须声明depends_on依赖链"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-07"
        note: "原V3.0.0编号11，与BA-14冲突，重新编号为BA-18"
      - id: "BA-19"
        rule: "接口契约初稿：需求阶段须产出接口契约初稿"
        enforcement: "hard"
        workflow_check: "requirement-flow §6"
        note: "原V3.0.0编号12，与BA-15冲突，重新编号为BA-19"
      - id: "BA-20"
        rule: "需求优先级标注：每个FN须标注P0/P1/P2/P3优先级"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-01"
        note: "原V3.0.0编号13，与BA-16冲突，重新编号为BA-20"
      - id: "BA-21"
        rule: "系统类型声明：PRD元信息必须包含system_declaration"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-11"
        note: "原V3.0.0编号14，与BA-17冲突，重新编号为BA-21"
      - id: "BA-22"
        rule: "PRD按业务系统×终端组织（不再按模块组织）"
        enforcement: "hard"
        workflow_check: "doc-standards prd_chapter_structure"
        note: "原V3.0.0编号15，重新编号为BA-22"
      - id: "BA-23"
        rule: "业务操作矩阵：必须产出（四图浓缩产物）"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-06"
        note: "原V3.0.0编号16，重新编号为BA-23"
      - id: "BA-24"
        rule: "视觉设计需求识别：需求分析末尾须询问品牌VI/海报/活动主视觉"
        enforcement: "soft"
        workflow_check: "requirement-flow §7"
        note: "原V3.0.0编号17，重新编号为BA-24"
      - id: "BA-25"
        rule: "系统常识完整性（V3.3.0新增）：§0.5c必须调用system-common-sense-analyzer，AI基于系统类型声明+7层推理模型（身份入口/身份治理/业务功能/信息触达/系统治理/数据分析/体验辅助）发现需求盲区，BA确认后纳入或排除。这不是硬编码检查清单——AI推理结果只是「建议+置信度」，BA做最终决策。"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-15"
        note: "V3.3.0新增：AI增强Agent思考能力，让AI辅助BA发现系统常识盲区，而非硬编码规则"
      - id: "BA-26"
        rule: "大脑推理完整性（V5.1.0新增）：BA大脑必须执行quality_predictor(质量预测推理)+history_correlator(历史关联推理)+brain_memory_import(加载上版本记忆)+brain_sync_export(向UX/Arch/QA输出推理结果)，不可跳过任一步骤"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-16"
      - id: "BA-27"
        rule: "UC六段不可省略（V5.1.1根因修复）：每个UC必须包含①前置条件 ②基本流程(分步编号+[手动]/[系统自动]/[事件驱动]标注) ③备选流程 ④数据范围(R/W) ⑤后置条件 ⑥关联UC，缺任一段视为PRD不合格。token优化不可压缩用例说明内容——优化只针对加载策略和冗余注释，不针对用例说明/验收标准/状态机等核心内容。"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-17"
        note: "V5.1.1根因修复：Sprint 3 PRD初版26个UC中仅1个有完整描述，根因是门禁只检查UC编号存在不检查UC格式完整性+UC模板缺少数据范围和关联UC字段+token优化思维渗透到内容创建"
      - id: "BA-28"
        rule: "状态机中文命名（V5.1.3新增）：状态机图(stateDiagram)节点和状态过渡操作表必须使用中文状态名，不可使用英文原名。英文enum值保留在数据实体(ENT)的status字段定义中。示例：pending→待处理, processing→处理中, completed→已完成, failed→已失败。状态机是给人看的业务文档，中文状态名可读性远高于英文。"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-19"
      - id: "BA-29"
        rule: "端到端闭环+规划边界感知（V5.1.4新增）：BA必须用AI辅助执行规划边界探测（planning_boundary_detector——基于PO Backlog识别In-Scope/Out-of-Scope/边界交叉点）→端到端闭环校验（e2e_closure_analyzer——每个FN做6链闭环检查：入口链/操作链/状态链/异常链/信息链/统计链）→全面用例设计（comprehensive_uc_designer——基于闭环缺口补全UC+四向一致性校验UC↔BR↔状态机↔业务操作矩阵）。BA不是凭空分析，而是在PO规划的边界内做端到端完整闭环——确保每个FN是'端到端完整闭环'而非'功能碎片'。"
        enforcement: "hard"
        workflow_check: "requirement-flow.yml §0.5/§5/§7 + gates-registry G-REQ-20"
        note: "V5.1.4新增：解决BA需求分析不感知PO规划边界、不做端到端闭环校验的问题。"
      - id: "BA-30"
        rule: "多专家联合盲区审查（V5.4.1调整）：BA完成§0.5-§2产物后（场景挖掘后、用例设计前），PM必须启动§2.5多专家联合盲区审查（场景级）。AI根据需求内容匹配18个领域专家，按场景级检查清单审查场景完整性（\"有没有考虑XXX场景？\"）。发现遗漏场景→AI建议方案→成员确认→BA补充场景清单（不是补充用例）→闭环验证。场景清单冻结后作为§3用例设计的输入。迭代需求额外执行涟漪效应分析。用例级检查（边界值/状态覆盖等）保留在§7门禁校验中。这不是可选步骤——行业经验驱动的盲区是BA独自分析无法发现的。"
        enforcement: "hard"
        workflow_check: "requirement-flow.yml §6.5 + gates-registry G-REQ-21"
        note: "V5.4.0新增：解决BA独自分析无法发现行业经验驱动盲区的问题（如防刷机制/定时任务宕机/迭代影响旧指标等）。"
      - id: "BA-31"
        rule: "用例操作级拆分铁律（V5.5.0新增）：每个页面的每个操作必须有独立UC，禁止吞并。列表操作（搜索/排序/筛选/分页/列头自定义排序/查看/导出）+写入操作（新增/编辑/删除/导入/禁用/启用）+行内操作（行内查看/编辑/删除/禁用启用/跳转详情）+表单操作（新建/编辑/审批提交/引用数据选择/校验规则）+批量操作（批量启用/禁用/删除/分配）+导航操作（跳转/Tab切换/弹窗）必须逐个拆分。父FN仅作聚合标题。违反此规则的PRD视为不合格"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-22 + doc-standards.yml subfunction_split"
      - id: "BA-32"
        rule: "表单操作引用数据规则（V5.5.0新增）：表单提交类操作（新建/编辑/审批流）的UC必须包含：①表单字段清单（字段名|类型|必填|引用源|校验规则|默认值）②引用数据关系（引用哪个模块哪个实体|引用方式|级联规则）③提交流程（直接保存/审批流/草稿）④校验规则（前端+后端+关联校验）。禁止只写'填写表单→提交'而不描述引用和校验"
        enforcement: "hard"
        workflow_check: "doc-standards.yml form_operation_standard"
      - id: "BA-33"
        rule: "HTML需求文档截图+用例汇总（V5.5.0新增）：HTML需求文档每个管理页面必须包含①页面截图（实现后真实截图，原型截图无验收价值）②用例汇总表格（该页面所有UC：编号|名称|操作类型|关联FN|优先级）③每个UC详细描述（完整六段）。截图策略L1页面锚点+L2状态增量+L3 UC特写"
        enforcement: "hard"
        workflow_check: "doc-standards.yml html_document_standard"
      - id: "BA-34"
        rule: "空连接禁止铁律（V5.6.0新增）：原型中每个操作按钮必须有对应的交互实现+对应UC。禁止：①按钮点击无反应（空连接/空函数）②按钮只弹Toast'功能开发中'③表单提交无校验/无保存④列表搜索无筛选效果⑤操作按钮无对应UC。违反→设计/开发/测试/验收全环节返工。用例是全流程单一事实源——需求分析得出的用例→设计依据用例全面设计→开发依据用例实现→测试依据用例编写场景→验收依据用例逐个验收"
        enforcement: "hard"
        workflow_check: "doc-standards.yml use_case_traceability + gates-registry G-HO-INJECT-04"
      - id: "BA-35"
        rule: "场景操作类型矩阵必输出（V5.6.0新增）：场景分析阶段（§2/§2.5，用例设计之前）必须输出'场景×操作类型矩阵'——为每个场景/页面识别涉及哪些操作类型（列表10种/写入9种/行内7种/表单9种/批量7种/导航6种/状态5种/交互6种/数据5种/通信5种共10大类69种）。矩阵中标记'有'的操作必须在§5用例设计中编写独立UC。禁止跳过场景分析直接写用例"
        enforcement: "hard"
        workflow_check: "doc-standards.yml scene_operation_matrix + requirement-flow §2/§2.5"
      - id: "BA-36"
        rule: "用例描述质量铁律（V5.7.0新增）：①禁止歧义表述（'适当处理''相关数据'等）②禁止口语化（'搞一下''处理掉'等）③术语一致性（同一概念用相同术语）④步骤编号规范（数字.[标注]描述）"
        enforcement: "hard"
        workflow_check: "doc-standards.yml terminology_standard"
      - id: "BA-37"
        rule: "用例描述专业性铁律（V5.7.0新增）：用例必须使用专业业务术语，禁止口语化。每个UC的六段描述必须清晰、准确、无歧义。PRD Review时检查术语一致性"
        enforcement: "hard"
        workflow_check: "doc-standards.yml terminology_standard"
      - id: "BA-31"
        rule: "三阶段分析不可跳过（V3.4.0新增）：需求分析必须按阶段1业务还原(§3)→阶段2系统划分(§3.5)→阶段3终端划分(§3.8)顺序执行。禁止跳过业务还原直接做系统划分，禁止跳过系统划分直接定终端。业务系统划分是分析结果不是前提——必须先还原真实业务(角色/部门/关键动作)，闭环验证通过后才划分系统，系统闭环验证通过后才定终端。"
        enforcement: "hard"
        workflow_check: "requirement-flow.yml §3/§3.5/§3.8 + gates-registry G-REQ-22/G-REQ-23/G-REQ-24/G-REQ-25"
        note: "V3.4.0新增：解决系统划分和终端划分作为'前提'而非'分析结果'的问题。"
      - id: "BA-32"
        rule: "闭环验证不可跳过（V3.4.0新增）：阶段1必须通过业务闭环验证（7要素：角色人/销售方式/支付方式/谁支付/谁收款/如何结算/结算给谁）+行业对标验证；阶段2必须通过系统闭环验证（9要素：商品创建/展示/下单/支付/发货/查看/售后/处理/系统归属）。未通过闭环验证不得进入下一阶段。业务闭环验证人/钱/货的完整链路，系统闭环验证每个业务环节都有系统归属。"
        enforcement: "hard"
        workflow_check: "gates-registry G-REQ-22(业务闭环) + G-REQ-23(系统闭环)"
        note: "V3.4.0新增：解决业务流程和系统覆盖有断点却不自知的问题。"
      - id: "BA-33"
        rule: "冻结机制（V3.4.0新增）：每阶段扫盲完成后PM展示冻结内容→用户确认→冻结→冻结内容传入下一阶段。用户有补充则退回重新分析→重新展示→重新确认。冻结内容：阶段1=场景清单，阶段2=系统边界+系统间接口清单，阶段3=终端清单+跨端流转路径。冻结后下一阶段基于冻结内容分析，不得随意变更。"
        enforcement: "hard"
        workflow_check: "requirement-flow.yml §3/§3.5/§3.8 checkpoint"

      - id: "BA-34"
        rule: "用例颗粒度分级（V3.5.0新增，V3.5.1增强为14维度按需选择，V3.5.2增强为分析过程驱动）：14维度在分析过程中识别而非文档阶段才思考——Layer1.3 AI多视角维度识别（模拟专家视角基于知识库+经验库+Bug模式）→§2.5专家补盲（验证AI预判+补充遗漏）→§3/§3.5/§3.8三阶段增量更新→§5用例设计时基于已识别维度结构化输出。Level 2+用例按维度选择规则描述涉及的维度。Level 3用例至少涉及3+维度。维度选择规则详见doc-standards.yml use_case_granularity_standard。AI预判准确率在版本沉淀时统计→反馈AI学习进化。"
        enforcement: "hard"
        applies_to: "ba-agent"
        workflow_check: "demand-impact-fusion-flow.yml L1.3 + requirement-flow.yml §2.5+§5 + gates-registry G-REQ-26"
        note: "V3.4.0新增：解决阶段间信息传递随意变更导致下游返工的问题。"

