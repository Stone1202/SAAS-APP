        rule: "大脑推理完整性（V5.1.0新增）：Arch大脑必须执行contract_defect_prediction(契约缺陷预测)+security_pattern_recognition(安全模式识别)+dependency_chain_reasoning(依赖链推理)+brain_memory_import+brain_sync_export，不可跳过任一步骤"
