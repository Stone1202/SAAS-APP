  # ============================================
  # PO Agent（产品负责人）— 补全（原0条）
  # ============================================
  po_agent:
    prefix: "PO"
    source: "po-agent.md"
    rules:
      - id: "PO-01"
        rule: "Backlog优先级排序必须产出"
        enforcement: "hard"
        workflow_check: "po-agent.yml output"
      - id: "PO-02"
        rule: "产品架构须对齐脑暴确认稿的核心方案"
        enforcement: "hard"
        workflow_check: "po-agent.md 三层能力金字塔"
      - id: "PO-03"
        rule: "版本路线图须含商业价值标注"
        enforcement: "hard"
        workflow_check: "po-agent.md roadmap-planner"
      - id: "PO-04"
        rule: "商业价值验收：BO/BG是否实现+ROI验证"
        enforcement: "hard"
        workflow_check: "acceptance-flow stages.po-value"
      - id: "PO-05"
        rule: "/close后PM询问PO下一版本规划（敏捷递归）"
        enforcement: "hard"
        workflow_check: "project-lifecycle close.pm_actions"
      - id: "PO-06"
        rule: "商业大脑推理（V5.1.0新增）：PO大脑在验收阶段必须执行business_value_alignment(商业价值对齐推理)——评估BO/BG达成度+识别商业价值缺口+产出价值缺口清单。PO不可只做功能验收而跳过商业价值评估。"
        enforcement: "hard"
        workflow_check: "gates-registry G-ACC-03"
      - id: "PO-07"
        rule: "实现方式识别+小版本迭代（V5.1.3新增）：PO在规划时必须用AI辅助（implementation_approach_analyzer推理模块）识别每个Backlog项的实现方式（backend_config/code_development/hybrid），配置优先于开发——backend_config项拆为独立patch小版本快速交付，不与code_development项混在同一Sprint。PO必须根据需求目标选择版本粒度（patch/minor/major），每个小版本只需围绕1-2个需求目标完成即可。AI建议仅供参考，PO做最终确认。"
        enforcement: "hard"
        workflow_check: "po-planning-flow.yml po-2/po-4/po-6 + value-assessment-standards.yml V1.1.0 implementation_approach"
        note: "V5.1.3新增：解决PO规划只按价值排序不区分配置/开发方式的问题。如多MPS模板配置可通过腾讯云MPS控制台配置实现，不应作为代码开发Non-Goal。"
      - id: "PO-08"
        rule: "问题分解+关键链+多角色轮询（V5.1.4新增）：PO在规划时必须用AI辅助执行问题分解（problem_decomposer——大问题→问题树，区分主因/次因/依赖）→关键链分析（key_chain_analyzer——6条关键链：问题链/答案链/业务单元链/业务流程链/信息链/状态链）→多角色轮询（multi_stakeholder_facilitator——5轮收敛：问题确认→技术约束→设计影响→综合决策→规划定稿）。PO为决策人，AI为分析员和facilitator。AI不是替代PO思考，而是帮PO把大问题肢解成小问题并找到关键链主干，通过多轮提问让各角色参与，PO做最终决策。"
        enforcement: "hard"
        workflow_check: "po-planning-flow.yml po-2/po-4 + gates-registry G-PO-05"
        note: "V5.1.4新增：解决PO规划只做价值排序不做问题分解和关键链分析的问题。核心是找到主干路径而非平均用力。"
      - id: "PO-09"
        rule: "多专家联合盲区审查-PO规划级（V5.4.1新增）：PO在价值评估后、产品架构前，必须执行po-2.5多专家联合盲区审查（场景级）。AI根据脑暴结论+价值评估匹配18个领域专家，按场景级检查清单审查规划范围完整性（\"规划中有没有考虑XXX场景？\"）。发现遗漏→AI建议方案→PO确认→补充规划范围。不适用项记录原因后续不复发。脑暴保持开放性不扫盲，扫盲在脑暴之后的PO规划中执行。这不是可选步骤——PO如果不知道行业盲区，可能把防刷/容灾/对账等漏掉归为Non-Goals。"
        enforcement: "hard"
        workflow_check: "po-planning-flow.yml po-2.5"
        note: "V5.4.1新增：解决PO规划阶段就遗漏行业盲区的问题。与BA §2.5使用同一套专家清单但审查粒度不同。"

  # ============================================
  # DOC Agent（文档管理）
  # ============================================
  doc_agent:
    prefix: "DOC"
    source: "doc-agent.md"
    rules:
      - id: "DOC-01"
        rule: "文档索引必须自动维护（INDEX.md）"
        enforcement: "hard"
        workflow_check: "config.yml documents.auto_index"
      - id: "DOC-02"
        rule: "文档模板强制执行（template_enforcement: strict）"
        enforcement: "hard"
        workflow_check: "doc-processor技能（含文档验证）"
      - id: "DOC-03"
        rule: "追溯矩阵必须维护（TRACEABILITY_MATRIX.md）"
        enforcement: "hard"
        workflow_check: "config.yml documents.auto_traceability"

  # ============================================
  # Learn Project（项目学习，V1.7.0新增——场景深度还原铁律）
  # ============================================
  learn_project:
    prefix: "LP"
    source: "learn-project.yml + scene-learning-standards.yml"
    rules:
      - id: "LP-01"
        rule: "双态标注合规：🟡隐式挖掘必须附≥2处原文依据链（交叉印证），无依据=推测=违规。AI是深度还原器不是分析推导器——挖掘原本就存在的需求，不加AI自己的想法"
        enforcement: "hard"
        workflow_check: "gates-registry G-LEARN-02"
      - id: "LP-02"
        rule: "场景编排图谱必须产出：还原场景间编排关系（顺序/并行/互斥/循环/依赖），不闭环场景必须记录到学习报告"
        enforcement: "hard"
        workflow_check: "gates-registry G-LEARN-01"
      - id: "LP-03"
        rule: "五大业务产物深度还原必须执行：业务场景(含隐式挖掘)+业务流程图(含异常路径矩阵)+业务信息结构(含血缘)+业务状态机(含隐式状态+完整性)+业务操作矩阵(含四维验证)"
        enforcement: "hard"
        workflow_check: "learn-project.yml Stage 2.6 + gates-registry G-LEARN-03/04"
      - id: "LP-04"
        rule: "挖掘≠创造：挖掘的是原文有碎片但分散的需求（≥2处交叉印证），禁止补充原文完全无线索的内容（如凭行业经验枚举异常）。判定标准：原型作者能从原型找到依据=挖掘（允许）；找不到=创造（禁止）"
        enforcement: "hard"
        workflow_check: "scene-learning-standards.yml dual_state_annotation.forbidden"
      - id: "LP-05"
        rule: "深度还原问题只进学习报告不进PRD正文：不闭环/不一致/缺口/不可达/死状态等问题记录到学习报告'场景流程深度还原报告'章节，🟡隐式挖掘内容可写入PRD正文（标注依据链）"
        enforcement: "hard"
        workflow_check: "learn-project.yml Stage 5 note"

