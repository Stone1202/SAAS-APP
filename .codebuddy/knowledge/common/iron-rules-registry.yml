        rule: "大脑推理完整性（V5.1.0新增）：UX大脑必须执行design_pattern_reasoning(设计模式推理)+interaction_flaw_detection(交互缺陷预检)+accessibility_gap_detection(无障碍合规推理)+terminal_adaptation_reasoning(终端适配推理)+brain_memory_import+brain_sync_export，不可跳过任一步骤"
        enforcement: "hard"
        workflow_check: "gates-registry G-DES-06"
      - id: "UX-10"
        rule: "设计上下文+趋势+交互优化（V5.1.4新增）：UX必须用AI辅助执行设计上下文合成（design_context_synthesizer——加载PO规划+BA需求提取设计相关信息，合成设计上下文摘要）→设计趋势学习（design_trend_learner——基于项目特征推荐设计语言/色彩/布局/交互/动效趋势）→交互体验优化（interaction_experience_optimizer——尼尔森十大原则+5维分析实时优化交互质量）。设计不是凭空画——必须结合PO规划（知道做什么）+BA需求分析（知道用户要什么）+设计领域知识（知道怎么做最好），AI辅助做出更好的设计方案。"
        enforcement: "hard"
        workflow_check: "design-flow.yml + gates-registry G-DES-07"
        note: "V5.1.4新增：解决UX设计不结合上游决策、不学习设计趋势、不实时优化交互体验的问题。"

