# ============================================================
# 全局报错复盘档案（需求文档治理类 · 通用）
# 目的：沉淀 BA/文档/需求分析产出物的根因与防范，跨项目复用。
# 技术类报错（路由/类型/构建）见各项目级 .codebuddy/knowledge/common/incidents.yml。
# 格式：INC-{NNN}: 现象 → 根因 → 修复 → 防范
# 关联：doc-standards.yml（v3.2.0 铁律）、handoff-spec.yml
# ============================================================
version: "1.0.0"

incidents:
  # ---- INC-DOC-002：用例吞并 + 缺页面级用例 + handoff 未定义 ----
  - id: INC-DOC-002
    title: 功能用例吞并原子操作、缺所属页面字段、缺页面级用例、handoff 挂载缺失
    symptom: >
      某 FN 写成单一「XX管理（导入/查询/分层/标签）」用例，把搜索/导入/导出/
      批量禁用启用删除/排序/新增/编辑/查看/禁用/启用/拉黑等原子操作全部忽略；
      UC 缺「所属页面(PG)」字段；有指标统计的页面无页面级用例(PG)；开发无规范
      将需求文档交互说明挂载到高保真原型。
    root_cause: >
      文档标准仅要求标准用例模板，未强制「逐原子操作拆分」「所属页面字段」
      「页面级用例(PG)」「handoff 挂载」，BA 默认把多操作压进单一父用例。
    fix: >
      1) doc-standards.yml v2 升级：铁律④b（子功能拆分禁止吞并）+ 铁律④a
      （用例强制含所属页面字段）+ 铁律⑧（页面级用例 PG：业务流程定位/
      状态机梳理/页面指标统计）+ 铁律⑨（handoff 契约）。
      2) 新增 handoff-spec.yml：开发据高保真功能/页面名检索 PRD →【？】挂载 →
      右侧抽屉交互用例说明卡（含字体规范）。
    prevention: >
      BA 每次产出前通读 doc-standards.yml v2（铁律④/⑧/⑨）；开发侧遵循
      handoff-spec.yml（字体≥12px、右到左抽屉）。

  # ---- INC-DOC-001：BA 需求文档散乱（单文档铁律） ----
  - id: INC-DOC-001
    title: BA 需求文档散乱、无法通过技术评审
    symptom: >
      BA 按端口/模块拆出多份兄弟文档（场景需求/ER/信息流/时序流/业务操作矩阵/
      流程闭环/状态机），主文档仅含旅行节点散文，无 FN/UC/BR/PG/ENT 编号、
      无标准用例模板、无五类图、无双层验收、无指标、无接口标注。
    root_cause: >
      缺少「单一文档铁律 + 编号体系」规范，Agent 默认按端口拆文件，导致散碎。
    fix: >
      1) 合并重写为单一主 PRD（含全系统，前缀 FN-{系统缩写}-{终端缩码}-*，15 章 + 五类图 +
      双层验收 + 指标 + 接口标注 + 检查清单）。
      2) 旧散落文档归档。
    prevention: >
      doc-standards.yml document_model.single_document=true 为强制开关；
      BA 每次产出前须通读本档，违反不进入评审。
