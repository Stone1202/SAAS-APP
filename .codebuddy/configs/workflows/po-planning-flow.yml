# ============================================
# PO产品规划流程（PO Planning Flow）
# 版本: v1.4.0
# 创建日期: 2026-07-18
# 所属议题: POM V5.0 议题二
# V1.3.0升级：新增po-2.5多专家联合盲区审查（规划级扫盲）
# V1.2.0升级：问题分解+关键链分析+多角色轮询（PO AI大脑深度增强）
# V1.1.0升级：AI辅助多维度规划+实现方式识别+小版本多迭代支持
# ============================================
# 设计说明：
#   原stage-0.5 PO Agent内置流程，现独立为标准workflow
#   9阶段：输入加载→四层价值评估+实现方式识别→多专家盲区审查→产品架构→路线图+版本粒度→Backlog生成→Sprint拆解→人确认→交接需求探索
#   V1.1.0新增：AI辅助识别后台可配置项+小版本快迭代策略+版本粒度选择
#   引用 value-assessment-standards.yml V1.1.0（四层价值+7要素+实现方式）
#   引用 sprint-planning-standards.yml V1.1.0（Sprint拆解+小版本迭代）
#   引用 human-confirm-protocol.yml（人确认机制）
# ============================================

version: "1.4.0"
name: "po-planning-flow"
description: "PO产品规划流程——脑暴后/Sprint 0需求探索前的产品规划层（V1.4.0 三阶段思考+环节化扫盲+NFR前移）"
trigger: "脑暴完成后(strategic/planning型) | /close后PM询问下一版本"
agent: "po-agent"
pm_controlled: false

# ============================================
# V1.1.0新增：AI辅助多维度规划大脑
# ============================================
ai_brain:
  id: "po_planning_brain_v1"
  name: "产品规划决策大脑"
  description: |
    PO不再是机械按公式排序——AI辅助PO从多维度分析每个Backlog项的最优实现路径。
    AI帮助PO识别：哪些需求可通过后台配置实现、哪些需要开发、如何拆分小版本快速迭代。
  reasoning_modules:
    - id: "implementation_approach_analyzer"
      name: "实现方式识别"
      description: |
        AI基于领域知识+第三方平台能力文档，推理每个Backlog项的实现方式。
        输入：Backlog项描述 + 领域知识 + 第三方平台能力清单（如腾讯云直播/MPS支持哪些配置）
        输出：实现方式建议（backend_config/code_development/hybrid）+ 置信度 + 依据
        示例：「多MPS模板配置 → 腾讯云MPS控制台支持模板配置 → 建议=backend_config（置信度0.9）」
    
    - id: "iteration_granularity_optimizer"
      name: "迭代粒度优化"
      description: |
        AI基于需求目标数量、实现方式占比、依赖关系，推理最优版本粒度和迭代节奏。
        输入：Backlog项列表（含实现方式标记）+ 需求目标列表 + 依赖关系图
        输出：版本粒度建议（patch/minor/major）+ 迭代节奏建议 + 每小版本目标对齐
        示例：「3个开发目标+2个配置目标 → 建议minor版本含3Sprint开发 + patch版本含配置项」
    
    - id: "goal_alignment_checker"
      name: "目标对齐校验"
      description: |
        AI校验每个小版本的Backlog项是否围绕需求目标，避免偏离。
        输入：小版本Backlog项 + 需求目标列表
        输出：对齐报告（每项目标是否有Backlog项覆盖 + 是否有偏离目标的Backlog项）
        示例：「v1.0.1的BL-015(多MPS模板配置)对齐目标G2(录播合规增强) ✅」

    - id: "problem_decomposer"
      name: "问题分解器（V5.1.4新增）"
      description: |
        AI辅助PO将大需求分解为问题树——不是简单的功能拆分，而是找到问题的因果结构。
        核心理念：大问题肢解成小问题，区分主因/次因，找到问题间依赖关系。
        输入：需求描述 + 脑暴产物 + 领域知识 + 业务目标(BO/BG)
        输出：问题树（根问题→主问题→子问题，每层标注主因/次因/依赖关系）+ 每个子问题的解决方式建议（配置/开发）
        分析维度：
          1. 因果分析：根问题是什么？哪些是主因（不解决则整体不成立）？哪些是次因（优化项）？
          2. 依赖分析：子问题间的前置依赖（A必须先于B解决）和并行关系（A和B可同时解决）
          3. 边界分析：哪些子问题在本次版本范围内？哪些可延后？
        示例：
          「AI内容审核系统」→
          主问题1:实时审核(主因) → 子问题1.1:音频识别(高并发,主因) + 子问题1.2:违规判定(规则引擎,次因) + 子问题1.3:实时处置(关键路径,主因)
          主问题2:录播审核(次因) → 子问题2.1:录像擦音(异步,主因) + 子问题2.2:回放管理(次因)
          主问题3:运营洞察(次因) → 子问题3.1:统计看板(次因)

    - id: "key_chain_analyzer"
      name: "关键链分析器（V5.1.4新增）"
      description: |
        AI从6个维度找关键链（主干）——不是所有问题都同等重要，关键链是必须打通的主干路径。
        输入：问题树 + 领域知识 + 业务流程 + 数据实体 + 状态机
        输出：6条关键链 + 每条链的瓶颈点 + 链间交叉点（关键决策点）
        6大关键链：
          1. 问题链：根问题→子问题的因果依赖路径（为什么这条链是关键？因为断链则整体不成立）
          2. 答案链：每个子问题的解决方案串联（技术方案的端到端可行性验证）
          3. 业务单元链：涉及的业务单元及关系（哪些系统必须协作？边界在哪？）
          4. 业务流程链：端到端流程的关键路径（用户从入口到出口的最短路径）
          5. 信息链：数据流转的关键路径（数据从哪产生→经过哪些处理→到哪消费）
          6. 状态链：状态流转的关键路径（核心实体的状态机主干）
        关键决策点：链间交叉点是需要PO决策的地方（如信息链与状态链交叉=数据一致性决策点）

    - id: "multi_stakeholder_facilitator"
      name: "多角色轮询facilitator（V5.1.4新增）"
      description: |
        AI用不同提问方式与PO/架构部/设计部/其他部门/用户轮番交互，PO为决策人。
        核心理念：AI不是替代各角色讨论，而是facilitate——结构化地引导讨论收敛。
        输入：问题树 + 关键链 + 各角色职责
        输出：多轮讨论纪要 + 每轮决策记录 + 最终规划建议
        轮询节奏（5轮收敛）：
          Round 1 — 问题确认（AI→PO）：确认问题树的主因/次因标注是否准确
          Round 2 — 技术约束（AI→架构部）：关键链上的技术可行性评估
          Round 3 — 设计影响（AI→设计部）：关键链上的UX交互可行性评估
          Round 4 — 综合决策（AI→用户）：关键决策点的trade-off确认
          Round 5 — 规划定稿（AI→PO）：基于讨论结果产出最终版本规划建议
        提问方式（7种，复用human-confirm-protocol）：
          Q1方案选择/Q2边界确认/Q3优先级排序/Q4风险确认/Q5范围确认/Q6视觉调性/Q7自由兜底
        收敛规则：每轮有明确目标，不在目标范围内的问题记录但不展开，避免发散

# ============================================
# 输入
# ============================================
inputs:
  brainstorm_artifacts:
    - "projects/{project}/docs/00-brainstorm/{topic}/confirmed/BR-脑暴文档-确认稿.md"
    - "projects/{project}/docs/00-brainstorm/{topic}/confirmed/STRATEGY-分析.md（仅strategic型）"
    - "projects/{project}/docs/00-brainstorm/{topic}/confirmed/BUSINESS-分析.md（仅strategic型）"
    - "projects/{project}/docs/00-brainstorm/{topic}/confirmed/domain-knowledge-list.yml"
    - "projects/{project}/docs/00-brainstorm/{topic}/confirmed/api-analysis-list.yml（如有）"
  
  iteration_artifacts:         # 迭代场景（/close后下一版本规划）
    - "上一版本沉淀产物（knowledge/projects/{project}/版本沉淀/{version}/）"
    - "上一版本验收结论（PO商业价值验收的缺失项）"
    - "上一版本反馈回流（用户反馈的新需求）"

# ============================================
# 8阶段流程
# ============================================
stages:

  po-1:
    name: "输入加载"
    description: "加载脑暴产物或迭代场景的上一版本沉淀"
    actions:
      - "读取脑暴确认稿"
      - "strategic型：读取战略分析+商业分析"
      - "读取领域知识清单"
      - "迭代场景：读取上一版本沉淀+验收结论+反馈回流"
    output: "输入上下文"

  po-2:
    name: "问题分解 + 四层价值评估 + 实现方式识别（V1.2.0升级）"
    description: "AI辅助问题分解→四层价值+7要素评估→实现方式识别"
    skill_ref: "value-assessor"
    standard_ref: "common/value-assessment-standards.yml"
    ai_brain_modules: ["problem_decomposer", "implementation_approach_analyzer"]
    actions:
      - "V1.2.0新增：AI问题分解（problem_decomposer）——大问题→问题树（主因/次因/依赖）"
      - "四层价值评估（商业+交付+客户+场景闭环）"
      - "公司7要素影响评估（运营/资源/财务/渠道/业务/组织/技术）"
      - "V1.1.0新增：AI辅助实现方式识别（backend_config/code_development/hybrid）"
      - "V1.1.0新增：调整复杂度（配置项×0.2，混合项×0.6，开发项×1.0）"
      - "权重配置（PO声明，需人确认Q3）"
      - "优先级排序（按V1.1.0升级版priority_algorithm）"
      - "四层价值评估（商业+交付+客户+场景闭环）"
      - "公司7要素影响评估（运营/资源/财务/渠道/业务/组织/技术）"
      - "V1.1.0新增：AI辅助实现方式识别（backend_config/code_development/hybrid）"
      - "V1.1.0新增：调整复杂度（配置项×0.2，混合项×0.6，开发项×1.0）"
      - "权重配置（PO声明，需人确认Q3）"
      - "优先级排序（按V1.1.0升级版priority_algorithm）"
    output: "projects/{project}/docs/00.5-product/VALUE-ASSESSMENT-{project}-v{version}.yml"

  po-2.5:
    name: "多专家联合盲区审查（规划级，V5.4.1新增）"
    description: |
      V5.4.1新增：PO在价值评估后、产品架构前，执行场景级盲区审查。
      审查对象：脑暴确认稿 + 四层价值评估结果 + 需求范围
      审查目标：发现规划遗漏的场景/流程/维度
      核心原则：PO如果不知道行业盲区，可能把"防刷""容灾""对账"等漏掉归为Non-Goals
    reference: "common/expert-checklists.yml#scene_level_checklists"
    actions:
      - "AI根据脑暴结论+价值评估匹配专家类型（同BA §2.5的专家匹配规则）"
      - "AI按场景级检查清单审查规划范围完整性"
      - "例：营销专家→'规划中有没有考虑防刷场景？'"
      - "例：架构专家→'规划中有没有考虑定时任务容灾场景？'"
      - "例：数据专家→'规划中有没有考虑统计指标需求？'"
      - "发现遗漏→AI建议方案→PO确认→补充规划范围"
      - "不适用项记录原因（后续版本不再重复审查）"
    output: "projects/{project}/docs/00.5-product/BLINDSPOT-REVIEW-{project}-v{version}.yml"
    note: |
      PO扫盲的价值：PO如果不知道行业盲区，可能把"防刷机制""定时任务容灾"等漏掉，
      归为Non-Goals。扫盲后PO能更准确地界定范围。
      脑暴保持开放性（不扫盲），扫盲在脑暴之后的PO规划中执行。

  po-2.5:
    name: "业务还原（V1.4.0新增：三阶段思考——阶段1）"
    description: "还原真实业务全貌——角色/部门/关键动作/信息流/状态机/场景闭环/行业对标"
    condition: "always"
    actions:
      - "继承BA阶段1业务泳道图（如BA已做），或PO自做业务还原"
      - "还原真实业务：谁参与？做什么？从哪开始？到哪结束？"
      - "信息流分析+状态机分析"
      - "业务闭环验证（7要素：角色人/销售方式/支付方式/谁支付/谁收款/如何结算/结算给谁）"
      - "行业对标验证（行业标准环节覆盖完整性）"
      - "阶段1扫盲（行业专家×业务盲区+NFR技术扫盲——技术专家帮产品经理识别异步/同步/并发等）"
    output: "冻结的场景清单（传入po-3系统划分）"
    expert_registry: ".codebuddy/knowledge/common/expert-registry.yml#ba_analysis.stage1_business"
    note: "PO不能跳过业务还原直接做产品架构——系统划分是分析结果不是前提。"

  po-3:
    name: "产品架构设计（V1.4.0增强：三阶段思考——阶段2系统划分）"
    description: "基于业务还原划分业务系统+系统边界+依赖关系+系统间配合+终端划分"
    condition: "激活层级=战略级"
    actions:
      - "基于po-2.5冻结的业务还原+商业模式(B2C/B2B/F2B2C等)划分业务系统"
      - "匹配行业系统专家(expert-registry.yml#system_experts)提供划分参考"
      - "系统视角泳道图（系统泳道+系统间配合+第三方接口时序图）"
      - "系统闭环验证（9要素：商品创建/展示/下单/支付/发货/查看/售后/处理/系统归属）"
      - "阶段2扫盲（技术专家×系统盲区+NFR技术扫盲）"
      - "冻结系统边界+系统间接口清单"
      - "基于系统划分确定终端（V1.4.0新增：阶段3终端划分）"
      - "终端视角泳道图（终端泳道+跨端流转路径）"
      - "阶段3扫盲（终端专家×终端盲区+NFR技术扫盲）"
      - "冻结终端清单+跨端流转路径"
    output: "projects/{project}/docs/00.5-product/PROD-ARCH-{project}.md（含系统×终端矩阵+终端泳道图）"
    expert_registry: ".codebuddy/knowledge/common/expert-registry.yml#system_experts"
    note: |
      V1.4.0增强——PO必须做三阶段思考：
      阶段2系统划分（基于业务还原，不是凭空划分）
      阶段3终端划分（基于系统划分，不是随意定终端）
      系统专家匹配：根据商业模式匹配（B2C→电商系统专家，SAAS→SAAS平台专家等）

  po-4:
    name: "关键链分析 + 多角色轮询 + 产品路线图（V1.2.0升级）"
    description: "AI关键链分析→多角色轮询讨论→版本里程碑+版本粒度"
    ai_brain_modules: ["key_chain_analyzer", "multi_stakeholder_facilitator", "iteration_granularity_optimizer", "goal_alignment_checker"]
    actions:
      - "V1.2.0新增：AI关键链分析（key_chain_analyzer）——6条关键链（问题/答案/业务单元/业务流程/信息/状态）+瓶颈点+交叉点"
      - "V1.2.0新增：AI多角色轮询（multi_stakeholder_facilitator）——5轮收敛（问题确认→技术约束→设计影响→综合决策→规划定稿）"
      - "基于四层价值评估+关键链分析规划版本里程碑"
      - "定义每版本的商业目标（对照BO/BG）"
      - "梳理版本间依赖关系（基于关键链的依赖分析）"
      - "V1.1.0新增：AI辅助版本粒度选择（patch/minor/major）"
      - "V1.1.0新增：配置项拆为独立patch小版本，开发项排入minor/major版本"
      - "V1.1.0新增：AI校验每个小版本目标对齐（goal_alignment_checker）"
    output: "projects/{project}/docs/00.5-product/PROD-ROADMAP-{project}.yml"

  po-5:
    name: "Backlog生成与优先级排序（V1.1.0升级）"
    description: "四层价值+7要素+实现方式驱动"
    skill_ref: "value-assessor"
    actions:
      - "生成Backlog项（含四层价值评分+7要素影响标记+实现方式标记+目标版本+目标Sprint）"
      - "按V1.1.0升级版priority_algorithm排序（纳入实现方式维度）"
      - "MoSCoW分类（M/S/C/W）"
      - "V1.1.0新增：配置项（backend_config）标记目标版本为patch小版本"
    output: "projects/{project}/docs/00.5-product/PROD-BACKLOG-{project}-v{version}.yml"
    output_schema_ref: "common/value-assessment-standards.yml#backlog_item_schema"

  po-6:
    name: "Sprint拆解（V1.1.0升级）"
    description: "版本→Sprint拆解+每Sprint范围+DoD+依赖+小版本迭代"
    skill_ref: "sprint-planner"
    standard_ref: "common/sprint-planning-standards.yml"
    actions:
      - "选择拆解策略（V1.1.0新增strategy_6小版本快迭代，共6种）"
      - "拆解版本为多个Sprint（或多个小版本×少量Sprint）"
      - "定义每Sprint的DoD"
      - "声明Sprint间依赖"
      - "V1.1.0新增：配置项小版本只需1-2 Sprint，无需五层测试"
    output: "projects/{project}/docs/00.5-product/SPRINT-PLAN-{project}-v{version}.yml"

  po-7:
    name: "人确认"
    description: "按human-confirm-protocol进行人确认"
    standard_ref: "common/human-confirm-protocol.yml"
    confirm_items:
      - "四层价值权重配置 — Q3优先级排序型"
      - "产品架构（系统拆分方式）— Q1方案选择型（仅战略级）"
      - "版本里程碑顺序 — Q3优先级排序型"
      - "Backlog Must/Should划分 — Q3优先级排序型"
      - "Sprint拆解粒度 — Q5范围确认型"
    presentation: "PM呈现批量决策清单（fast/detailed/hybrid三模式）"

  po-8:
    name: "交接需求探索（Sprint 0）"
    description: "PO完成后通知PM立项，PM执行/init"
    handoff_to: "BA Agent（通过PM /init）"
    handoff_artifacts:
      - "PROD-BACKLOG（按Sprint组织的Backlog项）"
      - "SPRINT-PLAN（Sprint拆解计划）"
      - "VALUE-ASSESSMENT（四层价值评估）"
      - "PROD-ARCH（产品架构，如有）"
      - "PROD-ROADMAP（产品路线图）"
    next_action: "PM执行 /init --type=新增|迭代 --desc='v{version}需求清单'"

# ============================================
# 门禁（V5.1.0优化：统一引用gates-registry，不在本地重复定义）
# ============================================
gates_reference: ".codebuddy/knowledge/common/gates-registry.yml#stages.po_planning"
# 门禁定义见 gates-registry.yml → stages.po_planning（G-PO-01~04，单一事实源）

iron_rules_reference: ".codebuddy/knowledge/common/iron-rules-registry.yml#agents.po_agent"
# 铁律定义见 iron-rules-registry.yml → PO-01~09（PO规划铁律，单一事实源）

# ============================================
# 产物归属厘清
# ============================================
product_ownership:
  brainstorm_produces: "发散性探索产物（脑暴文档+战略分析初稿+商业分析初稿）"
  po_produces: "决策性规划产物（产品架构+路线图+Backlog+Sprint计划+价值评估）"
  principle: "两者不重复——脑暴发散探索，PO决策规划"

# ============================================
# 敏捷递归（/close后下一版本）
# ============================================
agile_recursion:
  trigger: "/close完成 + PM版本沉淀完成"
  flow:
    - "PM询问PO：'v{n}已交付，下一版本规划？'"
    - "PO分析：v{n}交付情况+反馈回流+验收结论+路线图"
    - "PO执行po-planning-flow产出v{n+1}的Backlog+Sprint计划"
    - "PM执行/init --type=迭代 --desc='v{n+1}需求清单'"
    - "递归"

# ============================================
# 引用规范
# ============================================
references:
  - "common/value-assessment-standards.yml（四层价值+7要素）"
  - "common/sprint-planning-standards.yml（Sprint拆解）"
  - "common/human-confirm-protocol.yml（人确认机制）"
