# ============================================
# Workflow: design-flow（设计流程 V3.4.0）
# 版本: v3.4.0
# 最后更新: 2026-07-21
# ============================================
#
# V3.4.0 升级：UX AI大脑深度增强——设计上下文合成+设计趋势学习+交互体验优化
#   1. 新增reasoning_modules：design_context_synthesizer/design_trend_learner/interaction_experience_optimizer
#   2. 设计前新增上下文合成——加载PO规划+BA需求提取设计相关信息
#   3. 设计中新增趋势学习——基于项目特征推荐设计语言和趋势
#   4. 设计中新增交互优化——尼尔森十大原则+5维分析实时优化交互质量
#   5. 新增铁律 UX-10：设计上下文+趋势+交互优化
#   6. 新增门禁 G-DES-07：设计上下文完整性
#
# V3.3.0 升级：UX大脑注入（体验洞察大脑）
#   1. 新增 ai_brain 段——UX体验洞察大脑
#   2. 设计模式推理：历史设计决策模式→当前设计模式推荐
#   3. 交互缺陷预检：PRD UC×交互矩阵→交互遗漏/不一致预警
#   4. 无障碍合规推理：WCAG 2.2×组件→无障碍差距检测
#   5. 终端适配推理：多端差异×组件→终端适配风险点
#   6. 大脑记忆导入：BA的brain_sync_export + 上版本UX大脑记忆
#   7. 大脑同步输出→Arch：组件实现难度 + →FD：Design Token消费清单+交互陷阱预警
#
# V3.2.0 升级（对齐用例体系深度优化）：
#   1. 输出文档从8章升级为9章强制结构（新增第9章 PRD UC一致性追溯）
#   2. 引用 uc-taxonomy.yml（页面类型+操作类型体系）
#   3. 每章标注 UC 追溯（页面映射/交互关联/一致性矩阵）
#   4. 版本号从v3.1.0→v3.2.0
#
# V3.1.0 优化调整：
#   1. 输出文档从6章升级为8章强制结构（新增第7章页面草图+第8章交互跳转矩阵）
#   2. 新增UI元素编号体系（PG页面/区块B/按钮BTN/输入框IPT/弹窗M），贯穿交互文档全链路
#   3. 页面草图格式：Markdown表格线框图（纯文本，IDE可渲染），每个页面+弹窗必须有草图
#   4. 交互跳转矩阵：独立章节，源页面/源元素→目标页面/目标弹窗→触发条件→关联FN
#   5. 新增Step 8交互跳转矩阵联合评审（设计团队UX/交互/UI + BA联合，3维度评估：多模块跳转+子页面穿插/模态框使用/交互一致性+流程一致性）
#   6. PM红线新增C-D7（页面草图完整性）+ C-D8（UI编号+交互跳转矩阵完整性）+ C-D9（联合评审通过）
#   7. 版本号从v3.0.0→v3.1.0
#
# V3.0.0 核心升级：
#   1. 设计师在需求分析完成后介入（删除前置参与）
#   2. 3种标准角色+1种可选角色（UX设计师/交互设计师/UI设计师 + 视觉设计师可选）
#   3. 设计流程从2步升级为7步法
#   4. 输出文档从3类升级为6章强制结构
#   5. 设计师决定栅格系统和设计语言（BA只声明系统类型和密度）
#   6. 新增视觉设计范围询问（BA标记visual_design_required时触发）
#   7. PM红线C-D1~D6（新增C-D5 Design Tokens完整性 + C-D6交互一致性检查清单）
#   8. 对齐：尼尔森十大原则 + ISO 9241 + HIG + WCAG 2.2
#
# 核心原则：
#   1. 设计师在需求分析完成后介入，基于PRD进行设计
#   2. BA只声明系统类型和密度，设计师决定栅格和设计语言
#   3. 设计必须覆盖需求的所有状态（正常/空/加载/错误/边界）
#   4. 多端适配基于系统类型声明（BA声明→设计师决定栅格）
#   5. PM红线C-D1~D9缺一则驳回
#   6. 设计产物必须能被FD Agent 1:1还原为代码
#   7. 交互文档9章强制结构（V3.2.0从8章升级为9章）
#   8. 每个页面+弹窗必须有Markdown表格线框图草图（V3.1.0新增）
#   9. UI元素编号贯穿全链路，交互跳转用编号引用（V3.1.0新增）
#   10. 交互跳转矩阵必须经过设计团队+BA联合评审（V3.1.0新增）
# ============================================

workflow:
  id: "design-flow"
  name: "设计流程（V3.3.0 UX体验洞察大脑 + 7步法+1步联合评审 + 页面草图 + UI编号 + 交互跳转矩阵）"
  version: "3.4.0"
taxonomy_ref: ".codebuddy/knowledge/common/flow-standards/uc-taxonomy.yml"
  trigger_command: "/init（PM调度UX，需求分析完成后）"
  owner: "ux-agent"
  gates_reference: ".codebuddy/knowledge/common/gates-registry.yml#stages.design"
  iron_rules_reference: ".codebuddy/knowledge/common/iron-rules-registry.yml#agents.ux_agent"
  supervisor: "pm-agent"
  design_standard: ".codebuddy/knowledge/common/ux/design-system.yml"  # 设计系统(DTO+色彩+字体+栅格)
  ui_components: ".codebuddy/knowledge/common/ux/ui-components.yml"    # V3.0.0: 组件变体定义
  ux_guidelines: ".codebuddy/knowledge/common/ux/ux-guidelines.yml"    # V3.0.0: UX交互规范(尼尔森+HIG)
  output_standard: ".codebuddy/knowledge/common/ux/design-output-standards.yml"  # V2.0.0: 设计文档输出规范(9章结构+UC追溯+UI编号+草图+跳转矩阵)
  review_standard: ".codebuddy/knowledge/common/ux/design-review-criteria.yml"   # V3.1.0: 设计交互评审准则(3维度评估+结论标准)

  # ============================================
  # 角色定义（3标准+1可选）
  # ============================================
  roles:
    standard:
      - role: "UX设计师（灵魂架构师）"
        responsibility: "系统分析 + 信息结构 + 页面布局结构"
        steps: [1, 2, 2.5, 5]
      - role: "UI设计师（视觉化塑造者）"
        responsibility: "Design Tokens + 视觉一致性 + 组件变体 + 视觉回归基线"
        steps: [3]
      - role: "交互设计师（交互细节定义者）"
        responsibility: "交互一致性 + 页面/弹窗交互说明 + 交互文档输出"
        steps: [4, 6, 7]
    optional:
      - role: "视觉设计师（品牌形象大使）"
        responsibility: "品牌VI + 营销海报 + 活动主视觉"
        trigger: "BA标记 visual_design_required = true 时启动"
        steps: [2.5, 3]

  # ============================================
  # BA与设计师职责边界
  # ============================================
  responsibility_boundary:
    ba_decides:
      - "业务后端类型（11类选N）"
      - "业务前端类型（5类选N）"
      - "运行终端（7种+H5选N）"
      - "信息密度（high/low/ultra_high）"
      - "视觉设计是否需要（询问用户后标记）"
    designer_decides:
      - "栅格系统（12列/24列/6列，基于密度和终端决定）"
      - "设计语言（Ant Design/WeUI/HIG/Material）"
      - "Gutter/Margin/Grid Unit"
      - "响应式断点"
      - "组件变体"
      - "Design Tokens"

  # ============================================
  # V3.3.0新增：UX体验洞察大脑
  # ============================================
  ai_brain:
    id: "ux_brain_v1"
    name: "体验洞察大脑"
    description: |
      UX不再是机械执行设计步骤——UX大脑基于历史设计决策模式、
      交互缺陷库和无障碍合规知识库，推理出设计中的潜在体验问题，
      在设计阶段提前发现而非等用户反馈。
    reasoning_modules:
      - id: "design_pattern_reasoning"
        name: "设计模式推理"
        description: |
          基于历史设计决策模式和PRD系统类型声明，AI推理当前项目的最佳设计模式。
          输入：PRD系统类型声明 + 信息密度 + 历史设计决策 + Design Token历史选择
          输出：设计模式推荐（栅格选择+导航模式+布局范式+组件密度建议）
          示例：「B端高密度后台 + 历史同类项目3个→推荐24列栅格+侧边导航+紧凑卡片布局」
      
      - id: "interaction_flaw_detection"
        name: "交互缺陷预检"
        description: |
          AI对照PRD的UC清单与设计产出的交互矩阵，检测交互遗漏和不一致。
          输入：BA FN/UC清单 + UX交互跳转矩阵 + 状态机 + 业务操作矩阵
          输出：交互缺陷清单（UC覆盖遗漏/状态未覆盖/操作反馈缺失/跨端不一致）
          示例：「UC-003(批量删除)在交互矩阵中仅有正常态跳转 → 预警：缺少空状态/部分选中态交互」
      
      - id: "accessibility_gap_detection"
        name: "无障碍合规推理"
        description: |
          AI基于WCAG 2.2标准和HIG无障碍要求，组件级检查设计合规性。
          输入：Design Tokens + 组件变体 + WCAG 2.2规范 + GB/T 37668
          输出：无障碍差距清单（对比度不足/触摸目标过小/缺少焦点管理/缺少ARIA标注）
      
      - id: "terminal_adaptation_reasoning"
        name: "终端适配推理"
        description: |
          当PRD声明多端时，AI推理各端适配风险和差异点。
          输入：BA终端声明（7种+H5） + 页面树 + 栅格选择
          输出：终端适配风险清单（按页面×终端的适配难点+降级策略建议）

      - id: "design_context_synthesizer"
        name: "设计上下文合成器（V5.1.4新增）"
        description: |
          AI加载上游决策（PO规划+BA需求），提取设计相关信息，合成"设计上下文摘要"。
          设计不是凭空画——必须基于上游决策做设计。
          输入：PO的PROD-BACKLOG + PROD-ROADMAP + BA的PRD(系统类型/用户角色/状态机/业务操作矩阵/用户故事)
          输出：设计上下文摘要（1页纸——设计师开工前必读）
          合成维度：
            1. 从PO规划提取：业务系统×终端矩阵（设计范围）、版本粒度（patch=微调/minor=新页面/major=设计系统升级）、实现方式（backend_config=配置页/code_development=完整页面）
            2. 从BA需求提取：系统类型声明（信息密度：高/低/超高）、用户角色矩阵（权限差异设计）、状态机（页面状态变化设计）、业务操作矩阵（按钮可用性设计）、用户故事（核心交互流程）
            3. 设计约束提取：跨版本复用边界（哪些组件可复用）、跨模块依赖边界（哪些数据依赖其他模块）、NFR约束（性能/安全/可用性对设计的影响）
          价值：设计师开工前有完整的上下文，不需要反复翻PRD找信息。

      - id: "design_trend_learner"
        name: "设计趋势学习器（V5.1.4新增）"
        description: |
          AI基于项目特征推荐设计语言和趋势——不是凭经验选设计风格，而是基于项目类型推理最优设计语言。
          输入：项目特征（业务系统类型/终端/信息密度/用户角色）+ 设计上下文摘要
          输出：设计语言推荐 + 趋势参考 + 组件库建议
          推理维度：
            1. 项目特征分析：B端/C端？PC/移动？信息密度高/低？专业用户/普通用户？
            2. 设计语言推荐：基于项目特征匹配最佳设计语言（Ant Design/Arco Design/Semi Design/Material/HIG等）
            3. 色彩趋势：基于业务属性推荐色彩方案（如审核系统=深色导航+警示色强调）
            4. 布局趋势：基于信息密度推荐布局（高密度=紧凑表格+24列栅格，低密度=卡片式+12列栅格）
            5. 交互趋势：基于用户类型推荐交互模式（专业用户=快捷键+批量操作+行内编辑，普通用户=引导式+大按钮+防错）
            6. 动效趋势：微交互推荐（状态变化反馈），避免大面积动画影响性能
          参考设计系统：AI知识库内置主流设计系统参考（Ant Design 5.x/Arco Design/Semi Design/Material 3/HIG）
          价值：设计师不必从零研究设计趋势，AI基于项目特征给出有依据的推荐。

      - id: "interaction_experience_optimizer"
        name: "交互体验优化器（V5.1.4新增）"
        description: |
          AI基于尼尔森十大原则+ISO标准+业务场景，分析交互质量并给出优化建议。
          不是事后检查——在设计方案产出过程中实时分析交互质量。
          输入：设计方案（页面交互+弹窗交互+交互跳转矩阵）+ 设计上下文摘要
          输出：交互优化建议清单（按优先级排序）+ 尼尔森原则校验报告
          分析维度（5维）：
            1. 效率维度：高频操作是否有快捷方式？批量操作是否支持？键盘导航是否完整？
            2. 安全维度：危险操作是否有二次确认？不可逆操作是否有撤销机制？
            3. 反馈维度：操作后是否有即时反馈？状态变化是否可见？
            4. 一致性维度：同类操作交互是否一致？术语是否统一？
            5. 容错维度：输入校验是否前置？错误信息是否可理解？
          尼尔森十大原则校验：
            1.系统状态可见性 2.系统与真实世界匹配 3.用户控制与自由 4.一致性与标准
            5.错误预防 6.识别而非回忆 7.灵活性与效率 8.美学与极简设计
            9.错误识别与恢复 10.帮助与文档
          价值：设计方案产出时就有交互质量保证，而非等QA阶段才发现问题。

      - id: "design_context_synthesizer"
        name: "设计上下文合成器（V5.1.4新增）"
        description: |
          AI加载上游决策（PO规划+BA需求），提取设计相关信息，合成"设计上下文摘要"。
          设计不是凭空画——必须基于上游决策做设计。
          输入：PO的PROD-BACKLOG + PROD-ROADMAP + BA的PRD(系统类型/用户角色/状态机/业务操作矩阵/用户故事)
          输出：设计上下文摘要（1页纸——设计师开工前必读）
          合成维度：
            1. 从PO规划提取：业务系统×终端矩阵（设计范围）、版本粒度（patch=微调/minor=新页面/major=设计系统升级）、实现方式（backend_config=配置页/code_development=完整页面）
            2. 从BA需求提取：系统类型声明（信息密度：高/低/超高）、用户角色矩阵（权限差异设计）、状态机（页面状态变化设计）、业务操作矩阵（按钮可用性设计）、用户故事（核心交互流程）
            3. 设计约束提取：跨版本复用边界（哪些组件可复用）、跨模块依赖边界（哪些数据依赖其他模块）、NFR约束（性能/安全/可用性对设计的影响）
          价值：设计师开工前有完整的上下文，不需要反复翻PRD找信息。

      - id: "design_trend_learner"
        name: "设计趋势学习器（V5.1.4新增）"
        description: |
          AI基于项目特征推荐设计语言和趋势——不是凭经验选设计风格，而是基于项目类型推理最优设计语言。
          输入：项目特征（业务系统类型/终端/信息密度/用户角色）+ 设计上下文摘要
          输出：设计语言推荐 + 趋势参考 + 组件库建议
          推理维度：
            1. 项目特征分析：B端/C端？PC/移动？信息密度高/低？专业用户/普通用户？
            2. 设计语言推荐：基于项目特征匹配最佳设计语言（Ant Design/Arco Design/Semi Design/Material/HIG等）
            3. 色彩趋势：基于业务属性推荐色彩方案（如审核系统=深色导航+警示色强调）
            4. 布局趋势：基于信息密度推荐布局（高密度=紧凑表格+24列栅格，低密度=卡片式+12列栅格）
            5. 交互趋势：基于用户类型推荐交互模式（专业用户=快捷键+批量操作+行内编辑，普通用户=引导式+大按钮+防错）
            6. 动效趋势：微交互推荐（状态变化反馈），避免大面积动画影响性能
          参考设计系统：AI知识库内置主流设计系统参考（Ant Design 5.x/Arco Design/Semi Design/Material 3/HIG）
          价值：设计师不必从零研究设计趋势，AI基于项目特征给出有依据的推荐。

      - id: "interaction_experience_optimizer"
        name: "交互体验优化器（V5.1.4新增）"
        description: |
          AI基于尼尔森十大原则+ISO标准+业务场景，分析交互质量并给出优化建议。
          不是事后检查——在设计方案产出过程中实时分析交互质量。
          输入：设计方案（页面交互+弹窗交互+交互跳转矩阵）+ 设计上下文摘要
          输出：交互优化建议清单（按优先级排序）+ 尼尔森原则校验报告
          分析维度（5维）：
            1. 效率维度：高频操作是否有快捷方式？批量操作是否支持？键盘导航是否完整？
            2. 安全维度：危险操作是否有二次确认？不可逆操作是否有撤销机制？
            3. 反馈维度：操作后是否有即时反馈？状态变化是否可见？
            4. 一致性维度：同类操作交互是否一致？术语是否统一？
            5. 容错维度：输入校验是否前置？错误信息是否可理解？
          尼尔森十大原则校验：
            1.系统状态可见性 2.系统与真实世界匹配 3.用户控制与自由 4.一致性与标准
            5.错误预防 6.识别而非回忆 7.灵活性与效率 8.美学与极简设计
            9.错误识别与恢复 10.帮助与文档
          价值：设计方案产出时就有交互质量保证，而非等QA阶段才发现问题。
    
    memory_import:
      sources:
        - "BA大脑brain_sync_export：UX复杂度评估+多端差异清单+用户场景复杂度"
        - "上版本UX大脑记忆：设计模式选型准确率+交互缺陷预检命中率+无障碍合规通过率"
        - "跨版本设计决策模式库：同类业务系统的Design Token历史选择"
    
    brain_sync_export:
      to_arch: ["组件实现难度清单（按页面/组件+复杂度评分）", "可选技术方案建议"]
      to_fd: ["Design Token消费清单（按组件+必需Token）", "交互陷阱预警（高交互密度+多状态切换的组件）", "无障碍实施清单"]

  # ============================================
  # UI元素编号体系（V3.1.0 新增）
  # ============================================
  # 独立维护：详见 .codebuddy/knowledge/common/ux/design-output-standards.yml → ui_element_naming
  # 编号层级：PG页面 / B区块 / BTN按钮 / IPT输入框 / M弹窗
  # 引用格式：PG-AUDIO-PC-001-BTN01 点击 → 弹出 PG-AUDIO-PC-001-M01
  ui_element_naming:
    standard_ref: ".codebuddy/knowledge/common/ux/design-output-standards.yml#ui_element_naming"

  # ============================================
  # 7步法设计流程
  # ============================================
  steps:
    - id: "1"
      name: "系统分析（UX设计师角色）"
      agent: "ux-agent"
      role: "UX设计师"
      input: "BA的system_declaration（后端/前端/终端/密度）"
      output:
        - "系统分析结论：栅格系统选择 + 设计语言选择 + Grid Unit + 断点定义"
      methodology: |
        基于BA声明的系统类型和密度，设计师决定：
        1. 高密度B端后台 → 24列栅格 / Ant Design / Gutter 16px
        2. 中密度C端Web → 12列栅格 / Bootstrap或自定义 / Gutter 16-24px
        3. 低密度移动端 → 6列栅格 / WeUI/HIG/Material / Gutter 8px
        4. 超高密度数据大屏 → 自定义栅格 / 数据可视化
        定义Container/Columns/Gutter/Margin/Grid Unit/断点

    - id: "2"
      name: "信息结构设计（UX设计师角色）"
      agent: "ux-agent"
      role: "UX设计师"
      input: "PRD的FN/UC清单（按业务系统×终端组织）+ 业务操作矩阵 + 五图"
      output:
        - "完整页面树（主页+子页+弹窗+抽屉+浮窗）"
        - "导航层级结构（一级/二级/面包屑）"
        - "各页面信息层级（主内容区60%/辅助区25%/操作区15%）"
      methodology: |
        依据PRD梳理：
        1. 系统结构框架
        2. 导航结构（一级/二级/面包屑）
        3. 页面层级（主页→子页→弹窗→抽屉→浮窗）
        4. 页面按钮（每个页面的操作入口）
        5. 公共页面（登录/404/错误页/空状态页）
        6. 弹窗框/浮窗（模态/非模态/抽屉/Toast/Notification）
        7. 各页面信息层级

    - id: "2.5"
      name: "视觉设计范围确认（可选，UX设计师角色）"
      agent: "ux-agent"
      role: "UX设计师"
      trigger: "BA标记 visual_design_required = true"
      input: "BA的视觉设计需求标记"
      output:
        - "视觉设计范围定义（品牌VI/海报/活动主视觉/数据大屏定制）"
      methodology: |
        询问用户确认视觉设计范围：
        1. 品牌VI：[是/否] — 是否有现有品牌规范？
        2. 营销海报：[是/否] — 数量和用途？
        3. 活动主视觉：[是/否] — 活动类型和周期？
        4. 数据大屏：[是/否] — 大屏分辨率和场景？
        确认后启动视觉设计师角色

    - id: "3"
      name: "视觉一致性定义（UI设计师角色 + 视觉设计师角色）"
      agent: "ux-agent"
      role: "UI设计师 + 视觉设计师（如启动）"
      input: "Step1系统分析结论 + 现有设计系统 + 品牌规范"
      output:
        - "Design Tokens配置文件（6类：色彩/字体/间距/圆角/阴影/图标）"
        - "组件变体定义（按钮/卡片/表格/输入框等）"
        - "视觉回归基线截图"
        - "品牌VI/海报/活动主视觉（如视觉设计师启动）"
      methodology: |
        1. 色彩系统：语义化颜色（自动适配浅色/深色模式）
        2. 字体层级：H1-H6字号/字重/行高（遵循HIG：避免极细字重）
        3. 间距阶梯：8点网格系统（4/8/12/16/24/32/48px）
        4. 圆角规范：按组件类型分级
        5. 阴影层级：按海拔高度分级
        6. 图标规范：尺寸/风格/使用场景
        7. 材质与效果：如需（液态玻璃/数字纹理）
        8. 组件变体：按钮四态/卡片/表格等

    - id: "4"
      name: "交互一致性定义（交互设计师角色）"
      agent: "ux-agent"
      role: "交互设计师"
      input: "Step1-3产出 + 尼尔森十大原则 + HIG七大原则 + ISO 9241"
      output:
        - "交互一致性规范"
      methodology: |
        1. 按钮四态规范（normal/hover/active/disabled/loading）
        2. 表单校验策略（实时/失焦/提交）
        3. 空状态统一模板（无数据/筛选无结果/无权限）
        4. 错误状态统一模板（API失败/网络错误/超时/权限不足）
        5. 加载态统一模板（骨架屏/局部loading/全屏loading）
        6. 弹窗关闭行为统一（点遮罩/✕/ESC + dirty检测）
        7. 反馈策略（Toast/Tooltip/Confirm/Notification/内联提示条）

    - id: "5"
      name: "关键页面布局结构+页面草图+UI编号（UX设计师角色，V3.1.0增强）"
      agent: "ux-agent"
      role: "UX设计师"
      input: "Step2信息结构 + Step3-4设计系统 + UI元素编号体系"
      output:
        - "关键页面布局结构文档"
        - "页面草图（Markdown表格线框图，V3.1.0新增）"
        - "UI元素编号清单（页面/区块/按钮/输入框/弹窗编号，V3.1.0新增）"
      methodology: |
        每个关键页面输出：
        1. 布局结构描述（主区域划分 + 组件层级）
        2. 标注与PRD流程图节点的对应关系
        3. 标注与业务操作矩阵的状态对应关系
        4. **V3.1.0新增：页面草图（Markdown表格线框图）**
           草图格式要求：
           - 使用Markdown表格绘制页面线框结构
           - 每个区块标注UI编号（B01/B02...）
           - 每个按钮标注UI编号（BTN01/BTN02...）
           - 每个输入框标注UI编号（IPT01/IPT02...）
           - 弹窗标注UI编号（M01/M02...）
           - 草图需体现页面状态（正常/空/加载/错误）
           示例格式：
           ```
           ┌─────────────────────────────────────────┐
           │ PG-AUDIO-PC-001 词库列表页              │
           ├─────────────────────────────────────────┤
           │ [B01工具栏区]                            │
           │   [BTN01新增词][BTN02导入][BTN03导出]   │
           │   [IPT01搜索框] [IPT02分类筛选]         │
           ├─────────────────────────────────────────┤
           │ [B02表格区]                              │
           │   序号 | 违禁词 | 分类 | 风险 | 状态    │
           │   1   | xxx   | 广告  | 高   | 启用    │
           │   ...                                    │
           ├─────────────────────────────────────────┤
           │ [B03分页区]                              │
           └─────────────────────────────────────────┘
           ```
        5. **V3.1.0新增：UI元素编号清单**
           每个页面输出UI元素编号清单表格：
           | 元素编号 | 类型 | 名称 | 说明 |
           |----------|------|------|------|
           | PG-AUDIO-PC-001 | 页面 | 词库列表页 | — |
           | PG-AUDIO-PC-001-B01 | 区块 | 工具栏区 | 新增/导入/导出/搜索 |
           | PG-AUDIO-PC-001-BTN01 | 按钮 | 新增词 | 点击弹出M01 |
           | PG-AUDIO-PC-001-IPT01 | 输入框 | 搜索框 | 实时搜索 |
           | PG-AUDIO-PC-001-M01 | 弹窗 | 新增违禁词弹窗 | BTN01触发 |

    - id: "6"
      name: "逐页面/弹窗交互说明（交互设计师角色）"
      agent: "ux-agent"
      role: "交互设计师"
      skills: ["design-contract-aligner"]
      input: "Step5布局结构 + 业务操作矩阵的操作详情卡"
      output:
        - "页面交互说明（布局+交互行为清单+状态变化+关联流程）"
        - "弹窗/抽屉交互说明（触发+布局+按钮四态+异常分支）"
      methodology: |
        每个页面：布局+交互行为清单（触发→行为→反馈→后置状态，关联FN）+状态变化+关联流程图节点
        每个弹窗/抽屉：触发条件+布局+按钮行为清单（四态+异常分支）+异常处理

    - id: "7"
      name: "输出交互文档（9章强制结构，V3.2.0从8章升级为9章）"
      agent: "ux-agent"
      role: "交互设计师"
      input: "Step1-6全部产出 + UI元素编号清单 + uc-taxonomy.yml（页面类型识别结果）"
      output:
        - "交互文档（9章强制结构）"
        - "design-map.json（全局设计索引）"
      path: "projects/{project}/docs/03-design/{version}/{module}/{platform}/"
      standard: ".codebuddy/knowledge/common/ux/design-output-standards.yml"
      checkpoint: true  # 人工卡点②（V3.0.0新增显式标记）
      methodology: |
        输出规范详见独立文件：.codebuddy/knowledge/common/ux/design-output-standards.yml
        9章强制结构概要（详见独立文件）：
        ① 交互原则（导航/表单/列表/详情/弹窗/反馈 6大模式）
        ② 信息结构（完整页面树+导航层级+信息层级+UI元素编号清单，含UC映射表）
        ③ 设计系统（Design Tokens 6类+组件变体+材质效果）
        ④ 页面交互说明（布局+交互行为清单用UI编号引用+关联UC+状态变化+关联流程）
        ⑤ 弹窗/抽屉交互说明（触发用UI编号引用+布局+按钮四态+关联UC+异常分支）
        ⑥ 交互一致性检查清单
        ⑦ 页面草图（Markdown表格线框图，标注UI元素编号+UC编号）
        ⑧ 交互跳转矩阵（源页面/源元素→目标→触发条件→关联FN→关联UC→后置状态）
        ⑨ PRD UC一致性追溯（UC→UI映射表+覆盖度检查+遗漏项+不一致项，V3.2.0新增）

    # ---- Step 8: 交互跳转矩阵联合评审（V3.1.0 新增）----
    - id: "8"
      name: "交互跳转矩阵联合评审（V3.1.0新增：设计团队+BA联合）"
      agent: "ux-agent + ba-agent"
      role: "UX设计师 + 交互设计师 + UI设计师 + BA"
      input: "Step7交互文档（含第7章页面草图+第8章交互跳转矩阵+第9章UC一致性追溯）+ BA需求文档（FN/UC/业务流程图/状态机/业务操作矩阵）"
      trigger: "Step7交互文档产出后，PM红线检查前"
      standard: ".codebuddy/knowledge/common/ux/design-review-criteria.yml"
      description: |
        交互跳转矩阵联合评审是设计阶段的质量门禁——由设计团队（UX/交互/UI）与BA联合，
        从信息结构、交互专业性、需求对齐三个维度评估交互跳转矩阵的可用性和易用性。
        评审准则详见独立文件：.codebuddy/knowledge/common/ux/design-review-criteria.yml
        评审不通过则UX修改后重新评审，通过后方可进入PM红线检查。
      output:
        - "联合评审报告（3维度评估+问题清单+改进建议+评审结论）"
      checkpoint: true
      methodology: |
        评审准则详见独立文件：design-review-criteria.yml
        核心评估内容（详见独立文件）：
        - 维度1 多模块跳转+子页面穿插（UX+BA）：跨模块路由合理性/子页面穿插/页面层级深度/导航回溯
        - 维度2 模态框使用（交互+BA）：模态框vs页面选择/使用频率/嵌套深度/与业务流程关系
        - 维度3 交互一致性+流程一致性（交互+UI+BA）：交互统一/视觉统一/流程对齐/跨终端一致
        评审结论3级：通过(严重=0且中等=0)/有条件通过(严重=0且中等≤3)/不通过(严重≥1或中等>3)
  pm_redlines:
    - id: "C-D1"
      name: "信息结构完整性（V3.0.0升级）"
      description: "每个业务系统×终端组合必须有完整页面树+导航层级+信息层级"
      check: "逐系统×终端核对：页面树（主页+子页+弹窗+抽屉+浮窗）+ 导航层级 + 信息层级（主内容区/辅助区/操作区）"
      fail_action: "PM驳回，UX补充缺失的信息结构"
    - id: "C-D2"
      name: "组件树+布局"
      description: "每个页面必须有组件树结构和布局描述"
      check: "逐页核对：页面包含的子组件列表 + 布局方式（flex/grid/absolute）"
      fail_action: "PM驳回，UX补充组件树和布局"
    - id: "C-D3"
      name: "交互卡五段"
      description: "每个交互必须覆盖：触发→前置→执行→反馈→后置"
      check: "逐交互核对五段是否齐全"
      fail_action: "PM驳回，UX补充缺失的交互段"
    - id: "C-D4"
      name: "多端归属显式"
      description: "每个页面/组件必须标注适用端（pc/app/miniapp/h5）"
      check: "逐页面/组件核对适用端标注"
      fail_action: "PM驳回，UX补充多端归属"
    - id: "C-D5"
      name: "Design Tokens完整性（V3.0.0新增）"
      description: "Design Tokens必须完整定义6类：色彩/字体/间距/圆角/阴影/图标"
      check: "逐类核对：色彩系统（语义化）+字体层级+间距阶梯（8点网格）+圆角规范+阴影层级+图标规范"
      fail_action: "PM驳回，UX补充缺失的Token类"
    - id: "C-D6"
      name: "交互一致性检查清单完整性（V3.0.0新增）"
      description: "交互一致性检查清单必须完整覆盖所有检查项"
      check: "逐项核对：按钮四态+空状态+错误状态+校验时机+加载态+弹窗关闭+dirty检测+颜色对比度+触摸目标"
      fail_action: "PM驳回，UX补充缺失的检查项"
    - id: "C-D7"
      name: "页面草图完整性（V3.1.0新增）"
      description: "每个页面+弹窗必须有Markdown表格线框图草图，标注UI元素编号"
      check: "逐页面核对：①草图存在 ②UI元素编号标注(B/BTN/IPT/M) ③页面状态体现(至少正常态) ④弹窗草图包含在触发页面中"
      fail_action: "PM驳回，UX补充缺失的页面草图"
    - id: "C-D8"
      name: "UI元素编号+交互跳转矩阵完整性（V3.1.0新增）"
      description: "所有UI元素必须有编号，交互跳转矩阵必须覆盖所有页面+弹窗的跳转"
      check: "①逐页面核对UI元素编号清单完整(PG/B/BTN/IPT/M) ②交互跳转矩阵覆盖所有交互跳转 ③矩阵中源元素和目标元素都用编号引用 ④矩阵包含关联FN"
      fail_action: "PM驳回，UX补充缺失的UI编号或跳转矩阵行"
    - id: "C-D9"
      name: "交互跳转矩阵联合评审通过（V3.1.0新增）"
      description: "交互跳转矩阵必须经过设计团队+BA联合评审且结论为'通过'或'有条件通过'"
      check: "①联合评审报告已产出 ②3维度评估完整（多模块跳转/模态框/一致性） ③评审结论为通过或有条件通过 ④有条件通过的改进事项已闭环"
      fail_action: "PM驳回，UX按评审报告修改后重新联合评审"
      prerequisite: "C-D1~C-D8全部通过后执行C-D9"

  # ============================================
  # 视觉回归基线
  # ============================================
  visual_regression_baseline:
    description: "设计阶段产出作为视觉回归基线，供dev/test阶段对比"
    baseline_path: "projects/{project}/docs/03-design/"
    compare_stages: ["dev", "test"]
    threshold: 0.95

  # ============================================
  # Design Token 强制
  # ============================================
  design_token:
    enabled: true
    source: ".codebuddy/knowledge/common/ux/design-system.yml"
    description: |
      所有设计产物必须引用Design Token，禁止硬编码：
      - 颜色：var(--color-primary-500) 而非 #1890ff（语义化颜色，自动适配深色模式）
      - 字号：var(--font-size-h1) 而非 28px
      - 间距：var(--spacing-16) 而非 16px
    enforcement: "FD Agent开发阶段自动校验Design Token消费"

  # ============================================
  # 无障碍设计（V3.0.0新增）
  # ============================================
  accessibility:
    standards:
      - "WCAG 2.2（Web内容无障碍指南，国际公认）"
      - "GB/T 37668—2019（互联网内容无障碍技术要求）"
      - "GB/T 45445-2025（电商平台适老化通用要求）"
    requirements:
      - "颜色对比度 ≥ WCAG AA 4.5:1"
      - "移动端最小可点击区域 44×44pt（HIG标准）"
      - "支持屏幕阅读器"
      - "支持系统级字体大小调整"

  # ============================================
  # 交互反馈模板
