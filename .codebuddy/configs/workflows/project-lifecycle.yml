    - id: "stage-9"
      name: "自动部署运营（V5.2.0新增 — 多人多项目部署方案）"
      version: "V5.2.0"
      owner: "pm-agent"
      collab: []
      workflow: "deploy-manager"
      workflow_version: "V1.0.0"
      pm_controlled: true
      precondition: "stage-8版本快照完成"
      skill: "deploy-manager"
      description: |
        V1.0.0新增：/close 版本快照完成后自动部署仿真原型到 EdgeOne Pages。
        部署失败不阻断 /close（版本已冻结，可 /deploy 手动重试）。
        部署目标可插拔：默认 EdgeOne Pages，可切换其他平台。
      actions:
        - "**V1.0.0新增：自动部署运营（deploy-manager.yml V1.0.0）：**"
        - "  ① 前置校验：确认 stage-8 版本快照已完成（Git Tag + build:sim 产物存在）"
        - "  ② 读取部署配置：deploy/edgeone-pages.json 获取项目部署配置"
        - "  ③ 注入环境变量：VITE_PROJECT_ID={owner}-{project} + VITE_MODE=sim"
        - "  ④ 执行构建：npm run build:sim（如 stage-8 已构建则复用产物）"
        - "  ⑤ 推送产物到 EdgeOne Pages：产物路径 projects/{owner}/{project}/dist/ → 部署路径 /{owner}/{project}/{version}/"
        - "  ⑥ 生成访问 URL：https://{workspace}.edgeone.app/{owner}/{project}/{version}/"
        - "  ⑦ 更新部署记录："
        - "    - 追加记录到 deploy/DEPLOY-MANIFEST.yml"
        - "    - 更新 PROJECT-INDEX.yml 的 deploy 字段（current_version + deploy_url + deploy_history）"
        - "    - 更新 deploy/access-portal/index.html 访问门户聚合页"
        - "  ⑧ 输出部署结果（URL + 状态 + 耗时 + IndexedDB数据库名）"
        - "  ⑨ 部署失败处理：不阻断/close，标记status=failed+error_msg，提示 /deploy --retry 手动重试"
      output: "部署的仿真原型（EdgeOne Pages URL）+ DEPLOY-MANIFEST.yml 更新 + PROJECT-INDEX.yml deploy字段更新 + access-portal 更新"
      failure_handling:
        blocking: false
        retry: "/deploy --project={project} --retry"
      deploy_target: "edgeone-pages"
      deploy_config: "deploy/edgeone-pages.json"

  # ============================================
  # 回流路由表（V4.0.0：按阶段依次上传，不跳跃）
  # ============================================
  feedback_routing_table:
    - source: "验收问题(AC)"
      upload_path: ["accept", "test", "dev", "arch", "design", "requirement"]
      route_to: "需求分析"
      owner: "ba-agent"
      description: "验收→测试→开发→架构→设计→需求分析，每经停阶段Agent审视"
    - source: "测试问题(QA)"
      upload_path: ["test", "dev", "arch", "design", "requirement"]
      route_to: "需求分析"
      owner: "ba-agent"
      description: "测试→开发→架构→设计→需求分析"
    - source: "开发问题(FD)"
      upload_path: ["dev", "arch", "design", "requirement"]
      route_to: "需求分析"
      owner: "ba-agent"
      description: "开发→架构→设计→需求分析"
    - source: "架构问题(Arch)"
      upload_path: ["arch", "design", "requirement"]
      route_to: "需求分析"
      owner: "ba-agent"
      description: "架构→设计→需求分析"
    - source: "设计问题(UX)"
      upload_path: ["design", "requirement"]
      route_to: "需求分析"
      owner: "ba-agent"
      description: "设计→需求分析"
    - source: "用户补充"
      upload_path: "从当前阶段开始依次上传至requirement"
      route_to: "需求分析"
      owner: "ba-agent"
      description: "从当前阶段开始按节点依次上传"
    precondition: "反馈回流必须在专家Review完成后触发，不可跳过Review"
    transit_rule: "每经过一个中间阶段，该阶段Agent审视是否需本阶段调整（需要→调整/不需要→标注'经由'）"
    cross_version: "未闭环反馈标记'跨版本传递'，下一版本/init自动加载"

  # ============================================
  # 指令与生命周期节点
  # ============================================
  commands:
    init:
      command: "/init"
      description: "开启需求流（V4.2.0：自动检测项目性质+参数路由包传递BA+加载metrics-standards）"
      pm_actions:
        - "V4.2.0：自动检测项目性质（扫描projects/{--project}/），不再交互式询问'新项目/存量项目'"
        - "存量项目：自动检查骨架+加载知识库PRD+版本沉淀+经验库+PO Backlog+领域知识+metrics-standards"
        - "新项目：运行 ensure-project.sh 创建骨架"
        - "版本自动链：取 streams 同 type 已 closed 最大版本 → 按 version_bump 生成"
        - "**V4.0.0新增：扫描上一版本 problem-ledger.md 中标记'跨版本传递'的PBL → 加载为BA需求分析输入**"
        # ↓↓↓ V4.0.1 新增：加载上一版本沉淀 + 经验库 ↓↓↓
        - "**V4.0.1新增：加载上一版本沉淀（knowledge-sedimentation.yml V1.1.0产物）：**"
        - "  ① 扫描 .codebuddy/knowledge/{project}/版本沉淀/VERSION-INDEX.yml"
        - "  ② 取最近版本的沉淀摘要 → 作为BA需求分析的基线参考"
        - "  ③ 加载上一版本 Review经验提炼 → 避免重复踩坑"
        - "  ④ 加载上一版本 lessons-learned → 复用最佳实践"
        - "  ⑤ 加载上一版本 上下游影响矩阵 → 影响范围参考"
        - "  ⑥ **V5.1.0新增：加载上一版本大脑记忆（各Agent大脑记忆快照）→ 注入当前版本各Agent大脑**"
        - "**V4.0.1新增：加载跨项目经验库（如有）：**"
        - "  ① 检查 .codebuddy/knowledge/common/经验库/ 是否存在"
        - "  ② 加载 最佳实践库.md → 作为全阶段背景知识"
        - "  ③ 加载 踩坑避雷库.md → 作为全阶段背景知识"
        - "  ④ 加载 Review模式库.md → 作为各阶段Review参考"
        - "  ⑤ **V5.1.0新增：加载跨项目大脑模式库（如有）→ 初始化各Agent大脑的基础模式**"
        # ↑↑↑ 沉淀+经验库加载结束 ↑↑↑
        - "创建需求流 STR-{nnn} 写入 state.json.streams[]，stage=requirement"
        - "**V4.2.1新增：更新 PROJECT-INDEX.yml**——设置 active_project={project} + 更新对应项目 current_stream + last_activity"
        - "PM 启动需求分析流程，传递：已学PRD上下文 + 跨版本反馈 + 上一版本沉淀 + 经验库 + **PO Backlog优先级（V4.1.0，如有）**"
      usage: "/init --project=X --type=Y --desc=需求描述 [--file=外部需求文件.md] [--api=外部接口文档.md] [--source=local-dir:./docs] [--source=http-url:https://...] [--priority=P0|P1|P2|P3]"
      brain_storm_link: "**V4.2.1新增--brainstorm-topic参数**：若 /init 提供 --brainstorm-topic=议题名，PM 按议题查找 projects/{project}/docs/00-brainstorm/{topic}/confirmed/BR-脑暴文档-确认稿.md 作为 BA 背景输入。同时加载脑暴 confirmed 中的领域知识清单（BA继承）+ API分析清单（BA+Arch继承，V3.4.0）。若未提供 --brainstorm-topic 但 00-brainstorm/ 下只有一个议题子目录，自动加载该议题；多个议题时提示用户选择。脑暴阶段与 /init 阶段均会智能检测项目骨架：存在则复用，不存在则新建。V3.5.0：confirmed/ 为单文件覆盖式更新（BR-脑暴文档-确认稿.md），含版本概要表格。**场景**：脑暴多轮确认后隔一段时间才 /init，通过 --brainstorm-topic 精确关联对应脑暴产物。"
      knowledge_base_link: "存量项目在 /init 前自动匹配 .codebuddy/knowledge/{project}/需求文档/ 下的已学 PRD（全部卷 + 学习报告），作为需求分析上下文。"
      sedimentation_base_link: "**V4.0.1新增**：存量项目在 /init 时自动加载 .codebuddy/knowledge/{project}/版本沉淀/ 下最近版本的沉淀产物（需求快照+Review经验+lessons-learned+追溯链），以及 common/经验库/ 的跨项目经验，作为需求分析和全阶段背景知识。"
      domain_knowledge_link: "**V3.0.1新增，V3.0.3增强**：脑暴阶段（brainstorm.yml v3.2.0 stage-0c）已加载领域知识并产出领域知识清单写入 confirmed/，/init 时 BA 优先继承该清单（避免重复匹配）。若脑暴阶段未执行或清单缺失，BA 自行扫描 .codebuddy/knowledge/domains/ 领域知识库，通过关键词+AI语义匹配加载与需求相关的领域知识（如退款流/分账/进销存等），作为需求分析的行业标准方案参考。缺失时提示用户先执行 /learn-domain 学习。"
      metrics_standards_link: "**V4.2.0新增**：/init 时自动加载 .codebuddy/knowledge/common/metrics-standards.yml 行业统计指标通用规则库（11个行业：电商/财务/物流/仓库/直播/AARRR/广告/CRM/SaaS/教育/医疗）。BA 在 §0.5a 需求深度分析时如涉及'看板/报表/统计/指标/大屏'等关键词，从该库匹配标准指标定义，在 METRIC 产物中引用 industry_standard 字段对齐。"

    feedback:
      command: "/feedback"
      description: "回流（close 前有效，V4.0.0：Review后触发，按阶段依次上传）"
      pm_actions:
        - "绑定当前 stream 的 version（--type 可省略 → 自动选未 close 流）"
        - "**V4.0.0前置：确认专家Review已完成（不可跳过Review直接回流）**"
        - "聚合 test 失败项 + accept 不通过项 + 用户 --msg/自然语言补充 + **Review发现的问题**"
        - "**V4.0.0：按 feedback_routing_table 的 upload_path 依次上传（不跳跃）**"
        - "每经过一个中间阶段，该阶段Agent审视是否需本阶段调整"
        - "最终汇聚到需求分析阶段，BA调整REQ产物"
        - "写入 stream.feedbacks[]，记录回流路径+经停记录"
        - "**V4.0.0：未闭环反馈标记'跨版本传递'**"
      usage: "/feedback --project=X --type=Y [--msg=反馈内容]"

    close:
      command: "/close"
      description: "结束需求流（V4.0.0：Review校验+跨版本标记+版本沉淀学习）"
      pm_actions:
        - "该流 stage=closed，冻结版本"
        - "过程记录簿闭环校验：核对 journal/problem-ledger.md 中归属该版本的所有 PBL 是否全部「已闭环」"
        - "**V4.0.0新增：校验全部8阶段Review报告已产出且通过（reviews/目录下7份REV报告）**"
        - "**V4.0.0新增：扫描未闭环PBL，标记'跨版本传递'并记录建议处理版本**"
        - "追溯链完整性校验（O-10）：逐 FN 校验需求→设计→架构→代码四层追溯"
        - "回退元数据记录（O-12）：记录回退ID/原因/受影响模块/恢复计划"
        - "提炼 projects/{project}/.codebuddy/lessons-learned.yml"
        # ↓↓↓ V4.0.1 新增：版本沉淀学习（knowledge-sedimentation.yml V1.0.0）↓↓↓
        - "**V4.0.1新增：启动版本沉淀学习（PM自动执行，详见 knowledge-sedimentation.yml）：**"
        - "  Step1 创建 .codebuddy/knowledge/{project}/版本沉淀/{version}/ 目录"
        - "  Step2 需求沉淀（PM+BA协作）：PRD+REQ产物体系+模块清单+上下游影响矩阵 → 需求沉淀/"
        - "  Step3 Review沉淀（PM收集+提炼）：7份Review归档 + 提炼Review经验提炼.md（反复问题/最佳实践/阶段薄弱点/Review质量）"
        - "  Step4 经验教训提炼（PM主导）：lessons-learned + 最佳实践 + 踩坑 → 追加到 common/经验库/"
        - "  Step5 追溯链快照（PM+DOC协作）：traceability-v{version}.yml"
        - "  Step6 更新版本索引（PM+DOC协作）：VERSION-INDEX.yml 新增条目 + 关键指标 + 经验标签"
        - "  Step7 沉淀摘要（PM生成）：沉淀摘要.md（概述+清单+指标+经验摘要+质量评分）"
        - "  Step8 Journal记录 + 沉淀完整性校验（不通过则阻止close）"
        - "**沉淀质量评分（0-100）：requirements_completeness(25%)+review_depth(25%)+lessons_actionability(20%)+traceability_coverage(15%)+cross_version_value(15%)**"
        # ↑↑↑ 版本沉淀学习结束 ↑↑↑
        - "上线基线自动标记（strict_guard）：全 close + 无 open Bug + 无 pending feedback + PBL 全闭环 + Review报告全产出 + 追溯链通过 + **版本沉淀完成** + **自动部署完成（V1.0.0新增）**"
        # ↓↓↓ V1.0.0 新增：stage-9 自动部署运营 ↓↓↓
        - "**V1.0.0新增：自动部署运营（stage-9，deploy-manager.yml V1.0.0）：**"
        - "  ① 读取部署配置 deploy/edgeone-pages.json"
        - "  ② 注入环境变量 VITE_PROJECT_ID={owner}-{project} + VITE_MODE=sim"
        - "  ③ 执行 npm run build:sim（如 stage-8 已构建则复用）"
        - "  ④ 推送构建产物到 EdgeOne Pages"
        - "  ⑤ 生成访问 URL: https://{workspace}.edgeone.app/{owner}/{project}/{version}/"
        - "  ⑥ 更新 DEPLOY-MANIFEST.yml + PROJECT-INDEX.yml deploy字段 + access-portal/index.html"
        - "  ⑦ 输出部署结果（URL + 状态 + 耗时 + IndexedDB数据库名）"
        - "  ⑧ 部署失败不阻断/close，提示 /deploy --retry 手动重试"
        # ↑↑↑ stage-9 自动部署运营结束 ↑↑↑
        # ↓↓↓ V1.1.0 新增：自动Git提交 ↓↓↓
        - "**V1.1.0新增：自动Git提交（/close后自动，成员无需手动操作）：**"
        - "  ① git add projects/{owner}/{project}/"
        - "  ② git commit -m 'close: {project} {version} 版本关闭'"
        - "  ③ git push origin {owner}/{project}-v{version}"
        - "  ④ 输出PR创建指引（成员在Gitee点合并即可）"
        # ↑↑↑ 自动Git提交结束 ↑↑↑
        # V4.1.0 敏捷递归闭环
        - "**V4.1.0新增：PM询问PO Agent下一版本规划（敏捷递归闭环）：**"
        - "  版本沉淀完成后，PM 自动询问 PO Agent「v{version} 已交付，下一版本规划？」"
        - "  PO Agent 分析：v1交付情况 + v1反馈回流 + v1验收结论 + 产品路线图"
        - "  PO Agent 产出：PROD-BACKLOG-{project}-v{next}.yml（下一版本需求清单+优先级）"
        - "  PM 执行 /init --type=迭代，BA 基于 PO Backlog 优先级进行需求分析"
        - "  形成 Sprint Planning 自动化：Review→Retrospective(沉淀)→Planning(PO Backlog)→/init v2"
      usage: "/close --project=X --type=Y"

    handoff:
      command: "/handoff"
      description: "交付标注与回传闭环（V4.1.1：移到close之前，AC通过后执行）"
      precondition: "① 验收(AC)已通过 ② 原型开发完成 ③ 测试无 open Bug"
      usage: "/handoff --project=X [--type=Y] [--module=模块名]"
      v4_1_1_change: "三步流程：校验对应性→编辑交互卡→回传BA。循环校验直到无变更才进入/close"

