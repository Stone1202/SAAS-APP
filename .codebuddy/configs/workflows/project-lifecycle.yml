  # ============================================
  # 过程记录簿（Journal）—— PM 全程留痕
  # ============================================
  journal:
    description: "让整个项目管控过程可回溯——发生过什么问题、我们说过什么、每个问题怎么闭环的，全部有账可查。测试期强制全程记录。V4.0.0新增：Review报告也写入Journal。V5.1.0新增：大脑活动日志。"
    carrier:
      conversation_log: "projects/{project}/.codebuddy/journal/conversation-log.md"
      problem_ledger: "projects/{project}/.codebuddy/journal/problem-ledger.md"
      review_reports: "projects/{project}/.codebuddy/journal/reviews/"  # V4.0.0新增
      brain_activity_log: "projects/{project}/.codebuddy/journal/brain-activity-log.md"  # V5.1.0新增
    conversation_log_schema:
      columns: ["时间", "角色", "指令", "阶段", "关联流", "内容摘要", "衍生问题", "大脑状态"]  # V5.1.0新增列
      rules:
        - "每一轮用户输入、每一次 PM 输出（卡点摘要/调度通知/裁决）都追加一行"
        - "保留用户原话关键点，不失真"
        - "本轮产生新问题时在「衍生问题」列填 PBL 编号"
        - "**V5.1.0：每个stage结束时在「大脑状态」列记录当前激活的大脑+推理摘要**"
    problem_ledger_schema:
      fields: ["编号(PBL-{nnn})", "发现时间", "来源", "阶段", "归属流(STR+version+REQ)", "问题描述", "严重级", "路由去向", "状态", "闭环记录", "大脑研判"]  # V5.1.0新增字段
      sources: ["用户反馈", "测试(QA)", "验收(AC)", "架构评审(Arch)", "设计走查(UX)", "PM 巡检", "**大脑预警（V5.1.0新增）**"]
      state_machine: "open → 处理中 → 已回流 → 已修复待验 → 已闭环"
      routing: "严格对齐回流路由表"
    brain_activity_log_schema:  # V5.1.0新增
      description: "记录每个Agent大脑在每个stage的激活、推理和输出"
      fields: ["时间", "Stage", "Agent", "大脑版本", "推理任务", "推理输出摘要", "brain_sync_export", "记忆快照"]
    triggers:
      - event: "用户任一指令 / 自然语言输入"
        action: "conversation-log 追加一行"
      - event: "PM 任一输出（卡点摘要/调度/裁决）"
        action: "conversation-log 追加一行"
      - event: "任一阶段产生问题"
        action: "problem-ledger 新建 PBL + 回填对话行的「衍生问题」"
      - event: "问题状态变化（回流/修复/验证/闭环）"
        action: "更新对应 PBL 状态 + 闭环记录"
      - event: "**V5.1.0：大脑激活**"
        action: "**brain-activity-log 记录该stage的大脑激活+推理任务**"
      - event: "**V5.1.0：大脑推理完成**"
        action: "**brain-activity-log 记录推理输出摘要+brain_sync_export**"
      - event: "**V5.1.0：大脑记忆快照**"
        action: "**brain-activity-log 记录记忆快照导出+大脑版本号**"
      - event: "**V4.0.0：专家Review完成**"
        action: "**reviews/ 产出 Review报告（REV-{STAGE}-{version}.md）**"
      - event: "**V4.0.0：反馈回流启动**"
        action: "**problem-ledger 记录回流路径+经停阶段+各阶段审视结论+大脑研判**"
      - event: "**V4.0.0：反馈标记跨版本传递**"
        action: "**problem-ledger PBL 标记 status=跨版本传递 + 建议处理版本**"
      - event: "**V4.0.1：版本沉淀启动**"
        action: "**conversation-log 记录沉淀开始 + 创建 版本沉淀/{version}/ 目录**"
      - event: "**V5.1.0：大脑进化触发**"
        action: "**brain-activity-log 记录进化触发+全Agent大脑记忆导出**"
      - event: "**V4.0.1：版本沉淀完成**"
        action: "**conversation-log 记录沉淀完成（内容清单+质量评分+大脑进化摘要）+ VERSION-INDEX.yml 更新**"
      - event: "/close"
        action: "校验该版本 PBL 全部闭环 + **Review报告全部产出** + **版本沉淀完整性校验** + **大脑进化完成（V5.1.0新增）**，否则阻止 close"

  # ============================================
  # 专业流程索引
  # ============================================
  workflow_index:
    - flow: "大脑编排（V5.1.0新增）"
      owner: "pm-agent"
      file: "project-lifecycle.yml#brain_orchestration"
      methodology: "PM在每个stage激活对应Agent大脑，管理脑力协同链（brain_sync_chain），大脑记忆持久化，/close触发Brain Evolution Engine"
    - flow: "大脑记忆规范（V5.1.0新增）"
      owner: "pm-agent"
      file: "brain-memory-spec.yml"
      methodology: "定义每个Agent大脑记忆的标准格式（模式库+预测记录+跨脑协同+进化增量）"
    - flow: "大脑进化引擎（V5.1.0新增）"
      owner: "pm-agent"
      file: "brain-evolution-engine.yml"
      methodology: "定义大脑进化的触发条件（Sprint/版本/回流/事故）、进化步骤（收集→提取→更新→验证）"
    - flow: "产品架构与规划"
      owner: "po-agent"
      file: "po-planning-flow.yml"
      methodology: "三层能力金字塔分层激活：战略级→战略+商业+架构+路线图+Backlog+四层价值评估；规划级→架构+路线图+Backlog。脑暴后激活或/close后PM询问下一版本"
    - flow: "脑暴会议"
      owner: "bs-agent"
      file: "brainstorm.yml"
      methodology: "九部门矩阵匹配专家→四步法→三流草图→决策冻结→二分落盘。V3.3.0：分层类型(strategic/planning/regular)+领域知识+条件输出战略商业"
    - flow: "版本沉淀学习"
      owner: "pm-agent"
      file: "knowledge-sedimentation.yml"
      methodology: "/close后自动沉淀：需求快照+Review归档+经验提炼+追溯链→知识库（项目+版本维度）+经验库（跨项目）"
    - flow: "领域知识学习"
      owner: "pm-agent"
      file: "learn-domain.yml"
      methodology: "从行业标准网页链接学习业务领域知识→5部分结构（泳道+流程+信息流+矩阵+方案）→领域知识库→BA需求分析参考"
    - flow: "需求分析"
      owner: "ba-agent"
      file: "requirement-flow.yml"
      methodology: "用户旅行地图→需求场景(5W2H)→业务流程→版本规划→信息流→状态机→原子用例"
    - flow: "设计"
      owner: "ux-agent"
      file: "design-flow.yml"
      methodology: "页面/组件/交互说明卡，覆盖需求所有状态 + 多端适配"
    - flow: "架构"
      owner: "arch-agent"
      file: "arch-flow.yml"
      methodology: "技术可行性/依赖/跨系统接口评审，守门员裁决"
    - flow: "开发"
      owner: "fd-agent"
      file: "dev-flow.yml"
      methodology: "仿真代码生成，11 条编码铁律 + compliance-checker"
    - flow: "测试"
      owner: "qa-agent"
      file: "test-flow.yml"
      methodology: "五层测试（contract/unit/browser/whitebox/visual），用例源自 BA 产物"
    - flow: "验收"
      owner: "ac-agent"
      file: "acceptance-flow.yml"
      methodology: "四人模拟验收（新用户/VIP/管理员/PO Agent），需求覆盖率"
    - flow: "变更/修复"
      owner: "ba-agent"
      collab: ["ux-agent", "fd-agent"]
      file: "change-request.yml"
      methodology: "影响分析先行，文档为真理源"
    - flow: "缺陷回流"
      owner: "pm-agent"
      file: "defect-reflow.yml"
      methodology: "问题→归属版本→生成 type=修复→重走闭环"
    - flow: "交付标注"
      owner: "ux-agent"
      collab: ["fd-agent"]
      file: "handoff.yml"
      methodology: "V3.0.0：4级标注(page/button/metric/field) + 三步流程(校验→编辑→回传) + 编号方案B扩展 + 循环校验直到无变更"

  # ============================================
  # 全局深度检查触发机制（V4.2.0新增）
  # ============================================
  governance_audit_trigger:
    description: |
      V4.2.0新增：每次重大流程调整后，PM主动询问用户是否进行全面走查。
      触发条件：流程版本变更/新增删除文件/术语批量修改/编号体系变更/用户主动要求。
      检查机制定义：.codebuddy/knowledge/common/governance-audit.yml
    trigger_conditions:
      - "流程版本变更（任何workflow.yml版本号升级）"
      - "新增/删除文件（新增流程/Agent/技能/知识库文件）"
      - "术语批量修改（跨多文件的统一术语调整）"
      - "编号体系变更"
      - "用户主动要求（'全面检查/走查/审计'）"
    pm_action: |
      PM检测到上述任一条件时，主动询问用户：
      「检测到流程变更（{变更内容}），是否执行全局深度走查？
       走查范围：8维度检查+AI智能检查+6专家视角检查
       预计耗时：3-5分钟」
    user_confirm: "用户确认 → 按governance-audit.yml执行全局深度检查"
    user_decline: "用户拒绝 → 记录到Journal，本次跳过（下次变更再次询问）"
    audit_definition: ".codebuddy/knowledge/common/governance-audit.yml"
    audit_report_path: ".codebuddy/knowledge/common/audit-reports/"
