# ============================================
# Workflow: learn-project（项目学习 V7.0.0）
# 版本: v7.0.0
# 最后更新: 2026-07-20
# ============================================
#
# 版本变更历史详见：.codebuddy/knowledge/common/governance-docs/流程版本变更总账.md
# 当前版本V7.0.0核心：场景深度还原引擎——双态标注(显式照录+隐式挖掘还原)+五大业务产物深度还原(场景/流程/信息/状态机/操作矩阵)+8项深度能力+依据链审计
# V6.1.0核心：忠实还原+多来源+AI识别系统终端+全量/增量学习+专家Review+AI主题/场景+API学习+强化学习
# ============================================

workflow:
  id: "learn-project"
  name: "项目学习（V7.0.0 场景深度还原引擎 + 双态标注 + 五大业务产物深度还原 + 8项深度能力 + 依据链审计）"
  version: "7.0.0"
  trigger_command: "/learn-project"
  owner: "ba-agent"
  collab: ["doc-agent"]
  pm_controlled: false

  # ============================================
  # 选项定义
  # ============================================
  options:
    - flag: "--project"
      desc: "项目名（必填）；缺省时 Agent 必须主动询问，禁止回退 default_project。项目名将用于在 .codebuddy/knowledge/projects/{project}/ 下创建知识库目录。当输入同名项目且未指定 --module 时，视为全量学习，覆盖已有知识库内容。"
      required: true
      missing_action: "若用户未提供 --project，Agent 必须追问：「请提供项目名称（例如：--project=AI-SCRM）。该名称将用于在知识库中创建专属目录。」"
    - flag: "--source"
      desc: "知识源（可多次指定），支持 10 种类型"
      required: true
      multi: true
    - flag: "--module"
      desc: "模块/流程名（可选）；指定时仅学习该模块/流程（增量学习，追加到已有知识库）；未指定时全量学习（覆盖已有知识库同名PRD）。例如：--module=订阅模块 或 --module=分账流程"
      required: false
      default: "全量学习"
      missing_action: "无需追问，未提供 --module 时默认全量学习"

  # ============================================
  # 全量/增量学习策略（V6.1.0 新增）
  # ============================================
  learning_strategy:
    full_learn:
      trigger: "未指定 --module 参数"
      behavior: |
        全量学习模式：
        1. 扫描 .codebuddy/knowledge/projects/{project}/ 是否已有知识库
        2. 若已有知识库 → 提示用户「检测到已有知识库，全量学习将覆盖已有PRD，是否继续？」
        3. 用户确认后 → 全量提取所有源文档内容 → 生成新的完整PRD覆盖旧PRD
        4. 旧PRD版本保留为 {项目}-超级需求文档-PRD-v{旧version}.md（不删除，作为历史版本）
        5. 学习报告同样覆盖，旧报告保留为历史版本
    incremental_learn:
      trigger: "指定了 --module 参数"
      behavior: |
        增量学习模式：
        1. 扫描 .codebuddy/knowledge/projects/{project}/ 是否已有知识库
        2. 若已有知识库 → 仅提取与指定模块/流程相关的内容 → 追加/更新到已有PRD的对应章节
        3. 若无知识库 → 提示用户「未检测到已有知识库，增量学习需要已有PRD基础，建议先执行全量学习」
        4. 增量更新时保持已有FN/UC/BR/ENT编号不变，新增内容顺延编号
        5. 学习报告追加「增量学习记录」章节

  # ============================================
  # 忠实还原铁律（最高优先级）
  # ============================================
  faithfulness_rules:
    - id: "FR-01"
      rule: "照录不删：原型的每一个页面、每一个字段、每一条规则都必须出现在 PRD 中，禁止以「冗余/不合理」为由删除"
    - id: "FR-02"
      rule: "照录不纠：原型的错误、矛盾、不完整处，原文照录，禁止在 PRD 中自行修正或补充"
    - id: "FR-03"
      rule: "问题旁注：所有发现的问题（缺失/矛盾/模糊/不一致/逻辑漏洞）仅记录在学习报告的「原型问题清单」中，不在 PRD 正文中标注或修正"
    - id: "FR-04"
      rule: "禁止推测：原型没有的内容不得自行补充（包括但不限于：异常流程、边界条件、性能指标、技术约束）；分析阶段同样禁止推测补充"
    - id: "FR-05"
      rule: "结构映射：原型信息按 doc-standards.yml 标准 PRD 章节重新组织，但内容忠实于原文；转换过程可改形式不可改实质"
    - id: "FR-06"
      rule: "多卷不断链：拆分多卷时，每卷首尾须有上下文链接（上一卷/下一卷），卷索引文件记录完整版本链"

  # ============================================
  # 双态标注机制（V7.0.0 新增——场景深度还原核心机制）
  # ============================================
  # 详见：.codebuddy/knowledge/common/scene-learning-standards.yml
  # 定位：AI是"深度还原器"不是"分析推导器"——挖掘原文中分散隐含的原本需求，不加AI自己的想法
  dual_state_annotation:
    standard: ".codebuddy/knowledge/common/scene-learning-standards.yml"
    description: |
      V7.0.0将"忠实还原"从"显式照录"升级为"显式照录 + 隐式挖掘还原"。
      "挖掘"=从原文碎片交叉印证还原原本就存在但未被显式组织的完整需求（还原非创造）。
    states:
      explicit:
        label: "📗 显式照录"
        rule: "FR-01~05铁律保护，原型明确写出的内容照录不改"
        marker: "无前缀（默认态）"
      implicit_mining:
        label: "🟡 隐式挖掘还原"
        rule: "从原型分散信息碎片交叉印证还原的原本就存在但未被显式组织的完整需求"
        marker: "【🟡隐式挖掘·依据:{依据1}+{依据2}交叉印证】"
        mining_principles:
          - "有据原则：每条挖掘必须附原文依据链（引用≥2处原文片段交叉印证）"
          - "还原原则：挖掘的是原本就存在但分散的需求，不是AI创造的"
          - "可溯原则：依据链必须可回溯到原文具体位置（文件名/页面/字段/行）"
    forbidden:
      - "❌ 禁止AI分析推导（如'基于行业经验应该有XXX'）——这不是还原而是创造"
      - "❌ 禁止AI补充建议（如'建议补充异常流程'）——挖掘出的异常必须有原文依据"
      - "❌ 禁止无依据链的隐式标注——无依据=推测=违规"
      - "❌ 禁止将单一原文片段过度解读——必须≥2处交叉印证"
    fr_04_clarification: |
      FR-04"禁止推测"更新为：禁止推测原文完全没有线索的内容；
      但允许基于≥2处原文依据交叉印证进行隐式挖掘还原（标注🟡+依据链）。
      推测=无依据或单一依据过度解读（禁止）；挖掘=≥2处依据交叉印证还原原本存在的需求（允许）

  # ============================================
  # 10 种知识源（V5.0.0 从 5 种扩展为 10 种）
  # ============================================
  knowledge_sources:
    # --- 原有 5 种 ---
    - type: "local-dir"
      flag: "--source=local-dir:./path"
      description: "本地文档目录，递归扫描所有文件（含 HTML/MD/PDF/Word/PPT/Excel/图片）"
      action: "扫描目录→按文件类型分组→逐文件全文加载→入库"
      v5_enhance: "支持图片AI识别+Axure HTML深度解析+PDF/Word/PPT/Excel格式"
    - type: "file"
      flag: "--source=file:./spec.md"
      description: "单个文件，支持 .md/.pdf/.docx/.pptx/.xlsx/.html/.png/.mp4/.mp3"
      action: "读取文件→格式识别→对应解析器提取→入库"
      v5_enhance: "新增 PDF/Word/PPT/Excel/图片/视频/音频格式支持"
    - type: "http-url"
      flag: "--source=http-url:https://..."
      description: "HTTP URL，深度抓取并解析"
      action: "web_fetch→agent-browser深度抓取（分页/折叠/SPA）→HTML→Markdown→入库"
      v5_enhance: "agent-browser 深度抓取 + 图片AI识别"
    - type: "api-endpoint"
      flag: "--source=api-endpoint:https://..."
      description: "API 端点，自动调用并解析 JSON 响应"
      action: "API 调用→JSON 解析→接口发现+串联→入库"
      v5_enhance: "接口自动发现与串联（AI推断调用顺序）"
    - type: "paste"
      flag: '--source=paste:"内容"'
      description: "直接粘贴的文本内容"
      action: "文本→结构化提取→入库"

    # --- V5.0.0 新增 5 种 ---
    - type: "video"
      flag: "--source=video:https://..."
      description: "教学视频/培训视频（B站/YouTube/腾讯视频/直链/本地mp4）"
      action: "视频信息获取→字幕提取(优先)/ASR语音转文字→关键帧AI识别→合并→入库"
      v5_enhance: "字幕优先+ASR降级+关键帧识别+--transcript文字稿"
    - type: "audio"
      flag: "--source=audio:./录音.mp3"
      description: "音频文件（录音/播客/会议录音）"
      action: "ASR语音转文字→按主题分段→入库"
      v5_enhance: "语音转文字+主题分段"
    - type: "image"
      flag: "--source=image:./截图.png"
      description: "图片文件（截图/流程图/设计稿/架构图）"
      action: "AI视觉识别→提取文字/流程/结构→转Markdown→入库"
      v5_enhance: "AI视觉识别+不清晰标记image_unclear"
    - type: "pdf"
      flag: "--source=pdf:./需求文档.pdf"
      description: "PDF 文档"
      action: "PDF文字提取→表格识别→图片识别→入库"
      v5_enhance: "PDF skill 支持"
    - type: "website"
      flag: "--source=website:https://wiki.example.com --cookie=xxx"
      description: "需登录网站（企业Wiki/Confluence/飞书/内部系统）"
      action: "agent-browser+Cookie/Token登录→深度抓取→入库"
      v5_enhance: "需登录网站+--cookie/--auth参数"

  # ============================================
  # V5.0.0 新增参数
  # ============================================
  v5_options:
    - flag: "--cookie"
      desc: "网站登录 Cookie（配合 --source=website: 使用）"
      required: false
    - flag: "--auth"
      desc: "网站登录账号密码（格式：user:password）"
      required: false
    - flag: "--transcript"
      desc: "视频/音频的文字稿文件（ASR不可用时使用）"
      required: false

  # ============================================
  # 步骤定义（v4.0.0 忠实还原 + 业务分析七步）
  # ============================================
  stages:
    # ---- Stage 1: 多来源深度抓取与资源清单（V5.0.0 升级）----
    - id: "1"
      name: "多来源深度抓取与资源清单"
      agent: "ba-agent"
      collab: ["doc-agent"]
      action: |
        V5.0.0 多来源深度抓取（10种来源分别处理）：

        1. 按 --source 类型分别处理：
           a. local-dir → 递归扫描，逐文件类型识别处理
              - HTML → Axure 深度解析（识别 Axure DOM 结构，提取 span/div 业务文本、页面名、组件名、交互说明）
              - MD → 直接读取
              - PDF → PDF 文字提取（pdf skill）
              - Word(.docx) → docx 解析（提取段落+表格+图片）
              - PPT(.pptx) → pptx 解析（提取每页文字+备注）
              - Excel(.xlsx) → xlsx 解析（提取表格数据）
              - 图片(.png/.jpg) → AI 视觉识别（提取文字/流程/结构）
              - 视频(.mp4) → 字幕提取/ASR+关键帧
              - 音频(.mp3) → ASR 语音转文字
           b. http-url → web_fetch + agent-browser 深度抓取（分页/折叠/SPA + 图片识别）
           c. website → agent-browser + --cookie/--auth 登录后深度抓取
           d. video → 字幕提取(优先)/ASR+关键帧识别
           e. audio → ASR 语音转文字
           f. image → AI 视觉识别
           g. pdf → PDF 文字提取
           h. api-endpoint → API 调用 + 接口发现串联
           i. paste → 直接处理
           j. file → 格式识别后按上述对应方式处理

        2. 生成「源文件清单」：列出每个源路径、类型、大小、处理方式
        3. 生成「页面/模块清单」：提取所有页面名称、模块名称、功能名称
        4. 生成「实体清单」：提取所有业务实体
        5. 扫描并登记「外部连接资产」（外站网址 + 接口连接）
        6. 接口自动发现与串联（如果检测到 API 接口信息）
        7. 估算 PRD 规模：若预估单文档超过 800 行或 15 个页面，标记为「需多卷拆分」
        8. Axure HTML 深度解析（V5.0.0 新增）：
           - 识别 Axure 导出的 HTML 特有 DOM 结构
           - 提取 span/div 中的业务文本
           - 提取页面名称/组件名称/交互说明
           - 重组为结构化内容
        9. 全量/增量学习策略判定（V6.1.0 新增）：
           - 检查是否指定 --module 参数
           - 未指定 → 全量学习模式：扫描已有知识库，提示用户确认覆盖
           - 已指定 → 增量学习模式：扫描已有知识库，定位待更新模块
      output:
        - "源文件清单（内存态，含处理方式和来源类型标注）"
        - "页面/模块清单（内存态）"
        - "实体清单（内存态）"
        - "拆分建议（单卷 or 多卷 + 分卷依据）"
        - "doc-splitter 文档单元索引"
        - "图片识别结果（ai_extracted + image_unclear 标记）"
        - "视频/音频文字稿（transcripts）"
        - "接口串联图（api_integration，如有）"
        - "学习模式判定结果（全量/增量+已有知识库检测结果）"
      checkpoint: true
      note: "用户确认拆分方案后进入 Stage 1.2"

    # ---- Stage 1.2: AI自动识别业务系统与终端（V6.1.0 新增）----
    - id: "1.2"
      name: "AI自动识别业务系统与终端"
      agent: "ba-agent"
      action: |
        V6.1.0 新增：从源文档内容自动识别业务系统缩写和终端缩码，无需用户输入。

        ## 识别逻辑

        ### 1. 业务系统识别（System Abbreviation）
        从源文档内容提取业务系统信息：
        a. 系统名称提取：
           - 从文档标题/封面/页眉提取系统名称（如"群管易""AI-SCRM""九天SAAS平台"）
           - 从文档内容中的"系统介绍""产品定位"章节提取
           - 从操作手册的系统后台菜单结构推断
        b. 系统缩写生成：
           - 中文名 → 拼音首字母大写（如"群管易"→QGY）
           - 英文名 → 取首字母大写（如"AI-SCRM"→SCRM）
           - 混合名 → 取主要识别部分缩写
           - 若源文档已包含缩写/代号 → 直接使用
        c. 多业务系统识别：
           - 若源文档涉及多个子系统（如"权限管理子系统""课程管理子系统"等）
           - 为每个子系统生成缩写（如 PERM/COURSE/MALL/FINANCE/SPLIT 等）
           - 主系统缩写作为 PREFIX，子系统缩写作为模块级编号

        ### 2. 终端识别（Terminal Code）
        从源文档内容提取终端信息：
        a. 终端类型识别规则：
           - 后台管理端（PC Web后台） → PC
           - H5手机端 → H5
           - 微信小程序 → MP
           - 企业微信侧边栏 → EW
           - 外部浏览器 → WB
           - App移动端 → APP
           - 公众号 → OA
        b. 识别依据：
           - 文档中明确提及的终端（如"管理员端""经销商端""群管端""H5手机端"等）
           - 页面截图/描述中的终端特征（如"电脑微信端""外部浏览器"等）
           - 操作路径中的终端线索（如"企业微信>>工作台>>量多多"→EW）
        c. 多终端识别：
           - 若源文档涉及多个终端 → 为每个终端生成缩码
           - FN/UC/PG 编号使用对应终端缩码

        ### 3. 编号体系自动生成
        基于识别结果，生成编号方案：
        - 系统缩写 = 主系统缩写（如 QGY）
        - FN编号格式：FN-{系统缩写}-{终端缩码}-{NNN}（如 FN-QGY-PC-001）
        - UC编号格式：UC-{系统缩写}-{终端缩码}-{NNN}
        - PG编号格式：PG-{系统缩写}-{终端缩码}-{NNN}
        - BR/ENT/MD/SC 使用 {系统缩写}（不含终端缩码）

        ### 4. 识别结果展示
        向用户展示识别结果供确认：
        「AI自动识别结果：
         - 业务系统：群管易（QGY）
         - 涉及终端：PC后台管理端(PC)、H5手机端(H5)、企业微信侧边栏(EW)、外部浏览器(WB)
         - 子系统：权限管理(PERM)、经销商管理(DEALER)、课程管理(COURSE)...
         - 编号方案：FN-QGY-PC-001 / FN-QGY-H5-001 / FN-QGY-EW-001...
         请确认或修正。」
      output:
        - "业务系统名称+缩写（PREFIX）"
        - "终端清单+终端缩码列表"
        - "子系统清单+子系统缩写（如有）"
        - "编号方案（FN/UC/PG/BR/ENT/MD/SC 编号格式）"
      checkpoint: true
      note: "用户确认识别结果后进入 Stage 2。用户可修正AI识别的系统缩写和终端缩码。"

    # ---- Stage 2: 逐文件忠实提取（引入 doc-splitter） ----
    - id: "2"
      name: "逐文件忠实提取（doc-splitter 全文加载）"
      agent: "ba-agent"
      skills: ["doc-splitter"]
      invokes: "faithful-extraction"
      standard: ".codebuddy/knowledge/common/doc-standards.yml"
      standard_enforcement: "strict"
      standard_compliance_checklist:
        - "元数据头部（YAML Front Matter）是否完整？"
        - "编号体系是否使用 FN-{系统缩写}-{终端缩码}-{NNN} 格式？"
        - "追溯链 UC→FN→PG→MD→SC→BG→BO 是否完整？"
        - "用例模板是否包含所有必填字段（编号/用例编号/名称/页面/参与者/优先级/关联BG/自动化类型）？"
        - "用例是否包含所属页面(PG-{系统缩写}-{终端缩码})字段？"
        - "子功能是否逐原子操作拆分（禁止吞并）？"
        - "业务规则是否独立编号 BR-{MODULE}-{NNN}？"
        - "页面级用例（PG）是否独立成章？"
      action: |
        ## 核心变更（v4.0.0）：引入 doc-splitter 逐文件全文加载
        #
        # 旧模式（v3.0.0）：子 agent 批量读取多个 HTML → 摘要返回 → 信息压缩失真
        # 新模式（v4.0.0）：doc-splitter 逐文件注册 → 每批次 ≤2 个文件 → 全文加载 → 完整提取
        #
        ## 执行步骤：

        ### 步骤 0：doc-splitter 文档单元注册
        - 对 HTML 原型源：每个 HTML 文件注册为 1 个不可再拆的原子文档单元
        - 对 Markdown/PDF 源：按章节/页面边界注册文档单元
        - 生成文档单元索引（文件名→所属模块→预估大小→批次分配）

        ### 步骤 1：分批全文加载（核心：保证还原度）
        - 每批次 ≤2 个 HTML 文件（或 ≤3000 字的 Markdown 章节）
        - 对每个文档单元，读取其 **完整全文**（不截断、不摘要）
        - 若单文件超大（>5000 字），doc-splitter 自动拆分为子单元，标注父子关系
        - 严禁使用子 agent 做摘要提取——Agent 必须直接读取原始文件全文

        ### 步骤 2：逐文件忠实提取（FR-01~FR-05）
        对每个文档单元的全文执行：
        a. 页面结构提取：
           - 原型每个页面 → PG-{系统缩写}-{终端缩码}-{NNN} 编号 + 页面名称（与原型同源）
           - 页面布局描述（整体结构，照录原文）
           - 所属模块(MD) + 业务系统

        b. 交互流程提取：
           - 页面跳转关系 → 用例（UC-{系统缩写}-{终端缩码}-{NNN}）+ 基本流程
           - 弹窗/抽屉/确认框 → 子流程（UC-{系统缩写}-{终端缩码}-{NNN}-{SS}）
           - 照录原型的操作步骤（含 [手动]/[系统自动]/[事件驱动] 标注）

        c. 字段提取（逐字段照录，一字不漏）：
           - 表单字段：字段名、类型、必填、默认值、下拉选项、占位符
           - 列表字段：列名、排序规则、筛选条件
           - 详情字段：字段名、展示格式
           - 搜索/筛选条件：条件名称、类型、匹配规则

        d. 注释/便签提取（原样转录）：
           - 黄色便签(sticky_1)、蓝色便签(sticky_2)的完整文字
           - 水滴标记(marker)对应的注释编号及内容
           - 版本描述/变更说明中的每条记录

        e. 业务规则提取：
           - 校验规则 → BR-{MODULE}-{NNN}（照录触发条件→行为）
           - 权限规则 → 业务操作矩阵行
           - 不补充、不修正、不推测

        f. 状态提取：
           - 实体状态变化 → 状态列表 + 触发操作
           - 照录原文中出现的所有状态，不推测缺失状态

        g. 接口提取（如有）：
           - 接口调用 → 接口路径 + 入参/出参
           - 照录原文描述，不补充缺失字段

        ### 步骤 3：逐批次完整性验证
        - 每批次完成后，核对：字段数/按钮数/注释数是否与原文一致
        - 若发现遗漏，回读原文补全
        - 所有批次完成后，汇总为卷级 PRD 初稿

        ### 步骤 4：按卷生成分卷 PRD
        - 按 Stage 1 确认的拆分方案，将各文档单元的提取结果归入对应卷
        - 每卷按 doc-standards.yml 章节结构编排（15 章）
        - 每卷注入元数据头部（YAML Front Matter）
      output_mode: "multi_volume"
      output:
        - ".codebuddy/knowledge/projects/{project}/需求文档/{项目}-PRD-v{version}-vol{N}-{模块名}.md（分卷 PRD）"
      note: |
        严禁行为：
        - 不得使用子 agent 做摘要提取（必须直接读取原始文件全文）
        - 不得以「原文此处缺失」为由自行补充内容
        - 不得以「原文此处矛盾」为由选择其一
        - 不得以「原文此处冗余」为由删减内容
        正确做法：逐文件全文加载 → 逐字段逐注释照录 → 若发现缺失/矛盾/冗余，记录到 Stage 5 的问题清单

    # ---- Stage 2.5: 业务分析与建模（v4.0.0 新增，V7.0.0 增强隐式挖掘） ----
    - id: "2.5"
      name: "业务分析与建模（显式照录 + 🟡隐式挖掘还原，引用 scene-learning-standards.yml）"
      agent: "ba-agent"
      skills: ["faithful-analysis"]
      standard: ".codebuddy/knowledge/common/scene-learning-standards.yml"
      input: "Stage 2 逐卷忠实提取结果（分卷 PRD 初稿）"
      description: |
        V7.0.0升级：基于 Stage 2 忠实提取的原文内容，进行业务分析建模。
        借鉴 requirement-flow §3（业务场景与流程）和 §5（信息流→状态机→原子用例）方法论。
        核心升级：从"不推测补充"升级为"显式照录 + 🟡隐式挖掘还原"——
        挖掘原文中分散隐含的原本需求（≥2处依据交叉印证），不加AI自己的想法。
        原文完全无线索的维度仍标注「原文未提供」。
      action: |
        对每卷内容执行以下分析，分析结果嵌入各卷 PRD 的对应章节：

        ## 分析 1：场景识别与分类
        基于原文的页面/功能描述，识别业务场景：
        - 场景名称（从原文标题/菜单路径提取）
        - 场景参与者（从原文角色/权限描述提取）
        - 场景触发条件（从原文按钮/入口描述提取）
        - 场景出口（从原文跳转/后置条件提取）
        - 场景关联页面（从原文页面跳转关系提取）
        输出格式：每卷「场景清单」表格（场景编号 SC-{系统缩写}-{NNN} / 名称 / 参与者 / 触发条件 / 出口 / 关联 PG）
        若原文未提供完整的场景描述，照录已有部分，缺失标注「原文未提供」

        ## 分析 2：场景流程泳道图
        对每个识别出的场景，绘制 Mermaid flowchart 泳道图：
        - 泳道维度：角色/部门（从原文角色描述提取；若原文仅单角色，则泳道按「用户/系统」分）
        - 节点内容：关键动作（照录原文描述，不润色）
        - 分支条件：原文中的判断逻辑（如「若 A 则 B，否则 C」）
        - 异常路径：原文中的错误处理描述
        若原文未提供跨角色信息，标注「原文未提供跨角色视角，泳道图仅展示单角色流程」
        若原文未提供异常路径，标注「原文未提供异常路径描述」

        ## 分析 3：业务流程图
        绘制端到端业务流程图（Mermaid flowchart）：
        - 主干流程（Happy Path）：原文描述的完整操作路径
        - 分支流程：原文中的条件分支
        - 异常流程：原文中的错误处理
        - 跨页面衔接点：原文中的页面跳转
        每个流程节点标注对应的 FN 编号
        若原文未提供完整流程，标注「原文流程不完整，以下仅展示已描述部分」

        ## 分析 4：信息流分析
        识别原文中的信息主体及其流转：
        a. 信息主体清单（对齐 doc-standards.yml info_entities）：
           - 信息主体名
           - 归属业务系统
           - 生产者（角色/动作，从原文操作权限提取）
           - 消费者（角色/动作，从原文页面关系提取）
           - 依赖的前置动作

        b. 信息流转图（Mermaid flowchart，多业务系统时必画）：
           - 标注信息在系统间的同步源/同步目标
           - 标注同步触发动作(FN)
           - 标注失败兜底（若原文有描述）
           若原文未涉及跨系统，标注「原文未涉及跨系统信息流转」

        c. 信息流触发业务动作映射表：
           建立「信息变化 → 触发的业务动作」映射：
           | 信息主体.字段变化 | 触发动作(FN) | 产生结果 | 来源 |
           仅基于原文已有的联动描述建立映射，不推测补充

        ## 分析 5：业务状态机
        对原文中有明确状态描述的实体，绘制状态机：
        - 使用 Mermaid stateDiagram-v2 格式
        - 状态列表（从原文的状态标签/筛选项/状态列提取）
        - 合法转换（从原文的操作按钮与前置条件提取）
        - 每个转换标注：触发 FN + 操作者角色
        - 非法转换（若原文有明确禁止描述）
        配套状态过渡操作表（对齐 doc-standards.yml state_transition_table）：
        | 当前状态 | 触发操作(FN) | 目标状态 | 操作者 | 前置约束 | 后置动作 |
        若原文未提供完整状态定义，照录已有部分，缺失标注「原文未提供」
        若原文完全无状态描述，标注「原文未提供状态定义」

        ## 分析 6：业务操作矩阵（角色×部门×状态×操作）
        对齐 doc-standards.yml business_operation_matrix：
        | 业务操作(FN) | 角色 | 部门 | 前置业务状态 | 触发后目标状态 | 后置影响模块/数据 |
        仅基于原文已有的权限描述建立，不推测补充
        若原文未提供权限描述，标注「原文未提供权限定义」

        ## 分析 7：时序流（可选，原文有接口调用时必画）
        - 业务时序图（sequenceDiagram）：标注角色间的操作时序
        - 三方接口时序图（含接口路径，若原文有接口描述）
        若原文未提供接口信息，标注「原文未提供接口描述」
      output:
        - "各卷 PRD 注入：场景清单 + 泳道图 + 业务流程图 + 信息流图 + 状态机 + 过渡操作表 + 业务操作矩阵 + 时序图"
      note: |
        V7.0.0本阶段核心原则（升级）：
        - 显式照录 + 🟡隐式挖掘还原（双态标注，引用 scene-learning-standards.yml）
        - 🟡隐式挖掘：从原文≥2处碎片交叉印证还原原本就存在但分散的需求，标注依据链
        - 禁止AI分析推导/补充建议——挖掘的是"原本就存在"不是"AI认为应该有"
        - 原文完全无线索的维度仍标注「原文未提供」并记录到学习报告
        - 泳道图/流程图/状态机中的每个节点必须能追溯到原文具体描述
        - 所有分析结果嵌入各卷 PRD 对应章节（§8 五类图 / §9 功能需求 / §10 业务规则）
        - 深度还原（场景编排/隐式场景/异常矩阵/状态完整性/信息血缘/四维验证）在 Stage 2.6 执行

    # ---- Stage 2.6: 场景深度还原引擎（V7.0.0 新增——8项深度能力） ----
    - id: "2.6"
      name: "🔬 场景深度还原引擎（8项深度能力，引用 scene-learning-standards.yml）"
      agent: "ba-agent"
      skills: ["faithful-analysis"]
      standard: ".codebuddy/knowledge/common/scene-learning-standards.yml"
      input: "Stage 2.5 业务分析结果（场景清单 + 泳道图 + 流程图 + 信息流 + 状态机 + 操作矩阵）"
      description: |
        V7.0.0核心新增：五大业务产物深度还原引擎。
        AI定位为"深度还原器"——从原文碎片交叉印证还原原本就存在的完整需求。
        所有挖掘必须标注【🟡隐式挖掘·依据:X+Y交叉印证】，无依据=推测=违规。
        8项深度能力对齐 scene-learning-standards.yml five_business_artifacts。
      action: |
        ## 深度能力 1：场景编排图谱（Scene Orchestration Map）
        还原场景间的编排关系（从原文跳转链/后置条件→前置条件/条件分支交叉印证）：
        - 顺序编排（sequential）：场景A出口是场景B入口
          依据：原文跳转链 + 后置条件→前置条件
        - 并行编排（parallel）：同一触发同时启动多场景
          依据：原文同一入口触发多操作
        - 互斥编排（exclusive）：场景A和B不能同时发生
          依据：原文条件判断分支
        - 循环编排（loop）：场景执行后可回到前置场景
          依据：原文"返回继续"/"重新提交"描述
        - 依赖编排（dependency）：场景B必须等场景A完成
          依据：原文前置条件引用A的结果
        输出：Mermaid 场景编排图 + 场景依赖矩阵
        编排关系标注态：📗显式（原文明确跳转） / 🟡隐式挖掘（依据链交叉印证）

        ## 深度能力 2：隐式场景挖掘（Implicit Scene Mining）
        从4个维度还原原文未显式命名的场景（每条必须≥2处依据交叉印证）：
        a. 页面跳转链中间态：列表→详情→编辑→审核，"审核"若无独立页面但有审核操作→挖掘为独立场景
           依据示例：跳转链PG-001→PG-002 + 审核操作按钮BTN-001
        b. 按钮组功能聚类：同一页面"导出/导入/批量删除"构成独立批量操作场景
           依据示例：按钮组同页 + 操作目标实体一致
        c. 状态转换触发动作：每次状态跳变对应一个业务操作场景
           依据示例：状态机 待付款→已付款 + 触发FN-付款
        d. 角色权限交叉点：A能看不能改、B能改不能审→交叉点构成审批场景
           依据示例：权限描述A + 权限描述B + 共同操作对象
        输出：隐式场景清单（标注🟡+依据链），追加到场景清单表格
        禁止：原文无任何线索时不得凭行业经验挖掘（那是创造不是还原）

        ## 深度能力 3：异常路径矩阵（Exception Path Matrix）
        从原文碎片中还原异常路径（非AI推导，必须有原文依据）：
        - 校验规则→异常：原文"手机号格式校验"→挖掘"手机号格式错误"异常
          依据：BR-手机号校验规则
        - 前置条件→异常：原文"需登录后操作"→挖掘"未登录"异常
          依据：UC前置条件
        - 错误提示文案→异常：原文有"余额不足"提示→挖掘"余额不足"异常
          依据：原文提示文案
        - 按钮禁用条件→异常：原文"已删除时删除按钮置灰"→挖掘"已删除不可再删"异常
          依据：按钮disabled条件
        - 状态约束→异常：原文"只有待付款可取消"→挖掘"非待付款不可取消"异常
          依据：BR-状态约束规则
        输出：场景×异常类型矩阵（每条异常标注原文依据来源）
        禁止：原文无任何线索时不得枚举异常（如"基于电商经验应该有库存不足异常"=违规）

        ## 深度能力 4：状态机完整性分析（State Machine Completeness）
        对 Stage 2.5 分析5的状态机执行3项深度分析：
        a. 隐式状态发现：从按钮可用性/操作前置条件推导可能的状态（🟡标注）
           - 按钮置灰条件→隐式状态（"已删除时删除按钮置灰"→"已删除"状态）
           - 操作前置条件→隐式状态（"只有待付款可取消"→"待付款"是状态）
           - 页面跳转条件→隐式状态（"审核通过后跳转列表"→"已审核"状态）
           依据要求：≥2处原文依据交叉印证
        b. 可达性分析：识别不可达状态（无入口转换）、死状态（无出口转换，终态除外）
           输出：不可达状态清单 + 死状态清单（记录到学习报告）
        c. 转换完整性：每个状态是否都有入口和出口
           输出：缺失转换清单（记录到学习报告）
        输出：状态机完整性分析报告，隐式状态追加到状态机图（🟡标注+依据链）

        ## 深度能力 5：信息流深度追踪（Information Flow Deep Tracing）
        对 Stage 2.5 分析4的信息流执行3项深度分析：
        a. 信息生命周期追踪：还原信息从创建到消亡的完整生命周期（CRUD-L）
           - Create：新增按钮→创建信息
           - Read：查看/列表→读取信息
           - Update：编辑按钮→更新信息
           - Archive：禁用按钮→归档信息
           - Delete：删除按钮→删除信息
           依据：原文操作按钮 + 操作目标实体
           输出：信息主体×生命周期阶段矩阵
        b. 跨场景信息血缘：还原信息在场景间的产生与消费关系
           - 场景A产生的信息在哪些场景被读取/修改/消费
           依据：原文场景间数据传递 + 页面间参数传递 + 接口调用
           输出：Mermaid 信息血缘图（信息主体→产生场景→消费场景）
        c. 信息一致性校验：校验同一字段跨场景的定义是否一致
           - 字段类型一致性、字段约束一致性、字段状态一致性
           输出：不一致项清单（记录到学习报告'信息一致性问题'，标注冲突页面和字段定义）

        ## 深度能力 6：场景×角色×状态×数据 四维交叉验证
        对 Stage 2.5 分析6的操作矩阵执行四维交叉验证：
        - 在角色×状态×操作基础上增加数据维度
        - 验证"谁能对什么数据在什么状态下做什么操作"的完整性
        缺口分析：
        - 角色×状态覆盖：每个角色在每个状态下是否有明确操作或"无操作"标注
        - 操作×状态覆盖：每个FN在哪些状态可执行是否有标注
        - 数据×角色覆盖：每个角色能看到哪些数据是否有标注
        输出：四维交叉验证矩阵 + 缺口清单（记录到学习报告'操作矩阵缺口'）

        ## 深度能力 7：场景闭环验证（Scene Closure Validation）
        验证每个场景是否闭环（不闭环记录到学习报告，不自行补全）：
        - 入口闭环：每个场景是否有明确入口（非孤立场景）
        - 出口闭环：每个场景是否有明确出口（非死胡同场景）
        - 状态闭环：场景内状态变化是否有终态（非悬空状态）
        - 数据闭环：场景产生的数据是否有消费方（非孤儿数据）
        输出：场景闭环验证报告（不闭环场景+缺失的入口/出口/终态/消费方）

        ## 深度能力 8：挖掘依据链审计（Evidence Chain Audit）
        对所有🟡隐式挖掘标注执行依据链审计：
        - 每条🟡标注是否附依据链（引用≥2处原文片段交叉印证）
        - 依据链是否可回溯到原文具体位置（文件名/页面/字段/行）
        - 是否存在单一依据过度解读（违规）
        - 是否存在无依据推测（违规）
        输出：依据链审计报告
        违规处理：无依据链标注必须降级为不挖掘或补依据，不得保留无依据的🟡标注
      output:
        - "各卷 PRD 深度增强：场景编排图 + 隐式场景清单 + 异常路径矩阵 + 状态机完整性(隐式状态+完整性报告) + 信息血缘图 + 一致性校验 + 四维验证矩阵 + 闭环验证报告"
        - "🟡隐式挖掘标注全部附依据链"
        - "深度还原问题清单（不闭环/不一致/缺口/不可达/死状态）→ 传递给 Stage 5 学习报告"
      checkpoint: true
      note: |
        V7.0.0场景深度还原引擎核心原则：
        - AI是"深度还原器"不是"分析推导器"——挖掘原本就存在的需求，不加AI想法
        - 所有🟡隐式挖掘必须附依据链（≥2处原文交叉印证），无依据=推测=违规
        - 挖掘出的内容写入PRD对应章节（标注🟡+依据链），问题写入学习报告（不写PRD正文）
        - 原型作者能从原型找到依据的需求=挖掘（允许）；找不到=创造（禁止）
        - 深度还原结果嵌入各卷PRD的§8五类图/§9功能需求/§10业务规则/§11页面级用例

    # ---- Stage 3: 卷间关联与索引构建 ----
    - id: "3"
      name: "卷间关联与索引构建"
      agent: "doc-agent"
      input: "Stage 2 + Stage 2.5 + Stage 2.6 各卷 PRD（含分析结果 + 深度还原结果）"
      action: |
        1. 生成卷索引文件：{项目}-PRD-v{version}-index.md
           包含：版本链（当前卷→上一卷/下一卷）、卷目录、跨卷引用表
        2. 每卷首部注入：
           - 上一卷链接（若非首卷）
           - 下一卷链接（若非末卷）
           - 卷索引链接
        3. 每卷尾部注入：下一卷链接 + 卷索引链接
        4. 构建全局交叉引用：
           - UC → PG 映射表
           - FN → BR 映射表
           - BR → 页面 映射表
           - 实体 → 页面 映射表
           - SC → PG 映射表（v4.0.0 新增）
           - 状态机节点 → FN 映射表（v4.0.0 新增）
        5. 交叉引用写入卷索引文件
        6. 验证跨卷编号不重复（FN/UC/BR/SC/PG/ENT 全局唯一）
      output:
        - ".codebuddy/knowledge/projects/{project}/需求文档/{项目}-PRD-v{version}-index.md"
        - "各卷首尾上下文链接已注入"
      rule: "卷间链接必须双向可追溯；任意卷可独立阅读但能通过链接回到完整上下文"

    # ---- Stage 3.5: 整卷合并与统一编排（v4.0.0 新增） ----
    - id: "3.5"
      name: "整卷合并与统一编排（单一 PRD 交付物）"
      agent: "doc-agent"
      skills: ["doc-splitter"]
      input: "Stage 2 + Stage 2.5 各卷 PRD + Stage 2.6 深度还原结果 + Stage 3 卷索引"
      description: |
        将多卷 PRD 合并为一份完整的单一 PRD 文档，对齐 doc-standards.yml 的
        single_document=true 铁律。合并后的单一文档为最终交付物，分卷文档保留作为过程产物。
      action: |
        1. 按 doc-standards.yml 的 15 章结构重新编排（所有卷内容合并到统一章节）：

           §1  版本历史（合并各卷的版本历史）
           §2  目录（自动生成）
           §3  背景与问题陈述（合并各卷，去重）
           §4  目标与成功度量（合并各卷；原型未提供则标注）
           §5  范围（In-Scope / Non-Goals）（合并各卷）
           §6  与既有模块关系（合并各卷的复用边界）
           §7  业务目标映射（BO/BG）（原型未提供则标注）
           §8  用户故事（合并各卷的用户故事）
           §9  五类图（合并各卷的泳道图/流程图/信息流图/状态机/时序图）
               - §9.1 业务流程图（各业务场景的 flowchart）
               - §9.2 信息流转图（跨模块 flowchart）
               - §9.3 状态机（stateDiagram-v2 + 过渡操作表）
               - §9.4 业务时序图（sequenceDiagram）
               - §9.5 三方接口时序图（含接口路径）
           §10 功能需求列表与用例（FN/UC，按模块分章节，含所属页面 PG）
           §11 页面级用例（PG，独立成章）
           §12 业务规则（BR，全局统一编号）
           §13 数据实体（ENT）
           §14 验收标准（场景级 SC + 功能级 Give-When-Then 矩阵）
           §15 指标登记（含 definition/source，反标 BG；原型未提供则标注）
           §16 外部接口标注
           §17 检查清单

        2. 编号体系统一化：
           - 全局 PREFIX 声明（如 SHOP），置于文档头部
           - 所有 FN/UC/BR/PG/ENT/SC 使用统一 PREFIX
           - 跨卷不重复编号，冲突时重新分配

        3. 卷间交叉引用 → 文档内部交叉引用：
           - 原来的「见 Vol X」→「见 §X.Y 章节」
           - 原来的跨卷链接 → 文档内锚点链接

        4. 元数据头部注入：
           - YAML Front Matter（对齐 doc-standards.yml metadata_header）
           - doc_id: REQ-{系统缩写}-超级需求文档-PRD-{version}
           - doc_type: requirement
           - 标记 source: "learn-project v4.0.0 忠实还原"
           - 标记 based_on: 原型源路径 + 版本

        5. 忠实还原声明注入：
           - 在文档头部声明：本文档由 learn-project v4.0.0 忠实还原生成
           - 标注原型源、版本、还原日期
           - 标注「原型未提供」的章节清单
      output:
        - ".codebuddy/knowledge/projects/{project}/需求文档/{项目}-超级需求文档-PRD-v{version}.md（★ 最终交付物）"
      note: |
        - 合并后的单一文档为最终交付物，分卷文档保留作为过程产物（不删除）
        - 合并过程中不得修改原文内容，仅调整组织结构
        - 若原型未提供某章节内容，标注「原型未提供」，不自行补充

    # ---- Stage 4: doc-standards 合规检查（v4.0.0 增强） ----
    - id: "4"
      name: "doc-standards 合规检查"
      agent: "doc-agent"
      skills: ["requirement-checker"]
      input: "Stage 3.5 合并后的单一 PRD"
      standard: ".codebuddy/knowledge/common/doc-standards.yml"
      standard_enforcement: "strict"
      action: |
        对照 doc-standards.yml v2.0.0 对合并后的单一 PRD 执行逐项合规检查：

        ### 结构合规
        - [ ] 15 章结构是否完整？
        - [ ] 元数据头部（YAML Front Matter）是否包含所有必填字段？
        - [ ] single_document 模式是否生效（仅 1 份主文档）？

        ### 编号合规
        - [ ] 编号体系 FN-{系统缩写}-{终端缩码}-{NNN} / UC-{系统缩写}-{终端缩码}-{NNN} / BR-{系统缩写}-{NNN} 是否全局一致？
        - [ ] 系统缩写 是否在文档头部显式声明？
        - [ ] 追溯链 UC→FN→PG→MD→SC→BG→BO+CONFIG→BR/FN+METRIC→BG/BO 是否完整可追溯？

        ### 五类图合规
        - [ ] 业务流程图(flowchart) 是否包含？
        - [ ] 信息流转图(跨模块 flowchart) 是否包含？
        - [ ] 状态机(stateDiagram-v2) 是否包含？
        - [ ] 状态机是否配套状态过渡操作表？
        - [ ] 业务时序图(sequenceDiagram) 是否包含？
        - [ ] 三方接口时序图(含接口路径) 是否包含？
        - [ ] 图中每个节点是否映射到至少一个 FN？

        ### 用例合规
        - [ ] 用例模板是否包含所有必填字段（编号/用例编号/名称/页面/参与者/优先级/关联BG/自动化类型）？
        - [ ] 用例是否包含「所属页面(PG-{系统缩写}-{终端缩码})」字段？
        - [ ] 子功能是否逐原子操作拆分（列表操作/写入操作/批量操作/行操作）？
        - [ ] 异常流是否至少 3 种？每条异常是否有明确用户提示文案？

        ### 页面级用例合规
        - [ ] PG 是否独立成章？
        - [ ] PG 结构是否包含：页面编号/名称/所属模块/业务流程定位/状态机梳理/页面指标统计/关联功能用例/关联UC？
        - [ ] 页面指标是否指向指标登记 key 并反标 BG？

        ### 业务规则合规
        - [ ] BR 是否独立编号 BR-{MODULE}-{NNN}？
        - [ ] BR 是否声明 depends_on 依赖链？

        ### 验收标准合规
        - [ ] 场景级验收标准 SC-{系统缩写}-{NNN} 是否包含？
        - [ ] 功能级验收矩阵（Give-When-Then）是否包含？

        ### 指标登记合规
        - [ ] 指标登记是否包含 definition/source？
        - [ ] 指标是否反标 BG？

        ### 商业价值合规
        - [ ] 商业价值假设是否显式登记？
        - [ ] 是否包含：商业目标(BG反标)/价值假设/度量指标/预期收益/验证方式？

        ### 业务操作矩阵合规
        - [ ] 业务操作矩阵（角色×部门×状态×操作）是否包含？

        ### 检查结果处理
        - 合规项：标记 ✅
        - 原型未提供的项：标记 ⬜（原型未提供），不计入缺陷
        - 原型提供但格式不合规的项：标记 ❌，记录到学习报告
      output:
        - "合规检查报告（对话展示 + 写入学习报告附录）"

    # ---- Stage 5: 学习报告与问题清单（v4.0.0 增强） ----
    - id: "5"
      name: "学习报告与问题清单（含合规检查结果）"
      agent: "doc-agent"
      skills: ["knowledge-integrator"]
      input: "Stage 1~4 全部产出 + Stage 4 合规检查结果"
      action: |
        生成学习报告（对话展示 + 落盘），核心包含：

        1. 学习概况：
           - 源文件数/页面数/模块数/功能数/BR数/实体数/接口数
           - 分析建模统计：场景数/泳道图数/流程图数/信息流图数/状态机数/时序图数

        2. 知识覆盖矩阵：
           - 逐模块统计已提取/未覆盖项
           - 逐分析维度统计：场景识别覆盖率 / 泳道图覆盖率 / 状态机覆盖率 / 信息流覆盖率

        3. doc-standards 合规度（v4.0.0 新增）：
           - 总体合规率：合规项数 / 总检查项数
           - 原型缺失项清单（标注「原型未提供」的章节/维度）
           - 格式不合规项清单（原型有内容但格式不达标）

        4. 原型问题清单（不纠偏，仅记录）：
           按问题类型分类：
           - 缺失类：页面缺少状态说明 / 字段缺少类型 / 流程缺少异常分支
           - 矛盾类：不同页面同一字段定义不一致 / 流程图与文字描述冲突
           - 模糊类：字段含义不清 / 按钮行为不明 / 权限边界模糊
           - 不一致类：命名不统一 / 交互模式不统一 / 数据格式不统一
           - 逻辑漏洞类：流程存在死循环 / 状态机存在不可达状态 / 规则互相冲突
           每条问题格式：[类别] [来源文件/页面] [涉及内容] [具体描述]

        5. 分析建模问题（v4.0.0 新增）：
           - 场景识别遗漏
           - 泳道图跨角色信息缺失
           - 状态机状态定义不完整
           - 信息流跨系统路径缺失

        6. 外部连接资产清单

        7. 建议补充项（仅建议，不写入 PRD）：
           - 建议补充的业务场景
           - 建议补充的状态定义
           - 建议补充的异常路径
           - 建议补充的权限定义

        8. 场景流程深度还原报告（V7.0.0 新增，对齐 scene-learning-standards.yml learning_report_enhancement）：
           a. 场景编排完整性：
              - 场景总数 / 显式场景数 / 🟡隐式挖掘场景数 / 编排关系数 / 不闭环场景数
              - 闭环率 = 闭环场景数 / 场景总数 × 100%
           b. 流程还原完整度：
              - Happy Path数 / 分支数 / 异常路径数(有依据) / 跨页面衔接点数
              - 异常覆盖率 = 有依据异常路径覆盖的场景数 / 场景总数 × 100%
           c. 信息结构还原度：
              - 信息主体数 / 生命周期完整主体数 / 血缘链路数 / 一致性问题数
              - 生命周期完整率 = 生命周期完整主体数 / 信息主体总数 × 100%
           d. 状态机完整度：
              - 显式状态数 / 🟡隐式挖掘状态数 / 不可达状态数 / 死状态数 / 缺失转换数
              - 状态完整率 = 完整状态数(有入有出) / 状态总数 × 100%
           e. 操作矩阵覆盖度：
              - 矩阵单元格数 / 已填充单元格数 / 缺口单元格数 / 操作详情卡数
              - 矩阵覆盖率 = 已填充单元格数 / 应填充单元格数 × 100%
           f. 🟡挖掘依据链审计：
              - 🟡隐式挖掘标注总数 / 有依据链标注数 / 无依据链标注数(违规)
              - 违规标注必须降级处理（补依据或移除🟡标注）
           g. 深度还原问题清单（从 Stage 2.6 传递）：
              - 不闭环场景清单（缺失入口/出口/终态/消费方）
              - 信息一致性问题清单（冲突页面+字段定义）
              - 状态机完整性问题清单（不可达/死状态/缺失转换）
              - 操作矩阵缺口清单（未覆盖的角色×状态×操作×数据）
      output:
        - "学习报告（对话展示）"
        - ".codebuddy/knowledge/projects/{project}/学习报告/{项目}-学习报告-v{version}.md"
      note: |
        问题清单仅供人工审查，严禁将问题标注写入 PRD 正文。
        V7.0.0新增：🟡隐式挖掘内容可写入PRD正文（标注依据链），但深度还原问题（不闭环/不一致/缺口）只进学习报告。

    # ---- Stage 5.5: 专家 Review（V5.0.0 新增）----
    - id: "5.5"
      name: "🔍 专家 Review（BA 主导 + Arch 参与）"
      agent: "ba-agent + arch-agent"
      input: "PRD + 学习报告"
      action: |
        PM 调度专家审查项目学习产出：
        - 审查主导：BA 业务分析师（业务流程正确性 + 忠实还原度）
        - 审查参与：Arch 架构师（技术可行性 + 接口合理性）

        BA 审查项（8项）：
        1. 忠实还原度：PRD 是否忠实于源文档，未删减/纠偏/推测
        2. 页面覆盖完整性：源文档所有页面是否都出现在 PRD 中
        3. 业务流程正确性：泳道图/流程图/状态机是否与源文档一致
        4. 业务操作矩阵完整性：角色×状态×操作是否覆盖
        5. 信息流准确性：信息主体/生产者/消费者/依赖是否正确
        6. 图片/视频内容完整性：图片识别和视频文字稿是否遗漏关键内容
        7. 垃圾内容过滤：是否有抓取噪音混入
        8. 领域知识一致性：与已有领域知识是否冲突

        BA 深度还原审查项（V7.0.0 新增4项）：
        11. 🟡隐式挖掘合规性：所有🟡标注是否附≥2处原文依据链，无依据=推测=违规
        12. 场景编排完整性：场景编排图谱是否还原场景间关系，不闭环场景是否记录
        13. 状态机完整度：隐式状态挖掘是否合理，不可达/死状态是否识别
        14. 信息血缘准确性：跨场景信息血缘是否正确，一致性冲突是否记录

        Arch 审查项（2项）：
        9. 接口合理性：接口串联是否合理（如有接口信息）
        10. 技术可行性：涉及的技术方案是否可行

        产出 Review 报告：REV-LEARN-{project}-{version}.md

    # ---- Stage 5.7: PM 展示 Review 汇总 + 用户确认（V5.0.0 新增）----
    - id: "5.7"
      name: "PM 展示 Review 汇总 + 用户确认"
      agent: "pm-agent"
      input: "Review 报告 + PRD + 学习报告"
      action: |
        PM 先展示专家 Review 汇总（不足/建议/问题），再请用户确认：

        "项目学习完成，专家 Review 汇总：
         ✅ 忠实还原度：98%（2处图片内容不清晰，已标注）
         ✅ 页面覆盖：35/35 页面全部覆盖
         ⚠️ 业务操作矩阵：缺少'已取消'状态的操作
         💡 建议补充退款流程的异常分支
         请确认：通过 / 补充：xxx / 驳回"

        用户响应：
        - 通过 → 进入 Stage 6 交付确认
        - 补充 → 人工修正 → 重新 Review（Stage 5.5）
        - 驳回 → 重新学习（补充来源/换来源，回到 Stage 1）

    # ---- Stage 6: 交付确认（v4.0.0 增强 + V5.0.0 Review 校验） ----
    - id: "6"
      name: "交付确认"
      agent: "doc-agent"
      input: "Stage 1~5 全部产出"
      action: |
        1. 核对 PRD 完整性：
           - 逐卷检查页面/模块/功能是否与 Stage 1 的清单一致
           - 核对合并后的单一 PRD 是否包含所有分卷内容
           - 核对分析建模结果（泳道图/流程图/状态机等）是否完整嵌入

        2. 核对卷间链接完整性：
           - 每条链接可追溯
           - 合并后文档内部交叉引用是否正确

        3. 核对问题清单与 PRD 的隔离性：
           - 确认 PRD 正文无纠偏痕迹
           - 确认「原型未提供」标注仅出现在内容缺失处，不出现在学习报告中

        4. 核对 doc-standards 合规：
           - 确认 Stage 4 合规检查已通过关键项
           - 原型缺失项已在学习报告中登记

        5. 展示交付摘要
      output: "交付摘要（对话展示）"
      note: "无六视角目录 / 无 summary.json / 无 topology.json"

  # ============================================
  # 多卷拆分策略（v4.0.0 保留，但最终合并为单一文档）
  # ============================================
  volume_split_strategy:
    trigger: "Stage 1 预估单文档超过 800 行 或 超过 15 个页面"
    split_by: "模块边界（优先） > 业务子系统 > 页面组"
    naming: "{项目}-PRD-v{version}-vol{N}-{模块名}.md"
    index_naming: "{项目}-PRD-v{version}-index.md"
    merged_naming: "{项目}-超级需求文档-PRD-v{version}.md"
    note: "分卷为过程产物；Stage 3.5 合并后的单一 PRD 为最终交付物"
    volume_header_template: |
      > **上一卷**：[{项目}-PRD-v{version}-vol{N-1}-{模块名}.md](./{文件名}) ← 当前卷 → **下一卷**：[{项目}-PRD-v{version}-vol{N+1}-{模块名}.md](./{文件名})
      > **卷索引**：[{项目}-PRD-v{version}-index.md](./{项目}-PRD-v{version}-index.md)
    volume_footer_template: |
      ---
      > **下一卷**：[{项目}-PRD-v{version}-vol{N+1}-{模块名}.md](./{文件名})
      > **卷索引**：[{项目}-PRD-v{version}-index.md](./{项目}-PRD-v{version}-index.md)
    index_structure:
      - "版本链概览：列出所有卷的编号→模块名→文件名"
      - "卷目录：每卷的章节索引"
      - "全局 UC→PG 映射表"
      - "全局 FN→BR 映射表"
      - "全局 实体→页面 映射表"
      - "全局 SC→PG 映射表（v4.0.0 新增）"
      - "全局 状态机节点→FN 映射表（v4.0.0 新增）"

  # ============================================
  # HTML 原型专用拆分策略（v4.0.0 新增，doc-splitter 集成）
  # ============================================
  html_proto_splitter:
    description: "针对 HTML 原型的 doc-splitter 专用配置，确保逐文件全文加载"
    source_type: "html-proto"
    split_by: "html_file"
    max_per_batch: 2
    rule: |
      对 HTML 原型，不按「模块/场景/角色」拆分，而是按原始 HTML 文件逐个读取。
      每个 HTML 文件视为 1 个不可再拆的原子文档单元。
      读取时确保全文加载（不截断），然后逐字段、逐按钮、逐注释提取。
    batch_loading:
      - step: "doc-splitter 扫描源目录，将每个 HTML 文件注册为一个文档单元"
      - step: "按 Stage 1 确认的模块分组，将同模块的 HTML 文件归入同一批次"
      - step: "每批次 ≤2 个 HTML 文件，逐个全文加载"
      - step: "单文件超大（>5000 字）时，doc-splitter 拆分为子单元，标注父子关系"
    quality_gate: "每批次完成后核对字段数/按钮数/注释数与原文一致"

  # ============================================
  # 知识入库路径规范（v4.0.0 更新）
  # ============================================
  knowledge_paths:
    requirement_doc: ".codebuddy/knowledge/projects/{project}/需求文档/"
    learning_report: ".codebuddy/knowledge/projects/{project}/学习报告/"
    external_assets: ".codebuddy/knowledge/projects/{project}/外部连接资产/"
    prd_format: "{项目}-PRD-v{version}-vol{N}-{模块名}.md（过程产物）"
    merged_prd_format: "{项目}-超级需求文档-PRD-v{version}.md（★ 最终交付物）"
    index_format: "{项目}-PRD-v{version}-index.md"
    report_format: "{项目}-学习报告-v{version}.md"
    history_format: "{项目}-超级需求文档-PRD-v{旧version}.md（全量学习时旧版本保留）"

  # ============================================
  # /rebuild 衔接（将已学内容回投脑暴）
  # ============================================
  rebuild_link:
    command: "/rebuild"
    description: "将 .codebuddy/knowledge/projects/{project}/需求文档/ 下 PRD + 学习报告 重新提交给 brainstorm 流程，反复讨论得出最终确认的需求定稿"
    action: "加载已学 PRD（合并后的单一文档 + 分卷文档）+ 学习报告（问题清单 + 合规检查结果）→ 回投 brainstorm → 基于问题清单逐项讨论 → 重新定稿"

  # ============================================
  # 交互反馈模板（v4.0.0 增强）
  # ============================================
  feedback_template: |
    📋 学习完成确认

    **项目**：{project}
    **知识源**：{来源列表}
    **学习模式**：{全量学习/增量学习--module=xxx}
    **还原模式**：忠实还原 + 业务分析 + 🟡隐式挖掘还原（V7.0.0场景深度还原引擎）

    **AI自动识别结果**：
    - 业务系统：{系统名称}（{系统缩写}）
    - 涉及终端：{终端列表（缩码）}
    - 子系统：{子系统列表（缩写）}
    - 编号方案：FN-{系统缩写}-{终端缩码}-{NNN}

    **产出概览**：
    - 页面：{数量} 个
    - 模块：{数量} 个
    - 业务场景（SC）：{数量} 个
    - 功能用例（UC）：{数量} 个
    - 业务规则（BR）：{数量} 条
    - 实体（ENT）：{数量} 个
    - 接口：{数量} 个
    - 外部连接资产：{数量} 个
    - 泳道图：{数量} 张
    - 业务流程图：{数量} 张
    - 信息流转图：{数量} 张
    - 状态机：{数量} 个（含过渡操作表）
    - 时序图：{数量} 张
    - PRD 卷数：{数量} 卷（过程产物）

    **V7.0.0 场景深度还原概览**：
    - 场景编排关系：{数量} 个（顺序/并行/互斥/循环/依赖）
    - 🟡隐式挖掘场景：{数量} 个（显式场景{数量} + 隐式挖掘{数量}）
    - 异常路径（有依据）：{数量} 条
    - 🟡隐式挖掘状态：{数量} 个（显式状态{数量} + 隐式挖掘{数量}）
    - 信息血缘链路：{数量} 条
    - 四维验证矩阵：{数量} 个单元格（已填充{数量} / 缺口{数量}）
    - 场景闭环率：{百分比}%
    - 🟡挖掘依据链审计：{数量} 条标注（有依据{数量} / 违规{数量}）

    **最终交付物**：
    - ⭐ .codebuddy/knowledge/projects/{project}/需求文档/{项目}-超级需求文档-PRD-v{version}.md（单一 PRD）
    - .codebuddy/knowledge/projects/{project}/需求文档/{项目}-PRD-v{version}-index.md（卷索引）
    - .codebuddy/knowledge/projects/{project}/需求文档/{项目}-PRD-v{version}-vol{N}-*.md（{数量} 卷，过程产物）
    - .codebuddy/knowledge/projects/{project}/学习报告/{项目}-学习报告-v{version}.md（含问题清单 + 合规检查）
    - .codebuddy/knowledge/projects/{project}/学习报告/{项目}-学习报告-v{version}.md（含问题清单 + 合规检查）

    **doc-standards 合规度**：{合规率}%（{合规项数}/{总检查项数}）
    **原型问题清单**：发现 {数量} 个问题（{缺失类数量}/{矛盾类数量}/{模糊类数量}/{不一致类数量}/{逻辑漏洞类数量}），详见学习报告。
    **原型缺失项**：{数量} 个章节/维度标注「原型未提供」

    **请确认**：通过 / 补充：xxx
    （可使用 /rebuild 将 PRD + 问题清单回投脑暴重新讨论）
