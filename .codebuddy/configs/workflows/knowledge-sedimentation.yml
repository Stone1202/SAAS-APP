# ============================================
# Workflow: knowledge-sedimentation（版本沉淀学习引擎 V5.3.0）
# 版本: v5.3.0
# 最后更新: 2026-07-20
# ============================================
#
# V1.1.0 升级：大脑记忆导出 + 脑力进化摘要 + 跨Agent因果链
#   1. Step 3.5（新增）：大脑记忆导出——每个Agent导出结构化的brain-memory
#   2. Step 3.6（新增）：脑力进化摘要——PM汇总所有大脑的进化
#   3. Step 5.5（新增）：跨Agent因果链提取——识别"BA发现→UX改进→QA优化"的因果
#   4. 沉淀质量评分新增 brain_evolution 维度（15%）
#   5. 产物目录新增 大脑记忆/ 子目录
#
# V1.0.0：需求沉淀 + Review沉淀 + 经验提炼 + 追溯链快照
# ============================================
#
# 设计来源：版本沉淀学习机制设计方案-V1.0.0.md
# 对齐：POM V4.0.0
#
# 核心原则：
#   1. /close 校验通过后自动触发（无需用户触发）
#   2. 需求沉淀：REQ 产物快照化归入知识库
#   3. Review沉淀：REV-SUMMARY汇总归档+经验提炼（V5.3.0：7合1）
#   4. 经验提炼：PM提炼可复用经验，追加到跨版本经验库
#   5. 追溯链快照：完整追溯链冻结
#   6. 版本索引：VERSION-INDEX.yml自动更新
#   7. 跨项目复用：经验库追加到 common/经验库/
#   8. 全程留痕：沉淀过程写入Journal
# ============================================

workflow:
  id: "knowledge-sedimentation"
  name: "版本沉淀学习引擎（V5.3.0：3步精简+Review合并+经验分层）"
  version: "5.3.0"
  owner: "pm-agent"
  type: "automation"
  brain_memory_spec: ".codebuddy/knowledge/common/brain-memory-spec.yml"  # V1.1.0新增
  brain_evolution_engine: ".codebuddy/knowledge/common/brain-evolution-engine.yml"  # V1.1.0新增

  # ============================================
  # 触发条件
  # ============================================
  trigger:
    description: |
      /close 校验全部通过后，PM自动执行版本沉淀。
      无需用户触发，是/close的最后一个自动步骤。
    events:
      - "close_validation_passed"   # /close校验通过
    precondition: |
      ✅ 该流 stage = closed
      ✅ PBL 全部闭环（含跨版本传递已标记）
      ✅ REV-SUMMARY 汇总报告已产出且通过（V5.3.0：7合1）
      ✅ 追溯链完整性校验通过
    auto: true

  # ============================================
  # 沉淀产物目录结构
  # ============================================
  output_layout:
    base: ".codebuddy/knowledge/projects/{project}/版本沉淀/{version}/"
    structure:
      沉淀摘要.md: "该版本沉淀总览（含大脑进化摘要）"
      需求沉淀/:
        PRD-v{version}.md: "PRD快照（17章+五图）"
        REQ-产物体系-v{version}.md: "泳道图/业务操作矩阵/信息流/FN/UC/BR/ENT/CONFIG/METRIC"
        模块清单.yml: "本次版本涉及的模块清单"
        上下游影响矩阵.yml: "本次版本的跨域影响"
      Review沉淀/:
        REV-SUMMARY-v{version}.md: "V5.3.0：全阶段Review汇总报告（原7份合并为1份，含各阶段问题/亮点/改进建议）"
        Review经验提炼.md: "从汇总报告提取的可复用经验"
      大脑记忆/:
        ba_memory_{version}.yml: "BA大脑记忆快照"
        ux_memory_{version}.yml: "UX大脑记忆快照"
        arch_memory_{version}.yml: "Arch大脑记忆快照"
        fd_memory_{version}.yml: "FD大脑记忆快照"
        qa_memory_{version}.yml: "QA大脑记忆快照"
        ac_memory_{version}.yml: "AC大脑记忆快照"
        pm_memory_{version}.yml: "PM大脑记忆快照"
        po_memory_{version}.yml: "PO大脑记忆快照（如激活）"
        sm_memory_{version}.yml: "SM大脑记忆快照（如激活）"
        brain_evolution_summary_{version}.md: "大脑进化摘要"
        cross_agent_causal_chains.yml: "跨Agent因果链"
      经验教训/:
        lessons-learned-v{version}.yml: "本版本经验教训"
        最佳实践.md: "值得推广的做法（项目级）"
        踩坑记录.md: "避免重复踩的坑（项目级）"
      追溯链/:
        traceability-v{version}.yml: "FN→UC→PG→MD→SC→BG→BO+CONFIG→BR/FN+METRIC→BG/BO追溯快照"
    index: ".codebuddy/knowledge/projects/{project}/版本沉淀/VERSION-INDEX.yml"
    # V5.3.0：经验分层——项目级直接写入，跨项目级追加到common/经验库/
    project_experience:
      base: ".codebuddy/knowledge/projects/{project}/经验/"
      files: ["最佳实践-项目级.md", "踩坑避雷-项目级.md", "Review模式-项目级.md"]
    cross_project:
      best_practices: ".codebuddy/knowledge/common/经验库/最佳实践库.md"
      pitfalls: ".codebuddy/knowledge/common/经验库/踩坑避雷库.md"
      review_patterns: ".codebuddy/knowledge/common/经验库/Review模式库.md"
      pending_review: ".codebuddy/knowledge/common/经验库/_pending/"  # V5.3.0：待管理员审核的跨项目经验
  # ============================================
  # 沉淀执行流程（3步，V5.3.0精简：原8步合并为3步，close提速50%）
  # ============================================
  execution:
    steps:
      - step: 1
        name: "沉淀准备（目录创建+需求快照+Review合并归档+大脑记忆导出+脑力进化摘要）"
        owner: "pm-agent + ba-agent + all-agents"
        action: |
          === 原step 1+2+3+3.5+3.6 合并 ===

          1. **兜底检查**：PM 检查 .codebuddy/knowledge/projects/{project}/ 是否存在
             - 不存在 → 创建该目录（新项目首次 /close）
             - 检查 common/经验库/ 是否存在，不存在则创建+初始化3个空文件
          2. **创建沉淀目录**：
             .codebuddy/knowledge/projects/{project}/版本沉淀/{version}/
             子目录：需求沉淀/ Review沉淀/ 经验教训/ 追溯链/ 大脑记忆/
          3. **需求快照**（BA协作）：PRD+REQ产物体系+模块清单+影响矩阵 → 需求沉淀/（标注版本号+冻结时间）
          4. **Review汇总归档**（V5.3.0：7份合并为1份）：
             - PM 收集 journal/reviews/ 下 REV-SUMMARY-v{version}.md（V5.3.0：7份合并为1份，按阶段分章节：BS/BA/UX/ARCH/FD/QA/AC）
             - 每阶段含：问题清单+亮点+改进建议+质量评分
             - 提炼 Review经验提炼.md（反复问题模式+最佳实践+阶段薄弱点）
          5. **大脑记忆导出**（各Agent独立）：各Agent导出本版本大脑记忆快照 → 大脑记忆/{agent}_memory_{version}.yml
             同步到 {项目知识库}/大脑记忆/latest/{agent}_memory_latest.yml
          6. **脑力进化摘要**（PM汇总）：大脑进化概览+预测准确率对比+跨Agent因果链识别+下版本建议
             产出 brain_evolution_summary_{version}.md

      - step: 2
        name: "经验分层提炼与追溯链快照（项目级+跨项目级+因果链+追溯链）"
        owner: "pm-agent + doc-agent"
        action: |
          === 原step 4+5+5.5 合并 ===

          1. **经验分层提炼**（V5.3.0：项目级+跨项目级双层）：
             a. 项目级经验（直接写入项目知识库）：
                - .codebuddy/knowledge/projects/{project}/经验/最佳实践-项目级.md
                - .codebuddy/knowledge/projects/{project}/经验/踩坑避雷-项目级.md
                - .codebuddy/knowledge/projects/{project}/经验/Review模式-项目级.md
                → 仅本项目可复用的经验，直接写入无需审核
             b. 跨项目级经验（追加到全局经验库）：
                - common/经验库/最佳实践库.md（追加，标注来源项目+版本）
                - common/经验库/踩坑避雷库.md（追加）
                - common/经验库/Review模式库.md（追加）
                → 通用经验直接追加，去重+标注来源
             c. 待审核经验（如涉及流程/Agent/Skill改进建议）：
                - common/经验库/_pending/流程改进建议-v{version}.yml
                → 需管理员 /review-process-improvements 审核后提升为正式经验
          1.5. **维度预判准确率统计+AI学习闭环**（V1.1.0新增）：
             a. 统计AI在Layer1.3预判的维度清单 vs §2.5专家补盲后的最终维度清单：
                - AI预判维度数 / 最终维度数 = AI预判准确率
                - AI遗漏的维度列表 + 遗漏原因分析
                - AI误报的维度列表（AI识别但专家判定不适用）
             b. 遗漏模式提取（追加到经验库供AI学习）：
                - 如"涉及分佣但AI没识别精度兜底"→下次AI模拟财务专家时增加精度检查
                - 如"涉及冻结/解冻但AI没识别状态依赖"→下次AI模拟架构专家时增加状态检查
                → 追加到 common/经验库/踩坑避雷库.md（标注：维度识别遗漏模式）
             c. AI学习反馈：
                - 遗漏模式 → 版本沉淀的 lessons-learned-v{version}.yml
                - 下次/init时AI加载上一版本维度遗漏模式 → 提高预判准确率
                - 目标：版本迭代后AI预判准确率从初期50-60%逐步提升到90%+
             d. 版本级经验教训：
                - lessons-learned-v{version}.yml（版本概述+关键指标+经验教训+改进措施+大脑进化要点）
                - 经验教训/最佳实践.md + 踩坑记录.md（版本级快照）
          2. **追溯链快照**（DOC协作）：
             - traceability-v{version}.yml
             - FN→UC→PG→MD→SC→BG→BO+CONFIG→BR/FN+METRIC→BG/BO 全链
             - 标注版本冻结时间
          3. **跨Agent因果链提取**（AI分析）：
             - 上游发现→下游预防 / 上游遗漏→下游捕获 / 大脑预警→命中 / 跨脑共识→闭环
             - 产出 cross_agent_causal_chains.yml
             - 追加到经验库（标注因果链+阶段跨度+修复成本）

      - step: 3
        name: "索引更新与质量校验（版本索引+沉淀摘要+Journal+质量校验）"
        owner: "pm-agent + doc-agent"
        action: |
          === 原step 6+7+8 合并 ===

          1. **更新版本索引**（DOC协作）：
             - VERSION-INDEX.yml 新增版本条目
             - 记录沉淀内容清单+关键指标+经验标签+大脑进化指标
             - DOC 更新 INDEX.md 自动索引
          2. **生成沉淀摘要**：
             - 沉淀摘要.md：版本概述+沉淀内容清单+关键指标+核心经验+关联文件索引+质量评分
          3. **Journal记录**：
             "版本 {version} 已沉淀到知识库，
              沉淀内容：需求+Review汇总+经验(项目级+跨项目级)+追溯链+大脑记忆，
              质量评分：{score}"
          4. **沉淀完整性校验**（见 sedimentation_validation）：阻止close如果必选项缺失

  # ============================================
  # Review经验提炼规则
  # ============================================
  review_distillation_rules:
    dimensions:
      - dimension: "反复问题"
        description: "多个阶段Review中重复出现的问题"
        output: "踩坑记录.md + common/经验库/踩坑避雷库.md"
        example: "状态机不完整（BA+QA+AC三阶段重复出现）"
      - dimension: "最佳实践"
        description: "Review中标注'做得好'或值得推广的部分"
        output: "最佳实践.md + common/经验库/最佳实践库.md"
        example: "限流规则前置定义（BA阶段定义，FD阶段直接复用）"
      - dimension: "阶段薄弱点"
        description: "哪个阶段Review问题最多"
        output: "lessons-learned-v{version}.yml"
        example: "UX阶段问题最多（10项中4项不通过）"
      - dimension: "跨阶段一致性"
        description: "上下游阶段Review结论是否一致"
        output: "lessons-learned-v{version}.yml"
        example: "BA状态机与FD代码状态流转不一致"
      - dimension: "Review质量"
        description: "Review报告本身的深度和准确性"
        output: "lessons-learned-v{version}.yml"
        example: "QA Review覆盖全面，FD Review偏浅"

  # ============================================
  # 沉淀完整性校验
  # ============================================
  sedimation_validation:
    required:
      - check: "需求沉淀完整"
        items: ["PRD-v{version}.md", "REQ-产物体系-v{version}.md", "模块清单.yml", "上下游影响矩阵.yml"]
        on_fail: "阻止close，补齐后重试"
      - check: "Review沉淀完整"
        items: ["REV-SUMMARY-v{version}.md 汇总报告（V5.3.0：7合1）", "Review经验提炼.md"]
        on_fail: "阻止close"
      - check: "追溯链已快照"
        items: ["traceability-v{version}.yml"]
        on_fail: "阻止close"
      - check: "版本索引已更新"
        items: ["VERSION-INDEX.yml 新增条目"]
        on_fail: "阻止close"
    optional:
      - check: "经验教训已提炼"
        items: ["lessons-learned", "最佳实践", "踩坑记录"]
        on_fail: "警告（不阻止）"
      - check: "沉淀摘要已生成"
        items: ["沉淀摘要.md"]
        on_fail: "警告"

  # ============================================
  # 沉淀质量评分
  # ============================================
  quality_scoring:
    description: "PM对本次沉淀自动评分（0-100，V1.1.0新增brain_evolution维度）"
    dimensions:
      - dimension: "requirements_completeness"
        weight: 20  # V1.1.0从25调整为20
        description: "需求完整性（PRD+产物体系+模块清单+影响矩阵）"
      - dimension: "review_depth"
        weight: 20  # V1.1.0从25调整为20
        description: "Review深度（REV-SUMMARY汇总+经验提炼）（V5.3.0：7合1）"
      - dimension: "lessons_actionability"
        weight: 15  # V1.1.0从20调整为15
        description: "经验可操作性（能否被下一版本直接复用）"
      - dimension: "traceability_coverage"
        weight: 15
        description: "追溯覆盖（FN→BO全链覆盖）"
      - dimension: "brain_evolution"  # V1.1.0新增
        weight: 15
        description: "大脑进化质量（新增模式有效性+预测准确率变化+脑力共识质量+跨Agent因果链价值）"
        sub_dimensions:
          - name: "新增模式有效性"
            weight: 5
            description: "本版本大脑新增的模式是否有实际数据支撑"
          - name: "预测准确率变化"
            weight: 5
            description: "各大脑预测准确率 vs 上版本的变化趋势"
          - name: "跨Agent因果链价值"
            weight: 5
            description: "提取的因果链对下版本的实用价值"
      - dimension: "cross_version_value"
        weight: 15
        description: "跨版本复用价值（经验库+大脑记忆追加质量）"
    output: "写入VERSION-INDEX.yml的sediment_quality字段"

  # ============================================
  # 与/init的知识加载交互
  # ============================================
  init_integration:
    description: |
      下一版本/init时，PM自动加载上一版本沉淀+经验库。
      加载逻辑在project-lifecycle.yml的/init.pm_actions中定义。
    load_priority:
      - priority: 1
        source: "跨版本传递PBL"
        description: "必须处理（上一版本未闭环反馈）"
      - priority: 2
        source: "上一版本Review经验提炼"
        description: "避免重复踩坑"
      - priority: 3
        source: "上一版本PRD"
        description: "基线参考"
      - priority: 4
        source: "/learn产出的PRD"
        description: "原始需求"
      - priority: 5
        source: "common/经验库"
        description: "跨版本+跨项目通用经验"

  # ============================================
  # 跨项目经验复用
  # ============================================
  cross_project:
    description: |
      沉淀的经验追加到common/经验库/，供其他项目复用。
      /init时PM检查common/经验库/，若存在则加载为全阶段背景知识。
    library_path: ".codebuddy/knowledge/common/经验库/"
    files:
      - "最佳实践库.md：所有项目的最佳实践（按版本标注来源）"
      - "踩坑避雷库.md：所有项目的踩坑记录（按版本标注来源）"
      - "Review模式库.md：所有项目的Review问题模式"
    dedup_rule: "相同经验不重复追加，仅标注新增来源版本"
