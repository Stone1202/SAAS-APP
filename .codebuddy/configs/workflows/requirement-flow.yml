#   2. 新增知识库映射(Layer1) + 5层知识库全量检索(Layer2) + 2轮收窄机制(Layer2) + 三维业务融合度(Layer3) + 版本规划判断(Layer3)
#   3. quality_forecast + history_correlation从§0.5c下沉到Layer3融合分析
