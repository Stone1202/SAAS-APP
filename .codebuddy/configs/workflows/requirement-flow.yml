#   1. 新增reasoning_modules：planning_boundary_detector/e2e_closure_analyzer/comprehensive_uc_designer
#   2. §0.5 新增规划边界探测——BA基于PO Backlog识别In-Scope/Out-of-Scope/边界交叉点
#   3. §5 新增端到端闭环校验——每个FN做6链闭环检查（入口/操作/状态/异常/信息/统计）
#   4. §7 新增全面用例设计——AI基于闭环缺口自动补全UC+四向一致性校验
#   5. 新增铁律 BA-29：端到端闭环+规划边界感知
