workflow:
  id: "requirement-flow"
  name: "需求分析流程（V3.2.1 BA需求洞察大脑）"
  version: "3.3.0"
  trigger_command: "/init（PM 调度 BA）"
  owner: "ba-agent"
  supervisor: "pm-agent"
  gates_reference: ".codebuddy/knowledge/common/gates-registry.yml#stages.requirement"
  iron_rules_reference: ".codebuddy/knowledge/common/iron-rules-registry.yml#agents.ba_agent"
  doc_standard_reference: ".codebuddy/knowledge/common/doc-standards.yml"
  system_blueprints_reference: ".codebuddy/knowledge/common/system-blueprints.yml"  # V3.1.0
  brain_memory_spec: ".codebuddy/knowledge/common/brain-memory-spec.yml"  # V3.2.0新增

  # ============================================
  # V3.2.1统一：BA需求洞察大脑（标准ai_brain结构，对齐arch-flow/test-flow）
  # ============================================
  ai_brain:
    id: "ba_brain_v1"
    name: "需求洞察大脑"
    description: |
      BA不再是机械套用PRD模板——BA大脑基于历史质量数据、跨版本Bug模式
      和需求特征指纹，推理出当前需求的高风险区域和质量预测。
      在PRD撰写前即预判风险焦点，而非等QA测试才暴露。
    reasoning_modules:
      - id: "quality_predictor"
        name: "质量预测推理"
        description: |
          基于跨版本Bug模式和需求复杂度，AI预判每个FN的质量风险评分。
          输入：跨版本Bug模式（QA Bug+AC Bug） + 当前FN清单 + 变更范围
          输出：FN级风险评分（CRITICAL/HIGH/MEDIUM/LOW）+ 风险类型标签
          示例：「支付模块 × 历史5次金额精度Bug + 本次新增分期付款 → CRITICAL风险」
        triggered_by: "requirement-flow §0.5c（融合分析阶段）"
        priority: "HIGH（必须在PRD输出前完成，影响后续测试策略）"
      
      - id: "history_correlator"
        name: "历史关联推理"
        description: |
          AI将当前需求的语义特征与历史需求进行指纹匹配，
          发现相似需求→相似问题模式，提前预警。
          输入：当前需求语义特征 + 历史PRD指纹库 + 历史Bug关联
          输出：关联需求清单（相似度+关联问题）+ 引以为戒清单
          示例：「当前需求'词库批量导入'特征指纹匹配到'商品批量导入'→该需求曾出现编码/超时/部分成功3类Bug → 预警」
        triggered_by: "requirement-flow §0.5c（融合分析阶段）"

      - id: "planning_boundary_detector"
        name: "规划边界探测器（V5.1.4新增）"
        description: |
          基于PO的Backlog识别需求边界——BA不是凭空分析，而是在PO规划的边界内做端到端闭环。
          输入：PO的PROD-BACKLOG + PROD-ROADMAP + 价值评估 + 实现方式标记
          输出：In-Scope/Out-of-Scope/边界交叉点 + 每个边界的依赖声明
          分析维度：
            1. In-Scope边界：本次版本必须完成哪些FN？（来自PO Backlog的Must/Should项）
            2. Out-of-Scope边界：哪些功能明确排除？（来自PO Non-Goals + backend_config项排入patch小版本）
            3. 边界交叉点：本次需求与已有模块的复用边界/依赖边界/数据流边界
          示例：
            「FN-009回放 → 复用FN-005实时擦音回放组件（跨版本复用边界）
             FN-010统计 → 复用AuditEvent数据源（跨模块依赖边界）
             多MPS模板 → PO标记backend_config排入v2.0.1（Out-of-Scope边界）」
          价值：BA明确知道"分析到哪里为止"，避免过度分析或遗漏边界依赖。

      - id: "e2e_closure_analyzer"
        name: "端到端闭环分析器（V5.1.4新增）"
        description: |
          对每个规划项做端到端闭环校验——不是只看单个FN，而是确保每个FN有完整的6链闭环。
          输入：FN清单 + UC清单 + 状态机 + 业务操作矩阵 + 数据实体 + 信息流转图
          输出：每个FN的6链闭环校验结果 + 缺口清单 + 补充建议
          6链闭环校验：
            1. 入口链：用户/系统如何进入这个功能？有触发条件吗？
            2. 操作链：进入后能做什么操作？操作链是否完整（查看→操作→反馈）？
            3. 状态链：涉及的状态是否全部覆盖？状态过渡是否完整？
            4. 异常链：异常场景是否有备选流程？失败是否有兜底？
            5. 信息链：数据从哪来→经过什么处理→到哪去？信息流是否闭环？
            6. 统计链：这个功能的数据是否被统计/看板消费？统计链是否闭环？
          缺口识别规则：
            - 入口链无触发条件 → 缺少[事件驱动]UC
            - 状态链有状态无UC覆盖 → 缺少状态触发UC
            - 异常链无备选流程 → 缺少异常处理UC
            - 统计链断裂 → 缺少METRIC或看板UC
          示例：
            「FN-009端到端闭环校验：
              入口链✅(直播结束→检测录像→创建任务)
              操作链✅(列表→详情→回放)
              状态链✅(待处理→处理中→已完成/已失败)
              异常链✅(API失败→重试→上限→记录)
              信息链✅(录像URL→MPS任务→擦音后URL→统计)
              统计链✅(任务数→完成数→失败数→看板UC-010-05)
              ⚠️缺口：回放操作未声明权限校验UC → 建议补充UC-009-07」
          价值：确保每个FN是"端到端完整闭环"而非"功能碎片"。

      - id: "comprehensive_uc_designer"
        name: "全面用例设计器（V5.1.4新增）"
        description: |
          基于闭环分析自动补全UC——AI不是替代BA写UC，而是帮BA发现遗漏的UC。
          输入：e2e_closure_analyzer的缺口清单 + 状态机 + 业务操作矩阵 + BR清单
          输出：UC补全建议（缺口UC编号+名称+建议内容）+ 四向一致性校验报告
          UC覆盖规则：
            1. 每个FN覆盖Happy Path + ≥2 Ugly Path + ≥1 Corner Case（BA-04铁律）
            2. UC覆盖状态机的所有状态分支（每个状态至少有1个UC触发/观察）
            3. UC覆盖业务操作矩阵的所有✅单元格（每个可操作单元格至少1个UC）
            4. UC六段完整（BA-27铁律：前置/基本流程/备选/数据范围/后置/关联UC）
          四向一致性校验：
            UC ↔ BR：每个BR至少被1个UC引用
            UC ↔ 状态机：UC的触发操作对应状态机的状态过渡
            UC ↔ 业务操作矩阵：UC的操作对应矩阵的✅单元格
            UC ↔ 数据实体：UC的数据范围(R/W)对应ENT的字段
          价值：BA不再靠经验"想"UC，AI基于结构化分析"推"出遗漏的UC。
    
    brain_memory_import:
      description: |
        BA需求分析开始前，从PM编排器接收上游大脑记忆，
        作为当前分析的"历史洞察"输入。
      sources:
        - priority: 1
          source: "上版本BA大脑记忆"
          content: "质量预测命中率 + 盲区发现→实际影响 + 常识推理覆盖度"
        - priority: 2
          source: "跨版本QA Bug模式"
          content: "按FN的Bug密度统计 + Bug类型分布 + 严重度分布"
        - priority: 3
          source: "跨版本AC验收Bug（UX类+功能类）"
          content: "验收阶段发现的需求遗漏模式"
        - priority: 4
          source: "经验库/需求分析模式库"
          content: "跨版本成功的需求分析模式 + 踩坑记录"
    
    brain_sync_export:
      description: |
        BA需求分析完成后，向PM编排器输出大脑推理结果，
        供下游Agent大脑（UX/Arch/QA）使用。
      to_ux:
        - field: "页面复杂度评分"
          description: "每个页面的交互复杂度评级（simple/medium/complex/very_complex）"
          basis: "基于FN数量×状态数×操作类型数"
        - field: "状态数统计"
          description: "每个模块的状态机状态总数+转换数"
        - field: "交互密度预估"
          description: "每个页面的预估交互密度（按钮数+弹窗数+表单字段数）"
      to_arch:
        - field: "接口复杂度评分"
          description: "预估新接口数量和复杂度"
          basis: "基于FN中的外部依赖+接口契约初稿"
        - field: "预估新接口数"
          description: "本版本需要新增的接口数量"
        - field: "外部依赖数"
          description: "依赖的外部系统/服务数量"
      to_qa:
        - field: "关键业务规则数"
          description: "本版本涉及的BR总数（含新增+修改）"
        - field: "高风险FN清单"
          description: "基于历史Bug模式+本次变更预测的高风险FN（含置信度）"
          basis: "quality_prediction输出"

  # ============================================
  # 步骤定义
  # ============================================
  steps:
    # ---- §0.0 终端冻结（v2.0.0 保留） ----
    - id: "0.0"
      name: "终端冻结"
      agent: "ba-agent"
      description: |
        BA 在需求分析一开始，基于业务描述拆出「业务子系统 → 端建议清单」，
        交用户一次性确认冻结，写入 stream.scope.platforms（逐系统映射）。
        后续 UX/Arch/FD/QA/AC 任何阶段不得再向用户询问「支持哪些端」。
      input: "用户业务描述"
      output:
        - "stream.scope.platforms（逐业务系统→端映射）"
        - "business_systems[{id, suggest_terminals, reason}]"
      checkpoint: true
      note: "用户一次性确认后冻结；若为单系统项目可用扁平 platforms 列表"

    # ---- §0 项目判定与需求路由（V3.0.0 拆分重构，PM负责） ----
    - id: "0"
      name: "项目判定与需求路由"
      agent: "pm-agent"
      description: |
        V3.0.0 拆分重构：PM 负责参数判定和路由，不再交互式询问"新项目/存量项目"。
        PM 接收 /init 全部参数，自动检测项目性质，加载上下文，组装「参数路由包」传递给 BA。
      input: "/init 全部参数（--project/--type/--desc/--file/--api/--source/--priority）"
      output: "参数路由包（param_route_package）"
      checkpoint: false
      sub_steps:
        §0.1_项目性质自动检测: |
          扫描 projects/{--project}/ 目录：
          - 存在 → 存量项目（运行 ensure-project.sh {project} --check 进行6项完整性校验，缺失则补建）
          - 不存在 → 新项目（运行 ensure-project.sh 创建骨架）
        §0.2_需求类型路由: |
          根据 --type 确定分析深度和版本递增策略：
          - 新增：analysis_depth=full, run_impact_analysis=false, version_bump=minor
          - 迭代：analysis_depth=full, run_impact_analysis=true, version_bump=minor
          - 变更：analysis_depth=full, run_impact_analysis=true(重点), version_bump=patch
          - 修复：analysis_depth=lite, run_impact_analysis=true(精简), version_bump=patch
        §0.3_上下文加载: |
          按优先级加载9项上下文：
          1.项目骨架 2.已学PRD 3.版本沉淀 4.经验库 5.PO Backlog(如有)
          6.脑暴确认稿 7.领域知识(继承脑暴清单或自动匹配)
          8.跨版本反馈 9.行业统计指标规则 metrics-standards.yml（V3.0.0新增）
          → 组装「参数路由包」传递给 BA
      param_route_package_structure: |
        param_route_package:
          project, project_type, requirement_type, priority, version
          demand_sources: { desc, files, api_docs, knowledge_sources }
          context: { project_skeleton, knowledge_prd, version_sediment,
                     experience_library, po_backlog, brainstorm_confirmed,
                     domain_knowledge_list, metrics_standards }
          route: { analysis_depth, run_impact_analysis, run_domain_fusion,
                   run_config_identification, run_metric_identification }
          version_chain: { previous_closed_version, current_version, version_bump_strategy }
      note: "PM 完成路由后，将参数路由包传递给 BA，BA 从 §0.5 开始深度分析"

    # ---- §0.5 需求深度分析整合（V3.0.0 核心新增，BA负责） ----
    - id: "0.5"
      name: "需求深度分析整合"
      agent: "ba-agent"
      skills: ["req-impact-analyzer", "system-common-sense-analyzer"]  # V3.1.0新增
      description: |
        V3.0.0 核心新增阶段：在旅行地图之前增加"分析整合"阶段，
        确保后续所有分析基于深度分析结果而非裸描述。
        含三个子步骤：§0.5a 需求描述AI深度分析 / §0.5b 项目影响分析 / §0.5c 融合分析。
        V3.1.0 增强：§0.5c 融合分析阶段调用 system-common-sense-analyzer，
        基于系统类型声明+PRD的FN列表，AI推理该类型系统应该具备的功能域，
        发现需求盲区并注入需求全景图。
      input: "参数路由包（全部输入源+领域知识+行业指标规则+项目存量）"
      output: "需求全景图（demand_panorama）"
      checkpoint: true

      sub_steps:
        # ---- §0.5a 需求描述AI深度分析 ----
        §0.5a:
          name: "需求描述AI深度分析"
          condition: "analysis_depth=full 时全跑；analysis_depth=lite(修复)时跳过"
          input: "--desc/--file/--api/--source 全部输入源 + 领域知识 + 行业指标规则"
          output: "需求深度分析报告（demand_analysis_report）"
          methodology: |
            BA 对全部输入源进行6维深度分析：

            维度1-语义提取：从--desc/--file提取核心业务概念、操作动词、角色主体、状态变化、约束条件
            维度2-意图识别：表面意图vs深层意图（如"积分兑换"深层含积分体系+库存+限流+防刷+退换货+过期）
            维度3-业务概念抽取：实体概念/流程概念/规则概念/角色概念
            维度4-隐含需求挖掘：基于业务逻辑推导未提及但必须有的需求（有A→必有B/C/D）
            维度5-领域知识深度结合：
              - 需求概念×领域知识业务流程（标准流程参考）
              - 需求概念×Part12 API参数字典（接口参数对齐）
              - 需求概念×Part13参数流转图（参数流转关系）
              - 需求概念×领域知识BR（标准业务规则参考）
              - 需求概念×领域知识状态机（标准状态机参考）
            维度6-外部接口融合：
              - --api接口vs领域知识api_chain接口对齐
              - --api参数vs Part12参数字典对齐
              - --api调用顺序vs Part13参数流转图对齐
              - 缺口识别（--api有但领域知识没有的接口→需补充学习）
              - 产出接口参数×业务流程映射表

          output_structure: |
            demand_analysis_report:
              semantic_extraction: { concepts, operations, roles, states, constraints }
              intent_analysis: { surface_intent, deep_intent }
              business_concepts: { entities, processes, rules, roles }
              implicit_requirements: [{ requirement, derivation, priority }]
              domain_knowledge_fusion:
                matched_domains: [...]
                api_param_references: [{ domain, api_id, matched_concept, params_used }]  # Part12
                param_flow_references: [{ domain, flow, matched_concept }]  # Part13
                br_references: [...]
                state_machine_references: [...]
              external_api_fusion:
                api_alignment: [{ external_api, domain_api, alignment, gaps }]
                param_flow_mapping: [...]

        # ---- §0.5b 项目影响广度深度分析 ----
        §0.5b:
          name: "项目影响广度深度分析"
          skills: ["req-impact-analyzer"]
          condition: "存量项目时执行；新项目跳过。修复类型精简版（仅扫描Bug所在模块）"
          input: "需求深度分析报告 + 项目知识库（已有PRD/topology/state.json/版本沉淀）"
          output: "影响分析报告（impact_analysis_report）"
          methodology: |
            V3.0.0 从单维topology对比升级为8维影响扫描：
            维度1-模块拓扑影响（广度）：对比topology，受影响模块+级别
            维度2-数据实体影响（深度）：扫描ENT，新增/修改/删除实体+字段级变更
            维度3-状态机影响（深度）：扫描SM，新增状态/修改转换/新增转换路径
            维度4-业务规则影响（深度）：扫描BR，新增/修改/冲突规则
            维度5-接口契约影响（深度）：扫描接口初稿，新增/修改/废弃接口
            维度6-跨模块信息流影响（广度）：扫描IF，新增支路/修改路径/新增信息主体
            维度7-集中配置影响（广度，V3.0.0新增）：扫描CONFIG，新增/修改配置项+依赖
            维度8-统计指标影响（广度，V3.0.0新增）：扫描METRIC，新增/修改指标+依赖

            修复类型精简版：仅执行维度1(模块拓扑)+维度5(接口契约)定位Bug波及面，其余维度跳过。

          output_structure: |
            impact_analysis_report:
              impact_matrix: [{ module, dimensions: { entity, state_machine, rule, contract, info_flow, config, metric } }]
              affected_artifacts: { new, modified, deprecated }
              impact_chain: "新需求→模块A→实体B→状态C→规则D→接口E（Mermaid图）"
              impact_summary: { breadth, depth, risk_level }

        # ---- §0.5c 融合分析（V3.2.0增强） ----
        §0.5c:
          name: "融合分析（需求全景图+系统常识盲区+质量预测+历史关联）"
          skills: ["system-common-sense-analyzer", "quality-predictor", "history-correlator"]  # V3.2.0新增
          input: "需求深度分析报告(§0.5a) + 影响分析报告(§0.5b) + 系统类型声明 + PRD FN列表 + 跨版本Bug数据 + BA大脑记忆"
          output: "需求全景图（demand_panorama）+ 盲区报告 + 质量预测报告 + 脑力同步输出"
          methodology: |
            将§0.5a需求深度分析和§0.5b项目影响分析进行融合，产出需求全景图。
            全景图是后续§1旅行地图/§2场景挖掘/§3业务流程的输入基础。

            ═══ V3.2.0新增：质量预测推理 ═══
            在融合分析过程中，BA 调用 quality-predictor:
            1. 输入：上一版本的QA Bug模式（按FN） + AC验收Bug模式 + 当前FN清单
            2. AI 按FN级推理风险：
               a. 历史Bug密度扫描：该FN在跨版本中出现的Bug次数+严重度
               b. 本次变更复杂度：新增状态数 × 新增BR数 × 新增接口数
               c. 相似FN模式匹配：「这个FN跟历史哪个FN结构相似？那个FN出了什么问题？」
               d. 产出：FN级风险评分（0-100）+ 风险类型标注 + 置信度
            3. 示例推理：
               「FN-ORDER-PC-003 退款流程 → 
                历史：跨3个版本共11个Bug（状态机Bug 6个+金额Bug 3个+通知Bug 2个）
                本次变更：状态机新增2个状态+新增3条BR
                推理：综合风险评分 85/100 (CRITICAL)
                风险类型：状态机完整性(60%) + 金额精度(25%) + 通知时序(15%)
                建议：重点设计状态过渡+金额字段用整数+异步通知重试」
            4. 输出到全景图的 quality_forecast 区块

            ═══ V3.2.0新增：历史关联推理 ═══
            在融合分析过程中，BA 调用 history-correlator:
            1. 输入：本次需求特征向量 + 跨版本PBL + 经验库Review模式
            2. AI 提取本需求的"特征指纹"（模块组合+操作类型+状态复杂度+信息流模式）
            3. 在历史版本中搜索相似指纹的需求
            4. 发现相似需求→提取该需求遇到的问题模式→预警
            5. 示例推理：
               「本次'批量导入违禁词'需求 → 
                指纹：批量操作+文件上传+数据校验+状态变更
                相似：v1.2'批量导出'（交互相似）+ v1.5'客户导入'（业务相似）
                v1.2问题：未覆盖大文件超时场景（PBL-023）
                v1.5问题：校验规则与前端不一致（PBL-045）+ 并发冲突（PBL-047）
                预警：本次同样需要注意→文件大小限制+校验规则定义+并发锁」
            6. 输出到全景图的 history_correlation 区块

            ═══ V3.1.0原有：系统常识盲区探测 ═══
            （保持不变）AI按7层模型（L0~L6）推理该类型系统应具备的功能域，
            发现需求盲区并注入需求全景图。

            融合逻辑（原有+增强V3.2.0）：
            1. 需求×影响交叉（不变）
            2. 需求×领域知识×项目存量三方对齐（不变）
            3. 需求×系统常识：AI盲区探测结果注入全景图（V3.1.0，不变）
            4. **V3.2.0新增：需求×质量预测：跨版本Bug模式→高风险FN注入全景图**
            5. **V3.2.0新增：需求×历史关联：相似需求→相似问题模式注入全景图**
            6. 全景图含旅行地图前置输入（不变）

          output_structure: |
            demand_panorama:
              requirement_scope: { explicit, implicit, domain_referenced }
              impact_scope: { new_artifacts, modified_artifacts, reused_artifacts }
              alignment: [{ concept, domain_standard, project_existing, new_requirement, gap }]
              journey_map_input: { personas, entry_points, key_touchpoints, exit_points, cross_terminal }
              scenario_hints: [...]
              # V3.2.0新增
              quality_forecast:  # 质量预测
                high_risk_fns: [{ fn_id, risk_score, risk_types, confidence, reasoning }]
                risk_summary: { total_fns, high_risk_count, medium_risk_count, low_risk_count }
              history_correlation:  # 历史关联
                similar_requirements: [{ version, req_name, fingerprint_match, problems_encountered }]
                warnings: [{ type, description, source_version, source_pbl }]
              # V3.1.0原有
              system_common_sense_blind_spots:
                total_blind_spots: N
                critical: [{ area, layer, ai_reasoning, risk_if_missing }]
                important: [{ area, layer, ai_reasoning, risk_if_missing }]
                nice_to_have: [{ area, layer, ai_reasoning }]
                confirmed_exclusions: [{ area, reason }]
                ai_confidence: "high | medium | low"

