#   7. 引用expert-registry.yml（专家统一配置管理：18盲区专家+7系统划分专家）
#   8. 新增铁律 BA-31(三阶段不可跳过) + BA-32(闭环验证不可跳过) + BA-33(冻结机制)
#   9. 新增门禁 G-REQ-22(业务闭环) + G-REQ-23(系统闭环) + G-REQ-24(系统划分) + G-REQ-25(终端划分)
#
# V3.3.0 升级：BA AI大脑深度增强——规划边界感知+端到端闭环+全面用例设计
#   1. 新增reasoning_modules：planning_boundary_detector/e2e_closure_analyzer/comprehensive_uc_designer
#   2. §0.5 新增规划边界探测——BA基于PO Backlog识别In-Scope/Out-of-Scope/边界交叉点
#   3. §5 新增端到端闭环校验——每个FN做6链闭环检查（入口/操作/状态/异常/信息/统计）
#   4. §7 新增全面用例设计——AI基于闭环缺口自动补全UC+四向一致性校验
#   5. 新增铁律 BA-29：端到端闭环+规划边界感知
#   6. 新增门禁 G-REQ-20：端到端闭环校验
#
# V5.1.1根因修复：UC格式完整性门禁——防止UC只列表格不写详细说明
#   1. §7 新增门禁 G-REQ-17 UC格式完整性（每个UC必须包含六段标准格式）
#   2. 新增铁律 BA-27：UC六段不可省略
