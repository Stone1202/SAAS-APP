#   3. 环节化扫盲：§2.5标注为阶段1扫盲 + §3.5新增阶段2扫盲 + §3.8新增阶段3扫盲
#   4. NFR前移：每个阶段扫盲增加NFR技术扫盲（技术专家帮产品经理识别异步/同步/并发/时效等）
