# V3.4.0 升级：三阶段业务分析 + 环节化扫盲 + NFR前移 + 研发友好用例
#   1. 三阶段分析：阶段1业务还原(§3) → 阶段2系统划分(§3.5新增) → 阶段3终端划分(§3.8新增)
