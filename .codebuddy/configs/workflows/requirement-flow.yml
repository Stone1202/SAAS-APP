# V3.2.1 升级：统一ai_brain结构——对齐arch-flow/test-flow标准格式
#   1. 将brain_memory_import/brain_sync_export统一收归到ai_brain段下
#   2. 新增reasoning_modules定义段（quality_predictor/history_correlator）
#   3. 结构对齐arch-flow/test-flow的标准ai_brain格式
