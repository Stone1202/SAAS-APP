# ============================================
# Workflow: arch-flow（架构评审流程 V3.4.0）
# 版本: v3.4.0
# 最后更新: 2026-07-22
# ============================================
#
# V3.4.0 升级：设计驱动架构 + 反向三文档一致性检查
#   1. 新增 C-A11：架构路由对齐PRD §17路由规划——以PRD为单一事实源
#   2. 新增 C-A12：业务系统终端边界隔离——operator/tenant/viewer物理隔离
#   3. 新增 C-A13：设计→需求→架构反向三文档一致性检查——5维度可执行
#   4. 新增 step-2：反向三文档一致性检查（Arch自动执行+PM审核）
#   5. PM红线从C-A1~C-A10扩展为C-A1~C-A13
#   6. 反向检查清单升级至 V2.0.0（checklists/design-prd-reverse-match.yml 可执行化）
#   7. 引入架构师铁律：路由以PRD为唯一标准、业务系统物理隔离、文档即代码
#
# V3.3.0 升级：Mock后端 + 跨端验收 + 状态机契约
#   1. 新增 C-A9：Mock后端完整性——基于Zod Schema生成Mock路由+状态机引擎+auth路由
#   2. 新增 C-A10：跨端验收脚手架——e2e-acceptance/目录+验收场景脚本+共享数据上下文
#   3. C-A5增强：契约Zod完整性从"实体Schema"升级为"三层契约（实体Schema+API契约+状态机）"
#   4. C-A6增强：五维可插拔从"sim+real占位"升级为"real adapter实现（打Mock后端API）"
#   5. Step 1新增产出：Mock后端脚手架 + real adapter实现 + 跨端验收脚手架
#   6. 依赖 tech-stack.yml V3.1.0（Mock后端架构+跨端验收架构+状态机契约）
#
# V3.2.0 升级：非功能需求（NFR）主题识别
#   1. 新增 ai_brain 推理模块 nfr_topic_identification——AI辅助Arch识别NFR主题
#   2. 新增步骤0：NFR主题识别（架构评审前置，产出NFR清单回传PRD）
#   3. 新增 PM红线 C-A8：NFR清单完整性
#   4. NFR识别覆盖8大主题：高并发/异步/同步/数据一致性/安全/可扩展/可用性/性能
#   5. NFR清单回传BA→PRD §18 非功能需求章节
#
# V3.1.0 升级：Arch大脑注入（架构决策大脑）
#   1. 新增 ai_brain 段——Arch架构决策大脑
#   2. 契约缺陷预测：历史契约Bug模式→当前契约缺陷预警
#   3. 安全模式识别：接口×参数→安全风险点识别
#   4. 依赖链推理：契约变更→影响波及面推理
#   5. 大脑记忆导入：BA/UX的brain_sync_export + 上版本Arch大脑记忆
#   6. 大脑同步输出→FD：实现陷阱预警 + →QA：高风险接口清单
#
# V3.0.0升级：C-A5(契约Zod完整性)/C-A6(五维可插拔)/C-A7(单元测试架构)
# ============================================
#
# 流程专家视角：
#   arch-flow 是 Arch Agent 的守门员流程——在设计完成后、开发开始前，
#   对技术可行性、依赖关系、跨系统接口进行评审。
#   v2.0.0 新增：C-A1~C-A4 PM 红线、接口契约终稿（O-05）、
#   设计→代码衰减控制（O-09）、三段回溯表。
#   V3.4.0 新增：设计驱动架构——Arch不能乱来，必须依据设计和需求文档进行架构。
#   路由以PRD §17为单一事实源，业务系统物理隔离，反向三文档一致性检查为硬门禁。
#
# 核心原则：
#   1. Arch 是守门员（gatekeeper），未通过不得流转 FD
#   2. 架构评审不仅看技术可行性，更要产出机器可校验契约
#   3. 接口契约从 BA 初稿（自然语言）精化为 Zod Schema
#   4. 三段回溯表确保需求→设计→架构的可追溯性
#   5. 【V3.4.0新增】架构必须依据设计和需求文档——PRD是路由唯一标准，设计是组件目录唯一标准
# ============================================

workflow:
  id: "arch-flow"
  name: "架构评审流程（V3.4.0 设计驱动架构+反向三文档一致性检查+Mock后端+跨端验收+状态机契约+NFR主题识别+Arch架构决策大脑）"
  version: "3.4.0"
  trigger_command: "/init（PM 调度 Arch，设计完成后）"
  owner: "arch-agent"
  gates_reference: ".codebuddy/knowledge/common/gates-registry.yml#stages.arch"
  iron_rules_reference: ".codebuddy/knowledge/common/iron-rules-registry.yml#agents.arch_agent"
  supervisor: "pm-agent"
  expert_registry: ".codebuddy/knowledge/common/expert-registry.yml#ba_analysis.architecture_stage"  # V3.4.0新增：架构阶段扫盲专家
  standard: ".codebuddy/knowledge/common/arch/tech-stack.yml"
  gatekeeper: true

  # ============================================
  # V3.1.0新增：Arch架构决策大脑
  # ============================================
  ai_brain:
    id: "arch_brain_v1"
    name: "架构决策大脑"
    description: |
      Arch不再是机械对照红线检查——Arch大脑基于历史契约Bug模式、
      安全知识库和依赖拓扑，推理出当前架构的潜在风险点，
      提前预警而非事后补救。
    reasoning_modules:
      - id: "contract_defect_prediction"
        name: "契约缺陷预测"
        description: |
          基于历史契约Bug模式，AI预判当前契约设计中的潜在缺陷。
          输入：历史契约Bug模式（QA契约一致性测试失败+FD实现Bug）
                + 当前Zod契约定义 + BA接口初稿
          输出：契约风险清单（按接口×风险类型+置信度）
          示例：「金额字段z.number() → 历史5次浮点精度Bug → 预警：建议改为整数+单位」
      
      - id: "security_pattern_recognition"
        name: "安全模式识别"
        description: |
          AI扫描接口契约，基于安全知识库和历史安全漏洞模式，
          识别潜在安全风险（权限校验缺失/敏感数据泄露/注入风险/未加密传输）。
      
      - id: "dependency_chain_reasoning"
        name: "依赖链推理"
        description: |
          当契约变更时，AI推理影响波及面——哪些模块/接口/页面会受影响。
          输入：契约变更diff + 模块拓扑 + 三段回溯表
          输出：影响波及图（波及范围+影响级别）

      - id: "nfr_topic_identification"
        name: "非功能需求主题识别（V3.2.0新增，V3.4.0增强：NFR前移）"
        description: |
          AI辅助Arch从需求文档中识别非功能需求（NFR）主题。
          V3.4.0增强——NFR不再只在架构阶段识别，而是前移到三阶段分析的每个扫盲环节：
          阶段1业务还原：技术专家帮产品经理识别业务场景涉及的NFR（如直播→高并发+时效）
          阶段2系统划分：技术专家帮产品经理识别系统层NFR（如跨系统→数据一致性+同步）
          阶段3终端划分：技术专家帮产品经理识别终端层NFR（如APP→弱网+响应效率）
          架构阶段：Arch汇总前面识别的NFR，给出技术实现方案。
          产品经理不需要懂技术实现，但需要在业务分析阶段就意识到技术要求。
          输入：三阶段扫盲产出的NFR清单 + PRD的FN/UC/BR/ENT/状态机 + 系统类型声明
          输出：NFR主题清单（8大主题×严重级别×实现建议×关联FN）
          8大NFR主题：
            1. 高并发（concurrency）：哪些FN涉及高并发场景？（如直播审核实时推送）
            2. 异步处理（async）：哪些FN涉及异步任务？（如MPS擦音任务回调）
            3. 同步等待（sync）：哪些FN需要同步等待外部响应？（如API调用超时处理）
            4. 数据一致性（consistency）：哪些FN涉及跨系统数据一致性？（如任务状态+录像状态）
            5. 安全性（security）：哪些FN涉及敏感数据/权限/资金安全？
            6. 可扩展性（scalability）：哪些FN需要支持未来扩展？（如多MPS模板）
            7. 可用性（availability）：哪些FN需要高可用保障？（如审核不能停）
            8. 性能（performance）：哪些FN有明确性能指标？（如看板加载<2s）
          示例：「FN-AUD-PC-009涉及异步处理(MPS回调)+数据一致性(任务状态+录像状态)+可扩展性(多MPS模板)」
    
    memory_import:
      sources:
        - "BA大脑brain_sync_export：接口复杂度+新接口数+外部依赖"
        - "UX大脑brain_sync_export：组件实现难度"
        - "上版本Arch大脑记忆：契约缺陷预测准确率+安全模式命中率"
        - "跨版本QA契约一致性测试失败模式"
    
    brain_sync_export:
      to_fd: ["实现陷阱预警（按接口+风险级别）", "安全注意事项清单"]
      to_qa: ["高风险接口清单（重点测试+测试策略建议）", "契约一致性检查点"]

  # ============================================
  # 步骤定义
  # ============================================
  steps:
    - id: "0"
      name: "NFR主题识别（V3.2.0新增：AI辅助Arch识别非功能需求）"
      agent: "arch-agent"
      skills: ["arch-tech-stack-keeper"]
      input: "PRD的FN/UC/BR/ENT/状态机 + 系统类型声明 + 领域知识"
      output:
        - "NFR主题清单（8大NFR主题×严重级别×实现建议×关联FN）"
        - "NFR回传PRD §18 非功能需求章节（Arch识别→BA纳入PRD）"
      path: "projects/{project}/docs/03-architecture/NFR-{version}.yml"
      note: |
        AI辅助Arch识别NFR主题——不是让Arch凭空写NFR，而是AI基于需求内容推理。
        识别完成后NFR清单回传BA，BA将其纳入PRD §18 非功能需求章节。
        8大NFR主题：高并发/异步/同步/数据一致性/安全/可扩展/可用性/性能。
        门禁：G-ARCH-06检查NFR清单产出 + G-REQ-18检查PRD §18 NFR章节存在。

    - id: "1"
      name: "架构评审（技术可行性 + 依赖 + 性能 + 合规）"
      agent: "arch-agent"
      skills: ["arch-tech-stack-keeper", "arch-contract-definer", "arch-scaffold-reviewer"]
      input: "需求产物 + 设计产物 + 外部接口文档（--api）+ BA 接口契约初稿"
      output:
        - "技术可行性结论（通过/有条件通过/驳回）"
        - "依赖关系图（模块间依赖 + 第三方依赖）"
        - "跨系统接口契约（Zod Schema 精化版）"
        - "性能/合规结论"
        - "NFR实现方案（基于step-0识别的NFR主题，给出技术实现方案）"
        - "三段回溯表（需求→设计→架构的 FN 级映射）"
        - "设计→代码衰减控制清单（O-09）"
        - "三层契约：实体Schema + API契约(request/response Zod) + 状态机定义（V3.3.0新增）"
        - "Mock后端脚手架：mock-server/ 基于Zod Schema生成Mock路由+状态机引擎+auth路由（V3.3.0新增）"
        - "real adapter实现：adapters/real/ HttpTransport+JwtAuthProvider+各业务Repository（V3.3.0新增）"
        - "跨端验收脚手架：e2e-acceptance/ 验收场景脚本+共享数据上下文+配置（V3.3.0新增）"
      path: "projects/{project}/docs/04-arch/"
      checkpoint: false  # V3.4.0：step-1完成后自动流转到step-2反向检查

    - id: "2"
      name: "反向三文档一致性检查（V3.4.0新增·设计驱动架构）"
      agent: "arch-agent"
      skills: ["checklist-executor", "design-prd-reverse-matcher"]
      input: "PRD §17路由表 + 架构文档§2.3 + src/router/index.ts + src/components/ + src/pages/ + src/contracts/"
      output:
        - "REVERSE-MATCH-REPORT.md（5维度反向一致性报告）"
        - "路由三重一致性矩阵（PRD §17 ↔ 架构§2.3 ↔ router.ts）"
        - "业务系统终端边界矩阵（operator/tenant/viewer隔离状态）"
        - "FN/ENT/PG覆盖矩阵"
        - "DIR树一致性差异报告"
        - "版本引用一致性报告"
      path: "projects/{project}/docs/04-arch/v{version}/REVERSE-MATCH-REPORT.md"
      execution_mode: "auto"  # Arch自动执行
      reference_checklist: ".codebuddy/configs/checklists/design-prd-reverse-match.yml"
      checkpoint: true  # V3.4.0：反向检查是架构守门裁决的关键输入（人工卡点③）
      note: |
        【架构师铁律】架构产出后必须执行反向三文档一致性检查。
        5维度：路由三重一致性 + 业务系统边界隔离 + FN/ENT/PG全覆盖 + DIR树一致性 + 版本引用一致性。
        不可跳过（max_retry=3），未通过则架构视为不合格，PM退回Arch修正。
      pm_redlines_checked: ["C-A11", "C-A12", "C-A13"]

  # ============================================
  # PM 红线（C-A1~C-A13，V5.5.0 扩展为 13 条，缺则不予放行 FD）
  # ============================================
  pm_redlines:
    - id: "C-A1"
      name: "route-contract 路由映射"
      description: "每个页面路由→组件→数据依赖的完整映射，必须可机器解析"
      format: "YAML"
      check: "逐路由核对：路径 → 组件名 → useXxxStore → 数据字段"
      fail_action: "PM 驳回，Arch 补充缺失路由映射"
    - id: "C-A2"
      name: "运行骨架契约 + pom 已补"
      description: "npm run dev 可启动的完整骨架，pom/ 目录包含对应模块文档"
      check: "实际执行 npm run dev 验证可启动"
      fail_action: "PM 驳回，Arch 补齐骨架"
    - id: "C-A3"
      name: "仿真开关契约"
      description: "每个接口的 sim/real 切换契约（adapter 模式）"
      format: "YAML"
      check: "逐接口核对：接口名 → sim 实现 → real 实现 → 切换条件"
      fail_action: "PM 驳回，Arch 补充仿真开关契约"
    - id: "C-A4"
      name: "三段回溯表"
      description: "需求 FN → 设计页面 → 架构路由的完整追溯映射"
      format: "YAML"
      check: "逐 FN 核对三段是否齐全"
      fail_action: "PM 驳回，Arch 补充缺失追溯"
    - id: "C-A5"
      name: "契约 Zod 完整性（V3.0.0新增，V3.3.0增强为三层契约）"
      description: "三层契约完整：实体Schema + API契约(request/response Zod) + 状态机定义"
      check: |
        1. src/contracts/schemas/ 有全部实体Zod Schema
        2. src/contracts/api/ 有全部接口的request/response Zod Schema + 错误码枚举
        3. src/contracts/state-machine/ 有状态流转实体的状态机定义
        4. src/contracts/registry.ts 有API路由注册表
      fail_action: "PM 驳回，Arch 补充缺失的三层契约"
    - id: "C-A6"
      name: "五维可插拔（V3.0.0新增，V3.3.0增强为real adapter实现）"
      description: "data/transport/stream/asset/auth 五维度都有 sim+real 实现，real adapter打Mock后端API"
      check: |
        1. src/adapters/sim/ 和 src/adapters/real/ 下有对应实现（非空目录）
        2. real/HttpTransport.ts 实现了fetch+token+Zod校验
        3. real/JwtAuthProvider.ts 实现了登录+token存储+请求带header
        4. real/repositories/ 有各业务Repository实现
      fail_action: "PM 驳回，Arch 补齐缺失维度的 sim/real 实现"
    - id: "C-A7"
      name: "单元测试架构（V3.0.0新增）"
      description: "tests/ 存在 + 契约一致性测试覆盖全部接口"
      check: "核对 tests/contract-consistency/ 下是否有全部接口的测试文件"
      fail_action: "PM 驳回，Arch 补齐缺失的契约一致性测试"
    - id: "C-A8"
      name: "NFR清单完整性（V3.2.0新增）"
      description: "Arch必须产出NFR主题清单（8大NFR主题×严重级别×实现建议×关联FN），并回传BA纳入PRD §18"
      check: "核对 docs/03-architecture/NFR-*.yml 存在 + PRD §18 非功能需求章节存在"
      fail_action: "PM 驳回，Arch执行NFR主题识别（AI辅助nfr_topic_identification推理模块）"
    - id: "C-A9"
      name: "Mock后端完整性（V3.3.0新增）"
      description: "mock-server/ 基于Zod Schema生成Mock路由+状态机引擎+auth路由+内存DB持久化"
      check: |
        1. mock-server/server.ts 可独立启动（npm run mock）
        2. mock-server/zod-mock.ts 根据Response Schema自动生成Mock数据
        3. mock-server/store.ts 内存数据库+JSON文件持久化
        4. mock-server/state-machine-engine.ts 基于contracts/state-machine/校验状态流转
        5. mock-server/routes/auth.ts 登录接口返回JWT token
        6. mock-server/routes/ 有全部接口的CRUD+状态流转路由
      fail_action: "PM 驳回，Arch 补齐Mock后端缺失组件"
    - id: "C-A10"
      name: "跨端验收脚手架（V3.3.0新增）"
      description: "e2e-acceptance/ 验收场景脚本+共享数据上下文+配置（原型阶段和真实系统阶段统一框架）"
      check: |
        1. e2e-acceptance/src/config.ts 环境配置（后台URL/APP路由/API地址）
        2. e2e-acceptance/src/contexts/shared-data.ts 跨端共享数据上下文
        3. e2e-acceptance/src/scenarios/ 至少1个验收场景脚本(SC-E2E)
        4. e2e-acceptance/src/utils/ 连接工具（原型:Playwright多上下文 / 真实系统:CDP客户端）
        5. e2e-acceptance/package.json 依赖声明(playwright/ws)
      fail_action: "PM 驳回，Arch 补齐跨端验收脚手架"
    - id: "C-A11"
      name: "架构路由对齐PRD §17路由规划（V5.5.0新增·设计驱动架构）"
      description: >
        【架构师铁律】架构 router.ts 路由必须以 PRD §17「三终端路由/入口复用」为单一事实源，
        Arch不得自创路由方案。每业务系统使用独立路由前缀（/admin/ | /tenant/ | /h5/），
        禁止用功能描述名代替业务系统前缀，禁止两业务系统路由前缀混用。
      check: |
        1. 提取 PRD §17 全部路由定义
        2. 逐条比对 router.ts 的 path/name/meta.terminal/meta.system/meta.fn
        3. 路径前缀是否遵循 /admin/ /tenant/ /h5/ 规则
        4. 参数名是否一致（如 streamId vs liveId）
        5. meta.terminal 是否与实际业务系统一致
      fail_action: "PM 驳回，Arch 按PRD §17修正路由。参考反模式 AP-01「路由前缀混用」"
    - id: "C-A12"
      name: "业务系统终端边界隔离（V5.5.0新增·设计驱动架构）"
      description: >
        【架构师铁律】架构层面必须实现业务系统×终端物理隔离：
        ① components/ 按业务系统分目录（operator/ | tenant/ | viewer/），禁止跨系统混放
        ② pages/ 每个页面归属单一业务系统终端
        ③ router/ 每条路由 meta.system 声明归属业务系统
        ④ stores/ 若共享Store必须声明 scope
      check: |
        1. 遍历 components/ 确认每个子目录归属单一业务系统
        2. 遍历 pages/ 确认每个页面终端归属与 router meta 一致
        3. 遍历 router 确认每条路由有 system 声明
        4. 检查共享 Store 是否声明 system_scope
      fail_action: "PM 驳回，Arch 按业务系统终端拆分目录/组件/路由。参考反模式 AP-02「业务系统组件混放」"
    - id: "C-A13"
      name: "设计→需求→架构反向三文档一致性检查（V5.5.0新增·设计驱动架构）"
      description: >
        【架构师铁律】架构产出后必须执行反向三文档一致性检查
        （checklists/design-prd-reverse-match.yml V2.0.0，5维度可执行），
        产出 REVERSE-MATCH-REPORT.md。反向检查不可跳过（max_retry=3），
        未通过则架构视为不合格。
      check: |
        1. 维度1：PRD §17 路由 ↔ 架构 §2.3 路由 ↔ router.ts 三方路径完全一致
        2. 维度2：components/ + pages/ + router/ + stores/ 业务系统边界隔离
        3. 维度3：PRD FN/ENT ↔ 架构路由/contracts 全覆盖
        4. 维度4：架构文档DIR树 ↔ 实际 src/ 文件完全一致
        5. 维度5：文档间版本引用一致（设计版本号、PRD文件路径）
      fail_action: "PM 驳回，Arch 逐项修复反向检查不一致项。参考反模式 AP-03/04/05"

  # ============================================
  # 接口契约终稿（O-05）
  # ============================================
  interface_contract:
    description: "Arch Agent 将 BA 的接口契约初稿（自然语言）精化为 Zod Schema"
    input: "BA Agent 的接口契约初稿（requirement-flow §6）"
    output: "projects/{project}/docs/04-arch/contracts/{module}/api-contract.yml"
    schema:
      - "接口路径（如 POST /api/auth/login）"
      - "请求 Zod Schema（入参校验）"
      - "响应 Zod Schema（出参校验）"
      - "错误码枚举（如 AUTH_INVALID_CREDENTIALS）"
      - "sim/real 切换契约"

  # ============================================
  # 设计→代码衰减控制（O-09）
  # ============================================
  decay_control:
    description: "Arch Agent 在设计→代码转换阶段控制信息衰减，确保设计意图不丢失"
    checkpoints:
      - "每个设计页面对应有架构路由映射"
      - "每个设计组件对应有 Store 数据契约"
      - "每个交互说明卡对应有 API 接口契约"
      - "每个多端差异点对应有适配策略"
    decay_report_path: "projects/{project}/docs/04-arch/decay-reports/DECAY-{stream_id}-{version}.md"

  # ============================================
  # 交互反馈模板
  # ============================================
  feedback_template: |
    📋 架构评审完成确认

