    **反向检查**：REVERSE-MATCH-REPORT.md（5维度×{通过数}/{总数}）
    **产出文件**：
    - 路由契约：{数量} 条
    - 接口契约（Zod Schema）：{数量} 个
    - 仿真开关契约：{数量} 个
    - 三段回溯表：{数量} 条 FN

    **PM 红线校验（C-A1~C-A13）**：
    [技术架构底线 C-A1~C-A7]
    - [ ] C-A1 route-contract 路由映射
    - [ ] C-A2 运行骨架契约 + pom 已补
    - [ ] C-A3 仿真开关契约
    - [ ] C-A4 三段回溯表
