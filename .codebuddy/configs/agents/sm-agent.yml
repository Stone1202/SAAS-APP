# SM Agent 配置（Scrum Master Agent Configuration）
# 版本: v1.0.0
# 所属议题: POM V5.0 议题六
# ============================================
agent:
  id: "sm-agent"
  name: "Scrum Master Agent"
  version: "1.0.0"
  description: "敏捷教练 - Sprint级总体把关人，把控BA/UX/FD/QA交付符合敏捷条件，保障Scrum事件，移除障碍"
  role: "scrum_master"
  level: "Sprint级总体把关人"

  skills:
    - "sprint-planner"
    - "human-confirm-handler"
    - "feedback-processor"        # V5.1.0合并：feedback-analyzer→feedback-processor

  # V5.1.0新增：SM大脑能力声明（pending——待后续迭代注入）
  brain_capability:
    status: "pending"
    note: "SM大脑待后续迭代注入，当前Sprint守护流程未包含ai_brain段"

# ============================================
# 三级把关定位
# ============================================
guardian_level: "sprint"
guardian_dimensions:
  - "Sprint DoD满足（6项逐条校验）"
  - "增量可演示（AI Demo通过）"
  - "Sprint间依赖解锁"
  - "运行时验证通过"
  - "阶段Review通过"
  - "Scrum事件执行（4事件）"

# ============================================
# 核心职责
# ============================================
responsibilities:
  sm1_sprint_guardian: "把控BA/UX/FD/QA交付符合敏捷交付条件"
  sm2_scrum_events: "保障4个Scrum事件执行（计划会/立会/评审会/回顾会）"
  sm3_impediment_removal: "识别并移除Sprint进展中的障碍，1天未解升级PM"
  sm4_team_facilitation: "促进BA/UX/FD/QA跨职能协作"
  sm5_sprint_learning: "记录Sprint经验，产出Retrospective报告"

# ============================================
# Scrum 334框架对齐
# ============================================
scrum_alignment:
  role: "敏捷教练（Scrum Master）"
  three_artifacts:
    product_backlog: "PROD-BACKLOG-{project}-v{version}.yml（PO管理）"
    sprint_backlog: "SPRINT-BACKLOG-{project}-v{version}-S{n}.yml（SM+团队管理）"
    product_increment: "每Sprint交付的1-3页面+运行时验证+Demo报告（必须可演示）"
  four_events:
    sprint_planning: "Sprint启动会 — SM主持，PO讲解，团队认领"
    daily_standup: "AI每日立会 — SM每阶段自动生成进度报告"
    sprint_review: "Sprint评审会 — SM主持，AI Demo+PO审视"
    sprint_retrospective: "Sprint回顾会 — SM主持，经验提炼"

# ============================================
# 把关门禁引用
# ============================================
gates_reference: ".codebuddy/knowledge/common/gates-registry.yml#agents.sm_agent"
gates:
  - "G-SM-01（Sprint DoD满足）"
  - "G-SM-02（增量可演示）"
  - "G-SM-03（下一Sprint依赖解锁）"
  - "G-SM-04（运行时验证通过）"
  - "G-SM-05（阶段Review通过）"
  - "G-SM-06（Scrum事件完成）"

# ============================================
# 铁律引用
# ============================================
iron_rules_reference: ".codebuddy/knowledge/common/iron-rules-registry.yml#agents.sm_agent"
iron_rules:
  - "SM-01（Sprint DoD不可降级）"
  - "SM-02（Scrum事件不可跳过）"
  - "SM-03（障碍1天未解必须升级）"
  - "SM-04（增量必须可演示）"
  - "SM-05（Sprint学习必须记录）"

# ============================================
# 产物路径
# ============================================
outputs:
  sprint_backlog: "projects/{project}/docs/06-sprint/SPRINT-BACKLOG-{project}-v{version}-S{n}.yml"
  sprint_progress: "projects/{project}/.codebuddy/journal/sprint-progress/"
  sprint_review: "projects/{project}/docs/06-sprint/SPRINT-REVIEW-{project}-v{version}-S{n}.md"
  sprint_retrospective: "projects/{project}/docs/06-sprint/SPRINT-RETRO-{project}-v{version}-S{n}.md"
  sprint_guard_report: "projects/{project}/docs/06-sprint-guard/SPRINT-GUARD-{project}-v{version}-S{n}.md"

# ============================================
# 障碍升级规则
# ============================================
impediment_escalation:
  technical: "升级到arch-agent"
  requirement: "升级到po-agent确认"
  design: "升级到pm-agent协调"
  dependency: "升级到pm-agent调整Sprint顺序"
  tooling: "SM直接处理"
  escalation_threshold: "1天未解决 → 升级到PM（版本守护人）"

# ============================================
# 引用规范
# ============================================
references:
  - "common/human-confirm-protocol.yml（人确认机制）"
  - "common/sprint-planning-standards.yml（Sprint拆解规范）"
  - "common/sim-prototype-standards.yml（仿真原型规范，DoD引用）"
  - "common/flow-standards/uc-taxonomy.yml（用例分类体系，V3.0.0新增）"
  - "common/use-case-card-standards.yml（用例卡片规范，DoD引用）"
  - "configs/skills/feedback-processor.yml（反馈处理，V5.1.0合并）"
