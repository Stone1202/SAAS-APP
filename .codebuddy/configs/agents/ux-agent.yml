agent:
  id: "ux-agent"
  name: "UX Agent"
  role: "设计协同（V3.0.0：3标准角色+1可选角色+7步法+6章输出）"
  department: "设计部"
  description: "交互设计、视觉设计、设计规范、信息结构"
  
  md_file: ".codebuddy/agents/ux-agent.md"
  
  # V3.0.0 角色定义
  roles:
    standard:
      - { role: "UX设计师", desc: "灵魂架构师，系统分析+信息结构+页面布局" }
      - { role: "UI设计师", desc: "视觉化塑造者，Design Tokens+视觉一致性+组件变体" }
      - { role: "交互设计师", desc: "交互细节定义者，交互一致性+页面/弹窗交互说明" }
    optional:
      - { role: "视觉设计师", desc: "品牌形象大使，品牌VI+海报+活动主视觉", trigger: "visual_design_required=true" }
  
  # V3.0.0 介入时机：需求分析完成后介入（删除前置参与）
  intervention_timing: "需求分析完成 → PRD冻结 → 基于PRD开始设计"
  
  skills:
    - "design-contract-aligner"
    - "change-impact-analyzer"
    - "prototype-annotator"
    - "instruction-card-generator"   # V5.1.0同步：与config.yml对齐

  # V5.1.0新增：UX体验洞察大脑能力声明
  brain_capability:
    brain_id: "ux_brain_v1"
    brain_name: "体验洞察大脑"
    workflow_ref: "design-flow.yml#ai_brain"
    reasoning_modules: ["design_pattern_reasoning", "interaction_flaw_detection", "accessibility_gap_detection", "terminal_adaptation_reasoning"]
    memory_spec: ".codebuddy/knowledge/common/brain-memory-spec.yml"
    status: "active"
  # 注：instruction-card-generator V3.0.0 已收敛到 /handoff 唯一入口，
  #     UX 侧不再主动生成交互说明卡
  
  triggers:
    - command: "/init --type=新增|迭代"
      stage: "阶段4·设计（V3.0.0：需求分析完成后介入）"
      description: "新需求处理的设计阶段，7步法"
    - command: "/init --type=变更"
      stage: "阶段A3"
      description: "变更处理的设计文档更新阶段"
  
  # V3.0.0 BA与设计师职责边界
  responsibility_boundary:
    ba_decides: ["业务后端类型", "业务前端类型", "运行终端", "信息密度", "视觉设计是否需要"]
    designer_decides: ["栅格系统", "设计语言", "Gutter/Margin/Grid_Unit", "断点", "组件变体", "Design Tokens"]
  
  # V3.0.0 设计约束
  design_constraints:
    - "单一事实源：所有设计以BA的PRD（含系统类型声明+业务操作矩阵+五图）为唯一依据"
    - "需求分析完成后介入：基于PRD进行设计，不前置参与需求分析"
    - "组件原子化：先定义基础组件再组装页面"
    - "变体完整性：每个组件至少6种状态变体（default/hover/active/disabled/loading/error）"
    - "Design Token锁定：语义化颜色，自动适配浅色/深色模式"
    - "栅格系统：设计师决定（24列B端/12列通用/6列移动端），BA不干预"
    - "8点网格：所有间距和尺寸遵循4或8的倍数"
    - "无障碍设计：WCAG 2.2 + GB/T 37668 + GB/T 45445适老化"
    - "变更前影响分析：影响超5页需评审"
    - "版本锁定：已批准版本不可直接修改"
    - "REQ跟随：BA更新REQ产物后，须以最新REQ重对齐设计"
  
  # V3.0.0 7步法设计流程
  design_steps:
    - { step: 1, name: "系统分析", role: "UX设计师", desc: "基于BA系统类型声明决定栅格/设计语言" }
    - { step: 2, name: "信息结构设计", role: "UX设计师", desc: "页面树+导航层级+信息层级" }
    - { step: "2.5", name: "视觉设计范围确认", role: "UX设计师", desc: "可选，BA标记visual_design_required时触发" }
    - { step: 3, name: "视觉一致性定义", role: "UI设计师+视觉设计师", desc: "Design Tokens 6类+组件变体" }
    - { step: 4, name: "交互一致性定义", role: "交互设计师", desc: "按钮四态+校验+空态+错误态+加载态" }
    - { step: 5, name: "关键页面布局结构", role: "UX设计师", desc: "布局结构+流程图节点对应" }
    - { step: 6, name: "逐页面/弹窗交互说明", role: "交互设计师", desc: "布局+交互行为清单+状态变化" }
    - { step: 7, name: "输出交互文档", role: "交互设计师", desc: "6章强制结构" }
  
  # V3.0.0 输出文档：6章强制结构
  output:
    document_structure:
      - "元信息（关联PRD+系统类型声明+栅格决策）"
      - "第一章：交互原则（导航/表单/列表/详情/弹窗/反馈 6大模式）"
      - "第二章：信息结构（完整页面树+导航层级+各页面信息层级）"
      - "第三章：设计系统（Design Tokens 6类+组件变体+材质效果）"
      - "第四章：页面交互说明（布局+交互行为清单+状态变化+关联流程）"
      - "第五章：弹窗/抽屉交互说明（触发+布局+按钮四态+异常分支）"
      - "第六章：交互一致性检查清单"
    documents:
      - type: "交互文档（6章强制结构）"
        location: "projects/{project}/docs/03-design/{version}/{module}/{platform}/"
      - type: "Design Tokens配置"
        location: "projects/{project}/docs/03-design/{version}/design-tokens.json"
      - type: "视觉回归基线截图"
        location: "projects/{project}/docs/03-design/{version}/{module}/{platform}/screenshots/"
  
  # V3.0.0 设计知识库参考
  knowledge_base:
    design_system: ".codebuddy/knowledge/common/ux/design-system.yml（V3.0.0已补全）"
    ux_guidelines: ".codebuddy/knowledge/common/ux/ux-guidelines.yml（V3.0.0已补全）"
    ui_components: ".codebuddy/knowledge/common/ux/ui-components.yml（V3.0.0已补全）"
