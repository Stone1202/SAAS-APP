# ============================================
# UML状态机建模器（UML State Modeler Skill）
# 版本: V1.0.0
# 创建日期: 2026-07-24
# 用途: UML层级状态机建模（主/子/复合/正交状态）+状态过渡操作表
# ============================================

skill_id: "uml-state-modeler"
name: "UML状态机建模器"
version: "1.0.0"
description: "为业务实体创建UML层级状态机模型——支持主状态/子状态/复合状态/正交状态，自动生成状态过渡操作表和Mermaid stateDiagram-v2代码"

# ============================================
# 触发条件
# ============================================
trigger:
  context: "需求分析阶段——BA识别到实体≥2种状态时触发"
  auto_detect:
    - "PRD中出现实体定义（ENT）"
    - "BA分析中发现实体有≥2种状态"
    - "用户业务描述中有状态流转（如'审核中→已通过'）"

# ============================================
# 输入
# ============================================
inputs:
  - "实体定义（ENT清单）"
  - "业务规则（BR清单）——触发状态变更的规则"
  - "业务流程图/泳道图——状态流转的业务上下文"
  - "用例（UC清单）——触发状态变更的操作"

# ============================================
# 建模流程
# ============================================
stages:

  s1:
    name: "实体状态分析"
    actions:
      - "从PRD ENT清单中提取所有≥2种状态的实体"
      - "识别每个实体的主状态（顶层状态）"
      - "识别子状态（主状态下的细分状态，如'已支付'下含'待分账/已分账'）"
      - "识别复合状态（内含其他状态的组合状态）"
      - "识别正交状态（相互独立的并行状态区域）"
    output: "实体-状态映射表"

  s2:
    name: "状态过渡分析"
    actions:
      - "从BR和UC中提取每个状态变更的触发操作"
      - "分析触发操作的前置约束条件"
      - "分析触发操作的后置动作（通知/日志/关联变更）"
      - "识别非法状态过渡（应被阻止的路径）"
    output: "状态过渡操作表（当前状态×触发操作×目标状态×操作者×前置约束×后置动作）"

  s3:
    name: "状态机Mermaid生成"
    actions:
      - "基于状态映射+过渡表生成Mermaid stateDiagram-v2代码"
      - "标注复合状态的nesting结构"
      - "标注正交状态的parallel区域（使用--符号分隔）"
      - "添加状态注释（[[ ]] for note）"
    output: "Mermaid stateDiagram-v2 代码块"

  s4:
    name: "一致性校验"
    actions:
      - "校验所有状态都有入口和出口（孤立状态检测）"
      - "校验所有BR中的状态变更都有状态机覆盖"
      - "校验所有UC中的操作都有对应状态过渡"
      - "校验PRD状态相关术语与状态机节点名称一致"
    output: "一致性校验报告"

# ============================================
# 输出产物
# ============================================
outputs:
  state_machine_diagram:
    format: "Mermaid stateDiagram-v2"
    filename: "SC-{PREFIX}-{NNN}.md"
    description: "实体状态机图（含层级复合/正交状态）"
  
  state_transition_table:
    format: "Markdown表格"
    columns: ["当前状态", "触发操作", "目标状态", "操作者", "前置约束", "后置动作"]
    description: "状态过渡操作表，一行一过渡"
  
  consistency_report:
    format: "Markdown"
    description: "BR/UC/ENT一致性校验报告"

# ============================================
# 引用规范
# ============================================
references:
  - "common/doc-standards.yml#state_machine_format"
  - "common/gates-registry.yml#G-REQ-05"
  - "common/iron-rules-registry.yml#BA-05"

# ============================================
# 质量门禁
# ============================================
quality_gates:
  - id: "SM-01"
    rule: "所有≥2种状态的实体必须产出状态机图"
  - id: "SM-02"
    rule: "状态机图必须配套状态过渡操作表（6列完整）"
  - id: "SM-03"
    rule: "状态节点名称必须与PRD中术语一致"
  - id: "SM-04"
    rule: "非法状态过渡必须在表中标注为禁止"
