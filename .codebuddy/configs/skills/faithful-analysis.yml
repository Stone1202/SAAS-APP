# Skill: 忠实分析器（Faithful Analysis）
# 版本: v1.0.0
# 创建日期: 2026-07-15
# 说明: learn-project v4.0.0 Stage 2.5 专用技能——基于原文已有信息进行业务分析建模，
#       借鉴 requirement-flow 的方法论但严格遵循「不推测补充」原则。
skill:
  id: "faithful-analysis"
  name: "faithful-analysis"
  version: "1.0.0"
  agent: "ba-agent"
  description: >
    基于原文已有信息进行业务分析建模（场景识别→泳道图→流程图→信息流→状态机→业务操作矩阵→时序图）。
    借鉴 requirement-flow §3/§5 方法论，但核心区别：分析基于原文，不推测补充。
    原文缺失的分析维度标注「原文未提供」并记录到学习报告。

  triggers:
    - workflow: "learn-project"
      stage: "2.5"
      description: "learn-project 忠实提取完成后，自动触发业务分析建模"

  inputs:
    - "Stage 2 逐卷忠实提取结果（分卷 PRD 初稿，含完整的字段/按钮/注释/规则照录）"

  # ============================================
  # 分析方法论
  # ============================================
  methodology:
    core_principle: "分析基于原文，不推测补充"
    key_difference_from_requirement_flow: |
      requirement-flow 允许 BA 基于一句话需求描述进行合理推测和补充，
      faithful-analysis 严格禁止推测——原文有什么就分析什么，
      原文缺失的分析维度标注「原文未提供」并记录到学习报告。

  # ============================================
  # 七大分析步骤
  # ============================================
  steps:

    # 步骤 1：场景识别与分类
    - id: "FA-01"
      name: "场景识别与分类"
      description: "从原文的页面/功能描述中识别业务场景"
      input_source: "原文的页面标题、菜单路径、按钮入口、页面跳转关系"
      method: |
        1. 遍历所有页面的标题和功能描述，提取场景候选
        2. 对每个场景候选：
           a. 场景名称 → 从原文标题/菜单路径提取
           b. 场景参与者 → 从原文角色/权限描述提取
           c. 场景触发条件 → 从原文按钮/入口描述提取
           d. 场景出口 → 从原文跳转/后置条件提取
           e. 场景关联页面 → 从原文页面跳转关系提取
        3. 场景编号：SC-{系统缩写}-{NNN}
        4. 生成「场景清单」表格
      output_format: |
        | 场景编号 | 场景名称 | 参与者 | 触发条件 | 出口 | 关联 PG | 来源 |
        |---------|---------|--------|---------|------|---------|------|
        | SC-{系统缩写}-001 | ... | ... | ... | ... | PG-{系统缩写}-{终端缩码}-001 | 商品管理.html |
      fallback: "若原文未提供完整的场景描述，照录已有部分，缺失列标注「原文未提供」"

    # 步骤 2：场景流程泳道图
    - id: "FA-02"
      name: "场景流程泳道图"
      description: "对每个识别出的场景绘制 Mermaid flowchart 泳道图"
      input_source: "原文的操作步骤、角色描述、部门归属、按钮行为"
      method: |
        1. 从原文中提取该场景涉及的所有角色/部门
           - 若原文明确标注角色（如「操作员」「管理员」「供应商」），使用原文角色名
           - 若原文未明确标注角色，使用「用户/系统」双泳道
        2. 从原文中提取操作步骤序列，逐步骤放入对应泳道
        3. 从原文中提取分支条件（if/else/条件判断），绘制分支路径
        4. 从原文中提取异常处理描述，绘制异常路径
        5. 使用 Mermaid flowchart 语法绘制泳道图
      output_format: "Mermaid flowchart（含泳道定义）"
      fallback: |
        若原文仅单角色视角：标注「原文未提供跨角色视角，泳道图仅展示单角色流程」
        若原文未提供异常路径：标注「原文未提供异常路径描述」

    # 步骤 3：业务流程图
    - id: "FA-03"
      name: "业务流程图"
      description: "绘制端到端业务流程图"
      input_source: "原文的完整操作路径、条件分支、页面跳转"
      method: |
        1. 从原文提取主干流程（Happy Path）：按原文描述的操作顺序串联节点
        2. 从原文提取分支流程：条件判断产生的备选路径
        3. 从原文提取异常流程：错误/超时/权限不足等 Ugly Path
        4. 标注跨页面衔接点（页面跳转）
        5. 每个流程节点标注对应的 FN 编号
        6. 使用 Mermaid flowchart 语法绘制
      output_format: "Mermaid flowchart（节点标注 FN 编号）"
      fallback: "若原文未提供完整流程，标注「原文流程不完整，以下仅展示已描述部分」"

    # 步骤 4：信息流分析
    - id: "FA-04"
      name: "信息流分析"
      description: "识别原文中的信息主体及其流转路径"
      input_source: "原文的实体/字段定义、操作权限描述、页面数据关系"
      method: |
        a. 信息主体清单（对齐 doc-standards.yml info_entities）：
           - 信息主体名：从原文实体名称提取
           - 归属业务系统：从原文模块/菜单归属提取
           - 生产者（角色/动作）：从原文创建/编辑操作提取
           - 消费者（角色/动作）：从原文查看/使用页面提取
           - 依赖的前置动作：从原文操作前置条件提取

        b. 信息流转图（Mermaid flowchart，多业务系统时必画）：
           - 标注信息在系统间的同步源/同步目标
           - 标注同步触发动作(FN)
           - 标注失败兜底（若原文有描述）

        c. 信息流触发业务动作映射表：
           | 信息主体.字段变化 | 触发动作(FN) | 产生结果 | 来源 |
           仅基于原文已有的联动描述建立映射
      output_format: "信息主体清单表格 + Mermaid flowchart + 触发映射表"
      fallback: |
        若原文未涉及跨系统：标注「原文未涉及跨系统信息流转」
        若原文未提供联动描述：标注「原文未提供信息流触发动作描述」

    # 步骤 5：业务状态机
    - id: "FA-05"
      name: "业务状态机"
      description: "对原文中有明确状态描述的实体绘制状态机"
      input_source: "原文的状态标签、状态筛选项、状态列、操作按钮的前置条件"
      method: |
        1. 从原文提取状态列表：
           - 状态标签/徽章的文本
           - 状态筛选下拉选项
           - 表格状态列的值
        2. 从原文提取状态转换：
           - 操作按钮的名称（如「发货」「审核通过」「拒绝」）
           - 操作的前置条件（如「仅待发货状态可操作」）
           - 操作后的结果状态
        3. 绘制 Mermaid stateDiagram-v2
        4. 每个合法转换标注：触发 FN + 操作者角色
        5. 配套状态过渡操作表：
           | 当前状态 | 触发操作(FN) | 目标状态 | 操作者 | 前置约束 | 后置动作 |
      output_format: "Mermaid stateDiagram-v2 + 状态过渡操作表"
      fallback: |
        若原文未提供完整状态定义：照录已有部分，缺失标注「原文未提供」
        若原文完全无状态描述：标注「原文未提供状态定义」，跳过此步骤

    # 步骤 6：业务操作矩阵
    - id: "FA-06"
      name: "业务操作矩阵"
      description: "建立角色×部门×状态×操作的业务操作矩阵"
      input_source: "原文的角色定义、权限描述、操作限制说明"
      method: |
        1. 从原文提取所有角色（如「操作员」「管理员」「供应商」等）
        2. 从原文提取每个角色可执行的操作（FN）
        3. 从原文提取操作的前置状态约束
        4. 建立矩阵：| 业务操作(FN) | 角色 | 部门 | 前置业务状态 | 触发后目标状态 | 后置影响模块/数据 |
      output_format: "业务操作矩阵表格（对齐 doc-standards.yml business_operation_matrix）"
      fallback: "若原文未提供权限描述：标注「原文未提供权限定义」，跳过此步骤"

    # 步骤 7：时序流
    - id: "FA-07"
      name: "时序流"
      description: "绘制业务时序图和三方接口时序图"
      input_source: "原文的角色交互描述、接口调用描述"
      method: |
        1. 业务时序图：标注角色间的操作时序（基于原文的操作步骤顺序）
        2. 三方接口时序图：若原文有接口描述，标注接口路径、请求/响应
        3. 使用 Mermaid sequenceDiagram 语法
      output_format: "Mermaid sequenceDiagram"
      fallback: "若原文未提供接口信息：标注「原文未提供接口描述」，仅绘制业务时序图"

  # ============================================
  # 质量门禁
  # ============================================
  quality_gate:
    checks:
      - id: "FA-QG-01"
        name: "可追溯性检查"
        rule: "泳道图/流程图/状态机中的每个节点必须能追溯到原文的具体描述（标注来源文件+行/段落）"
      - id: "FA-QG-02"
        name: "忠实性检查"
        rule: "所有分析结论不得超出原文描述范围；任何推测性内容必须标记「推测」并记录到学习报告"
      - id: "FA-QG-03"
        name: "完整性检查"
        rule: "原文中所有明确的状态/角色/流程节点是否全部纳入分析"
      - id: "FA-QG-04"
        name: "标注完整性检查"
        rule: "所有原文缺失的维度是否已标注「原文未提供」"

  # ============================================
  # 输出产物
  # ============================================
  output:
    per_volume:
      - "场景清单表格（SC 编号）"
      - "场景泳道图（Mermaid flowchart）"
      - "业务流程图（Mermaid flowchart，节点标注 FN）"
      - "信息主体清单 + 信息流转图 + 触发映射表"
      - "状态机（Mermaid stateDiagram-v2）+ 状态过渡操作表"
      - "业务操作矩阵表格"
      - "时序图（Mermaid sequenceDiagram）"
    per_dimension_fallback: "每个分析维度若原文未提供，标注「原文未提供」并记录到学习报告"

  # ============================================
  # 与 requirement-flow 的关键区别
  # ============================================
  vs_requirement_flow:
    - dimension: "信息来源"
      requirement_flow: "用户一句话需求描述"
      faithful_analysis: "已有原型/文档的完整原文内容"
    - dimension: "补充推测"
      requirement_flow: "允许 BA 合理推测补充（异常流/边界/状态等）"
      faithful_analysis: "严格禁止推测，缺失标注「原文未提供」"
    - dimension: "场景识别"
      requirement_flow: "从用户旅程地图推导场景"
      faithful_analysis: "从原文页面/功能描述提取场景"
    - dimension: "泳道图"
      requirement_flow: "BA 设计跨角色协作流程"
      faithful_analysis: "从原文角色描述提取泳道；若原文无角色信息，用「用户/系统」双泳道"
    - dimension: "状态机"
      requirement_flow: "BA 设计完整状态生命周期"
      faithful_analysis: "从原文状态标签/按钮前提提取已有状态；缺失不补充"
    - dimension: "产出位置"
      requirement_flow: "独立 REQ 产物体系目录"
      faithful_analysis: "嵌入各卷 PRD 的「五类图」章节，最终合并入单一 PRD"
