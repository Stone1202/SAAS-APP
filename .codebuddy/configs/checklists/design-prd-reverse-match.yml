# ============================================
# 反向三文档一致性检查清单
# ============================================
# 用途：架构产出后，从设计文档反向检查 PRD 与架构的一致性
# 触发阶段：project-lifecycle stage-4（架构阶段）completion_criteria
# 执行者：Arch Agent → PM审核
# 版本：V2.0.0（可执行化）
# 最后更新：2026-07-22
# ============================================
version: "2.0.0"

# ──────────────────────────────────────────
# 核心原则（架构师铁律）
# ──────────────────────────────────────────
principles:
  - id: "P1"
    text: "架构路由以PRD §17为单一事实源，不得自创路由方案"
  - id: "P2"
    text: "业务系统×终端物理隔离，一个目录只放一个业务系统的代码"
  - id: "P3"
    text: "架构文档与实际代码完全一致，文档DIR树即代码目录树"
  - id: "P4"
    text: "每个PRD FN必须有架构层的路由映射或明确的'无独立路由'标注"

# ──────────────────────────────────────────
# 检查步骤（Arch必须逐项执行）
# ──────────────────────────────────────────
checks:
  # --- 维度1：路由路径三重一致性 ---
  dimension_1_routing:
    name: "路由路径三重一致性（PRD §17 ↔ 架构 §2.3 ↔ router.ts）"
    category: "P0阻断"
    steps:
      - id: "R-01"
        action: "提取 PRD §17「三终端路由/入口复用」全部路由定义（路径、FN、终端、说明）"
        source: "PRD文档"
      - id: "R-02"
        action: "提取架构文档 §2.3「路由规划」全部路由定义（路径、FN、终端、页面）"
        source: "架构文档"
      - id: "R-03"
        action: "提取 src/router/index.ts 中全部 routes 定义（path、name、meta.terminal、meta.fn）"
        source: "实际代码"
      - id: "R-04"
        action: "逐条比对：PRD路由 ↔ 架构路由 ↔ router.ts路由"
        check_matrix:
          - check: "路径前缀是否遵循 /admin/ /tenant/ /h5/ 规则"
            severity: "blocker"
          - check: "参数名是否一致（如 streamId vs liveId）"
            severity: "blocker"
          - check: "meta.terminal 是否与实际业务系统一致"
            severity: "blocker"
          - check: "meta.fn 是否覆盖PRD全部FN"
            severity: "blocker"
      - id: "R-05"
        action: "输出「路由三重一致性矩阵」，标记不一致项"

  # --- 维度2：业务系统终端边界 ---
  dimension_2_system_boundary:
    name: "业务系统终端边界隔离"
    category: "P0阻断"
    steps:
      - id: "B-01"
        action: "列出 PRD 中声明的全部业务系统×终端组合（如 PC-运营后台、PC-租户后台、H5-观众端）"
      - id: "B-02"
        action: "检查 components/ 目录：每个子目录是否明确归属单一业务系统"
        sub_checks:
          - "components/audit/operator/ 是否仅含运营后台组件"
          - "components/audit/tenant/ 是否仅含租户后台组件"
          - "components/audit/viewer/ 是否仅含观众端组件"
          - "跨业务系统共享组件是否在 shared/ 目录"
      - id: "B-03"
        action: "检查 pages/ 目录：每个页面是否正确归属到对应终端目录"
        sub_checks:
          - "每个页面的终端归属是否与 router meta.terminal 一致"
          - "是否有页面内容引用其他业务系统的组件（跨系统引用检查）"
      - id: "B-04"
        action: "检查 stores/：共享Store是否声明 system_scope"
        sub_checks:
          - "audit-store.ts 的 system_scope 是否正确"
      - id: "B-05"
        action: "输出「业务系统终端边界矩阵」，标记混放/归属不清项"

  # --- 维度3：FN/ENT/PG 全覆盖 ---
  dimension_3_coverage:
    name: "PRD FN/ENT/PG ↔ 架构 完整覆盖"
    category: "P0阻断"
    steps:
      - id: "C-01"
        action: "提取 PRD 全部 FN 编号列表（如 FN-AUDIT-INFRA-001 ~ FN-AUDIT-APP-001）"
      - id: "C-02"
        action: "检查每个 FN 在架构中是否有路由映射或明确标注'无独立路由'"
        check_matrix:
          - check: "FN-AUDIT-INFRA-001 → 架构标注'共享基础设施，无独立路由'"
          - check: "FN-AUDIT-PC-001 → 映射到明确路由路径"
          - check: "FN-AUDIT-PC-002 → 映射到明确路由路径"
          - check: "FN-AUDIT-PC-003 → 架构标注'嵌入PG-AUDIT-PC-002，无独立路由'"
          - check: "FN-AUDIT-PC-004 → 映射到明确路由路径"
          - check: "FN-AUDIT-APP-001 → 映射到明确路由路径"
      - id: "C-03"
        action: "提取 PRD 全部 ENT 编号，检查 contracts/schemas/ 是否全覆盖"
      - id: "C-04"
        action: "提取设计文档全部 PG 编号，检查 pages/ 是否全覆盖"
      - id: "C-05"
        action: "输出「FN/ENT/PG 覆盖矩阵」，标记缺失项"

  # --- 维度4：架构文档DIR树与实际代码一致性 ---
  dimension_4_dir_consistency:
    name: "架构文档DIR树 ↔ 实际代码文件 完全一致"
    category: "P1高"
    steps:
      - id: "D-01"
        action: "提取架构文档 §8「项目目录结构」的全部文件路径清单"
      - id: "D-02"
        action: "使用工具遍历 src/ 实际文件，生成实际文件清单"
      - id: "D-03"
        action: "逐文件比对：文档声明文件 vs 实际存在文件"
        check_matrix:
          - check: "文档声明但代码不存在的文件（虚增）→ 从文档删除或待实现"
            severity: "high"
          - check: "代码存在但文档未声明的文件（遗漏）→ 补充到文档"
            severity: "medium"
          - check: "文档声明文件路径与实际代码路径不一致"
            severity: "high"
      - id: "D-04"
        action: "输出「DIR树一致性差异报告」"

  # --- 维度5：文档间版本引用一致性 ---
  dimension_5_version_refs:
    name: "文档间版本引用一致性"
    category: "P2中"
    steps:
      - id: "V-01"
        action: "提取架构文档头部的「关联设计」「关联PRD」引用"
      - id: "V-02"
        action: "验证引用的设计文档文件名确实存在"
      - id: "V-03"
        action: "验证引用的PRD文档路径确实存在"
      - id: "V-04"
        action: "验证 pom/state.json 中的 design_doc 版本号与实际一致"
      - id: "V-05"
        action: "输出「版本引用一致性报告」"

# ──────────────────────────────────────────
# 反向检查执行协议
# ──────────────────────────────────────────
execution_protocol:
  trigger: "stage-4 架构阶段完成，Arch提交审查前"
  executor: "Arch Agent 自动执行 + PM审核确认"
  tool_chain:
    - "读取 PRD §17 路由段"
    - "读取 架构 §2.3 路由段"
    - "读取 src/router/index.ts"
    - "遍历 src/components/** src/pages/** src/contracts/**"
    - "生成反向一致性报告"
  output: "REVERSE-MATCH-REPORT.md（存放于 docs/04-architecture/v{版本}/）"
  pass_criteria: "全部5维度通过 + PM红线 C-A8/C-A9/C-A10 全部绿灯"
  max_retry: 3
  on_failure: "架构退回Arch修正 → 重新执行反向检查 → 直到全部通过或3次后PM决策"

# ──────────────────────────────────────────
# 常见反模式（历史错误 — 永不复发）
# ──────────────────────────────────────────
anti_patterns:
  - id: "AP-01"
    name: "路由前缀混用"
    example: "/tenant 路径 meta.terminal=pc-operator（路径名暗示租户，实际是运营后台）"
    root_cause: "Arch直接用页面功能描述做路径，未按PRD定义的业务系统前缀组织"
    fix: "严格使用PRD §17定义的前缀：/admin/ /tenant/ /h5/"
    
  - id: "AP-02"
    name: "业务系统组件混放"
    example: "components/audit/ 下同时放运营后台、租户后台、观众端组件"
    root_cause: "未进行业务系统×终端目录分拆"
    fix: "按 operator/ tenant/ viewer/ 分子目录"
    
  - id: "AP-03"
    name: "文档DIR树与代码不一致"
    example: "架构文档声明 mock-generator.ts 和 replay-service.ts，但实际未实现"
    root_cause: "文档基于设计稿编写而非基于实际代码"
    fix: "架构文档DIR树必须基于实际代码文件生成，严禁凭想象编写"
    
  - id: "AP-04"
    name: "三文档路由三分天下"
    example: "PRD路由路径 A / 架构路由路径 B / router.ts 路径 C — 全不同"
    root_cause: "Arch未以PRD §17为单一事实源，自由设计路由"
    fix: "PRD §17是唯一路由标准，架构只能补充映射不能修改"
    
  - id: "AP-05"
    name: "文档版本引用过期"
    example: "架构文档引用设计文档 v1.0.1，实际文件为 v1.0.0"
    root_cause: "版本号更新未同步修改引用"
    fix: "每次版本变更后执行维度5版本引用一致性检查"
