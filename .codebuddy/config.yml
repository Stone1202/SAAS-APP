    features: ["企微社群", "会员体系", "私域引流", "裂变分销", "SCRM", "内容种草", "微信生态运营"]
  social:
    name: "社交行业"
    features: ["好友关系", "动态feed", "IM即时通讯", "社群", "互动点赞", "裂变传播"]
  game:
    name: "游戏行业"
    features: ["账号体系", "充值付费", "道具皮肤", "排行榜", "活动运营", "防沉迷"]
  erp:
    name: "ERP/企业级应用"
    features: ["组织架构", "审批流", "进销存", "财务报表", "权限矩阵", "工单", "多角色协同"]
  finance:
    name: "金融行业"
    features: ["账户管理", "交易", "资产总览", "风控", "报表"]
  saas:
    name: "SaaS多租户"
    features: ["租户管理", "订阅", "用量监控", "权限"]
  live:
    name: "直播行业"
    features: ["直播间", "商品讲解", "互动", "数据看板"]
  advertising:
    name: "广告行业"
    features: ["广告投放", "数据监测", "素材管理"]
  tourism:
    name: "旅游行业"
    features: ["线路管理", "订单", "导游", "评价"]
  general:
    name: "通用"
    features: ["注册", "登录", "微信登录", "忘记密码", "RBAC", "站内信", "帮助中心", "退出登录", "修改信息"]

# ============================================
# 多端栅格系统与设计语言配置（O-07）
# 03-design 根据端类型自动选择对应栅格和设计语言
# ============================================
platform_grid_systems:
  pc:
    name: "PC（Web 管理/业务后台）"
    grid_columns: 24
    grid_gutter: 16
    breakpoints:
      xl: 1600
      lg: 1200
      md: 992
      sm: 768
      xs: 480
    design_system: "Ant Design"
    design_tokens_source: ".codebuddy/knowledge/common/ux/design-system.yml"
    component_library: "@ant-design/pro-components"
    layout_mode: "flex"
  app:
    name: "APP（iOS/Android 原生）"
    grid_columns: 4
    grid_gutter: 8
    breakpoints:
      lg: 428
      md: 390
      sm: 360
    design_system: "iOS HIG / Material Design"
    design_tokens_source: ".codebuddy/knowledge/common/ux/design-system.yml"
    component_library: "antd-mobile"
    layout_mode: "flex"
    navigation: "native-stack"
  miniapp:
    name: "微信小程序"
    grid_columns: 4
    grid_gutter: 8
    breakpoints:
      default: 375
    design_system: "WeUI / 微信小程序设计指南"
    design_tokens_source: ".codebuddy/knowledge/common/ux/design-system.yml"
    component_library: "@tarojs/components"
    layout_mode: "flex"
    navigation: "mini-program-nav"
    constraints: ["分包限制2MB", "API白名单", "审核合规"]

# ============================================
# 资源锁配置（O-08）
# 防止同一模块/文档被多个需求流并发修改
# ============================================
resource_lock:
  enabled: true
  lock_scope: "module"  # 锁粒度：module | document | function
  auto_release_minutes: 120  # 自动释放时间（分钟）
  lock_strategy: "optimistic"  # optimistic（乐观锁）| pessimistic（悲观锁）
  conflict_resolution: "merge_and_notify"  # 冲突解决策略

# ============================================
# 视觉回归配置（O-07）
# 设计→开发阶段的视觉一致性校验
# ============================================
visual_regression:
  enabled: true
  compare_stages: ["design", "dev", "test"]
  threshold: 0.95  # 相似度阈值（低于此值报警）
  screenshot_dir: ".codebuddy/reports/visual-regression/"
  baseline_source: "projects/{project}/docs/03-design/"

# ============================================
# 追溯链完整性校验（O-10）
# close 阶段自动校验需求→设计→架构→代码追溯链
# ============================================
traceability:
  enabled: true
  chain: ["requirement", "design", "arch", "dev"]
  strict_mode: true  # 缺失任一节点拒绝 close
  auto_fix_gaps: false  # 不自动修补，需人工确认
  report_path: ".codebuddy/reports/traceability/"

# ============================================
# 回退元数据记录（O-12）
# 需求回退时记录原因和影响范围
# ============================================
rollback:
  enabled: true
  record_path: ".codebuddy/reports/rollbacks/"
  fields: ["rollback_id", "stream_id", "version", "reason", "affected_modules", "rollback_date", "operator", "recovery_plan"]

# ============================================
# BR 依赖关系配置（O-04）
# 业务规则可声明 depends_on 依赖链
# ============================================
business_rules:
  dependency_tracking: true
  dependency_format: "BR-{MODULE}-{NNN} depends_on [BR-{MODULE}-{NNN}, ...]"
  circular_detection: true
  impact_analysis_on_change: true

# ============================================
# V3.6.0新增：Agent AI大脑编排全局配置
# ============================================
brain_orchestration:
  enabled: true
  description: |
    Agent AI大脑体系全局配置。每个Agent在各自Stage拥有独立大脑（模式库+预测记录+跨脑协同），
    PM编排器统一调度brain_sync_chain脑力协同链和brain_evolution_trigger大脑进化触发。
  
  # 大脑激活链——每个Stage激活的大脑
  brain_activation_chain:
    - stage: "stage-0 (脑暴)"
      brain: "BS创意大脑"
      workflow: "brainstorm.yml"
      ai_brain_section: "尚未注入（V5.1.0范围外）"
    - stage: "stage-0.5 (PO规划)"
      brain: "PO战略大脑"
      workflow: "po-planning-flow.yml"
      ai_brain_section: "尚未注入（V5.1.0范围外）"
    - stage: "stage-2 (需求分析)"
      brain: "BA需求洞察大脑"
      workflow: "requirement-flow.yml"
      ai_brain_section: "ai_brain (v3.2.1统一)"
      gates: ["G-REQ-16"]
    - stage: "stage-3 (设计)"
      brain: "UX体验洞察大脑"
      workflow: "design-flow.yml"
      ai_brain_section: "ai_brain (v3.3.0注入)"
      gates: ["G-DES-06"]
    - stage: "stage-4 (架构)"
      brain: "Arch架构决策大脑"
      workflow: "arch-flow.yml"
      ai_brain_section: "ai_brain (v3.1.0注入)"
      gates: ["G-ARCH-05"]
    - stage: "stage-5 (开发)"
      brain: "FD实现模式大脑"
      workflow: "dev-flow.yml"
      ai_brain_section: "ai_brain (v2.1.0注入)"
      gates: ["G-DEV-03"]
    - stage: "stage-6 (测试)"
      brain: "QA质量推理大脑"
      workflow: "test-flow.yml"
      ai_brain_section: "ai_brain (v3.1.0注入)"
      gates: ["G-TEST-03"]
    - stage: "stage-7 (验收)"
      brain: "AC+PO验收大脑"
      workflow: "acceptance-flow.yml"
      ai_brain_section: "ai_brain (v2.2.0注入)"
      gates: ["G-ACC-03"]
    - stage: "stage-8 (关闭)"
      brain: "PM大脑编排"
      workflow: "project-lifecycle.yml"
      ai_brain_section: "brain_orchestration (v5.1.0)"
      gates: ["G-CLOSE-05"]
  
  # 脑力协同链——上游大脑输出到下游的传递关系
  brain_sync_chain:
    - from: "BA大脑(brain_sync_export)"
      to: ["UX大脑(to_ux)", "Arch大脑(to_arch)", "QA大脑(to_qa)"]
    - from: "UX大脑(brain_sync_export)"
      to: ["Arch大脑(to_arch)", "FD大脑(to_fd)"]
    - from: "Arch大脑(brain_sync_export)"
      to: ["FD大脑(to_fd)", "QA大脑(to_qa)"]
    - from: "FD大脑(brain_sync_export)"
      to: ["QA大脑(to_qa)"]
    - from: "QA大脑(brain_sync_export)"
      to: ["AC大脑(to_ac)", "BA大脑(to_ba)"]
    - from: "AC大脑(brain_sync_export)"
      to: ["BA大脑(to_ba)", "PM大脑(to_pm)"]
  
  # 大脑进化触发——/close时触发全Agent大脑进化
  brain_evolution_trigger:
    trigger_point: "/close第一个动作"
    engine: ".codebuddy/knowledge/common/brain-evolution-engine.yml"
    steps:
      - "各Agent导出大脑记忆快照（prediction记录+实际结果）"
      - "brain_evolution_engine执行prediction vs actual对比"
      - "按brain-evolution-engine.yml权重调整算法更新各模块权重"
      - "产出BRAIN-EVOLUTION-REPORT（进化摘要+权重变更+因果链）"
      - "新版本/init时加载更新后的大脑记忆"
    gate: "G-CLOSE-05"
  
  # 大脑记忆持久化目录
  brain_memory_dir: ".codebuddy/knowledge/projects/{project}/大脑记忆/{version}/"
  brain_memory_agents:
    - "ba_brain_memory.yml"
    - "ux_brain_memory.yml"
    - "arch_brain_memory.yml"
    - "fd_brain_memory.yml"
    - "qa_brain_memory.yml"
    - "ac_brain_memory.yml"
    - "po_brain_memory.yml"
    - "pm_brain_memory.yml"
    - "sm_brain_memory.yml"
  
  # 大脑能力矩阵（各Agent的大脑状态一览）
  brain_capability_matrix:
    BA: {status: "active", injected_version: "v3.2.1", modules: 2, gates: 1, iron_rules: 1}
    UX: {status: "active", injected_version: "v3.3.0", modules: 4, gates: 1, iron_rules: 1}
    Arch: {status: "active", injected_version: "v3.1.0", modules: 3, gates: 1, iron_rules: 1}
    FD: {status: "active", injected_version: "v2.1.0", modules: 4, gates: 1, iron_rules: 1}
    QA: {status: "active", injected_version: "v3.1.0", modules: 4, gates: 1, iron_rules: 1}
    AC: {status: "active", injected_version: "v2.2.0", modules: 4, gates: 1, iron_rules: 1}
    PO: {status: "active", injected_version: "v2.2.0", modules: 1, gates: 1, iron_rules: 1}
    PM: {status: "active", injected_version: "v5.1.0", modules: 0, gates: 1, iron_rules: 1}
    BS: {status: "pending", injected_version: "-", modules: 0, gates: 0, iron_rules: 0}
    SM: {status: "pending", injected_version: "-", modules: 0, gates: 0, iron_rules: 0}
    DOC: {status: "pending", injected_version: "-", modules: 0, gates: 0, iron_rules: 0}
