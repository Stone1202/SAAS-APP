roadmap:

  v1_0_0:
    version: "v1.0.0"
    name: "V1 配置优先——三终端效果模拟"
    type: "新增"
    priority: "P0"
    sprint_count: 1
    estimated_weeks: "1-2周"
    status: "planning"
    
    goal: |
      聚焦三终端效果模拟，验证直播内容审查核心价值：
      1. 运营后台：租户审查开关管理
      2. 租户后台：直播中控实时监控+人工处置+擦音模式切换
      3. 观众端：直播模拟+静音/擦音效果+断流提示
      4. 回放擦音效果模拟
    
    scope:
      - "运营后台-租户审查开关管理（开启/关闭某租户直播审查）"
      - "租户后台-直播中控内容审查Tab（实时告警+违规列表+处置+擦音模式切换）"
      - "观众端-直播模拟（静音效果/擦音效果/断流提示）"
      - "回放擦音效果模拟（静音/擦音前后对比）"
      - "模拟回调数据生成（模拟腾讯云回调事件，前端Mock）"
    
    out_of_scope:
      - "腾讯云审核模板/擦音任务/敏感词库配置（人工在腾讯云控制台完成）"
      - "敏感词库管理（V2）"
      - "风控规则引擎（V2）"
      - "审核处置流程自动化（V2）"
      - "违规统计看板（V3）"
      - "平台管控策略下发（V3）"
    
    success_criteria:
      - "三终端可独立演示"
      - "观众端可感知静音/擦音两种效果"
      - "直播中控可展示实时告警+违规列表"
      - "运营可处置违规（记录/断流/忽略）"
      - "回放擦音效果可演示"
    
    fn_count: 5
    fn_list:
      - "FN-AUDIT-PC-001: 租户审查开关管理（运营后台）"
      - "FN-AUDIT-PC-002: 模拟回调数据+直播中控告警展示（租户后台）"
      - "FN-AUDIT-PC-003: 直播中控违规处置+擦音模式切换（租户后台）"
      - "FN-AUDIT-PC-004: 回放擦音效果模拟（租户后台）"
      - "FN-AUDIT-APP-001: 观众端直播模拟+静音/擦音效果+断流提示（观众端H5）"

