# VALUE-ASSESSMENT — SAAS直播内容审查 V1.0.0
# PO产品规划：四层价值评估 + 7要素影响
# 日期: 2026-07-22 | PO Agent

project: "SAAS"
version: "v1.0.0"
brainstorm_ref: "00-brainstorm/直播内容审查/confirmed/BR-脑暴文档-确认稿.md (v1.1.0)"

# ============================================
# 四层价值评估
# ============================================
value_assessment:

  layer_1_business_value:
    name: "商业价值"
    score: 9
    rationale: "直播内容合规是SAAS平台的刚需——违规内容流出即造成品牌与合规损失。V1聚焦效果模拟，快速验证核心价值。"
    metrics:
      - "违规内容零流出（模拟验证）"
      - "擦音延迟<3秒（模拟验证）"

  layer_2_delivery_value:
    name: "交付价值"
    score: 8
    rationale: "V1范围聚焦三终端模拟，不涉及腾讯云配置开发，交付周期短（1-2周），快速见效。"
    metrics:
      - "V1交付周期: 1-2周"
      - "三终端可演示: 运营后台+租户后台+观众端"

  layer_3_customer_value:
    name: "客户价值"
    score: 9
    rationale: "租户可直观看到直播内容审查的完整效果——实时擦音/静音+回放擦音/静音+直播中控监控+人工处置，为后续V2/V3开发建立信心。"
    metrics:
      - "三终端完整体验"
      - "静音/擦音两种效果可感知"

  layer_4_scenario_closure:
    name: "场景闭环"
    score: 8
    rationale: "V1覆盖完整场景闭环：运营开启审查→租户直播中控监控→观众感知擦音→回放擦音。虽为模拟但场景完整。"
    metrics:
      - "场景闭环: 运营管控→中控监控→观众感知→回放擦音"
      - "处置闭环: 告警→列表→处置（记录/断流/忽略）"

# ============================================
# 7要素影响评估
# ============================================
company_factors:
  operations:
    impact: "中"
    note: "运营后台新增审查开关管理，操作简单"
  resources:
    impact: "低"
    note: "V1为原型模拟，不涉及后端服务部署，资源消耗低"
  finance:
    impact: "低"
    note: "V1不调用腾讯云API（模拟回调），无API计费"
  channel:
    impact: "中"
    note: "三终端渠道覆盖：运营后台PC+租户后台PC+观众端H5"
  business:
    impact: "高"
    note: "直播内容审查是平台核心合规能力，直接影响业务合规性"
  organization:
    impact: "低"
    note: "现有团队可承接，无需新增角色"
  technology:
    impact: "中"
    note: "基于已有SAAS系统布局（14域PRD已学习），技术路径清晰"

# ============================================
# 实现方式识别（V1核心策略）
# ============================================
implementation_approach:
  strategy: "V1纯前端模拟，不对接腾讯云API"
  rationale: |
    用户明确要求：
    1. 腾讯云配置（审核模板/擦音任务/敏感词库）由人工在腾讯云控制台完成，系统不管
    2. V1聚焦三终端效果模拟——运营后台开关+直播中控监控+观众端擦音效果
    3. 核心目标是实时擦音/静音和回放擦音/静音的效果模拟
  
  v1_scope:
    - terminal: "运营后台(PC)"
      approach: "code_development"
      fn: "租户审查开关管理"
      note: "模拟开关效果，开关后租户后台直播中控显示审查Tab"
    
    - terminal: "租户后台(PC)"
      approach: "code_development"
      fn: "直播中控内容审查Tab"
      note: "模拟接收违规回调数据→实时告警+违规列表+处置操作+擦音模式切换"
    
    - terminal: "观众端(H5 375px)"
      approach: "code_development"
      fn: "直播模拟+擦音效果"
      note: "模拟直播过程，遇到敏感词时展示静音/擦音两种效果+断流提示"
    
    - terminal: "回放擦音"
      approach: "code_development"
      note: "模拟回放文件擦音效果（静音/擦音），展示擦音前后对比"

  excluded_from_v1:
    - "腾讯云审核模板配置（人工在腾讯云控制台完成）"
    - "腾讯云擦音任务配置（人工在腾讯云控制台完成）"
    - "敏感词库管理（V2实现，V1用模拟数据）"
    - "风控规则引擎（V2实现）"
    - "审核处置流程自动化（V2实现）"
    - "违规统计看板（V3实现）"
    - "平台管控策略下发（V3实现）"
    - "租户继承+个性化扩展（V3实现）"
