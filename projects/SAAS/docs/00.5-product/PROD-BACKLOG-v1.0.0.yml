  - id: "BL-AUDIT-003"
    fn: "FN-AUDIT-PC-003"
    name: "直播中控违规处置操作"
    terminal: "租户后台(PC)"
    priority: "P0"
    sprint: 1
    story_points: 3
    description: |
      运营在直播中控执行违规处置：
      1. 记录：记录违规事件，不打断直播，填写处置备注
      2. 断流：切断推流，终止直播，填写处置理由（模拟断流效果）
      3. 忽略：标记非违规，填写忽略理由
      4. 处置超时（30秒未操作）→系统自动记录+告警升级
      5. 处置结果更新违规记录状态+记录处置日志
    implementation: "code_development"
    dependencies: ["BL-AUDIT-002"]
    acceptance:
      - "三种处置操作可执行"
      - "处置后状态更新"
      - "30秒超时自动记录"

