# =============================================================================
# AI-SCRM 产品路线图 v2.0.0
# v2.0.0 变更：三个 Phase 聚焦于"一条客户沟通"的价值递增
# =============================================================================

meta:
  version: "v2.0.0"
  date: "2026-07-18"

phases:

  - phase: 1
    name: "MVP — 让销售人员用起来"
    timeline: "Week 1-8（Sprint 1-4）"
    focus: "「一条客户沟通」的完整AI辅助闭环"
    deliverables:
      - "双系统骨架 + 工作台 + 客户管理"
      - "统一沟通入口（企微聊天 + 电话 + 短信 + 邮件）"
      - "沟通中AI实时辅助（话术推荐 + 情绪监控 + 商品推荐 + 意图识别）"
      - "沟通后AI自动处理（总结 + 质检 + 画像更新 + 跟进生成）"
      - "客户360视图 + 跟进日历"
    metrics:
      - "销售完成一次「客户沟通→AI辅助→AI后处理→跟进」全程 <5分钟"
      - "话术采纳率 >30%"
      - "AI自动总结 + 跟进生成节省销售手动操作时间 >50%"
    launch_readiness: "可以给种子租户试用（体验版），验证核心价值假设"

  - phase: 2
    name: "商业化 — 让平台收到钱"
    timeline: "Week 9-10（Sprint 5）"
    focus: "SAAS商业引擎上线 + 数据验证价值"
    deliverables:
      - "运营后台：租户全生命周期 + 版本定价 + 订阅 + 退款"
      - "数据看板：沟通分析 + 转化漏斗 + 员工绩效"
    metrics:
      - "首个付费租户转化"
      - "体验版 → 基础版转化率 >10%"
      - "数据看板可展示：沟通量/AI辅助率/转化率/员工排名"
    launch_readiness: "可以对外推广，正式商业化运营"

  - phase: 3
    name: "增强 — 精细化 + 移动化 + 可量化"
    timeline: "Week 11-12（Sprint 6）"
    focus: "补齐企业级能力和移动场景"
    deliverables:
      - "RBAC + 数据域 + 字段级权限"
      - "AI用量可视化管理 + 按量计费"
      - "营收分析（MRR/LTV/CAC/四象限）"
      - "移动H5核心功能（工作台/客户/待办）"
    metrics:
      - "数据越权事件 = 0"
      - "AI用量账单准确率 100%"
      - "移动端DAU占比 >20%（内测阶段）"
    launch_readiness: "企业版完整交付，4行业模板可售"

# =============================================================================
# 关键里程碑
# =============================================================================
milestones:
  - { date: "Week 2 末", name: "M1: 骨架+客户可用", demo: "登录 → 工作台 → 新增客户 → 打标签" }
  - { date: "Week 4 末", name: "M2: 沟通可用", demo: "从客户发起聊天 → 通话 → 沟通记录" }
  - { date: "Week 6 末", name: "M3: AI辅助可用", demo: "聊天时话术推荐+情绪监控+商品推荐+意图识别 四项实时响应" }
  - { date: "Week 8 末", name: "M4: AI闭环可用", demo: "沟通结束 → 自动总结+质检+画像更新+跟进生成 → 查看360视图+跟进日历" }
  - { date: "Week 10 末", name: "M5: 商业化可用", demo: "租户注册 → 选版支付 → AI用量计费 → 营收看板" }
  - { date: "Week 12 末", name: "M6: v1.0.0 发布", demo: "权限+移动H5+AI用量+营收分析 → 全功能就绪" }
