## 四、小程序SSE备用通道

### 4.1 使用场景
- 微信小程序：WebSocket并发连接限制≤5·可能被其他业务占用
- 降级方案：当WebSocket不可用时·切换到SSE

### 4.2 SSE端点
```
GET /api/v1/stream/events?token={jwt}&last_seq={last_seq}
```
- 长连接·服务端推送text/event-stream
- 默认30min超时·断线自动重连
- 消息格式同WebSocket·自动distinct

