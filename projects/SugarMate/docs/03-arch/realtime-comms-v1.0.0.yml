## 六、冷链IoT MQTT专有通道

### 6.1 连接配置
```
URI: mqtts://iot.sugarmate.com:8883
Client: {device_type}/{device_id}
Topic:
  · 上报: sugarmate/iot/{device_id}/temperature/report
  · 告警: sugarmate/iot/{device_id}/temperature/alert
  · 指令: sugarmate/iot/{device_id}/command (温控箱设置)
QoS: 2 (exactly-once)
KeepAlive: 60s
```

### 6.2 温度上报协议
```typescript
type TemperatureReport = {
  device_id: string;
  shipment_id: string;
  timestamp: number;
  readings: {
    temperature: number;    // 摄氏度·精确到0.1
    humidity: number;       // 相对湿度%
    battery_level: number;  // 剩余电量%
    signal_strength: number; // 信号强度dBm
  }[];
  sequence: number;
}
```

### 6.3 告警条件
| 告警类型 | 触发条件 | 持续阈值 | 处置SLA |
|----------|----------|:------:|:------:|
| 超温预警 | temp > max+0.5°C | 持续≥5min | 通知药房·15min响应 |
| 低温预警 | temp < min-0.5°C | 持续≥5min | 通知药房·15min响应 |
| 临界温度 | temp > max+2°C 或 < min-2°C | 持续≥2min | 紧急通知·自动触发补发流程 |
| 设备离线 | 120s无上报 | - | 通知药房·30min确认 |
| 低电量 | battery < 10% | - | 通知药房更换设备 |

