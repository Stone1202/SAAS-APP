## 三、WebSocket主推送通道

### 3.1 连接生命周期

```
  [客户端] 连接 ws://host/ws?token={jwt}&platform={APP|PC|LIVE}
      │
      ├→ [服务端] 验证token→建立连接→分配session ID
      │       ↓
      ├→ [心跳] 客户端每30s发送ping→服务端回复pong
      │       ├─ 60s无响应→断开连接
      │       └─ 服务端每15s发送server ping
      │
      ├→ [消息] 服务端按用户订阅推送
      │       ├─ 订单状态变更 → 对应订单参与者
      │       ├─ 处方状态 → 医生/患者/药房
      │       ├─ 通知 → 当前用户+平台
      │       └─ 弹幕 → 直播间所有观众
      │
      ├→ [重连] 连接断开→指数退避重连 (1s/2s/4s/8s/...max30s)
      │       └─ 重连成功后→请求增量数据(connection sequence number)
      │
      └→ [断开] 客户端主动关闭→服务端清理session
```

### 3.2 消息帧格式

```typescript
type WsMessage<T> = {
  version: 1,
  type: "ORDER_STATUS" | "PRESCRIPTION" | "NOTIFICATION" | "CGM_READING" | "LIVE_DANMAKU" | "SYSTEM",
  seq: number,              // 序列号·用于断线恢复
  timestamp: number,
  ttl: number,              // 消息有效期(ms)·超期不补发
  payload: T,
  ack_required: boolean     // 是否需要客户端确认
}
```

### 3.3 断线恢复协议

```
  恢复流程：
    重连成功 → 发送{last_seq: 断线前最后收到的seq}
                                        ↓
    服务端回复 → {
      type: "RECOVERY",
      messages: 增量消息列表(seq > last_seq),
      current_seq: 当前最新seq号
    }
       ↓
    客户端按seq排序 → 去重 → 按时间顺序重放
```

