## 二、统一推送网关架构

```
  ┌─────────────────────────────────────────────┐
  │           Unified Push Gateway             │
  │                                             │
  │  接收：业务模块 → 推送消息(domain event)     │
  │                                            │
  │  路由：消息类型 → 通道选择 → 批量/单点       │
  │        ├─ 类型判定(IM / 通知 / 告警)         │
  │        ├─ 目标平台判定(APP / MP / PC / LIVE) │
  │        └─ 优先级判定(紧急→全通道 / 普通→主通道)│
  │                                            │
  │  投递：WebSocket → APNs/FCM → 微信订阅 → 短信 │
  │        ├─ 主通道失败 → 自动降级              │
  │        └─ 全部失败 → 离线存储(24h)           │
  │                                            │
  │  确认：终端ACK → 标记已送达                   │
  └─────────────────────────────────────────────┘
```

