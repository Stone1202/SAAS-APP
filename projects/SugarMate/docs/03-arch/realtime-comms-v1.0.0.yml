## 一、通信通道矩阵

| 通道 | 协议 | 适用终端 | 适用场景 | QoS | 并发能力 |
|------|:--:|:------:|----------|:---:|:------:|
| WebSocket·主推送通道 | ws/wss | APP | 订单状态·通知·处方状态·弹幕 | at-least-once | 高 |
| WebSocket·IM | ws/wss | APP/PC | 问诊消息·客服消息 | at-least-once | 高 |
| WebSocket·CGM | ws/wss | APP | 血糖实时数据推送 | at-least-once | 中 |
| MQTT·IoT | mqtt/tls | - | 冷链设备·温控数据上报 | QoS2·exactly-once | 低 |
| SSE·备用 | HTTP/2 SSE | MP(微信限制·WS并发≤5) | 订单状态·通知·处方状态 | at-least-once | 低 |
| APNs/FCM | push | APP | 静默推送·后台唤醒 | at-least-once | 极高 |
| 微信订阅消息 | push | MP | 通知推送 | best-effort | 高 |
| 短信 | SMS | ALL | 紧急告警·验证码 | at-least-once | 中 |

