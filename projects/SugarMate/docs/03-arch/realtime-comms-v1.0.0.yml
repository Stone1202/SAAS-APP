## 五、推送优先级与降级链路

### 5.1 优先级定义

| 优先级 | 消息类型 | 通道策略 | 去重窗口 |
|:----:|----------|----------|:------:|
| 🔴 P0·紧急 | 冷链超温告警·安全事件·支付异常 | 全通道(MQTT+WebSocket+APNs+短信) | 30s |
| 🟡 P1·重要 | 订单状态变更·处方流转·审核结果 | WebSocket+APNs+微信订阅(降级) | 60s |
| 🟢 P2·普通 | 通知·积分变动·等级升级 | WebSocket+静默模式 | 5min |
| ⚪ P3·静默 | 内容推荐·数据更新 | WebSocket·不打扰用户 | 30min |

### 5.2 降级链路

```
  [消息产生]
       │
       ├─ step1. 主通道(WebSocket)
       │   ├─ 在线→投递成功 ✅
       │   └─ 不在线→step2
       │
       ├─ step2. 推送通道(APNs/FCM/微信订阅)
       │   ├─ 推送成功→用户打开后WebSocket连接→拉取消息 ✅
       │   └─ 推送失败→step3
       │
       └─ step3. 离线存储(24h)
             └─ 下次WebSocket连接→断线恢复拉取 ✅
```

