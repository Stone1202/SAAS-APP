## 七、通信性能基线

| 指标 | 目标 | 测量方式 |
|------|:--:|----------|
| WebSocket连接建立时间 | ≤500ms | 客户端计时 |
| WebSocket消息端到端延迟 | ≤500ms | 发送→接收时间戳差 |
| SSE端到端延迟 | ≤2s | MP弱网下≤3s |
| MQTT温度上报投递 | ≤30s | IoT上报→服务端接收 |
| 断线重连时间 | ≤3s | 指数退避·最大30s |
| 多端同步窗口 | ≤30s | 通知已读·订单状态 |
| 消息去重有效性 | 100% | 去重窗口内绝对不重复 |
