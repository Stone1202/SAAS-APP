## 三、8类实时数据流·跨终端一致性

### 3.1 CGM血糖数据
```
  [CGM设备] →蓝牙→ [APP·患者端] →HTTPS POST→ [后端CGM服务] →WebSocket→ [PC·HM] + [MP·家属]
       ↑                                           ↓
       └────────────  ACK确认 ──────────────────────┘
```
- **协议**：WebSocket + ACK确认
- **延迟窗口**：≤3s
- **断线恢复**：客户端重连→拉取缺失时间段的增量数据
- **冲突处理**：数据源唯一（CGM设备）·无冲突可能

### 3.2 问诊IM消息
```
  [APP·医生端] ↔WebSocket↔ [IM服务] ↔WebSocket↔ [APP·患者端] → 抄送→ [PC·客服监督]
```
- **协议**：腾讯云IM（WebSocket）+ 消息队列
- **延迟窗口**：≤1s
- **投递保障**：至少一次投递（at-least-once）
- **消息序列**：服务端维护seq_number·客户端断线重连后拉取失序消息

### 3.3 处方流转
```
  [APP·医生·开具] →签名→ [处方服务] →pub event→ [通知药房] →审核→调配→发货
                      ↑              ↓
                  [患者·APP/MP]  ← ← [状态机变更推送]
```
- **实现**：状态机+乐观锁（version字段）
- **并发控制**：同一处方的审核+调配操作串行化
- **多端视图**：医生/HM/药房/患者各看各自权限下的状态
- **窗口**：状态变更→推送≤5s·签名验证同步

### 3.4 入驻审核

```
  [PC·商家·提交] → [入驻服务] →pub event→ [PC·运营·审核] →通过/驳回→状态机更新→通知
                      ↑              ↓
                  [APP·B端] ← ← [status_changed事件广播]
```
- **状态机**：SM-02（提交→机审→人审→通过/驳回/补充→完结）
- **事件广播**：每个状态变更发布`user.onboarding.status_changed`事件
- **B端APP同步**：APP B端订阅事件→更新工作台入驻状态
- **窗口**：PC审核完成→APP可见≤10s

### 3.5 冷链追踪
```
  [IoT·温控设备] →MQTT QoS2→ [后端·冷链服务] →pub event→ [APP·患者] + [PC·药房]
                                    ↓
                          [温度异常→alert事件→紧急通知多通道]
```
- **上报协议**：MQTT QoS=2（精确一次）
- **数据传输**：WebSocket推送给前端
- **异常处理**：超温告警→15min内通知→药房30min响应→超时自动升级
- **窗口**：温度上报≤30s·告警≤15min

### 3.6 订单库存·乐观锁预占
```
  [下单] → 库存预占(预占锁·5min超时释放) → 支付成功→实扣 → 支付失败/超时→释放
  [取消] → 释放预占
  [售后退款] → 库存回退
```
- **预占锁**：`Redis SET NX key:product_id:sku_id value:quantity PX 300000`
- **超时释放**：5min未支付自动释放·支持刷新预占锁
- **实扣**：支付成功回调→`UPDATE inventory SET stock = stock - ? WHERE stock >= ?`
- **回退**：退款通过→`UPDATE inventory SET stock = stock + ?`
- **并发安全**：读已提交隔离级别+行级锁

### 3.7 通知已读状态·多终端同步

```
  [APP·已读操作] → [通知服务] → [WebSocket广播msg_read事件]
  [MP·接收] → 30s内更新未读角标
  [PC·接收] → 30s内更新未读角标
  [LIVE·接收] → 30s内更新未读角标
```
- **已读粒度**：通知ID级别
- **同步频率**：实时WebSocket + 每30s定时全量同步兜底
- **冲突优先级**：最新已读操作覆盖·无并发冲突

### 3.8 分账结算
```
  [订单完成→T+1] → [结算服务] → [易宝分账API] → [分账回调] → [对账]
                                                       ↓
                                               [差异→争议工单]
```
- **分账触发**：T+1（T日订单·T+1日生成结算单）
- **分账执行**：通过易宝支付平台
- **对账**：T+1自动对账·差异→争议工单
- **修改窗口**：结算单生成前订单状态可改·生成后锁定

