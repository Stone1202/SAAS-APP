## 四、状态机跨终端一致性·6个核心状态机

### SM-02·入驻审核状态机

| 状态 | 触发终端的操作 | 其他终端同步 |
|------|---------------|-------------|
| PENDING | PC·商家提交 | APP B端工作台→"审核中" |
| UNDER_REVIEW | PC·运营领取后 | - |
| SUPPLEMENT | PC·运营要求补充 | APP B端→"需补充资料"·含原因 |
| APPROVED | PC·运营通过 | APP B端→"已通过"·开通功能 |
| REJECTED | PC·运营驳回 | APP B端→"被驳回"·含原因 |

### SM-05·订单状态机（普通商品）

| 状态 | 触发终端 | 多端同步 |
|------|----------|---------|
| PENDING_PAY | APP/MP·下单 | PC·药房待接单 |
| PAID | 支付回调 | PC·药房待发货·APP→已支付 |
| SHIPPED | PC·药房发货 | APP·已发货·含物流 |
| DELIVERED | APP·确认收货/自动确认 | PC·已完成·触发结算 |
| REFUNDING | APP·申请退款 | PC·退款处理中 |
| CANCELLED | APP/系统·取消 | PC·已取消 |

### SM-06·处方药订单状态机

| 状态 | 特殊环节（处方药额外流程） |
|------|-----------|
| PENDING_PAY | 校验处方有效性→通过才可支付 |
| PENDING_PRESCRIPTION_AUDIT | 药房审核处方·关联SM-04 |
| PAID | 处方审核通过后 |
| SHIPPED（冷链） | 必须关联冷链追踪·SM-07 |
| DELIVERED | 冷链温度报告附在物流信息 |

### SM-07·冷链配送状态机

| 状态 | 触发条件 | 同步要求 |
|------|----------|---------|
| PENDING | 订单已支付·冷链商品 | PC·待出库 |
| DISPATCHED | PC·出库扫描 | 启动温度监控 |
| IN_TRANSIT | IoT开始上报温度 | APP·实时追踪 |
| TEMP_WARNING | 温度超限·条件触发 | 紧急通知药房 |
| DELIVERED | 患者签收 | 温度报告 |
| REDELIVERING | 补发 | 最多2次 |
| FORCED_REFUND | 2次超温·强制退款 | - |

### SM-10·处方流转状态机

| 状态 | 操作终端 | 多端同步要求 |
|------|----------|-------------|
| DRAFT | APP·医生 | - |
| ISSUED | APP·医生提交 | APP·患者可见 |
| SIGNED | APP·医生CA签名 | PC·药房可审核 |
| PENDING_AUDIT | 签名后自动 | PC·药房待审核 |
| AUDIT_APPROVED | PC·药房审核通过 | APP·患者可购药 |
| AUDIT_REJECTED | PC·药房驳回 | APP·医生可见原因 |
| DISPENSED | PC·药房调配 | 处方完结·库存扣减 |
| EXPIRED | 超过有效期 | 不可使用 |

### SM-18·易宝入网状态机

| 状态 | 触发终端 | 同步 |
|------|----------|------|
| PENDING | PC·商家提交入网信息 | - |
| SUBMITTED | PC·运营提交易宝 | - |
| VERIFYING | 易宝审核中 | - |
| APPROVED | 易宝审核通过 | PC·显示已入网·开通支付 |
| REJECTED | 易宝驳回 | PC·显示驳回原因·可重新提交 |

