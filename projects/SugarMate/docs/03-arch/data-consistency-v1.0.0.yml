## 五、一致性监控与修复

### 5.1 一致性检查计划

| 检查类型 | 频率 | 实现 |
|----------|:--:|------|
| 库存一致性校验·预占vs实际 | 每5分钟 | 定时任务·对比Redis预占vs MySQL库存 |
| 订单状态与物流状态 | 每10分钟 | 定时任务·SM-05状态vs物流API |
| 入驻审核SLA超时 | 每5分钟 | 定时任务·检查pending超4h的申请 |
| 分账与订单完成 | 每日T+1 | 定时任务·已完成订单vs结算单 |

### 5.2 不一致修复策略

| 场景 | 检测 | 修复 |
|------|------|------|
| 库存预占超时未释放 | 预占锁时间戳超5min | 自动释放+记录告警 |
| 订单状态跨终端不一致 | APM·状态变更事件未送达 | 定时任务兜底·重新广播最新状态 |
| 处方签名后通知未送达 | 事件重试3次后进入死信 | 人工介入+补推 |
| 冷链告警未响应 | 告警15min后无处置 | 自动升级→平台介入 |
