## 一、核心原则

> **"不要相信用户看到的，要相信系统处理的状态"**

| 原则 | 说明 |
|------|------|
| P1·事件溯源 | 所有状态变更通过领域事件发布·各终端订阅更新 |
| P2·乐观锁 | 关键操作使用乐观锁·version字段防并发覆盖 |
| P3·幂等消费 | 所有事件消费方必须做幂等处理 |
| P4·窗口容忍 | 不同场景定义可接受的延迟窗口·不追求伪实时 |
| P5·最终一致 | 目标不是强一致而是最终一致·含冲突检测 |
| P6·补偿机制 | 所有不一致场景定义补偿路径·不死锁 |

---

## 二、一致性级别与实现策略

| 级别 | 定义 | 适用场景 | 实现 |
|:--:|------|----------|------|
| 强一致 | 操作完成后所有副本立即同步 | 支付·CA签名·处方流转·库存扣减 | 分布式事务+乐观锁 |
| 读写一致 | 写完成后读操作立即可见最新值 | 库存展示·商品信息 | 缓存失效+读主库 |
| 最终一致·同步 | 毫秒~秒级延迟 | 订单状态·IM消息·入驻审核 | WebSocket+事件 |
| 最终一致·异步 | 秒~分钟级延迟 | 积分·等级·数据看板 | 消息队列+Cron |

