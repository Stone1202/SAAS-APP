## 四、断路器配置

| 外部服务 | 断路器类型 | 错误阈值 | 半开窗口 | 熔断时间 |
|----------|:------:|:------:|:------:|:-----:|
| 易宝支付 | 滑动窗口 | 连续5次错误 | 30s | 60s |
| 微信支付 | 滑动窗口 | 连续3次错误 | 30s | 60s |
| 腾讯云IM | 滑动窗口 | 连接失败10s | 15s | 30s |
| CA签名服务 | 计数 | 连续3次超时 | 30s | 120s |
| 药物检查引擎 | 计数 | 连续3次超时 | 60s | 300s |
| OCR服务 | 滑动窗口 | 50%错误率(20个样本) | 60s | 120s |
| 药监局API | 计数 | 连续5次错误 | 120s | 600s |

