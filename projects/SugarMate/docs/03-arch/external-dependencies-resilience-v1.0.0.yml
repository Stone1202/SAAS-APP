## 三、三层容灾架构

```
┌────────────────────────────────────────────┐
│             L1·自动切换与重试               │
│  连接失败→自动重试(max3次·指数退避)         │
│  超时→切换到备用通道(如易宝→微信)           │
│  异常→断路器打开(熔断·保护下游)             │
├────────────────────────────────────────────┤
│             L2·降级与轻量替代               │
│  核心服务不可用→降级为本地缓存+异步处理      │
│  非核心服务不可用→优雅降级·仅核心链路保活    │
│  第三方服务→降级为本地实现(如药物检查→人工)  │
├────────────────────────────────────────────┤
│             L3·人工干预与恢复               │
│  关键故障1min告警→值班工程师响应             │
│  故障<15min·自动恢复→故障>15min·人工介入     │
│  恢复后·补偿数据+状态校准+用户通知           │
└────────────────────────────────────────────┘
```

