## 五、健康检查矩阵

| 检查项 | 频率 | 方式 | 告警条件 |
|--------|:--:|------|----------|
| 易宝·ping | 每30s | HTTP HEAD | 连续3次失败 |
| 微信支付·ping | 每30s | HTTP HEAD | 连续3次失败 |
| CSS推流·test stream | 每60s | 模拟推流 | 推流失败 |
| IM·连接测试 | 每30s | WebSocket connect+disconnect | 连接失败 |
| CA签名·验证 | 每300s | test签名+验证 | 全流程超30s |
| 药物检查·test query | 每300s | 测试查询 | 返回错误或超时 |
| 药监局API·ping | 每600s | HTTP GET | 连续5次失败 |

