## 二、故障模式与降级策略

### DEP-01·腾讯云CSS·直播服务故障

| 故障模式 | 用户影响 | 降级策略 | 恢复后操作 |
|----------|----------|----------|------------|
| 推流服务不可用 | 主播无法开播 | ①APP端提示"直播服务维护中"·②已预约用户推送变更通知·③记录直播时长供后续处理 | ①通知主播重新开播·②补推开播提醒 |
| 拉流服务不可用 | 观众无法观看 | ①APP/LIVE端显示直播占位+提示重试·②推荐回放内容 | ①恢复正常拉流·②补推送直播进行中通知 |
| 录制服务异常 | 无回放生成 | ①自动重试·②手动触发补录 | ①重新触发录制·②更新回放列表 |
| IM弹幕不可用 | 弹幕/礼物无法发送 | ①降级为纯观看模式·②界面提示"互动功能暂不可用" | 恢复正常后不补充历史弹幕 |

**SLA要求**：99.9%·故障>30min降级·故障>2h启动应急预案

### DEP-02·腾讯云IM·消息服务故障

| 故障模式 | 用户影响 | 降级策略 | 恢复后操作 |
|----------|----------|----------|------------|
| WebSocket断开·无法重连 | 问诊/客服无法实时IM | ①降级为轮询模式(每5s拉取新消息)·②前端显示"弱网模式"·③消息本地队列暂存 | ①恢复WebSocket连接·②批量补推暂存消息·③重置状态 |
| 消息投递超时>5s | 消息发送感觉卡顿 | ①客户端乐观更新(消息立即显示+发送中标记)·②失败重试 | ①更新消息状态为已送达 |
| 服务完全不可用 | 问诊无法进行 | ①紧急切换→文字转短信通知·②已建立的视频/语音问诊依赖CSS继续 | ①服务恢复后补发遗漏消息·②通知用户 |

**SLA要求**：99.95%·断线重连<3s·消息投递<1s

### DEP-03·易宝支付·服务故障（🔴 Critical）

| 故障模式 | 用户影响 | 降级策略 | 恢复后操作 |
|----------|----------|----------|------------|
| 收单服务不可用 | 用户无法支付APP端商品 | ①自动切换微信支付(if APP)·②小程序端默认微信支付·③双通道互斥规则保持不变 | ①恢复后两个通道并行·②支付成功补推送 |
| 退款服务不可用 | 退款延迟 | ①退款申请入队·②延迟处理·③显示"退款处理中·预计XX恢复" | ①批量处理积压退款·②支付回调补发 |
| 分账服务不可用 | 商家分账延迟 | ①暂停自动分账·②累积待分账单·③运营后台不可见 | ①T+1统一补分账·②差异对账 |
| 入网服务不可用 | 新商家无法入网支付 | ①入驻可完成·支付标记"待入网"·②新商家只能收款不能提现 | ①批量提交入网·②补入网通过通知 |
| 全部服务不可用 | 🔴 交易完全停止 | ①全站弹窗·②订单可创建但无法支付·③保留购物车 | ①全链路恢复·②逐用户恢复支付能力 |

**SLA要求**：99.9%·最大不可用窗口30min·30min后启动微信支付全量切换

### DEP-04·CA签名服务·故障

| 故障模式 | 用户影响 | 降级策略 | 恢复后操作 |
|----------|----------|----------|------------|
| CA签名服务不可用 | 医生无法完成处方签名 | ①排队重试(最多3次·间隔5s)·②超时后启用备选方案：手写签名+拍照上传→人工核验 | ①系统恢复后优先取消失败签名·②通知医生重新签名 |
| 签名验证不可用 | 药房无法验证处方签名 | ①使用上次缓存的验证结果(24h内)·②超时后人工核验 | ①补充验证·②更新缓存 |

**SLA要求**：99.5%·最大不可用窗口15min

### DEP-05·药物相互作用引擎·故障

| 故障模式 | 用户影响 | 降级策略 |
|----------|----------|----------|
| 引擎不可用 | 无法自动检查药物相互作用 | ①降级为人工审方模式·②提醒药房注意药物相互作用·③标记处方"未经AI审核" |
| 响应超时(>10s) | 开方体验卡顿 | ①异步检查·②医生先开具处方·③异步返回warning |

### DEP-06·微信开放平台·OAuth故障

| 故障模式 | 用户影响 | 降级策略 |
|----------|----------|----------|
| OAuth不可用 | 新增用户无法微信登录 | ①降级为手机号+验证码登录·②已登录用户保持session不受影响 |
| UnionID获取失败 | 用户账号关联异常 | ①手机号匹配兜底·②后续补关联 |

