## 六、支付通道切换决策树

```
  用户发起支付
      │
      ├── [判断：平台=MP？]
      │     └── 是 → 微信支付（小程序唯一通道）
      │
      ├── [判断：易宝支付·健康状况]
      │     ├── 健康 → 易宝支付
      │     └── 不健康 → [判断：断路器状态]
      │           ├── CLOSED → 易宝支付（正常使用）
      │           ├── HALF_OPEN → 易宝支付（重试1次）
      │           │     ├── 成功 → 断路器=CLOSED
      │           │     └── 失败 → 断路器=OPEN → 切换微信
      │           └── OPEN → 微信支付
      │
      └── [微信支付·健康状况]
            ├── 健康 → 微信支付
            └── 不健康 → 支付失败·提示用户稍后重试
```
