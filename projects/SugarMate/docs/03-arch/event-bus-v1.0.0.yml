## 三、事件可靠性保障

| 层级 | 措施 | 说明 |
|:--:|------|------|
| L1·发布 | 事件持久化·先写EventLog再发消息 | 确保事件不丢失 |
| L2·投递 | at-least-once | 消费者做幂等处理 |
| L3·消费 | 消费者记录消费位置(offset) | 断点续传 |
| L4·重试 | 失败3次退避重试(1s/5s/30s)→死信队列 | 避免雪崩 |
| L5·监控 | 事件积压告警·消费延迟告警 | 运维可观测 |
| L6·顺序 | 同一聚合根的事件有序·全局无序 | 按entity_id分区 |

---

## 四、事件版本策略

| 规则 | 说明 |
|------|------|
| 新增字段 | 向前兼容·旧消费者忽略新字段·不需要升级 |
| 删除字段 | 保留6个月·先标记deprecated→6个月后删除 |
| 修改字段类型 | ❌ 禁止·必须新增字段·6个月后删除旧字段 |
| 事件废弃 | 标记deprecated→6个月后停止发布·1年后停止消费处理 |

