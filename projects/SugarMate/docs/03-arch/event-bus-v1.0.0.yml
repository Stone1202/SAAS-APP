### 2.5 营销域（marketing:*）

#### marketing.points.earned
```
发布方: marketing
触发时机: 积分变动（订单完成/签到/活动）
载荷:
{
  user_id: string,
  points: number,
  reason: "ORDER_PAID" | "DAILY_CHECKIN" | "CAMPAIGN" ...,
  batch_id: string,        // 积分批次·FIFO
  expires_at: number,
  timestamp: number
}
```

#### marketing.level.upgraded
```
发布方: marketing
触发时机: 会员等级变更
载荷:
{
  user_id: string,
  old_level: string,
  new_level: string,
  reason: string,
  timestamp: number
}
订阅方:
  - communication: 通知用户等级变更+新权益
  - trade: 等级折扣重新计算
```

