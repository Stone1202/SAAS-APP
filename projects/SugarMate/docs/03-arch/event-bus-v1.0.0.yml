---

## 一、事件总线架构

```
  ┌─────────────┐
  │   gateway    │
  │  (不处理事件) │
  └─────────────┘
        
  各模块 → 发布领域事件 → [Event Bus · 消息队列] → 各订阅方消费
        
       实现方案: 阶段1·React CustomEvent / EventEmitter（单SPA原型）
                阶段2·生产环境·Redis Streams / RabbitMQ / NATS
```

---

## 二、事件分类与定义

### 2.1 用户身份域（user:*）

#### user.identity.created
```
发布方: user (用户中心)
触发时机: 新用户注册成功
载荷:
{
  identity_id: string,
  role: "PATIENT" | "DOCTOR" | "NUTRITIONIST" | "HM" | "PH_ADMIN",
  platform: "APP" | "MP" | "PC",
  timestamp: number
}
订阅方:
  - trade: 初始化用户交易上下文
  - marketing: 新用户欢迎积分发放
  - content: 初始化内容偏好
```

#### user.identity.switched
```
发布方: user
触发时机: 用户APP内切换角色视图
载荷:
{
  account_id: string,
  from_identity: string,
  to_identity: string,
  to_role: string,
  timestamp: number
}
订阅方:
  - 所有模块: 清理上个身份状态·加载新身份数据
  - communication: 刷新未读通知·切换IM连接
```

#### user.onboarding.submitted
```
发布方: user
触发时机: 商家提交入驻申请
载荷:
{
  application_id: string,
  merchant_type: "PH" | "DR" | "PR" | "NT" | "HM",
  business_name: string,
  operator: string,
  timestamp: number
}
订阅方:
  - operation: 触发入驻审核流程(SM-02)
  - communication: 通知平台审核人员(SLA计时开始)
```

#### user.onboarding.status_changed
```
发布方: operation (审核完成→回写)
触发时机: 入驻审核完成（通过/驳回/补充）
载荷:
{
  application_id: string,
  old_status: "PENDING" | "UNDER_REVIEW" | "SUPPLEMENT",
  new_status: "APPROVED" | "REJECTED" | "SUPPLEMENT",
  reviewer: string,
  reason?: string,
  timestamp: number
}
订阅方:
  - user: 更新入驻状态
  - communication: 通知申请人结果
  - trade: 通过后初始化商家交易能力
  - content: 通过后开通内容发布权限
```

---

### 2.2 交易域（trade:*）

#### trade.order.created
```
发布方: trade
触发时机: 用户下单成功（库存预占完成）
载荷:
{
  order_id: string,
  user_id: string,
  items: { product_id, sku_id, quantity, needs_cold_chain }[],
  total_amount: number,
  has_prescription_drug: boolean,
  timestamp: number
}
订阅方:
  - coldchain: 冷链商品→启动冷链追踪
  - communication: 订单创建通知
```

#### trade.order.paid
```
发布方: trade
触发时机: 支付成功回调
载荷:
{
  order_id: string,
  channel: "YEEPAY" | "WECHAT",
  transaction_id: string,
  amount: number,
  timestamp: number
}
订阅方:
  - marketing: 积分发放+优惠券核销
  - communication: 支付成功通知·推送发货提醒给药房
  - coldchain: 冷链订单→确认冷链计划
```

#### trade.order.status_changed
```
发布方: trade
触发时机: 订单状态任何变更
载荷:
{
  order_id: string,
  old_status: string,     // SM-05/06/07/15 状态值
  new_status: string,
  actor: string,           // 操作者
  reason?: string,
  timestamp: number
}
订阅方:
  - communication: 全终端订单状态推送
  - coldchain: SHIPPED→温度监控阶段·DELIVERED→结束追踪
```

#### trade.refund.issued
```
发布方: trade
触发时机: 退款执行
载荷:
{
  refund_id: string,
  order_id: string,
  amount: number,
  reason: string,
  timestamp: number
}
订阅方:
  - marketing: 积分回退+优惠券恢复
  - coldchain: 清理冷链追踪
```

---

### 2.3 处方域（prescription:*）

#### prescription.issued
```
发布方: prescription
触发时机: 医生开具处方
载荷:
{
  prescription_id: string,
  doctor_id: string,
  patient_id: string,
  drug_count: number,
  timestamp: number
}
订阅方:
  - communication: 通知患者处方已生成
```

#### prescription.signed
```
发布方: prescription
触发时机: CA签名完成
载荷:
{
  prescription_id: string,
  signer_id: string,
  ca_cert_hash: string,
  timestamp: number
}
订阅方:
  - communication: 通知药房待审核

  - trade: 处方药可用·解锁购买资格
  - user: 写入患者处方历史
```

#### prescription.audited
```
发布方: prescription
触发时机: 药房审核处方
载荷:
{
  prescription_id: string,
  auditor: string,
  decision: "APPROVED" | "REJECTED",
  reason?: string,
  timestamp: number
}
订阅方:
  - communication: 通知医生+患者审核结果
```

#### prescription.dispensed
```
发布方: prescription
触发时机: 药品调配完成
载荷:
{
  prescription_id: string,
  dispenser: string,
  drugs: { drug_name, batch_no, trace_code }[],
  timestamp: number
}
订阅方:
  - coldchain: 需要冷链⇢启动追踪
  - trade: 关联订单发货
```

