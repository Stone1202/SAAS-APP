### 2.4 冷链域（coldchain:*）

#### coldchain.shipment.start
```
发布方: coldchain
触发时机: 冷链包裹出库
载荷:
{
  shipment_id: string,
  order_id: string,
  device_id: string,
  temperature_range: { min, max },
  timestamp: number
}
订阅方:
  - trade: 更新订单物流信息
  - communication: 通知患者冷链已发货
```

#### coldchain.temperature.alert
```
发布方: coldchain
触发时机: 温度超限·持续≥5min
载荷:
{
  alert_id: string,
  shipment_id: string,
  order_id: string,
  current_temp: number,
  threshold: number,
  exceeded_duration_seconds: number,
  timestamp: number
}
订阅方:
  - communication: 紧急通知药房+平台·短信+APP推送+企微
  - trade: 准备补发/退款流程
```

#### coldchain.shipment.complete
```
发布方: coldchain
触发时机: 包裹签收
载荷:
{
  shipment_id: string,
  order_id: string,
  temperature_summary: { min, max, avg, alert_count },
  timestamp: number
}
订阅方:
  - trade: 订单完成·触发结算
  - user: 患者冷链报告
```

