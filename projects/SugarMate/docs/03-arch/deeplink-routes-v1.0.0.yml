## 三、角色切换路由

### 3.1 APP内角色视图切换

```
  当前活跃角色 → 点击头像/名称 → 弹出角色选择面板
    ├─ 目标角色 = 当前角色 → 关闭面板
    └─ 目标角色 ≠ 当前角色
          ├─ 草稿检查·有未保存 → 提示保存
          ├─ 清理当前视图状态
          ├─ 加载目标角色视图(切换到对应tab)
          └─ 路由调整: path prefix从/patient/→/doctor/等
```

### 3.2 跨终端DeepLink跳入·角色校验

```
  接收DeepLink → 解析路径 → 提取目标角色限制
    ├─ 目标无角色限制 → 直接跳转
    ├─ 用户当前活跃身份匹配 → 直接跳转
    ├─ 用户有其他匹配身份 → 提示切换身份后继续
    └─ 用户无匹配身份 → 提示无权限访问
```

