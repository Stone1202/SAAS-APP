## 一、DeepLink Scheme 定义

### 1.1 统一Scheme
```
sugarmate://{path}?{params}
```

**解析规则**：
- APP/MP/LIVE端：注册`URL Scheme` 拦截·原生桥接
- PC端：解析为SPA路由跳转
- 网页内点击：如果APP已安装→唤起APP·未安装→跳转下载页

### 1.2 小程序专用
```
sugarmate://mp/{path}?{params}  → 跳转微信小程序对应页面
```

### 1.3 LIVE端专用
```
sugarmate://live/{path}?{params}  → 唤起LIVE APP或跳转下载页
```

