## 五、页面间跳转·一致性检查清单

> **跳转不验证** = 历史错误 #4

| 检查项 | 要求 |
|--------|------|
| ✅ Deeplink覆盖 | ALL终端的直播预约/通知/带货入口→LIVE全部测试 |
| ✅ APP角色切换 | 4角色视图切换不丢失tab状态 |
| ✅ 中断恢复 | 5种中断场景全部覆盖·草稿TTL=2h |
| ✅ 参数安全 | DeepLink参数校验·防止注入·敏感参数加密 |
| ✅ 回退路径 | 所有跳转支持浏览器的"返回"操作·历史栈正确 |
| ✅ 跨终端鉴权 | DeepLink参数含token·接收端验证 |
| ✅ 未登录处理 | DeepLink可携带匿名参数·登录后恢复目标页面 |
