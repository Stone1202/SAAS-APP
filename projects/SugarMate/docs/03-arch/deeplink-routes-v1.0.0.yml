## 四、中断恢复方案

| 场景 | 中断原因 | 恢复策略 | 保留内容 |
|------|----------|----------|----------|
| 医生开方·中途退出 | APP切入后台/电话/消息 | 下次进入处方页→提示"恢复上次未完成处方" | 处方草稿·已输入药物清单 |
| 入驻申请·网络断开 | 上传资质大文件·超时 | 下次进入入驻页→提示"继续上次申请" | 已填写表单·已上传文件 |
| 问诊IM·APP崩溃 | 应用异常终止 | 下次进入问诊→自动加载最近会话 | 最近20条消息·输入框中内容 |
| 直播观看·切换APP | 用户主动切换 | 返回时→继续播放(live模式)或从头(回放) | 直播进度·弹幕位置 |
| 订单支付·超时 | 支付页等待超时 | 订单详情→"继续支付"按钮·库存已释放需重试 | 订单信息·优惠券锁定状态 |

### 4.1 APP层·场景中断恢复实现

```typescript
// 中断恢复管理器
interface InterruptRecoveryState {
  scene: string;              // 场景标识
  state: "IN_PROGRESS" | "INTERRUPTED";
  interrupted_at: number;     // 中断时间戳
  ttl: number;                // 有效期(超过则清理·不恢复)
  context: {
    route: string;            // 中断时的路由
    partial_data: object;     // 部分完成的表单数据
    step: number;             // 中断所在的步骤
  }
}
```

**存储位置**：APP·localStorage/AsyncStorage / PC·sessionStorage

