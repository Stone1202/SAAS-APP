## 三、数据分级保护方案

### 3.1 数据分类

| 数据类 | 分类 | 传输加密 | 存储加密 | 脱敏规则 | 审计 |
|:---|:--:|:--:|:------:|----------|:--:|
| 科普文章·直播内容·商品信息 | L0·公开 | ✅ TLS | - | - | - |
| 店铺信息·医生简介·商品价格 | L1·内部 | ✅ TLS | - | - | - |
| 姓名手机地址·订单记录·执业证信息 | L2·敏感 | ✅ TLS | ✅ AES-256 | 手机脱敏13****1234 | ✅ |
| CGM血糖·处方·CA签名·身份证·银行卡 | L3·机密 | ✅ TLS | ✅ AES-256+字段级pgcrypto | 全字段脱敏 | ✅✅ |

### 3.2 字段级加密实现
```
L3数据写入路径：
  明文 → 应用层加密(应用密钥) → 提交数据库 → pgcrypto二层加密(数据库密钥)
  
L3数据读取路径：
  数据库 → pgcrypto解密 → 应用层解密 → 如果输出给前端·脱敏 → 返回
```

**密钥管理**：
- 应用密钥：KMS管理·每90天轮换
- 数据库密钥：KMS管理·独立于应用密钥
- 密钥隔离：L2和L3使用不同密钥
- 密钥丢失应急：备份密钥离线保存·泄露自动吊销

