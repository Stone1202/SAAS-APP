## 一、安全分层架构

```
┌─────────────────────────────────────────────────────┐
│                    L0·网络边界安全                    │
│  WAF · DDoS防护 · TLS 1.3 · IP白名单 · CDN加速       │
├─────────────────────────────────────────────────────┤
│                    L1·网关层安全                      │
│  JWT鉴权 · RBAC权限 · 限流 · IP黑名单 · 请求签名校验  │
├──────────┬──────────┬──────────┬─────────────────────┤
│  L2·APP层安全        │  L3·数据层安全                 │
├──────────────────────┼──────────────────────────────┤
│  防重放 · 验证码      │  字段级加密(AES-256)           │
│  参数签名 · 输入校验  │  数据库加密(pgcrypto)          │
│  二次验证 · 审计日志  │  脱敏输出 · 访问审计            │
├──────────────────────┴──────────────────────────────┤
│              L4·密钥管理（KMS·定期轮换）               │
├─────────────────────────────────────────────────────┤
│              L5·安全运营（告警·审计·合规）             │
└─────────────────────────────────────────────────────┘
```

