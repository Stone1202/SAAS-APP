## 四、接口安全

### 4.1 防重放机制
```
客户端请求必须携带：
  X-Timestamp: 13位毫秒时间戳
  X-Nonce: 随机字符串（客户端缓存·不重复）
  
服务端验证：
  1. |now - X-Timestamp| ≤ 5min → 拒绝时间偏移请求
  2. Redis SET NX nonce值 5min过期 → 拒绝重复请求
  3. 同时满足两项才通过
```

### 4.2 敏感接口签名（支付·处方·入驻）
```
签名算法（类微信支付V3）：
  CanonicalRequest = HTTP_METHOD + "\n" + Path + "\n" + Timestamp + "\n" + Nonce + "\n" + Body
  Sign = HMAC-SHA256(ApiSecret, CanonicalRequest)
  Authorization: Bearer {jwt_token}
  X-Signature: Base64(Sign)
```

### 4.3 输入校验
- ALL API输入必须经过Zod Schema校验·网关层统一处理
- SQL注入防护：参数化查询·ORM自动转义
- XSS防护：输出编码·CSP头·禁止内联脚本
- CORS：仅允许APP/MP/LIVE/PC合法域名

