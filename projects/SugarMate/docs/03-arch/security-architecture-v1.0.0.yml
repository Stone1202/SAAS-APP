## 六、安全监控与应急响应

### 6.1 实时告警
| 事件 | 严重级别 | 响应SLA |
|------|:------:|--------|
| JWT爆破·同一IP连续失败5次 | 🔴 | 5min内封IP |
| L3数据异常访问·非授权用户查询处方/血糖 | 🔴 | 5min内确认并阻断 |
| WAF拦截率突增 | 🟡 | 15min内分析 |
| 密钥泄露检测 | 🔴 | 5min内吊销轮换 |
| API异常调用频率·疑似爬虫 | 🟡 | 15min内限流 |

### 6.2 安全事件响应流程
```
  检测 → 告警 → 安全值班·确认级别
    ├─ L1·观察→记录→分析趋势
    ├─ L2·响应→限流/封IP→分析→报告
    └─ 🔴 L3·紧急→阻断(全部操作)→通知CTO+安全团队→取证→修复→复盘
```
