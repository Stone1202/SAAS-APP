## 五、医疗数据合规

### 5.1 处方电子签名合规（《电子签名法》）
| 要求 | 实现 |
|------|------|
| 真实身份 | CA数字证书绑定医生身份·APP实名认证 |
| 真实意愿 | 签名前二次确认·操作时间戳记录 |
| 签名原文·不可篡改 | 处方哈希+签名哈希存储·篡改检测 |
| 证据链完整 | 签名记录含：身份/时间/IP/设备/签名图片哈希 |

### 5.2 GSP药品追溯合规
| 要求 | 实现 |
|------|------|
| 来源可查 | 药品批号+追溯码关联·供应商信息 |
| 去向可追 | 处方→调配→配送→签收全链路追踪 |
| 责任可究 | 每个环节记录操作人+时间·5年保留 |

### 5.3 数据留存期限
| 数据类型 | 最短保留期限 | 法律依据 |
|----------|:--------:|----------|
| 处方记录 | 5年 | GSP·处方管理办法 |
| 调配记录 | 5年 | GSP |
| CA签名记录 | 5年 | 电子签名法 |
| 冷链温度日志 | 2年 | GSP |
| 入驻审核记录 | 5年 | 监管要求 |
| 支付交易记录 | 5年 | 支付机构要求 |
| 审计日志 | 1年 | 安全最佳实践 |
| 用户账号数据 | 用户注销后90天 | 个人信息保护法 |

