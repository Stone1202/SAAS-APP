## 二、鉴权体系

### 2.1 认证流程
```
[用户] → [登录(手机+验证码/微信OAuth)] → [JWT双Token签发]
                                               ├── access_token（1h·内存/Keychain）
                                               └── refresh_token（7d·安全存储）
```

### 2.2 Token结构
```typescript
type JWTPayload = {
  sub: string;              // 用户ID
  aid: string;              // 账号ID（同一account·N个identity）
  iat: number;              // 签发时间
  exp: number;              // 过期时间
  iid: string;              // 当前活跃身份ID（支持角色切换）
  role: string;             // 当前活跃角色
  sid: string;              // 会话ID（用于强制下线）
  pid: string[];            // 权限ID列表
  plt: string;              // 终端·APP|MP|LIVE|PC
  did: string;              // 设备指纹
}
```

### 2.3 权限模型·RBAC
```
  账号(Account) ───1:N──→ 身份(Identity)
                              ↓
  角色(Role·预定义) ───N:M──→ 权限(Single Permission)
                              ↓
  权限ID(pid) → 前端路由守卫 + 后端API守卫 + 数据行级过滤
```

**角色定义**：
| 角色ID | 角色名 | 可见终端 | 权限范围 |
|:-----|--------|:------:|----------|
| PATIENT | 患者 | APP/MP | 个人健康/问诊/商城/社区/会员 |
| FAMILY | 家属 | APP/MP | 绑定患者血糖监控·只读 |
| DOCTOR | 医生 | APP/LIVE/PC | 接诊/开方/直播/价格管理(PC) |
| NUTRITIONIST | 营养师 | APP/LIVE/PC | 方案制定/直播/价格管理(PC) |
| HM | 健康管理师 | APP/PC | 回访/预警/患者管理(PC) |
| PHARMACIST | 药剂师 | PC | 审方/调配/GSP管理 |
| PH_ADMIN | 药店管理员 | PC | 药店全功能·包含药剂师/医生/营养师/HM管理 |
| PLATFORM_OPS | 平台运营 | PC | 审核/客服/风控/数据/配置 |
| SUPER_ADMIN | 超级管理员 | PC | 全权限·审计审批 |

### 2.4 Token刷新策略
- **静默刷新**：access_token到期前5min·使用refresh_token无感刷新
- **强制过期**：refresh_token过期→需重新登录
- **多设备**：同一用户多设备独立会话·互不干扰
- **强制下线**：修改密码/管理员踢出→标记session_id失效·实时踢出

