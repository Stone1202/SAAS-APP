## 七、内容中心 API

### 7.1 直播管理
```
POST /api/v1/cms/live/create
POST /api/v1/cms/live/{live_id}/start
POST /api/v1/cms/live/{live_id}/stop
GET  /api/v1/cms/live/current           // 获取当前直播
GET  /api/v1/cms/live/schedule          // 直播预告列表
GET  /api/v1/cms/live/replay/list       // 回放列表
```
- **创建请求体**：`{ title, cover_image, start_time, category, stream_type, products? }`

### 7.2 内容审核回调
```
POST /api/v1/cms/audit/callback  （内部回调）
```
- **请求体**：`{ content_type, content_id, result: "PASS" | "REJECT", reason }`

