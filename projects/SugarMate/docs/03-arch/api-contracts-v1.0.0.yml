## 三、用户中心 API

### 3.1 统一登录
```
POST /api/v1/user/auth/login
```
- **请求体**：`{ phone, sms_code | wx_code, platform, device_id }`
- **响应体**：`{ access_token, refresh_token, expires_in, temp_identities[] }`
- ⚠️ 返回临时身份列表·用户选择活跃身份后调用激活接口

### 3.2 身份激活与切换
```
POST /api/v1/user/auth/activate-identity
```
- **请求体**：`{ identity_id }`
- **响应体**：`{ identity_role, view_menu[], permissions[], safe_session_token }`
- **后置**：清理上个身份状态·加载新身份配置

### 3.3 入驻申请提交
```
POST /api/v1/user/onboarding/submit
```
- **请求体**：
```typescript
{
  merchant_type: "PH" | "DR" | "PR" | "NT" | "HM",
  business_name: string,
  qualifications: QualificationFile[],  // 资质证照文件
  contact_info: { name, phone, email },
  payment_info?: {                       // 仅PH/DR/NT需要
    bank_account: string,
    bank_name: string,
    settlement_type: "T1" | "D1"
  }
}
```
- **响应体**：`{ application_id, status: "PENDING", sla_deadline }`

### 3.4 健康档案读取/写入
```
GET  /api/v1/user/profile/health?patient_id=xxx
POST /api/v1/user/profile/health/update
```
- **写入请求体**：`{ basic_info, medical_history[], allergies[], medications[], complications[] }`
- **权限**：患者→编辑自己·HM→编辑托管患者·家属→只读

### 3.5 家属绑定
```
POST /api/v1/user/family/bind
GET  /api/v1/user/family/monitored?patient_id=xxx
```
- **绑定请求体**：`{ patient_id, relation, access_level: "READ" | "ALERT_ONLY" }`

