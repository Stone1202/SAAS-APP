## 九、通信中心 API

### 9.1 IM WebSocket 协议
```
ws://host/ws/chat?token={jwt}&channel={consultation|service|live}
```
- **消息格式**：
```typescript
type IMMessage = {
  type: "TEXT" | "IMAGE" | "PRESCRIPTION_CARD" | "LIVE_CARD" | "PRODUCT_CARD",
  from: string,
  to: string,
  channel: string,
  content: string | CardPayload,
  timestamp: number,
  message_id: string
}
```

### 9.2 通知管理
```
GET  /api/v1/comm/notification/list?page=&unread_only=
POST /api/v1/comm/notification/read     // 批量已读
POST /api/v1/comm/notification/read-all // 全部已读
```
- **已读同步**：read操作后WebSocket广播·其他终端30s内更新

