## 八、运营中心 API

### 8.1 入驻审核
```
GET  /api/v1/ops/onboarding/pending?page=&page_size=
POST /api/v1/ops/onboarding/{application_id}/review
```
- **审核请求体**：`{ result: "APPROVED" | "REJECTED" | "SUPPLEMENT", reason, reviewer }`

### 8.2 易宝入网状态查询
```
GET  /api/v1/ops/merchant/{merchant_id}/yeepay-status
POST /api/v1/ops/merchant/{merchant_id}/yeepay-onboarding
```
- **入网请求体**：`{ merchant_info, bank_account, legal_person }`（继承入驻信息）

### 8.3 配置管理
```
GET  /api/v1/ops/config/list?group=&key=
POST /api/v1/ops/config/update
```
- **可配置项**：分账比例·审核SLA·冷链告警阈值·积分规则·会员等级门槛·优惠券模板·支付通道权重

