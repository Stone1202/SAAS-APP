## 六、冷链中心 API

### 6.1 冷链包裹绑定
```
POST /api/v1/coldchain/shipment/bind
```
- **请求体**：`{ order_id, device_id, temperature_range: { min, max, humidity_max } }`
- **响应体**：`{ shipment_id, tracking_url }`

### 6.2 温度数据查询
```
GET  /api/v1/coldchain/temperature/{shipment_id}?from=&to=
GET  /api/v1/coldchain/alert/{shipment_id}/list
```
- **响应体**：`{ readings: TemperatureReading[], alerts: TemperatureAlert[], continuous_status }`

### 6.3 超温处置
```
POST /api/v1/coldchain/alert/{alert_id}/resolve
```
- **请求体**：`{ action: "REDELIVER" | "REPORT_SAFE" | "FORCE_REFUND", operator, notes }`

