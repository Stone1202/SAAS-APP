## 十一、API幂等性设计

| 接口类型 | 幂等策略 | 幂等键 |
|----------|----------|--------|
| 入驻提交 | 数据库唯一约束·重复提交返回已存在ID | `merchant_type + business_license_no` |
| 下单 | Redis去重·5min窗口 | `client_order_id`（前端生成UUID） |
| 支付 | 后端out_trade_no去重 | `out_trade_no` |
| 退款 | 退款ID唯一 | `refund_request_id` |
| 处方签名 | CA签名ID唯一 | `prescription_id + signer_id` |

---

## 十二、API版本兼容规则

| 规则 | 说明 |
|------|------|
| ✅ 安全 | 新增可选字段·新增接口·新增枚举值 |
| ⚠️ 谨慎 | 修改字段默认值·增加校验规则 |
| ❌ 禁止 | 删除字段·修改字段类型·修改枚举值含义·修改鉴权逻辑 |
