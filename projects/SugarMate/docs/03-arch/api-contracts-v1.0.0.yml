## 二、通用请求/响应Schema

### 2.1 通用请求头

```typescript
// CommonRequestHeaders
{
  "Authorization": "Bearer {jwt_token}",      // JWT Token
  "X-Request-Id": "uuid",                      // 请求ID·全链路追踪
  "X-Timestamp": "1690123456",                  // 13位毫秒时间戳
  "X-Nonce": "random_string",                   // 随机数·防重放
  "X-Platform": "APP|MP|LIVE|PC",              // 终端标识
  "X-Role-View": "PATIENT|DOCTOR|NUTRITIONIST|HM|PH|OPS",  // 当前活跃角色
  "X-Device-Id": "device_uuid"                  // 设备指纹
}
```

### 2.2 通用响应体

```typescript
// CommonResponse<T>
type CommonResponse<T> = {
  code: number;           // 业务状态码·0=成功
  message: string;         // 提示信息
  data: T | null;          // 响应数据
  request_id: string;      // 回显请求ID
  timestamp: number;       // 服务端时间戳
  pagination?: {           // 分页信息·列表接口使用
    page: number;
    page_size: number;
    total: number;
    total_pages: number;
  }
}
```

### 2.3 业务状态码

| 范围 | 含义 |
|-----|------|
| 0 | 成功 |
| 1000-1999 | 参数校验错误 |
| 2000-2999 | 鉴权/授权错误 |
| 3000-3999 | 业务逻辑错误 |
| 4000-4999 | 外部服务调用失败 |
| 5000-5999 | 系统内部错误 |

