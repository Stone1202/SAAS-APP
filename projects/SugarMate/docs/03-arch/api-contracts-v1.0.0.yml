## 一、API版本策略

| 规则 | 说明 |
|------|------|
| 版本路径 | `/api/v{major}.{minor}/` → 如 `/api/v1/` |
| 兼容承诺 | 同大版本向后兼容·废弃字段保留3个月 |
| 中断变更 | 升级大版本·旧版本保留6个月 |
| API文档 | Swagger/OpenAPI 3.0自动生成 |

