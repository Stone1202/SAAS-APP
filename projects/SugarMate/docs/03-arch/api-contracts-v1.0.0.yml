## 四、交易中心 API

### 4.1 下单
```
POST /api/v1/trade/order/create
```
- **请求体**：
```typescript
{
  items: { product_id, sku_id, quantity, prescription_ref?: string }[],
  address_id: string,
  coupon_code?: string,
  use_point?: number,
  remark?: string
}
```
- **响应体**：`{ order_id, total_amount, pay_channel[] }`
- **前置校验**：库存预占·处方有效性（处方药）·冷链资格检查

### 4.2 发起支付
```
POST /api/v1/trade/payment/pay
```
- **请求体**：`{ order_id, channel: "YEEPAY" | "WECHAT", return_url }`
- **响应体**：`{ pay_url, transaction_id, expires_in }` 或 `{ wechat_pay_params }`
- ⚠️ 易宝和微信的响应格式不同·前端按channel区分处理

### 4.3 申请退款
```
POST /api/v1/trade/refund/apply
```
- **请求体**：`{ order_id, reason, images[], refund_amount }`
- **金额≥500元**：需要双人复核·第一次创建退款工单·第二次确认执行
- **响应体**：`{ refund_id, status, need_approval }`

### 4.4 订单列表查询
```
GET  /api/v1/trade/order/list?status=&role=&page=&page_size=
GET  /api/v1/trade/order/detail/{order_id}
```

---

## 五、处方中心 API

### 5.1 处方开具（医生端）
```
POST /api/v1/rx/prescription/issue
```
- **请求体**：
```typescript
{
  patient_id: string,
  diagnosis: { icd10_code, description },
  drugs: { drug_name, specification, dosage, frequency, duration }[],
  notes?: string
}
```
- **响应体**：`{ prescription_id, drug_interaction_warnings[] }`
- ⚠️ 药物相互作用检查为硬门禁·有warning时必须医生确认

### 5.2 CA数字签名
```
POST /api/v1/rx/prescription/{prescription_id}/sign
```
- **请求体**：`{ signature_image_base64, position }`
- **响应体**：`{ signature_id, ca_cert_hash, timestamp }`
- **后置**：签名事件→处方状态更新→通知药房

### 5.3 处方审核（药房端）
```
GET  /api/v1/rx/prescription/pending   // 待审核列表
POST /api/v1/rx/prescription/{prescription_id}/audit
```
- **审核请求体**：`{ decision: "APPROVED" | "REJECTED", reason }`
- **后置**：审核通过→处方可用购药·审核拒绝→状态变更通知医生

### 5.4 处方调配（药房端）
```
POST /api/v1/rx/dispensing/{prescription_id}/dispense
```
- **请求体**：`{ drugs: { drug_name, batch_no, trace_code, quantity }[], operator }`
- **后置**：GSP追溯记录·冷链关联·库存扣减

