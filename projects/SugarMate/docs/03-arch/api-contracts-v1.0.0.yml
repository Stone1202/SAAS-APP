## 十、模块间内部API（Service2Service）

> 以下API仅限模块间调用·不对前端公开·通过网关层内网接口访问

| 调用方→被调用方 | 路径 | 说明 |
|:--------|------|------|
| trade→user | `GET /internal/v1/user/identity/{id}` | 获取身份信息（下单鉴权） |
| trade→product | `POST /internal/v1/product/inventory/lock` + `release` | 库存预占/释放 |
| trade→prescription | `POST /internal/v1/rx/prescription/validate` | 处方有效性验证 |
| trade→coldchain | `POST /internal/v1/coldchain/shipment/create` | 创建冷链追踪 |
| prescription→user | `GET /internal/v1/user/doctor-profile/{id}` | 获取医生信息 |
| coldchain→communication | `POST /internal/v1/comm/alert/send` | 告警通知发送 |
| content→operation | `POST /internal/v1/ops/audit/submit` | 内容审核提交 |

