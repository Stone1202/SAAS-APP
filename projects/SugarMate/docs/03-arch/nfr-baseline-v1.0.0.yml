## 二、安全合规（security）—— 🔴 最高优先级

> **AI推理依据**：SugarMate涉及医疗数据（个保法·卫健委·GSP）+处方CA签名（电子签名法）+支付资金（PCI DSS）+入驻资质审查

### NFR-SEC-001：医疗数据分级保护
- **严重级别**：🔴 Critical
- **关联FN**：ENT中的HealthProfile/Prescription/CASignature/CGMRecord
- **AI推理**：血糖记录→敏感个人信息·处方→医疗数据·CA签名→电子签名
- **数据分级方案**：

| 分级 | 定义 | SugarMate数据 | 加密要求 | 脱敏规则 |
|:--:|------|--------------|---------|----------|
| L0·公开 | 可公开发布 | 科普文章/公开直播/商品展示 | 不需要 | 不需要 |
| L1·内部 | 平台内部可见 | 商家名称/店铺信息/平台公告 | 传输TLS1.3 | 不需要 |
| L2·敏感 | 需授权访问 | 姓名/手机号/地址/执业证号/订单记录 | 传输TLS1.3+存储AES-256 | 前端脱敏（13****1234） |
| L3·机密 | 严格受控 | CGM血糖数据/处方/病历/CA签名/支付卡号/身份证 | 传输TLS1.3+存储AES-256+字段级加密 | 脱敏+审计日志+导出审批 |

- **实现要点**：
  - L3数据使用独立加密密钥，与L2数据分离存储
  - 密钥管理：KMS轮换·90天自动轮换·泄漏自动吊销
  - 数据库层面：L3字段使用`pgcrypto`字段级加密
  - API层面：L3数据响应不返回原始值·脱敏后返回

### NFR-SEC-002：处方CA签名合规（电子签名法）
- **严重级别**：🔴 Critical
- **关联FN**：FN-SUG-APP-025~030（处方开具与流转）
- **合规要求**：
  - CA数字证书必须从国家认可的CA机构获取
  - 签名过程必须记录：签署人身份+时间戳+IP+设备指纹+签名图片哈希
  - 签名验证：处方流转到药房时必须验证签名有效性
  - 签名不可抵赖性：完整审计链（谁签/何时签/签了什么）
- **容灾方案**：
  - CA签名服务不可用→排队重试（最多3次·间隔5s）→超时后降级为手动签名+拍照上传（管理员人工核验）

### NFR-SEC-003：支付安全合规（PCI DSS·易宝/微信双通道）
- **严重级别**：🔴 Critical
- **关联FN**：FN-SUG-APP-035~040（下单支付）+ SM-18（易宝入网）
- **合规要求**：
  - 平台不存储完整卡号·仅保留支付机构返回的token
  - 支付回调必须幂等处理（out_trade_no去重）
  - 分账比例必须与商家签约数据一致（防止分账错误）
  - 退款必须双人复核（金额≥500元时）
- **双通道互斥规则**：同一订单只能走一个支付通道·不允许部分易宝部分微信

### NFR-SEC-004：入驻资质防伪与数据隐私
- **严重级别**：🔴 Critical
- **关联FN**：FN-SUG-PC-001~010（入驻管理）
- **合规要求**：
  - 资质OCR识别准确率≥98%
  - 资质文件存储加密·访问需审批
  - 审核记录保留≥5年（监管要求）
  - 审核人员不可查看非自己审核的商家完整资质（权限隔离）

### NFR-SEC-005：冷链GSP合规追溯
- **严重级别**：🔴 Critical
- **关联FN**：SM-07（冷链配送）+ FN-SUG-PC-025~030
- **合规要求**：
  - 温度日志保留≥2年
  - 每笔冷链订单必须有完整的温度轨迹记录
  - 超温事件必须记录：时间/温度值/持续时间/处置结果
  - 冷链数据不可篡改（使用区块链/Merkle树防篡改）

### NFR-SEC-006：直播内容安全合规
- **严重级别**：🔴 Critical
- **关联FN**：FN-SUG-LIVE全模块
- **合规要求**：
  - AI审核召回率≥95%（违规内容——色情/暴力/欺诈/无证行医）
  - 审核日志保留≥1年
  - 直播内容实时监控——违规→秒级下播
  - 录播回放上传前必须经过内容审核

### NFR-SEC-007：审计日志全覆盖
- **严重级别**：🟡 High
- **关联FN**：全局
- **要求**：
  - 所有API调用记录审计日志（who/when/what/result）
  - 敏感操作（资金/处方/入驻审核/权限变更）必须二次验证
  - 审计日志不可删除·保留≥1年
  - 日志格式统一：`{timestamp}|{user_id}|{ip}|{action}|{resource}|{old_value}|{new_value}|{result}`

### NFR-SEC-008：多租户数据隔离
- **严重级别**：🟡 High
- **关联FN**：PC后台全部模块
- **要求**：
  - 每个商家只能查看本商家数据
  - 平台管理员查看跨商家数据需要审批授权
  - 数据导出需二次验证（手机验证码）
  - API层面按tenant_id强制过滤

### NFR-SEC-009：接口防重放与防篡改
- **严重级别**：🟡 High
- **关联FN**：ALL API
- **要求**：
  - 所有API请求携带nonce+timestamp（防重放·窗口5min）
  - 支付/处方/入驻API要求签名校验（类似微信支付V3签名）
  - 敏感参数禁止出现在URL query string中

### NFR-SEC-010：GSP药品追溯码
- **严重级别**：🟡 High
- **关联FN**：处方流转+药品出库
- **要求**：
  - 处方药必须关联国家药品追溯码
  - 调配记录必须追溯码关联
  - 患者可通过追溯码验证药品真伪

### NFR-SEC-011：DDoS与爬虫防护
- **严重级别**：🟢 Medium
- **关联FN**：ALL
- **要求**：
  - 网关层限流（令牌桶·1000req/s·IP级限流100req/s）
  - 验证码人机校验（登录/注册/支付场景）
  - 敏感API（查库存/商品价格）频率限制

### NFR-SEC-012：数据备份与灾备
- **严重级别**：🟢 Medium
- **关联FN**：全局
- **要求**：
  - 数据库每日全量备份
  - L3数据异地备份·跨可用区
  - 备份恢复RTO≤4小时
  - 定期灾备演练（每季度1次）

