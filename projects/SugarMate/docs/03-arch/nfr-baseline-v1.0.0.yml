## 五、可用性（availability）

> **AI推理依据**：PRD §14.13.2 SLA承诺 + 医疗场景高可用需求

| 服务等级 | 可用率 | RPO | RTO | 覆盖模块 | 严重级别 |
|:------:|:-----:|:---:|:---:|----------|:------:|
| Tier 1·核心链路 | 99.95% | ≤5min | ≤15min | 登录·下单·支付·处方·CGM | 🔴 Critical |
| Tier 2·业务关键 | 99.9% | ≤15min | ≤30min | 商品·搜索·IM·冷链·入驻 | 🔴 Critical |
| Tier 3·重要服务 | 99.5% | ≤1h | ≤2h | 营销·内容·社区·看板 | 🟡 High |
| Tier 4·辅助服务 | 99% | ≤24h | ≤4h | 数据报表·运营工具 | 🟢 Medium |

**各终端可用性特殊考量**：
- APP：弱网环境·离线降级·本地缓存（IndexedDB）
- MP：微信平台依赖性·小程序版本审核延迟·降级H5
- LIVE：腾讯云CSS SLA 99.9%·推流链路冗余
- PC：Web端·依赖网络·无离线模式

