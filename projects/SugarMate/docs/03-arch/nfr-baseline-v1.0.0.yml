## 十一、NFR优先级排序（Arch建议）

### 🔴 P0·架构设计阶段必须落地
1. NFR-SEC-001~005：安全合规（医疗数据/CA签名/支付/入驻/冷链GSP）
2. NFR-CONS-001~003：CGM·处方·入驻跨终端一致性
3. NFR-AVAIL-001~002：Tier 1/2可用性保障
4. NFR-PERF-001~003：APP API·CGM·直播性能基线

### 🟡 P1·开发阶段必须落地
5. NFR-SEC-007~010：审计日志·多租户隔离·接口防护·GSP追溯
6. NFR-CON-001~003：直播并发·IM并发·秒杀并发
7. NFR-PERF-004~008：PC API·直播首帧·审核·结算·看板

### 🟢 P2·运营阶段持续优化
8. NFR-SEC-011~012：DDoS防护·数据备份
9. NFR-SCALE-001~004：扩展性
10. NFR-ASYNC-001~004：异步处理优化
