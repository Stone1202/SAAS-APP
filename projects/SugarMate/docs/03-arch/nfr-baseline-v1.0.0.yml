## 四、数据一致性（consistency）

> **AI推理依据**：SM-05/07/10跨终端状态机 + CGM实时数据 + 处方流转 + 分账结算

| 场景 | 一致性要求 | 实现方案 | 窗口 | 严重级别 |
|------|:------:|----------|:--:|:------:|
| CGM血糖数据·设备→APP→后端 →PC(HM)/MP(家属) | 最终一致 | WebSocket推送+ACK确认 | ≤3s | 🔴 Critical |
| 处方CA签名·医生→药房→患者 | 强一致 | 状态机事件+版本校验+签名验证 | 0s（事务） | 🔴 Critical |
| 入驻状态·PC审核→APP B端工作台 | 最终一致 | 状态机事件+推送 | ≤10s | 🔴 Critical |
| 冷链状态·IoT→平台→药房→患者 | 最终一致 | MQTT QoS2+事件 | ≤30s | 🟡 High |
| 库存·PC编辑→APP/MP展示 | 读写一致 | 乐观锁+库存预占+下单时二次校验 | ≤1s | 🟡 High |
| 通知已读状态·多终端 | 最终一致 | 已读事件+定时同步 | ≤30s | 🟡 High |
| 分账结算·交易→易宝→对账 | 最终一致 | 易宝回调幂等+T+1对账 | T+1 | 🟢 Medium |

