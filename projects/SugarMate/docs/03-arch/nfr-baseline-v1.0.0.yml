## 八、异步处理（async）

> **AI推理依据**：MPS擦音回调·积分批次·入驻审核·直播转码

| 场景 | 异步原因 | 实现方案 | 严重级别 |
|------|----------|----------|:------:|
| 入驻审核·AI+人工 | 流程长·涉及外部API | 状态机+事件驱动+定时轮询 | 🟡 High |
| 积分批次·FIFO消费 | 批量计算·高吞吐 | Event Sourcing+批量处理 | 🟡 High |
| 直播转码与回放生成 | 耗时操作 | 异步任务队列·回调通知 | 🟡 High |
| 冷链告警·补发流程 | 多模块联动 | 事件驱动+状态机 | 🟢 Medium |

