## ADR-007·API文档与契约管理

| 项目 | 决定 |
|------|------|
| **决定** | OpenAPI 3.0（Swagger）·自动生成→下游SDK生成 |
| **场景** | 10模块API契约·前后端对齐·跨团队协作 |
| **理由** | 行业标准·丰富工具链·客户端代码生成(Swagger Codegen) |
| **流程** | Backend定义Swagger→生成TypeScript类型→前端消费 |

