## ADR-012·AI辅助架构决策（本架构师记录）

| 决策点 | AI推理 | 架构师判断 | 结论 |
|--------|--------|:--------:|------|
| NFR·安全合规优先级 | AI识别12项安全NFR·6项Critical | ✅ 采纳·医疗场景安全不可妥协 | P0强制落地 |
| 模块拆分·10模块 | AI分析PRD 145 FN→推荐10 Bounded Context | ✅ 采纳·粒度适中 | 按案实施 |
| 数据一致性·最终一致 | AI推荐事件驱动·最终一致·非强一致 | ✅ 采纳·兼顾性能与用户体验 | 分场景定义窗口 |
| LIVE端·独立技术栈 | AI推理SDK耦合度→建议独立 | ✅ 采纳·避免SDK冲突 | LIVE独立APP |
| 支付双通道·易宝+微信 | AI分析双通道兜底·降级策略 | ✅ 采纳·保障支付可用性 | 断路器自动切换 |
| 消息队列·渐进式 | AI推荐阶段演进·不锁定早期选型 | ✅ 采纳·避免过度设计 | EventEmitter→Redis→RabbitMQ |
| IoT协议·MQTT QoS2 | AI识别冷链GSP合规→QoS2 | ✅ 采纳·GSP核心要求 | MQTT QoS2 |
