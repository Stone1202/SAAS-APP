## ADR-001·前端框架选型

| 项目 | 决定 |
|------|------|
| **决定** | uni-app（跨端框架）·Vue 3 组合式API |
| **场景** | APP + MP（微信小程序）共用代码 |
| **理由** | 一套代码编译iOS/Android/微信小程序/H5·约定>配置·生态成熟 |
| **否决方案** | Flutter——小程序支持不成熟·React Native——WebView跨端不可靠 |
| **约束** | LIVE端因腾讯云SDK耦合度高·独立原生开发·PC端React 18+Ant Design |

**关键原则**：uni-app不做"一站到底"——LIVE端/PC端独立技术栈

---

## ADR-002·状态管理

| 项目 | 决定 |
|------|------|
| **决定** | Zustand（轻量级全局状态）+ Pinia（uni-app首选）+ TanStack Query（服务端状态） |
| **场景** | Zustand管理跨模块共享状态（用户/角色/权限/通知）·Pinia管理模块内状态·TanStack Query管理API缓存 |
| **理由** | Zustand无Provider·天然支持分片·TypeScript友好·Pinia是Vue生态首选 |
| **否决方案** | Vuex——模板代码多·全局Store一次注册·Redux——不属于Vue生态 |

---

## ADR-003·数据库选型

| 项目 | 决定 |
|------|------|
| **决定** | PostgreSQL 15+（主库）+ Redis 7+（缓存·队列·预占锁） |
| **场景** | PostgreSQL·10微服务独立DB·字段级加密(pgcrypto)·Redis·WebSocket连接管理·库存预占·断路器 |
| **理由** | PostgreSQL成熟·丰富扩展(JSONB/pgcrypto)·ACID事务·Redis高性能+丰富数据结构 |
| **否决方案** | MongoDB——交易场景需要事务保证·事务性能不如PG |

---

## ADR-004·消息队列

| 项目 | 决定 |
|------|------|
| **决定** | 阶段1(原型)·EventEmitter内存事件 → 阶段2(生产)·Redis Streams → 阶段3(高并发)·RabbitMQ |
| **场景** | 跨模块领域事件传递·事件溯源 |
| **理由** | 渐进式演进·原型不引入基础设施复杂度·Redis Streams足够支撑生产量级 |
| **约束** | 接口层面始终用统一的`EventBus.publish/subscribe`抽象·不绑定具体实现 |

---

## ADR-005·支付双通道

| 项目 | 决定 |
|------|------|
| **决定** | 易宝支付(主通道) + 微信支付(APP备用+MP唯一通道) |
| **场景** | 易宝·收单/退款/分账/入网全能力·微信支付·小程序支付+APP降级 |
| **理由** | 易宝分账/入网能力更适合平台型多商家场景·微信支付弥补小程序生态 |
| **互斥规则** | 同一订单单通道·不允许拆分支付 |
| **切换策略** | 易宝断路器打开→自动切换微信·30s半开探测 |

---

## ADR-006·LIVE端独立技术栈

| 项目 | 决定 |
|------|------|
| **决定** | LIVE端独立APP·使用腾讯云直播SDK（原生集成） |
| **场景** | 推流/拉流/IM弹幕/录制 |
| **理由** | 腾讯云SDK与uni-app集成不稳定·独立APP可优化直播体验·可独立发版迭代 |
| **代价** | 维护成本增加·版本同步需协调 |
| **底线** | LIVE端与主APP通过DeepLink互通·共享IM·不成为信息孤岛 |

