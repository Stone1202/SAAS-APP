## ADR-008·日志与监控

| 项目 | 决定 |
|------|------|
| **决定** | 结构化日志(JSON格式) + APM + Sentry错误追踪 |
| **场景** | 全链路追踪·性能监控·错误告警 |
| **要求** | 日志格式统一·request_id贯穿全链路·审计日志不可删除 |
| **关键指标** | P95延迟·错误率·消息积压·断路器状态·WebSocket连接数·支付成功率 |

