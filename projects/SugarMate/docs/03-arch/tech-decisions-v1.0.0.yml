## ADR-010·缓存策略

| 项目 | 决定 |
|------|------|
| **决定** | Redis多级缓存·读缓存30s·写缓存失效立即刷新 |
| **场景** | 商品信息·用户数据·系统配置·断路器状态 |
| **策略** | Cache-Aside·读→miss→查DB→写cache·写→写DB→删cache |
| **禁令** | ❌ 禁止使用缓存作为数据持久化·写缓存前必须先写DB |

---

## ADR-011·前端离线能力

| 项目 | 决定 |
|------|------|
| **决定** | APP端·Service Worker + IndexedDB本地存储 + 弱网降级 |
| **场景** | APP弱网/离线·IM消息乐观更新·表单草稿本地暂存 |
| **能力** | 离线时·数据本地存储(IndexedDB)→恢复时同步→冲突由后端时间戳仲裁 |
| **MP限制** | 小程序不支持Service Worker·降级为本地缓存(WxStorage·10MB限制) |

