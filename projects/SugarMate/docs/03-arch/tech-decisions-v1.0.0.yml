## ADR-009·部署策略

| 项目 | 决定 |
|------|------|
| **决定** | Docker容器化 + Kubernetes编排 + GitOps |
| **场景** | 10微服务独立部署+水平扩展 |
| **环境** | dev → staging → prod·灰度发布·蓝绿部署 |
| **CI/CD** | GitHub Actions·代码push→build→test→deploy |

