# ============================================
# 四层价值评估 — AI-SCRM v1.0.0
# PO Agent 产出（po-planning-flow po-2）
# 评估标准：value-assessment-standards.yml
# ============================================

version: "1.0.0"
project: "AI-SCRM"
assessment_date: "2026-07-18"
assessor: "po-agent"
brainstorm_version: "v2.0.0"

# ============================================
# 一、四层价值评估
# ============================================
value_layers:
  layer_1_business_value:
    name: "商业价值层"
    weight: 0.35
    score: 88
    dimensions:
      - id: "BV-01"
        name: "B2B SAAS市场机会"
        score: 90
        rationale: |
          大健康/药业/美妆/百货四个垂直行业均有强烈的销售团队数字化管理需求。
          SAAS模式降低客户IT投入，按需订阅降低决策门槛。
      - id: "BV-02"
        name: "AI差异化竞争力"
        score: 85
        rationale: |
          AI智能体可选架构实现差异化定价：传统SCRM锁定价格敏感客户，
          AI专业版/企业版创造高ARPU。Coze+火山双引擎防锁定。
      - id: "BV-03"
        name: "收入可预测性"
        score: 88
        rationale: |
          月付/年付订阅模式提供可预测的经常性收入（MRR/ARR）。
          资源包叠加提供弹性收入。运营后台实时监控收入健康度。
      - id: "BV-04"
        name: "先发优势窗口"
        score: 90
        rationale: |
          垂直行业SAAS SCRM + AI智能体已存在竞品（尘锋、探马），
          但"家电+3C"赛道仍有细分机会。

  layer_2_delivery_value:
    name: "交付价值层"
    weight: 0.25
    score: 82
    dimensions:
      - id: "DV-01"
        name: "MVP交付周期"
        score: 80
        rationale: "双系统12周全量交付，P1-P2 8周可上线运营后台+租户后台MVP"
      - id: "DV-02"
        name: "增量交付能力"
        score: 85
        rationale: "6个Sprint独立交付，每个Sprint有可演示的独立增量"
      - id: "DV-03"
        name: "团队能力匹配"
        score: 80
        rationale: "React 18 + TypeScript + Ant Design技术栈成熟，团队有SAAS项目经验"

  layer_3_customer_value:
    name: "客户价值层"
    weight: 0.25
    score: 85
    dimensions:
      - id: "CV-01"
        name: "核心痛点解决度"
        score: 90
        rationale: |
          销售团队精细化管理（客户跟进、沟通协作、SOP执行）是真实刚需。
          权限数据隔离消除企业数据安全顾虑。
      - id: "CV-02"
        name: "AI增值感知"
        score: 80
        rationale: "AI智能体可选，客户可根据预算和需求自主选择，避免强制付费"
      - id: "CV-03"
        name: "行业适配度"
        score: 85
        rationale: "4行业预置模板降低上手成本，行业专属字段和SOP模板"

  layer_4_scenario_closure:
    name: "场景闭环层"
    weight: 0.15
    score: 78
    dimensions:
      - id: "SC-01"
        name: "核心场景完整性"
        score: 80
        rationale: "客户管理→沟通→SOP→待办形成完整闭环"
      - id: "SC-02"
        name: "AI场景覆盖度"
        score: 75
        rationale: "AI智能体首批覆盖自动回复+处理链+排程，后续可扩展智能分析"

# ============================================
# 二、公司7要素影响矩阵
# ============================================
company_impact:
  revenue_operations:
    name: "运营"
    impact: "高"
    detail: "SAAS订阅模式改变收入结构，运营后台成为核心业务系统"
  resource:
    name: "资源"
    impact: "中"
    detail: "需投入12周研发资源，Coze/火山API有月度成本"
  finance:
    name: "财务"
    impact: "高"
    detail: "订阅+资源包+AI计费三维收入模型，需财务系统对接"
  channel:
    name: "渠道"
    impact: "中"
    detail: "目前以直销为主，后续可发展代理商模式"
  business:
    name: "业务"
    impact: "高"
    detail: "从项目制转型为SAAS产品制，组织架构需调整"
  organization:
    name: "组织"
    impact: "中"
    detail: "需组建SAAS运营团队（客户成功、技术支持）"
  technology:
    name: "技术"
    impact: "高"
    detail: "双系统架构 + AI集成 + 多租户数据隔离，技术复杂度较高"

# ============================================
# 三、综合评估
# ============================================
total_score: 84
assessment:
  grade: "A"
  recommendation: "P0优先启动"
  risk_level: "中"
  key_risks:
    - "双系统12周交付压力大，需严格控制Sprint范围"
    - "AI智能体依赖第三方（Coze/火山），存在API变更风险"
    - "4行业模板需要行业专家参与设计"
    - "SAAS运营团队需同步组建"
  key_advantages:
    - "垂直行业定位清晰，差异化竞争力强"
    - "AI可选架构降低客户决策门槛"
    - "技术栈成熟，团队执行力有保障"
    - "SAAS收入模型可预测、可规模化"
