# =============================================================================
# AI-SCRM 四层价值评估 v2.0.0
# v2.0.0 变更：从抽象模块化视角 → 真实业务流视角
#         核心价值重新锚定：「沟通中+沟通后」AI辅助闭环
# =============================================================================

meta:
  version: "v2.0.0"
  date: "2026-07-18"
  re_evaluation_reason: >
    用户反馈v1.0.0存在"照抄"问题——SOP被当成抽象流程引擎，而不是嵌入真实沟通过程的AI辅助闭环。
    v2.0.0以真实业务流为锚点重新评估：沟通中（实时辅助）→ 沟通后（自动处理）→ 持续跟进（成交复购粘性满意）

# =============================================================================
# 一、商业价值（满分100，权重30%）
# =============================================================================
business_value:
  score: 90  # v1.0.0: 88 → v2.0.0: 90（MVP范围更聚焦，更快验证PMF）
  weight: 0.30

  dimensions:

    market_fit:
      score: 92
      rationale: |
        四个目标行业（大健康/药业/美妆/百货）都是高频客户沟通型行业。
        销售/客服人员每天大量时间花在"该说什么、客户什么情绪、推荐什么产品"上。
        「沟通中AI辅助」直接解决这几个痛点，不是锦上添花而是雪中送炭。
        传统SCRM只做"客户管理"，AI-SCRM做"沟通增效"——这是差异化。
      evidence:
        - "大健康行业销售每天跟进50+客户，话术标准化需求强烈"
        - "美妆行业客户情绪敏感，负面情绪未及时发现=客户流失"
        - "百货行业SKU多，销售记不住所有商品，实时推荐刚需"

    revenue_potential:
      score: 88
      rationale: |
        版本差异化清晰：基础版=传统SCRM（客户/沟通/待办），专业版+=AI辅助。
        AI辅助需要Coze+火山成本，单独计费合理。
        关键转化路径：体验版(免费7天)→基础版(99元)→感受到AI价值→升级专业版(199元)。
      revenue_model: "版本订阅 + AI用量计费 + 资源增购（坐席/企微/线路）"
      target_mrr_milestones:
        - { milestone: "MVP后3月", target: "¥30K/MRR" }
        - { milestone: "MVP后6月", target: "¥80K/MRR" }
        - { milestone: "MVP后12月", target: "¥200K/MRR" }

    competitive_moat:
      score: 90
      rationale: |
        真正的护城河不是功能列表，而是"沟通数据飞轮"：
        每次沟通 → AI学习 → 话术更精准 → 客户画像更丰富 → 推荐更准确 → 成交率提升。
        竞争对手可以复制"SOP引擎"，但复制不了"基于真实沟通数据持续进化的AI辅助"。
      moats:
        - "沟通中AI辅助闭环（话术/情绪/推荐）——竞品做独立模块，我们嵌入沟通流"
        - "沟通后自动处理链（总结/质检/画像/跟进）——竞品需手动操作"
        - "客户意图+员工意图双识别——竞品只识别客户标签"
        - "Coze Agent编排——不是规则引擎，是LLM理解上下文"

# =============================================================================
# 二、交付价值（满分100，权重25%）
# =============================================================================
delivery_value:
  score: 88  # v1.0.0: 82 → v2.0.0: 88（Sprint更聚焦，每个交付可感知价值）
  weight: 0.25

  dimensions:
    sprint_deliverable_value:
      score: 90
      rationale: |
        v1.0.0的Sprint只是按模块拆分（"Sprint 3 = SOP引擎+待办"），用户看不出交付了什么。
        v2.0.0每个Sprint交付一个"可跑通的业务场景"：
        - Sprint 1: 我能登录、看到工作台、管理客户 → 骨架可感知
        - Sprint 2: 我能和客户聊天、通话 → 沟通可用
        - Sprint 3: 聊天时AI帮我推荐话术、监控情绪、推荐商品 → AI辅助可感知
        - Sprint 4: 沟通完AI帮我总结、更新画像、生成跟进 → AI闭环可感知
        - Sprint 5: 运营后台能管租户、卖版本、看营收 → 商业化可用
        - Sprint 6: 手机上看客户、处理待办、看数据 → 移动办公可用
      sprint_value_chain:
        - { sprint: "Sprint 1", delivers: "骨架+工作台+客户CRUD", perceptible: "我看到系统了" }
        - { sprint: "Sprint 2", delivers: "统一沟通入口+记录", perceptible: "我能和客户沟通了" }
        - { sprint: "Sprint 3", delivers: "沟通中AI辅助", perceptible: "AI在帮我沟通了" }
        - { sprint: "Sprint 4", delivers: "沟通后AI处理+CRM", perceptible: "AI帮我处理后续了" }
        - { sprint: "Sprint 5", delivers: "SAAS商业引擎", perceptible: "能收钱了" }
        - { sprint: "Sprint 6", delivers: "移动H5+权限+看板", perceptible: "手机上也能用了" }

    dependency_management:
      score: 85
      rationale: |
        关键依赖「Coze Agent集成」在Sprint 3就接入（而非v1.0.0的Sprint 5）。
        因为AI辅助是核心差异化，越早接入越早验证效果。
        火山ASR在Sprint 2接入（电话转写刚需），晚于Coze因为可以先做企微文本场景。

    tech_risk:
      score: 88
      rationale: "Coze+火山双引擎防锁定。Sim/Real可插拔架构降低集成风险。先做企微文本场景再扩展到通话语音场景，渐进降低复杂度。"

# =============================================================================
# 三、客户价值（满分100，权重25%）
# =============================================================================
customer_value:
  score: 92  # v1.0.0: 85 → v2.0.0: 92（与用户真实痛点高度对齐）
  weight: 0.25

  dimensions:
    # 租户员工视角
    employee_pain_points_addressed:
      score: 95
      pain_point_mapping:
        - { pain: "不知道聊什么", solution: "沟通中话术推荐 → 基于上下文+客户画像匹配最佳话术" }
        - { pain: "客户不高兴了不知道", solution: "沟通中情绪监控 → 实时情绪曲线+负面波动预警" }
        - { pain: "不知道推荐哪个产品", solution: "沟通中商品推荐 → 识别客户意向+画像+历史→推荐最可能成交的商品" }
        - { pain: "聊完还得手动写总结", solution: "沟通后自动总结 → AI生成摘要+亮点+待改进点" }
        - { pain: "聊完还得手动打标签", solution: "沟通后画像更新 → 从对话中自动提取标签丰富客户画像" }
        - { pain: "忘了该跟进什么", solution: "沟通后跟进生成 → 识别客户意图→自动生成跟进任务→排入日历" }

    # 租户管理者视角
    manager_value:
      score: 88
      values:
        - "SOP执行不再是"要求员工填表"而是"AI自动记录和建议"→ 合规率自然提升"
        - "沟通质检自动化 → 不用人工抽检，AI全量质检+评分"
        - "员工绩效可视 → 谁沟通质量高、谁转化率高一目了然"
        - "客户流失预警 → 长期未跟进/负面情绪积压→自动告警"

    # 客户（终端消费者）视角
    end_customer_value:
      score: 90
      values:
        - "沟通更专业（话术标准化）→ 体验提升"
        - "推荐更精准（基于画像而非瞎推）→ 不被骚扰"
        - "情绪被关注（负面及时响应）→ 满意度提升"
        - "跟进不遗漏（AI提醒）→ 不被遗忘"

# =============================================================================
# 四、场景闭环（满分100，权重20%）
# =============================================================================
scenario_closure:
  score: 85  # v1.0.0: 78 → v2.0.0: 85（去掉了"SOP编排"抽象场景，换成真实业务流闭环）
  weight: 0.20

  # 核心闭环：客户沟通的全生命周期
  core_closed_loop:
    name: "「一条客户沟通」的全流程闭环"
    flow:
      - { step: 1, name: "客户触达", detail: "客户通过企微/电话/短信联系或被动触达", status: "Sprint 2" }
      - { step: 2, name: "沟通中AI辅助", detail: "实时转写→意图识别→话术推荐→情绪监控→商品推荐", status: "Sprint 3" }
      - { step: 3, name: "沟通后AI处理", detail: "总结→质检→画像更新→跟进任务生成", status: "Sprint 4" }
      - { step: 4, name: "跟进执行", detail: "待办→日历排程→执行→完成→下一轮沟通", status: "Sprint 4" }
      - { step: 5, name: "数据沉淀", detail: "沟通记录→客户画像丰富→话术优化→模型进化", status: "Sprint 6" }

  # 双意图识别闭环
  intent_loop:
    name: "双意图识别闭环"
    customer_intent:
      recognition: "识别客户交易意向（想买/在比价/有顾虑/不感兴趣/有投诉）"
      actions:
        - "高意向 → 推荐商品+促成话术+立即创建跟进"
        - "比价中 → 对比话术+竞品差异化卖点"
        - "有顾虑 → 打消顾虑话术+FAQ知识库匹配"
        - "不感兴趣 → 标记+延后跟进"
        - "有投诉 → 情绪预警+投诉SOP+主管介入"
    employee_intent:
      recognition: "识别员工跟进意图（该丰富哪个标签/该安排什么跟进/该推什么产品）"
      actions:
        - "画像不完整 → 自动补充标签（从对话中提取）"
        - "需要跟进 → 自动生成待办+排入日历"
        - "适合推荐 → 匹配商品+生成推荐理由"

  # 员工终极目标闭环
  ultimate_goal_loop:
    goal: "成交 + 复购 + 客户粘性 + 客户满意度"
    how_ai_helps:
      deal_closing:
        - "话术推荐 → 沟通更专业 → 成交率↑"
        - "商品推荐 → 精准匹配需求 → 客单价↑"
      repurchase:
        - "画像丰富 → 知道客户偏好 → 复购推荐精准"
        - "跟进不遗漏 → 持续触达 → 复购率↑"
      stickiness:
        - "情绪监控 → 负面及时响应 → 信任↑"
        - "跟进日历 → 不是骚扰是关心 → 粘性↑"
      satisfaction:
        - "沟通专业度↑ + 需求理解准确度↑ + 不遗漏不骚扰 → 满意度↑"

# =============================================================================
# 五、综合评分
# =============================================================================
overall:
  score: 89  # = 90×0.30 + 88×0.25 + 92×0.25 + 85×0.20 = 27+22+23+17 = 89
  grade: "A"
  change_from_v1: "+5分（84→89）"
  improvement_reasons:
    - "商业价值+2：MVP范围更聚焦，核心差异化（沟通中AI辅助）更清晰"
    - "交付价值+6：每个Sprint交付可感知场景而非抽象模块"
    - "客户价值+7：与用户描述的7个真实痛点直接映射"
    - "场景闭环+7：去掉了'SOP编排'等抽象场景，换成真实沟通闭环"
