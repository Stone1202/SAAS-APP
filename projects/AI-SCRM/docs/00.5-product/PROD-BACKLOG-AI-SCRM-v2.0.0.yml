# =============================================================================
# AI-SCRM 产品 Backlog v2.0.0
# v2.0.0 变更：从"按模块拆功能"→"按业务流程拆能力"
#         去掉「SOP引擎」抽象模块，将SOP能力嵌入真实沟通过程
#         核心主线：沟通中（实时AI辅助）→ 沟通后（自动AI处理）→ 跟进成交
# =============================================================================

meta:
  version: "v2.0.0"
  date: "2026-07-18"
  total_items: 14
  priority_distribution: { P0: 8, P1: 4, P2: 2 }

# =============================================================================
# P0 — MVP核心闭环（必须交付）
# =============================================================================

items:

  # ---- 基础设施层 ----
  - id: "PBL-001"
    title: "双系统骨架搭建"
    priority: "P0"
    sprint: "Sprint 1"
    system: "双系统"
    terminals: ["PC"]
    version_required: "全版本"
    story: >
      作为平台运营方和租户，我需要两个独立的后台入口，
      租户后台用于SCRM业务操作，运营后台用于SAAS商业管理。
      两个系统共享底层但独立部署、独立路由、独立登录。
    acceptance_criteria:
      - "租户后台登录 → 进入租户Layout → 默认跳转工作台"
      - "运营后台登录 → 进入运营Layout → 默认跳转运营工作台"
      - "两套路由互不干扰，URL前缀区分（/tenant vs /ops）"
      - "登录支持账号密码，Session跨页面保持"
    deliverables:
      - "Vue Router双路由树（/tenant/* + /ops/*）"
      - "双Layout组件（TenantLayout + OpsLayout）"
      - "登录页 + Token管理"
      - "通用组件库初始化（Element Plus + 自定义）"

  - id: "PBL-002"
    title: "租户工作台"
    priority: "P0"
    sprint: "Sprint 1"
    system: "租户后台"
    terminals: ["PC"]
    version_required: "全版本"
    story: >
      作为销售/客服人员，我登录后需要一个工作台，
      一眼看到今天的待办数量、最近沟通的客户、重要消息提醒，
      点击快捷入口直接进入客户管理或沟通页面。
    acceptance_criteria:
      - "数据概览卡片：今日待办数、今日沟通数、新增客户数"
      - "待办列表组件：显示最近5条待办，支持快速完成"
      - "最近沟通列表：显示最近10条沟通记录，点击跳转详情"
      - "消息提醒：显示未读系统消息/预警通知"
      - "快捷入口：客户管理、开始沟通、待办任务"
    deliverables:
      - "工作台页面 + 概览卡片组件"
      - "待办列表组件（通用，后续页面复用）"
      - "Store: useDashboardStore（概览数据）"

  - id: "PBL-003"
    title: "客户管理基础"
    priority: "P0"
    sprint: "Sprint 1"
    system: "租户后台"
    terminals: ["PC"]
    version_required: "全版本"
    story: >
      作为销售/客服人员，我需要管理我的客户，
      能新增、查看、编辑、搜索客户基本信息，
      给客户打标签，按标签筛选客户。
    acceptance_criteria:
      - "客户列表：分页展示、搜索（姓名/手机/公司）、按标签筛选"
      - "客户新增：姓名、手机、公司、来源、初始标签"
      - "客户详情：基本信息 + 已有标签 + 沟通记录入口 + 跟进记录入口"
      - "标签管理：系统预置标签 + 自定义标签，支持按标签筛选客户"
    deliverables:
      - "客户列表页 + 客户详情页"
      - "客户新增/编辑弹窗"
      - "标签选择器组件（通用，后续复用）"
      - "Store: useCustomerStore"

  # ---- 沟通能力层 ----
  - id: "PBL-004"
    title: "统一沟通入口 + 沟通记录"
    priority: "P0"
    sprint: "Sprint 2"
    system: "租户后台"
    terminals: ["PC"]
    version_required: "全版本"
    story: >
      作为销售人员，我需要一个统一的沟通入口，
      不管客户从企微找我、还是我打电话给客户、还是发短信/邮件，
      都在同一个地方开展沟通，所有沟通记录自动归档。
    acceptance_criteria:
      - "沟通入口：从客户详情一键发起沟通（企微聊天/电话/短信/邮件）"
      - "企微聊天窗口：消息发送/接收、历史消息加载、客户画像侧边栏"
      - "电话拨打：点击客户手机号 → 调起通话 → 通话结束后自动记录"
      - "沟通记录列表：所有沟通记录按时间排列，支持按类型/客户筛选"
      - "沟通记录详情：沟通方式、时长、参与人、快速摘要"
    deliverables:
      - "沟通入口页（统一沟通面板）"
      - "企微聊天窗口组件"
      - "通话记录组件"
      - "沟通记录列表页 + 详情页"
      - "Store: useCommunicationStore"

  # ---- AI辅助（核心差异化）----
  - id: "PBL-005"
    title: "沟通中AI辅助 — 话术推荐"
    priority: "P0"
    sprint: "Sprint 3"
    system: "租户后台"
    terminals: ["PC"]
    version_required: "专业版+"
    story: >
      作为销售人员，我在和客户聊天时经常不知道该怎么回复，
      特别是面对客户异议（太贵了/再考虑/别家更便宜）时。
      我需要AI根据当前对话上下文和客户画像，实时推荐最佳回复话术。
    acceptance_criteria:
      - "在企微聊天窗口右侧显示「AI话术推荐」面板"
      - "根据最近10条对话上下文，实时推荐1-3条话术"
      - "每条话术显示推荐理由（如：客户在比价→推荐竞品对比话术）"
      - "点击话术自动填入输入框，可编辑后发送"
      - "记录话术采纳率（采纳次数/推荐次数）"
    deliverables:
      - "话术推荐面板组件"
      - "Coze Agent: ScriptRecommender（话术推荐子Agent）"
      - "话术库管理页（预置话术 + 自定义话术）"
      - "话术采纳统计"

  - id: "PBL-006"
    title: "沟通中AI辅助 — 情绪监控"
    priority: "P0"
    sprint: "Sprint 3"
    system: "租户后台"
    terminals: ["PC"]
    version_required: "专业版+"
    story: >
      作为销售人员和主管，我需要知道客户当前的情绪状态。
      客户不高兴了我却不知道，等发现时已经流失。
      我需要AI实时分析客户消息的情绪，负面情绪立即告警。
    acceptance_criteria:
      - "聊天/通话中实时显示「情绪指示器」（正面/中性/负面）"
      - "情绪曲线：显示本次沟通的情绪波动趋势"
      - "负面情绪告警：客户连续3句负面 → 弹窗提醒 + 推荐安抚话术"
      - "主管视角：团队沟通中的负面情绪实时看板"
      - "历史情绪分析：客户历次沟通情绪变化趋势"
    deliverables:
      - "情绪指示器组件 + 情绪曲线组件"
      - "负面告警弹窗组件"
      - "Coze Agent: EmotionMonitor（情绪监控子Agent）"
      - "主管情绪看板页"
      - "Store: useEmotionStore"

  - id: "PBL-007"
    title: "沟通中AI辅助 — 商品推荐 + 意图识别"
    priority: "P0"
    sprint: "Sprint 3"
    system: "租户后台"
    terminals: ["PC"]
    version_required: "专业版+"
    story: >
      作为销售人员，我需要知道客户到底想不想买、想买什么。
      我需要AI识别客户的交易意向（想买/比价/顾虑/不感兴趣），
      根据意向和客户画像自动推荐最可能成交的商品。
    acceptance_criteria:
      - "意图识别：实时分析客户消息，标注交易意向类型（高意向/比价/顾虑/否定/投诉）"
      - "商品推荐：根据意向+画像+历史购买，推荐1-5个商品卡片"
      - "商品卡片：包含商品名、价格、推荐理由、一键发送按钮"
      - "点击一键发送 → 商品卡片以消息形式发送给客户"
      - "客户意图仪表盘：当前沟通的意图变化曲线"
      - "历史意图分析：这个客户历次沟通的意图演变"
    deliverables:
      - "意图识别面板组件"
      - "商品推荐面板组件 + 商品卡片组件"
      - "Coze Agent: IntentRecognizer（意图识别子Agent）"
      - "Coze Agent: ProductRecommender（商品推荐子Agent）"
      - "商品库管理页（商品信息维护）"
      - "Store: useIntentStore + useProductStore"

  # ---- 沟通后处理层 ----
  - id: "PBL-008"
    title: "沟通后AI处理 — 总结+质检+画像更新+跟进生成"
    priority: "P0"
    sprint: "Sprint 4"
    system: "租户后台"
    terminals: ["PC"]
    version_required: "专业版+"
    story: >
      每次和客户聊完，我都需要手动写总结、打标签、安排下次跟进。
      这些事情繁琐又容易忘。我需要AI在沟通结束后自动完成：
      ①生成沟通摘要（聊了什么、决定了什么、客户什么态度）
      ②评价沟通质量（哪里做得好、哪里可以改进）
      ③从对话中提取标签丰富客户画像
      ④识别跟进意图，自动生成待办任务
    acceptance_criteria:
      # 自动总结
      - "沟通结束后，自动生成「AI沟通总结」卡片"
      - "总结包含：对话摘要、关键决策点、客户情绪总结、下一步建议"
      - "总结质量评价：做得好√、可改进△、建议话术"
      # 自动质检
      - "AI质检评分：基于沟通规范（开场白/需求挖掘/异议处理/促成/结束语）打分"
      - "不合格沟通标记 → 主管复审"
      # 画像更新
      - "从对话中自动提取标签（如：客户提到'想给父母买'→标签'孝心购买'）"
      - "已有标签置信度调整（如：客户再次表达价格敏感→标签权重↑）"
      - "画像更新预览：展示AI建议新增/修改的标签，人工确认或修改"
      # 跟进生成
      - "识别客户意图→自动生成跟进任务"
      - "跟进任务包含：跟进类型（电话/企微/拜访）、建议时间、建议话术、优先级"
      - "跟进任务自动排入待办列表和跟进日历"
    deliverables:
      - "沟通总结卡片组件"
      - "质检评分面板组件"
      - "画像更新预览组件"
      - "跟进任务生成规则配置（Coze 规划Agent）"
      - "Coze Agent: Summarizer（总结）+ Inspector（质检）+ Profiler（画像）+ Planner（跟进）"
      - "Store: useSummaryStore + useQualityStore"

  # =============================================================================
  # P1 — MVP后快速补齐（增强闭环）
  # =============================================================================

  - id: "PBL-009"
    title: "跟进管理 — 待办任务 + 跟进日历"
    priority: "P1"
    sprint: "Sprint 4"
    system: "租户后台"
    terminals: ["PC"]
    version_required: "全版本"
    story: >
      我需要一个集中的待办和日历视图来管理所有跟进任务。
      不管是从AI自动生成的、还是手动创建的、还是SOP触发的，
      都在同一个地方查看、排序、执行、完成。
    acceptance_criteria:
      - "统一待办中心：聚合所有来源的待办（AI生成/手动创建/SOP触发）"
      - "待办去重合并：同一客户同一类型的待办智能合并"
      - "优先级排序：紧急程度×客户价值×距今时间自动排序"
      - "跟进日历视图：周/月视图，拖拽调整时间"
      - "待办执行：点击执行 → 跳转沟通/填写跟进记录 → 完成"
    deliverables:
      - "待办列表页 + 日历视图页"
      - "待办去重合并算法（todoEngine）"
      - "日历拖拽组件"
      - "跟进记录表单组件"
      - "Store: useTodoStore + useCalendarStore"

  - id: "PBL-010"
    title: "SAAS商业引擎 — 租户管理 + 版本定价 + 订阅"
    priority: "P1"
    sprint: "Sprint 5"
    system: "运营后台"
    terminals: ["PC"]
    version_required: "运营后台"
    story: >
      作为平台运营方，我需要管理租户的全生命周期（注册→试用→付费→续费→到期），
      配置版本和定价策略，处理订阅订单和退款。
    acceptance_criteria:
      # 租户管理
      - "租户列表：搜索、状态筛选、健康度评分"
      - "租户详情：基本信息、当前版本、订阅历史、用量统计、操作日志"
      - "租户状态流转：PENDING→TRIAL→ACTIVE→GRACE→SUSPENDED→CLOSED"
      # 版本定价
      - "版本矩阵配置：体验版/基础版/专业版/企业版的功能对比"
      - "定价配置：月付/年付价格、资源包叠加价格"
      - "促销管理：优惠码生成、限时折扣"
      # 订阅
      - "订单管理：订单列表、详情、退款审批（三阶梯退款规则）"
      - "发票管理：开票申请、发票列表"
    deliverables:
      - "运营工作台页"
      - "租户管理CRUD页 + 状态机流转"
      - "版本定价配置页"
      - "订阅订单管理页 + 退款审批页"
      - "Store: useTenantStore + useSubscriptionStore + usePricingStore"

  - id: "PBL-011"
    title: "客户360视图 + 分群管理"
    priority: "P1"
    sprint: "Sprint 4"
    system: "租户后台"
    terminals: ["PC"]
    version_required: "基础版+"
    story: >
      作为销售人员，我需要一个客户360视图，把一个客户的所有信息
      （基本信息、标签画像、沟通记录、订单记录、跟进记录、情绪趋势）
      集中在一个页面展示，快速了解客户全貌。
      作为管理者，我需要按标签/行为/价值对客户分群，进行差异化运营。
    acceptance_criteria:
      - "客户360视图：7个信息面板（基本信息/标签画像/沟通历史/订单/跟进/情绪/意向演变）"
      - "AI客户画像摘要：一段话描述客户特征、偏好、价值、风险"
      - "分群管理：按标签组合/最近沟通时间/消费金额/意向等级创建分群"
      - "分群客户列表：导出、批量操作（群发消息/批量打标）"
    deliverables:
      - "客户360视图页（核心高价值页面）"
      - "分群管理页（创建/编辑/查看分群）"
      - "AI画像摘要组件"
      - "Store: useCustomerProfileStore + useSegmentStore"

  - id: "PBL-012"
    title: "数据看板 — 沟通分析 + 转化漏斗 + 员工绩效"
    priority: "P1"
    sprint: "Sprint 5"
    system: "租户后台"
    terminals: ["PC"]
    version_required: "基础版+"
    story: >
      作为管理者，我需要数据看板了解团队沟通效果和转化情况。
      ①沟通分析：沟通量、AI辅助使用率、话术采纳率、情绪分布
      ②转化漏斗：客户→沟通→意向→成交 各阶段转化率
      ③员工绩效：每个员工的沟通数、质检分、成交率、客户满意度
    acceptance_criteria:
      - "沟通分析看板：沟通总量、按类型分布、AI辅助覆盖率、话术采纳率趋势"
      - "情绪分析：全局情绪分布、负面情绪客户Top10、情绪改善率"
      - "转化漏斗：从新增客户到成交的完整漏斗（可配置阶段）"
      - "员工绩效排行：沟通量/质检分/成交率/满意度 四维排名"
      - "数据支持导出Excel"
    deliverables:
      - "数据看板页（含多个图表区）"
      - "转化漏斗图组件"
      - "员工绩效表组件"
      - "Store: useAnalyticsStore"

  # =============================================================================
  # P2 — 增强与规模化
  # =============================================================================

  - id: "PBL-013"
    title: "AI用量管理 + 营收分析"
    priority: "P2"
    sprint: "Sprint 6"
    system: "运营后台"
    terminals: ["PC"]
    version_required: "运营后台"
    story: >
      作为平台运营方，我需要精确统计每个租户的AI用量（Token/调用次数），
      按量计费，同时看到整体营收情况（MRR/ARR/续费率/LTV/CAC）。
    acceptance_criteria:
      - "AI用量看板：按租户/按子Agent维度的调用量+Token消耗统计"
      - "AI计费明细：每个租户的AI费用，与订阅账单合并或分开"
      - "营收看板：MRR趋势、新签/续费/流失/升级 四象限"
      - "续费率监控：到期预警、续费率趋势、流失原因分析"
    deliverables:
      - "AI用量统计页"
      - "营收分析看板页"
      - "Store: useAIUsageStore + useRevenueStore"

  - id: "PBL-014"
    title: "权限管理 + 移动H5核心功能"
    priority: "P2"
    sprint: "Sprint 6"
    system: "租户后台"
    terminals: ["PC", "Mobile H5"]
    version_required: "基础版+"
    story: >
      作为企业管理者，我需要精细化的权限控制（谁能看哪些客户数据、
      谁能用哪些功能），确保数据安全。
      同时，销售外勤时需要在手机上查看客户、处理待办、回复消息。
    acceptance_criteria:
      # 权限
      - "RBAC：管理员/主管/坐席 三预设角色 + 自定义角色"
      - "数据域权限：坐席只能看自己负责的客户，主管看团队，管理员看全部"
      - "字段级权限：敏感字段（手机号/成交金额）可配置可见性"
      # 移动H5
      - "移动端工作台：适配手机屏幕的待办+消息+快捷入口"
      - "移动端客户列表+详情：核心字段展示，支持拨打电话"
      - "移动端待办：查看/处理/完成待办任务"
    deliverables:
      - "权限管理页（角色配置 + 数据域配置）"
      - "移动端适配组件（工作台/客户/待办）"
      - "Store: useAuthStore + usePermissionStore"

