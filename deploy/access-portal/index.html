<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高保真仿真门户网站</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --primary-dark: #4338ca;
      --success: #059669;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 24px rgba(0,0,0,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
      color: white;
      padding: 48px 48px 40px;
      position: relative;
      overflow: hidden;
    }
    .header::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    .header-content {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
    }
    .header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 6px;
    }
    .header .subtitle {
      font-size: 15px;
      color: #94a3b8;
      font-weight: 400;
    }
    .header-stats {
      display: flex;
      gap: 32px;
      margin-top: 24px;
    }
    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .stat-value {
      font-size: 36px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-size: 13px;
      color: #94a3b8;
    }

    /* ── Container ── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 48px;
    }

    /* ── Member Section ── */
    .member-section {
      margin-bottom: 44px;
    }
    .member-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--border);
    }
    .member-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
    }
    .member-info {
      display: flex;
      flex-direction: column;
    }
    .member-name {
      font-size: 18px;
      font-weight: 700;
    }
    .member-role {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 1px;
    }
    .member-role .role-tag {
      display: inline-block;
      padding: 1px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary);
    }
    .member-role .role-tag.admin {
      background: #fef3c7;
      color: #d97706;
    }

    /* ── Project Grid ── */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }
    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px 18px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
      cursor: default;
    }
    .project-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: #c7d2fe;
    }
    .project-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .project-name {
      font-size: 17px;
      font-weight: 700;
    }
    .project-badge {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 100px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .badge-react { background: #dbeafe; color: #2563eb; }
    .badge-vue   { background: #d1fae5; color: #059669; }
    .badge-static { background: #f3e8ff; color: #7c3aed; }
    .project-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .project-meta {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .meta-item { display: flex; align-items: center; gap: 4px; }

    /* ── Version Links ── */
    .version-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .version-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: #f9fafb;
      text-decoration: none;
      color: var(--text);
      font-size: 14px;
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .version-link:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
    .version-link:active { transform: scale(0.99); }
    .version-tag {
      font-family: "SF Mono", "Fira Code", "JetBrains Mono", monospace;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .version-tag .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-deployed { background: var(--success); }
    .dot-pending { background: #f59e0b; }
    .deploy-info {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .preview-icon {
      opacity: 0;
      transform: translateX(-4px);
      transition: all 0.2s;
    }
    .version-link:hover .preview-icon {
      opacity: 1;
      transform: translateX(0);
    }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 72px 20px;
      color: var(--text-secondary);
    }
    .empty-state .icon { font-size: 52px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; color: var(--text); margin-bottom: 6px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 28px;
      font-size: 12px;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      margin-top: 20px;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .header { padding: 32px 24px 28px; }
      .container { padding: 24px 20px; }
      .project-grid { grid-template-columns: 1fr; }
      .header h1 { font-size: 24px; }
      .header-stats { gap: 20px; }
      .stat-value { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <h1>高保真仿真门户网站</h1>
      <p class="subtitle">多成员 · 多项目 · 多版本 — 一站式高保真原型预览与访问入口</p>
      <div class="header-stats"></div>
    </div>
  </div>

  <div class="container" id="app"></div>
  <div class="footer">
    Powered by EdgeOne Pages · 部署时间：<span id="deploy-timestamp">--</span>
  </div>

  <script>
    (function() {
      // ═══════════════════════════════════════
      // 部署数据（由 deploy-manager 在部署时自动生成）
      // 也可在此手动维护
      // ═══════════════════════════════════════
      var DEPLOY_DATA = {
        base_domain: window.location.hostname,
        members: [
          {
            id: "jojo",
            name: "Jojo",
            role: "admin",
            projects: [
              {
                name: "AI-SCRM 智能SCRM平台",
                slug: "AI-SCRM",
                framework: "react",
                desc: "双系统运营后台 + 租户中控 + AI沟通辅助闭环",
                systems: 2, terminals: 2,
                versions: [
                  /**
                   * NOTE: 
                   * 路径格式：
                   *   ./{member}/{project}/{version}/index.html
                   * 
                   * 部署时将项目 dist/ 复制到 deploy/artifacts/{member}/{project}/{version}/
                   * 门户页面部署到 deploy/artifacts/index.html
                   */
                  { 
                    version: "v1.0.0", 
                    timestamp: "2026-07-21", 
                    url: "./jojo/AI-SCRM/v1.0.0/index.html",
                    status: "deployed"
                  }
                ]
              },
              {
                name: "SAAS 直播内容审查系统",
                slug: "SAAS",
                framework: "vue",
                desc: "直播实时擦音/静音 + 回放效果模拟 + 三终端",
                systems: 3, terminals: 3,
                versions: [
                  { 
                    version: "v1.0.0", 
                    timestamp: "2026-07-27", 
                    url: "./jojo/SAAS/v1.0.0/index.html",
                    status: "deployed"
                  }
                ]
              },
              {
                name: "糖尿病智慧健康平台",
                slug: "糖尿病智慧健康平台",
                framework: "vue",
                desc: "糖尿病管理 · 健康监测 · 智能干预",
                systems: 1, terminals: 2,
                versions: [
                  { 
                    version: "v1.0.0", 
                    timestamp: "2026-07-27", 
                    url: "./jojo/糖尿病智慧健康平台/v1.0.0/index.html",
                    status: "deployed"
                  }
                ]
              }
            ]
          },
          {
            id: "Eltonliz",
            name: "李政",
            role: "member",
            projects: [
              {
                name: "AI-SCRM 智能SCRM平台",
                slug: "AI-SCRM",
                framework: "react",
                desc: "双系统运营后台 + 租户中控 + AI沟通辅助闭环",
                systems: 2, terminals: 2,
                versions: [
                  { 
                    version: "v1.0.0", 
                    timestamp: "2026-07-21", 
                    url: "./Eltonliz/AI-SCRM/v1.0.0/index.html",
                    status: "deployed"
                  }
                ]
              },
              {
                name: "SAAS 直播内容审查系统",
                slug: "SAAS",
                framework: "vue",
                desc: "直播实时擦音/静音 + 回放效果模拟 + 三终端",
                systems: 3, terminals: 3,
                versions: [
                  { 
                    version: "v1.0.0", 
                    timestamp: "2026-07-27", 
                    url: "./Eltonliz/SAAS/v1.0.0/index.html",
                    status: "deployed"
                  }
                ]
              }
            ]
          }
        ]
      };

      // ═══════════════════════════════════════
      // 渲染
      // ═══════════════════════════════════════
      var container = document.getElementById('app');
      var timestampEl = document.getElementById('deploy-timestamp');
      var statsEl = document.querySelector('.header-stats');

      var data = DEPLOY_DATA;
      var totalMembers = data.members.length;
      var totalProjects = 0;
      var totalVersions = 0;
      var projectSet = {};
      data.members.forEach(function(m) {
        m.projects.forEach(function(p) {
          projectSet[p.slug] = true;
          totalVersions += p.versions.length;
        });
      });
      totalProjects = Object.keys(projectSet).length;

      // 头部统计
      statsEl.innerHTML =
        '<div class="stat-item"><span class="stat-value">' + totalMembers + '</span><span class="stat-label">位成员</span></div>' +
        '<div class="stat-item"><span class="stat-value">' + totalProjects + '</span><span class="stat-label">个项目</span></div>' +
        '<div class="stat-item"><span class="stat-value">' + totalVersions + '</span><span class="stat-label">个版本</span></div>';

      if (!data.members || data.members.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h3>暂无部署内容</h3><p>成员提交部署后将自动出现在这里</p></div>';
        timestampEl.textContent = '--';
        return;
      }

      var html = '';
      data.members.forEach(function(member) {
        html += '<div class="member-section">';
        html += '<div class="member-header">';
        html += '<div class="member-avatar">' + (member.name || member.id).charAt(0).toUpperCase() + '</div>';
        html += '<div class="member-info">';
        html += '<span class="member-name">' + e(member.name || member.id) + '</span>';
        html += '<span class="member-role"><span class="role-tag' + (member.role === 'admin' ? ' admin' : '') + '">' + (member.role === 'admin' ? '管理员' : '成员') + '</span></span>';
        html += '</div></div>';

        html += '<div class="project-grid">';
        member.projects.forEach(function(project) {
          var badgeClass = project.framework === 'vue' ? 'badge-vue' : (project.framework === 'react' ? 'badge-react' : 'badge-static');
          var badgeText = project.framework === 'vue' ? 'Vue' : (project.framework === 'react' ? 'React' : 'Static');

          html += '<div class="project-card">';
          html += '<div class="project-card-header">';
          html += '<span class="project-name">' + e(project.name) + '</span>';
          html += '<span class="project-badge ' + badgeClass + '">' + badgeText + '</span>';
          html += '</div>';
          html += '<div class="project-desc">' + e(project.desc) + '</div>';
          html += '<div class="project-meta">';
          html += '<span class="meta-item">系统 ×' + project.systems + '</span>';
          html += '<span class="meta-item">终端 ×' + project.terminals + '</span>';
          html += '<span class="meta-item">' + project.versions.length + ' 个版本</span>';
          html += '</div>';

          html += '<div class="version-list">';
          project.versions.forEach(function(v) {
            var statusDot = v.status === 'deployed' ? 'dot-deployed' : 'dot-pending';
            html += '<a class="version-link" href="' + v.url + '" target="_blank" rel="noopener">';
            html += '<span class="version-tag"><span class="dot ' + statusDot + '"></span>' + e(v.version) + '</span>';
            html += '<span class="deploy-info">';
            html += '<span class="preview-icon">→</span>';
            html += '<span>预览原型</span>';
            html += '</span>';
            html += '</a>';
          });
          html += '</div>';

          html += '</div>';
        });
        html += '</div></div>';
      });

      container.innerHTML = html;
      timestampEl.textContent = new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
    })();

    function e(str) {
      var s = String(str);
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
