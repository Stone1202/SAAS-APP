<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <script>
    (function () {
      var path = window.location.pathname;
      // 匹配多项目 SPA 路径: /{member}/{project}/{version}/...
      var match = path.match(/^\/([^/]+)\/([^/]+)\/(v[^/]+)\//);
      if (match) {
        var base = '/' + match[1] + '/' + match[2] + '/' + match[3] + '/';
        fetch(base + 'index.html', { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('SPA index not found');
            return res.text();
          })
          .then(function (html) {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(function () {
            document.body.innerHTML = '<h1>404 - Page Not Found</h1>';
          });
      } else {
        document.addEventListener('DOMContentLoaded', function () {
          document.body.innerHTML = '<h1>404 - Page Not Found</h1>';
        });
      }
    })();
  </script>
</head>
<body>
  <p>Loading SPA...</p>
</body>
</html>
