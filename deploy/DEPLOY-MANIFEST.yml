# ============================================
# DEPLOY-MANIFEST.yml — 部署清单（新版：非平台锁定）
# ============================================
# 版本：V2.0.0
# 变更：域名迁移至自定义域名 + 主题路由 + 多成员多项目聚合部署
# 域名：prototype.jycao.cn
# ============================================

workspace:
  name: AI-SCRM
  workspace_url: "https://prototype.jycao.cn"

deploy_provider:
  type: edgeone_pages           # 可替换为其他平台
  edgeone_project_id: "pages-ai-scrm"
  edgeone_project_name: "ai-scrm-pages"
  edgeone_console_url: "https://console.tencentcloud.com/edgeone/pages"

# ---------- 部署路由规范 ----------
routing:
  base_domain: "prototype.jycao.cn"
  pattern: "/{member}/{project}/{topic}/{version}/"
  root_portal: "/"              # 门户首页在根路径

